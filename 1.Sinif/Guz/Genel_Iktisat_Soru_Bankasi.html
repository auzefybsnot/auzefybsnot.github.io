<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUZEF GENEL İKTİSAD</title>
    <style>
        :root { 
            --p: #1a2b4c; --s: #2c3e50; --a: #f39c12; --suc: #27ae60; 
            --bg: #f4f6f8; --c: #ffffff; --t: #2d3436; --b: #dfe6e9; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        
        .sticky-top {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 1000;
            padding-top: 15px;
            padding-bottom: 15px;
        }

        .header { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--a); margin-bottom: 15px; }
        .header h1 { margin: 5px 0; font-size: 1.5em; }
        .header p { margin: 0; font-size: 0.9em; }
        
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: var(--bg); padding: 5px; border-radius: 10px; }
        
        .btn { background: #ecf0f1; color: var(--p); border: 2px solid var(--b); padding: 8px 12px; font-size: 0.95em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; box-sizing: border-box; }
        .btn:hover { background: #bdc3c7; }
        .btn.active { background: var(--a); color: white; border-color: var(--a); }
        .btn-g { background: #d35400; color: white; }
        
        .card { background: var(--c); border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--p); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .tag-u { background: #3498db; } .tag-e { background: var(--p); } .tag-h { background: #e74c3c; }
        .q-text { font-size: 1.1em; font-weight: bold; color: var(--p); margin-bottom: 15px; }
        .opt { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .opt li { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--b); margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .opt li:hover { background: #eafaf1; border-color: var(--suc); }
        .ans-btn { background: var(--s); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .ans-box { display: none; margin-top: 15px; padding: 15px; background: #eafaf1; border-left: 4px solid var(--suc); border-radius: 6px; }
        .ans-true { color: var(--suc); font-weight: bold; margin-bottom: 5px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .sticky-top { position: relative; padding-top: 5px; padding-bottom: 5px; }
            .header { padding: 10px; margin-bottom: 10px; }
            .header h1 { font-size: 1.2em; }
            .header p { font-size: 0.8em; } 
            .controls { gap: 6px; padding: 0; }
            .btn { padding: 10px; font-size: 0.85em; width: 100%; margin: 0; }
            #kategori-secici, #arama { width: 100%; min-width: 100%; }
            .card { padding: 15px; }
            .q-text { font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="sticky-top">
        <div class="header">
            <h1>AUZEF GENEL İKTİSAD</h1>
            <p>YBS OZEL (TUM SORULAR)</p>
        </div>

        <div class="controls">
            <button class="btn btn-g" onclick="toggleAll()">👁️ Tüm Cevapları Aç/Kapat</button>

            <select class="btn" id="kategori-secici" onchange="filter(this.value)" style="background: var(--p); color: white; min-width: 180px; text-align: center; font-weight:bold; padding:8px; border-radius:6px; cursor:pointer;">
                <option value="all">📚 Tüm Havuz (Hepsi)</option>
                <optgroup label="Sınavlar">
                     <option value="vize">📅 Vizeler (Tümü)</option>
                     <option value="final">📅 Finaller (Tümü)</option>
                     <option value="büt">📅 Bütünlemeler</option>
                     
                </optgroup>
            </select>

            <button class="btn" style="background: #e74c3c; color:white;" onclick="document.getElementById('kategori-secici').value='b'; filter('b')">🔥 Banko Sorular</button>

            <input type="text" id="arama" class="btn" placeholder="🔍 Soru veya cevapta kelime ara..." onkeyup="aramaYap()" style="background: white; color: black; cursor: text; text-align: left; min-width: 250px;">
        </div>
    </div>
    
    <div id="q-container"></div>

</div>

<script>
const rawData = [

`2022 Vize|1. Eş maliyet doğrusu hangi durumu belirtmektedir?|A) Üretim maliyetini~B) Sermaye maliyetini~C) İşçi maliyetini~D) Faktör bileşiminin maliyetini~E) Faktör tercihini|D) Faktör bileşiminin maliyetini|💡 Açıklama: Eş maliyet doğrusu, üreticinin belirli bir bütçe ile satın alabileceği ve aynı toplam maliyeti veren çeşitli faktör (girdi) bileşimlerini gösterir.`,

`2022 Vize|2. Arz-talep eğrileri analizinde talep eğrisi altında ve denge fiyatı üzerinde kalan alan aşağıdakilerden hangisini gösterir?|A) Fayda maksimizasyonu~B) Toplam rant~C) Tüketici rantı~D) Üretici rantı~E) Kâr maksimizasyonu|C) Tüketici rantı|💡 Açıklama: Tüketicinin bir mal için ödemeye razı olduğu en yüksek fiyat ile fiilen ödediği piyasa fiyatı (denge fiyatı) arasındaki fark tüketici rantıdır.`,

`2022 Vize|3. Malların fiyatının düşmesi bütçe doğrusunu nasıl etkiler?|A) Etkilemez~B) Eğimini değiştirmez~C) Eğimini değiştirir~D) Paralel sağa kaydırır~E) Paralel sola kaydırır|D) Paralel sağa kaydırır|💡 Açıklama: Tüketicinin geliri sabitken tüm malların fiyatları aynı oranda düşerse, satın alma gücü artar ve bütçe doğrusu eğimi değişmeden paralel olarak sağa kayar.`,

`2022 Vize|4. Aşağıdakilerden hangisi uzun dönemde firma içi maliyetlerin yükselmesine neden olmaktadır?|A) İçsel ekonomiler~B) Alan ekonomileri~C) İçsel eksi ekonomiler~D) Dışsal ekonomiler~E) Dışsal eksi ekonomiler|C) İçsel eksi ekonomiler|💡 Açıklama: Bir firmanın üretim ölçeğini büyütmesi sonucunda, yönetim ve organizasyon zorlukları gibi nedenlerle maliyetlerin artmasına içsel eksi (negatif) ekonomiler denir.`,

`2022 Vize|5. Aşağıdakilerden hangisi eş ürün eğrisinin özelliklerinden değildir?|A) Eğri üzerindeki her nokta farklı üretim düzeyini gösterir~B) Paralel eğrilerdir~C) Marjinal teknik ikame özelliğini taşır~D) Birbirlerini kesmezler~E) Dışbükeydir|A) Eğri üzerindeki her nokta farklı üretim düzeyini gösterir|💡 Açıklama: Eş ürün eğrisi üzerindeki her nokta FARKLI değil, AYNI üretim düzeyini temsil eder.`,

`2022 Vize|6. Aşağıdakilerden hangisi arz eğrisinin yer değiştirmesine etki eden faktörlerden biri değildir?|A) Geleceğe yönelik beklentiler~B) Mal fiyatı~C) Teknoloji~D) Maliyetler~E) Diğer mal fiyatı|B) Mal fiyatı|💡 Açıklama: Malın kendi fiyatındaki değişimler eğriyi sağa veya sola kaydırmaz; eğri üzerinde bir noktadan diğerine harekete neden olur.`,

`2022 Vize|7. Her toplumun belirli bir düzeyde karşı karşıya olduğu ve iktisadın temel uğraş alanı olan sorun aşağıdakilerden hangisidir?|A) Fayda~B) Enflasyon~C) Kıtlık~D) Para~E) Fiyat|C) Kıtlık|💡 Açıklama: İhtiyaçların sonsuz, kaynakların ise sınırlı olması durumuna kıtlık denir ve iktisadın temel çıkış noktasıdır.`,

`2022 Vize|8. İhtiyaçları tatmine yarayan unsurlara verilen ad aşağıdakilerden hangisidir?|A) Emek~B) Mal~C) Faktör~D) Doğal kaynak~E) Sermaye|B) Mal|💡 Açıklama: İnsan ihtiyaçlarını doğrudan veya dolaylı olarak karşılama özelliğine sahip olan fiziksel varlıklara mal denir.`,

`2022 Vize|9. Arz ve talep aynı oranda artarsa aşağıdaki durumlardan hangisi ortaya çıkar?|A) Denge fiyatı değişmez~B) Denge fiyatı düşer~C) Denge fiyatı yükselir~D) Denge fiyatı sabit kalır~E) Denge miktarı azalır|A) Denge fiyatı değişmez|💡 Açıklama: Hem arz hem de talep tam olarak aynı oranda sağa kayarsa, denge miktarı artarken denge fiyatı başlangıç seviyesinde sabit kalır (değişmez).`,

`2022 Vize|10. Bir malın fiyatı arttıkça arz edilen miktarın artmasına, fiyat azalınca arz edilen miktarın azalmasına verilen ad aşağıdakilerden hangisidir?|A) Üretim esnekliği~B) Arz kanunu~C) Marjinal üretim~D) Fiyat kanunu~E) Arz esnekliği|B) Arz kanunu|💡 Açıklama: Fiyat ile arz edilen miktar arasındaki bu doğru orantılı ilişki "Arz Kanunu" olarak adlandırılır.`,

`2022 Vize|11. İktisadi faaliyetlerde insan ihtiyaçlarını giderme amacına yönelik olarak mal ve hizmet üretilmesine verilen ad aşağıdakilerden hangisidir?|A) Esneklik~B) Arz~C) Fayda~D) Talep~E) Tüketim|B) Arz|💡 Açıklama: Üretilen mal ve hizmetlerin tüketici ihtiyaçlarını gidermek üzere piyasaya sunulmasına genel bağlamda arz denmektedir.`,

`2022 Vize|12. Teorik olarak faydanın ölçülebileceğini varsayan fayda görüşü aşağıdakilerden hangisidir?|A) Toplam fayda~B) Azalan fayda~C) Marjinal fayda~D) Kardinal fayda~E) Ordinal fayda|D) Kardinal fayda|💡 Açıklama: Faydanın "util" adı verilen birimlerle sayısal olarak ölçülebileceğini savunan yaklaşıma Kardinal (sayısal) fayda teorisi denir.`,

`2022 Vize|13. Bir malın talep edilen miktarının, bu malın fiyatı karşısındaki duyarlılığının ölçüsüne verilen ad aşağıdakilerden hangisidir?|A) Çapraz talep esnekliği~B) Talebin tercih esnekliği~C) Talebin ikame esnekliği~D) Talebin fiyat esnekliği~E) Talebin gelir esnekliği|D) Talebin fiyat esnekliği|💡 Açıklama: Fiyattaki %1'lik bir değişimin, talep edilen miktarda yarattığı yüzdesel değişime talebin fiyat esnekliği denir.`,

`2022 Vize|14. Üretim miktarına bağlı olmayan maliyetler aşağıdakilerden hangisi ile adlandırılır?|A) Toplam maliyet~B) Marjinal maliyet~C) Değişir maliyet~D) Ortalama değişir maliyet~E) Sabit maliyet|E) Sabit maliyet|💡 Açıklama: Üretim sıfır olsa bile katlanılması gereken ve üretim hacmine göre değişmeyen maliyetlere sabit maliyetler (kira vb.) denir.`,

`2022 Vize|15. Aşağıdakilerden hangisi, bir birim daha mal tüketimi sonucu, toplam faydada yaratılan değişikliğe verilen isimdir?|A) Kardinal fayda~B) Toplam fayda~C) Ordinal fayda~D) Azalan fayda~E) Marjinal fayda|E) Marjinal fayda|💡 Açıklama: Tüketilen son birimin toplam faydaya yaptığı ilave katkıya marjinal (ek) fayda adı verilir.`,

`2022 Vize|16. Tatmin edildiğinde haz ve doyum, tatmin edilmediğinde ise acı ve üzüntü veren duyguya verilen ad aşağıdakilerden hangisidir?|A) İhtiyaç~B) Yarar~C) Hizmet~D) Fayda~E) Talep|A) İhtiyaç|💡 Açıklama: İktisatta karşılandığında haz, karşılanmadığında elem ve üzüntü veren duygulara ihtiyaç denir.`,

`2022 Vize|17. Aşağıdakilerden hangisi bir fayda yaratmak veya mevcut faydalara ilavelerde bulunmak amacıyla yapılan bütün faaliyetleri kapsayan kavramdır?|A) İhtiyaç~B) Tüketim~C) Üretim~D) İktisadi davranış~E) Rasyonel davranış|C) Üretim|💡 Açıklama: İnsan ihtiyaçlarını karşılamak üzere mal ve hizmetlerin miktarını ve faydasını artırmaya yönelik faaliyetlerin tümüne üretim denir.`,

`2022 Vize|18. Bir malın fiyatındaki bir değişmenin diğer malın arz miktarında meydana getirdiği değişime verilen ad aşağıdakilerden hangisidir?|A) Çapraz esneklik~B) Fiyat esnekliği~C) Gelir esnekliği~D) Nokta esnekliği~E) Yay esnekliği|A) Çapraz esneklik|💡 Açıklama: Bir malın miktarının, başka (ilişkili) bir malın fiyatındaki değişime karşı gösterdiği duyarlılık "çapraz esneklik" olarak adlandırılır.`,

`2022 Vize|19. Çapraz talep esnekliği pozitif olan mallara verilen ad aşağıdakilerden hangisidir?|A) Giffen Malı~B) Veblen Malı~C) Tamamlayıcı Mal~D) Snop Mal~E) İkame Mal|E) İkame Mal|💡 Açıklama: Çapraz esneklik pozitifse, mallar birbiri yerine kullanılabilen (ikame) mallardır (Örn: Çay fiyatı artarsa kahve talebi artar).`,

`2022 Vize|20. Aşağıdakilerden hangisi iki noktadan geçen doğrunun orta noktasının esnekliğini belirtmektedir?|A) Gelir esnekliği~B) Nokta esnekliği~C) Çapraz esneklik~D) Fiyat esnekliği~E) Yay esnekliği|E) Yay esnekliği|💡 Açıklama: Talep eğrisi üzerindeki iki nokta arasındaki kısmın (yayın) ortalama esnekliğinin hesaplanmasına yay (ark) esnekliği denir.`,

`2023-2024 Vize|1. Reel GSYİH'nın potansiyel GSYİH'nın gerisinde kalması sonucu oluşan işsizliğe ne ad verilmektedir?|A) Mevsimsel~B) Yapısal~C) Friksiyonel~D) Gizli~E) Konjonktürel|E) Konjonktürel|💡 Açıklama: Ekonomik daralma dönemlerinde üretimin düşmesiyle ortaya çıkan işsizlik türüne konjonktürel işsizlik denir.`,

`2023-2024 Vize|2. Monopolcünün belli koşullar altında malının farklı birimlerini farklı fiyattan satmasına ne ad verilmektedir?|A) Maliyet arttırılması~B) Fiyat arttırılması~C) Tüketici rantı~D) Üretici rantı~E) Fiyat farklılaştırılması|E) Fiyat farklılaştırılması|💡 Açıklama: Bir malın farklı alıcılara farklı fiyatlardan satılması işlemine fiyat farklılaştırması (ayrımcılığı) denir.`,

`2023-2024 Vize|3. Vergilerdeki bir değişimin arz eğrisi üzerindeki etkisi ne ile ifade edilir?|A) Arz kayması~B) Arz esnekliği~C) Arz kanunu~D) Arz fiyatı~E) Arz miktarı|A) Arz kayması|💡 Açıklama: Vergiler maliyetleri doğrudan etkiler. Vergilerin artması veya azalması arz eğrisinin bütünüyle yer değiştirmesine (arz kayması) neden olur.`,

`2023-2024 Vize|4. Tüketicinin geliri ile çeşitli mallardan satın alabileceği mal miktarlarının geometrik yerini tanımlayan ifade aşağıdakilerden hangisidir?|A) Eş maliyet doğrusu~B) Bütçe doğrusu~C) Gelir tüketim eğrisi~D) Eş ürün eğrisi~E) Kayıtsızlık eğrisi|E) Kayıtsızlık eğrisi|💡 Açıklama: Not: Orijinal cevap anahtarında E şıkkı verilmiştir ancak sorudaki tanım iktisadi olarak 'Bütçe doğrusu'na aittir.`,

`2023-2024 Vize|5. Aşağıdakilerden hangisi tam rekabet piyasasından söz etmek için zorunlu bir koşul değildir?|A) Alıcı satıcı sayısının çok olması~B) Kâr maksimizasyonu~C) Homojenlik~D) Şeffaflık~E) Mobilite|B) Kâr maksimizasyonu|💡 Açıklama: Tam rekabet piyasasının zorunlu varsayımları atomisite, homojenlik, mobilite ve şeffaflıktır. Kâr maksimizasyonu piyasanın yapısal bir koşulu değil, firmanın amacıdır.`,

`2023-2024 Vize|6. Aşağıdakilerden hangisi üretim miktarında meydana gelen bir değişimin toplam maliyette meydana getirdiği değişimi ifade etmektedir?|A) Marjinal maliyet~B) Değişir maliyet~C) Toplam maliyet~D) Sabit maliyet~E) Ortalama maliyet|A) Marjinal maliyet|💡 Açıklama: Üretilen son birimin (veya üretimdeki bir birimlik artışın) toplam maliyete yaptığı ek katkıya marjinal maliyet denir.`,

`2023-2024 Vize|7. Reeskont oranlarındaki düşmenin ekonomiye etkisi ne şekilde olur?|A) Ticari bankaların kredi maliyetlerini düşürür.~B) Enflasyonu düşürür.~C) Para arzı daralır.~D) Ticari bankaların kredi maliyetlerini arttır.~E) Merkez bankasının lehine olur.|A) Ticari bankaların kredi maliyetlerini düşürür.|💡 Açıklama: Merkez Bankası reeskont oranını düşürdüğünde bankaların fon bulma maliyeti azalır ve piyasaya daha ucuza kredi sunabilirler.`,

`2023-2024 Vize|8. Millî gelir kaç şekilde hesaplanmaktadır?|A) 1~B) 4~C) 2~D) 3~E) 5|D) 3|💡 Açıklama: Milli gelir temel olarak 3 farklı yöntemle hesaplanır: Üretim yöntemi, Gelir yöntemi ve Harcama yöntemi.`,

`2023-2024 Vize|9. Diğer girdiler sabitken, bir üretim faktöründen üretime katılan birimler arttırıldıkça elde edilen ek üretim miktarının azalması durumuna ne ad verilmektedir?|A) Sabit verimler kanunu~B) Azalan verimler kanunu~C) Toplam verimler kanunu~D) Sabit marjinal verimler kanunu~E) Artan toplam verimler kanunu|B) Azalan verimler kanunu|💡 Açıklama: Kısa dönemde sabit girdiler varken değişken girdinin miktarı artırıldıkça, bir noktadan sonra marjinal fiziki ürünün azalmasına azalan verimler kanunu denir.`,

`2023-2024 Vize|10. Arz (maliyet) enflasyonunun en önemli nedeni aşağıdakilerden hangisidir?|A) Enerji kıtlığı~B) İş gücü yetersizliği~C) Döviz darboğazı~D) Üretim maliyetlerindeki artış~E) Sermaye yetersizliği|D) Üretim maliyetlerindeki artış|💡 Açıklama: Arz enflasyonu (maliyet enflasyonu), firmaların kullandığı üretim faktörlerinin maliyetlerindeki artışların fiyatlar genel düzeyini yukarı çekmesiyle oluşur.`,

`2023-2024 Vize|11. Tam rekabet piyasasında firmanın kaç tür geliri vardır?|A) 2~B) 1~C) 3~D) 4~E) 5|C) 3|💡 Açıklama: Firmanın analiz edilen üç temel gelir türü vardır: Toplam Gelir (TR), Ortalama Gelir (AR) ve Marjinal Gelir (MR).`,

`2023-2024 Vize|12. Ekonomide emek-yoğun teknolojilerde görülen işsizlik türü aşağıdakilerden hangisidir?|A) Friksiyonel işsizlik~B) Yapısal işsizlik~C) İradi işsizlik~D) Gayriiradi işsizlik~E) Gizli işsizlik|E) Gizli işsizlik|💡 Açıklama: Tarım gibi emek-yoğun sektörlerde sıkça görülen, bazı çalışanlar üretimden çekilse dahi toplam üretimde bir azalmanın yaşanmadığı duruma gizli işsizlik denir.`,

`2023-2024 Vize|13. Mal ihracatında artışın sağlanması hangi koşula bağlı olmaktadır?|A) İthal mallarının iç talep esnekliği~B) İhracata hazır mal stokunun varlığı~C) Millî paranın dış değerinin yüksek olması~D) İhraç mallarının dış talep esnekliğinin düşük olması~E) Rekabet gücünün olmaması|B) İhracata hazır mal stokunun varlığı|💡 Açıklama: Bir ülkenin ihracatını artırabilmesi için öncelikle dışarıya satabileceği, üretime ve ihracata hazır yeterli mal stokuna sahip olması gerekir.`,

`2023-2024 Vize|14. Bir malın talebi sabitken arzı azalırsa aşağıdakilerden hangisi meydana gelir?|A) Denge miktarı artar, denge fiyatı sabit kalır.~B) Denge fiyatı artar, denge miktarı azalır.~C) Hem denge fiyatı hem de denge miktarı azalır.~D) Denge fiyatı azalır, denge miktarı sabit kalır.~E) Hem denge fiyatı hem de denge miktarı artar.|B) Denge fiyatı artar, denge miktarı azalır.|💡 Açıklama: Talep eğrisi sabitken arz eğrisi sola kayarsa piyasada mal kıtlaşacağı için denge fiyatı yükselir, alınıp satılan miktar ise azalır.`,

   // --- BURADAN İTİBAREN KOPYALAYIN ---
    let isAllOpen = false;
    let temizlenmisData = []; // Birleştirilmiş verileri global tutalım ki arama/filtreleme yapabilelim

    // 1. SORULARI BİRLEŞTİREN FONKSİYON
    function sorulariBirlestir(dataArray) {
        const soruMap = new Map();

        dataArray.forEach(item => {
            if (!item || item.trim() === '') return;
            
            const parts = item.split('|');
            if (parts.length < 4) return; 
            
            let tagsRaw = parts[0];
            const question = parts[1].trim(); 
            const options = parts[2];
            const correctAnswer = parts[3];
            const explanation = parts[4] ? parts[4] : '';

            let tagsList = tagsRaw.split(',').map(t => t.trim());
            let mevcutSayi = 1;

            tagsList = tagsList.filter(t => {
                const match = t.match(/(\d+)\s*Kez Çıktı/i);
                if (match) {
                    mevcutSayi = parseInt(match[1]);
                    return false; 
                }
                return true;
            });

            if (soruMap.has(question)) {
                let kayit = soruMap.get(question);
                kayit.count += mevcutSayi; 
                
                tagsList.forEach(t => {
                    if (!kayit.tags.includes(t)) {
                        kayit.tags.push(t);
                    }
                });
            } else {
                soruMap.set(question, {
                    tags: tagsList,
                    options: options,
                    correctAnswer: correctAnswer,
                    explanation: explanation,
                    count: mevcutSayi
                });
            }
        });

        const birlestirilmisData = [];
        for (let [qText, data] of soruMap.entries()) {
            let finalTags = [...data.tags];
            if (data.count > 1) {
                finalTags.push(`${data.count} Kez Çıktı!`);
            }
            
            const itemString = `${finalTags.join(',')}|${qText}|${data.options}|${data.correctAnswer}|${data.explanation}`;
            birlestirilmisData.push(itemString);
        }

        return birlestirilmisData;
    }

   // 2. EKRANA BASTIRMA FONKSİYONU (Renklendirme Geliştirilmiş Versiyon)
    function renderQuestions(data) {
        const container = document.getElementById('q-container');
        container.innerHTML = '';
        
        if(data.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Kriterlerinize uygun soru bulunamadı.</p>';
            return;
        }

        data.forEach((item, index) => {
            const parts = item.split('|');
            const tagsRaw = parts[0];
            const question = parts[1];
            const options = parts[2].split('~');
            const correctAnswer = parts[3];
            const explanation = parts[4] || '';

            const card = document.createElement('div');
            card.className = 'card';

            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'tags';
            
            tagsRaw.split(',').forEach(tag => {
                tag = tag.trim();
                if(!tag) return;
                const span = document.createElement('span');
                span.className = 'tag';
                
                let lowerTag = tag.toLowerCase();
                if(lowerTag.includes('ünite') || lowerTag.match(/^u\d+/)) {
                    span.classList.add('tag-u');
                } else if(lowerTag.includes('banko') || lowerTag.includes('kez çıktı')) {
                    span.classList.add('tag-h');
                } else {
                    span.classList.add('tag-e');
                }
                
                span.textContent = tag;
                tagsDiv.appendChild(span);
            });

            const qDiv = document.createElement('div');
            qDiv.className = 'q-text';
            qDiv.textContent = (index + 1) + ". " + question;

            const optUl = document.createElement('ul');
            optUl.className = 'opt';
            
            options.forEach(opt => {
                const li = document.createElement('li');
                li.textContent = opt;
                li.onclick = function() {
                    // Önce bu sorudaki tüm şıkları varsayılan (gri) haline getirerek sıfırla
                    Array.from(optUl.children).forEach(child => {
                        child.style.backgroundColor = '#f8f9fa';
                        child.style.borderColor = 'var(--b)';
                        child.style.color = 'var(--t)';
                        child.style.fontWeight = 'normal';
                    });
                    
                    // Cevap kontrolü
                    if(opt.trim() === correctAnswer.trim()) {
                        // DOĞRU ŞIKKA TIKLANDIYSA: Canlı Yeşil Yap
                        this.style.backgroundColor = '#d4edda';
                        this.style.borderColor = '#28a745';
                        this.style.color = '#155724';
                        this.style.fontWeight = 'bold';
                    } else {
                        // YANLIŞ ŞIKKA TIKLANDIYSA: Canlı Kırmızı Yap
                        this.style.backgroundColor = '#f8d7da';
                        this.style.borderColor = '#dc3545';
                        this.style.color = '#721c24';
                        this.style.fontWeight = 'bold';
                        
                        // KULLANICIYA YARDIM: Aynı esnada doğru olan şıkkı da otomatik yeşile boya
                        Array.from(optUl.children).forEach(child => {
                            if(child.textContent.trim() === correctAnswer.trim()) {
                                child.style.backgroundColor = '#d4edda';
                                child.style.borderColor = '#28a745';
                                child.style.color = '#155724';
                                child.style.fontWeight = 'bold';
                            }
                        });
                    }
                };
                optUl.appendChild(li);
            });

            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster';
            
            const ansBox = document.createElement('div');
            ansBox.className = 'ans-box';
            ansBox.style.display = isAllOpen ? 'block' : 'none';
            ansBox.innerHTML = `<div class="ans-true">Cevap: ${correctAnswer}</div>${explanation ? `<div><em>Açıklama:</em> ${explanation}</div>` : ''}`;

            btn.onclick = () => {
                if (ansBox.style.display === 'block') {
                    ansBox.style.display = 'none';
                    btn.textContent = 'Cevabı Göster';
                } else {
                    ansBox.style.display = 'block';
                    btn.textContent = 'Cevabı Gizle';
                }
            };

            card.appendChild(tagsDiv);
            card.appendChild(qDiv);
            card.appendChild(optUl);
            card.appendChild(btn);
            card.appendChild(ansBox);

            container.appendChild(card);
        });
    }

    // 3. BUTON VE ARAMA FONKSİYONLARI
    function toggleAll() {
        isAllOpen = !isAllOpen;
        const boxes = document.querySelectorAll('.ans-box');
        const btns = document.querySelectorAll('.ans-btn');
        boxes.forEach(box => box.style.display = isAllOpen ? 'block' : 'none');
        btns.forEach(btn => btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
    }

    function filter(val) {
        val = val.toLowerCase();
        if (val === 'all') {
            renderQuestions(temizlenmisData);
            return;
        }
        
        let filtered = [];
        if (val === 'b') {
            // Banko ve çok çıkanlar
            filtered = temizlenmisData.filter(item => {
                let lower = item.toLowerCase();
                return lower.includes('banko') || lower.includes('kez çıktı');
            });
        } else {
            // Sınavlar ve üniteler
            filtered = temizlenmisData.filter(item => {
                const tags = item.split('|')[0].toLowerCase();
                return tags.includes(val);
            });
        }
        renderQuestions(filtered);
    }

    function aramaYap() {
        const val = document.getElementById('arama').value.toLowerCase();
        const filtered = temizlenmisData.filter(item => {
            const parts = item.toLowerCase().split('|');
            const q = parts[1] || '';
            const a = parts[3] || '';
            const exp = parts[4] || '';
            return q.includes(val) || a.includes(val) || exp.includes(val);
        });
        renderQuestions(filtered);
    }

    // 4. BAŞLANGIÇ (Her şeyi tetikleyen an)
    window.onload = () => {
        temizlenmisData = sorulariBirlestir(rawData);
        renderQuestions(temizlenmisData);
    };
    // --- BURAYA KADAR KOPYALAYIN ---

</script>
</body>
</html>
