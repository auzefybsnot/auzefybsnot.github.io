<!DOCTYPE html>

<head>

    <style>
        :root { --p: #1a2b4c; --s: #2c3e50; --a: #f39c12; --suc: #27ae60; --bg: #f4f6f8; --c: #ffffff; --t: #2d3436; --b: #dfe6e9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 20px; border-radius: 10px; text-align: center; border-bottom: 5px solid var(--a); margin-bottom: 20px; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; position: sticky; top: 10px; background: var(--bg); padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 100; }
        .btn { background: #ecf0f1; color: var(--p); border: 2px solid var(--b); padding: 8px 12px; font-size: 0.95em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #bdc3c7; }
        .btn.active { background: var(--a); color: white; border-color: var(--a); }
        .btn-g { background: #d35400; color: white; }
        .card { background: var(--c); border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--p); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .tag-u { background: #3498db; } .tag-e { background: var(--p); } .tag-h { background: #e74c3c; }
        .q-text { font-size: 1.1em; font-weight: bold; color: var(--p); margin-bottom: 15px; }
        .opt { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .opt li { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--b); margin-bottom: 5px; }
        .ans-btn { background: var(--s); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .ans-box { display: none; margin-top: 15px; padding: 15px; background: #eafaf1; border-left: 4px solid var(--suc); border-radius: 6px; }
        .ans-true { color: var(--suc); font-weight: bold; margin-bottom: 5px; }
    
/* =========================================================
   CİHAZ UYARLAMA VE E-KİTAP MODU (DEVICE ADAPTIVE & E-INK)
   ========================================================= */
:root {
    --paper-bg: var(--bg, #f4f6f8);
    --card-surface: var(--card-bg, var(--c, #ffffff));
    --main-text: var(--text, var(--t, #2d3436));
    --border-color: var(--border, var(--b, #dfe6e9));
}

[data-theme="dark"] {
    --bg: #151c25 !important;
    --card-bg: #1c2530 !important;
    --c: #1c2530 !important;
    --text: #e2e8f0 !important;
    --t: #e2e8f0 !important;
    --border: #2e3a48 !important;
    --b: #2e3a48 !important;
    --primary: #8fb3e0 !important;
    --p: #8fb3e0 !important;
    --secondary: #232f42 !important;
    --s: #232f42 !important;
}

[data-theme="dark"] body {
    background-color: #151c25 !important;
    color: #e2e8f0 !important;
}

[data-theme="dark"] .container,
[data-theme="dark"] .page-wrap {
    color: #e2e8f0 !important;
}

[data-theme="dark"] .card,
[data-theme="dark"] .question-card,
[data-theme="dark"] .tips-card,
[data-theme="dark"] .view-mode-bar {
    background-color: #1c2530 !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

[data-theme="dark"] .opt li {
    background-color: #222d3a !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

[data-theme="dark"] .answer-area,
[data-theme="dark"] .ans-box {
    background-color: #172b25 !important;
    color: #e2e8f0 !important;
}

[data-theme="dark"] .header {
    background: linear-gradient(135deg, #1e293b, #0f172a) !important;
    border-bottom: 4px solid #f39c12 !important;
}

[data-theme="dark"] .btn,
[data-theme="dark"] .tab-btn {
    background-color: #222d3a !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

/* E-INK ORTAK: Animasyon, geçiş, gölge ve efektleri kapat */
[data-device^="eink-"] *,
[data-device^="eink-"] *::before,
[data-device^="eink-"] *::after {
    animation: none !important;
    transition: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    text-shadow: none !important;
}

/* 6 inç Siyah-Beyaz E-Okuyucu (Kindle, Kobo vb. E-Kitap Modu) */
[data-device="eink-6-bw"] {
    --bg: #FFFFFF !important;
    --card-bg: #FFFFFF !important;
    --c: #FFFFFF !important;
    --text: #000000 !important;
    --t: #000000 !important;
    --border: #000000 !important;
    --b: #000000 !important;
    --primary: #000000 !important;
    --p: #000000 !important;
    --secondary: #000000 !important;
    --s: #000000 !important;
}
[data-device="eink-6-bw"] body {
    background-color: #FFFFFF !important;
    color: #000000 !important;
    font-family: Georgia, 'Bookerly', 'Charis SIL', serif, system-ui !important;
    font-size: 17px !important;
    line-height: 1.6 !important;
    padding: 6px !important;
}
[data-device="eink-6-bw"] .container,
[data-device="eink-6-bw"] .page-wrap {
    max-width: 100% !important;
    padding: 0 !important;
}
[data-device="eink-6-bw"] .header {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
}
[data-device="eink-6-bw"] .card,
[data-device="eink-6-bw"] .question-card,
[data-device="eink-6-bw"] .view-mode-bar {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
    margin-bottom: 12px !important;
    padding: 12px !important;
}
[data-device="eink-6-bw"] .opt li {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 1px solid #000000 !important;
    font-size: 16px !important;
}
[data-device="eink-6-bw"] .btn,
[data-device="eink-6-bw"] button,
[data-device="eink-6-bw"] select {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
}
[data-device="eink-6-bw"] .answer-area,
[data-device="eink-6-bw"] .ans-box {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
}

/* 6 inç Renkli E-Okuyucu */
[data-device="eink-6-color"] body {
    font-size: 16.5px !important;
}
[data-device="eink-6-color"] .card,
[data-device="eink-6-color"] .btn,
[data-device="eink-6-color"] .view-mode-bar {
    border: 1.5px solid #2d3436 !important;
}

/* 10.3 inç Siyah-Beyaz Tablet (Boox, Remarkable vb.) */
[data-device="eink-10-bw"] {
    --bg: #FFFFFF !important;
    --card-bg: #FFFFFF !important;
    --text: #000000 !important;
    --border: #000000 !important;
}
[data-device="eink-10-bw"] body {
    background-color: #FFFFFF !important;
    color: #000000 !important;
    font-family: Georgia, 'Bookerly', serif, system-ui !important;
    font-size: 17.5px !important;
    line-height: 1.65 !important;
}
[data-device="eink-10-bw"] .container {
    max-width: 1100px !important;
}
[data-device="eink-10-bw"] .card,
[data-device="eink-10-bw"] .view-mode-bar {
    border: 2px solid #000000 !important;
}

/* Mobil Profil */
[data-device="mobile"] body {
    padding: 10px !important;
    font-size: 15px !important;
}
[data-device="mobile"] .header {
    padding: 15px 10px !important;
}
[data-device="mobile"] .header h1 {
    font-size: 1.4em !important;
}
[data-device="mobile"] .card {
    padding: 14px !important;
}

</style>
</head>

<div class="container">

                <option value="auto">🔄 Otomatik</option>

                <option value="eink-10-bw">📝 10.3" Tablet (S/B)</option>

    <div class="header">

        <select class="btn" id="kategori-secici" onchange="filter(this.value)" style="background: var(--p); color: white; min-width: 180px; text-align: center; font-weight:bold; padding:8px; border-radius:6px; cursor:pointer;">
            <option value="all">📚 Tüm Havuz (Hepsi)</option>

                <option value="U1">📚 Ünite 1</option>

        <button class="btn" style="background: #e74c3c; color:white;" onclick="filter('Banko')">🔥 Banko Sorular</button>

        <input type="text" id="arama" class="btn" placeholder="🔍 Kelime ara..." onkeyup="aramaYap()" style="background: white; color: black; cursor: text; text-align: left; min-width: 200px;">

<script>
const rawData = [
// --- ÜNİTE 1 ---
    "u1,Banko|Yapay zekayı 'yeni elektrik' olarak nitelendiren araştırmacı kimdir?|A) Alan Turing~B) John McCarthy~C) Andrew Ng~D) Marvin Minsky~E) Hans Moravec|C) Andrew Ng|DeepLearning.AI kurucusu Andrew Ng, yapay zekanın tüm endüstrileri elektrik gibi dönüştüreceğini belirtmiştir.",
    "u1,2024-2025 Vize,Banko|1956'da 'Yapay Zekâ' teriminin ilk kez kullanıldığı ve bilim dalı kabul edildiği konferans hangisidir?|A) Turing Zirvesi~B) Dartmouth Konferansı~C) Geneva Zirvesi~D) MIT Sempozyumu~E) Stanford Konferansı|B) Dartmouth Konferansı|John McCarthy bu konferansta alana resmi adını vermiştir.",
    "u1|'Makineler düşünebilir mi?' sorusunu ortaya atarak YZ'nin felsefi temellerini atan kişi kimdir?|A) Alan Turing~B) Elon Musk~C) Marvin Minsky~D) Norbert Wiener~E) Claude Shannon|A) Alan Turing|Alan Turing 1950'de bu soruyu sormuş ve ünlü Turing Testini geliştirmiştir.",
    "u1|1974-1980 yılları arasındaki 'İlk Yapay Zekâ Kışı'nın temel sebebi nedir?|A) Lisp pazarının çökmesi~B) Deep Blue'nun yenilmesi~C) Minsky'nin Perceptron modelinin XOR problemini çözemediğini ispatlaması~D) İnternetin çökmesi~E) Turing testinin geçilememesi|C) Minsky'nin Perceptron modelinin XOR problemini çözemediğini ispatlaması|Tek katmanlı sinir ağlarının sınırlılıklarının ispatlanması fonların kesilmesine yol açmıştır.",
    "u1,Banko|Bilgisayarların karmaşık matematikte başarılı olurken, fiziksel harekette 1 yaşındaki çocuktan kötü olmasını ifade eden kavram nedir?|A) Turing İkilemi~B) Moravec Paradoksu~C) Minsky Etkisi~D) GIGO Kuralı~E) McCarthy Teoremi|B) Moravec Paradoksu|Hans Moravec tarafından 1980'lerde ortaya atılan bu paradoks, fiziksel eylemlerin makineler için zorluğunu anlatır.",
    "u1|1987-1994 yılları arasında DARPA'nın destekleri kesmesi ve uzman sistemlerin yetersiz kalmasıyla yaşanan dönem nedir?|A) İlk YZ Kışı~B) İkinci Yapay Zekâ Kışı~C) YZ Baharı~D) Sembolik Dönem~E) Üretken YZ Dönemi|B) İkinci Yapay Zekâ Kışı|Lisp pazarının çökmesi ve uzman sistemlerin yetersizliği 'İkinci Kış'ı başlatmıştır.",
    "u1|İnsanlara ait uzmanlık bilgisini 'kurallar' halinde kodlayıp bilgisayar sistemine yaymayı amaçlayan 1970-1990 dönemi sistemlerine ne denir?|A) Derin Öğrenme~B) Uzman Sistemler (Expert Systems)~C) Büyük Dil Modelleri~D) Takviyeli Öğrenme~E) Üretken YZ|B) Uzman Sistemler (Expert Systems)|Bu sistemler Sembolik YZ olarak da bilinir. Doktor/mühendis bilgisi ile kodlanmıştır.",
    "u1|IBM'in 1997 yılında dünya satranç şampiyonu Garry Kasparov'u yenmeyi başaran yapay zeka sistemi hangisidir?|A) IBM Watson~B) Google AlphaGo~C) ChatGPT~D) IBM Deep Blue~E) ELIZA|D) IBM Deep Blue|Deep Blue 8x8'lik satranç tahtasında tüm hamleleri değerlendirerek şampiyonu yenmiştir.",
    "u1|2011'de Jeopardy yarışmasında en başarılı iki insan rakibine üstünlük sağlayan ve doğal dilde soru cevaplama yeteneğiyle öne çıkan sistem hangisidir?|A) IBM Watson~B) Deep Blue~C) AlphaGo~D) Turing Makinesi~E) ChatGPT|A) IBM Watson|IBM Watson, metinleri işleme ve doğal dil yeteneğiyle Jeopardy'i kazanmıştır.",
    "u1,2024-2025 Vize,2025-2026 Vize,Banko|Aşağıdakilerden hangisi Üretken Yapay Zekâ (Generative AI) sistemine örnektir?|A) Yaş sütununu sıralayan SQL~B) Var olmayan bir insan yüzü veya müzik üreten sistemler~C) Excel formülü~D) Spam filtresi~E) Veritabanı|B) Var olmayan bir insan yüzü veya müzik üreten sistemler|Üretken YZ var olan verilerden yola çıkarak 'yeni' içerikler (resim, müzik, metin) üretir.",
    "u1|ChatGPT gibi sistemlerin insan dilini anlama ve üretme yeteneği YZ'nin hangi alt dalına girer?|A) Bilgisayarlı Görü~B) Robotik~C) Doğal Dil İşleme (NLP)~D) Uzman Sistemler~E) Görüntü İşleme|C) Doğal Dil İşleme (NLP)|NLP, makinelerin insan diliyle metin veya ses üzerinden etkileşime girmesidir.",
    "u1|Bir resim veya videodaki nesneleri, yüzleri veya araçları tanımak için kullanılan YZ teknolojisi nedir?|A) Doğal Dil İşleme~B) Bilgisayarlı Görü (Computer Vision)~C) Veri Madenciliği~D) Nesnelerin İnterneti (IoT)~E) API|B) Bilgisayarlı Görü (Computer Vision)|Computer vision, pikselleri analiz ederek görüntüyü anlamlandırır ve örüntü/nesne tespiti yapar.",
    "u1|Mevcut ürün ve yazılım paketlerine yapay zeka işlevselliğinin entegrasyonunu sağlayan taşınabilir kod paketlerine (arayüzlere) ne ad verilir?|A) GPU~B) GUI~C) API (Application Programming Interfaces)~D) SQL~E) CPU|C) API (Application Programming Interfaces)|API'ler farklı yazılımların birbirleriyle konuşmasını ve özellik paylaşmasını sağlar.",
    "u1|Yalnızca satranç oynama veya sadece yüz tanıma gibi özel görevleri yapabilen, genelleme yeteneğinden yoksun YZ seviyesi nedir?|A) Güçlü YZ~B) Genel YZ~C) Süper YZ~D) Dar (Zayıf) YZ~E) Kuralcı YZ|D) Dar (Zayıf) YZ|Günümüzdeki tüm yapay zeka sistemleri sadece eğitildikleri özel alanda çalıştıkları için Dar (Zayıf) YZ kabul edilir.",
    "u1|İnsanın yapabileceği 'her türlü' entelektüel görevi yerine getirmeyi amaçlayan (ancak henüz ulaşılamamış) YZ seviyesi nedir?|A) Dar YZ~B) Zayıf YZ~C) Güçlü (Genel) YZ~D) Süper YZ~E) Sembolik YZ|C) Güçlü (Genel) YZ|Genel/Güçlü YZ, bir insanın yapabildiği tüm bilişsel yetenekleri barındıran teorik sistemlerdir.",
    "u1|İnsan zekasını her açıdan büyük ölçüde aşması beklenen bilim kurgusal zeka türü nedir?|A) Süper Yapay Zeka~B) Dar YZ~C) Zayıf YZ~D) Uzman Sistemler~E) NLP|A) Süper Yapay Zeka|Süper YZ, kendi kendini geliştirerek insanın çok ötesine geçen varsayımsal zeka seviyesidir.",
    "u1|Simon (1984) öğrenmeyi 'bir sistemin aynı görevi ikinci kez yaptığında ne göstermesi' olarak tanımlamıştır?|A) Kod satırının azalması~B) Daha iyi performans göstermesi~C) Daha az veri tüketmesi~D) Hata vermesi~E) Yorumlanabilir olması|B) Daha iyi performans göstermesi|Bir makine deneyim kazandıkça aynı görevdeki performansı artıyorsa öğrenmiştir.",
    "u1|Mitchell'in makine öğrenmesi tanımında yer alan 'G', 'P' ve 'D' harfleri sırasıyla neyi ifade eder?|A) Görev, Performans, Deneyim~B) Girdi, Program, Deney~C) Görev, Program, Data~D) Grafik, Performans, Durum~E) Gelişim, Proje, Değer|A) Görev, Performans, Deneyim|Tanım: Bir programın G (Görev) görevlerinde P (Performans) ile ölçülen performansı, D (Deneyim/Veri) ile artıyorsa öğrenmiştir.",
    "u1,Banko|Makine öğrenmesinde 'Çöp-girdi çöp-çıktı' (GIGO) kuralı neyin önemini vurgular?|A) Algoritma seçimi~B) İşlemci gücü~C) Veri kalitesi (Deneyim)~D) Programlama dili~E) Çapraz geçerleme|C) Veri kalitesi (Deneyim)|GIGO kuralı, modele verilen eğitici veri kirli veya eksikse, üreteceği kuralın/sonucun da hatalı olacağını belirtir.",

let allOpen = false;

// MOTOR BAŞLANGICI
const parsedSorular = rawData.map(row => {
    let parts = row.split('|');
    if(parts.length < 5) return null;
    return { c: parts[0].split(','), q: parts[1], o: parts[2].split('~'), a: parts[3], e: parts[4] };
}).filter(x => x !== null);

function ekranaCiz(liste) {
    const cont = document.getElementById('q-container');
    cont.innerHTML = '';
    if(liste.length === 0) { cont.innerHTML = '<h3 style="text-align:center; color:#e74c3c;">Soru bulunamadı.</h3>'; return; }

    liste.forEach((s, i) => {
        let tagsHTML = s.c.map(c => {
            let ct = c.trim().toUpperCase();
            if(ct === "B" || ct === "BANKO") return `<span class="tag tag-h">🔥 Banko</span>`;
            if(ct.startsWith("U") || ct.includes("ÜNİTE")) return `<span class="tag tag-u">📚 ${ct}</span>`;
            return `<span class="tag tag-e">📅 ${ct}</span>`;
        }).join('');

        let optsHTML = s.o.map(o => `<li>${o}</li>`).join('');
        cont.innerHTML += `<div class="card"><div class="tags">${tagsHTML}</div><p class="q-text">${i+1}. ${s.q}</p><ul class="opt">${optsHTML}</ul><button class="ans-btn" onclick="tgl(this)">Cevabı Göster</button><div class="ans-box"><p class="ans-true">✔️ ${s.a}</p><p class="exp-text">💡 ${s.e}</p></div></div>`;
    });
}

function filter(tag) {
    let search = tag.trim().toUpperCase();
    let filtered = (search === 'ALL') ? parsedSorular : parsedSorular.filter(s => s.c.some(c => {
        let dataTag = c.trim().toUpperCase();
        if (search === 'BANKO' || search === 'B') return dataTag === 'BANKO' || dataTag === 'B';
        if (search === 'VIZE' || search === 'FINAL' || search === 'BÜT' || search === 'TD') return dataTag.includes(search) || (search==='TD' && dataTag==='TEK DERS');
        return dataTag.includes(search) || dataTag.replace('ÜNİTE ','U') === search;
    }));
    ekranaCiz(filtered);
}

function aramaYap() {
    let kelime = document.getElementById('arama').value.toLowerCase().trim();
    ekranaCiz(kelime === '' ? parsedSorular : parsedSorular.filter(s => s.q.toLowerCase().includes(kelime) || s.e.toLowerCase().includes(kelime)));
}

function tgl(btn) {
    const box = btn.nextElementSibling;
    box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    btn.textContent = (box.style.display === 'block') ? 'Cevabı Gizle' : 'Cevabı Göster';
}

function toggleAll() {
    allOpen = !allOpen;
    document.querySelectorAll('.ans-box').forEach(b => b.style.display = allOpen ? 'block' : 'none');
    document.querySelectorAll('.ans-btn').forEach(b => b.textContent = allOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
}

window.onload = () => filter('all');
</script>

<script>
// AUZEF GÖRÜNÜM & CİHAZ PROFİLİ YÖNETİCİSİ
function setAuzefDeviceProfile(dev) {
    if (dev === 'auto') {
        const w = window.innerWidth;
        dev = (w <= 640) ? 'mobile' : 'web';
    }
    document.documentElement.setAttribute('data-device', dev);
    try { localStorage.setItem('auzef_device_profile', dev); } catch(e){}
    const sel = document.getElementById('deviceProfileSelect');
    if (sel && sel.value !== dev && sel.value !== 'auto') sel.value = dev;
}

function toggleAuzefTheme() {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('auzef_theme', cur); } catch(e){}
    const btn = document.getElementById('auzefThemeToggleBtn');
    if (btn) btn.textContent = cur === 'dark' ? '☀️ Açık' : '🌙 Koyu';
}

(function initAuzefViewMode() {
    try {
        const savedDev = localStorage.getItem('auzef_device_profile') || 'auto';
        setAuzefDeviceProfile(savedDev);
        const sel = document.getElementById('deviceProfileSelect');
        if (sel) sel.value = savedDev;

        const savedTheme = localStorage.getItem('auzef_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        const btn = document.getElementById('auzefThemeToggleBtn');
        if (btn) btn.textContent = savedTheme === 'dark' ? '☀️ Açık' : '🌙 Koyu';
    } catch(e){}
})();
</script>
