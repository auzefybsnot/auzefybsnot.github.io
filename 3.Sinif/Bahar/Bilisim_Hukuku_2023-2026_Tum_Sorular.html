<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUZEF Bilişim Hukuku - MEGA ARŞİV PRO</title>
    <style>
        :root { --p: #1a2b4c; --s: #2c3e50; --a: #f39c12; --suc: #27ae60; --bg: #f4f6f8; --c: #ffffff; --t: #2d3436; --b: #dfe6e9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 20px; border-radius: 10px; text-align: center; border-bottom: 5px solid var(--a); margin-bottom: 20px; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; position: sticky; top: 10px; background: var(--bg); padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 100; }
        .btn { background: #ecf0f1; color: var(--p); border: 2px solid var(--b); padding: 8px 12px; font-size: 0.95em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #bdc3c7; }
        .btn.active { background: var(--a); color: white; border-color: var(--a); }
        .btn-g { background: #d35400; color: white; }
        .card { background: var(--c); border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--p); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .tag-u { background: #3498db; } .tag-e { background: var(--p); } .tag-h { background: #e74c3c; }
        .q-text { font-size: 1.1em; font-weight: bold; color: var(--p); margin-bottom: 15px; }
        .opt { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .opt li { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--b); margin-bottom: 5px; }
        .ans-btn { background: var(--s); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .ans-box { display: none; margin-top: 15px; padding: 15px; background: #eafaf1; border-left: 4px solid var(--suc); border-radius: 6px; }
        .ans-true { color: var(--suc); font-weight: bold; margin-bottom: 5px; }
    
/* =========================================================
   CİHAZ UYARLAMA VE E-KİTAP MODU (DEVICE ADAPTIVE & E-INK)
   ========================================================= */
:root {
    --paper-bg: var(--bg, #f4f6f8);
    --card-surface: var(--card-bg, var(--c, #ffffff));
    --main-text: var(--text, var(--t, #2d3436));
    --border-color: var(--border, var(--b, #dfe6e9));
}

[data-theme="dark"] {
    --bg: #151c25 !important;
    --card-bg: #1c2530 !important;
    --c: #1c2530 !important;
    --text: #e2e8f0 !important;
    --t: #e2e8f0 !important;
    --border: #2e3a48 !important;
    --b: #2e3a48 !important;
    --primary: #8fb3e0 !important;
    --p: #8fb3e0 !important;
    --secondary: #232f42 !important;
    --s: #232f42 !important;
}

[data-theme="dark"] body {
    background-color: #151c25 !important;
    color: #e2e8f0 !important;
}

[data-theme="dark"] .container,
[data-theme="dark"] .page-wrap {
    color: #e2e8f0 !important;
}

[data-theme="dark"] .card,
[data-theme="dark"] .question-card,
[data-theme="dark"] .tips-card,
[data-theme="dark"] .view-mode-bar {
    background-color: #1c2530 !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

[data-theme="dark"] .opt li {
    background-color: #222d3a !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

[data-theme="dark"] .answer-area,
[data-theme="dark"] .ans-box {
    background-color: #172b25 !important;
    color: #e2e8f0 !important;
}

[data-theme="dark"] .header {
    background: linear-gradient(135deg, #1e293b, #0f172a) !important;
    border-bottom: 4px solid #f39c12 !important;
}

[data-theme="dark"] .btn,
[data-theme="dark"] .tab-btn {
    background-color: #222d3a !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

/* E-INK ORTAK: Animasyon, geçiş, gölge ve efektleri kapat */
[data-device^="eink-"] *,
[data-device^="eink-"] *::before,
[data-device^="eink-"] *::after {
    animation: none !important;
    transition: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    text-shadow: none !important;
}

/* 6 inç Siyah-Beyaz E-Okuyucu (Kindle, Kobo vb. E-Kitap Modu) */
[data-device="eink-6-bw"] {
    --bg: #FFFFFF !important;
    --card-bg: #FFFFFF !important;
    --c: #FFFFFF !important;
    --text: #000000 !important;
    --t: #000000 !important;
    --border: #000000 !important;
    --b: #000000 !important;
    --primary: #000000 !important;
    --p: #000000 !important;
    --secondary: #000000 !important;
    --s: #000000 !important;
}
[data-device="eink-6-bw"] body {
    background-color: #FFFFFF !important;
    color: #000000 !important;
    font-family: Georgia, 'Bookerly', 'Charis SIL', serif, system-ui !important;
    font-size: 17px !important;
    line-height: 1.6 !important;
    padding: 6px !important;
}
[data-device="eink-6-bw"] .container,
[data-device="eink-6-bw"] .page-wrap {
    max-width: 100% !important;
    padding: 0 !important;
}
[data-device="eink-6-bw"] .header {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
}
[data-device="eink-6-bw"] .card,
[data-device="eink-6-bw"] .question-card,
[data-device="eink-6-bw"] .view-mode-bar {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
    margin-bottom: 12px !important;
    padding: 12px !important;
}
[data-device="eink-6-bw"] .opt li {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 1px solid #000000 !important;
    font-size: 16px !important;
}
[data-device="eink-6-bw"] .btn,
[data-device="eink-6-bw"] button,
[data-device="eink-6-bw"] select {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
}
[data-device="eink-6-bw"] .answer-area,
[data-device="eink-6-bw"] .ans-box {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
}

/* 6 inç Renkli E-Okuyucu */
[data-device="eink-6-color"] body {
    font-size: 16.5px !important;
}
[data-device="eink-6-color"] .card,
[data-device="eink-6-color"] .btn,
[data-device="eink-6-color"] .view-mode-bar {
    border: 1.5px solid #2d3436 !important;
}

/* 10.3 inç Siyah-Beyaz Tablet (Boox, Remarkable vb.) */
[data-device="eink-10-bw"] {
    --bg: #FFFFFF !important;
    --card-bg: #FFFFFF !important;
    --text: #000000 !important;
    --border: #000000 !important;
}
[data-device="eink-10-bw"] body {
    background-color: #FFFFFF !important;
    color: #000000 !important;
    font-family: Georgia, 'Bookerly', serif, system-ui !important;
    font-size: 17.5px !important;
    line-height: 1.65 !important;
}
[data-device="eink-10-bw"] .container {
    max-width: 1100px !important;
}
[data-device="eink-10-bw"] .card,
[data-device="eink-10-bw"] .view-mode-bar {
    border: 2px solid #000000 !important;
}

/* Mobil Profil */
[data-device="mobile"] body {
    padding: 10px !important;
    font-size: 15px !important;
}
[data-device="mobile"] .header {
    padding: 15px 10px !important;
}
[data-device="mobile"] .header h1 {
    font-size: 1.4em !important;
}
[data-device="mobile"] .card {
    padding: 14px !important;
}

</style>
</head>

<div class="container">

    <!-- CİHAZ PROFİLİ VE GÖRÜNÜM MODU BAR -->
    <div class="view-mode-bar" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:10px 14px; background:var(--card-bg, #fff); border:1px solid var(--border, #dfe6e9); border-radius:10px; margin-bottom:16px;">

            <select id="deviceProfileSelect" onchange="setAuzefDeviceProfile(this.value)" style="padding:6px 10px; font-weight:700; font-size:13px; border-radius:8px; border:1px solid var(--border, #dfe6e9); background:var(--card-bg, #fff); color:inherit; cursor:pointer;">
                <option value="auto">🔄 Otomatik</option>
                <option value="web">💻 Masaüstü Web</option>
                <option value="mobile">📱 Mobil Cihaz</option>

                <option value="eink-6-color">🎨 6" E-Okuyucu (Renkli)</option>
                <option value="eink-10-bw">📝 10.3" Tablet (S/B)</option>
                <option value="eink-10-color">🖍️ 10.3" Tablet (Renkli)</option>
            </select>
            <button id="auzefThemeToggleBtn" type="button" onclick="toggleAuzefTheme()" style="padding:6px 12px; font-weight:800; font-size:13px; border-radius:8px; border:1px solid var(--border, #dfe6e9); background:var(--card-bg, #fff); color:inherit; cursor:pointer;" title="Koyu / Açık Tema">
                🌙 Tema
            </button>
        </div>
    </div>

    <div class="header">
        <h1>Bilişim Hukuku Mega Havuz</h1>
        <p>Vize, Final, Bütünleme, Tek Ders - Tüm Çıkmış Sorular (Akıllı Menülü)</p>
    </div>

    <div class="controls">
        <button class="btn btn-g" onclick="toggleAll()">👁️ Tüm Cevapları Aç/Kapat</button>

        <select class="btn" id="kategori-secici" onchange="filter(this.value)" style="background: var(--p); color: white; min-width: 180px; text-align: center; font-weight:bold; padding:8px; border-radius:6px; cursor:pointer;">
            <option value="all">📚 Tüm Havuz (Hepsi)</option>
            <optgroup label="Dönemler">
                <option value="vize">📅 Vizeler (Tümü)</option>
                <option value="final">📅 Finaller (Tümü)</option>
                <option value="büt">📅 Bütünlemeler</option>
                <option value="tek ders">📅 Tek Ders</option>
            </optgroup>
            <optgroup label="Yıllar">
                <option value="2023">📅 2023 Yılı</option>
                <option value="2024">📅 2024 Yılı</option>
                <option value="2025">📅 2025 Yılı</option>
                <option value="2026">📅 2025-2026 Yılı</option>
            </optgroup>
        </select>

        <button class="btn" style="background: #e74c3c; color:white; border:none;" onclick="filter('Banko')">🔥 Banko Sorular</button>
        <button class="btn" style="background: #f1c40f; color:#d35400; border:none;" onclick="filter('Dikkat')">⚠️ Dikkat Edilmesi Gerekenler</button>

        <input type="text" id="arama" class="btn" placeholder="🔍 Kelime ara..." onkeyup="aramaYap()" style="background: white; color: black; cursor: text; text-align: left; min-width: 200px;">
    </div>

    <div id="q-container"></div>
</div>

<script>
const rawData = [
    "Vize 2024,Vize 2025,Vize 2026,Büt 2023,Büt 2024,Tek Ders 2024,Banko|5651 Sayılı Kanunda (kısaca İnternet Kanununda) yer alan, 'İnternet ortamı üzerinden kullanıcılara sunulan her türlü bilgi veya veriyi üreten, değiştiren ve sağlayan gerçek veya tüzel kişi' şeklindeki cümle aşağıdakilerden hangisini tanımlamaktadır?|A) Yer sağlayıcı~B) Erişim sağlayıcı~C) İçerik sağlayıcı~D) Aracı hizmet sağlayıcı~E) Toplu kullanım sağlayıcı|C) İçerik sağlayıcı|Kanunun 2. maddesinde yer alan yasal tanımdır. İnternette okuduğunuz bir metni yazan, izlediğiniz bir videoyu çeken veya bir fotoğrafı yükleyen kişi 'İçerik Sağlayıcı'dır.",
    "Vize 2025,Final 2024,Final 2025,Büt 2023,Büt 2024,Tek Ders 2024,Banko|Aşağıdakilerden hangisi TCK'da 'bilişim alanındaki suçlar' başlığı altında düzenlenen suçlardandır?|A) Banka veya kredi kartlarının kötüye kullanılması suçu~B) Bir kişinin evine gizlice kamera yerleştirilip kişinin izlenmesi~C) Bir mağazadan bilgisayar ve bilgisayar programı çalmak~D) Kaçakçılık yapmak için internet üzerinden haberleşmek~E) Banka soymak için internetten silah satın almak|A) Banka veya kredi kartlarının kötüye kullanılması suçu|TCK m. 245'te yer alan 'Banka veya kredi kartlarının kötüye kullanılması suçu' doğrudan bilişim suçudur. Diğerleri özel hayatın ihlali, hırsızlık veya kaçakçılıktır.",
    "Vize 2023,Vize 2024,Final 2023,Büt 2023,Tek Ders 2024,Banko|Hukukumuzdaki alan adı sistemi açısından aşağıdakilerden hangisi yanlıştır?|A) Alan adlarına dair sistem güncel olarak TRABİS tarafından işletilmektedir.~B) Alan adları aynı zamanda önemli birer tanıtım aracı haline gelmişlerdir.~C) www.istanbul.edu.tr alan adındaki .tr ibaresi üst düzey alan adı olup jenerik üst düzey alan adını ifade etmektedir.~D) IP adresi ve alan adı eşleşmesini çok kısa sürede yapar.~E) Temel hususların ayrıntıları Alan Adları Yönetmeliğinde düzenlenmiştir.|C) www.istanbul.edu.tr alan adındaki .tr ibaresi üst düzey alan adı olup jenerik üst düzey alan adını ifade etmektedir.|'.tr' (Türkiye) jenerik değil, 'Ülke Kodlu Üst Düzey Alan Adı'dır (ccTLD). Jenerik olanlar (gTLD) .com, .org gibi coğrafi sınır taşımayanlardır.",
    "Vize 2023,Vize 2025,Vize 2026,Banko|Hukukumuzdaki alan adı sistemi açısından aşağıdakilerden hangisi doğrudur?|A) Alan Adları Yönetmeliğinde belgeli alan adları için ilk gelen ilk alır kuralı açıkça düzenlenmiştir.~B) Türkiye'de verilen alan adları (com.tr, edu.tr, net.tr vs.) ICANN ve onun bir kuruluşu olan IANA tarafından doğrudan verilmektedir.~C) Alan Adları Yönetmeliğinde alan adları belgeli ve belgesiz alan adları diye ikiye ayrılmıştır.~D) Alan adlarının verilmesi ve sistemin yürütülmesi açısından hukukumuzda güncel olarak yetkili kurum ODTÜ nic.tr'dir.~E) Alan adlarına dair temel çerçeveyi düzenlemek ve uyuşmazlıkları çözmek için hukukumuzda Alan Adları Kanunu kabul edilmiştir.|C) Alan Adları Yönetmeliğinde alan adları belgeli ve belgesiz alan adları diye ikiye ayrılmıştır.|TRABİS sisteminde alan adları kimlik veya evrak istemeyen (belgesiz) ve resmi kayıt gerektiren (belgeli) olarak ikiye ayrılır. İlk gelen alır kuralı belgesiz adresler içindir.",
    "Vize 2024,Vize 2025,Final 2024,Büt 2024,Banko,Dikkat|Aşağıdakilerden hangisi Sınai Mülkiyet Kanunu kapsamında doğrudan korunan konulardan değildir?|A) Faydalı modeller~B) Coğrafi işaretler~C) Telif hakları~D) Buluşlar~E) Geleneksel ürün adları|C) Telif hakları|⚠️ DİKKAT: Şiir, müzik, tablo veya bilgisayar yazılımı gibi eserler 'Telif Hakları' şemsiyesinde 5846 Sayılı Fikir ve Sanat Eserleri Kanunu (FSEK) ile korunur. Sınai Mülkiyet Kanunu (SMK) kapsamında değildir.",
    "Vize 2023,Vize 2024,Vize 2025,Vize 2026,Banko|Bilgisayar programlarında eser sahipliği açısından aşağıdakilerden hangisi yanlıştır?|A) Bir programcı bir programı tek başına yazarsa eser sahibi odur.~B) Bir bilgisayar programcısının sekreteri de program üzerinde birlikte eser sahibi olarak hak sahibi olur, çünkü sekreterlik görevi yaparak yardım etmiştir.~C) Birden fazla programcı birlikte yazmış ise birlikte eser sahibi sayılırlar.~D) İşveren kanun gereği hakları kullanma yetkisine sahiptir.~E) Ayrılmaz bir bütün teşkil ediyorsa, program üzerindeki hakları bir araya getiren kişi tarafından kullanılır.|B) Bir bilgisayar programcısının sekreteri de program üzerinde birlikte eser sahibi olarak hak sahibi olur...|Eser sahibi olmak için o ürünün yazılımına veya mimarisine (fikri yaratım sürecine) katkıda bulunmak gerekir. Sekreterlik gibi idari destek faaliyetleri eser sahipliği hakkı doğurmaz.",
    "Vize 2023,Vize 2025,Büt 2024,Tek Ders 2024,Banko,Dikkat|Aşağıdakilerden hangisi bir bilgisayar programının FSEK kapsamında korunan unsurlarından değildir?|A) Programın temelinde yatan ilkeler~B) Kaynak kodu~C) Nesne kodu~D) Hazırlık tasarımı~E) Programın akış planı (akış diyagramı)|A) Programın temelinde yatan ilkeler|⚠️ DİKKAT: Telif hukuku soyut fikirleri, algoritmaları veya matematiksel kuralları (ilkeleri) korumaz, o fikrin somutlaşmış halini (ifadeyi - kodları ve tasarımları) korur.",
    "Final 2023,Final 2025,Büt 2024,Tek Ders 2024,Banko|Hukuki işleme dair aşağıdaki bilgilerden hangisi yanlıştır?|A) Hukuki işlemlerin en temel görünümü sözleşmelerdir~B) Hukukumuzda hukuki işlemler iki taraflı olduklarında şekle bağlıdırlar~C) Hukuki işlemin temel unsuru, hukuki sonuç doğurmaya yönelik irade açıklamasıdır~D) Hukuki işlemlere dair temel unsurlar bilişim hukuku için de geçerlidir~E) Genel işlem koşulu şeklinde olması mümkündür|B) Hukukumuzda hukuki işlemler iki taraflı olduklarında şekle bağlıdırlar|Türk Borçlar Kanunu'nda temel prensip 'Şekil Serbestisi'dir. İki taraflı işlemler (sözleşmeler) kural olarak özel bir şekle (yazılı, noter vs.) bağlı olmadan, sözlü veya internet üzerinden de kurulabilir.",
    "Vize 2025,Final 2023,Final 2025,Tek Ders 2024,Banko|Bilişim hukuku hakkında aşağıda verilen bilgilerden hangisi yanlıştır?|A) Elektronik ortamda işlenen suçlara dair hukuki rejim veya elektronik alandaki ticari faaliyetlerin vergilendirilmesi gibi hususlar, tamamen ayrı hukuk alanlarının kapsamında kalan konular olduklarından, bilişim hukukunun kapsamına dahil değildirler.~B) E-ticaret, alan adları, kişisel verilerin elektronik ortamda korunması gibi hususlar bilişim hukukunun kapsamında kalan konulardır.~C) Bilişim hukuku hem özel ve hem de kamu hukukuna dahil edilebilecek yönler içermektedir.~D) Bilişim hukuku aynı zamanda bir maddi hukuktur.~E) Bilişim hukuku şekli hukuk kapsamında da görülebilir.|A) Elektronik ortamda işlenen suçlara dair hukuki rejim veya elektronik alandaki ticari faaliyetlerin vergilendirilmesi... bilişim hukukunun kapsamına dahil değildirler.|Siber suçlar (Ceza) ve dijital vergiler (Vergi) bilişim hukukunun en önemli disiplinlerarası çalışma alanlarıdır. Kapsam dışı değildirler.",
    "Vize 2025,Final 2023,Final 2024,Final 2025,Banko|Tüketicilerin Korunması Hakkındaki Kanun'da (TKHK'da) düzenlenen mesafeli sözleşmelerin ifası açısından aşağıdakilerden hangisi yanlıştır?|A) Bu sözleşmelerde kanunda öngörülen süreler içinde edim ifa edilmediğinde, tüketici, ancak diğer tarafa 14 günlük bir ek süre verdikten sonra sözleşmeyi sonlandırabilir.~B) Satıcı edimini yerine getirmemesi durumunda tüketici sözleşmeyi feshedebilir.~C) Satıcı taahhüt edilen süre içinde edimini yerine getirmelidir.~D) İmkansızlaşması halinde 3 gün içinde bildirim zorunludur.~E) Mal satışlarında sözleşmenin ifa süresi her halükarda 30 günü geçemez.|A) Bu sözleşmelerde kanunda öngörülen süreler içinde edim ifa edilmediğinde, tüketici, ancak diğer tarafa 14 günlük bir ek süre verdikten sonra sözleşmeyi sonlandırabilir.|İnternetten alınan ürün süresinde teslim edilmezse, tüketici sözleşmeyi derhal feshetme hakkına sahiptir. Ek mühlet/süre verme zorunluluğu yoktur.",
    "Vize 2025,Final 2024,Final 2025,Tek Ders 2024,Banko|Aşağıdakilerden hangisi bir link verme türü değildir?|A) İç link (inpagelink)~B) Embedding (gömülü) link~C) Frame (çerçeve) link~D) Çatı link~E) Derin link|D) Çatı link|İnternet hukukunda iç link, derin link, frame ve gömülü (embedding) link tanımları vardır. 'Çatı link' diye teknik bir terim bulunmamaktadır.",
    "Vize 2023,Vize 2024,Vize 2025,Vize 2026,Banko|Normlar hiyerarşisinin anlamı aşağıdakilerden hangisinde doğru açıklanmıştır?|A) Devletteki en yetkili kişinin en üstün kuralları koyacağı anlamına gelir.~B) Genel kanunların özel kanunların üstünde olduğunu ifade eden temel ilkedir.~C) İdarenin temel hak ve özgürlükleri sınırlayan kararlarının kanuni temeli olması gerektiğini ifade eder.~D) Kuvvetler ayrılığı ilkesinin bir diğer ifadesidir.~E) Hukuk kurallarının birbiriyle olan ilişkisine dair temel bir ilkedir ve Anayasa'nın en üst hukuk kaynağı olduğunu, diğer kuralların aşağıya doğru konumlandığı yapıyı ifade eder.|E) Hukuk kurallarının birbiriyle olan ilişkisine dair temel bir ilkedir ve Anayasa'nın en üst hukuk kaynağı olduğunu...|Hukuk kurallarının alt-üst ilişkisidir (Kelsen Piramidi). Hiçbir yönetmelik kanuna, hiçbir kanun Anayasaya aykırı olamaz. En güçlü ve en üstün kural her zaman Anayasadır.",
    "Vize 2024,Vize 2025,Büt 2024,Banko|Aşağıdakilerden hangisi bilişim hukuku alanındaki temel kanunlarda düzenlenen süjelerden değildir?|A) Elektronik ticaret aracı hizmet sağlayıcı~B) İçerik sağlayıcı~C) Yer sağlayıcı~D) Toplu kullanım sağlayıcı~E) Erişim geliştirmeyi sağlayıcı|E) Erişim geliştirmeyi sağlayıcı|Kanunlarda 'Erişim Sağlayıcı' (TTNET, Turkcell vb.) şeklinde resmi bir tanım vardır ancak 'Erişim Geliştirmeyi Sağlayıcı' isminde bir kavram veya aktör mevzuatta bulunmamaktadır.",
    "Vize 2026,Banko|Aşağıdaki aktörlerden hangisi bilişim hukukundaki temel aktörlerden değildir?|A) Yer sağlayıcılar~B) Arama motorları~C) Televizyon ve/veya radyo şirketleri~D) Erişim sağlayıcılar~E) Sosyal ağ sağlayıcılar|C) Televizyon ve/veya radyo şirketleri|Televizyon ve radyo şirketleri bilişim hukukunun değil, RTÜK mevzuatının (Medya Hukuku) konusudur.",
    "Vize 2025,Final 2023,Final 2025,Banko|Tüketicilerin Korunması Hakkındaki Kanun'da (TKHK) mesafeli sözleşmeler itibariyle tüketiciye tanınan ve tüketicinin herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin kullanabileceği hak aşağıdakilerden hangisidir?|A) Sözleşmeyi dönüştürme hakkı~B) Cayma hakkı~C) Geri alım hakkı~D) Caydırma hakkı~E) Ön bilgilendirme isteme hakkı|B) Cayma hakkı|İnternetten (mesafeli) yapılan alışverişlerde tüketicinin, malı teslim aldıktan sonraki 14 gün içinde hiçbir mazeret/gerekçe belirtmeden ve ceza ödemeden ürünü iade edip parasını geri alma hakkına 'Cayma Hakkı' denir.",
    "Final 2024,Final 2025,Büt 2023,Büt 2024,Banko|Kişisel verilerin işlenmesi süreci açısından, bu sürecin, verisi işlenen kişi penceresinden açık/belirli olmasını, sürece dair bilgilenme imkânı verilmesini ifade eden ilke aşağıdakilerden hangisidir?|A) Güvenilirlik ve gizlilik ilkesi~B) Amaca bağlılık ilkesi~C) Şeffaflık ilkesi~D) Hukuka ve dürüstlük kuralına uygunluk ilkesi~E) Verilerin güncel olması ilkesi|C) Şeffaflık ilkesi|Veri işleme süreçlerinin veri sahibi kişi için açık, bilinir ve anlaşılır olmasını; neyin kim tarafından işlendiğinin gizlenmemesini sağlayan KVKK evrensel ilkesi 'Şeffaflık İlkesi'dir.",
    "Vize 2023,Vize 2025,Vize 2026,Büt 2023,Banko|Aşağıdakilerden hangisi eser sahibinin mali veya manevi haklarından değildir?|A) Çoğaltma hakkı~B) Umuma arz yetkisi~C) Takip hakkı~D) Umumu yönlendirme hakkı~E) Yayma hakkı|D) Umumu yönlendirme hakkı|Hukuk terminolojisinde 'Umumu yönlendirme hakkı' şeklinde tanımlanmış bir eser sahibi hakkı yoktur; tamamen uydurma bir şıktır. Yayma ve Çoğaltma mali, Umuma Arz manevidir.",
    "Vize 2023,Vize 2025,Banko|Alan adı sistemi açısından aşağıdakilerden hangisi yanlıştır?|A) Alan adı sisteminde en üst düzey alan adları sadece ülke kodlarından ibaret değildir.~B) IP adresi ve alan adı eşleşmesini her iki yönde yapabilir.~C) IP adreslerinin aksine akılda tutulma kolaylığı sağlar.~D) Hukukumuzda güncel alan adı sistemini Alan Adı Kanununu bütün ayrıntılarıyla düzenlemektedir.~E) Birden fazla alan adı aynı IP adresine yönlendirilebilir.|D) Hukukumuzda güncel alan adı sistemini Alan Adı Kanununu bütün ayrıntılarıyla düzenlemektedir.|Türk hukukunda sırf alan adlarını düzenleyen müstakil bir 'Alan Adı Kanunu' bulunmamaktadır. İşlemler 5651 sayılı kanun ve yönetmeliklerle yürütülür.",
    "Vize 2023,Vize 2025,Vize 2026,Büt 2024,Banko|Aşağıdakilerden hangisi, alan adının tahsisi hakkında yürütülen ve alan adının kime verilmesinin daha doğru olacağı yönündeki tartışmanın maddi temelini oluşturur?|A) IP adreslerinin akılda tutulması zorluğu.~B) IP adreslerini kimin vereceği sorunu.~C) İlk gelen alır kuralıyla bütün sorunların toptan çözülmesi.~D) Alan adının tekliği ve buna temel olabilecek hukuki pozisyonların ise duruma göre çok sayıda olması ve bunların farklı hukuki temellere dayanabilmesi.~E) Türkiye'de alan adı sisteminin merkezi hale getirilmesi.|D) Alan adının tekliği ve buna temel olabilecek hukuki pozisyonların çok sayıda olması...|İnternette adres (örneğin mars.com) tek iken, gerçek dünyada bu ismi kullanmaya meşru hakkı olan marka, kişi veya eser adlarının (çok sayıda hak sahibinin) olması tartışmanın temelidir.",
    "Vize 2023,Vize 2025,Vize 2026,Banko|İnternetteki temel süjeler ve/veya bunların sorumluluğu açısından aşağıdakilerden hangisi doğrudur?|A) TTNet, Superonline içerik sağlayıcı sayılırlar.~B) Sadece kendi resimlerini yayınlayan kişi içerik sağlayıcı sayılmaz.~C) Arama motorları erişim sağlayıcı sayılırlar.~D) Yer sağlayıcı sadece gerçek kişileri ifade eder.~E) İçerik sağlayıcının sorumluluğu itibariyle, kendi içeriği ile başkasına ait içeriğe verdiği bağlantı arasında kanunda ayrım yapılmış ve bunlar farklı kurallara bağlanmıştır.|E) İçerik sağlayıcının sorumluluğu itibariyle, kendi içeriği ile başkasına ait içeriğe verdiği bağlantı arasında kanunda ayrım yapılmış...|Kanuna göre içerik sağlayıcı kendi ürettiğinden bizzat sorumludur. Ancak başkasına verdiği linkten (benimsemediği sürece) kural olarak sorumlu tutulmaz. Ayrım yapılmıştır.",
    "Vize 2023,Vize 2026,Banko|Aşağıdakilerden hangisi fikri mülkiyet hukuku alanı değildir?|A) Marka hukuku~B) Fikir ve sanat eserleri hukuku~C) Faydalı bilgiler hukuku~D) Tasarım hukuku~E) Ürün adları ve coğrafik işaretlerin korunması|C) Faydalı bilgiler hukuku|Sınai Mülkiyet Kanunu'nda (SMK) 'Faydalı Model' vardır ancak hukuk sistemimizde 'Faydalı bilgiler hukuku' diye bir alan yoktur.",
    "Vize 2023|Cemile isimli romanın yazarı ile adı Cemile olan bir kişi arasındaki www.cemile.com.tr alan adı uyuşmazlığı açısından aşağıdakilerden hangisi doğrudur?|A) Eserin yazılma tarihi doğum tarihinden önce ise eser sahibi almalıdır.~B) Bu tür bir uyuşmazlıkta herkesin kendine uygun bir hukuki pozisyonu bulunduğundan, kimin alan adını önce kaydettirdiğine bakmak gerekir.~C) Eser koruması isim korumasından önce geldiğinden yazar almalıdır.~D) Cemile ismi bayan adı olduğundan öncelik sağlar.~E) Eser sahibinin toplumsal kültüre katkısından dolayı öncelik hakkı vardır.|B) Bu tür bir uyuşmazlıkta herkesin kendine uygun bir hukuki pozisyonu bulunduğundan... kimin önce kaydettirdiğine bakmak gerekir.|İki taraf da kötü niyetli değilse ve ikisinin de ismi kullanmak için geçerli sebebi varsa 'İlk gelen alır' kuralı işletilir. İsim hakkı ile eser adı arasında mutlak bir üstünlük yoktur.",
    "Vize 2023,Vize 2024,Vize 2025,Vize 2026,Final 2025,Büt 2023,Banko|Aşağıdakilerden hangisi belgeli alan adı örneğidir?|A) .name.tr~B) .biz.tr~C) .com.tr~D) .dr.tr~E) .net.tr~F) .av.tr|.dr.tr / .av.tr|Mesleki suiistimali önlemek için 'dr.tr' (doktor) ve 'av.tr' (avukat) gibi alan adları sadece resmi belge (diploma/kimlik) ibrazıyla alınabilir. Diğerleri belgesizdir.",
    "Vize 2023,Vize 2025,Vize 2026,Final 2024,Büt 2024,Banko|Aşağıdakilerden hangisi SMK m. 7 III hükmü açısından yanlıştır?|A) Ortada hukuken korunan bir markanın bulunması gerekir.~B) İşaretin alan adı olarak internette kullanılmasının ticari olup olmaması önemsizdir.~C) Markayla örtüşen ibarenin alan adı olarak kullanılması gerekir.~D) Alan adı kullananın üstün bir hakka sahip olmaması gerekir.~E) Marka hukukuna ilişkin bir sorunu düzenler.|B) SMK m. 7 III hükmü açısından işaretin alan adı olarak internette kullanılmasının ticari olup olmaması önemsizdir.|Markanın izinsiz kullanımına müdahale edilebilmesi için kullanımın mutlaka 'ticari etki' yaratması şarttır. Bu yüzden 'önemsizdir' ifadesi yanlıştır.",
    "Vize 2024,Vize 2025,Vize 2026,Büt 2023,Banko|Aşağıdakilerden hangisi bir ürünün Fikir ve Sanat Eserleri Hukuku anlamında eser sayılması için gerekli koşullardan biridir?|A) Eserin yeni olması zorunluluğu~B) Eserin multimedya eseri olması zorunluluğu~C) Eserin cismaniyet kazanması zorunluluğu~D) Eserin yaratıcısının hususiyetini taşıması zorunluluğu~E) Eserin dijital olması zorunluluğu|D) Eserin yaratıcısının hususiyetini taşıması zorunluluğu|FSEK kapsamında bir ürünün eser sayılabilmesi için sahibinin kişiliğini, seçimlerini ve yaratıcılığını (hususiyetini) yansıtması temel şarttır.",
    "Vize 2026|Bir bilgisayar programının FSEK kapsamında korunabilmesi için aşağıdakilerden hangisi gerekli değildir?|A) Bilgisayar programının dışarıdan algılanabilir bir biçim kazanmış olması gerekir.~B) Bilgisayar programının bir fikri ürün olması gerekir.~C) Bilgisayar programının kanundaki eser kategorilerinden birine girmesi gerekir.~D) Bilgisayar programının standardın üstünde özgün bir program olması gerekir.~E) Bilgisayar programının programcının hususiyetini taşıması gerekir.|D) Bilgisayar programının standardın üstünde özgün bir program olması gerekir.|Bir bilgisayar programının eser sayılması için standardın üstünde dâhiyane veya çok özgün olmasına gerek yoktur, sadece kopyalanmamış olması ve sahibinin hususiyetini (özelliğini) yansıtması yeterlidir.",
    "Vize 2023,Vize 2025,Banko|Aşağıdakilerden hangisi İnternet Kanununda (5651) tanımlanan hususlardan değildir?|A) Elektronik ticaret aracı hizmet sağlayıcı~B) Yer sağlayıcı~C) Toplu kullanım sağlayıcı~D) Sosyal ağ sağlayıcı~E) Erişim sağlayıcı|A) Elektronik ticaret aracı hizmet sağlayıcı|E-ticaret aracı hizmet sağlayıcı (Pazaryerleri vb.) tanımı 5651 sayılı İnternet Kanununda değil, 6563 Sayılı Elektronik Ticaret Kanunu'nda yer alır.",
    "Vize 2024,Vize 2025,Vize 2026,Final 2024,Büt 2023,Banko|Hukukumuz açısından, hukukun diğer toplumsal düzen kurumlarından farklılığına dair aşağıdaki ibarelerden hangisi doğrudur?|A) Hukuk kuralları her zaman ahlak kuralları ile birebir örtüşürler.~B) Hukuk asıl ve ağırlıklı olarak dini kurallara bağlıdır.~C) Hukuk kurallarında yaptırımlar devlet gücü ile desteklenmektedir.~D) Bütün hukuk kuralları her zaman yazılıdır.~E) Hukuk kuralları kural olarak değiştirilemezler.|C) Hukuk kurallarında yaptırımlar devlet gücü ile desteklenmektedir.|Din ve ahlak kuralları manevi (ayıplanma vb.) yaptırımlar içerirken, hukuk kurallarının arkasında devletin zorlayıcı maddi gücü (polis, icra, mahkeme) vardır.",
    "Vize 2026|Bir Yargıtay kararına konu olan olayda Ankara'da nakliyat alanında çalışan A www.ankaraarasnakliyat.com.tr alan adını almış ve bunu kullanmaktadır. A'nın aras ibaresiyle örtüşen bir hukuki pozisyonu bulunmamaktadır. Aras Kargo şirketi bu yapılanın hukuka aykırı olduğunu iddia etmektedir. Bu tür bir olayda aşağıdaki şıklardan hangisi doğru şık olarak nitelenir?|A) Asıl belirleyici olan Ankara ibaresidir.~B) A, Aras ibaresine denk gelen bir hukuki pozisyonu olmadığından alan adını uygun bir hukuki temele dayandıramaz.~C) Alan adının karakteristik kısmı 'nakliye' ibaresi olduğundan Aras Kargo engelleyemez.~D) A, yetkili bayisi olsa bile kullanması hukuken her durumda yasaktır.~E) İlk gelen alır kuralı her durumda uygulanacağından engellenmesi mümkün değildir.|B) A, Aras ibaresine denk gelen bir hukuki pozisyonu olmadığından alan adını uygun bir hukuki temele dayandıramaz.|Alan adındaki ayırt edici esas unsur 'Aras'tır. A'nın şirketinin veya kendi isminin Aras ile bir bağlantısı yoksa, ünlü bir markayı alan adı içinde kullanması kötü niyetli haksız rekabettir.",
    "Vize 2025,Final 2023,Büt 2024,Tek Ders 2024,Banko|A'nın kurduğu ve deprem konusunda bilimsel yayınlar yapan www.depremhaberleri.com.tr dergisi 2012'den beri faaliyettedir. B ise 'deprem ve bilim' dergisini kurup 2022'de www.depremhaberleri.com alan adını almıştır. Uyuşmazlık açısından hangisi doğrudur?|A) A'nın iddiası doğru değildir, alan adı boştadır.~B) A'nın dergisinin adı jenerik ibarelerden oluşmasına rağmen uzun yıllardır bu şekilde kullanıldığı ve yerleştiği hukuken korunur ve hak ihlaline karşı yollara başvurabilir.~C) İlk gelen alır kuralı geçerlidir, sorun yoktur.~D) A'nın markası meşhur marka olmuştur, B'nin şansı yoktur.~E) Her ikisi de doğrudan Türkiye'de tescillidir.|B) A'nın elektronik dergisinin adı jenerik ibarelerden oluşmasına rağmen uzun yıllardır kullanıldığı için hukuken korunur...|Jenerik kelimeler olsa da A, emek ve bilinirlik (müktesep hak) yaratmıştır. Rakip B'nin kasten okuyucuları yanıltmak için .com versiyonunu alması kötü niyetli haksız rekabet sayılır.",
    "Vize 2026,Final 2023,Tek Ders 2024,Banko|Bilgisayar programlarının FSEK kapsamında korunması itibariyle yayma hakkı açısından aşağıdakilerden hangisi doğrudur?|A) Bir bilgisayar programının yapay zeka tarafından çoğaltılması yayma hakkı kapsamına giren bir fiildir.~B) Yayma hakkı, sadece dijital ürünler için geçerlidir.~C) Yayma hakkı ister dijital olsun isterse olmasın bütün bilgisayar programları için geçerli bir hak değildir.~D) Dijital kopyanın yayılması yayma hakkıyla değil, çoğaltma hakkıyla alakalı bir konudur.~E) Bir bilgisayara yüklü şekilde satın alınmış bir programın daha sonra bilgisayarla birlikte bir başkasına devredilmesinde kural olarak yayma hakkı açısından bir sorun bulunmaz, çünkü yayma hakkı tükenmiştir.|E) Bir bilgisayara yüklü şekilde satın alınmış bir programın daha sonra bilgisayarla birlikte bir başkasına devredilmesinde kural olarak yayma hakkı açısından bir sorun bulunmaz, çünkü yayma hakkı tükenmiştir.|Hukukta 'Tükenme İlkesi' geçerlidir. İçinde yazılım olan fiziki bir bilgisayarı satın aldıysanız, satıcının o kopya üzerindeki yayma yetkisi tükenir. Cihazı ikinci el olarak satabilirsiniz.",
    "Vize 2023,Büt 2024,Tek Ders 2024,Banko,Dikkat|Aşağıdakilerden hangisi çoğaltma hakkı kapsamında kalmaz?|A) Bir bilgisayar programını bir bilgisayardan diğerine indirmek~B) Bir bilgisayar programını internetten bilgisayarına indirmek~C) Cep telefonunu içindeki programla beraber başkasına satmak~D) Bir bilgisayar programını bilgisayarda çalıştırmak~E) Bir bilgisayar programını sadece kısmen çoğaltmak|C) Cep telefonunu içindeki programla beraber başkasına satmak|⚠️ DİKKAT: İçinde yazılım olan fiziki cihazı satmak yeni bir kopya yaratmadığı için çoğaltma değil, mülkiyet devri yani 'yayma (satış) hakkının tükenmesi' kapsamındadır.",
    "Vize 2023,Vize 2025,Vize 2026,Büt 2024,Tek Ders 2024,Banko|Patent hukuku açısından aşağıdakilerden hangisi doğrudur?|A) Bu hukuk alanı Sınai Mülkiyet Kanununda düzenlenmiş temel alanlardan biridir.~B) Patent hukuku markaların korunmasını sağlar.~C) Eserler de patentle korunur.~D) FSEK ile patent bir bütündür.~E) Bilgisayar programlarının asıl korunduğu alan patent hukukudur.|A) Bu hukuk alanı Sınai Mülkiyet Kanununda düzenlenmiş temel alanlardan biridir.|Türkiye'de patentler, 6769 Sayılı Sınai Mülkiyet Kanunu (SMK) altında düzenlenmiştir. Bilgisayar programları asıl olarak eser sayılır (FSEK).",
    "Vize 2026|Bilgisayar programlarının patent hukukunda korunması açısından aşağıdakilerden hangisi doğrudur?|A) Buluş basamağını aşan her bilgisayar programı patent hukukunda ayrıca bir araştırma yapmaya gerek olmadan korunur.~B) Bilgisayar programının nesne koduyla yazılış şekli, patent hukukunda korunan kısmı ifade eder.~C) Patent hukukunda teknik mahiyette olan (salt bilgisayara ilişkin olmak dışında bir teknik etki yaratmak anlamında) bilgisayar programlarının korunması mümkündür, ancak bunun için bunların patent yeteneği koşullarını da sağlamaları gerekir.~D) Her türlü bilgisayar programı patent hukukunda korunur.~E) Bilgisayar programları patent hukukunda korunmazlar, çünkü bunlar buluş değildirler.|C) Patent hukukunda teknik mahiyette olan... bilgisayar programlarının korunması mümkündür...|Yazılımlar kural olarak eserdir ve telifle korunur. Ancak yazılım, dış dünyada teknik bir problemi çözüyor (örneğin cihazı yönetiyorsa) teknik mahiyette olduğu için 'bilgisayar istemli buluş' olarak patentlenebilir.",
    "Vize 2023|Aşağıdaki fiillerden hangisi bilgisayar programlarının FSEK kapsamında korunması açısından önem taşımaz?|A) Programı ilk kez kamuya arz etmek~B) Programı çoğaltmak~C) Çoğaltılmış nüshaları yaymak~D) Programı işleyerek daha gelişmiş hale getirmek~E) Bir bilgisayar programının hangi dilde yazıldığını kamuoyuna açıklamak|E) Bir bilgisayar programının hangi dilde yazıldığını kamuoyuna açıklamak|Programın yazıldığı dili (C++, Java vb.) söylemek telif ihlali doğurmaz, hukuki bir tasarruf eylemi değildir. Diğerleri mali/manevi hakların kullanımıdır.",
    "Vize 2023,Vize 2026,Banko|Aşağıdakilerden hangisi bir alan adı uyuşmazlığı doğurmaz?|A) ABD'nin tekelini kırmak gerektiğini iddia eden yazarın düşüncelerini yayınlaması~B) Süresi dolmamış bir alan adının iptal edilmesi~C) Meşhur marka ile örtüşen ibarenin tescil edilmesi~D) Eser adıyla örtüşen ibarenin tescili~E) Uygun hukuki temel olmadan kayıt yapılması|A) ABD'nin tekelini kırmak gerektiğini iddia eden yazarın düşüncelerini yayınlaması|Yazarın fikrini beyan etmesi 'İfade Özgürlüğü' kapsamındadır, mülkiyet veya tescil çatışması barındıran bir alan adı uyuşmazlığı yaratmaz.",
    "Vize 2023,Vize 2024,Vize 2026,Büt 2024,Tek Ders 2024,Banko|Aşağıdakilerden hangisi bilişim hukukunun asli konularından değildir?|A) Bilgisayar programlarının nasıl programlanacağı~B) Sosyal medya hukuki rejimi~C) Elektronik sözleşmeler~D) Alan adları hukuki rejimi~E) İnternette reklam hukuku sorunları|A) Bilgisayar programlarının nasıl programlanacağı|Bir yazılımın hangi algoritmayla, hangi kod diliyle yazılacağı mühendislik/teknik bir konudur. Hukuk kuralları ve uyuşmazlıkları ile ilgilenmez.",
    "Final 2023,Final 2024,Final 2025,Banko|Sosyal ağ sağlayıcıların tanımlandığı kanun aşağıdakilerden hangisidir?|A) Elektronik Ticaret Kanunu~B) Sosyal Medya Kanunu~C) Türk Borçlar Kanunu~D) Evrensel Hizmet Kanunu~E) İnternet Kanunu (5651 Sayılı Kanun)|E) İnternet Kanunu (5651 Sayılı Kanun)|Kamuoyunda Sosyal Medya Yasası olarak bilinen düzenlemeler ayrı bir yasa değildir, 5651 Sayılı İnternet Kanunu'nun içine eklenmiştir.",
    "Final 2023,Final 2024,Büt 2024,Tek Ders 2024,Banko|Aşağıdakilerden hangisi doğrudan bilişim hukuku kapsamına giren bir reklam hukuku sorunu doğurma potansiyeline sahip değildir?|A) Önceden olurunu/iznini almadan bir kişiye reklam e-postaları göndermek~B) Web sitesinde başkalarının reklam vermesini sağlamak~C) Bir reklam filmi yaptırmak/ürettirmek üzere film şirketine e-posta göndermek~D) Arama motoru üzerinden anahtar sözcük reklamı yapmak~E) Alışveriş platformunun mağazalara kendi reklamını zorunlu kılması|C) Bir reklam filmi yaptırmak/ürettirmek üzere film şirketine e-posta göndermek|Bir ajansa reklam çektirmek için atılan e-posta standart bir ticari iletişim/iş görüşmesidir, doğrudan bilişim-reklam uyuşmazlığı yaratmaz.",
    "Final 2023,Tek Ders 2024,Banko|Doğa gezisi tutkunu A, gezilerinde çektiği fotoğraflarını web sitesinde yayınlamaktadır. A'nın fotoğraflarına çok sayıda link verilmeye başlanmıştır. Hukuki altyapı açısından aşağıdakilerden hangisi yanlıştır?|A) A'nın fotoğrafları iradesi hilafına internette yayınlanmış olsaydı, ticari amaçlı olanların bilmesi gerektiği karinesi işlerdi.~B) A, fotoğrafları teknik önlem olmadan web sitesine koyduğundan, normal kullanıcılar her durumda bunu indirip kendi hesaplarında sorunsuz paylaşabilirler.~C) Normal link ile frame link arasındaki fark umuma iletim hakkı açısından kural olarak önemli değildir.~D) Teknik önlem yoksa normal kullanıcılar serbestçe link verebilirler.~E) İradesi hilafına yayınlansaydı normal kullanıcıların link vermesi kural olarak hukuka uygun olurdu.|B) A, fotoğrafları teknik önlem olmadan web sitesine koyduğundan, normal kullanıcılar her durumda bunu indirip kendi hesaplarında sorunsuz paylaşabilirler.|Şifre/önlem olmaması eserin telifinden vazgeçildiği anlamına gelmez. İndirip kendi hesabına tekrar yüklemek (paylaşmak) ticari amaçsız da olsa çoğaltma ve umuma iletim ihlalidir.",
    "Final 2023,Final 2024,Büt 2024,Tek Ders 2024,Banko|Aşağıdakilerden hangisi sosyal medya ve buna dair muhtemel hukuki sorunlar kapsamında değerlendirilmez?|A) Bir arkadaşının yazdığı şiirini izinsiz paylaşmak~B) Gerçekte yaşanmamış bir deneyimi yaşanmış gibi göstererek rakip ürünü kötülemek~C) Fenomenin arka planda gizli marka reklamı yapması~D) Sosyal hesaplarının hukuki niteliği~E) İnternetten elektronik imza kullanarak bir işlem yapmak|E) İnternetten elektronik imza kullanarak bir işlem yapmak|E-imza ile resmi evrak imzalamak e-devlet/e-ticaret konusudur, doğrudan sosyal medyanın platform içi etkileşim sorunlarından biri değildir.",
    "Final 2023,Final 2024,Vize 2025,Banko|Aşağıdakilerden hangisi fikri mülkiyet hukuku kapsamında kalan bir hak değildir?|A) Bir bilgisayar programının yazılması sürecinde kaynak bulup, fotokopi yapıp çalışanlara sunan personelin işverenden ücret talep etme hakkı~B) Algoritmayı geliştiren ve uygulayan kişinin buluş sahibi olarak anılma hakkı~C) Eser sahibinin anılma hakkı~D) Yazarın eserini çoğaltma hakkı~E) Roman yazarının nüshalarına ilişkin yayma hakkı|A) Bir bilgisayar programının yazılması sürecinde kaynak bulup, fotokopi yapıp çalışanlara sunan personelin işverenden ücret talep etme hakkı|Fotokopi çekmek veya dosya taşımak fikri yaratım süreci değildir. Ücret/maaş talep edilmesi İş Hukuku'nun konusudur, telif hakkı doğurmaz.",
    "Final 2023,Final 2024,Banko,Dikkat|Bilişim suçları açısından aşağıdakilerden hangisi yanlıştır?|A) Klasik suçların bilişim ortamında işlenmesi de bilişim suçu sorunu oluşturur.~B) FSEK gibi özel kanunlarda düzenlenmiş bilişim suçları vardır.~C) Kişilik hakkı ihlalleri bilişim suçları kapsamında kalan en önemli konu olduğundan, bilişim suçları kısmen TMK'da düzenlenmiştir.~D) İlk yasal düzenlemeler genellikle bilişim suçlarına ilişkindir.~E) Bilişim suçlarının asıl olarak düzenlendiği kanun TCK'dır.|C) Kişilik hakkı ihlalleri bilişim suçları kapsamında kalan en önemli konu olduğundan, bilişim suçları kısmen TMK'da düzenlenmiştir.|⚠️ DİKKAT: TMK (Medeni Kanun) hapis veya suç düzenlemez, tazminat ve medeni hakları düzenler. Bilişim suçlarının asıl yeri Türk Ceza Kanunu'dur (TCK).",
    "Final 2024|Arama motorları üzerinden anahtar sözcük reklamcılığında negatif eşleme açısından aşağıdakilerden hangisi doğrudur?|A) Negatif eşlemede seçilen türe göre, anahtar sözcük ile örtüşen sözcüklerde reklam gösterilmez.~B) SMK m.7 negatif eşlemeyi de kapsamaktadır.~C) Bu bir banner reklam türüdür.~D) Anahtar sözcük ile arama sözcüğü aynı olduğunda reklam gösterilir.~E) Sadece dar eşleme yapılabildiğinden hukuki sorun çıkmaz.|A) Negatif eşlemede seçilen türe göre, anahtar sözcük ile örtüşen sözcüklerde reklam gösterilmez.|Dijital pazarlamada negatif eşleme, belirli kelimeler aratıldığında sizin reklamınızın gizlenmesini (gösterilmemesini) sağlayan özelliktir.",
    "Final 2024|Aşağıdakilerden hangisi arama motoru bazı reklamlara dair bir hukuki sorun olarak görülemez?|A) Markasıyla örtüşen işareti negatif eşleme listesine eklemeyi talep etmek~B) Sanatçının adını rızasız anahtar sözcük seçmek~C) Yazarın roman başlığını rızasız seçmek~D) Başkasının markasıyla reklam yapmak~E) Kişinin yıllar önce yaşadığı bir olumsuzluğun aramalarda öne çıkmasını engellemek için uğraşmak|E) Kişinin yıllar önce yaşadığı bir olumsuzluğun aramalarda öne çıkmasını engellemek için uğraşmak|E şıkkı organik arama sonuçlarından haber sildirme ile yani 'Unutulma Hakkı' ile ilgilidir, anahtar sözcük reklamcılığı (AdWords) ihlali değildir.",
    "Final 2024,Final 2025,Banko|Aşağıdakilerden hangisi bilişim hukuku kapsamında kalan bir sosyal medya hukuku sorunu değildir?|A) Sosyal medya hesabı sahibinin ölümü sonrasında hesabın mirasçılara kalıp kalmayacağı~B) Sosyal medyada tanışan iki kişinin sonradan nişanlanması~C) İnternet fenomeninin ilaç ve sağlık malzemeleri pazarlaması~D) Öğrencilerin öğretmenleri hakkında gerçeği yansıtmayan değerlendirmelerde bulunmaları~E) Sosyal ağ sağlayıcının yargı kararını yirmi dört saat içinde uygulamaması|B) Sosyal medyada tanışan iki kişinin sonradan nişanlanması|İnternette tanışıp nişanlanmak günlük bir yaşam/sosyal olaydır ve Aile Hukuku'nu ilgilendirir, çözülmesi gereken bir sosyal medya uyuşmazlığı değildir.",
    "Vize 2024,Final 2024,Banko|Aşağıdakilerden hangisi güncel alan adı sistemimiz açısından doğrudan aktörlerden biri olarak görülebilir?|A) Erişim sağlayıcılar~B) İTÜ~C) Alan adı kayıt kuruluşları~D) Yer sağlayıcılar~E) Türkpatent|C) Alan adı kayıt kuruluşları|Alan adı sisteminin (TRABİS) işleyişinde domain satışını gerçekleştiren 'Alan Adı Kayıt Kuruluşları' (Nokta AŞ, METU vb.) doğrudan aktörlerdir.",
    "Final 2024,Final 2025,Banko|Bilişim sistemine girme suçu (TCK m. 243) açısından aşağıdakilerden hangisi doğrudur?|A) Sisteme yeni veri eklenmesi de şarttır.~B) Taksirle de işlenebilir.~C) Bu suçta bir zarar veya sonuç elde edilmesi gerekmez (burada zarar bir unsur değildir).~D) Suça iştirak mümkün değildir.~E) Teşebbüse uygun bir suç değildir.|C) Bu suçta bir zarar veya sonuç elde edilmesi gerekmez (burada zarar bir unsur değildir).|Sisteme izinsiz giriş yapmak tek başına bir 'soyut tehlike' suçudur. İçeride dosya silmese veya veri eklemese dahi login olduğu an suç oluşur.",
    "Final 2024,Final 2025,Banko|Aşağıdakilerden hangisi FSEK itibariyle programcının (eser sahibinin) kanunda düzenlenmiş mali haklarından biridir?|A) Programı yayma hakkı~B) Takip edilmeme hakkı~C) Programı işlettirme hakkı~D) Program hakkında patent alma hakkı~E) Programı tescil ettirme hakkı|A) Programı yayma hakkı|FSEK kapsamındaki 5 temel mali hak: Çoğaltma, Yayma, Temsil, İşleme ve Umuma İletim'dir. Diğer şıklar yasal mali hak değildir.",
    "Final 2024|Aşağıdakilerden hangisi e-ticaret hukuku açısından ele alınabilecek bir konu değildir?|A) İki şirketin Skype üzerinden görüşerek sözleşme yapması~B) Şirketin web sitesinde diğerinin ürünlerini kötüleyici ibareler kullanması~C) Olağan (ticari olmayan) kullanıcının son gittiği tatil görüntülerini paylaşması~D) Kredi kartıyla ödeme yapıp dolandırılması~E) Tüketicinin platformda diğer bir tüketiciye satması|C) Olağan (ticari olmayan) kullanıcının son gittiği tatil görüntülerini paylaşması|E-ticaret ticari işlemlerle ilgilenir. Ticari amacı olmayan bir bireyin tatil fotoğrafı yüklemesi e-ticaret konusu olamaz.",
    "Final 2024,Vize 2025,Banko|Aşağıdakilerden hangisi fikri mülkiyet hukukuyla ilgili bir temel ilkeyi karşılar veya ifade eder?|A) Bağımlı çalışanların yarattıkları üzerinde herhangi bir haklarının olmaması~B) Bir fikri ürünün fikri mülkiyet hukukunun farklı alanlarında aynı anda birlikte korunabilmesinin mümkün olması~C) Sadece ticari önemi olanların korunması~D) Sadece ülke sınırları içinde korunması~E) Sadece eşya haline gelmiş olanların korunması|B) Bir fikri ürünün fikri mülkiyet hukukunun farklı alanlarında aynı anda birlikte korunabilmesinin mümkün olması|Bir ürün hem FSEK (Eser) hem de SMK (Tasarım/Patent) olarak çoklu/kümülatif korumadan faydalanabilir.",

    "Final 2024,Final 2025,Banko|Aşağıdakilerden hangisi kişisel verilerin işlenmesi açısından geçerli genel ilkelerden değildir?|A) Belirli, açık ve meşru amaçlarla işlenmesi~B) Şeffaflık ilkesi~C) Güvenilirlik ve gizlilik~D) Sosyal medyada açık tutulan kişisel verilerin işlenmesinin kural olarak serbestliği~E) Hukuka ve dürüstlük kuralına uygunluk|D) Sosyal medyada açık tutulan kişisel verilerin işlenmesinin kural olarak serbestliği|Telefonunuzu kendi rızanızla sosyal medyada public (açık) yapsanız bile, şirketler bunu izinsiz alıp reklam için serbestçe işleyemez.",
    "Final 2024|Hukukumuz açısından kurallar hiyerarşisinde en üste yer alan hukuk kaynağı aşağıdakilerden hangisidir?|A) Anayasa~B) Maddi anlamda kanunlar~C) Cumhurbaşkanlığı Kararnameleri~D) Milletlerarası andlaşmalar~E) Şekli anlamda kanunlar|A) Anayasa|Normlar Hiyerarşisinde (Kelsen Piramidi) en üstte her zaman Anayasa bulunur.",

    "Final 2024|Aşağıdakilerden hangisi yer sağlayıcı açısından bir yükümlülüktür?|A) İçeriğin doğruluğunu ve hukuka uygunluğunu denetlemek~B) Hukuka aykırı faaliyet yapılıp yapılmadığını denetlemek~C) Kullanıcıların girdikleri verileri düzenli gözlemleyip saklamak~D) Arama motorlarında kullanılmasını engellemek~E) İçeriğin hukuka aykırı olduğu yargı sürecinde anlaşıldığında ve bildirim yapıldığında söz konusu içeriği yayından çıkarmak|E) İçeriğin hukuka aykırı olduğu yargı sürecinde anlaşıldığında ve bildirim yapıldığında söz konusu içeriği yayından çıkarmak|Yer sağlayıcının (sunucunun) önceden denetleme yükümlülüğü yoktur. Yalnızca mahkeme veya yetkili merciden bildirim/karar gelirse içeriği kaldırmak zorundadır (Uyar-Kaldır).",

let allOpen = false;

const parsedSorular = rawData.map(row => {
    let parts = row.split('|');
    if(parts.length < 5) return null;
    return { c: parts[0].split(','), q: parts[1], o: parts[2].split('~'), a: parts[3], e: parts[4] };
}).filter(x => x !== null);

function ekranaCiz(liste) {
    const cont = document.getElementById('q-container');
    cont.innerHTML = '';
    if(liste.length === 0) { cont.innerHTML = '<h3 style="text-align:center; color:#e74c3c;">Soru bulunamadı.</h3>'; return; }

    liste.forEach((s, i) => {
        let tagsHTML = s.c.map(c => {
            let ct = c.trim();
            if(ct.includes("Kez Çıktı") || ct === "Banko") return `<span class="tag tag-h">🔥 ${ct}</span>`;
            if(ct.includes("Dikkat")) return `<span class="tag" style="background:#e67e22;">⚠️ Dikkat!</span>`;
            return `<span class="tag tag-e">📅 ${ct}</span>`;
        }).join('');

        let optsHTML = s.o.map(o => `<li>${o}</li>`).join('');
        cont.innerHTML += `<div class="card"><div class="tags">${tagsHTML}</div><p class="q-text">${i+1}. ${s.q}</p><ul class="opt">${optsHTML}</ul><button class="ans-btn" onclick="tgl(this)">Cevabı Göster</button><div class="ans-box"><p class="ans-true">✔️ Doğru Cevap: ${s.a}</p><p class="exp-text">💡 Açıklama: ${s.e}</p></div></div>`;
    });
}

function filter(tag) {
    let search = tag.trim().toLowerCase();
    
    document.querySelectorAll('#kategori-secici, .btn').forEach(b => {
        if(b.tagName !== 'SELECT' && b.id !== 'arama' && !b.classList.contains('btn-g')) b.classList.remove('active');
    });

    let filtered = (search === 'all') ? parsedSorular : parsedSorular.filter(s => s.c.some(c => {
        let dataTag = c.trim().toLowerCase();
        if (search === 'banko') return dataTag.includes('kez çıktı') || dataTag === 'banko';
        if (search === 'vize') return dataTag.includes('vize');
        if (search === 'final') return dataTag.includes('final');
        if (search === 'büt') return dataTag.includes('büt');
        if (search === 'tek ders') return dataTag.includes('tek ders');
        if (search === 'dikkat') return dataTag.includes('dikkat');
        return dataTag.includes(search);
    }));
    ekranaCiz(filtered);
}

function aramaYap() {
    let kelime = document.getElementById('arama').value.toLowerCase().trim();
    ekranaCiz(kelime === '' ? parsedSorular : parsedSorular.filter(s => s.q.toLowerCase().includes(kelime) || s.e.toLowerCase().includes(kelime)));
}

function tgl(btn) {
    const box = btn.nextElementSibling;
    box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    btn.textContent = (box.style.display === 'block') ? 'Cevabı Gizle' : 'Cevabı Göster';
}

function toggleAll() {
    allOpen = !allOpen;
    document.querySelectorAll('.ans-box').forEach(b => b.style.display = allOpen ? 'block' : 'none');
    document.querySelectorAll('.ans-btn').forEach(b => b.textContent = allOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
}

window.onload = () => filter('all');
</script>

<script>
// AUZEF GÖRÜNÜM & CİHAZ PROFİLİ YÖNETİCİSİ
function setAuzefDeviceProfile(dev) {
    if (dev === 'auto') {
        const w = window.innerWidth;
        dev = (w <= 640) ? 'mobile' : 'web';
    }
    document.documentElement.setAttribute('data-device', dev);
    try { localStorage.setItem('auzef_device_profile', dev); } catch(e){}
    const sel = document.getElementById('deviceProfileSelect');
    if (sel && sel.value !== dev && sel.value !== 'auto') sel.value = dev;
}

function toggleAuzefTheme() {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('auzef_theme', cur); } catch(e){}
    const btn = document.getElementById('auzefThemeToggleBtn');
    if (btn) btn.textContent = cur === 'dark' ? '☀️ Açık' : '🌙 Koyu';
}

(function initAuzefViewMode() {
    try {
        const savedDev = localStorage.getItem('auzef_device_profile') || 'auto';
        setAuzefDeviceProfile(savedDev);
        const sel = document.getElementById('deviceProfileSelect');
        if (sel) sel.value = savedDev;

        const savedTheme = localStorage.getItem('auzef_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        const btn = document.getElementById('auzefThemeToggleBtn');
        if (btn) btn.textContent = savedTheme === 'dark' ? '☀️ Açık' : '🌙 Koyu';
    } catch(e){}
})();
</script>
