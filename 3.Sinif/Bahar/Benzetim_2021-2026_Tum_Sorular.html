    { q: `Process Analyzer (PAN) terminolojisinde, sistemi iyileştirmek için kullanıcının değerlerini değiştirebildiği karar değişkenlerine (Örn: Kaynak kapasitesi, değişken değerleri) ne ad verilir?`, options: [`A) SCENARIO (Senaryo)`, `B) RESPONSE (Yanıt)`, `C) CONTROL (Kontrol)`, `D) ENTITY (Varlık)`, `E) SET (Küme)`], ans: `C) CONTROL (Kontrol)`, exp: `Kontroller (Controls), kullanıcının elinde olan ve sistemi değiştirebilen girdilerdir (Kaç veznedar olacak, bant hızı ne olacak vb.).`, exams: [`Ünite 13`] },
    { q: `Process Analyzer (PAN) terminolojisinde, yapılan değişiklikler sonucu elde edilen ve değerlendirmek istenen simülasyon çıktısına (Örn: Kuyruktaki ortalama sayı, bekleme süresi) ne ad verilir?`, options: [`A) CONTROL`, `B) RESPONSE (Yanıt/Tepki)`, `C) SCENARIO`, `D) ROUTE`, `E) ALLOCATION`], ans: `B) RESPONSE (Yanıt/Tepki)`, exp: `Yanıtlar (Responses), sistemin girdi ayarlarına (kontrollere) verdiği tepkidir; yani performans ölçütlerimiz olan sonuçlardır.`, exams: [`Ünite 13`] },
    { q: `Process Analyzer'da belirli "Kontrol" değerlerinin bir araya getirilerek simülasyonun çalıştırıldığı ve sonuçlarının (Response) alındığı her bir durum kümesine ne ad verilir?`, options: [`A) OPTIMIZATION`, `B) REPLICATION`, `C) SCENARIO (Senaryo)`, `D) BATCH`, `E) EVENT`], ans: `C) SCENARIO (Senaryo)`, exp: `Örneğin; "Kontrol 1: 5 veznedar olsun, Kontrol 2: Hızlı makine olsun" şeklinde kurulan durum bir "Senaryo"dur. PAN bunları alt alta çalıştırır.`, exams: [`Ünite 13`] },
    { q: `Process Analyzer (PAN) aracı Arena programı içerisinde hangi ana menü sekmesinden çağrılır?`, options: [`A) View (Görünüm)`, `B) Edit (Düzenle)`, `C) Object (Nesne)`, `D) Tools (Araçlar)`, `E) Run (Çalıştır)`], ans: `D) Tools (Araçlar)`, exp: `Input Analyzer, Output Analyzer, Process Analyzer ve OptQuest gibi ek yazılımların tümü Arena'nın Tools (Araçlar) menüsünden başlatılır.`, exams: [`Ünite 13`] },
    { q: `Process Analyzer'da kurulan senaryoları çalıştırmak (simülasyonu başlatmak) için RUN sekmesindeki hangi seçeneğe tıklanmalıdır?`, options: [`A) PLAY`, `B) START`, `C) EXECUTE`, `D) GO`, `E) CHECK`], ans: `D) GO`, exp: `PAN arayüzünde seçilen senaryoları sırayla işleme almak için Run menüsündeki "Go" (Git) komutu kullanılır.`, exams: [`Ünite 13`] },
    { q: `Process Analyzer çalışma sayfasında (Grid), simülasyonların çalıştırılma durumunu ve hangi çoğaltmanın (Replication) işlemde olduğunu izlemek için kullanılan sütun hangisidir?`, options: [`A) Status Sütunu`, `B) Control Sütunu`, `C) Response Sütunu`, `D) Rep Sütunu`, `E) Name Sütunu`], ans: `D) Rep Sütunu`, exp: `Rep (Replication) sütunu, PAN'ın o senaryo için o an kaçıncı denemeyi (çoğaltmayı) yaptığını göstererek süreci izlemenizi sağlar.`, exams: [`Ünite 13`] },
    { q: `Process Analyzer'da elde edilen sonuçları (Response değerlerini) görselleştirmek, 3 boyutlu grafikler oluşturmak için "Add Graphics" ile açılan pencere hangisidir?`, options: [`A) Chart Wizard (Grafik Sihirbazı)`, `B) Plot Maker`, `C) Histogram Editor`, `D) Output Viewer`, `E) 3D Animator`], ans: `A) Chart Wizard (Grafik Sihirbazı)`, exp: `Çıkan sonuca (Örneğin kar oranına) sağ tıklayıp Insert Chart dendiğinde "Chart Wizard" açılarak grafiğin adım adım çizilmesini sağlar.`, exams: [`Ünite 13`] },
    { q: `Aşağıdakilerden hangisi Advanced Process şablonunda bulunan bir modül DEĞİLDİR?`, options: [`A) SIGNAL`, `B) MATCH`, `C) RECORD`, `D) DELAY`, `E) PICKUP`], ans: `C) RECORD`, exp: `RECORD modülü en temel istatistik tutma aracı olduğu için "Basic Process" (Temel İşlem) şablon panelinde yer alır. Diğerleri Advanced (Gelişmiş) modüllerdir.`, exams: [`Ünite 13`] },
// --- 14. Ünite: Arena ile Benzetim Modellerinin Değerlendirilmesi Soruları ---
    { q: `Bir simülasyon problemini Arena'da modellemeye başlamadan önce yapılması önerilen en faydalı ilk adım aşağıdakilerden hangisidir?`, options: [`A) Doğrudan modülleri tuvale sürüklemek`, `B) Sistemin iş akışını (Workflow) çizmek`, `C) Animasyon grafiklerini ayarlamak`, `D) İstatistik raporlarını formatlamak`, `E) Optimizasyon eklentisini açmak`], ans: `B) Sistemin iş akışını (Workflow) çizmek`, exp: `Modelleme esnasında uygulanması gereken varsayımları daha kolay kurgulamak ve kontrol etmek için önce kâğıt üzerinde sistemin iş akışı çizilmelidir.`, exams: [`Ünite 14`] },
    { q: `İmalat atölyesi örneğinde, gelen parçaların %30'unun tornaya, %60'ının frezeye ve %10'unun taşlamaya gitmesini modellemek için DECIDE modülünde hangi Type (Tip) seçilmelidir?`, options: [`A) 2-way by Chance`, `B) N-way by Condition`, `C) N-way by Chance`, `D) 2-way by Condition`, `E) Split existing batch`], ans: `C) N-way by Chance`, exp: `Üç farklı olasılık (yüzde) durumu olduğu için çoklu şans faktörünü ifade eden "N-way by Chance" seçeneği kullanılmalıdır.`, exams: [`Ünite 14`] },
    { q: `İmalat atölyesi modelinde, DECIDE modülü yerine parçalara varış oranlarına göre tip etiketi yapıştırmak için ASSIGN modülünde hangi fonksiyon kullanılır?`, options: [`A) EXPO`, `B) NORM`, `C) DISC`, `D) TRIA`, `E) UNIF`], ans: `C) DISC`, exp: `Kesikli (Discrete) olasılıkları atamak için DISC fonksiyonu kullanılır. Bu fonksiyon kümülatif (birikimli) olasılık mantığıyla çalışır.`, exams: [`Ünite 14`] },
    { q: `DISC fonksiyonu (Örn: DISC(0.3, 1, 0.9, 2, 1, 3)) kullanılarak yapılan olasılık tanımlamalarında dikkat edilmesi gereken matematiksel kural nedir?`, options: [`A) Değerler her zaman negatif olmalıdır.`, `B) Olasılıklar birbirinden bağımsız girilmelidir.`, `C) Kümülatif (birikimli) olasılıklar kullanılmalıdır.`, `D) Son değer her zaman 0 olmalıdır.`, `E) Sadece tam sayılar girilmelidir.`], ans: `C) Kümülatif (birikimli) olasılıklar kullanılmalıdır.`, exp: `DISC fonksiyonu çalışırken olasılıkları toplayarak ilerler; bu yüzden %30, %60, %10 oranları (0.3), (0.3+0.6=0.9), (0.9+0.1=1) şeklinde kümülatif yazılır.`, exams: [`Ünite 14`] },
    { q: `Torna işleminden çıkan parçaların %6'sının hatalı çıkıp hurdaya ayrılmasını, kalanların ise depoya gitmesini modellemek için hangi modül ve tip seçilmelidir?`, options: [`A) ASSIGN - Variable`, `B) DECIDE - 2-way by Chance`, `C) RECORD - Count`, `D) DECIDE - 2-way by Condition`, `E) SEPARATE - Duplicate Original`], ans: `B) DECIDE - 2-way by Chance`, exp: `Sağlam (%94) ve Hatalı (%6) olmak üzere sadece 2 şansa bağlı sonuç olduğu için "2-way by Chance" kullanılır.`, exams: [`Ünite 14`] },
    { q: `Atölyede bulunan 2 adet freze ve 2 adet torna makinesinin kapasite miktarlarını (adetlerini) sisteme tanıtmak için hangi çalışma sayfası (Spreadsheet) doldurulmalıdır?`, options: [`A) VARIABLE`, `B) ENTITY`, `C) SCHEDULE`, `D) QUEUE`, `E) RESOURCE`], ans: `E) RESOURCE`, exp: `Makineler ve personeller birer kaynaktır. Bu kaynakların sayıları/kapasiteleri RESOURCE çalışma sayfasından girilir.`, exams: [`Ünite 14`] },
    { q: `Arena'da simülasyonun 10 kez tekrarlanması (koşum sayısı) ve her birinin 2 saat sürmesi için gerekli ayarlamalar (Replication Length, Number of Replications) hangi menüden yapılır?`, options: [`A) View -> Toolbars`, `B) Run -> Setup`, `C) Tools -> Input Analyzer`, `D) Edit -> Entity Picture`, `E) Object -> Connect`], ans: `B) Run -> Setup`, exp: `Simülasyonun uzunluğu, birimi ve tekrar sayısı gibi deneysel çalıştırma parametrelerinin tümü Run (Çalıştır) menüsü altındaki Setup (Kurulum) seçeneğinden ayarlanır.`, exams: [`Ünite 14`] },
    { q: `Havaalanı güvenlik modelinde, kontrol masasında çalışan personelin 4 saat çalışıp sonra yarımşar saatlik yemek molasına çıkması durumunu (vardiya sistemi) modellemek için RESOURCE modülünün kapasite tipi ne seçilmelidir?`, options: [`A) Fixed Capacity`, `B) Random Extraction`, `C) Based on Schedule`, `D) Infinite Capacity`, `E) Expression`], ans: `C) Based on Schedule`, exp: `Personel sayısının mesai ve mola saatlerine göre değiştiği (dinamik kapasite) durumlarda "Based on Schedule" (Çizelgeye Bağlı) seçilir.`, exams: [`Ünite 14`] },
    { q: `"Based on Schedule" kapasite tipine sahip bir kaynak için, vardiya detaylarının (mesai ve mola sürelerinin) girildiği modül aşağıdakilerden hangisidir?`, options: [`A) SET`, `B) RECORD`, `C) VARIABLE`, `D) SCHEDULE`, `E) BATCH`], ans: `D) SCHEDULE`, exp: `Vardiya saatleri, kapasitenin ne zaman azalıp ne zaman artacağı SCHEDULE (Çizelge) çalışma sayfasından grafiksel veya metin olarak tanımlanır.`, exams: [`Ünite 14`] },
    { q: `SCHEDULE çalışma sayfasında vardiya zaman periyotlarını kolayca grafik üzerinden çizerek tanımlamak için hangi butona tıklanmalıdır?`, options: [`A) Value`, `B) Name`, `C) Duration`, `D) Expression`, `E) Allocate`], ans: `C) Duration`, exp: `Duration (Süre) butonuna tıklandığında, kapasitenin zaman içindeki değişimini çubuk grafiği gibi çizerek belirleyebileceğiniz görsel bir arayüz açılır.`, exams: [`Ünite 14`] },

// --- TÜRKÇE KARAKTER UYUMLU VE KUSURSUZ TESPİT EDİCİ (V3 PRO) ---
const trKucuk = (str) => {
    if (!str) return "";
    return str.replace(/I/g, 'ı').replace(/İ/g, 'i').toLowerCase();
};

const cikmisKonular = [
    "doğrulama", "kavramsal model", "çıktı analizi", "sonsuz ufuk", 
    "ısınma süresi", "parti ortalamaları", "rejeneratif", "optquest", 
    "1993", "siman", "nesne menüsü", "seize", "number busy", 
    "batch", "separate", "lowest attribute", "advanced process", 
    "delay", "pickstation", "input analyzer", "output analyzer", 
    "3 kategori", "genel amaç", "karar değişkeni", "metamodel"
];

// Geçmiş sınav sorularını ayır (içinde "ünite" geçmeyenler)
const gecmisSorular = sorular.filter(s => !s.exams.some(e => trKucuk(e).includes("ünite")));

sorular.forEach(soru => {
    // Eğer bu bir ünite sorusuysa
    if(soru.exams.some(e => trKucuk(e).includes("ünite"))) {
        let metin = trKucuk(soru.q + " " + soru.exp + " " + soru.ans + " " + soru.options.join(" "));
        
        // Hangi anahtar kelimeleri içeriyor?
        let eslesenKelimeler = cikmisKonular.filter(konu => metin.includes(trKucuk(konu)));

        if(eslesenKelimeler.length > 0) {
            // Etiketi ekle
            if(!soru.exams.includes("🔥 Çıkmış Konu Benzeri")) {
                soru.exams.push("🔥 Çıkmış Konu Benzeri");
            }

            // Gerçek çıkmış soruyu bul (şıkları ve cevabı dahil tarayarak)
            let ornekGecmisSoru = gecmisSorular.find(gs => {
                let gsMetin = trKucuk(gs.q + " " + gs.exp + " " + gs.ans + " " + gs.options.join(" "));
                return eslesenKelimeler.some(kelime => gsMetin.includes(trKucuk(kelime)));
            });

            // METNİ DEĞİŞTİRMEK YERİNE, OBJEYE KAYDET (Bu sayede HTML asla ezip bozamaz!)
            if (ornekGecmisSoru) {
                soru.benzerSoruObjesi = ornekGecmisSoru;
            }
        }
    }
});

let allOpen = false;

function ekranaCiz(data) {
    const container = document.getElementById('q-container');
    container.innerHTML = '';
    data.forEach((soru, index) => {
        let tagsHtml = soru.exams.map(exam => {
            let cls = 'tag';
            let text = exam.toLowerCase();
            if(text.includes('vize')) cls += ' tag-u';
            else if(text.includes('final')) cls += ' tag-e';
            else if(text.includes('büt')) cls += ' tag-h';
            else if(text.includes('çıktı') || text.includes('banko')) cls += ' tag-h';
            else if(text.includes('dikkat')) cls += ' tag-e';
            else if(text.includes('benzeri')) cls += ' tag-b';
            else cls += ' tag-u';
            return `<span class="${cls}">${exam}</span>`;
        }).join('');

        let optionsHtml = soru.options.map(opt => `<li>${opt}</li>`).join('');
        let displayState = allOpen ? 'block' : 'none';
        let btnText = allOpen ? 'Cevabı Gizle' : 'Cevabı Göster';

      // EĞER BENZER SORU BULUNDUYSA, KUTUYU BURADA HTML OLARAK OLUŞTUR
        let benzerKutuHtml = '';
        if(soru.benzerSoruObjesi) {
            // Sınav yıllarını aralarına ayraç koyarak birleştir
            let hangiSinav = soru.benzerSoruObjesi.exams.join(' | ');
            
            benzerKutuHtml = `
            <div style="background: #fdf2e9; padding: 15px; border-left: 6px solid #8e44ad; border-radius: 8px; margin-top: 15px; font-size: 0.95em; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <span style="color:#8e44ad; font-size: 1.1em; display:block; margin-bottom: 5px;"><strong>🎯 İŞTE O ÇIKMIŞ SORU:</strong></span>
                <span style="display:inline-block; background: #8e44ad; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; margin-bottom: 8px;">📌 ${hangiSinav}</span>
                <i style="color: #2c3e50; font-size: 1.05em; display:block; margin-bottom: 8px;">"${soru.benzerSoruObjesi.q}"</i>
                <strong style="color: #d35400;">Cevabı Neymiş:</strong> <b style="color:#27ae60;">${soru.benzerSoruObjesi.ans}</b>
            </div>`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="tags">${tagsHtml}</div>
            <div class="q-text">${index + 1}. ${soru.q}</div>
            <ul class="opt">${optionsHtml}</ul>
            <button class="ans-btn" onclick="tgl(this)">${btnText}</button>
            <div class="ans-box" style="display: ${displayState}">
                <div class="ans-true">✔️ Doğru Cevap: ${soru.ans}</div>
                <div class="exp-text">💡 <strong>Açıklama:</strong> ${soru.exp}</div>
                ${benzerKutuHtml}
            </div>
        `;
        container.appendChild(card);
    });
}

function filter(search) {
    let kelime = document.getElementById('arama').value.toLowerCase().trim();
    let filtered = (search === 'all') ? sorular : sorular.filter(s => s.exams.some(e => {
        let text = e.toLowerCase();
        if (search.toLowerCase() === 'banko') return text.includes('çıktı');
        return text.includes(search.toLowerCase());
    }));
    
    if (kelime !== '') {
        filtered = filtered.filter(s => s.q.toLowerCase().includes(kelime) || s.exp.toLowerCase().includes(kelime) || s.options.join(' ').toLowerCase().includes(kelime));
    }
    ekranaCiz(filtered);
}

function aramaYap() {
    let val = document.getElementById('kategori-secici').value;
    filter(val);
}

function tgl(btn) {
    const box = btn.nextElementSibling;
    if (box.style.display === 'block') {
        box.style.display = 'none';
        btn.textContent = 'Cevabı Göster';
    } else {
        box.style.display = 'block';
        btn.textContent = 'Cevabı Gizle';
    }
}

function toggleAll() {
    allOpen = !allOpen;
    const btns = document.querySelectorAll('.ans-btn');
    const boxes = document.querySelectorAll('.ans-box');
    const globalBtn = document.getElementById('globalToggleBtn');
    
    btns.forEach(btn => btn.textContent = allOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
    boxes.forEach(box => box.style.display = allOpen ? 'block' : 'none');
    globalBtn.textContent = allOpen ? '👁️ Tüm Cevapları Kapat' : '👁️ Tüm Cevapları Aç';
}

window.onload = () => {
    ekranaCiz(sorular);
};
</script>
