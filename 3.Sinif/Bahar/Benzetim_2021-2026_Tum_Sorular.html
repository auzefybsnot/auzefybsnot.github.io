    { q: `Model varsayımları hangi iki ana sınıfa ayrılır?`, options: [`A) Statik ve Dinamik`, `B) Kesikli ve Sürekli`, `C) Yapısal varsayımlar ve Veri varsayımları`, `D) Deterministik ve Stokastik`, `E) İyimser ve Kötümser`], ans: `C) Yapısal varsayımlar ve Veri varsayımları`, exp: `Model oluşturulurken sistemin işleyiş mantığı (yapısal) ve kullanılan sayısal veriler (veri) üzerine iki tür varsayım yapılır.`, exams: [`Ünite 8`] },
    { q: `Banka modelinde yer alan "Müşterilere ilk gelene ilk hizmet (FIFO) esasına göre servis verilir" ifadesi ne tür bir varsayımdır?`, options: [`A) Veri varsayımı`, `B) Sürekli varsayım`, `C) Kesikli varsayım`, `D) Yapısal varsayım`, `E) İstatistiksel varsayım`], ans: `D) Yapısal varsayım`, exp: `Kuyruk disiplini, kurallar ve mantıksal basitleştirmeler sistemin 'Yapısal' özellikleridir.`, exams: [`Ünite 8`] },
    { q: `Banka modelinde yer alan "Hizmet süreleri ortalama 5 dakika olan üstel dağılıma uymaktadır" ifadesi ne tür bir varsayımdır?`, options: [`A) Yapısal varsayım`, `B) Veri varsayımı`, `C) Dinamik varsayım`, `D) Kavramsal varsayım`, `E) Yüzeysel varsayım`], ans: `B) Veri varsayımı`, exp: `İstatistiksel dağılımlar, toplanan süreler ve oranlarla ilgili kabuller doğrudan 'Veri varsayımı' sınıfına girer.`, exams: [`Ünite 8`] },
    { q: `Aşağıdakilerden hangisi veri varsayımlarının doğrulanması (girdi analizi) adımlarından biri değildir?`, options: [`A) Uygun olasılık dağılımlarının belirlenmesi`, `B) Dağılım parametrelerinin tahmin edilmesi`, `C) Uygunluk testlerinin (Ki-kare vb.) uygulanması`, `D) Simülasyonun animasyon ile izlenmesi`, `E) Rastgele örneklem verilerinin toplanması`], ans: `D) Simülasyonun animasyon ile izlenmesi`, exp: `Animasyon izlemek kavramsal ve mantıksal yapısal doğrulamanın bir parçasıdır, istatistiksel girdi veri analizinin değil.`, exams: [`Ünite 8`] },
    { q: `Bir benzetim modeli için belirlenebilecek "yegâne nesnel test" aşağıdakilerden hangisidir?`, options: [`A) Modelin geçmiş verileri birebir tutturması`, `B) Uzman personelin modeli beğenmesi`, `C) Modelin gerçek sistemin gelecekteki davranışlarını doğru tahmin etme yeteneği`, `D) Programın hızlı çalışması`, `E) Çıktı raporlarının uzunluğu`], ans: `C) Modelin gerçek sistemin gelecekteki davranışlarını doğru tahmin etme yeteneği`, exp: `Bilimsel ve nesnel olarak bir modelin geçerliliği, farklı şartlarda gerçekte ne olacağını önceden bilebilmesi ile ispatlanır.`, exams: [`Ünite 8`] },
    { q: `Bir modeli doğrulamak için geleceği tahmin etmek yerine, modeli eldeki farklı eski verilerle test etme işlemine ne ad verilebilir?`, options: [`A) Geçmişin tahmini`, `B) Sürekli simülasyon`, `C) Optimizasyon`, `D) Deterministik yaklaşım`, `E) Monte Carlo`], ans: `A) Geçmişin tahmini`, exp: `Modelin gücünü görmek için geleceği beklemek yerine, elimizdeki geçmiş verinin bir kısmını vererek sonucu bilinen geçmişi tahmin etmesi istenir.`, exams: [`Ünite 8`] },
    { q: `"Kara Kutu" model yaklaşımında X, D ve Y değişkenleri sırasıyla aşağıdakilerden hangilerini ifade eder?`, options: [`A) Çıktı - Karar - Kontrol Edilemeyen`, `B) Karar - Kontrol Edilemeyen - Çıktı`, `C) Kontrol Edilemeyen - Karar - Çıktı`, `D) Kontrol Edilebilen - Karar - Çıktı`, `E) Girdi - Süreç - Çıktı`], ans: `C) Kontrol Edilemeyen değişken (X) - Karar değişkeni (D) - Çıktı değişkeni (Y)`, exp: `Metne göre; X (Yönetimin kontrol edemediği müşteri varışları vb.), D (Yönetimin karar verdiği vezne sayısı vb.), Y ise sistemin ürettiği çıktıdır (Bekleme süresi vb.).`, exams: [`Ünite 8`] },
    { q: `Aşağıdakilerden hangisi banka modelindeki "Karar Değişkenlerine" (D) örnektir?`, options: [`A) Müşterilerin geliş zamanları`, `B) Veznedar sayısı`, `C) Müşterilerin yaşı`, `D) Yağmurlu hava durumu`, `E) Maksimum kuyruk uzunluğu`], ans: `B) Veznedar sayısı`, exp: `Karar değişkeni (D), sistem yöneticisinin doğrudan müdahale edip değiştirebileceği politikalardır (Örn: Kaç kişi çalışacak).`, exams: [`Ünite 8`] },
    { q: `Aşağıdakilerden hangisi bir "Çıktı Değişkeni" (Y) örneğidir?`, options: [`A) Vezne işlem hızı`, `B) Müşteri varış oranı`, `C) Açık olan vezne sayısı`, `D) Bir müşterinin dakika cinsinden ortalama gecikme süresi`, `E) Seçilen dağılımın türü`], ans: `D) Bir müşterinin dakika cinsinden ortalama gecikme süresi`, exp: `Sisteme giren verilerin modelde işlenmesi (kara kutu) sonucunda elde edilen performans ölçütü Çıktı Değişkenidir.`, exams: [`Ünite 8`] },
    { q: `Girdi-çıktı dönüşümlerinin doğrulanabilmesi için sistem yanıt (çıktı) verilerinin toplanma zamanı ile ilgili kural nedir?`, options: [`A) Girdi verilerinin toplandığı aynı zaman aralığında toplanmış olmalıdır.`, `B) Girdi verilerinden 1 ay sonra toplanmalıdır.`, `C) Sistemin en yavaş olduğu gün toplanmalıdır.`, `D) Zaman farkı istatistiği etkilemez.`, `E) Gece vardiyasında toplanmalıdır.`], ans: `A) Girdi verilerinin toplandığı aynı zaman aralığında toplanmış olmalıdır.`, exp: `Elma ile elmayı kıyaslamak için; yoğun saatin girdi verisi kullanılıyorsa, simülasyon çıktısı da gerçek sistemin yoğun saatteki çıktısıyla karşılaştırılmalıdır.`, exams: [`Ünite 8`] },
    { q: `Mevcut bir sistemin uyarlaması olan önerilmiş yeni bir sistem modeli doğrulanırken kullanılan mantık aşağıdakilerden hangisidir?`, options: [`A) Baştan tam veri toplama`, `B) Güven transferi`, `C) Kesin reddetme`, `D) Monte carlo analizi`, `E) Sadece yüzeysel geçerlilik`], ans: `B) Güven transferi`, exp: `Modelci, mevcut var olan modeli doğruladıysa, bu modeldeki "küçük" yapısal değişikliklerin de doğru çalışacağına güven duyar (Güven transferi).`, exams: [`Ünite 8`] },
    { q: `Mevcut modelde makinenin hızının artırılması veya müşteri geliş oranının değiştirilmesi ne tür bir değişikliktir?`, options: [`A) Yeni bir sistem tasarımı (Büyük)`, `B) Alt sistem mantığında değişiklik`, `C) Tek bir sayısal parametrede küçük değişiklik`, `D) Dağılım yapısında küçük değişiklik`, `E) Tamamen yeniden doğrulama gerektiren durum`], ans: `C) Tek bir sayısal parametrede küçük değişiklik`, exp: `Sadece mevcut sayıları (hız, oran, sayı) artırıp azaltmak sistemin mantığını değiştirmediği için yapılabilecek en küçük değişikliktir.`, exams: [`Ünite 8`] },
    { q: `Eski kâğıt tabanlı envanter sistemi yerine tamamen yeni bilgisayarlı bir sistem modeli kuruluyorsa geçerlilik hakkında ne söylenebilir?`, options: [`A) Güven transferi ile hemen doğrulanır.`, `B) Parametre değişikliği sınıfına girer.`, `C) Tamamen girdi-çıktı dönüşümlerini doğrulamanın net bir yolu yoktur.`, `D) Çok kolay onaylanır.`, `E) Hipotez testine gerek kalmaz.`], ans: `C) Tamamen girdi-çıktı dönüşümlerini doğrulamanın net bir yolu yoktur.`, exp: `Var olmayan (hiç kurulmamış) bir sistemin çıktı verisi henüz oluşmadığı için, girdi-çıktı kıyaslaması yapılamaz. Ancak kısmi alt sistem doğrulamaları yapılabilir.`, exams: [`Ünite 8`] },
    { q: `Benzetim uygulamasının çıktılarını gerçek verilerle karşılaştırmak (örneğin gözlenen gecikme ile model gecikmesini kıyaslamak) için uygun olan istatistiksel test hangisidir?`, options: [`A) Ki-Kare Testi`, `B) t-testi`, `C) Kolmogorov-Smirnov`, `D) Varyans Analizi (ANOVA)`, `E) Regresyon Analizi`], ans: `B) t-testi`, exp: `İki ortalama arasındaki farkın anlamlı olup olmadığını test etmek ve hipotezleri sınamak için örneklem boyutlarına göre t-testi kullanılır.`, exams: [`Ünite 8`] },
    { q: `Hipotez testlerinde kullanılan "Anlamlılık düzeyi (α)" kavramı aşağıdakilerden hangisini ifade eder?`, options: [`A) Modelin geçerlilik oranını`, `B) İkinci tür hata yapma riskini`, `C) Gerçekte doğru olan sıfır hipotezinin yanlışlıkla reddedilme olasılığını`, `D) Çıktıların güven aralığını`, `E) Sistemin toplam hata payını`], ans: `C) Gerçekte doğru olan sıfır hipotezinin yanlışlıkla reddedilme olasılığını`, exp: `Alfa (Tip 1 Hata), işleyen geçerli bir sistemi yanlışlıkla "bu hatalı" diyerek reddetme riskimizdir (genellikle 0.05 seçilir).`, exams: [`Ünite 8`] },
    { q: `İstatistik terminolojisindeki "Tip 1 Hata"nın modelleme terminolojisindeki tam karşılığı nedir?`, options: [`A) Geçerli bir modelin reddedilmesi`, `B) Geçersiz bir modelin kabul edilmesi`, `C) Verilerin eksik toplanması`, `D) Kaynak kullanımının yanlış hesaplanması`, `E) Animasyonun takılması`], ans: `A) Geçerli bir modelin reddedilmesi`, exp: `Tip 1 hata (Doğru H0'ın reddi), aslında gerçek sistemi iyi yansıtan geçerli bir modelin testi geçemeyip çöpe atılmasıdır.`, exams: [`Ünite 8`] },
    { q: `İstatistik terminolojisindeki "Tip 2 Hata"nın modelleme terminolojisindeki tam karşılığı nedir?`, options: [`A) Geçerli bir modelin reddedilmesi`, `B) Geçersiz bir modelin gerçek sistemi temsil ettiğine inanılması (Kabulü)`, `C) Güven aralığının dar çıkması`, `D) Alfa düzeyinin yüksek seçilmesi`, `E) Sentaks hatası yapılması`], ans: `B) Geçersiz bir modelin gerçek sistemi temsil ettiğine inanılması (Kabulü)`, exp: `Tip 2 hata (Yanlış H0'ın kabulü), aslında hatalı ve bozuk olan bir simülasyon modeline güvenip kararlar almaktır (Çok daha tehlikelidir).`, exams: [`Ünite 8`] },
    { q: `Arabalı servis hizmeti benzetim örneğinde ilk hipotez testinin reddedilmesine (modelin yetersiz çıkmasına) sebep olan mantıksal eksiklik neydi?`, options: [`A) Arabaların çok yavaş gelmesi`, `B) Yürüyerek gelen müşterilerin ve veznenin bu işe harcadığı sürenin modele dâhil edilmemesi`, `C) Bankanın 11:00'da kapalı olması`, `D) Rastgele sayı üretecinin bozuk olması`, `E) Dağılımın Weibull seçilmesi`], ans: `B) Yürüyerek gelen müşterilerin ve veznenin bu işe harcadığı sürenin modele dâhil edilmemesi`, exp: `Veznedarın sadece arabalara bakmadığı, içerideki yürüyen müşterilere de hizmet verdiği sonradan fark edilip model revize edilmiştir.`, exams: [`Ünite 8`] },
    { q: `Banka modelindeki hata fark edildikten sonra izlenen yol nedir?`, options: [`A) Proje iptal edildi.`, `B) Model baştan aşağı farklı bir dille yazıldı.`, `C) Model revize edilerek veznenin yaya müşterilere hizmet süresi de (ortalama 3 dk üssel dağılım ile) eklendi.`, `D) Veriler sahte verilerle değiştirildi.`, `E) Alfa değeri %50 yapılarak testin geçmesi sağlandı.`], ans: `C) Model revize edilerek veznenin yaya müşterilere hizmet süresi de (ortalama 3 dk üssel dağılım ile) eklendi.`, exp: `Kalibrasyonun doğası gereği, modeldeki eksiklik bulunduğunda ilgili değişkenler eklenerek yeniden test edilir.`, exams: [`Ünite 8`] },
    { q: `Aşağıdakilerden hangisi kavramsal onaylama tanımına uymaktadır?`, options: [`A) Yazılan kodun hatasız derlenmesi`, `B) Tasarlanan model kurgusunun, varsayımlarının gerçek sistem ile kıyaslanması`, `C) Bilgisayar hızı ölçümü`, `D) Gelecek 10 yılın kesin tahmini`, `E) Bütçe planlaması`], ans: `B) Tasarlanan model kurgusunun, varsayımlarının gerçek sistem ile kıyaslanması`, exp: `Kavramsal onaylama, henüz kodlamadan önce kâğıt üstündeki mantığın gerçek sistemle örtüşüp örtüşmediğine bakılmasıdır.`, exams: [`Ünite 8`] },
    { q: `Doğrulama aşamasında sistem performans ölçütlerini (Ortalama bekleme süresi, güncel içerik vb.) kim veya ne hesaplar?`, options: [`A) Sistem operatörleri`, `B) Fabrika müdürü`, `C) İleri istatistiksel yazılımlar kullanılarak elle hesaplanır`, `D) Benzetim programı (yazılımı) kendisi otomatik hesaplar`, `E) Sadece Excel ile manuel yapılır`], ans: `D) Benzetim programı (yazılımı) kendisi otomatik hesaplar`, exp: `Arena, AutoMod vb. benzetim programları bu standart istatistikleri arka planda otomatik olarak tutar ve raporlar.`, exams: [`Ünite 8`] },
    { q: `Model doğruluğundaki artış kararı verilirken aşağıdakilerden hangisi göz önünde bulundurulmalıdır?`, options: [`A) İstenilen kesinlik için harcanacak maliyet, zaman ve çaba`, `B) Sadece modelin estetiği`, `C) Renk seçimi`, `D) Personelin yaşı`, `E) Rapor kâğıt türü`], ans: `A) İstenilen kesinlik için harcanacak maliyet, zaman ve çaba`, exp: `Hiçbir model %100 kusursuz olamaz. Modeli kusursuzlaştırmaya çalışmak sonsuz maliyet ve zaman kaybına yol açabilir (Fayda/Maliyet dengesi).`, exams: [`Ünite 8`] },
    { q: `Sistem yanıtı olan Z değerleri, hangi şartı sağladığında benzetim modeli onaylanabilir?`, options: [`A) Z değerleri sürekli sıfır olmalıdır.`, `B) Simülasyon modeli rastgele çalıştığında gözlenen Z değerlerinin gerçek verilerdeki Z değerlerine (Örn: 4.3 dk) çok yakın veya tutarlı olması beklenir.`, `C) Z değerleri sonsuza gitmelidir.`, `D) Z değeri girdi değerinden küçük olmalıdır.`, `E) Sadece standart sapma baz alınmalıdır.`], ans: `B) Simülasyon modeli rastgele çalıştığında gözlenen Z değerlerinin gerçek verilerdeki Z değerlerine (Örn: 4.3 dk) çok yakın veya tutarlı olması beklenir.`, exp: `Simülasyonun ürettiği sanal çıktılar, sahada ölçülen gerçek çıktı değerlerini istatistiksel olarak yakalayabiliyorsa model başarılıdır.`, exams: [`Ünite 8`] },
    { q: `Banka modeli t-testinde H0 hipotezinin (Sıfır hipotezi) matematiksel veya sözel anlamı neydi?`, options: [`A) Simülasyon hatalıdır.`, `B) Yeni vezne açılmalıdır.`, `C) Simülasyonla üretilen gecikme süresinin beklenen değeri, gerçekte ölçülen 4.3 dakikaya eşittir.`, `D) Müşteriler bankayı terk etmiştir.`, `E) Değişkenler bağımsız değildir.`], ans: `C) Simülasyonla üretilen gecikme süresinin beklenen değeri, gerçekte ölçülen 4.3 dakikaya eşittir.`, exp: `H0 hipotezi daima 'eşitlik/fark yok' durumunu savunur; yani modelin ürettiği ortalama ile gerçek hayattaki ortalama aynıdır iddiasını taşır.`, exams: [`Ünite 8`] },
// --- 9. Ünite: Çıktı Analizi Soruları ---
    { q: `Simülasyon sonuçlarının analizine odaklanarak, sistem davranışını anlamaya ve tahminler üretmeye çalışan modelleme aşaması aşağıdakilerden hangisidir?`, options: [`A) Kavramsal Modelleme`, `B) Çıktı Analizi`, `C) Girdi Analizi`, `D) Doğrulama`, `E) Modelin Bilgisayara Aktarılması`], ans: `B) Çıktı Analizi`, exp: `Çıktı analizi, simülasyon kopyalarının (replikasyonların) tasarlanması ve bunlardan elde edilen istatistiklerin analiz edilmesi aşamasıdır.`, exams: [`Ünite 9`] },
    { q: `Aşağıdakilerden hangisi çıktı analizi ile ele alınan ana sorunlardan biri değildir?`, options: [`A) Replikasyon tasarımı`, `B) Performans ölçütlerinin tahmini`, `C) Sistem analizi ve deney`, `D) Girdi veri setlerinin uygunluk (fit) testleri`, `E) Alternatif sistem tasarımlarının karşılaştırılması`], ans: `D) Girdi veri setlerinin uygunluk (fit) testleri`, exp: `Girdi verilerinin uygunluk testleri (hangi dağılıma uyduğu vb.) girdi analizinin konusudur, çıktı analizinin değil.`, exams: [`Ünite 9`] },
    { q: `Simülasyon çalışmaları sırasında en düşük hesaplama maliyetiyle en doğru istatistiksel bilgileri elde edebilmek için tekrarların sayısını ve uzunluğunu ayarlama işlemine ne ad verilir?`, options: [`A) Replikasyon tasarımı`, `B) Metamodelleme`, `C) Ortak rastgele sayılar tekniği`, `D) Bonferroni düzeltmesi`, `E) Duyarlılık analizi`], ans: `A) Replikasyon tasarımı`, exp: `İyi bir simülasyon için replikasyon (çoğaltma) tasarımı, simülasyonun ne kadar süre ve kaç kez çalıştırılacağını optimize eder.`, exams: [`Ünite 9`] },
    { q: `Simülasyon modelleri, zaman ufkuna göre hangi iki ana sınıfa ayrılır?`, options: [`A) Kesikli ve Sürekli`, `B) Statik ve Dinamik`, `C) Sonlu ve Sonsuz`, `D) Deterministik ve Stokastik`, `E) Bağımlı ve Bağımsız`], ans: `C) Sonlu ve Sonsuz`, exp: `Sistemlerin belirli bir çalışma süresi (kapanış saati vb.) olup olmamasına göre modeller sonlu ve sonsuz (kararlı durum) ufuklu olarak ikiye ayrılır.`, exams: [`Ünite 9`] },
    { q: `Her gün 08.00'da açılıp 16.00'da kapanan bir bankanın benzetim modeli aşağıdakilerden hangisine uygun bir örnektir?`, options: [`A) Sonsuz ufuklu simülasyon`, `B) Sonlu ufuklu simülasyon`, `C) Kararlı durum simülasyonu`, `D) Metamodel`, `E) Kesintisiz simülasyon`], ans: `B) Sonlu ufuklu simülasyon`, exp: `Doğal bir sonlanma zamanı (mesai bitimi) olan ve kısa vadeli dinamikleri inceleyen modeller sonlu ufuklu simülasyonlardır.`, exams: [`Ünite 9`] },
    { q: `Sonlu ufuklu simülasyon modellerinde, istatistiksel doğruluğu (örnek boyutunu) kontrol etmenin tek ve en kritik yolu aşağıdakilerden hangisidir?`, options: [`A) Isınma süresini uzatmak`, `B) Dağılım türünü değiştirmek`, `C) Tekrarların (Replikasyonların) sayısını belirlemek`, `D) Sistemi sürekli (24 saat) çalışıyormuş gibi kabul etmek`, `E) Modeli tamamen baştan yazmak`], ans: `C) Tekrarların (Replikasyonların) sayısını belirlemek`, exp: `Sistem her gün yeniden sıfırlandığı için, verileri artırmanın tek yolu simülasyonu daha fazla sayıda bağımsız gün (replikasyon) için koşturmaktır.`, exams: [`Ünite 9`] },
    { q: `Günde 24 saat çalışan ve doğal bir sonlandırma süresi olmayan (örneğin bir havalimanı ATM'si) modeller aşağıdakilerden hangisidir?`, options: [`A) Sonlu ufuklu modeller`, `B) Kısa vadeli modeller`, `C) Başlangıç önyargılı modeller`, `D) Sonsuz ufuklu (kararlı durum) modeller`, `E) Geçici durum modelleri`], ans: `D) Sonsuz ufuklu (kararlı durum) modeller`, exp: `Sonsuz ufuklu modeller potansiyel olarak sonsuza kadar çalıştırılabilir ve sistemin uzun vadeli istatistiklerine (kararlı durum / steady-state) odaklanır.`, exams: [`Ünite 9`] },
    { q: `Sonsuz ufuklu (kararlı durum) bir simülasyon modelinde, sistemin başlangıç şartlarından (örneğin ilk açıldığında kuyruğun boş olması) kaynaklanan tipik olmayan sistem geçmişine ne ad verilir?`, options: [`A) Kararlı durum`, `B) Gelecek durum`, `C) Rejeneratif durum`, `D) Geçici durum (Transient state)`, `E) Ortak rastgele durum`], ans: `D) Geçici durum (Transient state)`, exp: `Sistem henüz dengeye oturmadığı ve zamanın bir fonksiyonu olarak istatistiklerin sürekli değiştiği bu atipik başlangıç evresine geçici durum denir.`, exams: [`Ünite 9`] },
    { q: `Simülasyon başladıktan sonra sistemin geçici durumunu (başlangıç önyargısını) atlatması ve kararlı duruma ulaşması için beklenen süreye ne ad verilir?`, options: [`A) Replikasyon zamanı`, `B) Gecikme zamanı`, `C) Isınma süresi (Warm-up period)`, `D) Bitiş süresi`, `E) Soğuma süresi`], ans: `C) Isınma süresi (Warm-up period)`, exp: `Başlangıçtaki tipik olmayan, boş sistem verilerinin istatistikleri bozmasını (önyargı) engellemek için model bir süre istatistik toplamadan ısınmaya bırakılır.`, exams: [`Ünite 9`] },
    { q: `Kararlı durum simülasyonlarında ısınma süresi boyunca toplanan istatistiklere ne yapılmalıdır?`, options: [`A) Tüm verilerle birleştirilip ortalaması alınmalıdır.`, `B) Varyansı ikiyle çarpılmalıdır.`, `C) Sadece minimum ve maksimum değerleri saklanmalıdır.`, `D) Bu istatistikler atılmalı ve veri toplamaya bu noktadan sonra yeniden başlanmalıdır.`, `E) Model sonlandırılmalıdır.`], ans: `D) Bu istatistikler atılmalı ve veri toplamaya bu noktadan sonra yeniden başlanmalıdır.`, exp: `Isınma süresi verileri (başlangıç önyargısı) sistemi yanlış yansıtacağından atılır (discard) ve sistem ancak düzene girdikten sonra gerçek veri toplanmaya başlar.`, exams: [`Ünite 9`] },
    { q: `Sonsuz ufuklu simülasyon modellerinde replikasyon uzunluğu (koşum süresi) neye göre belirlenir?`, options: [`A) İstatistiklerin zaman içindeki değişiminin sabitlenmesine (stabilize olmasına) göre`, `B) Mesai saatinin bitimine göre`, `C) Personel sayısına göre`, `D) Bilgisayarın hafıza kapasitesine göre`, `E) Kullanılan animasyonun uzunluğuna göre`], ans: `A) İstatistiklerin zaman içindeki değişiminin sabitlenmesine (stabilize olmasına) göre`, exp: `Replikasyon uzunluğunun yol gösterici ilkesi, incelenen performans ölçütlerinin (örneğin gecikme süresinin) artık büyük dalgalanmalar göstermeyip sabitlenmesidir.`, exams: [`Ünite 9`] },
    { q: `Sistemde her kopyanın baştan sona yeniden çalıştırılmasının getireceği zaman maliyetini ve ısınma yükünü azaltmak için, tek bir çok uzun tekrarlamadan birden fazla istatistik tahmini çıkarma yöntemine ne ad verilir?`, options: [`A) Ortak rastgele sayılar (CRN)`, `B) Parti ortalamaları (Batch means) yöntemi`, `C) Metamodelleme`, `D) Bonferroni yöntemi`, `E) Bağımsız örnekleme`], ans: `B) Parti ortalamaları (Batch means) yöntemi`, exp: `Parti ortalamaları yöntemi, tek bir uzun koşumu kendi içinde zaman bloklarına (partilere) bölerek her partiden ayrı bir örneklem (tahmin) elde etme yöntemidir.`, exams: [`Ünite 9`] },
    { q: `Belirli zaman noktalarında (genellikle sistemin boşaldığı rassal anlarda) geçmiş hafızanın sıfırlandığı ve kısmi işlem geçmişlerinin birbirinden bağımsız olduğu süreçlere ne ad verilir?`, options: [`A) Rejeneratif (Yenileme) süreçler`, `B) Deterministik süreçler`, `C) Sürekli süreçler`, `D) Bağımlı süreçler`, `E) Geçici süreçler`], ans: `A) Rejeneratif (Yenileme) süreçler`, exp: `Örneğin bir kuyruk sisteminin tamamen boşaldığı an, sistemin geleceğinin geçmişten bağımsız hale geldiği bir 'yenilenme' (rejenerasyon) noktasıdır.`, exams: [`Ünite 9`] },
    { q: `Tahmin edicilerin doğru (ancak bilinmeyen) istatistiksel parametreyi barındırdığı aralığı ve bu aralığa duyulan güvenin olasılığını sayısallaştıran ölçü hangisidir?`, options: [`A) Nokta tahmini`, `B) Varyans analizi`, `C) Güven aralığı tahmini`, `D) Metamodel`, `E) Korelasyon katsayısı`], ans: `C) Güven aralığı tahmini`, exp: `Gerçek değerin belirli bir alt ve üst sınır (%95 güven vb.) arasında olduğunu ifade eden istatistiksel kavrama Güven Aralığı denir.`, exams: [`Ünite 9`] },
    { q: `İki farklı sistem tasarımının simülasyon ile karşılaştırılmasında (örneğin A sistemi mi B sistemi mi daha iyi), sadece modellerin rastgeleliğinden kaynaklanan farkları eleyip gerçek yapısal farkları tespit edebilmek için kullanılan varyans düşürme tekniği hangisidir?`, options: [`A) Parti ortalamaları`, `B) Rejenerasyon noktası`, `C) Ortak rastgele sayılar (CRN) tekniği`, `D) Bonferroni yöntemi`, `E) Bağımsız çoğaltma`], ans: `C) Ortak rastgele sayılar (CRN) tekniği`, exp: `İki sistemi adil (aynı şartlarda) kıyaslayabilmek için her iki sisteme de aynı rastgele müşteri gelişleri (Ortak Rastgele Sayılar - CRN) verilir; bu da varyansı azaltır.`, exams: [`Ünite 9`] },
    { q: `Ortak rastgele sayılar (CRN) tekniği hangi durumlarda kullanılmaktadır?`, options: [`A) Başlangıç önyargısını gidermek için`, `B) Sistemleri ısıtmak için`, `C) Tek bir sistemin güven aralığını daraltmak için`, `D) İki veya daha fazla alternatif sistem tasarımını birbiriyle karşılaştırmak için`, `E) Animasyon grafiklerini iyileştirmek için`], ans: `D) İki veya daha fazla alternatif sistem tasarımını birbiriyle karşılaştırmak için`, exp: `CRN, iki farklı senaryonun birbirine göre ne kadar farklılık yarattığını test ederken (farkın varyansını düşürerek) kullanılır.`, exams: [`Ünite 9`] },
    { q: `Simülasyon çıktı analizinde, 20 veya daha az sayıda çoklu (alternatif) sistemi aynı anda karşılaştırmak için kullanılması önerilen istatistiksel yöntem aşağıdakilerden hangisidir?`, options: [`A) Ortak rastgele sayılar`, `B) Bonferroni yöntemi`, `C) Rejeneratif yöntem`, `D) Ki-kare testi`, `E) Kolmogorov-Smirnov testi`], ans: `B) Bonferroni yöntemi`, exp: `İkiden fazla (fakat 20'yi aşmayan) senaryo arasında eşzamanlı istatistiksel güven analizi yaparken hata payını dengeleyen yöntem Bonferroni'dir.`, exams: [`Ünite 9`] },
    { q: `Çok sayıda karmaşık sistem tasarımlarını değerlendirirken kullanılan ve genellikle regresyon modelleri ile temsil edilen basitleştirilmiş modellere ne ad verilir?`, options: [`A) Fiziksel Model`, `B) İkonik Model`, `C) Metamodel`, `D) Kesikli Model`, `E) Rejeneratif Model`], ans: `C) Metamodel`, exp: `Ağır simülasyonları defalarca çalıştırmak yerine, sistemin davranışı regresyon gibi basit matematiksel fonksiyonlarla (metamodellerle) temsil edilebilir.`, exams: [`Ünite 9`] },
    { q: `Aşağıdakilerden hangisi çıktı analizinin sistem davranışını anlamak için kullandığı istatistiksel analiz yöntemlerinden biri değildir?`, options: [`A) Güven aralıkları hesaplamak`, `B) Performans ölçütlerinin nokta tahminini yapmak`, `C) Parti ortalamaları yöntemi ile veriyi gruplamak`, `D) Rastgele sayı üretecinin çevrim uzunluğunu (periyodunu) hesaplamak`, `E) Alternatif sistemlerin varyansını karşılaştırmak`], ans: `D) Rastgele sayı üretecinin çevrim uzunluğunu (periyodunu) hesaplamak`, exp: `Rastgele sayı üretecinin matematiksel periyot hesabının yapılması "Çıktı Analizi"nin değil, model kurgulanmadan önceki algoritmik alt yapının konusudur.`, exams: [`Ünite 9`] },
    { q: `Sonsuz ufuklu simülasyonlarda güven aralıkları tahmin edilirken sonlu ufuklu simülasyonlara göre ortaya çıkan temel fark aşağıdakilerden hangisidir?`, options: [`A) Güven aralığı hesaplanamaması`, `B) Sadece görsel grafiklere dayanması`, `C) Replikasyonların çok daha uzun olması ve bu sayede parti ortalamaları yöntemine olanak sağlaması`, `D) Çıktıların geçici durumda hesaplanması`, `E) Başlangıç şartlarına daha bağımlı olunması`], ans: `C) Replikasyonların çok daha uzun olması ve bu sayede parti ortalamaları yöntemine olanak sağlaması`, exp: `Sonsuz modellerde sistem saatlerce çalıştırıldığı için, tek koşum içindeki verileri "partilere" bölmek sonlu modellere göre çok daha kolay ve verimlidir.`, exams: [`Ünite 9`] },
// --- 10. Ünite: Benzetim Dilleri Soruları ---
    { q: `Simülasyon modellerini geliştirmek için kullanılan yazılımlar genel olarak kaç kategoriye ayrılır?`, options: [`A) 1`, `B) 2`, `C) 3`, `D) 4`, `E) 5`], ans: `C) 3`, exp: `Simülasyon yazılımları; Genel amaçlı diller (C, Java), Simülasyon dilleri (GPSS, SIMAN) ve Simülasyon ortamları (Arena, SIMIO) olmak üzere 3 kategoriye ayrılır.`, exams: [`Ünite 10`] },
    { q: `Aşağıdakilerden hangisi birinci kategori simülasyon yazılımları olan "genel amaçlı programlama dillerinden" biridir?`, options: [`A) GPSS`, `B) SIMAN`, `C) Java`, `D) SLAM`, `E) ARENA`], ans: `C) Java`, exp: `Java, C ve C++ genel amaçlı dillerdir. Diğerleri ise simülasyona özel programlama dilleri veya simülasyon ortamlarıdır.`, exams: [`Ünite 10`] },
    { q: `İkinci kategoride yer alan "Simülasyon programlama dilleri" arasında aşağıdakilerden hangisi yer alır?`, options: [`A) C++`, `B) Python`, `C) Arena`, `D) SLAM`, `E) SIMIO`], ans: `D) SLAM`, exp: `GPSS, SIMAN ve SLAM ikinci kategorideki saf simülasyon programlama dilleridir.`, exams: [`Ünite 10`] },
    { q: `Nance (1995) simülasyon yazılımının tarihçesini (1955-1986 yılları arası) kaç döneme ayırarak incelemiştir?`, options: [`A) 3`, `B) 4`, `C) 5`, `D) 6`, `E) 7`], ans: `C) 5`, exp: `Tarihçe; Arama, Gelişim, Biçimlendirici, Genişleme ve Konsolidasyon (Yenileme) olmak üzere 5 döneme bölünmüştür.`, exams: [`Ünite 10`] },
    { q: `K.D. Tocher ve D.O. Owen tarafından 1960 yılında oluşturulan ve ilk dil yaratma çabası olarak kabul edilen çalışma hangisidir?`, options: [`A) GPSS`, `B) SIMULA`, `C) Genel Simülasyon Programı`, `D) GASP`, `E) SIMSCRIPT`], ans: `C) Genel Simülasyon Programı`, exp: `Arama dönemi olan 1955-1960 yılları arasında simülasyonu kolaylaştırmak için yazılan Genel Simülasyon Programı ilk ciddi adımdır.`, exams: [`Ünite 10`] },
    { q: `İletişim ve bilgisayar sistemlerinin hızlı simülasyonları için IBM'de Geoffrey Gordon tarafından geliştirilen süreç etkileşimli ilk dil hangisidir?`, options: [`A) SIMSCRIPT`, `B) GPSS (Genel Amaçlı Simülasyon Sistemi)`, `C) SLAM`, `D) GASP`, `E) CSL`], ans: `B) GPSS (Genel Amaçlı Simülasyon Sistemi)`, exp: `1961'de ortaya çıkan GPSS, blok diyagramı gösterimine dayanan ve ilk defa bilgisayar programlama dilleriyle süreç etkileşimini sağlayan dildir.`, exams: [`Ünite 10`] },
    { q: `1963'te RAND Corporation tarafından ABD Hava Kuvvetleri için geliştirilen ve başlarda FORTRAN'dan büyük ölçüde etkilenen dil hangisidir?`, options: [`A) SIMSCRIPT`, `B) GPSS`, `C) GASP`, `D) SIMULA`, `E) SIMAN`], ans: `A) SIMSCRIPT`, exp: `Harry Markowitz öncülüğünde geliştirilen SIMSCRIPT, ilerleyen sürümlerde FORTRAN tabanından ayrılıp kendi dilini yaratmıştır.`, exams: [`Ünite 10`] },
    { q: `Avrupa'da geliştirilen, sınıflar ve kalıtım kavramlarını ekleyerek "modern nesne yönelimli programlama dillerinin" öncüsü kabul edilen dil hangisidir?`, options: [`A) CSL`, `B) GASP IV`, `C) SIMULA`, `D) SIMAN`, `E) SLAM II`], ans: `C) SIMULA`, exp: `Norveç'te geliştirilen bir ALGOL uzantısı olan SIMULA, günümüzdeki nesne yönelimli (object-oriented) programlamanın atasıdır.`, exams: [`Ünite 10`] },
    { q: `C. Dennis Pegden tarafından tek kişilik bir fakülte projesi olarak IBM PC için geliştirilen ve ARENA'nın kalbini oluşturan simülasyon dili hangisidir?`, options: [`A) SLAM`, `B) SIMSCRIPT`, `C) GASP`, `D) SIMAN (Simülasyon Analizi)`, `E) GPSS/H`], ans: `D) SIMAN (Simülasyon Analizi)`, exp: `Pegden'in MS-DOS kısıtlamaları altında 2 yılda geliştirdiği SIMAN, daha sonraki yıllarda Arena ortamının ana motoru (kalbi) olmuştur.`, exams: [`Ünite 10`] },
    { q: `Bir simülasyon yazılımı değerlendirilirken dikkate alınması gereken özellikler arasında hangisi "Model Oluşturma Özellikleri" içinde yer almaz?`, options: [`A) Veri aktarma/dışa aktarma olanakları`, `B) Çalışma esnasında interaktif grafik müdahalesi`, `C) Modellemede esneklik`, `D) Alt modeller oluşturma`, `E) İstatistiksel veri analizi araçları`], ans: `B) Çalışma esnasında interaktif grafik müdahalesi`, exp: `Çalışma esnasındaki özellikler "Çalışma Zamanı (Run-time) Ortamı" kategorisindedir, model kurulum (oluşturma) özellikleri değil.`, exams: [`Ünite 10`] },
    { q: `Aşağıdakilerden hangisi bir simülasyon yazılımı seçerken dikkat edilmesi gereken tavsiyelerden biri değildir?`, options: [`A) Kullanım kolaylığı gibi tek bir konuya odaklanılmamalıdır.`, `B) Reklam iddialarına ve ispatlarına dikkat edilmelidir.`, `C) Programlama kesinlikle gerektirmeyen (kodsuz) paketler her zaman en iyisidir.`, `D) Satıcıdan problemin basitleştirilmiş küçük bir versiyonunu çözmesi beklenebilir.`, `E) Yürütme hızının geliştirme süresini etkileyeceği unutulmamalıdır.`], ans: `C) Programlama kesinlikle gerektirmeyen (kodsuz) paketler her zaman en iyisidir.`, exp: `Grafiksel modelleme avantajlı olsa da, "programlama gerekmez" sözüne dikkat edilmelidir. Çoğu gerçek dünya modeli özel kodlama mantığına ihtiyaç duyar.`, exams: [`Ünite 10`] },
    { q: `Arena yazılımının, ayrık ve sürekli sistemlerin daha ayrıntılı modelleri için tasarlanan ve 1993'te grafik model geliştirme için ilk defa piyasaya sürülen versiyonu hangisidir?`, options: [`A) Arena Basic`, `B) Arena Standart (SE)`, `C) Arena Professional`, `D) Arena OptQuest`, `E) Arena Web`], ans: `B) Arena Standart (SE)`, exp: `Modüllerle çalışan ve farmasötik/kimyasal gibi karışık üretimleri de destekleyen standart sürüm (SE), 1993'te çıkan orijinal Arena deneyimidir.`, exams: [`Ünite 10`] },
    { q: `Araç sistemleri, vinçler, forkliftler, AGV'ler ve köprü vinçleri gibi "malzeme işleme ve üretim sistemlerine" odaklanan, yerleşik 3 boyutlu kinematik animasyona sahip yazılım hangisidir?`, options: [`A) SIMUL8`, `B) Micro Saint`, `C) Extend`, `D) AutoMod`, `E) ProModel`], ans: `D) AutoMod`, exp: `AutoMod (Brooks Automation), araç hareketlerinin (Pathmover) ve konveyörlerin çok detaylı fiziksel (kinematik) modellenmesinde lider paketlerden biridir.`, exams: [`Ünite 10`] },
    { q: `Belirli bir sektör terminolojisi kullanmayan, kullanıcının serbestçe kendi akış çizelgesi ile ağ diyagramları (fonksiyonel modeller) oluşturduğu ve Micro Analysis and Design tarafından üretilen yazılım hangisidir?`, options: [`A) ProModel`, `B) Micro Saint`, `C) QUEST`, `D) Flexsim`, `E) Arena`], ans: `B) Micro Saint`, exp: `Micro Saint tamamen genel amaçlıdır, sektörel (sağlık, fabrika vb.) simgelere veya isimlere bağlı kalmadan her süreci modeller.`, exams: [`Ünite 10`] },
    { q: `Ağırlıklı olarak imalat sistemlerini modellemek için PROMODEL Corporation tarafından üretilen, sağlık için MedModel ve servisler için ServiceModel versiyonları olan yazılım hangisidir?`, options: [`A) ProModel`, `B) Extend`, `C) AutoMod`, `D) Flexsim`, `E) QUEST`], ans: `A) ProModel`, exp: `Parçalar, konumlar, kaynaklar ve yol ağları üzerinden ilerleyen, 2D animasyonlu üretim odaklı simülasyon paketi ProModel'dir.`, exams: [`Ünite 10`] },
    { q: `Delmia Corp. tarafından sunulan, IGRIP (robotik programlama) ve ERGO (insan ergonomisi) ile entegre çalışarak sanal bir fabrika (3-D CAD) oluşturan paket hangisidir?`, options: [`A) AutoMod`, `B) SIMUL8`, `C) QUEST (Queuing Event Simulation Tool)`, `D) Extend`, `E) Flexsim`], ans: `C) QUEST (Queuing Event Simulation Tool)`, exp: `Robot iş hücreleri ve fabrika ergonomisini, PROCESS ENGINEER veritabanıyla entegre ederek sanal fabrikalar kuran yazılım QUEST'tir.`, exams: [`Ünite 10`] },
    { q: `Odak noktası çoğunlukla "insanların" işlem gerçekleştirdiği hizmet endüstrileri olan, XML formatında çalışan ve simülasyonu kurumsal düzeyde (işletmelere) geniş çaplı yaymayı hedefleyen 1995 çıkışlı yazılım hangisidir?`, options: [`A) ProModel`, `B) Micro Saint`, `C) SIMUL8`, `D) Arena`, `E) Extend`], ans: `C) SIMUL8`, exp: `SIMUL8, "Bileşenler ve Şablonlar" ile işletme yöneticilerinin uzmanlara ihtiyaç duymadan da kullanabileceği bir sistem kurmayı hedeflemiştir.`, exams: [`Ünite 10`] },
    { q: `Imagine That Inc. tarafından üretilen, "Blok Diyagram" yaklaşımı kullanan ve yeni nesneler yaratmak için C benzeri açık mimari bir geliştirme ortamı (kod blokları) sağlayan yazılım hangisidir?`, options: [`A) Extend`, `B) Flexsim`, `C) QUEST`, `D) AutoMod`, `E) ProModel`], ans: `A) Extend`, exp: `Extend yazılımında temel olan "bloklardır" (Generator, Queue, Activity). Blok kodları açık olduğu için kullanıcılar yeni blok tipleri (Industry, Suite) tasarlayabilir.`, exams: [`Ünite 10`] },
    { q: `C++ ve OpenGL teknolojileri kullanılarak 3 boyutlu ve sanal gerçeklik (VR) ortamında, dinamik akış sistemlerini görsel bir Microsoft IDE arayüzüyle entegre edip modelleyen nesne yönelimli paket hangisidir?`, options: [`A) SIMUL8`, `B) Flexsim`, `C) Micro Saint`, `D) ProModel`, `E) Extend`], ans: `B) Flexsim`, exp: `OpenGL (Sanal gerçeklik ve gelişmiş 3D) gücüyle bilinen, C++ altyapılı endüstri simülatörü Flexsim'dir.`, exams: [`Ünite 10`] },
    { q: `Simülasyon sistemlerinde yakın zamana kadar zorlanılan "rastgele ve doğrusal olmayan doğayı" aşmak için optimizasyon yazılımları hangi yeni gelişmeleri (yöntemleri) kullanmaktadır?`, options: [`A) Sadece geleneksel t-testleri`, `B) Lineer programlamanın basit formülleri`, `C) Meta-sezgisel yöntemler (Genetik algoritmalar, yapay sinir ağları, tabu araması)`, `D) Yalnızca Excel makroları`, `E) Statik hesaplama tabloları`], ans: `C) Meta-sezgisel yöntemler (Genetik algoritmalar, yapay sinir ağları, tabu araması)`, exp: `Simülasyon optimizasyon programları (OptQuest, SimRunner) yerel optimumlara takılmamak için gelişmiş Meta-sezgisel/Yapay Zeka arama yöntemleri kullanır.`, exams: [`Ünite 10`] },
    { q: `Colorado Üniversitesinden Dr. Fred Glover tarafından geliştirilen; Dağılım araması, Tabu araması ve Sinir ağlarının kombinasyonuna dayanan optimizasyon eklentisi hangisidir?`, options: [`A) AutoStat`, `B) SimRunner`, `C) OptQuest`, `D) Process Analyzer`, `E) Output Analyzer`], ans: `C) OptQuest`, exp: `OptQuest (OptTek Systems) yerel optimallikten (tuzağa düşmekten) kaçınmak için Tabu ve Sinir ağı algoritmalarını birlikte kullanarak optimize eder.`, exams: [`Ünite 10`] },
    { q: `AutoMod ailesinin parçası olan, kararlı durum analizi için ısınma süresi belirleme, yerel bilgisayar ağlarına simülasyon dağıtma ve evrimsel stratejilerle duyarlılık analizi yapabilen araç hangisidir?`, options: [`A) Output Analyzer`, `B) AutoStat`, `C) SimRunner`, `D) OptQuest`, `E) Process Analyzer`], ans: `B) AutoStat`, exp: `AutoStat, AutoMod'un istatistik yöneticisidir. Hatta ağdaki boşta olan makineleri (CPU'ları) birleştirerek çoklu simülasyon koşturabilir.`, exams: [`Ünite 10`] },
    { q: `Mississippi Eyalet Üniversitesi araştırmalarından PROMODEL yazılımı (ve MedModel/ServiceModel) için geliştirilen, evrimsel algoritmalar kullanan simülasyon optimizasyon aracı hangisidir?`, options: [`A) SimRunner`, `B) OptQuest`, `C) AutoStat`, `D) Output Analyzer`, `E) Process Analyzer`], ans: `A) SimRunner`, exp: `Royce Bowden tarafından geliştirilen SimRunner, ProModel kullanıcılarının ısınma süresini bulmasına ve 3 boyutlu grafikler çıkarmasına olanak tanır.`, exams: [`Ünite 10`] },
    { q: `Arena yazılımının, birden fazla alternatif sistemi karşılaştırmak ve kararlı durum analizlerinde ısınma periyotlarını (önyargı azaltmayı) belirlemek için kullandığı istatistiksel raporlama aracı hangisidir?`, options: [`A) OptQuest`, `B) AutoStat`, `C) SimRunner`, `D) Çıktı Analizcisi (Output Analyzer)`, `E) Süreç Analizcisi (Process Analyzer)`], ans: `D) Çıktı Analizcisi (Output Analyzer)`, exp: `Arena, istatistikleri ve güven aralıklarını hesaplamak, ısınmayı tespit etmek için Output Analyzer'ı; deney/senaryo tasarımı için ise Process Analyzer'ı kullanır.`, exams: [`Ünite 10`] },
    { q: `Bir simülasyon programının optimizasyon yapabilmesi için kullanıcının öncelikle ne tanımlaması gerekir?`, options: [`A) 3 Boyutlu animasyon rengi`, `B) Kodun lisansını`, `C) Bir hedef (amaç) işlevi veya uygunluk işlevi`, `D) Bilgisayarın bellek miktarını`, `E) İnternet bağlantısını`], ans: `C) Bir hedef (amaç) işlevi veya uygunluk işlevi`, exp: `Optimizasyon (en iyiyi arama) mantığının çalışabilmesi için sisteme "Maliyeti en aza indir" veya "Kar'ı maksimize et" gibi matematiksel bir hedef (amaç fonksiyonu) verilmelidir.`, exams: [`Ünite 10`] },
    { q: `OptQuest'in kullandığı arama süreçlerinde, aramanın "önceki denenmiş çözümleri yeniden boş yere araştırmasını" engellemek için getirilen algoritma aşağıdakilerden hangisidir?`, options: [`A) Dağılım araması`, `B) Sinir ağları`, `C) Tabu arama (Tabu search)`, `D) Genetik algoritma`, `E) Doğrusal programlama`], ans: `C) Tabu arama (Tabu search)`, exp: `Tabu araması, daha önce denenmiş başarısız veya işe yaramaz yolları hafızada tutarak (tabu ilan ederek) algoritmanın aynı hataları tekrarlamasını önler.`, exams: [`Ünite 10`] },
    { q: `Aşağıdaki yazılımlardan hangisi, simülasyonları "açık veritabanı bağlantısı (ODBC)" ve "AktifX/COM" destekleyerek harici programlarla en çok etkileşime giren (Blokları hiyerarşik kitaplıklar halinde tutan) programdır?`, options: [`A) Extend`, `B) GPSS`, `C) GASP`, `D) FORTRAN`, `E) ALGOL`], ans: `A) Extend`, exp: `Extend yazılımı, açık mimarisi sayesinde ODBC, Microsoft ActiveX ve C arayüzleri ile harici veri tabanlarıyla güçlü entegrasyon kurar.`, exams: [`Ünite 10`] },
    { q: `Arena şablonlarında (Basic, Standard, Professional) yer alan standart simülasyon özelliklerinin yanı sıra varlıkların (Entity) akışını göstermek için hangi yöntem kullanılır?`, options: [`A) Sadece komut satırı yazıları`, `B) XML veri setleri`, `C) Simge/grafik nesnelerinin bağlanması`, `D) Excel tabloları`, `E) Tabu araması`], ans: `C) Simge/grafik nesnelerinin bağlanması`, exp: `Arena, blok/modül mantığıyla çalışır. Varlık akışı, sürükle-bırak grafik nesnelerin (modüllerin) birbirine çizgilerle bağlanmasıyla sağlanır.`, exams: [`Ünite 10`] },
    { q: `Hangi simülasyon yazılımında kullanıcı eylemlerini yürütmek için aktif bir varlık olarak "Yükler (Loads)" terimi kullanılır?`, options: [`A) Arena`, `B) AutoMod`, `C) ProModel`, `D) Micro Saint`, `E) SIMUL8`], ans: `B) AutoMod`, exp: `AutoMod perspektifinde "varlıklar/müşteriler" genellikle Yükler (Loads) olarak adlandırılır, çünkü sistem depo ve konveyör (malzeme işleme) ağırlıklıdır.`, exams: [`Ünite 10`] },
    { q: `Optimizasyon (örneğin OptQuest, SimRunner vb.) yazılımlarında, yerel optimallikte (local optimum) hapsolmaktan kaçınmak neden çok önemlidir?`, options: [`A) Sistem sadece yerel para birimiyle çalıştığı için`, `B) Programın daha hızlı çalışmasını sağlamak için`, `C) Gerçek dünya problemlerinde doğru (en mükemmel) küresel çözümün (Global optimum) bulunabilmesi için`, `D) Başlangıç koşulunu silmek için`, `E) Animasyonun donmasını engellemek için`], ans: `C) Gerçek dünya problemlerinde doğru (en mükemmel) küresel çözümün (Global optimum) bulunabilmesi için`, exp: `Klasik algoritmalar bulduğu ilk "iyi" çözümde (yerel) takılı kalabilir ve aramayı bırakır. Meta-sezgisel algoritmalar ise daha uzağa bakıp en büyük/en iyi çözümü (küresel) bulana kadar sıçramalar yapar.`, exams: [`Ünite 10`] },
// --- 11. Ünite: Arena Dili ve Temel Kavramları Soruları ---
    { q: `Arena simülasyon ortamı, altyapı olarak hangi simülasyon programlama dilinin etrafında oluşturulmuştur?`, options: [`A) GPSS`, `B) SIMSCRIPT`, `C) Java`, `D) SIMAN`, `E) SLAM`], ans: `D) SIMAN`, exp: `Arena, arka planda çalışan ve iki ana bileşenden (bloklar ve elemanlar) oluşan SIMAN dilinin görsel bir kullanıcı arayüzü ile zenginleştirilmiş halidir.`, exams: [`Ünite 11`] },
    { q: `SIMAN dilini oluşturan iki temel sınıf aşağıdakilerden hangisidir?`, options: [`A) Bloklar ve Elemanlar`, `B) Modüller ve Menüler`, `C) Süreçler ve Kaynaklar`, `D) Varlıklar ve Özellikler`, `E) Değişkenler ve Kuyruklar`], ans: `A) Bloklar ve Elemanlar`, exp: `SIMAN dili temel olarak işlemleri temsil eden 'Bloklar' (Blocks) ve tesisleri/istatistikleri temsil eden 'Elemanlar' (Elements) sınıflarından oluşur.`, exams: [`Ünite 11`] },
    { q: `Bir kaynağın (resource) başka işlemler tarafından kullanılmak üzere serbest bırakılmasını sağlayan temel SIMAN bloğu aşağıdakilerden hangisidir?`, options: [`A) SEIZE`, `B) RELEASE`, `C) DELAY`, `D) ASSIGN`, `E) QUEUE`], ans: `B) RELEASE`, exp: `SEIZE kaynağı ele geçirmek (tutmak) için kullanılırken, RELEASE (Bırak) bloğu işi biten kaynağı serbest bırakır.`, exams: [`Ünite 11`] },
    { q: `Arena'da görsel bir model inşa ederken tuvale (canvas) yerleştirilen ve arka planda birden fazla SIMAN blok/elemanından oluşan yüksek seviyeli yapılara ne ad verilir?`, options: [`A) Değişken`, `B) Varlık`, `C) Menü`, `D) Modül`, `E) Sınıf`], ans: `D) Modül`, exp: `Arena'da sürükleyip bıraktığımız kutucuklara (Create, Process, Dispose vb.) Modül denir. Modüller SIMAN bloklarının paketlenmiş görsel halidir.`, exams: [`Ünite 11`] },
    { q: `Arena programlama ortamında kod yazımıyla ilgili "büyük/küçük harf" kuralı nasıldır?`, options: [`A) Sadece büyük harf kullanılmalıdır.`, `B) Sadece küçük harf kullanılmalıdır.`, `C) Kodlar büyük/küçük harfe duyarlıdır (Case-sensitive).`, `D) Kodlar büyük/küçük harfe duyarsızdır (Büyük ve küçük harf birbirinin yerine kullanılabilir).`, `E) Yalnızca ilk harfler büyük olmalıdır.`], ans: `D) Kodlar büyük/küçük harfe duyarsızdır (Büyük ve küçük harf birbirinin yerine kullanılabilir).`, exp: `Arena büyük/küçük harfe duyarsızdır. Yani 'PROCESS' ile 'process' veya 'Process' yazımları program için tamamen aynı anlama gelir.`, exams: [`Ünite 11`] },
    { q: `Simülasyonla ilgili araçlara (Input/Output Analyzer vb.) ve Arena parametrelerine erişim sağlayan menü aşağıdakilerden hangisidir?`, options: [`A) Dosya Menüsü`, `B) Görünüm Menüsü`, `C) Araçlar (Tools) Menüsü`, `D) Nesne Menüsü`, `E) Çalıştır Menüsü`], ans: `C) Araçlar (Tools) Menüsü`, exp: `Araçlar (Tools) menüsü, Arena'ya özgü istatistiksel analiz ve diğer yardımcı araçlara erişim sağlar.`, exams: [`Ünite 11`] },
    { q: `Modül bağlantılarını ve alt model (submodel) oluşturmayı destekleyen Arena menüsü hangisidir?`, options: [`A) Düzenle (Edit)`, `B) Nesne (Object)`, `C) Çalıştır (Run)`, `D) Görünüm (View)`, `E) Dosya (File)`], ans: `B) Nesne (Object)`, exp: `Nesne menüsü, modüllerin mantıksal bağlantılarını yönetmek ve karmaşık modelleri alt modellere gruplamak için kullanılır.`, exams: [`Ünite 11`] },
    { q: `Arena arayüzünde CREATE, PROCESS, DISPOSE, DECIDE, BATCH gibi temel modüllerin bulunduğu şablon paneli aşağıdakilerden hangisidir?`, options: [`A) ADVANCED PROCESS (Gelişmiş İşlem)`, `B) ADVANCED TRANSPORT (Gelişmiş Aktarım)`, `C) REPORTS (Raporlar)`, `D) BLOCKS (Bloklar)`, `E) BASIC PROCESS (Temel İşlem)`], ans: `E) BASIC PROCESS (Temel İşlem)`, exp: `Bir sistemin en temel giriş, işlem, karar ve çıkış modülleri Basic Process şablon panelinde yer alır.`, exams: [`Ünite 11`] },
    { q: `Ekranda eksik olan bir şablon panelini (.tpo dosyasını) Proje Çubuğuna eklemek için hangi düğme veya özellik kullanılır?`, options: [`A) Çalıştır düğmesi`, `B) Ekle (Attach) düğmesi`, `C) Yakınlaştır düğmesi`, `D) Animasyon düğmesi`, `E) Hata Ayıklama (Debug)`], ans: `B) Ekle (Attach) düğmesi`, exp: `Proje çubuğuna yeni bir panel (örneğin Advanced Process.tpo) eklemek için 'Ekle/Attach' düğmesi kullanılır.`, exams: [`Ünite 11`] },
    { q: `Modüller arasında mantıksal kontrol akışını sağlamak (modülleri birbirine bağlamak) için kullanılan Standart Araç Çubuğu düğmesi hangisidir?`, options: [`A) BAŞLAT`, `B) CONNECT (Bağlan)`, `C) YAKINLAŞTIR`, `D) SCHEDULE`, `E) RECORD`], ans: `B) CONNECT (Bağlan)`, exp: `Görsel programlamanın temeli olan CONNECT düğmesi, bir modülden çıkan varlığın hangi modüle gideceğini oklarla belirler.`, exams: [`Ünite 11`] },
    { q: `Simülasyon çalışırken "kesme noktaları (breakpoints) ayarlamak, değişken değerlerini izlemek ve modüller arası varlık akışını komutla kontrol etmek" için kullanılan araç çubuğu hangisidir?`, options: [`A) Çizim Çubuğu`, `B) Animasyon Çubuğu`, `C) Hata Ayıklama (Debug) Çubuğu`, `D) Entegrasyon Çubuğu`, `E) Görünüm Çubuğu`], ans: `C) Hata Ayıklama (Debug) Çubuğu`, exp: `Hata Ayıklama (Debug) çubuğu, sistemdeki mantık hatalarını bulmak için simülasyonu adım adım çalıştırmaya ve değişkenleri anlık izlemeye yarar.`, exams: [`Ünite 11`] },
    { q: `Diğer uygulamalara veri aktarımını (içe/dışa aktarma) ve Visual Basic (VBA) programlama tasarımını destekleyen araç çubuğu hangisidir?`, options: [`A) Çizim Çubuğu`, `B) Entegrasyon Çubuğu`, `C) Hata Ayıklama Çubuğu`, `D) Animasyon Transfer Çubuğu`, `E) Görünüm Çubuğu`], ans: `B) Entegrasyon Çubuğu`, exp: `Excel gibi dış programlarla veya veritabanlarıyla haberleşmek, Visual Basic kodları eklemek Entegrasyon Çubuğu üzerinden yapılır.`, exams: [`Ünite 11`] },
    { q: `M/M/1 kuyruk modeli gibi bir iş istasyonunda "Makinede işlem görme operasyonunu" taklit eden ve içinde Seize, Delay, Release mantığını barındıran modül hangisidir?`, options: [`A) CREATE`, `B) DISPOSE`, `C) RECORD`, `D) PROCESS`, `E) ASSIGN`], ans: `D) PROCESS`, exp: `Sürecin (işlemin) gerçekleştiği, kaynağın tutulduğu ve zamanın harcandığı ana işlem modülü PROCESS modülüdür.`, exams: [`Ünite 11`] },
    { q: `Gelişler arası süreyi (Time Between Arrivals) manuel bir çizelge veya vardiya tablosu ile belirlemek için CREATE modülünde hangi 'Type (Tip)' seçilmelidir?`, options: [`A) RANDOM (Rassal)`, `B) CONSTANT (Sabit)`, `C) EXPRESSION (Açıklama)`, `D) SCHEDULE (Zamanlama)`, `E) BATCH (Parti)`], ans: `D) SCHEDULE (Zamanlama)`, exp: `Kullanıcının zamana bağlı özel geliş oranları oluşturmasına olanak tanıyan seçenek SCHEDULE seçeneğidir.`, exams: [`Ünite 11`] },
    { q: `PROCESS modülü içinde "Gerekli kaynak kapasitesi uygun olana kadar gelen varlıkları bekleten (kapı görevi gören)" mantıksal yapı (blok) hangisidir?`, options: [`A) DELAY`, `B) RELEASE`, `C) SEIZE`, `D) ASSIGN`, `E) RECORD`], ans: `C) SEIZE`, exp: `SEIZE (Tut/Ele Geçir) bloğu, kaynak boşalana kadar kapıyı kapalı tutar ve varlıkların kuyrukta (Queue) beklemesini sağlar.`, exams: [`Ünite 11`] },
    { q: `Bir varlığın PROCESS modülü içindeki kaynak tarafından işlem görürken harcadığı süreyi (gecikmeyi) belirleyen blok hangisidir?`, options: [`A) SEIZE`, `B) DELAY`, `C) RELEASE`, `D) QUEUE`, `E) SCHEDULE`], ans: `B) DELAY`, exp: `DELAY (Erteleme/Geciktirme) bloğu, makinenin parçayı işleme süresi kadar simülasyon saatinin ilgili varlık için duraklatılmasını sağlar.`, exams: [`Ünite 11`] },
    { q: `Bir PROCESS modülünde işlem yapılabilmesi için 'birden fazla' farklı kaynağın aynı anda kullanılması gerekiyorsa (Örn: Hem makine hem operatör), DELAY süresi ne zaman işlemeye başlar?`, options: [`A) Kaynaklardan ilki boşaldığı an`, `B) Varlık kuyruğa girdiği an`, `C) Listelenen tüm gerekli kaynaklar tamamen kullanılabilir olduktan sonra`, `D) Simülasyon başlatıldığında`, `E) Operatör moladan döndüğünde`], ans: `C) Listelenen tüm gerekli kaynaklar tamamen kullanılabilir olduktan sonra`, exp: `Gerekli kaynaklardan biri bile eksikse işlem (Delay) başlamaz; varlık tüm kaynaklar aynı anda serbest kalana kadar bekler.`, exams: [`Ünite 11`] },
    { q: `Arena modellerinde, bilgisayarın belleğinin (RAM) dolmasını ve simülasyonun çökmesini engellemek için, işlemi biten varlıkları sistemden tamamen yok eden modül hangisidir?`, options: [`A) PROCESS`, `B) CREATE`, `C) DECIDE`, `D) DISPOSE`, `E) RECORD`], ans: `D) DISPOSE`, exp: `DISPOSE (Elden Çıkarma) modülü sistemdeki bir "havuz/çöpe atma" noktasıdır. İşlemi biten varlıkları bellekten siler.`, exams: [`Ünite 11`] },
    { q: `Bir Arena modeli kaydedildiğinde, kullanıcının çalıştığı ana proje dosyasının uzantısı aşağıdakilerden hangisi olur?`, options: [`A) .mdb`, `B) .err`, `C) .opw`, `D) .out`, `E) .doe`], ans: `E) .doe`, exp: `Arena proje dosyaları .doe uzantısıyla kaydedilir. Diğerleri (.mdb, .err) sistemin otomatik ürettiği yan çalışma dosyalarıdır.`, exams: [`Ünite 11`] },
    { q: `Simülasyon modelinin "Koşum sayısını, Koşum uzunluğunu (Replication Length) ve Isınma süresini (Warm-up Period)" belirlemek için Çalıştır (Run) menüsünde hangi seçeneğe girilir?`, options: [`A) Check Model`, `B) Setup (Kurulum) -> Replication Parameters`, `C) Step (Adım adım)`, `D) Fast Forward`, `E) Pause`], ans: `B) Setup (Kurulum) -> Replication Parameters`, exp: `Simülasyonun süresi, döngüsü ve ısınma parametreleri Run Setup altındaki Replication Parameters sekmesinden ayarlanır.`, exams: [`Ünite 11`] },
    { q: `Sistemi başlangıçtaki "tipik olmayan (boş)" durumdan çıkarıp daha temsil edilebilir (kararlı) bir duruma getirmek için istatistiklerin toplanmadığı başlangıç aralığına ne ad verilir?`, options: [`A) Koşum Uzunluğu`, `B) Bitiş Süresi`, `C) Isınma Periyodu (Warm-up Period)`, `D) Gecikme Süresi`, `E) Geçiş Süresi`], ans: `C) Isınma Periyodu (Warm-up Period)`, exp: `Başlangıç önyargısını silmek için simülasyonun istatistik toplamadan çalıştırıldığı ön evreye Isınma Periyodu denir.`, exams: [`Ünite 11`] },
    { q: `Arena Çıktı Raporunda (Output Report) "Resources (Kaynaklar)" sekmesinde yer alan "NUMBER BUSY" istatistiği neyi ifade eder?`, options: [`A) Kuyrukta bekleyen müşteri sayısını`, `B) Toplam kaynak kapasitesini`, `C) Bir kaynağın o an meşgul (işlem yapan) birimlerinin sayısını`, `D) Sisteme giren toplam varlık sayısını`, `E) Kaynağın mola süresini`], ans: `C) Bir kaynağın o an meşgul (işlem yapan) birimlerinin sayısını`, exp: `NUMBER BUSY, kaynağın fiilen kullanımda olan (aktif çalışan) kısmını temsil eder.`, exams: [`Ünite 11`] },
    { q: `Arena Çıktı Raporunda (Output Report) yer alan "NUMBER SCHEDULED" istatistiği neyi ifade eder?`, options: [`A) Meşgul birim sayısını`, `B) O kaynağın tanımlanmış toplam kapasitesini`, `C) Bekleme süresini`, `D) Transfer süresini`, `E) Atılan varlık sayısını`], ans: `B) O kaynağın tanımlanmış toplam kapasitesini`, exp: `NUMBER SCHEDULED, o kaynak için tanımlanmış maksimum kapasite veya vardiya bazlı mevcut personel (çalışması planlanan) sayısıdır.`, exams: [`Ünite 11`] },
    { q: `Kaynak kullanım oranını veren "INSTANTANEOUS UTILIZATION" (Anlık Kullanım) formülü Arena raporunda nasıl hesaplanır?`, options: [`A) NUMBER BUSY / NUMBER SCHEDULED`, `B) NUMBER SCHEDULED / NUMBER BUSY`, `C) NUMBER BUSY + NUMBER SCHEDULED`, `D) NUMBER BUSY * 100`, `E) NUMBER SCHEDULED / Gelen Varlık Sayısı`], ans: `A) NUMBER BUSY / NUMBER SCHEDULED`, exp: `Meşgul olan birim sayısının, planlanan toplam kapasiteye bölünmesiyle o kaynağın ne oranda kullanıldığı (Utilization) bulunur.`, exams: [`Ünite 11`] },
    { q: `Arena raporlarında güven aralığı değerinin yanında "Insufficient" (Yetersiz) ibaresi yazıyorsa bunun istatistiksel anlamı nedir?`, options: [`A) Simülasyon çökmüştür`, `B) Varlıklar kuyrukta kaybolmuştur`, `C) İstatistiksel bir güven aralığı (Half-width) oluşturmak için toplanan gözlem sayısı (veri) yetersizdir`, `D) Kaynaklar arızalanmıştır`, `E) Doğru dağılım seçilmemiştir`], ans: `C) İstatistiksel bir güven aralığı (Half-width) oluşturmak için toplanan gözlem sayısı (veri) yetersizdir`, exp: `Yeterli sayıda örneklem (n) oluşmadığında veya simülasyon yeterince uzun çalışmadığında program güven aralığını hesaplayamaz ve "Yetersiz" uyarısı verir.`, exams: [`Ünite 11`] },
    { q: `Kuyruktaki ortalama bekleme süresi, maksimum kuyruk uzunluğu (doluluk) gibi performans ölçütleri Arena çıktı raporlarının hangi bölümünde (kategorisinde) bulunur?`, options: [`A) Resources (Kaynaklar)`, `B) Entities (Varlıklar)`, `C) Variables (Değişkenler)`, `D) Queues (Kuyruklar)`, `E) Frequencies (Frekanslar)`], ans: `D) Queues (Kuyruklar)`, exp: `Tüm bekleme hattı uzunlukları, maksimum bekleyen sayısı ve hatta bekleme süreleri Queues (Kuyruklar) raporu altında detaylandırılır.`, exams: [`Ünite 11`] },
    { q: `Kullanıcıya özel sayaçlar oluşturmak, belirli istatistikleri kendi tanımladığı şekilde toplamak için Advanced Process şablonundan hangi modül modele eklenebilir?`, options: [`A) STATISTICS (İstatistik) veya RECORD (Kayıt)`, `B) DELAY (Erteleme)`, `C) DISPOSE (Elden Çıkarma)`, `D) SEPARATE (Ayırma)`, `E) BATCH (Parti)`], ans: `A) STATISTICS (İstatistik) veya RECORD (Kayıt)`, exp: `Arena'nın otomatik raporlarının dışında, belirli bir noktadan geçen kişi sayısını veya özel bir durumu kaydetmek için Record veya Statistic modülleri kullanılır.`, exams: [`Ünite 11`] },
    { q: `Arena'da bir CREATE modülünde "Max Arrivals" (Maksimum Geliş) alanı ne işe yarar?`, options: [`A) Kuyruğun maksimum kapasitesini belirler.`, `B) Sisteme girebilecek maksimum toplam varlık (müşteri, parça vb.) sayısını sınırlar.`, `C) Makinenin maksimum hızını belirler.`, `D) Raporun sayfa sayısını belirler.`, `E) Çalışma süresini belirler.`], ans: `B) Sisteme girebilecek maksimum toplam varlık (müşteri, parça vb.) sayısını sınırlar.`, exp: `Eğer bu alana "100" yazılırsa, sistem 100. varlığı ürettikten sonra Create modülü bir daha varlık üretmez (gelişler durur).`, exams: [`Ünite 11`] },
    { q: `Gelişler arası süreyi belirleyen RANDOM seçeneği Arena'da varsayılan olarak hangi istatistiksel dağılımı ifade eder?`, options: [`A) Normal Dağılım`, `B) Üstel (Exponential) Dağılım`, `C) Düzgün Dağılım`, `D) Poisson Dağılımı`, `E) Weibull Dağılımı`], ans: `B) Üstel (Exponential) Dağılım`, exp: `Arena'da Random (Rassal) seçildiğinde arka planda süreler ortalaması belirtilen Üstel (Exponential / EXPO) dağılıma göre üretilir.`, exams: [`Ünite 11`] },
    { q: `İşlerin varış sürelerinin üstel dağılımla (M), işlem sürelerinin üstel dağılımla (M) ve 1 adet makinenin (1) olduğu sistem kuyruk teorisinde hangi notasyonla gösterilir?`, options: [`A) G/G/1`, `B) M/M/C`, `C) M/G/1`, `D) M/M/1`, `E) D/D/1`], ans: `D) M/M/1`, exp: `Varış: M (Markovian/Üstel), Servis: M (Üstel), Kanal sayısı: 1 olduğu için bu sistem M/M/1 olarak notasyonlandırılır.`, exams: [`Ünite 11`] },
// --- 12. Ünite: Arena Dili - Basic Process Soruları ---
    { q: `Yeni varlıklar oluşturmak ve bunları simülasyon modeline iletmek için kullanılan Basic Process modülü aşağıdakilerden hangisidir?`, options: [`A) PROCESS`, `B) DISPOSE`, `C) CREATE`, `D) ASSIGN`, `E) BATCH`], ans: `C) CREATE`, exp: `Sisteme müşteri, parça, hasta gibi yeni varlıkların (entities) giriş yaptığı, türetildiği ilk modül CREATE modülüdür.`, exams: [`Ünite 12`] },
    { q: `CREATE modülünde yer alan "TIME BETWEEN ARRIVALS" (Gelişler Arası Süre) bölümündeki TYPE alanı "Random (Expo)" olarak seçildiğinde sistem nasıl davranır?`, options: [`A) Varlıklar sabit zaman aralıklarıyla gelir.`, `B) Gelişler arası zamanlar normal dağılıma uyar.`, `C) Gelişler arası zamanlar üssel (exponential) dağılıma uyar.`, `D) Varlıklar vardiya çizelgesine göre gelir.`, `E) Varlıklar üçgensel dağılıma göre gelir.`], ans: `C) Gelişler arası zamanlar üssel (exponential) dağılıma uyar.`, exp: `Arena'da "Random (Expo)" seçeneği, geliş sürelerinin rastgele ve Üssel (Exponential) dağılıma uygun olmasını sağlar.`, exams: [`Ünite 12`] },
    { q: `CREATE modülündeki "ENTITIES PER ARRIVAL" alanı aşağıdakilerden hangisini ifade eder?`, options: [`A) Sisteme girecek maksimum toplam varlık sayısını`, `B) İlk varlığın geliş zamanını`, `C) Varlıkların maliyetini`, `D) Her bir geliş olayında (parti halinde) sisteme aynı anda kaç varlık gireceğini`, `E) Varlıkların sistemde bekleme süresini`], ans: `D) Her bir geliş olayında (parti halinde) sisteme aynı anda kaç varlık gireceğini`, exp: `Eğer buraya 5 yazılırsa, belirlenen her geliş anında sisteme tek tek değil, 5'erli gruplar halinde varlık girer.`, exams: [`Ünite 12`] },
    { q: `Kuyruk teorisindeki "popülasyon (yığın)" kavramını modelleyen ve CREATE modülü yardımıyla en fazla kaç varlık türetileceğini sınırlayan özellik hangisidir?`, options: [`A) Entities per Arrival`, `B) First Creation`, `C) Max Arrivals`, `D) Value`, `E) Entity Type`], ans: `C) Max Arrivals`, exp: `Max Arrivals, sisteme girebilecek toplam maksimum müşteri veya parça sayısını (yığın kısıtını) belirtir.`, exams: [`Ünite 12`] },
    { q: `Simülasyon modelinden varlıkların çıkış noktası olarak kullanılan ve varlıkları sistemden tamamen çıkaran modül hangisidir?`, options: [`A) CREATE`, `B) DISPOSE`, `C) PROCESS`, `D) DECIDE`, `E) RECORD`], ans: `B) DISPOSE`, exp: `Her varlığın süreç yerleşiminin en sonunda ulaştığı ve istatistikleri kaydedilip sistemden yok edildiği modül DISPOSE modülüdür.`, exams: [`Ünite 12`] },
    { q: `PROCESS modülünde "Action" olarak aşağıdakilerden hangisi seçildiğinde, bir varlık kaynağa atanır, kaynağı meşgul eder ve ardından işlemi bitince serbest bırakır?`, options: [`A) Delay`, `B) Seize Delay`, `C) Delay Release`, `D) Seize Delay Release`, `E) Batch`], ans: `D) Seize Delay Release`, exp: `Seize (Kaynağı tut), Delay (İşlem süresi kadar geciktir/meşgul et), Release (Kaynağı serbest bırak) adımlarının tam döngüsüdür.`, exams: [`Ünite 12`] },
    { q: `PROCESS modülünde tanımlanan bir kaynak havuzunda (Set), kaynaklar arasında döngü oluşturarak sırayla seçim yapılmasını sağlayan "Selection Rule" (Seçim Kuralı) hangisidir?`, options: [`A) Random`, `B) Preferred Order`, `C) Specific Member`, `D) Largest Remaining Capacity`, `E) Cyclical`], ans: `E) Cyclical`, exp: `Cyclical (Döngüsel) kuralı, kaynak kümesindeki elemanları (örneğin 3 makineyi) sırayla, bir döngü içinde seçer.`, exams: [`Ünite 12`] },
    { q: `Birden fazla kapasiteye sahip kaynakların bulunduğu bir kümede, "en düşük oranda meşgul olan" kaynağı seçmek için kullanılan kural hangisidir?`, options: [`A) Largest Remaining Capacity`, `B) Smallest Number Busy`, `C) Specific Member`, `D) Random`, `E) Preferred Order`], ans: `B) Smallest Number Busy`, exp: `Adından da anlaşılacağı üzere, iş yükünü dengelemek için "en az meşgul olan" (Smallest Number Busy) kaynağa atama yapılır.`, exams: [`Ünite 12`] },
    { q: `Bir kalite kontrol istasyonunda "Ürünün %60 sağlam, %40 hatalı" çıkması durumunu Arena'da modellemek için DECIDE modülünde hangi "Type" seçilmelidir?`, options: [`A) 2-way by condition`, `B) N-way by condition`, `C) 2-way by chance`, `D) N-way by chance`, `E) Split existing batch`], ans: `C) 2-way by chance`, exp: `İki farklı sonucun belirli yüzdesel olasılıklara (şansa) bağlı olduğu durumlarda "2-way by chance" (Şans eseri 2 yollu) kullanılır.`, exams: [`Ünite 12`] },
    { q: `DECIDE modülünde "100 adet ürün üretildikten sonra makinelerin bakıma girmesi" gibi koşula bağlı 2 farklı senaryo oluşturmak için hangi "Type" seçilmelidir?`, options: [`A) 2-way by chance`, `B) 2-way by condition`, `C) N-way by chance`, `D) N-way by condition`, `E) Duplicate Original`], ans: `B) 2-way by condition`, exp: `Kararın bir olasılığa değil, matematiksel/mantıksal bir kurala (Eğer X>100 ise) bağlı olduğu durumlarda "Condition" (Koşul) kullanılır.`, exams: [`Ünite 12`] },
    { q: `Simülasyon modelinde varlıkları "gruplar halinde sınıflandırmak (birleştirmek)" için kullanılan mekanizma/modül aşağıdakilerden hangisidir?`, options: [`A) SEPARATE`, `B) ASSIGN`, `C) RECORD`, `D) BATCH`, `E) DISPOSE`], ans: `D) BATCH`, exp: `Batch (Parti) modülü, gelen varlıkları belirlenen sayıya (Batch Size) ulaşana kadar bekletir ve tek bir temsili varlık (kutu, palet vb.) olarak gruplar.`, exams: [`Ünite 12`] },
    { q: `Daha önce geçici olarak gruplanmış (Temporary Batch) varlıkların orijinal üyelerini ayırmak ve kurtarmak için hangi modül kullanılır?`, options: [`A) CREATE`, `B) BATCH`, `C) SEPARATE`, `D) DECIDE`, `E) RECORD`], ans: `C) SEPARATE`, exp: `SEPARATE (Ayırma) modülü, Batch ile birleştirilmiş paketleri tekrar içindeki tekil varlıklara ayırır (Split existing Batch) veya varlığı çoğaltır.`, exams: [`Ünite 12`] },
    { q: `SEPARATE modülünde "Gelen varlığın (orijinal birimin) aynısını belirli sayıda kopyalamak" için hangi özellik seçilir?`, options: [`A) Split existing Batch`, `B) Temporary Batch`, `C) Permanent Batch`, `D) Duplicate Original`, `E) N-way by chance`], ans: `D) Duplicate Original`, exp: `Duplicate Original, gelen varlığın (örneğin bir evrağın kopyasının çıkarılıp başka bir departmana gönderilmesi) aynısından çoğaltma yapar.`, exams: [`Ünite 12`] },
    { q: `Değişkenlere (Variable), varlık özelliklerine (Attribute), varlık tiplerine ve resimlerine "yeni değerler atamak" için kullanılan modül hangisidir?`, options: [`A) ASSIGN`, `B) RECORD`, `C) BATCH`, `D) PROCESS`, `E) CREATE`], ans: `A) ASSIGN`, exp: `Assign (Atama) modülü, varlıkların üzerine bilgi yazmak veya sistemdeki global değişkenlerin (Örn: Maliyet = Maliyet + 10) değerini değiştirmek için kullanılır.`, exams: [`Ünite 12`] },
    { q: `Modeldeki belirli bir konumda sayım yaptırmak (Count) veya varlık istatistiklerini/zaman aralıklarını toplamak için kullanılan modül hangisidir?`, options: [`A) DECIDE`, `B) ASSIGN`, `C) RECORD`, `D) PROCESS`, `E) SEPARATE`], ans: `C) RECORD`, exp: `Record (Kayıt) modülü, içinden geçen varlıkları saymak (sayaç) veya aradan geçen zamanı istatistik olarak kaydetmek (Tally) için kullanılır.`, exams: [`Ünite 12`] },
    { q: `RECORD modülünde "Mevcut simülasyon zamanı ile belirlenmiş bir özellik (Attribute) değeri arasındaki farkı hesaplayıp kaydetmek" için hangi Type seçilir?`, options: [`A) Count`, `B) Entity Statistics`, `C) Expression`, `D) Time Between`, `E) Time Interval`], ans: `E) Time Interval`, exp: `Time Interval, varlığın sisteme giriş zamanı (bir attribute olarak kaydedilmişse) ile o anki zaman arasındaki geçen süreyi hesaplar.`, exams: [`Ünite 12`] },
    { q: `Varlıkların (Entities) resimlerinin atandığı, elde tutma ve değişken maliyetlerinin tanımlandığı Arena veri sayfası (spreadsheet) aşağıdakilerden hangisidir?`, options: [`A) Variable`, `B) Entity`, `C) Resource`, `D) Queue`, `E) Schedule`], ans: `B) Entity`, exp: `Entity çalışma sayfasında sisteme giren varlıkların tipleri, görsel ikonları (Picture) ve başlangıç maliyetleri tanımlanır.`, exams: [`Ünite 12`] },
    { q: `Kuyruk (Queue) disiplini kurallarından hangisi "En düşük işlem süresine sahip varlığın ilk işlem görmesini" sağlamak için tercih edilir?`, options: [`A) First In First Out (FIFO)`, `B) Last In First Out (LIFO)`, `C) Highest Attribute Value`, `D) Lowest Attribute Value`, `E) Random`], ans: `D) Lowest Attribute Value`, exp: `Arena'da "Kısa İşlem Süreli İşlem Önceliği (SPT)" mantığını kurmak için, işlem süresi bir özelliğe (Attribute) atanır ve kuyruk kuralı Lowest Attribute Value (En düşük özellik değeri) seçilir.`, exams: [`Ünite 12`] },
    { q: `Arena'da servis veren makine veya personelin tanımlandığı, kapasite (Capacity) ve arıza (Failure) bilgilerinin girildiği çalışma sayfası hangisidir?`, options: [`A) Variable`, `B) Schedule`, `C) Set`, `D) Resource`, `E) Entity`], ans: `D) Resource`, exp: `Resource (Kaynak) sayfasında kaynağın tipi (Sabit veya Çizelgeye Bağlı), sayısı, maliyetleri ve arıza (Failure) bilgileri yönetilir.`, exams: [`Ünite 12`] },
    { q: `Çalıştırma sırasında modelin her yerinden erişilebilen, incelenebilen ve değiştirilebilen "kullanıcı tanımlı global veri depolama nesneleri" aşağıdakilerden hangisidir?`, options: [`A) Attribute (Özellik)`, `B) Entity (Varlık)`, `C) Variable (Değişken)`, `D) Resource (Kaynak)`, `E) Queue (Kuyruk)`], ans: `C) Variable (Değişken)`, exp: `Değişkenler (Variables) sistemin her yerinden okunup yazılabilen global değerlerdir. Özellikler (Attributes) ise sadece ilgili varlığın şahsına aittir.`, exams: [`Ünite 12`] },
    { q: `Arena'da "simülasyon çalışmasının geçerli zamanını (o anki simülasyon saatini)" saklayan, önceden tanımlanmış sistem değişkeni hangisidir?`, options: [`A) TFIN`, `B) NQ`, `C) NR`, `D) TNOW`, `E) EXPO`], ans: `D) TNOW`, exp: `TNOW (Time Now), simülasyonun o anki iç saatinin (süresinin) değerini tutan özel bir sistem değişkenidir. Kullanıcı bu değeri değiştiremez, sadece okuyabilir.`, exams: [`Ünite 12`] },
    { q: `Belirli bir "Makine_Q" kuyruğunda o an bekleyen varlıkların (müşterilerin) sayısını veren sistem değişkeni hangisidir?`, options: [`A) NR(Makine)`, `B) NQ(Makine_Q)`, `C) TNOW`, `D) TFIN`, `E) MR(Makine)`], ans: `B) NQ(Makine_Q)`, exp: `NQ (Number in Queue), parantez içine yazılan kuyruğun o andaki anlık uzunluğunu (bekleyen kişi sayısını) döndürür.`, exams: [`Ünite 12`] },
    { q: `Kaynakların kapasite değişimleri (vardiyalar) veya varlıkların geliş oranları için zaman periyotlarının (Duration) tanımlandığı çalışma sayfası hangisidir?`, options: [`A) Variable`, `B) Entity`, `C) Schedule`, `D) Set`, `E) Record`], ans: `C) Schedule`, exp: `Schedule (Çizelge) sayfasında kaynakların mola zamanları, vardiya planları veya günün saatlerine göre değişen müşteri geliş oranları tanımlanır.`, exams: [`Ünite 12`] },
    { q: `Aynı işlevi gören kaynakları (Resource), sayaçları (Counter) veya varlık tiplerini "küme" haline getirmek için kullanılan çalışma sayfası hangisidir?`, options: [`A) Set`, `B) Schedule`, `C) Assign`, `D) Variable`, `E) Queue`], ans: `A) Set`, exp: `Set (Küme) çalışma sayfası, örneğin 3 farklı operatörü (Ali, Veli, Ayşe) tek bir "Operatörler Kümesi" altında birleştirip Process modülünde havuz olarak kullanmayı sağlar.`, exams: [`Ünite 12`] },
    { q: `PROCESS modülünde "Action" parametresi "Delay" olarak seçildiğinde aşağıdakilerden hangisi gerçekleşir?`, options: [`A) Varlık kaynağı meşgul eder ama işlemi bitince bırakmaz.`, `B) Sadece belirli bir süre ötelenir (zaman harcar) ancak herhangi bir kapasiteli kaynak (Resource) tutulmaz.`, `C) Kaynak serbest bırakılır.`, `D) Varlık sistemden atılır.`, `E) Alt modele (Submodel) geçiş yapılır.`], ans: `B) Sadece belirli bir süre ötelenir (zaman harcar) ancak herhangi bir kapasiteli kaynak (Resource) tutulmaz.`, exp: `Sadece "Delay" seçilirse, simülasyon saati belirtilen süre kadar duraklatılır ancak fiziksel bir kaynak (Seize/Release işlemi) kullanılmaz.`, exams: [`Ünite 12`] },
    { q: `Bir kaynak kümesinden (Set) seçim yaparken "Selection Rule" olarak "Specific Member" seçildiğinde Arena neye ihtiyaç duyar?`, options: [`A) Random kuralına`, `B) En az kapasiteli kaynağa`, `C) Varlığın daha önceden kaydedilmiş olan bir Attribute (Özellik) indeks değerine`, `D) TNOW değerine`, `E) Sistemin sonlanma saatine`], ans: `C) Varlığın daha önceden kaydedilmiş olan bir Attribute (Özellik) indeks değerine`, exp: `Specific Member (Belirli Üye) kuralı, o varlık daha önce hangi işlemcide (indekste) işlem gördüyse yine o spesifik işlemciye (kaynağa) dönmesini sağlamak için kullanılır.`, exams: [`Ünite 12`] },
    { q: `DECIDE modülünde "Type" olarak "N-way by chance" seçildiğinde aşağıdakilerden hangisi tanımlanır?`, options: [`A) Mantıksal eşitlikler (==, <, >)`, `B) Tek bir evet/hayır koşulu`, `C) İkiden fazla durum için yüzdelik şans (olasılık) değerleri`, `D) Kaynak isimleri`, `E) Kuyruk isimleri`], ans: `C) İkiden fazla durum için yüzdelik şans (olasılık) değerleri`, exp: `N-way (N-Yollu) ve Chance (Şans) kelimeleri, sistemin 3 veya daha fazla farklı yola, belirlenen % yüzdelere göre ayrılacağını ifade eder.`, exams: [`Ünite 12`] },
    { q: `ASSIGN modülünde varlıklara sadece kendi şahıslarına özel etiketler atamak için "Type" olarak hangisi seçilmelidir?`, options: [`A) Variable`, `B) Attribute`, `C) System Variable`, `D) Entity Type`, `E) Resource Capacity`], ans: `B) Attribute`, exp: `Attribute (Özellik), sadece o an Assign modülünden geçen spesifik varlığın (örn: hastanın yaşı, parçanın rengi) üzerine yapıştırılan kişisel bilgi etiketidir.`, exams: [`Ünite 12`] },
    { q: `RECORD modülünde "Mevcut sayacın değerini belirlediğimiz miktarda (Örn: +1) artırmak veya azaltmak" için hangi Type seçilir?`, options: [`A) Time Interval`, `B) Expression`, `C) Count`, `D) Entity Statistics`, `E) Time Between`], ans: `C) Count`, exp: `Count (Sayım) özelliği, modülden her varlık geçtiğinde sayacın (Counter) değerini belirtilen miktar (Value) kadar artırır.`, exams: [`Ünite 12`] },
    { q: `"Makine" isimli bir kaynağın kapasitesini (sayısını) değiştirmek için hangi çalışma sayfası (Spreadsheet) kullanılır?`, options: [`A) Variable`, `B) Queue`, `C) Set`, `D) Resource`, `E) Schedule`], ans: `D) Resource`, exp: `Tüm servis veren kaynakların (personel, makine vb.) kapasite, tip ve maliyet bilgileri "Resource" çalışma sayfasından yönetilir.`, exams: [`Ünite 12`] },
// --- 13. Ünite: Arena Dili ile İleri Benzetim Modelleme Soruları ---
    { q: `Bir varlık grubundan belirli sayıda varlığı kaldırıp bunları modeldeki bir sonraki modüle göndermek için kullanılan ve iki çıkış noktası (orijinal varlık grubu sağdan, bırakılanlar alttan) bulunan Advanced Process modülü hangisidir?`, options: [`A) MATCH`, `B) DROPOFF`, `C) SEPARATE`, `D) PICKUP`, `E) REMOVE`], ans: `B) DROPOFF`, exp: `Dropoff modülü, bir grubun (batch) içinden belirli sayıda elemanı eksiltmek (indirmek) için kullanılır ve sağdan orijinaller, alttan inenler çıkar.`, exams: [`Ünite 13`] },
    { q: `HOLD modülünde "Type" değeri "Wait for Signal" (Sinyal Bekle) olarak ayarlandığında, varlığın beklemeyi bırakıp bir sonraki modüle geçmesine izin veren sinyali hangi modül gönderir?`, options: [`A) ASSIGN`, `B) MATCH`, `C) SIGNAL`, `D) SEARCH`, `E) ROUTE`], ans: `C) SIGNAL`, exp: `Hold modülünde sinyal bekleyen varlıkların kilidini açıp onları serbest bırakmak için sistemin başka bir yerinden SIGNAL modülü tetiklenmelidir.`, exams: [`Ünite 13`] },
    { q: `HOLD modülünde bekleme tipi "Infinite Hold" (Süresiz Bekleme) olarak seçildiğinde, varlığın işlemeye devam etmesine izin vermek için hangi modül kullanılmalıdır?`, options: [`A) RELEASE`, `B) REMOVE`, `C) FREE`, `D) UNSTORE`, `E) SIGNAL`], ans: `B) REMOVE`, exp: `Süresiz bekleme durumundaki bir varlık, o kuyruktan ancak sistemdeki başka bir REMOVE modülü tarafından zorla çıkarılarak hareket ettirilebilir.`, exams: [`Ünite 13`] },
    { q: `Farklı kuyruklarda bekleyen belirli sayıda varlığı bir araya getirmek (senkronize etmek) için kullanılan ve en fazla beş ilişkili kuyruk bağlanabilen Advanced Process modülü hangisidir?`, options: [`A) BATCH`, `B) GROUP`, `C) MATCH`, `D) PICKUP`, `E) ACCESS`], ans: `C) MATCH`, exp: `Match (Eşleştirme) modülü, farklı kuyruklardaki varlıkları (Örneğin sipariş fişi ile fiziksel ürünü) senkronize etmek için kullanılır.`, exams: [`Ünite 13`] },
    { q: `Belirli bir kuyruktan bir dizi ardışık varlığı kaldırmak ve bunları gelen varlık grubunun sonuna eklemek için kullanılan modül hangisidir?`, options: [`A) DROPOFF`, `B) REMOVE`, `C) STORE`, `D) PICKUP`, `E) SEARCH`], ans: `D) PICKUP`, exp: `Pickup, bir servis aracının veya taşıyıcının bir kuyruktan yolcuları/parçaları alıp kendi grubuna eklemesi işlemidir.`, exams: [`Ünite 13`] },
    { q: `Kuyruktaki belirli bir konumdan tek bir varlığı (Rank of Entity parametresine göre) kaldırmak ve bunu belirlenmiş bir modüle göndermek için kullanılan Advanced Process modülü hangisidir?`, options: [`A) ROUTE`, `B) TRANSPORT`, `C) REMOVE`, `D) HALT`, `E) ACCESS`], ans: `C) REMOVE`, exp: `Remove modülü, bir kuyrukta örneğin 3. sırada bekleyen spesifik bir varlığı tutup o sıradan çıkarmak için kullanılır.`, exams: [`Ünite 13`] },
    { q: `Bir kuyruktaki veya toplu işteki varlıkları aramak ve koşulun doğru olduğu ilk dizini "J global değişkenine" atayarak döndüren modül hangisidir?`, options: [`A) SEARCH`, `B) MATCH`, `C) RECORD`, `D) DECIDE`, `E) FIND`], ans: `A) SEARCH`, exp: `Search (Arama) modülü, belirlenen koşula uyan varlığı arar ve kaçıncı sırada (indekste) bulduğunu J değişkenine kaydeder.`, exams: [`Ünite 13`] },
    { q: `Bir veya daha fazla kaynağın birimlerini bir varlığa tahsis etmek için kullanılan ve kaynaklar müsait olana kadar varlıkları kuyrukta bekleten Advanced Process modülü hangisidir?`, options: [`A) ALLOCATE`, `B) SEIZE`, `C) DELAY`, `D) REQUEST`, `E) ACCESS`], ans: `B) SEIZE`, exp: `Basic Process modüllerindeki Process mantığının içinde de bulunan SEIZE bloğu, kaynak ele geçirmek için tek başına da kullanılabilir.`, exams: [`Ünite 13`] },
    { q: `Bir istasyondan diğerine hareket etmek amacıyla "bir konveyörün bir veya daha fazla hücresini" bir varlığa tahsis etmek için kullanılan Advanced Transfer modülü hangisidir?`, options: [`A) TRANSPORT`, `B) REQUEST`, `C) ROUTE`, `D) ACCESS`, `E) ENTER`], ans: `D) ACCESS`, exp: `Access modülü, konveyör (bant) sistemlerinde varlığın banda binmesi için gereken boş hücrenin hizalanıp tahsis edilmesini sağlar.`, exams: [`Ünite 13`] },
    { q: `Bir varlığın kendisine en son tahsis edilen "taşıyıcı birimini (transporter)" serbest bırakması için kullanılan modül hangisidir?`, options: [`A) RELEASE`, `B) FREE`, `C) HALT`, `D) UNSTORE`, `E) DROPOFF`], ans: `B) FREE`, exp: `Release sabit kaynakları (makine, operatör) serbest bırakırken, FREE modülü hareketli taşıyıcı birimleri (AGV, forklift) serbest bırakmak için kullanılır.`, exams: [`Ünite 13`] },
    { q: `Bir taşıyıcı birimin durumunu "devre dışı (inactive)" olarak değiştirmek (örneğin arıza veya bakım durumunu modellemek) için kullanılan modül hangisidir?`, options: [`A) FREE`, `B) DELAY`, `C) HALT`, `D) PAUSE`, `E) REMOVE`], ans: `C) HALT`, exp: `Halt modülü, hareketli taşıyıcıların aniden durdurulması, arızalanması veya vardiya dışı bırakılarak devre dışı kalmasını sağlar.`, exams: [`Ünite 13`] },
    { q: `Bir varlığa "bir taşıyıcı birim atamak" ve ardından "o birimi varlığın bulunduğu konuma taşımak" (örneğin taksi çağırmak) için kullanılan modül hangisidir?`, options: [`A) REQUEST`, `B) TRANSPORT`, `C) ACCESS`, `D) ROUTE`, `E) SEIZE`], ans: `A) REQUEST`, exp: `Request (Talep Et) modülü, boşta olan taşıyıcıyı varlığın bulunduğu istasyona çağırır ve varlığa tahsis eder.`, exams: [`Ünite 13`] },
    { q: `Bir varlığı belirli bir istasyona transfer etmek için kullanılan ve "Route Time (Yönlendirme Süresi)" parametresi barındıran Advanced Transfer modülü hangisidir?`, options: [`A) STATION`, `B) TRANSPORT`, `C) MOVE`, `D) ROUTE`, `E) ACCESS`], ans: `D) ROUTE`, exp: `Route modülü, varlıkların istasyonlar arasında taşıyıcı (AGV vb.) kullanmadan, sadece belli bir yürüme/gecikme süresi (Route time) harcayarak transfer olmasını sağlar.`, exams: [`Ünite 13`] },
    { q: `Bir taşıyıcı üniteyi (Transporter) kontrol eden bir varlığı, başka bir hedef istasyona transfer etmek için kullanılan modül hangisidir?`, options: [`A) ROUTE`, `B) TRANSFER`, `C) TRANSPORT`, `D) LEAVE`, `E) STATION`], ans: `C) TRANSPORT`, exp: `Route'dan farklı olarak TRANSPORT modülü, varlığın fiziksel bir taşıyıcı (forklift vb.) aracılığıyla istasyonlar arası taşınmasını sağlar.`, exams: [`Ünite 13`] },
    { q: `INPUT ANALYZER aracının simülasyon modellemesindeki temel görevi aşağıdakilerden hangisidir?`, options: [`A) Çıktıların güven aralıklarını hesaplamak`, `B) Olasılık dağılımlarını sahadan toplanan mevcut girdi verilerine uydurmak ve uygun parametreleri tahmin etmek`, `C) 3 boyutlu animasyonları çizmek`, `D) Simülasyonun ısınma süresini belirlemek`, `E) Alternatif sistemlerin varyansını test etmek`], ans: `B) Olasılık dağılımlarını sahadan toplanan mevcut girdi verilerine uydurmak ve uygun parametreleri tahmin etmek`, exp: `Input Analyzer, gerçek hayattan toplanan verilerin (örneğin işlem süreleri) hangi dağılıma (Normal, Üstel vb.) en iyi uyduğunu bulur.`, exams: [`Ünite 13`] },
    { q: `Arena'nın desteklediği sürekli teorik dağılımlar oldukça genişken, "kesikli teorik dağılım" olarak yalnızca hangisini destekler?`, options: [`A) Binom`, `B) Poisson`, `C) Geometrik`, `D) Bernoulli`, `E) Hipergeometrik`], ans: `B) Poisson`, exp: `Arena, kesikli (tam sayı değerli olaylar) durumlar için doğrudan sadece Poisson dağılımını barındırır. Diğerlerini ampirik dağılımlarla çözer.`, exams: [`Ünite 13`] },
    { q: `INPUT ANALYZER aracına verileri yüklemek için hazırlanacak veri dosyasının (metin dosyasının) formatı nasıl olmalıdır?`, options: [`A) Noktalı virgülle ayrılmış Excel dosyası`, `B) Özel Arena şifreleme formatı (.doe)`, `C) Boşluklar veya satır beslemelerle ayrılmış sıradan bir ASCII metin (.txt) formatı`, `D) HTML kod formatı`, `E) XML formatı`], ans: `C) Boşluklar veya satır beslemelerle ayrılmış sıradan bir ASCII metin (.txt) formatı`, exp: `Input Analyzer saf veri sever. Değerlerin arasında sadece boşluk veya alt satır olması yeterlidir.`, exams: [`Ünite 13`] },
    { q: `INPUT ANALYZER'da "Fit All" seçeneği tıklandığında, program verilere uyan tüm dağılımları aşağıdakilerden hangi kritere göre (en iyiden en kötüye) sıralar?`, options: [`A) Ki-Kare değerine göre`, `B) Kolmogorov-Smirnov değerine göre`, `C) P değerine göre`, `D) Minimum kare hata (Square Error) değerine göre`, `E) Varyans büyüklüğüne göre`], ans: `D) Minimum kare hata (Square Error) değerine göre`, exp: `Fit All komutu tüm dağılımları dener ve uyum iyiliğini en küçük "Ortalama Kare Hatası" (Square Error) değerinden büyüğe doğru sıralar.`, exams: [`Ünite 13`] },
    { q: `INPUT ANALYZER tarafından hesaplanan uygunluk testlerinde (Ki-kare ve K-S), karşılık gelen "p değerinin" 0.05'ten küçük olması ne anlama gelir?`, options: [`A) Dağılımın verilere mükemmel uyduğunu gösterir.`, `B) Replikasyon sayısının artırılması gerektiğini gösterir.`, `C) Dağılımın verilere çok iyi uymadığını (uyumun zayıf olduğunu) gösterir.`, `D) Sistemin hatalı kodlandığını gösterir.`, `E) Modelin kararlı duruma ulaştığını gösterir.`], ans: `C) Dağılımın verilere çok iyi uymadığını (uyumun zayıf olduğunu) gösterir.`, exp: `İstatistiksel hipotez testlerinde düşük p değeri (p < 0.05) H0 hipotezinin reddine, yani verilerin o dağılıma uygun DÜŞMEDİĞİNE işaret eder. Böyle durumlarda ampirik dağılım seçmek daha akılcıdır.`, exams: [`Ünite 13`] },
    { q: `OUTPUT ANALYZER aracının simülasyon modellemesindeki temel görevi aşağıdakilerden hangisidir?`, options: [`A) Girdi veri dağılımlarını belirlemek`, `B) Modelin akış şemasını (Flowchart) çizmek`, `C) Simülasyon çalıştırıldıktan sonra üretilen verileri görüntülemek, grafikleştirmek ve analiz (ANOVA, güven aralığı vb.) etmek`, `D) Değişken atamalarını manuel yapmak`, `E) Optimizasyon için en iyi senaryoyu otomatik aramak`], ans: `C) Simülasyon çalıştırıldıktan sonra üretilen verileri görüntülemek, grafikleştirmek ve analiz (ANOVA, güven aralığı vb.) etmek`, exp: `Output Analyzer, bitmiş bir veya birden fazla simülasyon koşumundan elde edilen çıktıları (dosyaları) okuyup istatistiksel karşılaştırma yapar.`, exams: [`Ünite 13`] },
    { q: `OUTPUT ANALYZER içerisinde, farklı senaryolarda çalıştırılan modellerin ortalamalarını ve varyanslarını karşılaştırmak (Compare Means / Compare Variances), ANOVA testleri yapmak için hangi sekme kullanılır?`, options: [`A) GRAPH Sekmesi`, `B) FILES Sekmesi`, `C) ANALYZE Sekmesi`, `D) OPTIONS Sekmesi`, `E) TOOLS Sekmesi`], ans: `C) ANALYZE Sekmesi`, exp: `Çizim ve grafikler "Graph" sekmesinde yapılırken, istatistiksel hipotez testleri ve karşılaştırmalar "Analyze" sekmesinden yürütülür.`, exams: [`Ünite 13`] },
    { q: `Arena simülasyonlarını çalışma sayfası (elektronik tablo) tarzı bir arayüzle yürütmek, birden çok senaryoyu hızlıca çalıştırıp en iyi (optimum) sonucu otomatik olarak bulmak için kullanılan araç hangisidir?`, options: [`A) Input Analyzer`, `B) Process Analyzer (PAN)`, `C) Output Analyzer`, `D) OptQuest`, `E) SimRunner`], ans: `B) Process Analyzer (PAN)`, exp: `Process Analyzer (PAN), kontrol ve yanıt parametrelerini Excel benzeri bir ızgaraya dizerek onlarca farklı senaryoyu tek tıkla test etmeyi sağlar.`, exams: [`Ünite 13`] },
