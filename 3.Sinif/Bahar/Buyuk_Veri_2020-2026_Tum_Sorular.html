<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUZEF Büyük Veri - MEGA ARŞİV PRO</title>
    <style>
        :root { --p: #1a2b4c; --s: #2c3e50; --a: #f39c12; --suc: #27ae60; --bg: #f4f6f8; --c: #ffffff; --t: #2d3436; --b: #dfe6e9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 20px; border-radius: 10px; text-align: center; border-bottom: 5px solid var(--a); margin-bottom: 20px; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; position: sticky; top: 10px; background: var(--bg); padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 100; }
        .btn { background: #ecf0f1; color: var(--p); border: 2px solid var(--b); padding: 8px 12px; font-size: 0.95em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #bdc3c7; }
        .btn.active { background: var(--a); color: white; border-color: var(--a); }
        .btn-g { background: #d35400; color: white; }
        .card { background: var(--c); border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--p); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .tag-u { background: #3498db; } .tag-e { background: var(--p); } .tag-h { background: #e74c3c; }
        .q-text { font-size: 1.1em; font-weight: bold; color: var(--p); margin-bottom: 15px; }
        .opt { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .opt li { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--b); margin-bottom: 5px; }
        .ans-btn { background: var(--s); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .ans-box { display: none; margin-top: 15px; padding: 15px; background: #eafaf1; border-left: 4px solid var(--suc); border-radius: 6px; }
        .ans-true { color: var(--suc); font-weight: bold; margin-bottom: 5px; }
    
/* =========================================================
   CİHAZ UYARLAMA VE E-KİTAP MODU (DEVICE ADAPTIVE & E-INK)
   ========================================================= */
:root {
    --paper-bg: var(--bg, #f4f6f8);
    --card-surface: var(--card-bg, var(--c, #ffffff));
    --main-text: var(--text, var(--t, #2d3436));
    --border-color: var(--border, var(--b, #dfe6e9));
}

[data-theme="dark"] {
    --bg: #151c25 !important;
    --card-bg: #1c2530 !important;
    --c: #1c2530 !important;
    --text: #e2e8f0 !important;
    --t: #e2e8f0 !important;
    --border: #2e3a48 !important;
    --b: #2e3a48 !important;
    --primary: #8fb3e0 !important;
    --p: #8fb3e0 !important;
    --secondary: #232f42 !important;
    --s: #232f42 !important;
}

[data-theme="dark"] body {
    background-color: #151c25 !important;
    color: #e2e8f0 !important;
}

[data-theme="dark"] .container,
[data-theme="dark"] .page-wrap {
    color: #e2e8f0 !important;
}

[data-theme="dark"] .card,
[data-theme="dark"] .question-card,
[data-theme="dark"] .tips-card,
[data-theme="dark"] .view-mode-bar {
    background-color: #1c2530 !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

[data-theme="dark"] .opt li {
    background-color: #222d3a !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

[data-theme="dark"] .answer-area,
[data-theme="dark"] .ans-box {
    background-color: #172b25 !important;
    color: #e2e8f0 !important;
}

[data-theme="dark"] .header {
    background: linear-gradient(135deg, #1e293b, #0f172a) !important;
    border-bottom: 4px solid #f39c12 !important;
}

[data-theme="dark"] .btn,
[data-theme="dark"] .tab-btn {
    background-color: #222d3a !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

/* E-INK ORTAK: Animasyon, geçiş, gölge ve efektleri kapat */
[data-device^="eink-"] *,
[data-device^="eink-"] *::before,
[data-device^="eink-"] *::after {
    animation: none !important;
    transition: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    text-shadow: none !important;
}

/* 6 inç Siyah-Beyaz E-Okuyucu (Kindle, Kobo vb. E-Kitap Modu) */
[data-device="eink-6-bw"] {
    --bg: #FFFFFF !important;
    --card-bg: #FFFFFF !important;
    --c: #FFFFFF !important;
    --text: #000000 !important;
    --t: #000000 !important;
    --border: #000000 !important;
    --b: #000000 !important;
    --primary: #000000 !important;
    --p: #000000 !important;
    --secondary: #000000 !important;
    --s: #000000 !important;
}
[data-device="eink-6-bw"] body {
    background-color: #FFFFFF !important;
    color: #000000 !important;
    font-family: Georgia, 'Bookerly', 'Charis SIL', serif, system-ui !important;
    font-size: 17px !important;
    line-height: 1.6 !important;
    padding: 6px !important;
}
[data-device="eink-6-bw"] .container,
[data-device="eink-6-bw"] .page-wrap {
    max-width: 100% !important;
    padding: 0 !important;
}
[data-device="eink-6-bw"] .header {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
}
[data-device="eink-6-bw"] .card,
[data-device="eink-6-bw"] .question-card,
[data-device="eink-6-bw"] .view-mode-bar {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
    margin-bottom: 12px !important;
    padding: 12px !important;
}
[data-device="eink-6-bw"] .opt li {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 1px solid #000000 !important;
    font-size: 16px !important;
}
[data-device="eink-6-bw"] .btn,
[data-device="eink-6-bw"] button,
[data-device="eink-6-bw"] select {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
}
[data-device="eink-6-bw"] .answer-area,
[data-device="eink-6-bw"] .ans-box {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
}

/* 6 inç Renkli E-Okuyucu */
[data-device="eink-6-color"] body {
    font-size: 16.5px !important;
}
[data-device="eink-6-color"] .card,
[data-device="eink-6-color"] .btn,
[data-device="eink-6-color"] .view-mode-bar {
    border: 1.5px solid #2d3436 !important;
}

/* 10.3 inç Siyah-Beyaz Tablet (Boox, Remarkable vb.) */
[data-device="eink-10-bw"] {
    --bg: #FFFFFF !important;
    --card-bg: #FFFFFF !important;
    --text: #000000 !important;
    --border: #000000 !important;
}
[data-device="eink-10-bw"] body {
    background-color: #FFFFFF !important;
    color: #000000 !important;
    font-family: Georgia, 'Bookerly', serif, system-ui !important;
    font-size: 17.5px !important;
    line-height: 1.65 !important;
}
[data-device="eink-10-bw"] .container {
    max-width: 1100px !important;
}
[data-device="eink-10-bw"] .card,
[data-device="eink-10-bw"] .view-mode-bar {
    border: 2px solid #000000 !important;
}

/* Mobil Profil */
[data-device="mobile"] body {
    padding: 10px !important;
    font-size: 15px !important;
}
[data-device="mobile"] .header {
    padding: 15px 10px !important;
}
[data-device="mobile"] .header h1 {
    font-size: 1.4em !important;
}
[data-device="mobile"] .card {
    padding: 14px !important;
}

</style>
</head>
<body>

<div class="container">

    <!-- CİHAZ PROFİLİ VE GÖRÜNÜM MODU BAR -->
    <div class="view-mode-bar" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:10px 14px; background:var(--card-bg, #fff); border:1px solid var(--border, #dfe6e9); border-radius:10px; margin-bottom:16px;">
        <a href="../index.html" style="display:inline-flex; align-items:center; gap:6px; color:inherit; text-decoration:none; font-weight:800; font-size:13.5px;">
            &larr; Sınıf Derslerine Dön
        </a>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <label for="deviceProfileSelect" style="font-size:12px; font-weight:800; text-transform:uppercase; color:inherit;">Görünüm:</label>
            <select id="deviceProfileSelect" onchange="setAuzefDeviceProfile(this.value)" style="padding:6px 10px; font-weight:700; font-size:13px; border-radius:8px; border:1px solid var(--border, #dfe6e9); background:var(--card-bg, #fff); color:inherit; cursor:pointer;">
                <option value="auto">🔄 Otomatik</option>
                <option value="web">💻 Masaüstü Web</option>
                <option value="mobile">📱 Mobil Cihaz</option>
                <option value="eink-6-bw">📖 6" E-Okuyucu (E-Kitap Modu)</option>
                <option value="eink-6-color">🎨 6" E-Okuyucu (Renkli)</option>
                <option value="eink-10-bw">📝 10.3" Tablet (S/B)</option>
                <option value="eink-10-color">🖍️ 10.3" Tablet (Renkli)</option>
            </select>
            <button id="auzefThemeToggleBtn" type="button" onclick="toggleAuzefTheme()" style="padding:6px 12px; font-weight:800; font-size:13px; border-radius:8px; border:1px solid var(--border, #dfe6e9); background:var(--card-bg, #fff); color:inherit; cursor:pointer;" title="Koyu / Açık Tema">
                🌙 Tema
            </button>
        </div>
    </div>

    <div class="header">
        <h1>Büyük Veri</h1>
        <p>Vize, Final, Bütünleme - Tüm Çıkmış Sorular (Akıllı Menülü)</p>
    </div>

    <div class="controls">
        <button class="btn btn-g" onclick="toggleAll()">👁️ Tüm Cevapları Aç/Kapat</button>

        <select class="btn" id="kategori-secici" onchange="filter(this.value)" style="background: var(--p); color: white; min-width: 180px; text-align: center; font-weight:bold; padding:8px; border-radius:6px; cursor:pointer;">
            <option value="all">📚 Tüm Havuz (Hepsi)</option>
            <optgroup label="Dönemler">
                <option value="vize">📅 Vizeler (Tümü)</option>
                <option value="final">📅 Finaller (Tümü)</option>
                <option value="büt">📅 Bütünlemeler</option>
            </optgroup>
            <optgroup label="Yıllar">
                <option value="2020-2021">📅 2020-2021</option>
                <option value="2023">📅 2023 Yılı</option>
                <option value="2024">📅 2024 Yılı</option>
                <option value="2025">📅 2025 Yılı</option>
                <option value="2026">📅 2025-2026 Yılı</option>
            </optgroup>
        </select>

        <button class="btn" style="background: #e74c3c; color:white;" onclick="filter('Banko')">🔥 Banko Sorular</button>

        <input type="text" id="arama" class="btn" placeholder="🔍 Kelime ara..." onkeyup="aramaYap()" style="background: white; color: black; cursor: text; text-align: left; min-width: 200px;">
    </div>

    <div id="q-container"></div>
</div>

<script>
const rawData = [
    // 2020-2021 VİZE
    "Vize 2020-2021|Büyük veri kavramı aşağıdakilerden hangisiyle en doğru şekilde tanımlanır?|A) Küçük hacimli veriler~B) Yalnızca yapılandırılmış veriler~C) Düşük hızda üretilen veriler~D) Farklı kaynaklardan, yüksek hızda ve büyük hacimde üretilen veriler~E) Sadece ilişkisel veritabanları|D) Farklı kaynaklardan, yüksek hızda ve büyük hacimde üretilen veriler|Büyük veri; Hacim (Volume), Hız (Velocity) ve Çeşitlilik (Variety) bileşenleriyle tanımlanır.",
    "Vize 2020-2021,Vize 2023,Vize 2024,Vize 2024-25,Vize 2025-2026,Banko|Aşağıdakilerden hangisi verinin sınıflandırılmış gruplarından (veri türlerinden) biri değildir?|A) Veri Parçası~B) Erişilebilir Veri~C) Gri Veri~D) Karanlık Veri~E) Şeffaf / Anlamlı Veri|E) Şeffaf / Anlamlı Veri|Kurumsal veriler kullanım durumuna göre Erişilebilir, Gri ve Karanlık olarak sınıflandırılır. 'Anlamlı' veya 'Şeffaf' veri diye teknik bir sınıflama yoktur.",
    "Vize 2020-2021|Analiz edilmeden saklanan ve farkında olunmadan oluşan veri türü hangisidir?|A) Veri Parçası~B) Erişilebilir Veri~C) Gri Veri~D) Karanlık Veri~E) Yapısal Veri|D) Karanlık Veri|Karanlık veri (Dark Data), toplanıp depolanan ancak değer üretmek için hiç analiz edilmeyen verilerdir.",
    "Vize 2020-2021|Büyük verinin en temel özelliği aşağıdakilerden hangisidir?|A) Az hacimli olması~B) Tek formatta olması~C) Statik olması~D) Analiz edilerek değer üretmesi~E) Manuel işlenmesi|D) Analiz edilerek değer üretmesi|Değer (Value) Bileşeni: Veri yığınlarının işlenip kuruma kârlılık, strateji veya öngörü sağlaması asıl hedeftir.",
    "Vize 2020-2021|Yapısal veriye örnek hangisidir?|A) Video dosyaları~B) Sosyal medya paylaşımları~C) SQL tabloları~D) Ses kayıtları~E) PDF belgeleri|C) SQL tabloları|Yapısal Veri (Structured Data): Belirli bir satır-sütun veya şema modeline sahip verilerdir. SQL tabloları en net örnektir.",
    "Vize 2020-2021|XML ve JSON hangi veri türüne örnektir?|A) Yapısal~B) Yapısal olmayan~C) Yarı yapısal~D) Karanlık~E) Gri|C) Yarı yapısal|Katı tablolar halinde olmayan ancak kendi içinde etiketler (tag) barındıran hiyerarşik formatlar Yarı Yapısal veridir.",
    "Vize 2020-2021|Yapısal olmayan verilerin işlenmesi için hangi teknoloji yaygın kullanılır?|A) SQL~B) Excel~C) NoSQL~D) CSV~E) Access|C) NoSQL|Esnek yapıları sayesinde metin, log, medya gibi yapısal olmayan devasa verileri depolamak için NoSQL veritabanları tasarlanmıştır.",
    "Vize 2020-2021|Büyük veri kullanımıyla Target firmasının hangi bilgiyi tahmin ettiği örnek verilmiştir?|A) Gelir seviyesi~B) Eğitim durumu~C) Hamilelik durumu~D) Meslek~E) Medeni hâl|C) Hamilelik durumu|Müşterilerin değişen alışveriş alışkanlıklarından (kokusuz losyon vb.) hamilelik skorları üreten meşhur bir veri analitiği vakasıdır.",
    "Vize 2020-2021|Büyük veride '5V' bileşenlerinden biri değildir?|A) Volume~B) Velocity~C) Variety~D) Verification~E) Visualization|E) Visualization|Büyük verinin 5V'si; Volume, Velocity, Variety, Veracity ve Value'dur. Görselleştirme (Visualization) sunum aşamasıdır.",
    "Vize 2020-2021|'Velocity' bileşeni neyi ifade eder?|A) Verinin doğruluğunu~B) Verinin değerini~C) Verinin üretim ve işlenme hızını~D) Verinin hacmini~E) Verinin güvenliğini|C) Verinin üretim ve işlenme hızını|Velocity (Hız): Sensörler, finansal borsa veya sosyal medya verilerinin saniyeler içindeki akış ve analiz edilme süratidir.",
    "Vize 2020-2021|Büyük veri hangi sektörde DNA analizlerini hızlandırmıştır?|A) Finans~B) Eğitim~C) Sağlık~D) Lojistik~E) Spor|C) Sağlık|Bulut bilişim ve veri algoritmaları, yıllar süren insan DNA'sı dizileme işlemlerini sağlık sektöründe günlere düşürmüştür.",
    "Vize 2020-2021|Jawbone Up örneği hangi alana aittir?|A) Finans~B) Spor~C) Sağlık ve performans analizi~D) Eğitim~E) Ulaşım|C) Sağlık ve performans analizi|Bu tarz akıllı bileklikler (giyilebilir IoT cihazları) uyku düzeni, nabız ve aktivite takibi yaparak bireysel sağlık profili çıkarır.",
    "Vize 2020-2021|Mahremiyet kavramı aşağıdakilerden hangisini ifade eder?|A) Verinin şifrelenmesi~B) Verinin yetkisiz erişime kapatılması~C) Bireyin verisi üzerindeki kontrolü~D) Verinin yedeklenmesi~E) Verinin silinmesi|C) Bireyin verisi üzerindeki kontrolü|Mahremiyet (Privacy), hukuki ve etik olarak bireylerin kendilerine ait bilgilerin ne ölçüde başkalarıyla paylaşılacağına karar verme hakkıdır.",
    "Vize 2020-2021|Mahremiyet, güvenlik ve gizlilik arasındaki farklardan hangisi doğrudur?|A) Hepsi aynı anlama gelir~B) Güvenlik, verinin kim tarafından kullanılacağını belirler~C) Mahremiyet, bireyin karar hakkını ifade eder~D) Gizlilik, bireyin yetkisini tanımlar~E) Güvenlik, hukuki kavramdır|C) Mahremiyet, bireyin karar hakkını ifade eder|Mahremiyet (Privacy) bireyin onayıdır; Güvenlik (Security) veriyi dışarıdan koruma tekniğidir; Gizlilik (Confidentiality) bilginin sadece yetkililerde kalmasıdır.",
    "Vize 2020-2021|Kimlik ifşası ne anlama gelir?|A) Verinin silinmesi~B) Kişinin veri kümesinde olup olmadığının belirlenmesi~C) Anonim verinin gerçek kişiyle eşleştirilmesi~D) Verinin şifrelenmesi~E) Verinin maskelemesi|C) Anonim verinin gerçek kişiyle eşleştirilmesi|Veri setinden isim vb. silinse dahi diğer özellikler (yaş, posta kodu) birleştirilerek satırın hangi kişiye ait olduğunun bulunmasıdır.",
    "Vize 2020-2021|Üyelik ifşası neyi ortaya çıkarır?|A) Kişinin kimliğini~B) Hassas bilgiyi~C) Kişinin veri kümesinde yer alıp almadığını~D) Verinin doğruluğunu~E) Verinin formatını|C) Kişinin veri kümesinde yer alıp almadığını|Birisinin örneğin kanser tedavisi görenler isimli özel bir veritabanında kaydının olup olmadığının tespit edilmesidir.",
    "Vize 2020-2021|k-Anonimlik modelinin temel amacı nedir?|A) Veriyi silmek~B) Hassas veriyi çoğaltmak~C) Kayıtları ayırt edilemez hale getirmek~D) Veriyi şifrelemek~E) Veriyi maskelemek|C) Kayıtları ayırt edilemez hale getirmek|Veri setindeki her satırın, en az k-1 diğer satırla aynı dışsal özelliklere sahip olmasını sağlayarak bireylerin tekil olarak seçilmesini önler.",
    "Vize 2020-2021|l-Çeşitlilik hangi sorunu çözmek için geliştirilmiştir?|A) Kimlik ifşası~B) Veri hacmi~C) Hassas veri ifşası~D) Veri kaybı~E) Hız problemi|C) Hassas veri ifşası|k-anonimlik ile grup oluşturulur ancak gruptaki herkesin hassas verisi aynıysa ifşa yaşanır. l-çeşitlilik grupta farklı hassas veriler olmasını zorunlu tutarak bunu çözer.",
    "Vize 2020-2021|t-Yakınlık modelinin temel özelliği nedir?|A) Kayıt sayısını artırmak~B) Veri dağılımını eşitlemek~C) Hassas veri dağılımını genel dağılıma yaklaştırmak~D) Veriyi silmek~E) Maskeleme yapmak|C) Hassas veri dağılımını genel dağılıma yaklaştırmak|Anonimleştirilmiş grubun içindeki hassas veri dağılımının, ana tablonun genel yüzdesine 't' kadar yakın olmasını garanti eder.",
    "Vize 2020-2021|Anonimleştirme neden tek başına yeterli değildir?|A) Çok pahalı olduğu için~B) Veriyi değersizleştirdiği için~C) Farklı veri setleriyle yeniden kimlik tespiti yapılabildiği için~D) Yasal olmadığı için~E) Analizi engellediği için|C) Farklı veri setleriyle yeniden kimlik tespiti yapılabildiği için|Anonim veri, farklı dış listelerle (seçmen kayıtları vb.) çaprazlanarak birleştirildiğinde (Bağlantı Saldırısı) kişiler tekrar ifşa olabilir.",

    "Vize 2023,Vize 2024,Vize 2024-25,Büt 2024,Vize 2025-2026,Banko|Aşağıdakilerden hangisi büyük verideki kaygılardan biri değildir?|A) Veri mahremiyeti~B) Veri ayrımcılığı~C) Veri güvenliği~D) Veri büyüklüğü~E) Veri gizliliği|D) Veri büyüklüğü|Verinin büyük olması (Hacim) sistemin teknik bir gerçeğidir. Mahremiyet, gizlilik veya algoritmik ayrımcılık ise bertaraf edilmesi gereken hukuki/etik 'kaygılar'dır.",
    "Vize 2023,Vize 2024,Vize 2024-25,Büt 2024,Vize 2025-2026,Banko|Aşağıda verilen bilgilerden hangisi bilgi piramidi için yanlıştır?|A) Enformasyon, veri işleme, düzenleme, hesaplama içeriğinden oluşur.~B) Veri, sembollerin içeriğinden oluşur.~C) Büyük veri, sembollerden parçalara ulaşma içeriğinden oluşur.~D) Bilgi, enformasyon işleme, öğrenme, yapma içeriğinden oluşur.~E) Bilgelik, keşfetme buluş, muhakeme ve değer içeriklerinden oluşur.|C) Büyük veri, sembollerden parçalara ulaşma içeriğinden oluşur.|Bilgi Piramidi (DIKW); Veri, Enformasyon, Bilgi ve Bilgelik olmak üzere 4 basamaktan oluşur. 'Büyük Veri' bu akademik piramidin bir basamağı değildir.",

    "Vize 2023,Vize 2024-25,Final 2025,Büt 2024-25,Vize 2025-2026,Banko|Semantik veriye duyulan ihtiyacın ortaya çıkmasında dönüm noktası olarak kabul edilen olay aşağıdakilerden hangisinde doğru olarak verilmiştir?|A) 1980'lerin başlarında Çin'de ortaya çıkan teknolojik araştırmalar.~B) 1700'lerin ortalarında İngiltere'de Bilgisayar Destekli Üretim programı.~C) 1970'lerin ortalarında Birleşik Bilgisayar Destekli Üretim (ICAM) programının bir sonucu olarak ABD Hava Kuvvetlerinde ortaya çıktı.~D) 1900'lerin başlarında Rusya'da geliştirilen uzay çalışmaları.~E) 1840'ların başında NASA uzay ajansının çalışmaları.|C) 1970'lerin ortalarında Birleşik Bilgisayar Destekli Üretim (ICAM) programının bir sonucu olarak ABD Hava Kuvvetlerinde ortaya çıktı.|Ontolojilerin ilk tohumları 1970'lerde ABD Hava Kuvvetleri'nin Bütünleşik Bilgisayar Destekli Üretim (ICAM) programındaki IDEF modellemeleriyle atılmıştır.",
    "Vize 2023,Vize 2024-25,Vize 2025-2026,Banko|I. Verinin aktarılacağı tarafın büyüklüğü II. Verinin çeşitliliği III. Veriden sağlanmak istenen fayda IV. Verinin niceliği (veya niteliği) V. Verinin büyüklüğü. Anonimleştirme yöntemleri uygulanırken, veri sorumluları tarafından hangileri dikkate alınmalıdır?|A) IV ve V~B) II, III ve V~C) I, IV~D) I, III ve V~E) III ve IV|A) IV ve V|Anonimleştirme yapılırken verinin yapısı/hassasiyeti (Nitelik/Nicelik) ve veri setinin hacmi/satır sayısı (Büyüklük) dikkate alınarak algoritmalar belirlenir.",
    "Vize 2023,Vize 2024-25,Final 2025,Banko|İnsan kaynakları yönetimi gibi organizasyon içindeki belirli bir kullanıcı grubunun belirli taleplerini karşılamak amacıyla geliştirilen büyük veri teknolojisi hangisidir?|A) Büyük tablo~B) Dağıtık sistem~C) Meta veri~D) Data mart~E) Bulut bilişim|D) Data mart|Devasa Veri Ambarlarının (Data Warehouse) içinde sadece tek bir departmanın (örneğin İK) ihtiyacı olan verilere odaklanan alt veri depolama birimi Data Mart'tır (Veri Pazarı).",
    "Vize 2023,Vize 2024-25,Vize 2025-2026,Banko|Açık veri ile ilgili aşağıdaki verilen bilgilerden hangisi yanlıştır?|A) Herkes tarafından kullanılabilir.~B) Nitelik ve paylaşım gereksinimine tabidir.~C) Sadece veri sahibi tarafından düzenlenebilir.~D) Herkes tarafından dağıtılabilir.~E) Herhangi bir telif hakkına sahip değildir.|C) Sadece veri sahibi tarafından düzenlenebilir.|Açık verinin felsefesi verinin demokratikleşmesidir. Veri açıklandıktan sonra herkes düzenleyebilir; 'sadece veri sahibi düzenleyebilir' kısıtlaması açık veri mantığına terstir.",
    "Vize 2023,Vize 2024,Vize 2024-25,Banko|Aşağıdakilerden hangisi veri maskeleme yöntemlerinden biri değildir?|A) Anında veri maskeleme~B) Dinamik veri maskeleme~C) Statik veri maskeleme~D) Deterministik veri maskeleme~E) Durağan veri maskeleme|E) Durağan veri maskeleme|Bilişimde Statik, Dinamik ve Deterministik maskeleme teknikleri vardır. 'Durağan' kelimesi Statiğin Türkçe karşılığıdır; sektörde ayrı bir 4. teknik listelenmez.",
    "Vize 2023,Vize 2024,Vize 2024-25,Vize 2025-2026,Banko|Aşağıdakilerden hangisi semantik web'in temel hedeflerinden biri değildir?|A) Paylaşılabilir veri tabanlarının oluşması.~B) Satıcı yazılımının değerlendirilmesi.~C) Mevcut veri tabanının entegrasyonu.~D) Veri kaynaklarının planlanması.~E) Dağıtık web servislerinin oluşturulması.|B) Satıcı yazılımının değerlendirilmesi.|Ticari bir kavram olan 'Satıcı yazılımının değerlendirilmesi' (vendor evaluation), evrensel bir ağ bilimi olan semantik ağın amaçları arasında yer almaz.",
    "Vize 2023,Vize 2024,Vize 2024-25,Vize 2025-2026,Banko|Aşağıdakilerden hangisi büyük veride yapı açısından doğru bir sınıflandırmadır?|A) Erişilebilir- yarı erişilebilir- erişilebilir olmayan~B) Yapısal- yarı yapısal- yapısal olmayan~C) Karanlık yapı- gri yapı açık yapı~D) Elektronik yapı- hibrit yapı- fiziksel yapı~E) Homojen yarı homojen- heterojen|B) Yapısal- yarı yapısal- yapısal olmayan|Büyük veride 'yapı' (format) denildiğinde SQL tabloları (Yapısal), XML/JSON (Yarı Yapısal) ve Metin/Video (Yapısal Olmayan) olarak 3'e ayrılır.",
    "Vize 2023,Vize 2024-25,Final 2025,Büt 2024-25,Banko|Büyük verilerin gerçek zamanla akışını işlemek için tasarlanmış büyük veri teknolojisi aşağıdakilerden hangisidir?|A) Storm~B) Data mart~C) Meta veri~D) Dağıtık Sistem~E) Bulut bilişim|A) Storm|Hadoop gibi yığın (batch) işleyen sistemlere karşı, Apache Storm ve Apache Kafka sensör veya borsa gibi akan veriyi anlık (stream) işlemek üzere tasarlanmıştır.",
    "Vize 2023,Vize 2024,Vize 2024-25,Final 2025,Büt 2024-25,Vize 2025-2026,Banko|Aşağıdakilerden hangisi anonimleştirmenin ilkelerinden biri değildir?|A) Anonimleştirme iş ve çalışma modellerini dikkate almalıdır.~B) Anonimleştirme, çoğul bir çözüm olarak ele alınmalıdır.~C) Anonimleştirme veri kümesinin niceliğine bağlı gerçekleşmelidir.~D) Anonimleştiriciler veri kümesinin niteliğine bağlı gerçekleşmelidir.~E) Anonimleştirme seviyelendirilmelidir.|C) Anonimleştirme veri kümesinin niceliğine bağlı gerçekleşmelidir.|Anonimleştirme işlemi sadece verinin 'niceliğine' (satır sayısına) bağlı olarak mekanik şekilde yapılamaz, asıl kritik olan verinin hassasiyeti yani 'niteliği'dir.",
    "Vize 2023,Vize 2024,Vize 2024-25,Final 2025,Büt 2024-25,Banko|Aşağıdakilerden hangisi açık verinin faydalarından biri değildir?|A) Veri harmanlama çalışmaları ile veri kalitesinin artırılması.~B) Veriyi kullanan paydaşlar tarafından yenilikçi çözümler üretilmesi.~C) Hesap verilebilirlik özelliği ile tüketicinin güvenini kazanma.~D) Veriye sadece veri sahibinin erişebildiği için veri mahremiyetinin korunması.~E) Sektörler arası çapraz kullanımı sayesinde maliyetlerin düşmesi.|D) Veriye sadece veri sahibinin erişebildiği için veri mahremiyetinin korunması.|Açık veri herkese açık olan veridir. 'Veriye sadece veri sahibinin erişmesi' açık veri konseptine taban tabana zıttır, bu özel/gizli verileri tanımlar.",
    "Vize 2023,Vize 2024,Vize 2024-25,Vize 2025-2026,Banko|Aşağıdakilerden hangisi semantik web için standart geliştiren bir organizasyondur?|A) Uluslararası network organizasyonu (INC)~B) Uluslararası bilgisayar organizasyonu (ICC)~C) Uluslararası modelleme organizasyonu (IMC)~D) Uluslararası mekanik organizasyonu (IMC)~E) Uluslararası Elektroteknik Organizasyonu (IEC)|E) Uluslararası Elektroteknik Organizasyonu (IEC)|Bilişim ve teknoloji standartlarını belirleyen en büyük global yasal otoritelerden biri ISO ile entegre çalışan IEC'dir.",
    "Vize 2023,Vize 2024,Vize 2025-2026,Banko|Verilerin açık hale getirilmesi ile verinin bazı temel özellikleri korunmaktadır. Aşağıdakilerden hangisi bu özelliklerden biri değildir?|A) Verinin tekrar kullanımı.~B) Verinin anonimleştirilmesi.~C) Verinin tekrar dağıtılması.~D) Evrensel katılım.~E) Veriye erişim|B) Verinin anonimleştirilmesi.|Açık verinin özellikleri erişim, dağıtım ve kullanımdır. 'Anonimleştirme' ise veriyi maskelemek için önceden yapılan bir işlemdir (süreçtir), açık verinin doğasındaki devamlı özellik değildir.",
    "Vize 2023,Vize 2024,Vize 2024-25,Vize 2025-2026,Banko|Aşağıdakilerden hangisi veri mahremiyetinin uygulanmasında ön plana çıkan doğru bir sınıflandırmadır?|A) Anonim veri - kapalı veri~B) Erişilebilir veri - kapsamlı veri~C) Büyük veri - smart veri~D) Hassas veri - genel veri~E) Enformasyon verisi - analiz verisi|D) Hassas veri - genel veri|KVKK gibi mahremiyet yasalarına göre veriler; herkesin bildiği Kişisel (Genel) Veriler ve sızdığında ayrımcılık yaratacak Özel Nitelikli (Hassas) Veriler olarak ayrılır.",
    "Vize 2023,Büt 2024,Banko|Verinin anonimleştirilmesinde kullanılan istatistiksel yöntemlerle ilgili aşağıda verilenlerden hangisi yanlıştır?|A) T- yakınlık yöntemi, veri kümesinin yakınlık derecelerine göre alt sınıflara ayrılarak anonim hale getirilmesidir.~B) L-çeşitlilik, aynı değişken kombinasyonlarında denk gelen hassas değişkenlerinin çeşitliliğini dikkate alır.~C) K-anonimlik l-çeşitliliğin eksikleri üzerinden yürütülen çalışmalar ile oluşturulmuştur.~D) L-çeşitlilik yöntemi, kişisel verilerde çeşitlilik sağlar.~E) K-anonimlik, belli kombinasyonlarda kişilere özgü bilgilerin açığa çıkmasını engeller.|C) K-anonimlik l-çeşitliliğin eksikleri üzerinden yürütülen çalışmalar ile oluşturulmuştur.|Tarihsel sıralama terstir. İlk olarak K-anonimlik algoritması icat edilmiş, sonra ondaki açıkları (homojenlik sızıntısını) kapatmak için L-çeşitlilik algoritması tasarlanmıştır.",
    "Vize 2023,Vize 2024,Vize 2024-25,Vize 2025-2026,Banko|Aşağıdaki şıklarda verilen bilim insanlarından hangisi büyük verinin tarihsel gelişiminde 'Makine Öğrenimi' terimini ilk olarak ortaya atmıştır?|A) John Graunt~B) Fritz Pfleumer~C) R.J.T. Morris~D) Tim Berners~E) Arthur Samuel|E) Arthur Samuel|'Makine Öğrenimi' (Machine Learning) terimi 1959 yılında IBM araştırmacısı Arthur Samuel tarafından dama oynayan algoritması sırasında literatüre kazandırılmıştır.",
    "Vize 2023,Vize 2024,Vize 2024-25,Vize 2025-2026,Banko|Aşağıdakilerden hangisi hassas verilere verilen örneklerden biri değildir?|A) Eğitim verileri~B) Banka verileri~C) Tapu verileri~D) Sigorta verileri~E) Enerji verileri|E) Enerji verileri|Eğitim, banka, tapu ve sigorta şahsın kendisine ait mahrem verilerdir. 'Enerji verileri' (Örn: santral üretimi) anonim ve endüstriyel verilerdir.",
    "Vize 2023,Vize 2024-25,Banko|I. Uluslararası açık bilgi (OKI) II. Açık devlet ortaklığı (OGP) III. Akşam kapalı veri izleme (claus data watch) IV. Kalkınma için açık veri (OD4D) V. Global açık veri inisiyatifi (GODI). Açık veri örnekleriyle ilgili hangileri doğrudur?|A) I, II, III~B) I, IV, V~C) I, II, IV, V~D) I, III~E) II, IV, V|C) I, II, IV, V|OKI, OGP, OD4D ve GODI dünyadaki bilinen açık veri inisiyatifleridir. III numaralı 'Kapalı Veri İzleme' uydurma bir çeldiricidir.",
    "Vize 2024,Vize 2024-25,Vize 2025-2026,Banko|Aşağıdakilerden hangisi büyük veri teknolojilerinin fonksiyonellik-teknoloji araçları eşleştirmesinde yanlış olarak verilmiştir?|A) İstatistik & Makine Öğrenmesi - Weka~B) Görselleştirme - Google Charts~C) Veri işleme - MapReduce~D) Sorgu Dili - Tableau~E) Veri Ambarı - HadoopDB|D) Sorgu Dili - Tableau|Tableau dünyaca ünlü bir 'Görselleştirme ve İş Zekası' (Dashboard) aracıdır. SQL, Hive gibi bir veritabanı sorgu dili değildir.",
    "Vize 2024,Vize 2024-25,Final 2023,Banko|Aşağıdakilerden hangisi veri mahremiyeti ile ilgili doğru bir bilgidir?|A) Veriden kişiye ulaşmayı sağlayacak ilişkileri mümkün olduğunca ortaya çıkarmak için yapılır.~B) Verinin kiminle hangi amaçla paylaşacağına dair sınırları ortadan kaldırmak için yapılır.~C) Veriden gizli örüntüleri ortaya çıkararak verinin anlamlandırılmasının önlenmesi için yapılır.~D) Veri paylaşımının kötü amaçlı kullanımını önlemek için yapılır.~E) Veriden bir kişiye doğrudan veya dolaylı olarak erişimi sağlamak için yapılır.|D) Veri paylaşımının kötü amaçlı kullanımını önlemek için yapılır.|Veri Mahremiyetinin Amacı: Kişisel verilerin yetkisiz kişilerin eline geçmesini ve şantaj/fişleme gibi kötü senaryolarla kullanılmasını engellemektir.",
    "Vize 2024,Vize 2025-2026,Banko|I. Sürdürülebilirlik II. Hesap verebilirlik III. Yeniden paylaşılabilirlik IV. Ücretlendirilebilirlik V. İnovasyon odaklılık. Büyük verinin 'Açık Veri' haline getirilmesinde uyulması gereken ilkeler hangileridir?|A) II-IV-V~B) II-III-V~C) I-IV~D) I-II-IV~E) I-II-III|B) II-III-V|Açık veri asla ücretlendirilemez (IV yanlıştır). Açık verinin ruhu şeffaflık (II), telifsiz kullanım (III) ve yeni uygulamalar çıkararak inovasyon yaratmaktır (V).",

let allOpen = false;

const parsedSorular = rawData.map(row => {
    let parts = row.split('|');
    if(parts.length < 5) return null;
    return { c: parts[0].split(','), q: parts[1], o: parts[2].split('~'), a: parts[3], e: parts[4] };
}).filter(x => x !== null);

function ekranaCiz(liste) {
    const cont = document.getElementById('q-container');
    cont.innerHTML = '';
    if(liste.length === 0) { cont.innerHTML = '<h3 style="text-align:center; color:#e74c3c;">Soru bulunamadı.</h3>'; return; }

    liste.forEach((s, i) => {
        let tagsHTML = s.c.map(c => {
            let ct = c.trim();
            if(ct.toUpperCase() === "BANKO") return `<span class="tag tag-h">🔥 Banko</span>`;
            return `<span class="tag tag-e">📅 ${ct}</span>`;
        }).join('');

        let optsHTML = s.o.map(o => `<li>${o}</li>`).join('');
        cont.innerHTML += `<div class="card"><div class="tags">${tagsHTML}</div><p class="q-text">${i+1}. ${s.q}</p><ul class="opt">${optsHTML}</ul><button class="ans-btn" onclick="tgl(this)">Cevabı Göster</button><div class="ans-box"><p class="ans-true">✔️ ${s.a}</p><p class="exp-text">💡 ${s.e}</p></div></div>`;
    });
}

function filter(tag) {
    let search = tag.trim().toLowerCase();
    
    document.querySelectorAll('#kategori-secici, .btn').forEach(b => {
        if(b.tagName !== 'SELECT' && b.id !== 'arama' && !b.classList.contains('btn-g')) b.classList.remove('active');
    });

    let filtered = (search === 'all') ? parsedSorular : parsedSorular.filter(s => s.c.some(c => {
        let dataTag = c.trim().toLowerCase();
        if (search === 'banko') return dataTag === 'banko';
        if (search === 'vize') return dataTag.includes('vize');
        if (search === 'final') return dataTag.includes('final');
        if (search === 'büt') return dataTag.includes('büt');
        return dataTag.includes(search);
    }));
    ekranaCiz(filtered);
}

function aramaYap() {
    let kelime = document.getElementById('arama').value.toLowerCase().trim();
    ekranaCiz(kelime === '' ? parsedSorular : parsedSorular.filter(s => s.q.toLowerCase().includes(kelime) || s.e.toLowerCase().includes(kelime)));
}

function tgl(btn) {
    const box = btn.nextElementSibling;
    box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    btn.textContent = (box.style.display === 'block') ? 'Cevabı Gizle' : 'Cevabı Göster';
}

function toggleAll() {
    allOpen = !allOpen;
    document.querySelectorAll('.ans-box').forEach(b => b.style.display = allOpen ? 'block' : 'none');
    document.querySelectorAll('.ans-btn').forEach(b => b.textContent = allOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
}

window.onload = () => filter('all');
</script>

<script>
// AUZEF GÖRÜNÜM & CİHAZ PROFİLİ YÖNETİCİSİ
function setAuzefDeviceProfile(dev) {
    if (dev === 'auto') {
        const w = window.innerWidth;
        dev = (w <= 640) ? 'mobile' : 'web';
    }
    document.documentElement.setAttribute('data-device', dev);
    try { localStorage.setItem('auzef_device_profile', dev); } catch(e){}
    const sel = document.getElementById('deviceProfileSelect');
    if (sel && sel.value !== dev && sel.value !== 'auto') sel.value = dev;
}

function toggleAuzefTheme() {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('auzef_theme', cur); } catch(e){}
    const btn = document.getElementById('auzefThemeToggleBtn');
    if (btn) btn.textContent = cur === 'dark' ? '☀️ Açık' : '🌙 Koyu';
}

(function initAuzefViewMode() {
    try {
        const savedDev = localStorage.getItem('auzef_device_profile') || 'auto';
        setAuzefDeviceProfile(savedDev);
        const sel = document.getElementById('deviceProfileSelect');
        if (sel) sel.value = savedDev;

        const savedTheme = localStorage.getItem('auzef_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        const btn = document.getElementById('auzefThemeToggleBtn');
        if (btn) btn.textContent = savedTheme === 'dark' ? '☀️ Açık' : '🌙 Koyu';
    } catch(e){}
})();
</script>
