    "u12|Eksik cevapların düzeltilmesi yöntemlerinden biri olan \"İkili (Pairwise) Silme\" yöntemi hangi durumlarda KULLANILIR?|A) Örnek büyüklüğü çok, eksik cevaplar az ve değişkenlerin ilişkilerinin çok sıkı olmadığı durumlarda.~B) Örnek büyüklüğü 30'un altında olduğunda.~C) Eksik cevap oranı %90'ın üzerinde olduğunda.~D) Bütün anket boş olduğunda.~E) Sadece nitel verilerde.|A) Örnek büyüklüğü çok, eksik cevaplar az ve değişkenlerin ilişkilerinin çok sıkı olmadığı durumlarda.|Kayıp verisi olan kişiyi tamamen atmak yerine, sadece boş bıraktığı sorunun (ikili) analizlerinde o kişiyi sistem dışı bırakma esnekliğidir.",
    "u12|Bir araştırma sonucunda toplanan ham (işlenmemiş) verilere hiç istatistiksel analiz YAPILMAMASI durumunda ne olur?|A) Doğrudan Nobel ödülü alınır.~B) Tamsayıma dönüşür.~C) Hiçbir anlam ifade etmezler, bilimsel ve objektif sonuç çıkarılamaz.~D) Güvenirlik %100 olur.~E) Parametrik hale gelirler.|C) Hiçbir anlam ifade etmezler, bilimsel ve objektif sonuç çıkarılamaz.|Veriler kendi başlarına sadece rakam ve kelimelerden ibarettir; onlara anlam ve ruh kazandıran şey veri analizi sürecidir.",
"u13|\"Bilimsel bir fikrin büyüklüğünün ölçüsü, düşünceyi ne ölçüde harekete geçirdiği ve yeni araştırma alanları açtığıdır.\" sözü kime aittir?|A) Albert Einstein~B) Arthur Conan Doyle~C) Paul Dirac~D) W. Edwards Deming~E) Rensis Likert|C) Paul Dirac|Ünite 13'ün girişinde yer alan bu özlü söz ünlü fizikçi Paul Dirac'a aittir.",
    "u13|Bilimsel araştırma sürecinin en son (nihai) aşaması aşağıdakilerden hangisidir?|A) Veri Analizi~B) Hipotez Kurma~C) Verilerin toplanması~D) Bulguların yorumlanması, araştırma raporunun hazırlanması ve sunulması~E) Literatür taraması|D) Bulguların yorumlanması, araştırma raporunun hazırlanması ve sunulması|Bir araştırma ancak sonuçların raporlanıp okuyucuyla (veya karar alıcıyla) paylaşılmasıyla tamamlanmış sayılır.",
    "u13|Veri çözümleme (istatistiksel analiz) aşamasını hangi aşama izler?|A) Anketin basılması~B) Verilerin yorumlanması (Tartışma)~C) Hipotezin oluşturulması~D) Örneklemin seçilmesi~E) Veri girişi|B) Verilerin yorumlanması (Tartışma)|Sadece rakamları bulmak yetmez; o rakamların ne anlama geldiğinin (çözüme nasıl katkı sağladığının) yorumlanması gerekir.",
    "u13|Araştırma süreçleri, temelde bireyin araştırılan konuda yoğun düşünmesi ve 'ne yapma' amacına dönüktür?|A) Raporu kalınlaştırma~B) Kütüphaneyi doldurma~C) Sonucu etkileme olasılığı yüksek değişkenleri bularak problem çözümü için VERİLECEK KARARI KOLAYLAŞTIRMA~D) Bütçeyi harcama~E) Sadece merak giderme|C) Sonucu etkileme olasılığı yüksek değişkenleri bularak problem çözümü için VERİLECEK KARARI KOLAYLAŞTIRMA|Araştırmanın asıl varoluş sebebi, yöneticilerin veya bilim insanlarının doğru adım (karar) atabilmesini sağlamaktır.",
    "u13|Araştırma raporunun 'Yorum ve Tartışma' bölümünde hangisinin bulunması BEKLENMEZ?|A) Bulguların düz ve basit bir şekilde özetlenip geçilmesi.~B) Yorumların genellenebilirliği ve sınırlılıklarının tartışılması.~C) Geçmiş literatür bağlamında bulguların ne anlama geldiğinin açıklanması.~D) İleriki araştırmalar için öngörülerde bulunulması.~E) Hipotezlerin ne şekilde doğrulandığı veya yanlışlandığının tartışılması.|A) Bulguların düz ve basit bir şekilde özetlenip geçilmesi.|Yorum ve tartışma bölümü basit bir özetten ibaret olmamalı; bulguların derinlemesine tartışıldığı, anlamlandırıldığı bir bölüm olmalıdır.",
    "u13|Karar alıcılar (yöneticiler) için hazırlanan Yönetici Özeti (Raporu) nasıl olmalıdır?|A) Çok uzun ve karmaşık olmalıdır.~B) Sonuçların genellenebilirliğini ve hata paylarını GİZLEMELİDİR.~C) Sayılardan çok, karar almayı yönlendirici sonuçlar üzerinde duran, hata paylarını ve kısıtları açıkça içeren (çok uzun olmayan) bir özet olmalıdır.~D) Sadece istatistik formüllerinden oluşmalıdır.~E) Geçmişin hikayesini anlatmalıdır.|C) Sayılardan çok, karar almayı yönlendirici sonuçlar üzerinde duran, hata paylarını ve kısıtları açıkça içeren (çok uzun olmayan) bir özet olmalıdır.|Yöneticilerin kalın raporları okuyacak vakti yoktur, onlara kısa, net, kısıtları belirten 'aksiyon odaklı' özetler gerekir.",
    "u13|Araştırma raporunun 'Tartışma' bölümünde aşağıdaki sorulardan hangisine YANIT VERİLMESİ beklenir?|A) Benim bu bulgu sayesinde bilime ne tür bir katkım oldu?~B) Yaptığım çalışma, problemi çözümlememe ne şekilde yardımcı oldu?~C) Çalışmamdan ne tür kuramsal sonuçlar çıkıyor?~D) Benzer araştırmalar iyileştirilerek nasıl daha iyi yapılabilir?~E) Hepsi|E) Hepsi|Tartışma bölümü, çalışmanın bilime ve uygulamaya (kendi özeleştirisiyle birlikte) tam olarak ne kattığını anlattığı yerdir.",
    "u13|Araştırmanın sonuçlarının araştırmacı tarafından anlaşılır ve özet bir şekilde organize edilmesi (ve genellikle yazılı bir metin halinde sunulması) aşamasına ne ad verilir?|A) Veri Analizi~B) Raporlama~C) Örnekleme~D) Kodlama~E) Geçerlik|B) Raporlama|Raporlama, tüm projenin (tasarım, veri toplama, bulgular) ete kemiğe bürünüp kağıda döküldüğü ve paylaşıldığı iletişim aşamasıdır.",
    "u13|Rapor yazımında araştırmacının dikkat etmesi gereken önemli kurallardan biri nedir?|A) Raporu okuyacak yöneticilere tepeden bakmalıdır.~B) Kimin için hazırlanıyorsa onun anlayabileceği ve yararlanabileceği (açık ve akıcı) bir dille yazmalıdır.~C) Cümleleri çok uzun ve karmaşık tutmalıdır.~D) Mümkün olduğunca argo ve çok ağır teknik jargon kullanmalıdır.~E) Hiçbir şekilde özet kullanmamalıdır.|B) Kimin için hazırlanıyorsa onun anlayabileceği ve yararlanabileceği (açık ve akıcı) bir dille yazmalıdır.|Yazılan metin hedef kitlenin (yöneticilerin veya halkın) seviyesine ve terminolojisine uygun, sade bir dille kaleme alınmalıdır.",
    "u13|Yapısı ile ilgili olarak bakıldığında, standart bir araştırma raporu sırasıyla hangi kısımlardan (bölümlerden) oluşur?|A) Başlık - Tartışma - Bulgular - Kaynakça~B) Giriş - Özet - Ekler - Yöntem~C) Başlık, Özet, Giriş, Yöntem, Bulgular, Tartışma, Sonuç/Öneriler ve Kaynakça~D) Sadece Metin ve Kaynakça~E) Özet - Sonuç - Giriş - Tartışma|C) Başlık, Özet, Giriş, Yöntem, Bulgular, Tartışma, Sonuç/Öneriler ve Kaynakça|Bir akademik veya profesyonel raporun standart iskeleti ve sıralaması bu şekildedir.",
    "u13|Araştırma raporunun \"Birinci (Ön) Kısmı\" içinde aşağıdakilerden hangisi YER ALMAZ?|A) Kapak sayfası~B) Özet~C) Anahtar Kelimeler~D) Kısaltmalar~E) Bulgular (Metin kısmı)|E) Bulgular (Metin kısmı)|Bulgular raporun ana gövdesini (Metin Kısmını) oluşturur. Ön kısım sadece tanıtıcı ögeleri (Kapak, Önsöz, İçindekiler vb.) kapsar.",
    "u13|Raporların ilgilenenler (veya kütüphaneler) tarafından kolayca taranıp bulunabilmesini sağlamak amacıyla, araştırmanın esas kavramlarının 3-5 kelimeyle listelendiği bölüme ne ad verilir?|A) Önsöz~B) Kısaltmalar~C) Anahtar Kelimeler (Keywords)~D) Dizin~E) İçindekiler|C) Anahtar Kelimeler (Keywords)|Makale veya tez ararken arama motorlarına girilen temel kelimelerdir (Örn: \"Pazarlama, Algı, Anket\").",
    "u13|Araştırmanın yer aldığı, girişle başlayıp sonuçla biten ve yazarın fikirlerini/verilerini açıkladığı raporun \"Ana Gövdesine\" ne ad verilir?|A) Birinci Kısım~B) Metin Kısmı~C) Son Kısım~D) Ekler~E) Kaynakça|B) Metin Kısmı|Metin kısmı (Giriş, Yöntem, Bulgular, Sonuç), araştırmanın tüm hikayesinin ve kanıtlarının yer aldığı temel bölümdür.",
    "u13|Metin içinde verilmesi araştırmanın akıcılığını bozacak olan (uzun tablolar, anket formları, belgeler vb.) destekleyici materyaller raporun neresine konulur?|A) Özet kısmına~B) Giriş bölümüne~C) Ekler (Son Kısım) bölümüne~D) Kapak sayfasına~E) Tartışma bölümüne|C) Ekler (Son Kısım) bölümüne|Metni sıkıcı ve kalabalık yapmamak için 5 sayfalık anket formu veya ham SPSS tabloları raporun en arkasına 'Ek-1, Ek-2' diye eklenir.",
    "u13|Aranan konuların kolaylıkla bulunabilmesi için kelimelerin/kavramların hangi sayfada geçtiğini alfabetik sırayla gösteren, raporun en sonundaki bölüme ne ad verilir?|A) Kısaltmalar~B) İçindekiler~C) Önsöz~D) Dizin (İndeks)~E) Kaynakça|D) Dizin (İndeks)|Özellikle kalın kitapların ve raporların en arkasında yer alan kelime bulucu (Arama) listesidir.",
    "u13|Araştırma raporunun DİL ve ÜSLUBU ile ilgili aşağıdakilerden hangisi DOĞRUDUR?|A) Çok uzun ve birden fazla yargı içeren karmaşık cümleler kullanılmalıdır.~B) Cümlelerde sık sık 'bence, hissediyorum' gibi ÖZNEL (sübjektif) ifadelere yer verilmelidir.~C) Argo ve abartılı ifadeler kullanılmalıdır.~D) Akıcı bir dille yazılmalı, kısa ve tek yargılı cümlelere yer verilmelidir.~E) Konuyla ilgisiz bolca süsleme ve resim konmalıdır.|D) Akıcı bir dille yazılmalı, kısa ve tek yargılı cümlelere yer verilmelidir.|Akademik ve bilimsel dil; nesnel (objektif), sade, kısa ve doğrudan hedefe yönelik (akıcı) olmalıdır.",
    "u13|Bilimsel araştırmalarda kaynak gösterme yöntemi olarak; metin içinde yararlanılan kaynağın, o cümlenin/paragrafın sonuna parantez içinde (Yazarın Soyadı ve Yılı) yazılarak belirtildiği yönteme ne ad verilir?|A) Dipnotla Kaynak Gösterme~B) Metin İçinde Kaynak Gösterme (Harvard / APA Yöntemi)~C) Doğrudan Alıntılama~D) Kısaltma Yöntemi~E) İntihal Yöntemi|B) Metin İçinde Kaynak Gösterme (Harvard / APA Yöntemi)|(Kurtuluş, 2010) örneğinde olduğu gibi kaynağı sayfa altına değil, doğrudan metnin içine parantezle gömen sistemdir.",
    "u13|Gönderme yapılacak yerin üzerine (veya sonuna) bir RAKAM konularak, kaynağın tam künyesinin o \"sayfanın EN ALTINA (dibine)\" yazıldığı geleneksel yönteme ne ad verilir?|A) Metin İçi Gönderme~B) Doğrudan Alıntı~C) Parantez İçi Yöntem~D) Dipnotla Kaynak Gösterme~E) Apa Yöntemi|D) Dipnotla Kaynak Gösterme|Rakamla işaretlenen (Örn: ...dedi.¹) kaynağın, aynı sayfanın etek kısmında çizginin altında açıklandığı eski ama hala kullanılan sistemdir.",
    "u13|Bilgilerin veya alıntının, özgün biçim ve içerik yönünden 'HİÇ DEĞİŞTİRİLMEDEN' (kelimesi kelimesine) aktarılmasına ne ad verilir?|A) İntihal~B) Kaynak gösterme~C) Doğrudan Alıntılama / Aktarma (Atıf)~D) Kapsamlı yorumlama~E) Dolaylı alıntı|C) Doğrudan Alıntılama / Aktarma (Atıf)|Yazarın cümlesini noktası virgülüne dokunmadan kopyalamaktır. Eğer 40 kelimeden kısaysa tırnak (\" \") içinde, uzunsa blok halinde verilir.",
    "u13|Başkalarının bilgi birikiminden ve düşüncelerinden yararlanıldığı halde, kaynak gösterilmemesi ve bilginin \"kendisine aitmiş gibi\" sunulması akademik dünyada hangi büyük etik suçu/durumu oluşturur?|A) Metin içi aktarım~B) İntihal (Aşırma / Fikir Hırsızlığı)~C) Doğrudan alıntı~D) Esinlenme~E) Blok alıntı|B) İntihal (Aşırma / Fikir Hırsızlığı)|Kaynak belirtilmeyen her fikir ve veri yazarın kendisinin varsayılır; başkasına aitse bu durum açık bir fikir hırsızlığıdır (intihaldir).",
    "u13|Aşağıdaki durumlardan hangisinde kaynak GÖSTERİLMESİNE / ALINTI yapıldığının belirtilmesine GEREK YOKTUR?|A) Bir bilim insanının yeni bulduğu bir formülü kullanırken.~B) Bir makaleden değiştirerek özet çıkardığımızda.~C) Dünyanın yuvarlak olduğu veya Türkiye'nin ilk cumhurbaşkanının Atatürk olduğu gibi \"Herkesçe bilinen (Genel Bilgi)\" gerçekleri yazarken.~D) Telif hakkı olan bir fotoğrafı rapora koyarken.~E) Başka bir tezden veri tablosu alırken.|C) Dünyanın yuvarlak olduğu veya Türkiye'nin ilk cumhurbaşkanının Atatürk olduğu gibi \"Herkesçe bilinen (Genel Bilgi)\" gerçekleri yazarken.|Anonimleşmiş, atasözü olmuş veya tüm insanlığın bildiği temel ortak bilgiler için referans / kaynak gösterilmez.",
    "u13|Bilimsel yayınlarda 'Kaynak Gösterme İlkeleri' ile ilgili aşağıdakilerden hangisi YANLIŞTIR?|A) Metin içinde gönderme yapılan HER kaynak Kaynakça'da yer almalıdır.~B) Kaynakçada yer verilen HER kaynağa da metin içinde gönderme yapılmalıdır.~C) Kaynakçaya alınacak yapıtlar, yazarın bizzat okuyup yararlandığı yapıtlar olmalıdır.~D) Bir araştırmacı, araştırmasında KULLANMADIĞI (ama havalı görünsün diye) bütün kitapları ana kaynakçaya eklemelidir.~E) Yabancı dildeki kaynaklardan çevrilerek yapılan alıntılarda metnin çeviri olduğunun belirtilmesi gerekir.|D) Bir araştırmacı, araştırmasında KULLANMADIĞI (ama havalı görünsün diye) bütün kitapları ana kaynakçaya eklemelidir.|Sadece metnin içinde atıf yapılan (kullanılan) kaynaklar kaynakçaya yazılır. Okunmayan veya kullanılmayan eserleri listeye eklemek bilimsel ahlaka aykırıdır.",
    "u13|Yazarın araştırmada doğrudan kullanmadığı, ancak okuyucu için \"yararlı olabileceğini\" düşündüğü ek kitaplar raporun neresinde ve hangi isimle verilir?|A) Ön Sözde~B) \"Ek Kaynakça\" veya \"Yardımcı Kaynakça\" gibi farklı bir başlık altında~C) Ana metnin içinde parantezle~D) Kapak sayfasında~E) Kısaltmalar bölümünde|B) \"Ek Kaynakça\" veya \"Yardımcı Kaynakça\" gibi farklı bir başlık altında|Asıl kaynakçaya karıştırılmazlar, ayrı bir başlık altında (Okuma Önerileri gibi) sunulurlar.",
    "u13|Bir kaynaktan aldığı bilgiyi (kopyala-yapıştır yapmadan) kendi cümleleriyle YENİDEN İFADE EDEREK (özetleyerek) metne aktaran bir araştırmacı kaynak GÖSTERMELİ MİDİR?|A) Hayır, kendi cümlesi olduğu için kaynak göstermez.~B) Hayır, sadece tırnak işareti koyar.~C) Evet, bilginin ve fikrin aidiyeti değişmediği için kaynağa GÖNDERME YAPILMASI ZORUNLUDUR.~D) Sadece kitap ismi verse yeter.~E) İntihal sayılmaz, göstermeyebilir.|C) Evet, bilginin ve fikrin aidiyeti değişmediği için kaynağa GÖNDERME YAPILMASI ZORUNLUDUR.|Cümleyi değiştirseniz bile \"fikir\" size ait değildir; bu yüzden yazarın soyadını ve yılını (atıf) belirtmek zorundasınız.",
    "u13|Kaynak gösterilse BİLE aşağıdakilerden hangisinin yapılması akademik kurallara AYKIRIDIR?|A) Bir makaleden 3 satırlık doğrudan alıntı yapılması.~B) Bir yapıtın (kitabın) TAMAMININ veya tamamına yakın bir bölümünün başka bir çalışmada aktarılması/kopyalanması.~C) Atasözlerinin kaynak gösterilmeden kullanılması.~D) Çeviri yapıldığının belirtilmesi.~E) Telif hakkı olan resimler için yazılı izin alınması.|B) Bir yapıtın (kitabın) TAMAMININ veya tamamına yakın bir bölümünün başka bir çalışmada aktarılması/kopyalanması.|Kaynak gösterseniz bile başka bir eseri baştan aşağı kopyalayamazsınız; bu telif hakkı ve akademik üretim etiği ihlalidir.",
    "u13|Araştırmanın oluşturulmasında yararlanılan tüm kaynakların eksiksiz, alfabetik veya sistemli bir biçimde (yazar adı, yayın yılı, eser adı, yayınevi vb. künye detaylarıyla) listelendiği en arka bölüme ne ad verilir?|A) Dipnot~B) Ön Söz~C) Kaynakça (Referanslar)~D) Dizin~E) Ekler|C) Kaynakça (Referanslar)|Kullanılan her kaynağın açık adresinin (künyesinin) bulunduğu, okuyucunun o eseri bulmasını sağlayan son bölümdür.",
"u14|\"Dürüstlük, bilgelik kitabının ilk bölümüdür.\" sözü kime aittir?|A) Arthur Conan Doyle~B) Thomas Jefferson~C) Paul Dirac~D) Albert Einstein~E) W. Edwards Deming|B) Thomas Jefferson|Ünite 14'ün girişinde yer alan bu özlü söz Thomas Jefferson'a aittir.",
    "u14|Ahlak kavramı daha çok sosyal yaşamla ilgiliyken, 'her türlü insan ilişkisini içeren ve evrensel kabul gören kurallar bütünü' olarak tanımlanan kavram hangisidir?|A) Yargı~B) Geçerlik~C) Etik~D) Kültür~E) Güvenirlik|C) Etik|Metinde ahlakın daha çok sosyal yaşamla, etiğin ise her türlü insan ilişkisiyle ve evrensel kurallarla ilgili olduğu vurgulanmıştır.",
    "u14|Türkiye'de bilim etiği konusunda önemli çalışmalar yapan ve 2001 yılında 'Bilim Etiği' basın duyurusunu yayınlayan temel kurumun kısa adı nedir?|A) TÜBİTAK~B) MEB~C) YÖK~D) TÜBA (Türkiye Bilimler Akademisi)~E) ÖSYM|D) TÜBA (Türkiye Bilimler Akademisi)|TÜBA (Türkiye Bilimler Akademisi), Türkiye'de bilim etiği ilkelerini belirleyen ve standartlar koyan öncü kurumdur.",
    "u14|TÜBA'nın bilim etiği ilkelerinden olan 'Gerçeğe Uygunluk' ilkesi neyi ifade eder?|A) Araştırmanın deneklere zarar vermemesini~B) Araştırmaya katkıda bulunmayanların yazar yazılmamasını~C) Verilerin sadece bilimsel yöntemlerle yürütülen gerçek deney/gözlemlerden elde edilmesini ve sonuçların saptırılmamasını~D) Kaynak gösterilmesini~E) Toplumu uyarma yükümlülüğünü|C) Verilerin sadece bilimsel yöntemlerle yürütülen gerçek deney/gözlemlerden elde edilmesini ve sonuçların saptırılmamasını|Verilerin uydurulmaması, sadece gerçek bulgulara dayanması 'gerçeğe uygunluk' ilkesidir.",
    "u14|TÜBA'nın bilim etiği ilkelerinden olan 'Yazarlar' ilkesine göre aşağıdakilerden hangisi ETİK DIŞI bir davranıştır?|A) Araştırmayı yapan tüm kişilerin isimlerinin yayınlanması.~B) Araştırmanın planlanması ve yürütülmesinde 'hiçbir katkısı olmayan' kişilerin isimlerinin yazar olarak eklenmesi.~C) Sadece projede gerçekten çalışanların yazar olması.~D) Verilerin objektif olarak toplanması.~E) Liyakat ölçütlerine uyulması.|B) Araştırmanın planlanması ve yürütülmesinde 'hiçbir katkısı olmayan' kişilerin isimlerinin yazar olarak eklenmesi.|Katkısı olmayan kişileri yazar olarak eklemek (ikram yazarlığı) bilimsel etiğe aykırıdır.",
    "u14|Bilim insanlarının araştırma sonuçları ile ilgili toplumu bilgilendirmek, olası zararlı uygulamalar konusunda uyarmak ve vicdani olarak zararlı gördükleri araştırmalara katılmayı reddetmek gibi haklarını tanımlayan TÜBA ilkesi hangisidir?|A) Kaynak Gösterme~B) Yazarlar~C) Gerçeğe Uygunluk~D) Sorumluluk ve Haklar~E) Zarar Vermemesi|D) Sorumluluk ve Haklar|Bilim insanı, toplum için zararlı bir proje (örn. biyolojik silah vb.) hissettiğinde buna katılmama 'hakkına' ve toplumu uyarma 'sorumluluğuna' sahiptir.",
    "u14|Bilimsel araştırmalarda 'Akademik Etik' aşağıdakilerden hangisini İÇERMEZ?|A) Bilimsel sahtekârlık ve yalancılık~B) Yayın intihalleri~C) Özensiz ve disiplinsiz araştırma~D) Orijinal ve liyakate dayalı araştırma tasarımı~E) İkram yazarlığı ve çıkar çatışmaları|D) Orijinal ve liyakate dayalı araştırma tasarımı|Orijinal araştırma ve liyakat zaten olması gereken etik durumlardır; sorudaki diğer şıklar akademik etiğin ilgilendiği 'etik dışı ihlal' konularıdır.",
    "u14|Araştırma etiğinde sıklıkla karşılaşılan ve kötü niyet barındırmasa bile bilimsel metodolojiye uymayarak yanlış sonuçlara ulaşılan 'bilimsel yanıltma' durumları hangileridir?|A) Özensiz Araştırma ve Disiplinsiz Araştırma~B) İntihal ve Kopyacılık~C) İkram yazarlığı ve Muvazaa~D) Sahtekarlık ve Yalancılık~E) Telif hakkı ihlali|A) Özensiz Araştırma ve Disiplinsiz Araştırma|Araştırmacının kötü niyeti yoktur ancak bilgisizliği veya dikkatsizliği (özensiz/disiplinsiz olması) yüzünden toplumu ve bilimi yanıltır.",
    "u14|Araştırma yapmayı bilmeyen bir araştırmacının yanlışlar yapması ve güvenilmez sonuçlar üretmesine ne ad verilir?|A) Bilimsel hile~B) Muvazaa~C) Bilinçli intihal~D) Disiplinsiz araştırma~E) Sahtekârlık|D) Disiplinsiz araştırma|Eğitimsizlik ve yöntem bilmeme sebebiyle (kasıt olmadan) hatalı veriler üreten araştırma disiplinsiz araştırmadır.",
    "u14|Araştırmacının, araştırmanın yöntemini ya da sonuçlarını KASITLI olarak saptırması ya da araştırmayı yapmadan 'sahte veriler' uydurması (masa başı anket doldurması) ne olarak adlandırılır?|A) Disiplinsiz araştırma~B) Özensiz araştırma~C) Bilimsel hile (Sahtekârlık/Yalancılık)~D) Kapsam dışı hata~E) Bilinçsiz intihal|C) Bilimsel hile (Sahtekârlık/Yalancılık)|Sonuçlarla bile bile oynamak, uydurma veri girmek en ağır akademik suçlardan olan bilimsel hiledir.",
    "u14|Bir araştırma sürecinde genellikle hangi taraflar arasında etik sorunlar / yükümlülük uyuşmazlıkları ortaya çıkar?|A) Sadece kurum ile devlet arasında.~B) Sadece anketör ile veri analisti arasında.~C) Araştırmacı, Araştırmayı yaptıran kurum, Cevaplayıcı ve Kamuoyu arasında.~D) Sadece yazarlar arasında.~E) Sadece üniversite ile YÖK arasında.|C) Araştırmacı, Araştırmayı yaptıran kurum, Cevaplayıcı ve Kamuoyu arasında.|Etik uyuşmazlıklar genelde bu 4 ana paydaşın menfaatlerinin çatışmasından doğar.",
    "u14|Araştırmacının, rapor sonuçlarını çarpıtarak ve asıl gerçekleri gizleyerek (eksik raporlayarak) topluma sunması, hangi tarafa yönelik bir ETİK DIŞI davranıştır?|A) Cevaplayıcıya~B) Kamuoyuna~C) Anketi basan matbaaya~D) Rakiplere~E) Anketöre|B) Kamuoyuna|Toplumu ve tüketicileri yanıltıcı araştırma sonuçları (örn: reklam amaçlı sahte istatistikler) yayınlamak kamuoyuna karşı etik ihlalidir.",
    "u14|Aşağıdakilerden hangisi araştırmaya katılan 'Cevaplayıcılar (Denekler)' açısından ETİK DIŞI bir davranış DEĞİLDİR?|A) Özel bir ölçümün amacının gizlenmesi.~B) İşbirliği sağlamak için cevaplayıcıya yalan söylenmesi.~C) Cevaplayıcının açık izni alınarak gönüllü anket yapılması.~D) Cevaplayıcının izni olmadan gizli ses veya kamera kaydı yapılması.~E) Bir görüşme daha yapılacağının (sürprizin) cevaplayıcıya söylenmemesi.|C) Cevaplayıcının açık izni alınarak gönüllü anket yapılması.|Denekten izin almak, onu aydınlatmak etik kurallara tam uyumdur.",
    "u14|Cevaplayıcının araştırmaya istekli olarak katılmayı kabul ettiğinde, yerine getirmesi beklenen temel yükümlülüğü nedir?|A) Ücret talep etmesi~B) Dürüst işbirliği yapması ve doğru cevaplar vermesi~C) Anketörü kandırması~D) Soruları atlaması~E) Soruları başkasına çözdürmesi|B) Dürüst işbirliği yapması ve doğru cevaplar vermesi|Araştırmacı dürüst olmak zorundaysa, denek (cevaplayıcı) de anket formunda yalan söylemeyerek dürüst işbirliği sergilemelidir.",
    "u14|Araştırmayı yaptıran kurumun (şirketin), sadece 'kendi istediği önceden belirlenmiş (örneğin ürünü öven) sonuçları' elde etmek amacıyla araştırmacıya baskı yapması, kimler arasındaki etik sorundur?|A) Araştırmacı - Cevaplayıcı~B) Cevaplayıcı - Kamuoyu~C) Kurum - Kamuoyu~D) Araştırmacı - Kurum~E) Araştırmacı - Anketör|D) Araştırmacı - Kurum|Parayı veren kurumun, objektiflik yerine ticari çıkar uğruna sipariş sonuç istemesi araştırmacı-kurum etiğini bozar.",
    "u14|Eser sahibi ürününün izinsiz kullanılmasından haberdar olması ve araştırmacının üçüncü kişileri aldatmasına göz yumması (yardım etmesi) şeklindeki akademik aldatma türüne ne ad verilir?|A) İntihal~B) Atıf~C) Muvazaa~D) Açımlama~E) Disiplinsizlik|C) Muvazaa|Muvazaa (danışıklı dövüş), eserin asıl sahibinin kendi eserinin başkası tarafından aşırmasına ses çıkarmayarak suça ortak olmasıdır.",
    "u14|Kaynak göstermeden, yazarın adını belirtmeden bir eserden parçalar alma, kendininmiş gibi gösterme veya bir eserin bütününü kendine mal etme (aşırma) işlemine ne ad verilir?|A) Açımlama~B) Atıf yapma~C) Literatür Taraması~D) İntihal (Plagiarism)~E) Muvazaa|D) İntihal (Plagiarism)|Başkasına ait bir fikri/metni kaynak göstermeksizin kendi üretimi gibi sunmak intihaldir.",
    "u14|Bir konuyu, aynı konuyla ilgili başka bir yerle bağlantılı kılma, orayı işaret etme, oraya bakılmasını isteme ve kaynağa gönderme yapma işlemine ne ad verilir?|A) İntihal~B) Muvazaa~C) Atıf (Referans)~D) Sahtekârlık~E) Telif~C) Atıf (Referans)|\"Bu bilgiyi falan kişiden aldım\" diyerek asıl kaynağı işaret etmeye atıf denir.",
    "u14|Başka birisine ait bir ifadenin araştırmacı tarafından 'kendi kelimeleriyle' tekrar ifade edilip, uygun bir şekilde atıfta bulunulması işlemine ne ad verilir?|A) Muvazaa~B) Açımlama (Paraphrasing)~C) İntihal~D) Çalıntı~E) Kopyalama|B) Açımlama (Paraphrasing)|Cümleyi kopyala-yapıştır yapmak yerine okuyup özetini (kendi cümleni) yazarak atıf yapmaya açımlama denir; tamamen etiktir.",
    "u14|İntihal eylemi için aşağıdakilerden hangisi SÖYLENEMEZ?|A) Başka bir kişiye ait fikir ve çalışmalar kullanılır.~B) Orijinal kaynak uygun biçimde belirtilmez.~C) Sadece kasten (bilerek) yapılırsa intihal sayılır, bilmeden (sehven) unutulursa intihal SAYILMAZ.~D) Üçüncü şahısları aldatma amacı veya sonucu doğurur.~E) İfadede değişiklik yapılmış olması (kaynak gizleniyorsa) intihal suçunu ortadan kaldırmaz.|C) Sadece kasten (bilerek) yapılırsa intihal sayılır, bilmeden (sehven) unutulursa intihal SAYILMAZ.|İntihalde niyet önemli değildir. Kasıtsız (bilmeden/unutarak) bile yapılsa, kaynak gösterilmediği an bu intihal sayılır.",
    "u14|Araştırmacının bir internet sitesinden para karşılığı hazır makale veya ödev satın alıp kendi adıyla sunması durumu aşağıdakilerden hangisiyle açıklanır?|A) Açımlama~B) Kasti (Ciddi) İntihal~C) Bilinçsiz intihal~D) Atıf~E) Disiplinsiz araştırma|B) Kasti (Ciddi) İntihal|Kötü niyetin tartışılamaz olduğu, bilerek ve planlanarak yapılan çok ağır bir intihal türüdür.",
    "u14|Bir yazarın, geçmişte yazmış olduğu kendi eserindeki görüşleri/metinleri, uygun bir şekilde atıfta bulunmadan yeni bir eserinde tekrar kullanmasına ne ad verilir?|A) Açımlama~B) Muvazaa~C) Kendinden İntihal (Self-plagiarism)~D) Bilinçsiz intihal~E) Özensiz araştırma|C) Kendinden İntihal (Self-plagiarism)|Kişinin kendi eseri bile olsa, daha önce yayınlanmış bir metni sanki 'ilk defa yazıyormuş gibi' yeni çalışmasına atıfsız koyması yasaktır.",
    "u14|Bir yazarın intihalden kaçınmak için gerekli becerilere (akademik yazım kurallarına) sahip olmamasına veya başkasına ait fikirleri iyice özümseyerek yanlışlıkla kendisine aitmiş gibi zannetmesine bağlı olarak yaptığı hataya ne ad verilir?|A) Kendinden intihal~B) Kasti intihal~C) Muvazaa~D) Bilinçsiz (Kasıtsız) İntihal~E) Bilimsel sahtekârlık|D) Bilinçsiz (Kasıtsız) İntihal|Kötü niyet olmamasına rağmen yazarın tecrübesizliği yüzünden bilmeden aşırma yapmasıdır.",
    "u14|Bütün farklı intihal türlerinin (kopyala-yapıştırdan, atıfsız açımlamaya kadar) temelindeki EN BÜYÜK ORTAK NOKTA nedir?|A) Metnin çok uzun olması.~B) Orijinal kaynaklara yeterli veya uygun 'referans/atıf' verilmemesi.~C) Sadece internetten yapılması.~D) Sadece İngilizce olması.~E) Cümlelerin kısa olması.|B) Orijinal kaynaklara yeterli veya uygun 'referans/atıf' verilmemesi.|İntihalin özü, bilginin asıl sahibinin hakkını (kaynağını) gizlemek veya unutmaktır.",
    "u14|Kişilerin (araştırmacı veya öğrencilerin) intihale başvurma sebepleri arasında aşağıdakilerden hangisi YER ALMAZ?|A) İntihalin internet sayesinde kolayca yapılabiliyor olması~B) Kötü zaman yönetimi (zamanın daralması)~C) Tembellik~D) Akranlar içindeki rekabet/statü~E) Bilime dürüst bir katkı sağlama arzusu|E) Bilime dürüst bir katkı sağlama arzusu|Bilime dürüst katkı sağlama arzusu intihal yapmayı değil, orijinal araştırma yapmayı (etik davranmayı) doğurur.",
    "u14|İntihali belirlemek için üniversitelerde yaygın olarak kullanılan \"metin eşleştirme\" tabanlı yazılım/sitelerden biri aşağıdakilerden hangisidir?|A) SPSS~B) Photoshop~C) Turnitin (veya iThenticate)~D) Excel~E) AutoCAD|C) Turnitin (veya iThenticate)|Turnitin, iThenticate, PlagScan gibi programlar, öğrencinin ödevini milyonlarca veri tabanıyla karşılaştırıp çalıntı oranını bulur.",
    "u14|İntihal belirleme sitelerinin (yazılımlarının) YETERSİZ KALDIĞI ve tam tespit edemediği temel problem nedir?|A) Sadece Türkçe tarama yapmaları.~B) Programların üzerinde oynanmış (eşanlamlı kelimelerle değiştirilmiş) metinleri tespit etmede tam başarılı olamaması ve sadece dijital ortama bakabilmesi.~C) Sadece 1 sayfa okuyabilmeleri.~D) Bilgisayarı çökertmeleri.~E) Tamamen %100 doğru sonuç vermeleri.|B) Programların üzerinde oynanmış (eşanlamlı kelimelerle değiştirilmiş) metinleri tespit etmede tam başarılı olamaması ve sadece dijital ortama bakabilmesi.|Eğer öğrenci metni alır, kelimelerin yerini değiştirir ve eşanlamlılarını yazarsa program bunu yakalamakta zorlanabilir.",
    "u14|İntihal belirleme yazılımlarından alınan raporların sonucu araştırmacı/hoca tarafından nasıl algılanmalıdır?|A) %100 kesin bir mahkeme kararı olarak.~B) Rapor her zaman yanlıştır diyerek.~C) İntihalin büyüklüğü ne olursa olsun sadece \"intihal şüphesi var\" şeklinde algılanmalı ve araştırmacı tarafından manuel kontrol edilmelidir.~D) Direkt disiplin cezası verilmelidir.~E) Hiç okunmadan çöpe atılmalıdır.|C) İntihalin büyüklüğü ne olursa olsun sadece \"intihal şüphesi var\" şeklinde algılanmalı ve araştırmacı tarafından manuel kontrol edilmelidir.|Yazılım sadece makinedir; örneğin doğru yapılmış bir atıfı veya kaynakçayı da çalıntı gibi gösterebilir. İnsan kontrolü şarttır.",
    "u14|Dünyada eser sahiplerinin kullanım haklarını kendilerinin belirlediği, telif hakları alanında esneklik ve paylaşımı yaygınlaştırmak amacıyla kurulan kâr amacı gütmeyen organizasyonun / lisansın adı nedir?|A) TÜBA~B) Turnitin~C) FSEK~D) Creative Commons (CC)~E) Copyright Strict|D) Creative Commons (CC)|CC lisansı, yazarın \"Ticari olmamak şartıyla eserimi alıp paylaşabilirsiniz\" gibi esnek haklar tanımlamasını sağlar.",
    "u14|Türkiye'de telif hakları hangi kanun ile korunmaktadır?|A) Türk Ceza Kanunu~B) 5846 sayılı Fikir ve Sanat Eserleri Kanunu~C) Medeni Kanun~D) Ticaret Kanunu~E) Bilişim Kanunu|B) 5846 sayılı Fikir ve Sanat Eserleri Kanunu|Eser sahibinin haklarını yasal güvence altına alan temel yasadır.",
    "u14|Telif hakları ihlali ile İntihal arasındaki temel farklardan biri aşağıdakilerden hangisidir?|A) Telif hakkı sadece akademik bir suçtur, intihal ise hapis cezası gerektirir.~B) Telif hakkı ihlali standart YASAL (hukuki) süreçlerle mahkemede yürütülür; İntihal ise temel olarak ÜNİVERSİTELER (akademik kurumlar) tarafından takip edilir.~C) İkisinin de cezası aynıdır.~D) Telif hakkı fikirleri, intihal ise somut eserleri korur.~E) İkisi tamamen aynı kavramdır.|B) Telif hakkı ihlali standart YASAL (hukuki) süreçlerle mahkemede yürütülür; İntihal ise temel olarak ÜNİVERSİTELER (akademik kurumlar) tarafından takip edilir.",
    "u14|Bir eserin telif haklarının ihlal edilmemesi için atıf yapmak YETERLİ MİDİR?|A) Evet, atıf yapınca her şey serbesttir.~B) Evet, yazarın adını yazmak tüm telifi kaldırır.~C) Hayır, telif hakları korunan bir eserin (izinsiz) çoğaltılması, üzerinde eser sahibinin adına 'atıf yapılsa bile' (intihal olmasa da) suç teşkil eder.~D) Telif diye bir şey yoktur.~E) Atıf yapılmazsa telif kalkar.|C) Hayır, telif hakları korunan bir eserin (izinsiz) çoğaltılması, üzerinde eser sahibinin adına 'atıf yapılsa bile' (intihal olmasa da) suç teşkil eder.|Bir kitabı kaynak göstererek bile olsa fotokopiyle izinsiz basıp satamazsınız (telif suçudur).",
    "u14|Türkiye'de Fikir ve Sanat Eserleri Kanunu'na göre Telif Hakları neleri korur, İntihal kuralları neleri korur?|A) İkisi de her şeyi korur.~B) Telif hakları sadece yazılı olmayan sözleri korur.~C) Telif hakları sadece 'somut eserleri' (kitap, CD vb.) korur; İntihal kavramı ise sadece eserleri değil formülize edilmemiş 'fikirleri' de korur.~D) İntihal sadece parayı korur.~E) Telif hakları fikirleri korur, intihal somut eseri korur.|C) Telif hakları sadece 'somut eserleri' (kitap, CD vb.) korur; İntihal kavramı ise sadece eserleri değil formülize edilmemiş 'fikirleri' de korur.|Hukuk sadece elle tutulur 'eseri' tanır. Ama akademi, sözlü anlatılmış bir fikri (soyut) çalsanız bile bunu intihal sayar.",
    "u14|Telif hakları ihlalinden kaçınmak için ne yapmak gerekir?|A) Sadece dipnot koymak.~B) Eseri çalıp kaynakçada ismini gizlemek.~C) Eser sahibinden eseri kullanmak veya tekrar üretmek için ruhsat / yazılı İZİN ALMAK.~D) Sadece tırnak işareti kullanmak.~E) Metni başka kelimelerle değiştirmek.|C) Eser sahibinden eseri kullanmak veya tekrar üretmek için ruhsat / yazılı İZİN ALMAK.|Telif hakkı ihlalinden kurtulmanın tek yolu mülk sahibinden resmi (yasal) onay veya lisans almaktır.",
    "u14|İntihalden kaçınmak için ne yapmak gerekir?|A) İzin belgesi satın almak.~B) Patent ofisine başvurmak.~C) Telif ücreti ödemek.~D) Uygun bir şekilde kaynağa ATIFTA BULUNMAK (referans vermek).~E) Metnin yarısını silmek.|D) Uygun bir şekilde kaynağa ATIFTA BULUNMAK (referans vermek).|Akademik hırsızlıktan (intihalden) kurtulmanın yolu, bilginin kime ait olduğunu dürüstçe (APA, Harvard vb.) göstermektir.",
    "u14|Kişilerin veya kurumların, anketten elde ettikleri verilerin bazılarını bilerek saklaması veya eksik/aldatıcı raporlama yapması en çok HANGİ durumlarda ortaya çıkar?|A) Hiçbir zaman ortaya çıkmaz.~B) Çoğu araştırmanın ticari endişelerle (kâr elde etme veya reklam/promosyon baskısıyla) gerçekleştiriliyor olmasından kaynaklı olarak ortaya çıkar.~C) Sadece tıp deneylerinde ortaya çıkar.~D) Araştırmacının çok dürüst olduğu durumlarda çıkar.~E) Üniversitelerin fon bulamadığı durumlarda çıkar.|B) Çoğu araştırmanın ticari endişelerle (kâr elde etme veya reklam/promosyon baskısıyla) gerçekleştiriliyor olmasından kaynaklı olarak ortaya çıkar.|Şirket kendi ürününü iyi göstermek için kötü sonuçları gizleyebilir; bu ciddi bir etik problemidir.",
    "u14|Öğrencilerin birbiriyle yarışması, daha iyi not veya unvan alma kaygısıyla başkasının projesini kendisininmiş gibi sunmasına ne ad verilir?|A) Atıf~B) Telif~C) İntihal~D) Creative Commons~E) Literatür|C) İntihal|Statü arzusu, tembellik veya beklentiler insanları bu fikir hırsızlığına sürükler.",
    "u14|Aşağıdakilerden hangisi TÜBA'nın bilim etiği duyurusuna göre BİLİMSEL LİYAKATİ zedeleyen ve kabul edilemez bir davranıştır?|A) Araştırmanın şeffaf yapılması.~B) Akademik ilerleme ve ödül jürilerinde kişileri kayırmak.~C) Deneklerin bilgilendirilmesi.~D) Literatüre atıf yapılması.~E) Hayvanlara acı çektirilmemesi.|B) Akademik ilerleme ve ödül jürilerinde kişileri kayırmak.|Bilim insanı jürilerde liyakat dışında (kayırmacılık vb.) ölçütler kullanamaz, bu etiğe aykırıdır.",
    "u14|Bilinçsiz intihalin en yaygın nedeni aşağıdakilerden hangisidir?|A) Çok fazla para kazanma hırsı.~B) Bilerek ve planlayarak başkasını zarara uğratma niyeti.~C) Araştırmacının (veya öğrencinin) akademik yazım kurallarını ve orijinal metin oluşturma yöntemlerini tam olarak BİLMEMESİ.~D) Profesör unvanına sahip olması.~E) Turnitin programını çok iyi kullanması.|C) Araştırmacının (veya öğrencinin) akademik yazım kurallarını ve orijinal metin oluşturma yöntemlerini tam olarak BİLMEMESİ.|Uygun atıf kurallarını (nasıl tırnak içine alınacağını vb.) bilmeyen acemi öğrenciler genelde bu hataya düşer.",
    "u14|Bir yazarın, bilimsel metodolojiye uymayarak (yanlış test seçimi, örneklem hatası vb. yaparak) ürettiği güvenilmez sonuçlara ulaşmasına yol açan eylemi \"kötü bir niyeti olmasa bile\" ne olarak adlandırılır?|A) Başarı~B) Disiplinsiz veya Özensiz araştırma~C) İntihal~D) Telif İhlali~E) Yaratıcılık|B) Disiplinsiz veya Özensiz araştırma|Bilerek sahtekarlık yapılmasa da, araştırmacının dikkatsiz ve eğitimsiz olması (özensizliği) bilimsel etiğin ihlalidir.",

];

// --- 1. ADIM: AYNI SORULARI BİRLEŞTİRME (KUSURSUZ VE HATASIZ YENİ VERSİYON) ---
let parsedSorularRaw = rawData.map(row => {
    let parts = row.split('|');
    if(parts.length < 5) return null;
    return { c: parts[0].split(','), q: parts[1], o: parts[2].split('~'), a: parts[3], e: parts[4] };
}).filter(x => x !== null);

let uniqueQuestions = [];
parsedSorularRaw.forEach(soru => {
    // Aynı soruyu bulurken tüm boşluk ve noktalamaları sil
    let qStr = soru.q.replace(/[^a-zA-ZğüşöçİĞÜŞÖÇ0-9]/g, '').toLowerCase();
    
    let existing = uniqueQuestions.find(u => {
        let uStr = u.q.replace(/[^a-zA-ZğüşöçİĞÜŞÖÇ0-9]/g, '').toLowerCase();
        return uStr === qStr;
    });

    if (existing) {
        // Eğer soru zaten varsa, sadece YENİ bir sınav etiketi ise diziye ekle
        soru.c.forEach(tag => {
            let t = tag.trim();
            if (!t.toLowerCase().includes("kez çıktı") && !existing.c.includes(t)) {
                existing.c.push(t);
            }
        });
    } else {
        // Soru ilk defa ekleniyorsa eski çöp "kez çıktı" etiketlerini temizle
        soru.c = soru.c.map(t => t.trim()).filter(t => !t.toLowerCase().includes("kez çıktı"));
        uniqueQuestions.push(soru);
    }
});

// Çıkma sayısını listedeki tekrar sayısından DEĞİL, GERÇEK FARKLI SINAV ETİKETİ SAYISINDAN hesapla!
uniqueQuestions.forEach(q => {
    // İçinde "Benzer", "Banko" veya "Kez Çıktı" geçmeyen, sadece gerçek sınav/ünite isimlerini say
    let gercekSinavEtiketleri = q.c.filter(t => !t.toLowerCase().includes("benzer") && !t.toLowerCase().includes("banko") && !t.toLowerCase().includes("kez çıktı"));
    
    // Eğer gerçekten 1'den fazla farklı yerde çıktıysa etiketle
    if (gercekSinavEtiketleri.length > 1) {
        q.c.unshift(`${gercekSinavEtiketleri.length} KEZ ÇIKTI!`);
    }
});

const parsedSorular = uniqueQuestions;

// --- 2. ADIM: ACIMASIZ YAPAY ZEKA METİN BENZERLİK ALGORİTMASI ---
const trKucuk = (str) => {
    if (!str) return "";
    return str.replace(/I/g, 'ı').replace(/İ/g, 'i').toLowerCase();
};

function benzerlikHesapla(metin1, metin2) {
    const copKelimeler = ["aşağıdakilerden", "hangisi", "hangisidir", "nedir", "değildir", "olan", "olmayan", "ile", "ilgili", "hakkında", "olarak", "ifadelerden", "yanlıştır", "doğrudur", "göre", "biri", "biridir", "için", "nasıl", "neden", "yukarıdaki", "verilen", "hangi", "aşağıdaki"];
    
    const kelimeler1 = metin1.replace(/[^a-z0-9ğüşöçıi]/g, ' ').split(/\s+/).filter(k => k.length > 3 && !copKelimeler.includes(k));
    const kelimeler2 = metin2.replace(/[^a-z0-9ğüşöçıi]/g, ' ').split(/\s+/).filter(k => k.length > 3 && !copKelimeler.includes(k));
    
    if (kelimeler1.length === 0 || kelimeler2.length === 0) return 0;
    
    let kesisim = 0;
    const set2 = new Set(kelimeler2);
    
    kelimeler1.forEach(k => {
        if (set2.has(k)) kesisim++;
    });
    
    return (2 * kesisim) / (kelimeler1.length + kelimeler2.length);
}

const isUnite = (tags) => tags.some(t => trKucuk(t).trim().match(/^u\d+/));
const gecmisSorular = parsedSorular.filter(s => !isUnite(s.c));
const uniteSorulari = parsedSorular.filter(s => isUnite(s.c));

uniteSorulari.forEach(uSoru => {
    let uMetin = trKucuk(uSoru.q + " " + uSoru.a);
    let enBenzerSoru = null;
    let enYuksekSkor = 0;

    gecmisSorular.forEach(gSoru => {
        let gMetin = trKucuk(gSoru.q + " " + gSoru.a);
        let skor = benzerlikHesapla(uMetin, gMetin);
        
        if (skor > enYuksekSkor) {
            enYuksekSkor = skor;
            enBenzerSoru = gSoru;
        }
    });

    if (enYuksekSkor >= 0.65 && enBenzerSoru) {
        if(!uSoru.c.includes("🔥 Çıkmış Konu Benzeri")) {
            uSoru.c.push("🔥 Çıkmış Konu Benzeri");
        }
        uSoru.benzerSoruObjesi = enBenzerSoru;
        uSoru.benzerlikSkoru = Math.round(enYuksekSkor * 100); 
    }
});

let allOpen = false;

// --- 3. ADIM: EKRANA ÇİZME VE ARAMA FONKSİYONLARI ---
function ekranaCiz(liste) {
    const cont = document.getElementById('q-container');
    cont.innerHTML = '';
    if(liste.length === 0) { cont.innerHTML = '<h3 style="text-align:center; color:#e74c3c;">Soru bulunamadı.</h3>'; return; }

    liste.forEach((s, i) => {
        let tagsHTML = s.c.map(c => {
            let ct = c.trim().toUpperCase();
            let cls = 'tag';
            if(ct.includes("KEZ ÇIKTI") || ct === "BANKO" || ct === "B") cls += ' tag-h';
            else if(ct.includes("VİZE") || ct.includes("VIZE") || ct.match(/^U\d+/)) cls += ' tag-u';
            else if(ct.includes("BENZERİ") || ct.includes("BENZERI")) cls += ' tag-b';
            else cls += ' tag-e';
            return `<span class="${cls}">${c.trim()}</span>`;
        }).join('');

        let optsHTML = s.o.map(o => `<li>${o}</li>`).join('');
        let displayState = allOpen ? 'block' : 'none';
        let btnText = allOpen ? 'Cevabı Gizle' : 'Cevabı Göster';

        let benzerKutuHtml = '';
        if(s.benzerSoruObjesi) {
            let hangiSinav = s.benzerSoruObjesi.c.filter(t => !t.includes("KEZ ÇIKTI")).join(' | ');
            benzerKutuHtml = `
            <div style="background: #fdf2e9; padding: 15px; border-left: 6px solid #8e44ad; border-radius: 8px; margin-top: 15px; font-size: 0.95em; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <span style="color:#8e44ad; font-size: 1.1em; display:block; margin-bottom: 5px;"><strong>🎯 İŞTE O ÇIKMIŞ SORU (Nokta Atışı Benzerlik: %${s.benzerlikSkoru}) :</strong></span>
                <span style="display:inline-block; background: #8e44ad; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; margin-bottom: 8px;">📌 ${hangiSinav}</span>
                <i style="color: #2c3e50; font-size: 1.05em; display:block; margin-bottom: 8px;">"${s.benzerSoruObjesi.q}"</i>
                <strong style="color: #d35400;">Cevabı Neymiş:</strong> <b style="color:#27ae60;">${s.benzerSoruObjesi.a}</b>
            </div>`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="tags">${tagsHTML}</div>
            <div class="q-text">${i + 1}. ${s.q}</div>
            <ul class="opt">${optsHTML}</ul>
            <button class="ans-btn" onclick="tgl(this)">${btnText}</button>
            <div class="ans-box" style="display: ${displayState}">
                <div class="ans-true">✔️ Doğru Cevap: ${s.a}</div>
                <div class="exp-text">💡 <strong>Açıklama:</strong> ${s.e}</div>
                ${benzerKutuHtml}
            </div>
        `;
        cont.appendChild(card);
    });
}

function filter(tag) {
    let search = tag.trim().toUpperCase();
    let kelime = document.getElementById('arama').value.toLowerCase().trim();
    
    let filtered = (search === 'ALL') ? parsedSorular : parsedSorular.filter(s => s.c.some(c => {
        let dataTag = c.trim().toUpperCase();
        if (search === 'BANKO' || search === 'B') return dataTag.includes('KEZ ÇIKTI');
        if (search === 'VİZE' || search === 'VIZE') return dataTag.includes('VIZE') || dataTag.includes('VİZE');
        if (search === 'FINAL' || search === 'FİNAL') return dataTag.includes('FINAL') || dataTag.includes('FİNAL');
        if (search === 'BÜT' || search === 'BUT') return dataTag.includes('BÜT') || dataTag.includes('BUT');
        if (search === 'ÇIKMIŞ KONU BENZERİ') return dataTag.includes('BENZERİ') || dataTag.includes('BENZERI');
        return dataTag.includes(search);
    }));
    
    if (kelime !== '') {
        filtered = filtered.filter(s => s.q.toLowerCase().includes(kelime) || s.e.toLowerCase().includes(kelime) || s.a.toLowerCase().includes(kelime) || s.o.join(' ').toLowerCase().includes(kelime));
    }
    ekranaCiz(filtered);
}

function aramaYap() {
    let val = document.getElementById('kategori-secici').value;
    filter(val);
}

function tgl(btn) {
    const box = btn.nextElementSibling;
    if (box.style.display === 'block') {
        box.style.display = 'none';
        btn.textContent = 'Cevabı Göster';
    } else {
        box.style.display = 'block';
        btn.textContent = 'Cevabı Gizle';
    }
}

function toggleAll() {
    allOpen = !allOpen;
    const btns = document.querySelectorAll('.ans-btn');
    const boxes = document.querySelectorAll('.ans-box');
    const globalBtn = document.getElementById('globalToggleBtn');
    
    btns.forEach(btn => btn.textContent = allOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
    boxes.forEach(box => box.style.display = allOpen ? 'block' : 'none');
    if(globalBtn) globalBtn.textContent = allOpen ? '👁️ Tüm Cevapları Kapat' : '👁️ Tüm Cevapları Aç';
}

window.onload = () => {
    ekranaCiz(parsedSorular);
};
</script>

<script>
// AUZEF GÖRÜNÜM & CİHAZ PROFİLİ YÖNETİCİSİ
function setAuzefDeviceProfile(dev) {
    if (dev === 'auto') {
        const w = window.innerWidth;
        dev = (w <= 640) ? 'mobile' : 'web';
    }
    document.documentElement.setAttribute('data-device', dev);
    try { localStorage.setItem('auzef_device_profile', dev); } catch(e){}
    const sel = document.getElementById('deviceProfileSelect');
    if (sel && sel.value !== dev && sel.value !== 'auto') sel.value = dev;
}

function toggleAuzefTheme() {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('auzef_theme', cur); } catch(e){}
    const btn = document.getElementById('auzefThemeToggleBtn');
    if (btn) btn.textContent = cur === 'dark' ? '☀️ Açık' : '🌙 Koyu';
}

(function initAuzefViewMode() {
    try {
        const savedDev = localStorage.getItem('auzef_device_profile') || 'auto';
        setAuzefDeviceProfile(savedDev);
        const sel = document.getElementById('deviceProfileSelect');
        if (sel) sel.value = savedDev;

        const savedTheme = localStorage.getItem('auzef_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        const btn = document.getElementById('auzefThemeToggleBtn');
        if (btn) btn.textContent = savedTheme === 'dark' ? '☀️ Açık' : '🌙 Koyu';
    } catch(e){}
})();
</script>
