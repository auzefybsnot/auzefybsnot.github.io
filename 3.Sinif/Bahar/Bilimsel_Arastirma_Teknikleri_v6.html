    "u5|Bilimsel araştırma süreci kantitatif (nicel) araştırmalarda 'doğrusal' bir sıra izlerken, kalitatif (nitel) araştırmalarda nasıl bir yapı izler?|A) Tamamen plansız~B) Yukarıdan aşağıya~C) Araştırma problemini merkeze alan dairesel bir süreç~D) Tek yönlü bir süreç~E) Hiyerarşik bir süreç|C) Araştırma problemini merkeze alan dairesel bir süreç|Kalitatif araştırma süreci doğrusallıktan ziyade, her aşamanın yeni problemlere götürdüğü dairesel bir döngüdür.",
    "u5|Aşağıdakilerden hangisi kalitatif araştırmanın temel özelliklerinden biri değildir?|A) Veriler problemin geçtiği gerçek ve doğal ortamda elde edilir.~B) Araştırmadaki temel araç araştırmacının kendisidir.~C) Veri sayılardan çok sözcüklerden ve resimlerden oluşur (betimseldir).~D) Kuramlar yukarıdan aşağıya (tümdengelim) bir süreç olarak izlenir.~E) Sonuç kadar sürecin kendisi (nasıl olduğu) de önemlidir.|D) Kuramlar yukarıdan aşağıya (tümdengelim) bir süreç olarak izlenir.|Nitel araştırmalarda analiz genellikle tümevarımcı (aşağıdan yukarıya) bir biçimde yapılır. Verilerden yola çıkılarak kurama ulaşılır.",
    "u5|Kalitatif araştırmalarda veri toplama yöntemleri, araştırmaya katılan kişinin araştırma amacını bilip bilmemesine göre ikiye ayrılır. Katılımcıların araştırmanın ne amaçla yapıldığını kısmen bildikleri yöntemlere ne ad verilir?|A) Dolaylı (Gizli) araştırmalar~B) Projektif araştırmalar~C) Gözlemsel araştırmalar~D) Doğrudan (Açık) araştırmalar~E) Tesadüfi araştırmalar|D) Doğrudan (Açık) araştırmalar|Amacın katılımcıya belli edildiği, doğrudan iletişim kurulan (örn: odak grup, mülakat) çalışmalara doğrudan (açık) araştırma denir.",
    "u5|Aşağıdakilerden hangisi katılımcının araştırma koşulları içerisinde bulunduğunu bilmeden (veya amacını anlamadan) bilgi verdiği 'Dolaylı (Gizli)' kalitatif araştırma tekniklerindendir?|A) Odak grup~B) Derinlemesine görüşme~C) Anket~D) Gözlem ve Yansıtıcı (Projektif) Teknikler~E) Telefon mülakatı|D) Gözlem ve Yansıtıcı (Projektif) Teknikler|Gözlemde kişi izlendiğini bilmeyebilir; yansıtıcı tekniklerde ise asıl amacın ne olduğunu (bilinçaltı ölçümünü) fark edemez.",
    "u5|Yapısal olmayan, doğrudan ve yüz yüze yapılan, tek katılımcılı araştırma tekniği aşağıdakilerden hangisidir?|A) Odak grup~B) Derinlemesine Görüşme~C) Gözlem~D) Anket~E) Deney|B) Derinlemesine Görüşme|Tek bir katılımcıyla birebir yüz yüze yapılarak, kişinin inanç, tutum ve duygularını derinlemesine anlamayı hedefleyen tekniktir.",
    "u5|Derinlemesine görüşme türlerinden hangisinde mülakat yapılan kişiye konunun sınırları içinde yanıt verme özgürlüğü verilir, sohbet havasında geçer ve kişi görüşmede olduğunu unutabilir?|A) Standart Açık-Uçlu Görüşme~B) Yarı Yapılandırılmış Görüşme~C) Odaklanmış Bireysel Görüşme~D) Sınırlandırılmamış (Yönlendirilmemiş) Görüşme~E) Yapılandırılmış Görüşme|D) Sınırlandırılmamış (Yönlendirilmemiş) Görüşme|Hiçbir katı formatın olmadığı, sohbet akışına göre şekillenen rahat mülakat türüdür.",
    "u5|Araştırmacıların görüşme öncesinde dikkatli olarak oluşturulmuş açık uçlu soruları hazırladıkları ve sadece bu standart soruları sordukları derinlemesine görüşme türü hangisidir?|A) Sınırlandırılmamış Görüşme~B) Odak Grup~C) Yarı Yapılandırılmış Görüşme~D) Standart Açık-Uçlu Görüşme~E) Yansıtıcı Görüşme|D) Standart Açık-Uçlu Görüşme|Esnekliğin en az olduğu, önceden belirlenen soruların sırasıyla ve dışına çıkılmadan sorulduğu görüşme türüdür.",
    "u5|Derinlemesine görüşmenin uygulama adımlarında, ilk aşama aşağıdakilerden hangisidir?|A) Kılavuzu yazmak~B) Verileri analiz etmek~C) Örneklem stratejisi belirlemek~D) Görüşmeleri yapmak~E) Raporlamak|C) Örneklem stratejisi belirlemek|Derinlemesine görüşme planlanırken ilk iş \"Kimlerle görüşülecek ve onlara nasıl ulaşılacak?\" (Örneklem stratejisi) sorusuna yanıt bulmaktır.",
    "u5|Derinlemesine görüşmelerin genellikle ne kadar sürede gerçekleştirilmesi tavsiye edilir?|A) 5-10 dakika~B) 30 dakika ile 2 saat arasında~C) Tüm gün~D) 3-4 saat~E) 15 dakika|B) 30 dakika ile 2 saat arasında|Görüşülen kişinin sıkılmaması ve aynı dikkatle cevap verebilmesi için sürenin 30 dk ile 2 saat arasında tutulması önerilir.",
    "u5|Belirli bir konu veya kavram hakkında derin bir tartışmada moderatör tarafından rehberlik edilen, genellikle 8 ile 12 arasındaki kişiden oluşan araştırma tekniğine ne ad verilir?|A) Panel~B) Derinlemesine Görüşme~C) Odak Grup (Focus Group)~D) Vaka Analizi~E) Anket Grubu|C) Odak Grup (Focus Group)|İnsanların bir masa etrafında toplanarak moderatör eşliğinde konu hakkında tartışıp etkileşime girdiği tekniktir.",
    "u5|Odak grup görüşmelerinin derinlemesine görüşmeye kıyasla sunduğu en büyük avantaj aşağıdakilerden hangisidir?|A) Katılımcıların daha izole olması~B) Her katılımcı başına düşen maliyetin yüksek olması~C) Katılımcılar arasındaki etkileşimden doğan grup dinamiği ve yeni fikirlerin (sinerjinin) ortaya çıkması~D) Daha uzun sürmesi~E) Yorumlamanın tamamen nesnel olması|C) Katılımcılar arasındaki etkileşimden doğan grup dinamiği ve yeni fikirlerin (sinerjinin) ortaya çıkması|Gruptaki kişilerin birbirinin yorumlarından ilham alarak yepyeni tartışma boyutları açması en büyük artısıdır.",
    "u5|Odak grup çeşitlerinden olan \"Moderatörlü ikili grup\" yönteminin özelliği nedir?|A) Grupta moderatör bulunmaz.~B) İki moderatör vardır ve ikisi de aynı fikri savunur.~C) İki moderatör vardır, fakat tartışılan konularda karşı taraflardadırlar.~D) Moderatörler gruptaki denekler arasından rastgele seçilir.~E) Tartışma sadece internet üzerinden yürütülür.|C) İki moderatör vardır, fakat tartışılan konularda karşı taraflardadırlar.|Konunun zıt yönlerini ateşlemek ve tartışmayı canlandırmak için iki moderatör kasten birbirine muhalif davranır.",
    "u5|Odak grup araştırmalarının zayıf yönlerinden (dezavantajlarından) biri aşağıdakilerden hangisidir?|A) Görüşülen kişilerin verdikleri bilgilerin anlamsız olması.~B) Yorumlamanın oldukça objektif ve matematiksel olması.~C) Genel anakütleyi temsil edememesi ve küçük örnek hacmi nedeniyle genelleme yapılamaması.~D) Görüşmelerin aylar sürmesi.~E) Yeni fikirlerin hiç çıkmaması.|C) Genel anakütleyi temsil edememesi ve küçük örnek hacmi nedeniyle genelleme yapılamaması.|Odak grupları küçük ve genellikle homojen gruplardır, bu yüzden çıkan sonuçlar bütün topluma genellenemez.",
    "u5|Eğer araştırılacak konunun katılımcılar yönünden hassasiyeti yüksekse ve insanlar başkalarının yanında konuşmaktan çekinecekse, hangi yöntemin tercih edilmesi daha uygundur?|A) Odak Grup~B) Derinlemesine Görüşme~C) Deney~D) Çift Yollu Grup~E) Gözlem|B) Derinlemesine Görüşme|Mahremiyet gerektiren veya hassas konularda katılımcılar tek başınayken (derinlemesine görüşmede) daha dürüst ve açık konuşurlar.",
    "u5|Aşağıdakilerden hangisi internet üzerinden gerçekleştirilen Online Odak Gruplarının avantajlarından biri DEĞİLDİR?|A) Coğrafi kısıtlamaların olmaması.~B) Sadece işitsel ve görsel uyaranların test edilebilmesi, ürünlere dokunulamaması.~C) Seyahat veya mekan maliyeti olmadığı için maliyetin düşük olması.~D) Doktor, avukat gibi ulaşılması zor kişilerin evlerinden katılabilmesi.~E) Zaman kısıtlamalarını azaltması.|B) Sadece işitsel ve görsel uyaranların test edilebilmesi, ürünlere dokunulamaması.|Ürünlere dokunulamaması (örn: parfümlerin koklanamaması) online odak gruplarının bir avantajı değil, dezavantajıdır.",
    "u5|Yeni bir olay hakkında uygun kişiler, davranışlar ve durumların izlenerek birincil verilerin elde edilmesine ne ad verilir?|A) Anket~B) Mülakat~C) Gözlem~D) Projeksiyon~E) Deney|C) Gözlem|Gözlem, insanlara soru sormak yerine onların davranışlarını, olay anında doğrudan veya cihazlarla izleyip kaydetme tekniğidir.",
    "u5|Bir konunun gözlem tekniğiyle araştırılmaya uygun olması için aşağıdaki kriterlerden hangisini sağlaması GEREKMEZ?|A) Gözlenecek eylem sadece kısa bir zaman süresini meşgul etmelidir.~B) Veriler his, inanç ve güdü gibi içsel değil, dışarıdan ulaşılabilir ve ortada olmalıdır.~C) Gözlenecek eylem sık sık tekrarlanmalı, yinelenmeli ve önceden bildirilebilir olmalıdır.~D) Araştırmacı deneklerin duygu ve inançlarını doğrudan onlara sormalıdır.~E) Olay gerçekleşirken eşzamanlı izlenebilmelidir.|D) Araştırmacı deneklerin duygu ve inançlarını doğrudan onlara sormalıdır.|Duygu, inanç ve güdüler dışarıdan 'gözlenemez'. Soru sormak anket/mülakatın işidir, gözlemin değil.",
    "u5|Araştırmacının davranış olduğu sırada müdahale etmeden izleyip olanları kaydettiği gözlem yöntemine ne denir?|A) İçerik analizi~B) Mekanik gözlem~C) Kişisel (Doğrudan) gözlem~D) Kalıntı analizi~E) Denetim|C) Kişisel (Doğrudan) gözlem|Gözlemcinin bizzat orada bulunup olaya hiçbir müdahalede bulunmadan kendi duyularıyla not tutmasına kişisel gözlem denir.",
    "u5|Katılımcıların fizyolojik veya göz tepkilerini ölçen \"Göz bebek izleyici, Pupillo ölçer, Psikogalvanometre\" gibi cihazların kullanıldığı gözlem türü hangisidir?|A) Kişisel gözlem~B) Kalıntı analizi~C) İçerik analizi~D) Mekanik gözlem~E) Denetim|D) Mekanik gözlem|İnsan yerine teknolojik cihazların (kameralar, göz takip cihazları vb.) izleme ve kayıt yaptığı türe mekanik gözlem denir.",
    "u5|Fiziksel kayıtları inceleyerek veya stok döküm analizi gerçekleştirerek (örneğin kilerde kaç kutu ürün kaldığını sayarak) yapılan gözlem türüne ne ad verilir?|A) Denetim (Audit)~B) İçerik analizi~C) Kalıntı analizi~D) Gizli gözlem~E) Kurgulanmış gözlem|A) Denetim (Audit)|Özellikle fiziksel ögelerin ve stokların sayımına/envanter kontrolüne dayanan yönteme denetim denir.",
    "u5|İnternet ziyaretçilerinin yaptıkları aramalar veya çerezler (cookies) aracılığıyla bıraktıkları izlerin geçmişe dönük analiz edilmesi hangi gözlem yöntemine girer?|A) Denetim~B) İçerik analizi~C) Kişisel gözlem~D) Kalıntı analizi (Trace analysis)~E) Mekanik gözlem|D) Kalıntı analizi (Trace analysis)|İnsanların geçmişte yaptıkları davranışlardan arda kalan izleri (çöpteki ürün kutuları, web geçmişi vb.) incelemek kalıntı analizidir.",
    "u5|Gözlem yönteminin \"Cevaplayıcılar izlendiklerinin farkında değildirler\" prensibine dayanan sınıflandırması aşağıdakilerden hangisidir?|A) Kurgulanmış gözlem~B) Açık gözlem~C) Yapısal gözlem~D) Doğal gözlem~E) Gizli gözlem|E) Gizli gözlem|Kişilerin davranışlarını değiştirmemesi için tek yönlü ayna veya gizli kameralarla yapılan fark ettirmeden izleme türüdür.",
    "u5|Gözlem yönteminin DEZAVANTAJLARINDAN biri aşağıdakilerden hangisidir?|A) Raporlama (hafıza) hatası barındırmaz.~B) Mevcut davranışın ölçümüdür.~C) Eğer gözlenen eylem kısaysa ankete göre daha ucuzdur.~D) Gözlenen davranışın ardındaki içsel güdüler, inançlar ve tercihler hakkında bilgi vermez (Nedeni tespit edemez).~E) Ortalıktaki verileri doğrudan toplar.|D) Gözlenen davranışın ardındaki içsel güdüler, inançlar ve tercihler hakkında bilgi vermez (Nedeni tespit edemez).|Gözlem kişinin 'ne' yaptığını görür ama 'neden' yaptığını (iç dünyasını) anlayamaz.",
    "u5|Cevaplayıcılara belirsiz, yapısal olmayan bir durum sunarak başkalarının davranışlarını yorumlamalarının istendiği; bu yolla kendi gizli güdü ve inançlarını fark etmeden yansıttıkları tekniklere ne ad verilir?|A) Deney~B) Objektif Teknikler~C) Projektif (Yansıtma) Teknikleri~D) Anketsel Teknikler~E) Kantitatif Analiz|C) Projektif (Yansıtma) Teknikleri|Kişinin doğrudan cevaplamak istemeyeceği hassas konulardaki hislerini, üçüncü şahıslar veya objeler üzerinden ortaya çıkaran tekniklerdir.",
    "u5|Cevaplayıcılara tamamlanmak üzere boşluk bırakılmış bir ifade verilerek akıllarına ilk gelen cümleyle tamamlamalarının istendiği projektif teknik türü hangisidir?|A) Resimler ve kelimeler~B) Cümle Tamamlama~C) Kelime Çağrışımı~D) Yorumlama~E) Seçme düzeni|B) Cümle Tamamlama|Kişiye yarım bir cümle verilir (Örn: 'Bana göre bankalar...') ve boşluğu anında doldurması istenir.",
    "u5|Bir seri kelimenin deneğe yüksek sesle okunarak, aklına ilk gelen kelimeyi yazmasının veya söylemesinin istendiği projektif çağrışım tekniği nedir?|A) Kelime Çağrışımı~B) Anlamlı teknikler~C) Benzerlikler~D) Rol oynama~E) Üçüncü kişi tekniği|A) Kelime Çağrışımı|Belirli bir uyaran kelimeye karşı zihnin filtresiz verdiği ilk yanıt (çağrışım) kişinin bilinçaltı tutumunu gösterir.",
    "u5|Deneğe doğrudan ne düşündüğü sorulmak yerine \"Sizce bir komşunuz bu ürünü neden alır?\" şeklinde sorularak cevabın alındığı projektif teknik hangisidir?|A) Benzerlikler~B) Cümle tamamlama~C) Anlamlı Teknikler (Üçüncü Kişi Tekniği)~D) Seçme düzeni~E) Resim yorumlama|C) Anlamlı Teknikler (Üçüncü Kişi Tekniği)|Kişi onaylanmama korkusu duymadan, kendi hislerini \"üçüncü bir kişinin\" (komşunun vb.) davranışıymış gibi rahatça açıklar.",
    "u5|\"Yeni bir BMW olsaydınız ne hissedebileceğinizi hayal ediniz\" şeklindeki bir soruyla, kişinin kişiliği ile potansiyel satın alma objesi arasındaki ilişkinin ortaya çıkarıldığı projektif teknik hangisidir?|A) Cümle tamamlama~B) Kelime çağrışımı~C) Kişisel Benzerlikler~D) Seçme düzeni~E) Üçüncü kişi tekniği|C) Kişisel Benzerlikler|Cansız bir nesneyle kişi arasında duygusal bir benzerlik/bağlantı kurarak iç dünyayı deşifre etme tekniğidir.",
    "u5|Aşağıdakilerden hangisi Projektif (Yansıtma) Tekniklerinin dezavantajlarından biridir?|A) Bilinçaltında tutulan güçlü güdüleri açığa çıkarabilmesi.~B) Buzları kırmak için kullanışlı olması.~C) Anketlerde verilmeyen karşılıkları açığa çıkarması.~D) Yüksek yetenekli personel gerektirmesi ve araştırmacının yorumlama sapması riskinin (sübjektivite) çok büyük olması.~E) Duygusal konularda faydalı olması.|D) Yüksek yetenekli personel gerektirmesi ve araştırmacının yorumlama sapması riskinin (sübjektivite) çok büyük olması.|Psikolojik analizlere dayandığı için sıradan bir anketör bu verileri yorumlayamaz, uzman psikologlar/moderatörler gerekir.",
    "u5|Tablo 5.5'e göre, bilinçaltı bilginin açığa çıkması (Subconscious info) konusunda 'En Yüksek' başarıyı sağlayan kalitatif veri toplama tekniği hangisidir?|A) Gözlem~B) Odak Grup~C) Derinlemesine Görüşme~D) Anket~E) Yansıtma (Projektif) Tekniği|E) Yansıtma (Projektif) Tekniği|Karşılaştırma tablosuna göre, bilinçaltı bilgiyi açığa çıkarmada Yansıtma Teknikleri en yüksek (Yüksek) dereceye sahiptir.",
    "u5|Tablo 5.5'e göre, 'İnovatif (yenilikçi) bilginin keşfedilmesi' konusunda 'Yüksek' başarı gösteren iki kalitatif teknik hangileridir?|A) Gözlem ve Yansıtma~B) Odak Grup ve Gözlem~C) Yansıtma ve Derinlemesine Görüşme~D) Anket ve Gözlem~E) Deney ve Odak Grup|B) Odak Grup ve Gözlem|Tabloya göre İnovatif bilginin keşfedilmesinde Odak Grup ve Gözlem yöntemleri 'Yüksek' puanlanmıştır.",
"u6|\"Başarılı bir araştırma yapmak için her şeyi bilmenize gerek yoktur, sadece bilinmeyen bir şeyi bilmeniz yeterlidir.\" sözü kime aittir?|A) Albert Einstein~B) Arthur L. Schawlow~C) Francis Bacon~D) İbni Haldun~E) Karl Popper|B) Arthur L. Schawlow|Ünite 6'nın girişindeki bu özlü söz Arthur L. Schawlow'a aittir.",
    "u6|Sayısal hale dönüştürülmüş değişkenlerin incelenmesine, ilişkilerin ve neden-sonuçların ortaya konmasına dayanan, istatistiksel sonuçlar çıkarılmasına imkan veren araştırmalara ne ad verilir?|A) Nitel araştırma~B) Kalitatif araştırma~C) Kantitatif (Nicel) araştırma~D) Olgubilimsel araştırma~E) Gözlemsel araştırma|C) Kantitatif (Nicel) araştırma|Sayısal verilere, önceden belirlenmiş şıklara ve istatistiksel genellemelere dayanan araştırmalar kantitatif (nicel) araştırmalardır.",
    "u6|Aşağıdakilerden hangisi Kantitatif Araştırmanın bir özelliği DEĞİLDİR?|A) Cevap seçenekleri önceden bellidir (yapılandırılmıştır).~B) Çok sayıda deneğe (büyük örneklem) uygulanır.~C) Veri formatı ve veri kaynakları açıktır.~D) Araştırma amacı baştan çok kesindir.~E) Değişkenler karmaşık ve sınırları belirsizdir.|E) Değişkenler karmaşık ve sınırları belirsizdir.|Değişkenlerin karmaşık ve belirsiz olduğu durumlar nitel (kalitatif) araştırmalara aittir. Nicel araştırmada değişken sınırları çok nettir.",
    "u6|Kantitatif araştırmalar daha çok hangi tasarım türünün bir parçasıdır?|A) Sadece keşfedici tasarım~B) Hipotez testi tasarımı~C) Serbest gözlem tasarımı~D) Örtülü mülakat tasarımı~E) Felsefi tasarım|B) Hipotez testi tasarımı|Kantitatif tasarımlar önceden belirlenmiş teorilerin/hipotezlerin istatistiksel olarak test edildiği yapılardır.",
    "u6|Sosyal bilimlerde kullanılan kantitatif (nicel) araştırma tasarımının özelliklerinden biri aşağıdakilerden hangisidir?|A) Araştırmaya tümevarımcı bir anlayış hakimdir.~B) Dış değişkenlerin kontrolü önemsizdir.~C) Araştırmacının katılımcılarla kişisel etkileşimi çok yüksektir.~D) Hipotezler araştırmanın başında açıkça ifade edilir.~E) Karmaşık olgular bütüncül olarak incelenir, parçalara ayrılmaz.|D) Hipotezler araştırmanın başında açıkça ifade edilir.|Nicel araştırmalarda tümdengelim kullanılır, dış değişkenler sıkı kontrol edilir, etkileşim sınırlıdır ve hipotezler baştan konur.",
    "u6|Aşağıdakilerden hangisi kantitatif metotların beş önemli avantajından (üstünlüklerinden) biri DEĞİLDİR?|A) Standartlaştırma sağlaması~B) Yönetim kolaylığı sunması~C) Tablolaştırma ve istatistiksel analizlere uygunluğu~D) Küçük örneklemlerle çok ucuza derinlemesine analiz yapabilmesi~E) Alt grup farklılıklarına duyarlı olması|D) Küçük örneklemlerle çok ucuza derinlemesine analiz yapabilmesi|Küçük örneklemlerle derinlemesine (uzun uzun) bilgi toplamak Nitel (Kalitatif) metotların özelliğidir.",
    "u6|Kantitatif metotların avantajlarından biri olan \"Gizlilerle Bağlantı Kurmadaki Yetenek\" neyi ifade eder?|A) Deneklerin isimlerini gizlemeyi~B) Sadece devlet sırlarını araştırmayı~C) Doğrudan gözlemlenemeyen (gelir, hane halkı sayısı, okul seçimindeki kişisel nedenler gibi) verilerin direkt sorularla kolayca elde edilmesini~D) Görüşmecinin kimliğini gizlemesini~E) Soruların görünmez mürekkeple yazılmasını|C) Doğrudan gözlemlenemeyen (gelir, hane halkı sayısı, okul seçimindeki kişisel nedenler gibi) verilerin direkt sorularla kolayca elde edilmesini|Gözlemle bulunamayacak gizli demografik/kişisel veriler anket sorularıyla rahatça ortaya çıkarılır.",
    "u6|İyi tasarlanmış bir nicel (kantitatif) araştırmada, iki veya daha fazla bağımsız değişkenin (ya da diğer değişkenlerin) etkilerinin birbirinden ayrılmasına ve sonuçların açıkça yorumlanmasına olanak sağlayan özellik hangisidir?|A) Karışıklıktan arınmış olma~B) Dış değişkenlerden etkilenme~C) Objektiflik~D) Güvenirlik~E) Sübjektivite|A) Karışıklıktan arınmış olma|Araştırma tasarımında hangi değişkenin neye sebep olduğunun birbirine girmeden net ayrılabilmesi 'karışıklıktan arınmış olma' özelliğidir.",
    "u6|Nicel araştırmalarda veri sayısı niteliğinde olduğu için çözümleme istatistikî işlemleri gerektirir. Hipotezlerin güvenli sınanabilmesi için araştırmada sahip olunması gereken temel özellik nedir?|A) Görsellik~B) Hipotezlerin sınanmasında istatistikî kesinlik~C) Dışa dönüklük~D) Tamamen varsayıma dayanma~E) Yoruma açıklık|B) Hipotezlerin sınanmasında istatistikî kesinlik|Verilerin yeterliliği ve analizlerin doğruluğu, istatistiksel kesinliği sağlayarak hipotezlerin doğru test edilmesini garanti eder.",
    "u6|Nicel araştırmalarda kalite tartışması söz konusu olduğunda genellikle HANGİ KAVRAM, geçerlilikten daha çok vurgulanır?|A) Orijinallik~B) Yenilikçilik~C) Geçerlik (Validity)~D) Güvenirlik (Reliability / Tekrarlanabilirlik)~E) Sübjektivite|D) Güvenirlik (Reliability / Tekrarlanabilirlik)|Nicel (sayısal) testlerde aynı işlemin tekrarlandığında aynı sonucu vermesi (güvenirlik/tutarlılık) kalite için temel şart sayılır.",
    "u6|İşletme araştırmalarında en çok (en yaygın) kullanılan kantitatif (nicel) veri toplama yöntemi aşağıdakilerden hangisidir?|A) Deney~B) Gözlem~C) Odak Grup~D) Anket~E) İkincil veri taraması|D) Anket|Kişilerin görüşlerine/algılarına yönelik geniş verileri toplamada en ekonomik ve en çok tercih edilen nicel yöntem ankettir.",
    "u6|Bilgilerin araştırma konusu olan anakütleden seçilen örneğe dâhil kişilere yazılı veya sözlü soru sormak yoluyla sağlanmasına ne ad verilir?|A) Gözlem yöntemi~B) Deney yöntemi~C) Anket yöntemi~D) Kalıntı analizi~E) İçerik analizi|C) Anket yöntemi|Anketin amacı; davranışları, demografik özellikleri ve fikirleri doğrudan soru yönelterek ölçmektir.",
    "u6|Aşağıdakilerden hangisi işletme araştırmalarında uygulanan dört farklı anket yönteminden biri DEĞİLDİR?|A) Yüz-yüze anket~B) Posta anketi~C) Odak grup anketi~D) Telefonla anket~E) İnternet anketi|C) Odak grup anketi|Odak grup bir nicel anket türü değil, derinlemesine serbest bir kalitatif (nitel) mülakat yöntemidir.",
    "u6|Anket yöntemleri arasında okuma-yazma oranının çok düşük olduğu yerlerde veya karışık soruların anlaşılmasının zor olduğu durumlarda uygulanabilecek EN İYİ yöntem hangisidir?|A) İnternet anketi~B) Posta anketi~C) Telefon anketi~D) Yüz-yüze anket (Kişisel görüşme)~E) Faks anketi|D) Yüz-yüze anket (Kişisel görüşme)|Görüşmeci bizzat yanında olduğu için okuma bilmeyenlere soruları okuyabilir ve anlaşılmayan yerleri açıklayabilir.",
    "u6|Aşağıdakilerden hangisi Yüz-Yüze (Kişisel) anket yönteminin üstünlüklerinden biri DEĞİLDİR?|A) Reddedilme (yanıtlamama) oranının çok yüksek olması~B) Dış etkenlerden en az şekilde etkilenmesi~C) İçten bir hava yaratılarak özel/politik sorulara doğru cevap alınabilmesi~D) Yanlış anlaşılan soruların anında düzeltilebilmesi~E) Okuma-yazma bilmeyenlere de uygulanabilmesi|A) Reddedilme (yanıtlamama) oranının çok yüksek olması|Tam tersine; yüz yüze bir insanın karşısında anketi geri çevirmek (reddetmek) psikolojik olarak daha zordur, bu yüzden yanıt oranı çok 'yüksektir'.",
    "u6|Yüz-yüze anketin en büyük dezavantajı olarak kabul edilen, cevaplayıcının bazı sorulara bilgili/prestijli görünme arzusuyla yanlış (sosyal beğenirlik) cevap vermesine neden olan faktör hangisidir?|A) Yüksek maliyet~B) Sürenin uzun olması~C) Anketörün (görüşmecinin) bizzat orada bulunması~D) Soruların kısalığı~E) Kâğıdın kalitesi|C) Anketörün (görüşmecinin) bizzat orada bulunması|Anketörün varlığı kişiyi baskı altına alabilir; kişi ayıp olmasın veya havalı görünsün diye yalan söyleyebilir.",
    "u6|Maliyetlerin aşağı çekilmesinde çok etkin bir araç olan, anketörün yönlendirme etkisinin yüz yüze ankete göre daha az olduğu fakat uzun ve karmaşık (görselli) ölçeklerin KULLANILAMADIĞI anket türü hangisidir?|A) Telefonla anket~B) Posta anketi~C) İnternet anketi~D) Yüz-yüze anket~E) Deney|A) Telefonla anket|Telefonda resim/görsel gösterilemez ve insanlar telefonda uzun süre tutulamaz (kısa ve görsel olmayan sorular sorulmalıdır).",
    "u6|Anketörün bilinçli veya bilinçsiz bir şekilde cevaplayıcıyı kendi istediği sonuca doğru yönlendirecek ifadeler veya ses tonu kullanmasına ne ad verilir?|A) Denek hatası~B) Örnekleme hatası~C) Sistematik hata~D) Anketör sapması~E) Kapsam hatası|D) Anketör sapması|Anketörün (görüşmecinin) kendi düşüncelerini, beden dilini veya yorumlarını ankete yansıtarak katılımcıyı yönlendirmesidir.",
    "u6|Anketör (görüşmeci) kullanılmadığı için 'anketör sapmasından' tamamen bağımsız olan, kişinin sorular üzerinde istediği kadar düşünebildiği ancak CEVAPLAMA ORANININ ÇOK DÜŞÜK olduğu anket türü hangisidir?|A) Yüz-yüze anket~B) Telefon anketi~C) Posta ile anket~D) Odak grup~E) Mülakat|C) Posta ile anket|Posta anketinde kişi yalnızdır (anketör sapması yoktur) ancak formu çöpe atma veya geri yollamama (düşük yanıt oranı) ihtimali çok yüksektir.",
    "u6|Araştırmacı posta anketlerinde düşük olan 'yanıt oranını' artırmak için hangi yönteme BAŞVURMAMALIDIR?|A) Ön yazı ekleyerek kibarca yardım istemek~B) İçine pul yapıştırılmış/ücreti ödenmiş bir geri dönüş zarfı koymak~C) Küçük bir para ödemesi veya armağan sözü vermek~D) Soruları çok karmaşık ve uzun tutmak~E) Ad soyadın gizli (anonim) kalacağını belirtmek|D) Soruları çok karmaşık ve uzun tutmak|Sorular karmaşık ve çok uzun olursa katılımcı sıkılıp anketi yarıda bırakır veya formu direkt çöpe atar.",
    "u6|Hızlı, ucuz, geniş coğrafyalara anında ulaşabilen ve toplanan veriyi otomatik olarak veri tabanı haline getiren (elle girişe gerek kalmayan) anket yöntemi hangisidir?|A) Posta anketi~B) Yüz-yüze anket~C) İnternet anketi~D) Telefon anketi~E) Gözlem|C) İnternet anketi|İnternet/Web anketleri veriyi anında elektronik ortama kaydeder, dünyanın öbür ucuna saniyeler içinde sıfır maliyetle yollanır.",
    "u6|İnternet anketlerinin dezavantajlarından (sınırlamalarından) biri aşağıdakilerden hangisidir?|A) Hızının çok yavaş olması.~B) Verilerin elle manuel girilmek zorunda olması.~C) Sadece eğitim ve gelir grubu yüksek (interneti olan) bir hedef kitleye ulaşılabilmesi ve kimlik/doğruluk kontrolünün zor olması.~D) Maliyetinin diğer tüm anketlerden yüksek olması.~E) Sadece dar bir mahallede yapılabilmesi.|C) Sadece eğitim ve gelir grubu yüksek (interneti olan) bir hedef kitleye ulaşılabilmesi ve kimlik/doğruluk kontrolünün zor olması.|İnterneti, bilgisayarı/telefonu olmayan veya teknolojiyi kullanamayan geniş halk kitleleri bu anketin dışında kalır.",
    "u6|Anket yöntemlerini değerlendirme kriterlerinden olan \"Sosyal açıdan beğenilebilirlik\" neyi ifade eder?|A) Ankete çok sayıda katılımcı bulunmasını.~B) Cevaplayıcıların doğru olsun ya da olmasın sosyal açıdan 'kabul edilebilir/popüler/iyi' cevaplar vermeye çalışmasını.~C) Anketörün dış görünüşünün iyi olmasını.~D) Anketin maliyetinin düşük olmasını.~E) İnternet üzerinden çok fazla beğeni (like) almasını.|B) Cevaplayıcıların doğru olsun ya da olmasın sosyal açıdan 'kabul edilebilir/popüler/iyi' cevaplar vermeye çalışmasını.|Örneğin kişinin aslında kitap okumadığı halde ankette \"her gün okuyorum\" diyerek kendini topluma/görüşmeciye iyi göstermeye çalışmasıdır.",
    "u6|Tablo 6.1 Anket Yöntemlerinin Karşılaştırmasına göre, HIZ açısından 'Çok Yüksek' ve MALİYET açısından 'Düşük' olarak değerlendirilen anket yöntemi hangisidir?|A) Yüz yüze~B) Telefon~C) Posta~D) İnternet~E) Odak grup|D) İnternet|İnternet anketi hızda rakipsizdir (çok yüksek) ve basım/kargo/anketör ücreti olmadığı için maliyette çok düşüktür.",
    "u6|Tablo 6.1'e göre \"Veri Miktarı\" (sorulabilecek soru kapasitesi) bakımından en zayıf ('Düşük') olan anket türü hangisidir?|A) Yüz yüze~B) Posta~C) İnternet~D) Telefon~E) Tablet|D) Telefon|Telefonda insanları uzun süre tutmak imkânsıza yakındır, bu yüzden sorulacak soru (veri miktarı) çok sınırlıdır.",
    "u6|Ankette karşılaşılan sapmalar üç ana kaynağa atfedilir. Soruların dili, 'Ne düşünüyorsunuz?' yerine 'İnsanlar düşünüyor ki...' şeklinde (üçüncü şahıslara) dönüştürülerek HANGİ KAYNAKTAN gelen sapma/nezaket engeli azaltılmaya çalışılır?|A) Anketörden gelen sapma~B) Yanıt vericiden (Cevaplayıcıdan) gelen sapma~C) Araştırma konusundan gelen sapma~D) İstatistik programından gelen sapma~E) Kodlamadan gelen sapma|B) Yanıt vericiden (Cevaplayıcıdan) gelen sapma|Yanıtlayıcı kendi adına kötü bir şey söylemekten çekinir, suçu \"diğer insanlara\" atarak daha dürüst yanıt verir.",
    "u6|Aşağıdakilerden hangisi bir 'deneysel tasarım'ın tanımıdır?|A) Geçmişte yaşanmış olayların sadece gazetelerden okunmasıdır.~B) Hiçbir dış müdahale olmadan kalabalıkları izlemektir.~C) Dış değişkenlerin etkilerini kontrol ederek alternatif hareket seçeneklerinin (bağımsız değişkenin) sonuçlarını belli bir bağımlı değişken üzerinde ölçmek amacıyla geliştirilen tasarımlardır.~D) Sadece anket formlarının toplanmasıdır.~E) Felsefi çıkarımlar yapmaktır.|C) Dış değişkenlerin etkilerini kontrol ederek alternatif hareket seçeneklerinin (bağımsız değişkenin) sonuçlarını belli bir bağımlı değişken üzerinde ölçmek amacıyla geliştirilen tasarımlardır.|Deney; manipülasyon (neden), kontrol ve ölçüm (sonuç) adımlarını içeren kontrollü bir yapıdır.",
    "u6|Araştırma yöntemlerinde bilimsel 'nedensellik (X, Y'ye neden olur)' şartlarından biri aşağıdakilerden hangisi DEĞİLDİR?|A) X ve Y'deki değişmeler arasında bir ilgi (birlikte değişim) olmalı.~B) X'deki değişme (sebep), Y'deki değişmeden (sonuçtan) zaman içinde DAHA ÖNCE meydana gelmeli.~C) Y'ye etki etmesi olası diğer faktörlerin tümü serimden elimine (kontrol) edilmeli.~D) X'in Y'ye etki ettiğini saptayan ilgili bir TEORİ bulunmalıdır.~E) X her zaman her koşulda Y'nin 'TEK' sebebi olduğunu mutlak şekilde ispatlamalıdır.|E) X her zaman her koşulda Y'nin 'TEK' sebebi olduğunu mutlak şekilde ispatlamalıdır.|Bilimsel nedensellikte X, Y'yi etkileyen tek sebep olmak zorunda değildir; sadece etkileyen nedenlerden 'biri' olabilir ve mutlak değil ihtimal dahilinde ispatlanır.",
    "u6|Araştırmacının bağımsız değişken üzerinde HİÇBİR DEĞİŞİKLİK/MANİPÜLASYON yapmadığı, sadece var olan durumu ölçtüğü (örneğin deprem sonrası insanları incelediği) deney türüne ne ad verilir?|A) Kontrollü deney~B) Doğal (Tabii) deney~C) Laboratuvar deneyi~D) Faktöriyel deney~E) Latin kare deneyi|B) Doğal (Tabii) deney|Araştırmacı olaya (nedene) müdahale edemez, olayı doğa veya toplum gerçekleştirir; araştırmacı sadece sonucu (Y'yi) ölçer.",
    "u6|Deneysel uyarıcının UYGULANDIĞI, yani yeni ilacın veya yeni reklamın test edildiği denek grubuna ne ad verilir?|A) Kontrol grubu~B) Statik grup~C) Deney (Test) grubu~D) Çevresel grup~E) Referans grubu|C) Deney (Test) grubu|Manipülasyona (bağımsız değişkene/X'e) maruz kalan, üzerinde işlem yapılan grup deney grubudur.",
    "u6|Deneysel uyarıcının UYGULANMADIĞI, diğer yönlerden deney grubuna benzeyen ve sadece karşılaştırma (kıyas) amacıyla kullanılan gruba ne ad verilir?|A) Hedef kitle~B) Pilot grup~C) Deney grubu~D) Kontrol grubu~E) Tasarım grubu|D) Kontrol grubu|Eğer ilacı alanlar iyileşmişse, bunun gerçekten ilaçtan mı yoksa zamanla mı olduğunu anlamak için hiç ilaç verilmeyen 'kontrol grubuyla' kıyaslanır.",
    "u6|Cevaplayıcının verdiği cevapları etkileyen, bağımlı değişken üzerinde etkili olabilen ANCAK araştırmacının test ettiği bağımsız değişken (X) ÖZELLİĞİ TAŞIMAYAN (yani istenmeyen/bozucu) değişkenlere ne denir?|A) Bağımlı değişken~B) Temel değişken~C) Dışsal değişken~D) Sabit değişken~E) Oransal değişken|C) Dışsal değişken|Örneğin yeni ders çalışma yönteminin (X) sınav notuna (Y) etkisini ölçerken, öğrencinin zekası veya uykusuzluğu 'dışsal değişken'dir ve kontrol edilmelidir.",
    "u6|Cevaplayıcıların deneye tabi olduklarının BİLİNCİNDE OLDUĞU, araştırmacının X dışındaki tüm değişkenleri izole edip yüksek kontrol sağladığı (ancak gerçekçiliğin düşük olduğu) yapay deney türü hangisidir?|A) Saha deneyi~B) Doğal deney~C) Laboratuvar deneyi~D) Tarihsel deney~E) Anket deneyi|C) Laboratuvar deneyi|Her şey kontrol altındadır ama ortam yapay olduğu için insanlar günlük hayattaki gibi doğal davranmayabilir.",
    "u6|Cevaplayıcıların araştırmaya tabi olduklarının FARKINDA OLMADIĞI, laboratuvar dışında günlük hayatın akışı içinde (gerçek alışveriş ortamı vb.) yapılan deney türü hangisidir?|A) Saha deneyi~B) Laboratuvar deneyi~C) Simülasyon deneyi~D) İkincil deney~E) Yapay deney|A) Saha deneyi|Süpermarkette bir ürünün yerini gizlice değiştirip müşterilerin alım tepkilerini ölçmek bir saha deneyidir (gerçekçilik çok yüksektir).",
    "u6|Deneysel tasarım sembolleri (notasyonları) arasında, deneklerin deney ve kontrol gruplarına TESADÜFİ (Rassal) olarak atandığını / seçildiğini gösteren harf hangisidir?|A) O~B) X~C) E~D) R~E) CG|D) R|R harfi, İngilizce Randomization (Rassallaştırma) kelimesinden gelir ve tarafsız dağılımı ifade eder.",
    "u6|Deneysel tasarım notasyonlarında X ve O sembolleri neyi ifade eder?|A) X: Kontrol Grubu, O: Deney Grubu~B) X: Bağımsız değişken (manipülasyon), O: Test edilecek bağımlı değişkenin gözlemlenmesi (ölçüm)~C) X: Rassallık, O: Hata~D) X: Zaman serisi, O: Laboratuvar~E) X: Olay, O: Dışsal değişken|B) X: Bağımsız değişken (manipülasyon), O: Test edilecek bağımlı değişkenin gözlemlenmesi (ölçüm)|X araştırmacının yaptığı hamleyi (örneğin yeni reklamı yayına almayı), O ise o hamleden sonraki sonucu (örneğin satış rakamını okumayı) gösterir.",
    "u6|Kontrol grubunun OLMADIĞI, deneklerin tesadüfi seçilmediği ve sadece \"O1 X O2\" şeklinde simgelenen; örneğin reklam kampanyası öncesi (O1) ve kampanya sonrası (O2) ölçüm yapılan basit zayıf tasarım türü hangisidir?|A) Test Öncesi ve Test Sonrası Ölçüme Dayalı Tek Gruplu Tasarım~B) Statik Grup Tasarımı~C) Solomon Dört Gruplu Tasarım~D) Faktöriyel Tasarım~E) Latin Kare Tasarımı|A) Test Öncesi ve Test Sonrası Ölçüme Dayalı Tek Gruplu Tasarım|Sadece bir grup vardır. Dış faktörlerin engellenemediği (kontrol grubu olmayan) zayıf bir tasarımdır.",
    "u6|Deneklerin TESADÜFİ (R) olarak deney ve kontrol gruplarına atandığı; her iki grupta da X'den önce (Ön Test) ve X'den sonra (Son Test) ölçümlerin yapıldığı GÜÇLÜ deneysel tasarım türü hangisidir? (EG: R O1 X O2 / CG: R O3 O4)|A) Statik Grup Tasarımı~B) Zaman Serileri Tasarımı~C) Test Öncesi ve Test Sonrası Kontrol Gruplu Deneysel Tasarım~D) Tek Ölçüme Dayanan Tasarım~E) Doğal Deney|C) Test Öncesi ve Test Sonrası Kontrol Gruplu Deneysel Tasarım|En klasik ve en güvenilir kontrollü bilimsel deney modellerinden biridir.",
    "u6|Hem \"Test öncesi-test sonrası kontrol gruplu\" modeli, hem de \"Test sonrası kontrol gruplu\" modeli birleştirerek tam 4 farklı grubun (2 Deney, 2 Kontrol) oluşturulduğu; geçersizlik etkilerini minimize eden ANCAK çok pahalı ve zaman alıcı olan kompleks tasarım hangisidir?|A) Solomon Dört Gruplu Deneysel Tasarım~B) Zaman Serileri Tasarımı~C) Faktöriyel Model~D) Latin Kare~E) Statik Grup|A) Solomon Dört Gruplu Deneysel Tasarım|Dört gruba ayrılan bu sistem, ön-testin denekler üzerinde yaratacağı öğrenme/uyarma etkisini bile ölçüp izole eden en kusursuz (ama en pahalı) sistemdir.",
    "u6|Cevaplayıcıların verdikleri cevaplarda, deneysel araştırmadan beklenen sonucu tahmin ederek, \"araştırmacıyı memnun edecek\" veya \"onun beklediği cevabı\" vermeye çalışmaları eğilimine ne ad verilir? (Yapay deneylerde ciddi sorundur)|A) Dışsal Geçerlik~B) Örneklem Hatası~C) Tepkisel Hata~D) İstek Hatası (Demand Characteristic)~E) Mekanik Hata|D) İstek Hatası (Demand Characteristic)|Denek \"Acaba benden ne duymak istiyorlar?\" psikolojisiyle gerçek tepkisini gizler ve araştırmacının istediği rolü oynar.",
"u7|\"Araştırma sahaya girdiğinde, yargı sahadan çıkmaz.\" sözü kime aittir?|A) Albert Einstein~B) Arthur L. Schawlow~C) Dick Kampe~D) Francis Bacon~E) Immanuel Kant|C) Dick Kampe|Ünite 7'nin girişinde yer alan bu özlü söz Dick Kampe'ye aittir.",
    "u7|Yunanca 'gözlem' anlamına gelen 'statizein' sözcüğünden, İtalyanca 'devlet adamı' anlamına gelen 'statista' sözcüğünden ve Latince 'durum' anlamına gelen 'status' sözcüğünden türetildiği düşünülen ve başlangıçta devlet yönetimi için bir gözlem aracı olarak kullanılan bilim dalı hangisidir?|A) Ekonometri~B) İstatistik~C) Felsefe~D) Mantık~E) Metodoloji|B) İstatistik|Metinde İstatistik kelimesinin etimolojik kökenleri statizein, statista ve status olarak açıklanmıştır.",
    "u7|Çoğul kullanıldığında sistemli toplanan sayısal bilgileri; tekil kullanıldığında ise veri toplama, tablo/grafikle özetleme, güven derecesini açıklama ve örneklemden genelleme yapma ilkelerini kapsayan bilim dalı hangisidir?|A) Veri Analizi~B) Olasılık~C) Yöneylem Araştırması~D) İstatistik~E) Parametre|D) İstatistik|İstatistik, verilerin toplanması, analiz edilmesi ve sonuçların genellenmesi (çıkarım) bilimidir.",
    "u7|Bir anakütleye ait elde edilebilecek olan her türlü özelliğe (oran, ortalama, standart sapma, varyans gibi), genellikle bilinmeyen ve tahmin edilmeye çalışılan değere ne ad verilir?|A) Parametre~B) Değişken~C) Örneklem~D) Kitle~E) İstatistik|A) Parametre|Anakütlenin gerçek ölçülerine parametre denir. Örneklemin verilerine ise istatistik adı verilir; istatistik kullanılarak parametre tahmin edilir.",
    "u7|Herhangi bir gözlem ya da inceleme kapsamına giren nesne veya bireylerin oluşturduğu 'bütüne' ne ad verilir?|A) Örneklem~B) Evren (Ana kütle / Yığın)~C) Gözlem birimi~D) Örnek~E) Parametre|B) Evren (Ana kütle / Yığın)|Araştırmanın sonuçlarının geçerli olacağı, tüm elemanların yer aldığı büyük bütüne anakütle veya evren denir.",
    "u7|Bir araştırmada bilgilerin, anakütlenin 'tüm birimlerine tek tek başvurularak' eksiksiz elde edilmesi (N=n durumu) işlemine ne ad verilir?|A) Örnekleme~B) Tam sayım~C) Kısmi sayım~D) Rassal seçim~E) Kura yöntemi|B) Tam sayım|Anakütledeki her bir elemanın istisnasız ölçülmesine (Örn: Genel Nüfus Sayımı) Tam Sayım denir.",
    "u7|Araştırma anakütlesi içerisinden amaca uygun herhangi bir yöntemle seçilen ve anakütleyi 'temsil etme yeteneğine sahip' daha az sayıdaki birimler veya elemanlar kümesine ne ad verilir?|A) Popülasyon~B) Yığın~C) Örneklem (Örnek)~D) Parametre~E) Katman|C) Örneklem (Örnek)|Tamsayımın yapılamadığı durumlarda bütünü temsil etmek üzere seçilen küçük gruba örneklem denir.",
    "u7|Aşağıdakilerden hangisi tam sayım yerine 'örnekleme' tercih edilmesinin nedenlerinden (avantajlarından) biri DEĞİLDİR?|A) Zamandan büyük oranda tasarruf sağlaması~B) Daha ucuz (maliyetinin az) olması~C) Temsil yeteneğinin her zaman %100 kusursuz ve hatasız olması~D) Çalışanların performans düşüklüğünü engelleyip daha detaylı/dikkatli inceleme imkanı sunması~E) Anakütleyi tüketen/tahrip eden testlerde (örn: ampul ömrü ölçümü) tek yol olması|C) Temsil yeteneğinin her zaman %100 kusursuz ve hatasız olması|Örnekleme hiçbir zaman %100 kusursuz değildir; her zaman bir 'örnekleme hatası' riski taşır. Tam sayımda bu hata sıfırdır.",
    "u7|Araştırmalarda çok sık yapılan bir hata olarak; anakütlenin zaman/maliyet gibi kısıtlarla daraltılmasına (Örn: sadece X ilindeki öğrencilerin seçilmesine) rağmen, elde edilen sonuçların nereye genellenmesi büyük bir bilimsel hatadır?|A) Sadece o ile genellenmesi~B) 'Tüm Türkiye'ye (tüm anakütleye)' genellenmesi~C) Öğrencilere genellenmesi~D) Sadece örnekleme genellenmesi~E) Hipotezlere genellenmesi|B) 'Tüm Türkiye'ye (tüm anakütleye)' genellenmesi|Daraltılmış ve spesifik (erişilebilen) bir örneklemden çıkan sonucu, tüm Türkiye gibi devasa bir hedef anakütleye genellemek akademik bir hatadır.",
    "u7|Bir ülkede yaşayan insanlar topluluğu gibi sayısı çok fazla da olsa belirli (sayılabilir) sayıda birimden oluşan evren türüne ne ad verilir?|A) Sonsuz anakütle~B) Sonlu anakütle~C) İdeal anakütle~D) Sınırsız evren~E) Açık evren|B) Sonlu anakütle|Sayısı sonlu (limitli) olan ve prensipte sayılabilen kitlelere sonlu anakütle denir.",
    "u7|Bir ülkedeki fiyatlar veya yıldızlar gibi birim sayıları çok fazla olup kesin sayısı tam olarak belirlenemeyen (sınırsız) evren türüne ne ad verilir?|A) Sonlu anakütle~B) Tam anakütle~C) Kapalı evren~D) Sonsuz anakütle~E) Kısıtlı evren|D) Sonsuz anakütle|Sınırları ve kesin sayısı bilinemeyen evrenlere sonsuz anakütle denir.",
    "u7|Hakkında ayrı ayrı bilgi toplanan anakütlenin en küçük parçasına 'gözlem birimi' denir. Bir ya da birden fazla gözlem birimi kümesine (örneğin hanehalkına) ne ad verilir?|A) Örnekleme birimi~B) Örneklem hatası~C) Parametre~D) Tam sayım birimi~E) Kitle~A) Örnekleme birimi|Örnekleme birimi, seçim aşamasında kullanılan ve bir veya birden çok gözlem birimini barındıran yapıdır.",
    "u7|Anakütlede yer alan birimlerin sadece bir kısmının (örneklemin) incelenmesiyle ulaşılan sonuçların, anakütlenin 'gerçek' durumundan farklı çıkma riskine (farkına) ne ad verilir?|A) Sistematik hata~B) Anketör sapması~C) Örnekleme hatası~D) Ölçüm hatası~E) Sabit hata|C) Örnekleme hatası|Örnekte bulunan değer (istatistik) ile anakütlenin gerçek değeri (parametre) arasındaki farka örnekleme hatası denir.",
    "u7|Aşağıdaki durumlardan hangisinde 'Örnekleme' yerine 'Tam Sayım' yapılması gereklidir?|A) Zaman kısıtlaması varsa~B) Mali olanaklar yetersizse~C) Anakütledeki birim sayısı 'çok az' ise~D) Tahribatlı test (ampul patlatma vb.) yapılıyorsa~E) Veri kontrolü kolaylaştırılmak isteniyorsa|C) Anakütledeki birim sayısı 'çok az' ise|İncelenecek birim sayısı çok az olduğunda örneklemeye başvurulmaz, herkesle görüşülerek (tam sayım) hata payı sıfırlanır.",
    "u7|Aşağıdakilerden hangisi örnekleme yaparken dikkat edilmesi gereken unsurlardan biri DEĞİLDİR?|A) Seçim işlemi ilgilenilen özellikten veya değişkenden bağımsız olmalıdır.~B) Örneklem bir önyargıya yer verilmeden seçilmelidir.~C) Örnekleme alınan birimlerden her biri diğerinden 'bağımsız' olmalıdır.~D) Örnekleme alınacak verilerin hepsine 'farklı' koşullar uygulanmalıdır.~E) İçinden örnek seçilecek anakütle hakkında özel bilgilere ihtiyaç vardır.|D) Örnekleme alınacak verilerin hepsine 'farklı' koşullar uygulanmalıdır.|Doğrusu; örnekleme alınacak verilerin hepsine 'aynı (standart)' koşulların uygulanması gerektiğidir.",
    "u7|Örnekleme sürecinin İlk (1.) ve Son (7.) aşamaları aşağıdakilerden hangisinde sırasıyla doğru olarak verilmiştir?|A) Örnekleme planını belirleme - Anakütleyi tanımlama~B) Anakütleyi tanımlama - Örnekleri seçme (uygulama)~C) Örneklem büyüklüğünü saptama - Çerçeveyi belirleme~D) Çerçeveyi belirleme - Anakütleyi tanımlama~E) Örnekleri seçme - Anakütleyi tanımlama|B) Anakütleyi tanımlama - Örnekleri seçme (uygulama)|Süreç her zaman Hedef Anakütleyi (Evreni) tanımlamakla başlar ve sahadaki Örnekleri Seçme adımıyla biter.",
    "u7|Örnekleme yöntemleri temel olarak hangi iki ana gruba ayrılmaktadır?|A) Kalitatif ve Kantitatif~B) Olasılıksal (Tesadüfi) ve Olasılıksal Olmayan (Tesadüfi Olmayan)~C) Açık ve Kapalı~D) Nitel ve Nicel~E) Bağımlı ve Bağımsız|B) Olasılıksal (Tesadüfi) ve Olasılıksal Olmayan (Tesadüfi Olmayan)|Örnekleme yöntemleri seçimin rastgele yapılıp yapılmamasına göre ikiye ayrılır.",
    "u7|Anakütledeki her bir bireyin örnek kapsamına alınma şansının veya olasılığının önceden BİLİNDİĞİ, araştırmacı yargısının seçime karışmadığı ve örnekleme hatasının istatistiksel olarak ölçülebildiği yöntem grubuna ne ad verilir?|A) Tesadüfi (Olasılıksal) örnekleme~B) Kasıtlı örnekleme~C) Tesadüfi olmayan örnekleme~D) Kota örneklemesi~E) Kolayda örnekleme|A) Tesadüfi (Olasılıksal) örnekleme|Kura veya rastgele sayılar tablosu gibi yöntemlerle herkesin eşit seçilme hakkına sahip olduğu bilimsel yöntemdir.",
    "u7|Aşağıdakilerden hangisi Tesadüfi OLMAYAN (Olasılığa dayalı olmayan) örnekleme yöntemlerinden biridir?|A) Basit tesadüfi örnekleme~B) Sistematik örnekleme~C) Tabakalı (Zümre) örnekleme~D) Kartopu örneklemesi~E) Küme örneklemesi|D) Kartopu örneklemesi|Kolayda, Kasıtlı (Yargısal), Kota ve Kartopu örneklemesi araştırmacı inisiyatifinin (sübjketifliğin) işe karıştığı tesadüfi olmayan yöntemlerdir.",
    "u7|Aşağıdakilerden hangisi Tesadüfi (Olasılıksal) örnekleme yöntemlerinden biridir?|A) Kota örneklemesi~B) Yargısal örnekleme~C) Kolayda örnekleme~D) Tabakalı (Zümre) örnekleme~E) Kartopu örneklemesi|D) Tabakalı (Zümre) örnekleme|Basit tesadüfi, Sistematik, Tabakalı ve Küme örnekleme yöntemleri tamamen olasılık teorisine dayanan tesadüfi yöntemlerdir.",
    "u7|Veri toplayıcının gözüne kestirdiği ya da uygun gördüğü kişiye katılım teklif ettiği; alışveriş merkezinde dolaşan veya yolda giden insanlara anket yapılmasını içeren, en ucuz ve en hızlı 'tesadüfi olmayan' örnekleme türü hangisidir?|A) Yargısal örnekleme~B) Kartopu örnekleme~C) Kolayda örnekleme~D) Sistematik örnekleme~E) Basit tesadüfi örnekleme|C) Kolayda örnekleme|Araştırmacının en kolay ulaştığı ve anında bulabildiği (convenience) kişileri seçtiği zayıf temsil güçlü yöntemdir.",
    "u7|Kolayda örnekleme için aşağıdakilerden hangisi söylenemez?|A) Hızlı ve ucuz veri elde etmenin en kestirme yoludur.~B) Örnek birimleri ulaşılabilir ve seçilmesi kolaydır.~C) Anakütleyi temsil etme gücü çok yüksek olup, tanımlayıcı/nedensel araştırmalar için şiddetle tavsiye edilir.~D) Fikir, anlayış ya da hipotez oluşturan keşfedici araştırmalarda kullanılabilir.~E) Örnek seçiminde önyargı (subjektivite) söz konusudur.|C) Anakütleyi temsil etme gücü çok yüksek olup, tanımlayıcı/nedensel araştırmalar için şiddetle tavsiye edilir.|Tam tersine; kolayda örnekleme anakütleyi temsil edemez ve sonuçlandırıcı (tanımlayıcı/nedensel) araştırmalar için TAVSİYE EDİLMEZ.",
    "u7|Örneğe kimin seçileceği kararının veri toplayıcı yerine, bir UZMANA ya da konuyu en iyi bilen araştırmacının bizzat kendisine bırakıldığı; pazarları test etmek veya mahkemede bilirkişi kullanmak gibi amaçları olan örnekleme yöntemi hangisidir?|A) Kolayda örnekleme~B) Basit tesadüfi örnekleme~C) Yargısal (Kasıtlı/Amaçlı) örnekleme~D) Sistematik örnekleme~E) Tabakalı örnekleme|C) Yargısal (Kasıtlı/Amaçlı) örnekleme|Uzmanın kendi yargısına ve tecrübesine güvenerek 'bizi en iyi bu kişiler temsil eder' diyerek denekleri kasıtlı seçtiği yöntemdir.",
    "u7|İki aşamalı bir yargısal örnekleme olan; önce anakütlenin kontrol karakteristiklerine (cinsiyet, yaş, gelir vb.) göre dağılımının belirlendiği, ardından veri toplayıcının bu oranları tutturmak şartıyla istediği kişiyi seçmekte özgür olduğu tesadüfi olmayan yöntem hangisidir?|A) Kartopu örneklemesi~B) Kota örneklemesi~C) Küme örneklemesi~D) Tabakalı örnekleme~E) Sistematik örnekleme|B) Kota örneklemesi|Örneğin evren %60 kadın, %40 erkekse; araştırmacı 1000 kişilik örnekleme 600 kadın ve 400 erkeği (kotayı) kendi istediği sokaktan bulup seçebilir.",
    "u7|Kota örneklemesinin 'Tabakalı (Zümre)' örneklemesinden EN TEMEL farkı nedir?|A) Tabakalama yapılmaması~B) Yalnızca kadınlara uygulanması~C) Örneklem elemanlarının tesadüfi (rastgele) DEĞİL, veri toplayıcının kolayına geldiği gibi veya yargısal seçilmesi~D) Maliyetinin çok yüksek olması~E) Kontrol kotasının olmaması|C) Örneklem elemanlarının tesadüfi (rastgele) DEĞİL, veri toplayıcının kolayına geldiği gibi veya yargısal seçilmesi|İkisinde de gruplara ayırma vardır ama Tabakalıda seçim torbadan kura çeker gibi rastgele (tesadüfi) yapılır, Kota'da ise anketör kendi seçer.",
    "u7|Örnekleme çerçevesi oluşturmanın zor olduğu; nadir bulunan veya ulaşılamayan hedef kitlelere (örn: özel tam sayım grupları, gizli dernek üyeleri) ulaşmak için ilk baştaki birkaç kişiden alınan referanslarla örneklemin dalga dalga büyütüldüğü yöntem hangisidir?|A) Kartopu örneklemesi~B) Tabakalı örnekleme~C) Kota örneklemesi~D) Yargısal örnekleme~E) Sistematik örnekleme|A) Kartopu örneklemesi|Ulaşılan bir kişinin araştırmacıyı başka bir tanıdığına yönlendirmesiyle örneklemin bir kartopu gibi büyüdüğü zincirleme yöntemdir.",
    "u7|Anakütlede yer alan her bir elemanın seçilebilme ihtimalinin eşit olduğu ve bilindiği; kura çekimi, tesadüfi sayılar tablosu veya bilgisayar destekli listeler aracılığıyla gerçekleştirilen temel tesadüfi örnekleme yöntemi hangisidir?|A) Basit tesadüfi örnekleme~B) Sistematik örnekleme~C) Küme örneklemesi~D) Kartopu örneklemesi~E) Yargısal örnekleme|A) Basit tesadüfi örnekleme|Her birimin tek tek numaralandırılıp şans eseri çekildiği (loto mantığı) en temel ve saf olasılıksal yöntemdir.",
    "u7|Sosyal bilimlerdeki geniş çaplı araştırmalarda 'Basit Tesadüfi Örnekleme' yönteminin çok KULLANILMAMASININ başlıca nedeni aşağıdakilerden hangisidir?|A) En ucuz yöntem olması~B) Çok kolay uygulanması~C) Basit tesadüfi örneklemeyi yapabilecek (milyonlarca kişinin adının olduğu) eksiksiz bir 'örnekleme çerçevesi (listesi)' oluşturmanın zor/imkansız olması~D) İstatistiksel hesaplamalara izin vermemesi~E) Araştırmacı yargısını zorunlu kılması|C) Basit tesadüfi örneklemeyi yapabilecek (milyonlarca kişinin adının olduğu) eksiksiz bir 'örnekleme çerçevesi (listesi)' oluşturmanın zor/imkansız olması|Tüm evrenin (örn: Türkiye'deki tüm tüketiciler) TC kimlik listesine sahip olmak imkansız olduğu için bu yöntem büyük sahalarda uygulanamaz.",
    "u7|Anakütledeki elemanların (N) örneklem sayısına (n) bölünmesiyle bir 'örnekleme aralığı' (i) hesaplandığı; daha sonra ilk elemanın tesadüfi seçilip ardından gelen her i. (örneğin her 50.) elemanın atlanarak seçildiği örnekleme yöntemi hangisidir?|A) Basit tesadüfi örnekleme~B) Sistematik örnekleme~C) Tabakalı örnekleme~D) Küme örneklemesi~E) Kota örneklemesi|B) Sistematik örnekleme|Örneğin listedeki 23., 123., 223., 323. kişilerin otomatik bir sistem (atlama) aralığıyla seçildiği pratik tesadüfi yöntemdir.",
    "u7|Sistematik örnekleme yönteminde dikkat edilmesi gereken (ve örnekleme hatasına yol açabilen) en büyük risk/sakınca nedir?|A) Tabloların okunamaması~B) Anakütle içinde periyodik olarak tekrarlanan/sıralanan elemanların, tesadüfen atlama aralığına denk gelip örneğin hep aynı tip kişilerden oluşması ihtimali~C) Maliyetin çok yüksek olması~D) Kura çekmenin uzun sürmesi~E) Referans bulunamaması|B) Anakütle içinde periyodik olarak tekrarlanan/sıralanan elemanların, tesadüfen atlama aralığına denk gelip örneğin hep aynı tip kişilerden oluşması ihtimali|Eğer liste belirli bir düzene göre sıralanmışsa (örn: her 10. kişi kadınsa ve aralığımız 10 ise) örneklem sadece kadınlardan oluşur ve evreni temsil etmez.",
    "u7|Anakütlenin çok heterojen (değişken) olduğu durumlarda, birimleri benzer özellikler gösterecek şekilde alt gruplara ayırdıktan sonra, her alt gruptan basit tesadüfi yöntemle elemanların seçildiği 'maliyeti artırmadan hassasiyeti yükselten' yöntem hangisidir?|A) Küme örneklemesi~B) Yargısal örnekleme~C) Sistematik örnekleme~D) Tabakalı (Zümre) örnekleme~E) Kolayda örnekleme|D) Tabakalı (Zümre) örnekleme|Evreni yaş, cinsiyet, sınıf gibi homojen tabakalara (katmanlara) ayırıp her katmandan kura ile seçim yapma mantığına dayanır.",
    "u7|Tabakalı (Zümre) örnekleme yapılırken uyulması gereken temel kural nedir?|A) Tabakalar birbiriyle içi içe geçmiş olmalıdır.~B) Tabakalar karşılıklı olarak ayrışımlı (her birim sadece bir tabakada yer almalı) ve bütün seçenekleri kapsayıcı olmalıdır.~C) Sadece tek bir tabaka oluşturulmalıdır.~D) Seçimler kura ile değil kolayda yöntemle yapılmalıdır.~E) Tabakalar mümkün olduğunca heterojen olmalıdır.|B) Tabakalar karşılıklı olarak ayrışımlı (her birim sadece bir tabakada yer almalı) ve bütün seçenekleri kapsayıcı olmalıdır.|Öğrencileri sınıflandırırken 1., 2., 3. ve 4. sınıflar belirlenir; bir öğrenci aynı anda iki sınıfta (tabakada) bulunamaz.",
    "u7|Oransal Olmayan Tabakalı Örneklemede, her bir tabakadan alınacak örneğin büyüklüğü neye göre belirlenir?|A) Sadece tabakanın toplam büyüklüğüne göre~B) Sadece veri toplayıcının keyfine göre~C) Tabakanın büyüklüğüyle ve tabakadaki elemanların dağılımının standart sapmasıyla (varyansıyla) orantılı olarak~D) Eşit sayıda paylaştırarak~E) Sadece tesadüfi sayılarla|C) Tabakanın büyüklüğüyle ve tabakadaki elemanların dağılımının standart sapmasıyla (varyansıyla) orantılı olarak|Varyansın (farklılığın) yüksek olduğu tabakalardan daha çok, homojen olanlardan daha az kişi seçilerek hassasiyet artırılır.",
    "u7|Örnekleme çerçevesi belirlemenin zor olduğu saha araştırmalarında; anakütlenin birbirine benzeyen (heterojen yapılı) alt birimlere ayrıldığı ve bu birimlerden rastgele seçilenlerin içindeki 'tüm elemanların' tamsayımla incelendiği tesadüfi yöntem hangisidir?|A) Sistematik örnekleme~B) Küme örneklemesi~C) Tabakalı örnekleme~D) Kota örneklemesi~E) Kartopu örneklemesi|B) Küme örneklemesi|Örneğin Türkiye'deki tüm ilkokullar kümelerdir. Rastgele 5 okul seçilir ve o 5 okulun içindeki TÜM öğrenciler (tamsayım) anketlenir.",
    "u7|Küme Örneklemesi ile Tabakalı Örnekleme arasındaki temel fark homojenlik/heterojenlik açısından nasıldır?|A) İkisi de homojendir.~B) Tabakalar kendi içinde Mümkün Olduğunca Homojen; Kümeler ise kendi içinde Mümkün Olduğunca Heterojen olmalıdır.~C) Tabakalar heterojen, kümeler homojendir.~D) İkisinde de farklılık aranmaz.~E) Sadece yaşa göre ayrılırlar.|B) Tabakalar kendi içinde Mümkün Olduğunca Homojen; Kümeler ise kendi içinde Mümkün Olduğunca Heterojen olmalıdır.|Tabaka (örn: 1.sınıflar) homojendir. Küme (örn: Bir ilkokul binası) ise içinde her sınıftan öğrenciyi barındırdığı için küçük bir Türkiye (heterojen) gibidir.",
    "u7|Örneklemenin en güç aşaması olan 'örneklem büyüklüğünün saptanmasında' eğer formül sonucu hesaplanan örnek büyüklüğü (n) saptandıktan sonra, bunun anakütle (N) içindeki oranı %5'ten BÜYÜK çıkarsa ne yapılmalıdır?|A) Örneklem tamamen iptal edilir.~B) Hesaplanan örnek büyüklüğü Düzeltme Faktörü (Finite Population Correction) ile çarpılarak küçültülür.~C) Tamsayım yapılır.~D) Örneklem iki katına çıkarılır.~E) %5 kuralı görmezden gelinir.|B) Hesaplanan örnek büyüklüğü Düzeltme Faktörü (Finite Population Correction) ile çarpılarak küçültülür.|Eğer örneklem evrenin %5'inden fazlasını kaplıyorsa, maliyeti düşürmek için n / (1 + n/N) düzeltme katsayısıyla sayı makul seviyeye çekilir.",
    "u7|Anakütle varyansının (veya olayın görülme olasılığının) bilinemediği veya tahmin edilemediği durumlarda, örneklem büyüklüğü formülünde p (olasılık) ve q (1-p) değerleri maksimum varyansı vermek üzere kaç olarak alınır?|A) p=0.1, q=0.9~B) p=1.0, q=0~C) p=0.5, q=0.5~D) p=0.9, q=0.1~E) p=0.25, q=0.75|C) p=0.5, q=0.5|Bilgi yoksa en kötü senaryo olan %50 (yarı yarıya / 0.5) olasılığı kabul edilir; bu da matematikte en büyük örneklem sayısını (maksimum varyansı) üretir.",
    "u7|Tablo 7.3 Temel Örnekleme Yöntemlerinin Karşılaştırmasına göre, 'Kesinliğinin zayıf olması, sonuçların hesaplanması ve yorumlanmasının zor olması' ZAYIF YÖNLERİNE sahip olan tesadüfi yöntem hangisidir?|A) Basit tesadüfi~B) Küme örneklemesi~C) Sistematik~D) Tabakalı~E) Kota|B) Küme örneklemesi|Küme örneklemesi sahada uygulanması çok kolay ve ucuzdur ancak istatistiksel hata payı diğer tesadüfi yöntemlere göre en yüksek olandır.",
    "u7|Tablo 7.3'e göre 'Tüm önemli alt anakütleleri barındırır ve kesinliği (hassasiyeti) çok yüksektir' şeklinde GÜÇLÜ YANI bulunan ancak 'çok sayıda alt kategori yapmak zor ve pahalıdır' şeklinde ZAYIF YANI olan tesadüfi yöntem hangisidir?|A) Tabakalı (Zümrelere göre) örnekleme~B) Sistematik örnekleme~C) Küme örneklemesi~D) Kolayda örnekleme~E) Basit tesadüfi örnekleme|A) Tabakalı (Zümrelere göre) örnekleme|Tabakalı örnekleme çok ince ayar yapar (kesinlik) ama evreni çok fazla katmana bölmek veriyi pahalılaştırır ve zorlaştırır.",
    "u7|Bir araştırmada t (güven düzeyi) = 1.96 (%95 güven aralığı), p = 0.5 ve e (hata payı) = 0.05 ise, (n = t² * p * q / e²) sadeleştirilmiş formülüne göre gerekli olan örneklem büyüklüğü (n) yaklaşık olarak kaçtır?|A) 100~B) 384~C) 500~D) 1000~E) 200|B) 384|(1.96 * 1.96 * 0.5 * 0.5) / (0.05 * 0.05) = (3.8416 * 0.25) / 0.0025 = 0.9604 / 0.0025 = 384.16. Bu sayı sosyal bilimlerde standart olarak bilinen en yaygın minimum örneklem sayısıdır.",
"u8|\"Bilimde önemli olan yeni gerçekler elde etmekten çok, onlar hakkında düşünmenin yeni yollarını keşfetmektir.\" sözü kime aittir?|A) Albert Einstein~B) Rensis Likert~C) William Lawrence Bragg~D) Immanuel Kant~E) Arthur L. Schawlow|C) William Lawrence Bragg|Ünite 8'in girişinde yer alan bu özlü söz William Lawrence Bragg'e aittir.",
    "u8|Herhangi bir niteliği gözlemek ve gözlem sonucunda önceden tespit edilen belirli kurallara göre nesnelerin ve kişilerin özelliklerine sayılar ve semboller atamaya ne ad verilir?|A) Ölçekleme~B) Hipotez~C) Ölçme~D) Parametre~E) Geçerlilik|C) Ölçme|Özellikleri sayısal olarak ifade edip bilimsel olarak değerlendirebilmek için onlara sembol/rakam atama işlemine ölçme denir.",
    "u8|Araştırmalarda nesneleri değil, onların neyini (hangi yönlerini) ölçeriz?|A) Fiziksel ağırlıklarını~B) Özelliklerini~C) Görünüşlerini~D) Fiyatlarını~E) Geçmişlerini|B) Özelliklerini|Bilimsel ölçümde nesnenin kendisi değil, o nesnenin taşıdığı tutum, yaş, cinsiyet gibi özellikleri ölçülür.",
    "u8|Ölçümün bir uzantısı olarak kabul edilen, nesneleri ölçeklendirerek bir bütüne çevirmeye ve ölçülmüş objelere göre bir süreklilik var etmeye yarayan kavrama ne ad verilir?|A) İstatistik~B) Ölçekleme~C) Parametre~D) Tahminleme~E) Olasılık|B) Ölçekleme|Ölçekleme, ölçülen değerleri belirli bir süreklilik çizgisine veya yapıya oturtma (1'den 100'e kadar sıralama vb.) işlemidir.",
    "u8|Cevaplayıcıların belli veriler baz alınarak sınıflandırıldıkları araç veya mekanizmalara ne ad verilir?|A) Deney~B) Gözlem~C) Ölçekler~D) Hipotezler~E) Evrenler|C) Ölçekler|Kişilerin tutum ve algılarını sınıflandırmak ve puanlamak için kurulan mekanizmalar ölçeklerdir.",
    "u8|Aşağıdakilerden hangisi ölçmenin araştırma süreçlerindeki iki temel yararından biridir?|A) Araştırmanın maliyetini artırması.~B) Sayısal değerler alan verilerin istatistiksel ve matematiksel tekniklerle analiz edilmesini (değiştirilmesini) mümkün kılması.~C) Tüm sonuçları karmaşıklaştırması.~D) Hipotezleri her zaman doğrulaması.~E) Anket süresini uzatması.|B) Sayısal değerler alan verilerin istatistiksel ve matematiksel tekniklerle analiz edilmesini (değiştirilmesini) mümkün kılması.|Ölçmenin asıl faydası, kelimeleri rakamlara dökerek özetlemeyi ve istatistiksel test (SPSS vb.) yapmayı sağlamasıdır.",
    "u8|Ölçekleme ve ölçüm sürecinde kullanılan temel ölçüm seviyeleri (ölçekler) en güçsüzden en güçlüye doğru sıralandığında, aşağıdakilerden hangisi METRİK OLMAYAN (Nonparametrik) ölçeklerden biridir?|A) Aralık (Interval) Ölçek~B) Oransal (Rasyo) Ölçek~C) Eşit Aralıklı Ölçek~D) Sıralama (Ordinal) Ölçek~E) Mutlak Ölçek|D) Sıralama (Ordinal) Ölçek|Sınıflandırma (Nominal) ve Sıralama (Ordinal) ölçekleri matematiksel işlem yapılamayan Metrik Olmayan (Nonparametrik) ölçeklerdir.",

    "u8|En az kısıtlı ve EN GÜÇSÜZ ölçek türü olan, nesnelerin miktar belirtmeden sadece etiket/sembol olarak gruplandırıldığı (Örn: Cinsiyet, Medeni Hal) ölçek türü hangisidir?|A) Sıralama Ölçeği~B) Aralıklı Ölçek~C) Sınıflama (Nominal) Ölçek~D) Oransal Ölçek~E) Yığın Ölçeği|C) Sınıflama (Nominal) Ölçek|Sadece isim (nom) veren ve sınıflandıran bu ölçekte (Kadın=1, Erkek=2) sayıların matematiksel hiçbir büyüklük anlamı yoktur.",
    "u8|Sınıflama (Nominal) ölçeği ile ölçülmüş veriler üzerinde hangi istatistiksel işlem YAPILAMAZ?|A) Frekans sayımı~B) Mod hesaplaması~C) Ki-kare analizi~D) Aritmetik ortalama hesaplaması~E) Kontenjans testleri|D) Aritmetik ortalama hesaplaması|Erkeklere 1, kadınlara 2 dediğimizde (1+2)/2=1.5 gibi bir 'ortalama cinsiyet' hesaplanamaz, sadece kaç kişi oldukları sayılabilir (Mod, Frekans).",
    "u8|Ölçülen verilerin belli bir yönde, belirli bir nitelik itibarıyla objelerin sırasını (en azdan en çoğa vb.) gösterdiği, örneğin gazetelerin tercih sırasına göre numaralandırıldığı (1>2>3) ölçek türü hangisidir?|A) Sınıflama Ölçeği~B) Aralıklı Ölçek~C) Oransal Ölçek~D) Sıralama (Ordinal) Ölçek~E) Semantik Ölçek|D) Sıralama (Ordinal) Ölçek|Kişinin en sevdiğine 1., ikinciye 2. demesidir. Ancak 1. ile 2. arasındaki sevgi farkının boyutu (ne kadar fark olduğu) bilinemez.",
    "u8|Aşağıdakilerden hangisi Sıralama (Ordinal) ölçeği ile ölçülen değişken türüne bir örnektir?|A) Öğrenim durumu (İlkokul, Lise, Üniversite)~B) Cinsiyet~C) Aylık gelir (TL olarak)~D) Sınıf mevcudu~E) Sıcaklık (Derece)|A) Öğrenim durumu (İlkokul, Lise, Üniversite)|Eğitim seviyeleri arasında bir hiyerarşi (sıra) vardır, biri diğerinden yüksektir ancak aralarındaki zeka/bilgi farkı matematiksel olarak eşit ölçülemez.",
    "u8|Sayısal olarak eşit aralıkların eşit mesafeleri temsil ettiği, ancak doğal/mutlak bir \"sıfır (0)\" noktasının olmadığı (Örn: Hava sıcaklığı veya Zeka puanı) ölçek türü hangisidir?|A) Oransal Ölçek~B) Sınıflama Ölçeği~C) Sıralama Ölçeği~D) Aralıklı (Interval) Ölçek~E) Kategorik Ölçek|D) Aralıklı (Interval) Ölçek|Sıcaklıkta 0 (sıfır) derece havanın/ısının hiç olmadığı anlamına (yokluğa) gelmez, sadece göreceli bir başlangıç noktasıdır.",
    "u8|Diğer üç ölçeğin (Sınıflama, Sıralama, Aralık) tüm özelliklerini taşıyan, mutlak (gerçek/yokluk bildiren) '0' noktasına sahip olan ve üzerinde tüm aritmetik işlemlerin (katı hesaplamanın) yapılabildiği EN GÜÇLÜ ölçek türü hangisidir?|A) Sınıflama Ölçeği~B) Sıralama Ölçeği~C) Aralıklı Ölçek~D) Oransal (Rasyo) Ölçek~E) Likert Ölçeği|D) Oransal (Rasyo) Ölçek|Boy, kilo, maaş gibi değişkenlerde sıfır (0) tam bir yokluğu ifade eder (0 kg ağırlık yoktur) ve 100 kg, 50 kg'ın tam iki katıdır.",
    "u8|Aşağıdakilerden hangisi Oransal (Rasyo) ölçeği ile ölçülebilen (sürekli) bir değişken örneğidir?|A) Göz rengi~B) Aylık gelir (TL)~C) Medeni hal~D) Önem derecesi sıralaması~E) Cinsiyet|B) Aylık gelir (TL)|Aylık gelir 0 TL olabilir (yokluk) ve 4000 TL kazanan kişi, 2000 TL kazanan kişinin tam 2 katı kazanır (oran kurulabilir).",
    "u8|İşletme araştırmalarında kullanılan ölçek türleri kaç ana başlıkta sınıflandırılır?|A) 2 (Nicel ve Nitel)~B) 3 (Sürekli, Tekli ve Çoklu Ölçekler)~C) 4 (Nominal, Ordinal, Interval, Rasyo)~D) 5 (Likert, Semantik, Stapel, Grafik, Sıralama)~E) 1 (Sadece Likert)|B) 3 (Sürekli, Tekli ve Çoklu Ölçekler)|İşletme anketlerindeki ölçek tasarımları genel olarak Sürekli, Tekli ve Çoklu (Likert vb.) ölçekler olarak 3 başlıkta toplanır.",
    "u8|Cevaplayıcının iki uç arasında uzanmakta olan bir çizgi (doğru) üzerindeki uygun bir yere işaret koyduğu; oluşturulması kolay fakat skorların belirlenmesi zor olan ölçek türü hangisidir?|A) Sürekli Ölçekler~B) Kategorili Ölçekler~C) Sabit-Toplam Ölçekler~D) Çoklu Ölçekler~E) Likert Ölçeği|A) Sürekli Ölçekler|Kişi bir çizgi (örn: Soğuk ----------- Sıcak) üzerinde bir yere çarpı atar, araştırmacı o mesafeyi cetvelle ölçüp puana (örn: 63) dönüştürür.",
    "u8|Tek madde veya sorudan ibaret olan ölçekler arasında; cevaplayıcılardan kendilerine verilen 100 tam puanın, listede verilen özelliklere önem derecesine göre dağıtılmasının istendiği ölçek hangisidir?|A) Sıralama ölçekleri~B) İkili-karşılaştırmalı ölçekler~C) Kategorili ölçekler~D) Sabit-Toplam ölçekler~E) Grafiksel ölçekler|D) Sabit-Toplam ölçekler|Kişiye 100 puan verilir ve \"Şık tasarım, Hız, Fiyat\" seçeneklerine bu 100 puanı bölüştürmesi istenir.",

    "u8|Semantik farklılıklar ölçeğinde negatif ve pozitif sıfatların yeri (bazen sol, bazen sağ) neden rastgele değiştirilir?|A) Görüntü güzel olsun diye.~B) Anketin maliyetini düşürmek için.~C) Cevaplayıcıların sıfatları okumadan hep aynı tarafa (örn: hep sağa) işaretleme yapması (alışkanlık) eğilimini tespit edip engellemek için.~D) İstatistiki analizleri imkansız hale getirmek için.~E) Sadece sayfa düzeni sığmadığı için.|C) Cevaplayıcıların sıfatları okumadan hep aynı tarafa (örn: hep sağa) işaretleme yapması (alışkanlık) eğilimini tespit edip engellemek için.|Eğer tüm iyiler sağdaysa kişi soruyu okumadan sürekli sağa tik atabilir; yerleri karışık olursa okumak zorunda kalır.",
