    "u1|\"Bilim olmadan yapılan bilim felsefesi boştur, bilim felsefesi olmadan yapılan bilim ise kör.\" sözü hangi ünlü düşünüre aittir?A) Francis Bacon~B) Immanuel Kant~C) İbni Haldun~D) William Whewell~E) Aristoteles|B) Immanuel Kant|Ünitenin başında yer alan bu ünlü söz Immanuel Kant'a aittir.",
    "u1|Bilim (science) sözcüğünün kökeni olan ve Latince 'bilmek' anlamına gelen terim aşağıdakilerden hangisidir?|A) Scienta~B) Philosophia~C) Episteme~D) Scire~E) Modo|D) Scire|Bilim sözcüğü Latince 'bilmek' anlamına gelen 'scire' kökünden türemiştir ve bilinen şey (scienta) anlamına gelir.",
    "u1|Tarihte 'Bilim insanı' sözcüğü ilk kez 1830'larda hangi fizikçi ve bilim tarihçisi tarafından kullanılmıştır?|A) Isaac Newton~B) Immanuel Kant~C) Francis Bacon~D) Auguste Comte~E) William Whewell|E) William Whewell|1830'larda William Whewell tarafından kullanılana kadar bilim insanlarına 'doğa filozofları' denmekteydi.",
    "u1,Banko|Bilimsel bilgiyi büyü, fal, edebiyat ve sanat gibi diğer bilgi türlerinden ayıran en önemli ölçüt aşağıdakilerden hangisidir?|A) Sadece üniversitelerde öğretilmesi~B) Konusunun nesnel (ampirik) gerçeklik olması~C) Subjektif yargılara dayanması~D) Tamamen akla dayalı olması~E) İnanç sistemleriyle uyumlu olması|B) Konusunun nesnel (ampirik) gerçeklik olması|Bilimsel bilgiyi diğerlerinden ayıran en önemli ölçüt, konusunu oluşturan olay ya da nesnelerin gözlemlenebilir (nesnel/ampirik) gerçeklik olmasıdır.",
    "u1|Bilimsel formasyon almayanların günlük yaşam deneyimleri içerisinde gördükleri, algıladıkları realitenin ve görünen yalın gerçeğin bilgisine ne ad verilir?|A) Felsefi bilgi~B) Teknik bilgi~C) Dini bilgi~D) Gündelik (Ampirik/Sıradan) bilgi~E) Sanat bilgisi|D) Gündelik (Ampirik/Sıradan) bilgi|Sıradan insanın günlük yaşamında duyularıyla algıladığı, henüz bilim süzgecinden geçmemiş bilgiye gündelik (adi) bilgi denir.",
    "u1|İnsanın doğayı kendi lehine çevirmek ve daha rahat bir yaşam sürmek amacıyla ürettiği aletlerde ihtiyaç duyduğu bilgi türü aşağıdakilerden hangisidir?|A) Gündelik bilgi~B) Sanat bilgisi~C) Teknik bilgi~D) Felsefi bilgi~E) Bilimsel bilgi|C) Teknik bilgi|Alet, makine ve günümüzde otomasyon teknolojisi aşamalarına ulaşan, doğayı insan lehine çevirmeyi sağlayan bilgiye teknik bilgi denir.",
    "u1|Güzellik ve estetik tatmin için doğada var olmayan bir şeyi üretmeye dayanan ve somut/bilimsel bilgi zorunluluğu bulunmayan bilgi türü nedir?|A) Felsefi bilgi~B) Teknik bilgi~C) Sanat bilgisi~D) Dini bilgi~E) Gündelik bilgi|C) Sanat bilgisi|Sanatçının hayal ve his dünyasında esinlenerek ürettiği, nesnel doğrulanabilirlik gerektirmeyen bilgi sanat bilgisidir.",
    "u1|Varlığı ve varoluşu tüm boyutlarıyla inceleyen, tümdengelim, tümevarım, tasım, analoji gibi yöntemlerle bilim üstü konumda yer alan bilgi türü hangisidir?|A) Teknik bilgi~B) Felsefi bilgi~C) Dini bilgi~D) Gündelik bilgi~E) Sanat bilgisi|B) Felsefi bilgi|Felsefi bilgi, mantık yöntemleriyle analizler yapma ve evrenle ilgili tutarlı bilgiler edinme çabasıyla elde edilir, deney/laboratuvar şartı aranmaz.",
    "u1|Bilginin kaynağını açıklarken, bilgilerin akıldan ve akıl yoluyla üretildiğini savunan görüş aşağıdakilerden hangisidir?|A) Pragmatist~B) Sezgici~C) Ampirist~D) Rasyonalist~E) Pozitivist|D) Rasyonalist|Rasyonalist (akılcı) görüşe göre bilginin tek kaynağı akıldır ve akıl yoluyla üretilir.",
    "u1|Bilim ve felsefe diye iki çeşit bilgiden söz eden; bilimi zekânın, felsefeyi ve hakiki hayatın bilgisini ise doğrudan 'sezginin' ürünü olarak gören felsefi yaklaşım hangisidir?|A) Pragmatizm~B) Sezgicilik~C) Rasyonalizm~D) Ampirizm~E) Postmodernizm|B) Sezgicilik|Sezgici görüş, sezgiden gelen bilgilerin değişmez hakikatler olduğunu ve felsefi bilginin temelini oluşturduğunu savunur.",
    "u1|Aşağıdaki görüşlerden hangisi, bilginin konusunun 'hayati olması ve uygulamada yararlı olması' gerektiğini savunarak, faydalı olmayan hakikate bilgi gözüyle bakmaz?|A) Ampiristler~B) Pragmatistler~C) Rasyonalistler~D) Sezgiciler~E) İdealistler|B) Pragmatistler|Pragmatistlere göre, günlük yaşantıyla ilgili ve faydalı olmayan hakikate ne bilgi ne de hakikat olarak bakılmalıdır.",
    "u1|Bilgilerin sadece duyu organları yoluyla, deney ve yaşantılardan geldiğini kabul eden görüş aşağıdakilerden hangisidir?|A) Rasyonalist~B) Sezgici~C) Ampirist~D) Pragmatist~E) Modernist|C) Ampirist|Ampirist görüş, tüm bilgilerin temelinde deneyim ve gözlemin (duyuların) yattığını savunur.",
    "u1|Aşağıdakilerden hangisi insanoğlunun başlangıçtan bugüne kadar bilgi elde etmek ve bilim yapmak için yararlandığı kaynaklardan (yollardan) biri değildir?|A) Bireysel Yaşantılar~B) Otorite~C) Fal ve Büyü~D) Tümdengelim~E) Bilimsel Yöntem|C) Fal ve Büyü|Metinde bilgi edinme yolları; Bireysel yaşantılar, Otorite, Tümdengelim, Tümevarım ve Bilimsel yöntem olarak sıralanmıştır.",
    "u1|Modernizm kelimesinin kökenini oluşturan ve 'son zamanlar, tam şimdi' anlamına gelen Latince sözcük aşağıdakilerden hangisidir?|A) Scire~B) Scienta~C) Modo~D) Modernus~E) Post|C) Modo|Modern sözcüğü, Latince 'modo' (tam şimdi) kelimesinden türeyen 'modernus' teriminden gelmektedir.",
    "u1|Aydınlanmayla birlikte ortaya çıkan, hümanizm ve demokrasi temeli üzerine yükselen, aklı ve bilimi insanın mutluluğunun anahtarı olarak gören düşünce sistemi hangisidir?|A) Skolastik Düşünce~B) Postmodernizm~C) Modernizm~D) Ampirizm~E) Varoluşçuluk|C) Modernizm|Modernizm, Ortaçağ zihniyetine tepki olarak doğan, aklın ve bilimin insanlığı refaha kavuşturacağını savunan akımdır.",
    "u1|Modernizmin temel karakteristiklerini sıralarken 'Açıklamada nihai neden fikrinin reddi ve tabiata matematikleştirilebilir bir yaklaşım'ı öne süren düşünür kimdir?|A) Francis Bacon~B) Immanuel Kant~C) Michel Foucault~D) Pippin~E) J. Ross Quinlan|D) Pippin|Pippin'e göre Modernizmin temel karakteristikleri arasında tabiata materyalistik yaklaşım ve nihai neden fikrinin reddi bulunur.",
    "u1,Banko|Üst genellemeleri reddeden, bölünmeyi ve farklılıkları öne çıkaran, 20. yüzyıl sonlarında tüketici odaklılık ve bilginin ticarileşmesiyle bağlantılı olarak ortaya çıkan akım hangisidir?|A) Pozitivizm~B) Rasyonalizm~C) Skolastik felsefe~D) Postmodernizm~E) Modernizm|D) Postmodernizm|Postmodernizm, evrensel tek bir doğru yerine her durumun özel olduğunu ve farklılıkların kabulünü savunur.",
    "u1,Banko|Sosyal bilimlerin öncüsü kabul edilen İbni Haldun'un, 'insanın düşünce yeteneği sayesinde kendi başına doğruyu yanlıştan ayırt edip ulaşabildiği' bilim sınıflandırması aşağıdakilerden hangisidir?|A) Nakli Bilimler~B) Dini Bilimler~C) Felsefi / Akli Bilimler~D) Gündelik Bilgiler~E) Sanat Bilimleri|C) Felsefi / Akli Bilimler|İbni Haldun'a göre felsefi (akli) bilimler, insanın bizzat kendi aklı ve muhakeme yeteneğiyle sorgulayarak ulaştığı bilimlerdir.",
    "u1|Bilimsel nitelik taşıyan her sonucun kişi ya da grubun tekelinde olmaması, güvenilir olup kamunun sorgulamasına açık ve elverişli biçimde ifade edilmesi bilimin hangi özelliğini gösterir?|A) Objektiflik~B) Seçicilik~C) Soyutlama~D) Yanlışlanabilirlik~E) Evrensellik|A) Objektiflik|Bilimdeki objektiflik (nesnellik), sonucun bağımsız ve tarafsız olarak herkesin sınayabileceği bir yapıya sahip olmasıdır.",
    "u1,Banko|Bilimde ulaşılan ve kanıtlanmış önermelerin dahi mutlak (değişmez) doğrular olmadığını, yeni bulgularla bir gün değişme olasılığının bulunduğunu ifade eden özellik hangisidir?|A) Genelleyicilik~B) Seçicilik~C) Yanlışlanabilirlik~D) Soyutlama~E) Açıklama|C) Yanlışlanabilirlik|Bilim dogmatik değildir. Elde edilen önermeler ne kadar kanıtlanmış olursa olsun bir gün yanlışlanma olasılığı taşır.",
    "u1|'100 derecede su kaynar' veya 'Bakır iletkendir' gibi önermelerin tek tek olguları değil, tüm olgu sınıflarını dile getirmesi bilimin hangi özelliğidir?|A) Objektiflik~B) Genelleyicilik~C) Eleştiricilik~D) Kontrol~E) Anlama|B) Genelleyicilik|Bilim her bir damla suyu ayrı ayrı incelemez; elde ettiği sonuçla sınırsız olgu sınıfları için geçerli bir kural koyar (Genelleyicilik).",
    "u1|Olgular tarafından desteklenen hipotezlerden elde edilen ilişkileri somut gerçeklikten sıyırarak zihinsel bir teori içinde bütünleştirmeye bilimin hangi özelliği denir?|A) Seçicilik~B) Yanlışlanabilirlik~C) Kanıtlanabilirlik~D) Soyutlama~E) Evrensellik|D) Soyutlama|Olgular arasındaki karmaşık ilişkileri genel bir teori halinde ifade edebilmek soyutlama ilkesiyle mümkündür.",
    "u1|Evrende olan biten sayısız olgunun tümüyle ilgilenmenin imkansız olması sebebiyle, bilimin sadece belirli bir hipotezin ışığındaki konulara yönelmesi hangi özelliğidir?|A) Evrensellik~B) Objektiflik~C) Seçicilik~D) Eleştiricilik~E) Soyutlama|C) Seçicilik|Bilim odaklanır. Her şeyi aynı anda çözemeyeceği için araştıracağı problemi ve değişkenleri bilinçli olarak seçer.",
    "u1|Araştırmacının ulaştığı bir sonucun, daha sonradan yeni verilerin veya aksi kanıtların bulunması halinde değiştirilip yeniden kurulması bilimin hangi özelliğinin bir gereğidir?|A) Evrensellik~B) Değişime açıklık (Kendini düzeltme)~C) Seçicilik~D) Objektiflik~E) Gelenekselcilik|B) Değişime açıklık (Kendini düzeltme)|Bilimsel teoriler doğrulama sürecine sürekli tabidir; yeni bulgularla eskinin değişmesi bilimin dinamik doğasıdır.",
    "u1|Bilimin işlevlerinden olan 'Açıklama' kavramı neyi ifade eder?|A) Olayların sadece isimlerini koymayı~B) Olayları sadece sınıflandırmayı~C) Olayların nasıl ve niçin oluştuklarını ortaya koymayı~D) Gelecekteki olayları durdurmayı~E) Sonuçları rapora çevirmeyi|C) Olayların nasıl ve niçin oluştuklarını ortaya koymayı|Açıklama işlevi, sadece durum tespiti yapmakla kalmayıp, meselenin kök nedenini (nasıl ve niçin) irdelemeyi kapsar.",
    "u1|Var olan şeylerin tek tek veya ilişkiler halinde tanınması ve 'nedir?' sorusuna yanıt verilerek mevcut durumun olduğu gibi ortaya konması bilimin hangi işlevidir?|A) Açıklama~B) Anlama~C) Kontrol~D) Tahminleme~E) Değiştirme|B) Anlama|Anlama, bilimin en temel düzeydeki durum tespiti yapma (tanıma ve özelliklerini öğrenme) işlevidir.",
    "u1|Bilimsel verilerin fiilen uygulamalara aktarılıp, istenen sonuçları elde edebilmek için doğada ve toplumda meydana gelen olayların denetim altına alınmasını sağlayan işlev hangisidir?|A) Kontrol~B) Açıklama~C) Anlama~D) Soyutlama~E) Genelleyicilik|A) Kontrol|Kontrol işlevi, üretilen bilgiyi kullanarak olayları insanın istediği doğrultuda yönetmesi/denetlemesidir.",
    "u1,Banko|Karasar'a (2015) göre Bilimsel Araştırma'nın tanımı aşağıdakilerden hangisidir?|A) Sadece veri toplama eylemidir.~B) Olguların teorik olarak düşünülmesidir.~C) Problemlere güvenilir çözümler aramak amacıyla, planlı ve sistemli olarak verilerin toplanması, çözümlenmesi, yorumlanması ve rapor edilmesi sürecidir.~D) Felsefi konuların tartışılmasıdır.~E) Sezgi yoluyla açıklanmasıdır.|C) Problemlere güvenilir çözümler aramak amacıyla, planlı ve sistemli olarak verilerin toplanması, çözümlenmesi, yorumlanması ve rapor edilmesi sürecidir.|Bilimsel araştırma sadece bilgi toplamak değil, bunu problemin çözümüne yönelik sistematik bir planda raporlamaktır.",
    "u1|Genelleyici bir önerme (kural) aracılığıyla yola çıkıp, tekil önermelerin doğruluğu veya yanlışlığını gözden geçirme (A=B, B=C ise A=C) işlemine ne ad verilir?|A) Tümevarım~B) Tümdengelim~C) Deney~D) Gözlem~E) Pragmatizm|B) Tümdengelim|Tümdengelim, genel bir ilkeden (öncüllerden) hareket ederek özel durumlara (tekile) sonuç çıkarma yöntemidir.",
    "u1|Ortaçağa hakim olan 'akılcılık' otoritesini yıkarak yerine bilgi ve gerçek keşfi için deney/gözleme dayanan 'tümevarım' yöntemini getirmeye çalışan bilimsel yöntemin babası kimdir?|A) Aristoteles~B) Immanuel Kant~C) Francis Bacon~D) Auguste Comte~E) John Locke|C) Francis Bacon|Francis Bacon, bilimin otoritelerin dogmalarıyla değil, doğanın bizzat gözlemlenip parçadan bütüne gidilmesiyle (tümevarım) yapılacağını savunmuştur.",
    "u1|Ayrı ayrı (tekil) gözlemlerden yola çıkarak, bunların bir araya getirilmesi sonucu genel bir hükme ve önermeye ulaşma yöntemine ne ad verilir?|A) Tümdengelim~B) Mantık yürütme~C) Tümevarım~D) Hipotez kurma~E) Tasım|C) Tümevarım|Tümevarım (Endüksiyon), gözlemlenen parçalardan hareketle genel bir bütüne/yasaya ulaşma biçimidir.",
    "u1|Güncel ve pratik bir sorunu çözme kaygısı gütmeden, olaylar arasındaki ilişkileri keşfetmek, bilgi birikimini artırmak ve yeni 'teori/kuram geliştirmek' amacıyla yapılan araştırmalara ne denir?|A) Uygulamalı araştırmalar~B) Temel (Kuramsal) araştırmalar~C) Olgubilimsel araştırmalar~D) İstatistiksel araştırmalar~E) Teknolojik araştırmalar|B) Temel (Kuramsal) araştırmalar|Temel araştırmaların asıl hedefi pratik sorunları çözmek değil, bilimin saf teorik bilgi havuzunu genişletmektir.",
    "u1|Günlük sorunlara pratik çözümler bulmak, ticari problemleri gidermek ve kamuoyunu aydınlatmak amacıyla daha çok özel sektör tarafından yapılan araştırmalara ne ad verilir?|A) Temel araştırmalar~B) Kavramsal araştırmalar~C) Uygulamalı araştırmalar~D) Felsefi incelemeler~E) Teorik çalışmalar|C) Uygulamalı araştırmalar|Uygulamalı (teknolojik) araştırmalar, mevcut teorik bilgileri kullanarak gerçek hayattaki spesifik problemlere anında çözüm üretmeyi hedefler.",
    "u1|Bilimsel bir araştırmanın kalitesi değerlendirilirken ele alınan temel ölçütlerden biri olan 'Orijinallik' kavramı neyi İFADE ETMEZ?|A) Yeni bir bilgi üretmeyi~B) Eski bir soruna yeni bir bakış açısıyla yaklaşmayı~C) Mevcut veriden yeni sonuçlara ulaşmayı~D) Sadece daha önce dünyada hiç kimsenin aklına gelmemiş sıfırdan bir icat yapmayı~E) Mevcut çalışmaları genişletip niteliğini artırmayı|D) Sadece daha önce dünyada hiç kimsenin aklına gelmemiş sıfırdan bir icat yapmayı|Orijinallik her zaman 'yepyeni, sıfır bir buluş' olmak zorunda değildir. Eski verilere yeni yorum katmak da orijinalliktir.",
    "u1|Bir araştırmanın hangi kuramsal ya da pratik sorunun çözümünde ve nasıl kullanılacağının açıklanması, araştırmanın kalite ölçütlerinden hangisini ifade eder?|A) Orijinallik~B) Yöntem~C) Geçerlilik~D) Önem~E) Güvenirlik|D) Önem|Araştırmanın problemi çözme potansiyeli ve bilime/uygulamaya katacağı değer, o çalışmanın 'Önemi' ile ilgilidir.",
    "u1|Bilimsel araştırma yöntemine ilişkin olarak aşağıdakilerden hangisi yanlıştır?|A) Nesnel bir tasarıma sahip olmasını sağlar.~B) Başkalarının da o araştırmayı aynı şekilde tekrarlayıp sınayabilmesine olanak tanır.~C) Kullanılan istatistiksel analizlerin araştırmanın doğasına uygun olmasını gerektirir.~D) Veri toplama yolunun gizli tutulmasını sağlar.~E) Yapılan seçimlerin gerekçelerinin açıkça belirtilmesini zorunlu kılar.|D) Veri toplama yolunun gizli tutulmasını sağlar.|Veri toplama ve analizi yönteminin aktarılmasında şeffaf davranılması, araştırmanın tekrarlanabilirliği ve eleştirilmesi için zorunludur.",
    "u1|Aşağıdakilerden hangisi bilimsel bir araştırmaya başlamadan önce sorulması gereken 5 temel sorudan biri DEĞİLDİR?|A) Bu araştırmayı neden yapmalıyız?~B) Hangi araştırmalar yapılmalı?~C) Yapılan bu araştırma harcanacak zaman ve paraya değecek mi?~D) Bu araştırmanın sonuçlarıyla ne/neler yapacağız?~E) Araştırmada kullanılacak kelime sayısı ne olmalıdır?|E) Araştırmada kullanılacak kelime sayısı ne olmalıdır?|Kelime sayısı araştırmanın temel felsefesini ve planlama sürecini oluşturan kritik stratejik sorulardan biri değildir.",
    "u1|Bilimsel araştırma sürecinin İLK aşaması aşağıdakilerden hangisidir?|A) Veri toplama araçlarının geliştirilmesi~B) Araştırma modelinin ve hipotezlerin belirlenmesi~C) Anakütle ve örneklemin belirlenmesi~D) Araştırma probleminin ve amaçlarının tanımlanması~E) Veri hazırlama ve analizi|D) Araştırma probleminin ve amaçlarının tanımlanması|Her türlü bilimsel araştırma, öncelikle çözülecek olan problemin ve amacın net bir şekilde tanımlanmasıyla başlar.",
    "u1|Bilimsel araştırma sürecinin SON aşaması aşağıdakilerden hangisidir?|A) Veri hazırlama ve analizi~B) Saha çalışması~C) Örneklemin belirlenmesi~D) Araştırma raporunun hazırlanması ve sunulması~E) Hipotez kurma|D) Araştırma raporunun hazırlanması ve sunulması|Tüm veriler analiz edildikten sonra araştırma sonuçlandırılır ve bir rapor halinde sunulur.",
    "u1|Bilimsel araştırmanın adım adım planlanmasının (araştırma tasarımı) araştırmacıya sağladığı en temel fayda nedir?|A) Kesinlikle olumlu sonuç çıkarmayı garanti etmesi.~B) Yöneticilerin kararlarını geçersiz kılması.~C) Araştırma sırasında çıkabilecek problemleri ve engelleri öngörerek zaman kaybını ve maliyetleri azaltması.~D) Ankete katılacak kişi sayısını artırması.~E) Kaynakları gizlemesi.|C) Araştırma sırasında çıkabilecek problemleri ve engelleri öngörerek zaman kaybını ve maliyetleri azaltması.|İyi bir planlama (tasarım), kaynak israfını (para, efor, zaman) engelleyerek araştırmanın sistemli bir şekilde amaca ulaşmasını sağlar.",
"u2|\"Araştırma, herkesin gördüğünü görmek ve kimsenin düşünmediğini düşünmektir.\" sözü kime aittir?|A) Albert Einstein~B) Immanuel Kant~C) Albert Szent-Gyorgyi~D) Francis Bacon~E) İbni Haldun|C) Albert Szent-Gyorgyi|Ünite 2'nin girişinde yer alan bu özlü söz, araştırmanın sıradan olandan farklı bir bakış açısı gerektirdiğini anlatan Albert Szent-Gyorgyi'ye aittir.",
    "u2|Araştırma konusu seçilirken aşağıdakilerden hangisine dikkat edilmesi beklenmez?|A) Konunun bir soruna çözüm getirmesi~B) O alana bir yenilik getirmesi~C) Çevre ve toplumun ilgisini çekmesi~D) Maliyetinin daima sıfır olması~E) Bilime ve alana katkı sunması|D) Maliyetinin daima sıfır olması|Araştırmaların elbette bir maliyeti (zaman, efor, para) vardır. Maliyetin sıfır olması gibi bir şart aranmaz, önemli olan katkı sunması ve yönetilebilir olmasıdır.",
    "u2|Aşağıdakilerden hangisi bir araştırma konusu belirlenirken dikkate alınması gereken hususlardan biri değildir?|A) Konunun araştırmacı için ilgi çekiciliği~B) Araştırmacının konu hakkındaki ön bilgisi~C) Verilere ulaşılabilirlik~D) Konunun sadece medyanın gündeminde olması~E) Araştırmacının yöntem bilgisi ve becerisinin yeterliliği|D) Konunun sadece medyanın gündeminde olması|Konu seçimi; araştırmacının ilgisi, bilgisi, konunun araştırılabilirliği ve bilime katkısı gibi bilimsel kriterlere göre yapılır. Sadece popüler olması yeterli değildir.",
    "u2|İşletme araştırmalarında araştırma problemi genellikle ne olarak ortaya çıkar?|A) Araştırma hipotezi~B) Araştırma sorusu~C) Araştırma modeli~D) Çözüm önerisi~E) Literatür taraması|B) Araştırma sorusu|Araştırmanın cevap bulmaya çalıştığı ve çalışmanın odak noktasını belirleyen problem, genellikle bir 'araştırma sorusu' cümlesi olarak tanımlanır.",
    "u2|Araştırma adımlarının tamamı önemli olmakla birlikte, araştırmanın \"kalbi\" niteliğinde olan ve bütün projenin nasıl yürüyeceğini belirleyen EN ÖNEMLİ adım hangisidir?|A) Veri toplama~B) Raporlama~C) Problem tanımlaması~D) Hipotez testi~E) Örneklem seçimi|C) Problem tanımlaması|Problem net ve doğru tanımlanırsa araştırma projesi doğru yürütülebilir. Yanlış tanımlanması araştırmacıyı yanlış yönlendirir.",
    "u2|Problemlerin nedenlerini araştıran, çözüm yolları arayan, alanını iyi bilen ve eleştirel bakış açısına sahip kişiye ne ad verilir?|A) Karar alıcı~B) Sponsor~C) Anketör~D) Araştırmacı~E) Teknisyen|D) Araştırmacı|Merak, eleştirel bakış ve yaratıcılık gibi yeteneklerle problemlerin nedenlerini inceleyip çözüm yolları arayan kişi araştırmacıdır.",
    "u2|Araştırmalar genellikle bir problem ya da fırsattan hareketle başlar. Asıl problemi yalıtmak (belirginleştirmek) için hangi araştırma türü uygulanabilir?|A) Keşfedici araştırmalar~B) Nedensel araştırmalar~C) İstatistiksel araştırmalar~D) Tarihsel araştırmalar~E) Sonuçlandırıcı araştırmalar|A) Keşfedici araştırmalar|Tanımlanan problem sadece bir belirti (semptom) veya büyük problemin bir parçasıysa, asıl kök problemi yalıtmak/bulmak için keşfedici araştırmalar yapılır.",
    "u2|Araştırmacılar problem tanımlaması yaparken genel olarak iki ana hata ile karşı karşıya kalırlar. Bunlar aşağıdakilerden hangisinde doğru verilmiştir?|A) Problemin çok pahalı veya çok ucuz olması~B) Problemin çok geniş veya çok dar olarak tanımlanması~C) Problemin nitel veya nicel olması~D) Problemin açık veya gizli olması~E) Problemin uzun veya kısa yazılması|B) Problemin çok geniş veya çok dar olarak tanımlanması|Problemin çok geniş ya da çok dar tanımlanması, esas araştırma problemine odaklanılmasını zorlaştırır.",
    "u2|Araştırma probleminin anlaşılması için en iyi başlangıç noktası aşağıdakilerden hangisidir?|A) Veri analiz programını seçmek~B) Raporun kapağını hazırlamak~C) Problemin ortaya çıkışından önce gerçekleşen olayların geçmişini araştırmak ya da hedefin tam olarak belirlenmesi~D) Anket formunu hemen dağıtmak~E) Bütçeyi harcamak|C) Problemin ortaya çıkışından önce gerçekleşen olayların geçmişini araştırmak ya da hedefin tam olarak belirlenmesi|Problemin geçmişini veya tam hedefini bilmek, kaynakların etkin kullanılması için ilk adımdır.",
    "u2|İyi bir araştırma problemi için bazı 'Genel Ölçütler' bulunmaktadır. Aşağıdakilerden hangisi bu genel ölçütlerden biri değildir?|A) Çözülebilir ve görgül yollarla incelenebilir olma~B) Yenilik getirici olma~C) Alanda yeterlilik~D) Değer yargısı içermeme~E) Açık, yalın ve anlaşılabilir olma|C) Alanda yeterlilik|Alanda yeterlilik, yöntem becerisi ve zaman/olanak yeterliliği problemin kendisinin değil, 'Araştırmacının Özel Ölçütleri' arasında yer alır.",
    "u2|Aşağıdakilerden hangisi iyi bir araştırma probleminde araştırmacıdan beklenen 'Özel Ölçütler'den biridir?|A) Değer yargısı içermeme~B) Sınırlanabilir olma~C) Önemli olma~D) Yöntembilim yeteneği (araştırma yöntem ve istatistik becerisi)~E) Görgül incelenebilir olma|D) Yöntembilim yeteneği (araştırma yöntem ve istatistik becerisi)|Zaman ve olanak yeterliliği, ilgi/merak, alanda yeterlilik ve yöntem yeteneği araştırmacıya ait özel ölçütlerdir.",
    "u2|Araştırma problemi tanımlanırken dilin ve anlatımın nasıl olması tavsiye edilir?|A) Sadece uzmanların anlayacağı ağır bir dil~B) Yabancı terimlerle dolu karmaşık bir dil~C) Alanı konusunda göreli olarak az bilgi sahibi olan birinin bile anlayabileceği bir şekilde~D) Sadece istatistiksel semboller içeren bir dil~E) Edebi ve mecazlarla dolu bir dil|C) Alanı konusunda göreli olarak az bilgi sahibi olan birinin bile anlayabileceği bir şekilde|Problem çok spesifik bir alanda olsa bile, herkesin genel hatlarıyla anlayabileceği açıklık ve yalınlıkta ifade edilmelidir.",
    "u2|Bir problemin başlangıçta ne kadarlık bir kısmı görünür durumdadır?|A) %100~B) %50~C) %85~D) %15~E) %0|D) %15|İyi tanımlanmış bir problemin ancak %15'i ilk bakışta görünür, diğer kısmı ise veriler toplandıkça ve araştırıldıkça ortaya çıkar.",
    "u2|Araştırma problemini belirleme sürecinde araştırmacının 'Karar Alıcılarla Görüşmesi'nin en önemli nedeni nedir?|A) Araştırmanın bütçesini artırmak.~B) Araştırma probleminin altında yatan asıl (kök) sebepleri ortaya çıkarmak.~C) Karar alıcının işini elinden almak.~D) Anketörlük yapmak.~E) SPSS programını kullanmak.|B) Araştırma probleminin altında yatan asıl (kök) sebepleri ortaya çıkarmak.|Karar alıcılar sorunla doğrudan yüzleşen kişilerdir. Onlarla iletişim, problemin kök nedenini bulmada çok önemlidir.",
    "u2|Firma raporları, birlik raporları, daha önce yazılmış tezler ve makaleler kullanılarak yapılan analiz türüne ne ad verilir?|A) Kalitatif Araştırma~B) İkincil Veri Analizi~C) Otorite Görüşmesi~D) Deney Tasarımı~E) Uzman Mülakatı|B) İkincil Veri Analizi|Başkaları tarafından önceden üretilmiş ve yayınlanmış olan literatür bilgilerinin kullanılması ikincil veri analizi kapsamındadır.",
    "u2|Aşağıdakilerden hangisi 'Kalitatif (Nitel) Araştırma' tekniklerine örnek olarak verilebilir?|A) ANOVA Testi~B) T-testi~C) Odak grup görüşmeleri ve derinlemesine görüşmeler~D) Çoklu regresyon~E) Varyans analizi|C) Odak grup görüşmeleri ve derinlemesine görüşmeler|Odak grupları, derinlemesine mülakatlar ve projeksiyon teknikleri sayılara değil sözlü/derinlemesine verilere dayanan kalitatif çalışmalardır.",
    "u2|Bir araştırmacının zaman yönetimi açısından zamanının %45'ini neye ayırması tavsiye edilir?|A) Veri ve bilgilerin toplanmasına~B) Araştırma raporunun kapak tasarımına~C) Anketörlerin eğitimine~D) Araştırmanın planlanmasına ve sonuçların yorumlanmasına~E) Sadece veri girişine|D) Araştırmanın planlanmasına ve sonuçların yorumlanmasına|İyi bir kural olarak zamanın %45'i planlamaya, %45'i yorumlamaya ve kalan %10'u verilerin toplanmasına harcanmalıdır.",
    "u2|Araştırmanın planlanmasındaki 'odak nokta' olan ve hedefe ulaşmak için bilginin elde edilmesine yön veren kavram hangisidir?|A) Araştırmanın Amacı~B) Hipotez~C) Örneklem~D) Anket~E) SPSS Analizi|A) Araştırmanın Amacı|Problemin tanımlanmasıyla birlikte araştırmanın ne yapmak istediğini (amacını) ortaya koymak tüm planlamanın odak noktasıdır.",
    "u2|Araştırmanın amacı belirlenirken kapsamının/sınırlarının çok geniş tutulması hangi sonuca yol açar?|A) Araştırmanın hemen bitmesine~B) Zaman ve maliyet açısından araştırma koşullarını zorlayıcı bir nitelik kazanmasına~C) Verilerin anında analiz edilmesine~D) Hipotezlerin sıfırlanmasına~E) Raporun kısa sürmesine|B) Zaman ve maliyet açısından araştırma koşullarını zorlayıcı bir nitelik kazanmasına|Amaç çok geniş olursa hedefe ulaşmak, doğru veriyi bulmak zorlaşır ve maliyetler altından kalkılamaz hale gelir.",
    "u2|Bir araştırmada verilerin toplanmasını ve bu verilerin çözümlenmesini tüm ayrıntılarıyla gösteren plana (iskelete) ne ad verilir?|A) Araştırma Problemi~B) Araştırma Hipotezi~C) Araştırma Raporu~D) Araştırma Modeli~E) Araştırma Bütçesi|D) Araştırma Modeli|Araştırma modeli, değişkenleri ve bu değişkenler arasındaki etkileşimleri ortaya koyan, tüm işlemsel yapının iskeletidir.",
    "u2|Değişkenler arasındaki ilişkinin 'yazılı olarak' temsil edildiği analitik model türüne ne ad verilir?|A) Matematiksel Model~B) Grafiksel Model~C) Sözel Model~D) Geometrik Model~E) İstatistiksel Model|C) Sözel Model|Değişkenler arası ilişkiler sadece metin (cümleler) ile yazılı olarak anlatılıyorsa buna sözel model denir.",
    "u2|Değişkenler arasındaki ilişkinin 'görsel resimler ve şekillerle' temsil edildiği analitik model türü hangisidir?|A) Grafiksel Model~B) Matematiksel Model~C) Sözel Model~D) Formül Modeli~E) Simgesel Model|A) Grafiksel Model|Genel resmi görmek için kutular, oklar ve resimlerle çizilen modellere grafiksel/şekilsel model denir.",
    "u2|Değişkenler arasındaki ilişkinin 'denklem şekliyle' temsil edildiği analitik model türü hangisidir?|A) Sözel Model~B) Grafiksel Model~C) Geometrik Model~D) Matematiksel Model~E) Kavramsal Model|D) Matematiksel Model|İlişkilerin y = a + bx gibi formüllerle ve denklemlerle ifade edildiği modele matematiksel model denir.",
    "u2|Bilimsel araştırmalarda en büyük eksikliklerin gözlemlendiği, ancak iyi kurulduğunda araştırmacının yolunu çok net görmesini sağlayan aşama hangisidir?|A) Rapor yazımı~B) Anket basımı~C) Araştırma Modellemesi~D) Referans arama~E) İmla kontrolü|C) Araştırma Modellemesi|Modellemenin iyi yapılması; hipotezlerin, örneklemin ve analiz yönteminin hatasız belirlenmesine öncülük eder.",
    "u2|Bir araştırma probleminin çözümü için, doğrulanması ya da yanlışlanması gereken 'önermeye' ne ad verilir?|A) Model~B) Hipotez~C) Sınırlılık~D) Amaç~E) Örneklem|B) Hipotez|Hipotezler, sorunun yanıtına ilişkin doğruluğu sınanmayı bekleyen bilgiye dayalı tahminler ve önermelerdir.",
    "u2|Aşağıdaki araştırma türlerinin hangisinde HİPOTEZ KURULMASINA GEREK YOKTUR?|A) Deneysel araştırmalar~B) İlişkisel araştırmalar~C) Nedensel araştırmalar~D) Mevcut durumun ortaya konulduğu tanımlayıcı (descriptive) ve nitel araştırmalar~E) Optimizasyon araştırmaları|D) Mevcut durumun ortaya konulduğu tanımlayıcı (descriptive) ve nitel araştırmalar|Sadece durum tespiti yapan (örneğin: nüfus sayımı, tüketici profili çizme) araştırmalarda hipotez kurulmaz.",
    "2024 Final,2025 Vize,B|Araştırmacının kendi varsayımını ve beklentisini ifade eden, 'anlamlı bir ilişki/fark vardır' şeklindeki hipotez türü aşağıdakilerden hangisidir?|A) Yokluk Hipotezi~B) Null Hipotez~C) Sıfır Hipotezi~D) Alternatif Hipotez (H1)~E) Geçersiz Hipotez|D) Alternatif Hipotez (H1)|Araştırmacının iddia ettiği, aralarında ilişki bulunduğunu savunan ana hipotez alternatif hipotezdir.",
    "2024 Büt,B|'Anlamlı bir ilişki/fark yoktur' şeklinde kurulan ve alternatif hipotezin tam zıttı (yokluk durumu) olan hipotez türüne ne ad verilir?|A) Alternatif Hipotez (H1)~B) Araştırma Hipotezi~C) Null (Yokluk / Sıfır) Hipotez (H0)~D) Etki Hipotezi~E) Korelasyon Hipotezi|C) Null (Yokluk / Sıfır) Hipotez (H0)|İki değişken arasında hiçbir ilişki veya fark olmadığını savunan temel istatistiksel hipoteze Null (Yokluk) hipotezi denir.",
    "u2|Alternatif hipotez ve Yokluk (Null) hipotezi bilimsel çalışmalarda genellikle hangi sembollerle ifade edilir?|A) A1 ve A0~B) H1 (Alternatif) ve H0 (Null)~C) X ve Y~D) P1 ve P2~E) T1 ve T0|B) H1 (Alternatif) ve H0 (Null)|Literatürde sıfır hipotezi H0, araştırmacının alternatif hipotezi ise H1 (veya HA) olarak kodlanır.",
    "u2|İstatistiksel analizler sonucunda elde edilen veriler değerlendirilirken hipotezlerle ilgili yapılması gereken doğru eylem nedir?|A) Sadece araştırmacının beklediği sonucu destekleyen hipotezlere raporda yer verilmelidir.~B) İstatistiksel testlerin sonucunda anlamlı ya da anlamsız çıkan TÜM hipotezlere yer verilmelidir.~C) Yanlış çıkan hipotezler araştırma modelinden silinmelidir.~D) Hipotezler sonucuna uydurulmak üzere değiştirilmelidir.~E) H0 her zaman reddedilmelidir.|B) İstatistiksel testlerin sonucunda anlamlı ya da anlamsız çıkan TÜM hipotezlere yer verilmelidir.|Araştırmada yanlılığı (bias) önlemek için, tahminlerinizin yanlış çıkması (H0'ın kabul edilmesi) bile bilimsel bir sonuçtur ve raporlanmalıdır.",
    "u2|Karar alıcılarla araştırmacıların her zaman aynı kişiler olmaması nedeniyle, araştırmacılarda aranan temel özellik nedir?|A) Sadece verileri toplamaları yeterlidir.~B) Kendi kararlarını zorla yöneticilere kabul ettirmelidirler.~C) Karar alıcıların ihtiyaç duyduğu bilgiye ulaşma sürecinde onlara yardımcı olan, süreci iyi bilen ve uygulayan kişiler olmalarıdır.~D) Bütün işletmeyi yönetmeleri beklenir.~E) Rapor yazmamaları gerekir.|C) Karar alıcıların ihtiyaç duyduğu bilgiye ulaşma sürecinde onlara yardımcı olan, süreci iyi bilen ve uygulayan kişiler olmalarıdır.|Araştırmacı, bilimsel yöntemlerle doğru veriyi toplayıp yöneticinin isabetli karar almasına rehberlik eden uzmandır.",
    "u2|Aşağıdakilerden hangisi bir araştırmada Hipotez (H) yazılmasının asıl amacıdır?|A) Araştırmanın bütçesini hesaplamak.~B) Anketin kaç sayfa olacağını belirlemek.~C) Araştırma problemini, doğrulanması veya yanlışlanması istatistiksel olarak test edilebilecek açık bir ifadeye dönüştürmek.~D) Raporun özetini oluşturmak.~E) Çıkan sonuçları değiştirmek.|C) Araştırma problemini, doğrulanması veya yanlışlanması istatistiksel olarak test edilebilecek açık bir ifadeye dönüştürmek.|Hipotez, muğlak olan problemin ölçülebilir ve test edilebilir somut bir iddiaya çevrilmiş halidir.",
    "u2|Aşağıdakilerden hangisi bir araştırma problemi tanımlanırken gözetilmesi gereken ilkelerden biri değildir?|A) Problemin alanında uzman olmayan birinin bile anlayabileceği kadar açık tanımlanması.~B) Spesifik araştırma alanının sınırlandırılması.~C) Araştırmanın amacının kısaca belirtilmesi.~D) 'Araştırmanın amacı şudur' gibi açık bir cümlenin metinde mutlaka yer alması.~E) Problemin çok geniş ve ucu açık bırakılarak her türlü yoruma açık hale getirilmesi.|E) Problemin çok geniş ve ucu açık bırakılarak her türlü yoruma açık hale getirilmesi.|Problemin çok geniş bırakılması odaklanmayı engeller, bu nedenle sınırları spesifik olarak daraltılmalıdır.",
    "u2|Bir problemi çözmek için araştırma konusunun sınırları çizilirken, o konuya ilişkin geçmiş bilgilere ulaşıp onları derleyerek mevcut durumu anlama işlemine ne ad verilir?|A) Hipotez kurma~B) Literatür taraması (Geçmiş bilgilerin derlenmesi)~C) Sonuç raporlama~D) Anket kodlama~E) Veri temizleme|B) Literatür taraması (Geçmiş bilgilerin derlenmesi)|Araştırma konusunu daraltmak ve sınırları belirlemek için geçmişteki makale, tez ve teorilerin incelenmesi şarttır.",
    "u2|Araştırmacıların karar alıcılarla iletişim kurarken sahip olması gereken özellikler arasında hangisi bulunmaz?|A) Güven ve samimiyet~B) İşbirliği ve yakınlık~C) Devamlılık ve yaratıcılık~D) İletişimi kopuk ve mesafeli tutmak~E) İletişim yeteneği|D) İletişimi kopuk ve mesafeli tutmak|Tam tersine; karar alıcıyla iletişim kopukluğu, asıl problemin anlaşılamamasına ve projenin boşa gitmesine neden olur.",
    "u2|Araştırma modelindeki değişkenlere ilişkin geliştirilen araştırma hipotezleri, istatistiksel olarak test edilecek şekle dönüştürülmeden hemen önce nasıl oluşturulmalıdır?|A) Sadece sayılarla yazılmalıdır.~B) Önce sözlü olarak (cümle halinde) geliştirilir, sonra istatistiksel/matematiksel formata dönüştürülür.~C) Rastgele yazılmalıdır.~D) Anket formuna gizlenmelidir.~E) Başka araştırmalardan kopyalanmalıdır.|B) Önce sözlü olarak (cümle halinde) geliştirilir, sonra istatistiksel/matematiksel formata dönüştürülür.|İddia önce mantıklı bir cümle (sözel) olarak kurulur, sonra değişkenlerle (H0, H1) ifade edilir.",
    "u2|İyi yapılandırılmış bir hipotez, araştırmacıya HANGİ konuda yol gösterici OLMAZ?|A) Hangi istatistiksel analiz yönteminin kullanılacağı~B) Hangi değişkenin bağımlı, hangisinin bağımsız olacağı~C) Analizlere değişkenlerin nasıl katılacağı~D) Araştırmanın kaç günde biteceği~E) Neyin test edileceği|D) Araştırmanın kaç günde biteceği|Hipotezler yöntem, değişken türü ve test tekniğini belirler; ancak operasyonel zaman çizelgesini (takvimi) belirlemez.",
    "u2|Problemin çok iyi tanımlanması gerektiği aksi takdirde zaman, çaba ve para kaybı yaşanacağı gerçeğini savunan aşama, bilimsel sürecin hangi adımıdır?|A) Saha çalışması ve veri toplama~B) Araştırma probleminin ve sorularının seçimi~C) Rapor yazımı~D) Örneklem büyüklüğü belirleme~E) Anket tasarımı|B) Araştırma probleminin ve sorularının seçimi|Yanlış teşhis yanlış tedavi getirir. Soru yanlış seçilirse arkasından gelen tüm emek ve bütçe boşa gider.",
    "u2|Araştırmalarda kullanılan model türleri incelendiğinde; 'Müşteri Memnuniyeti = a + b * (Hizmet Kalitesi)' şeklindeki bir gösterim hangi model türüne örnektir?|A) Sözel model~B) Grafiksel model~C) Matematiksel model~D) Fiziksel model~E) Biyolojik model|C) Matematiksel model|Değişkenler arasındaki ilişkinin denklemlerle, katsayılarla ve işlemlerle ifade edildiği formlar matematikseldir.",
    "u2|Bir araştırmada elde edilen veriler üzerinden \"Anlamlı bir ilişki veya fark YOKTUR\" diyen H0 hipotezi reddedilirse, bilimsel olarak hangi sonuç kabul edilmiş olur?|A) Araştırmanın hatalı olduğu.~B) Yeni bir veri toplanması gerektiği.~C) Araştırmacının iddia ettiği 'Anlamlı bir ilişki/fark VARDIR' diyen Alternatif (H1) hipotezin kabul edildiği.~D) Evrenin sınırsız olduğu.~E) Hipotez kurmaya gerek olmadığı.|C) Araştırmacının iddia ettiği 'Anlamlı bir ilişki/fark VARDIR' diyen Alternatif (H1) hipotezin kabul edildiği.|İstatistiksel testlerde H0 reddedildiğinde, otomatik olarak zıttı olan H1 (Alternatif) hipotez istatistiksel olarak doğrulanmış sayılır.",
"u3|\"Ne yaptığımızı bilseydik, bunun adı araştırma olmazdı, değil mi?\" sözü kime aittir?|A) Isaac Newton~B) Francis Bacon~C) Albert Einstein~D) İbni Haldun~E) Immanuel Kant|C) Albert Einstein|Ünite 3'ün girişinde yer alan bu özlü söz Albert Einstein'a aittir.",
    "u3|Bir araştırmayı yürütmek için oluşturulan, problem çözümünde gerekli bilginin elde edilmesi için gereken süreci ayrıntılandıran genel plana (çatıya) ne ad verilir?|A) Hipotez~B) Araştırma Tasarımı~C) Literatür Taraması~D) Örneklem~E) Veri Analizi|B) Araştırma Tasarımı|Araştırma tasarımı, problemi çözmek ve hipotezleri test etmek için gereken süreçleri detaylandıran genel plandır.",
    "u3|Araştırma tasarımı ile ilgili aşağıdakilerden hangisi yanlıştır?|A) Veri toplama ve analiz aşamalarına yol gösteren plandır.~B) Toplanacak bilginin tipini ve veri kaynaklarını belirler.~C) Araştırmacıya yol gösteren tek bir standart veya ideal tasarım vardır.~D) Doğru ve ekonomik prosedürlerde bilgi toplanmasını sağlar.~E) Bir araştırma projesinin genel planıdır.|C) Araştırmacıya yol gösteren tek bir standart veya ideal tasarım vardır.|Aynı amaçları başaran birçok farklı tasarım olduğundan dolayı, araştırmacıya yol gösteren standart veya ideal 'tek' bir araştırma tasarımı yoktur.",
    "u3|Araştırma tasarımları temel olarak hangi iki ana gruba ayrılır?|A) Nitel ve Nicel~B) Açık ve Kapalı~C) Deney ve Gözlem~D) Keşfedici ve Sonuçlandırıcı~E) Tümevarım ve Tümdengelim|D) Keşfedici ve Sonuçlandırıcı|Araştırma tasarımları en üstte Keşfedici (Exploratory) ve Sonuçlandırıcı (Conclusive) olarak iki ana gruba ayrılır.",
    "u3|Ortalıkta apaçık bulunmayan, henüz ortaya çıkmamış veya gelecekte olabilecek problemleri tanımlamaya yardımcı olan araştırma türü hangisidir?|A) Keşfedici araştırma~B) Tanımlayıcı araştırma~C) Nedensel araştırma~D) Deneysel araştırma~E) Kesin araştırma|A) Keşfedici araştırma|Problemin ne olduğunu dahi tam bilmediğimiz öncül aşamada yapılan araştırmalar keşfedicidir.",
    "u3|Keşfedici araştırmanın özellikleri için aşağıdakilerden hangisi söylenemez?|A) Araştırma süreci esnektir.~B) Kesin ve yapılandırılmış bir plan formatı yoktur.~C) Örneklem genelde küçük ve temsil edici değildir.~D) Temel bilgilerin analizi kalitatif (nitel) olarak gerçekleşir.~E) Değişkenlerin çok iyi tanımlandığı kantitatif (nicel) anket ve deneyler için çok uygundur.|E) Değişkenlerin çok iyi tanımlandığı kantitatif (nicel) anket ve deneyler için çok uygundur.|Keşfedici araştırmada değişkenler henüz net bilinmediği için kesin ve nicel anket/deney sistemleri için uygun DEĞİLDİR.",
    "u3|Keşfedici araştırmalarda genellikle hangi tür veri toplama yöntemleri kullanılır?|A) Sadece laboratuvar deneyleri~B) Büyük çaplı nicel anketler~C) İkincil veri kaynakları, uzman görüşmeleri ve kalitatif (odak grup vb.) yöntemler~D) Sadece istatistiksel matematik modellemeleri~E) Tamsayım yöntemleri|C) İkincil veri kaynakları, uzman görüşmeleri ve kalitatif (odak grup vb.) yöntemler|Konuyu anlamak için uzmanlara danışılır, geçmiş kaynaklar taranır ve esnek odak grup toplantıları yapılır.",
    "u3|Aşağıdakilerden hangisi keşfedici araştırmaların kullanılma amaçlarından biri değildir?|A) Problemi yapılandırmak ve daha kesin tanımlamak~B) Alternatif seçenekleri belirlemek~C) İleriki araştırmalar için hipotezler oluşturmak~D) İki değişken arasındaki neden-sonuç ilişkisini kesin olarak kanıtlamak~E) Problemin çözümü için bakış açısı oluşturmak|D) İki değişken arasındaki neden-sonuç ilişkisini kesin olarak kanıtlamak|Neden-sonuç ilişkisini kanıtlamak Keşfedici araştırmanın değil, Nedensel araştırmanın görevidir.",
    "u3|Belirli araştırma problemlerinin çözümüne yardımcı olan, açıkça tanımlanan amaçları ve bilgi ihtiyaçlarını kapsayan araştırma türü hangisidir?|A) Keşfedici araştırma~B) Sonuçlandırıcı araştırma~C) Felsefi araştırma~D) Teorik araştırma~E) Gözlemsel araştırma|B) Sonuçlandırıcı araştırma|Yöneticiye durumun yönlerini seçmeye ve kesin karar vermeye yardım eden bilgiyi sağlayan araştırma türüdür.",
    "u3|Sonuçlandırıcı araştırmalar kendi içinde hangi iki alt gruba ayrılır?|A) Nicel ve Nitel~B) Temel ve Uygulamalı~C) Keşfedici ve Deneysel~D) Tanımlayıcı ve Nedensel~E) Anket ve Gözlem|D) Tanımlayıcı ve Nedensel|Sonuçlandırıcı araştırmalar durumu tasvir eden (Tanımlayıcı) ve sebep-sonuç ilişkisi kuran (Nedensel) olarak ikiye ayrılır.",
    "u3|Sonuçlandırıcı araştırmaların genel karakteristikleri için hangisi doğrudur?|A) Süreç çok esnektir ve plansızdır.~B) Örneklem küçüktür ve evreni temsil etmez.~C) Veri analizi tamamen kalitatif (nitel) olarak yapılır.~D) Araştırma süreci planlanmış ve yapılandırılmıştır; örneklem büyük ve temsil edicidir.~E) Bulguları kesin değildir, sadece fikir verir.|D) Araştırma süreci planlanmış ve yapılandırılmıştır; örneklem büyük ve temsil edicidir.|Keşfedici araştırmanın aksine sonuçlandırıcı araştırmalarda her şey çok net, planlı ve istatistikseldir.",
    "u3|Pazar potansiyelini belirlemek ya da belirli bir ürünü satın alan tüketicilerin demografik özelliklerini ve tutumlarını saptamak için yapılan sonuçlandırıcı araştırma türü hangisidir?|A) Keşfedici araştırma~B) Nedensel araştırma~C) Tanımlayıcı araştırma~D) Deneysel araştırma~E) Laboratuvar araştırması|C) Tanımlayıcı araştırma|Sadece 'resmi çeken', durumun ne olduğunu veya pazar özelliklerini tanımlayan araştırmalar tanımlayıcıdır.",
    "u3|Tanımlayıcı araştırmaya geçilebilmesi için hangi aşamaların tamamlanmış olması gerekir?|A) Veri analizinin bitmiş olması~B) Değişkenlerin belirlenmesi, problemin tanımlanması ve hipotezlerin oluşturulması~C) Raporun yazılmış olması~D) Deneyin sonuçlanmış olması~E) Nihai kararın alınmış olması|B) Değişkenlerin belirlenmesi, problemin tanımlanması ve hipotezlerin oluşturulması|Tanımlayıcı araştırmalar neyi aradığını bilir, bu nedenle problem ve hipotezler baştan netleşmiş olmalıdır.",
    "u3|Tanımlayıcı araştırmalarda en sık kullanılan veri toplama yöntemleri hangileridir?|A) Sadece uzman mülakatları~B) Deney ve laboratuvar testleri~C) Odak grup ve projeksiyon teknikleri~D) Anket ve gözlem~E) Sadece ikincil veri|D) Anket ve gözlem|Kitleyi tanımlamak için sahadan geniş çaplı veri toplamayı sağlayan anketler ve gözlemler en sık kullanılan yöntemlerdir.",
    "u3|Aşağıdakilerden hangisi tanımlayıcı araştırmaların amaçlarından biri DEĞİLDİR?|A) İlgili grupların özelliklerini tanımlamak~B) Belli bir davranışı sergileyen grupların yüzdesini tahminlemek~C) Sebep olan değişkenler ile sonuçlar arasındaki ilişkiyi ve etkileri bulmak~D) Algılamaları belirlemek~E) İlişkilendirilen değişkenleri belirlemek|C) Sebep olan değişkenler ile sonuçlar arasındaki ilişkiyi ve etkileri bulmak|Sebep-sonuç ilişkisini (etkiyi) bulmak Tanımlayıcı araştırmanın değil, Nedensel araştırmanın amacıdır.",
    "u3|Bağımsız değişken (X) ile bağımlı değişken (Y) arasındaki neden-sonuç ilişkisini ortaya çıkarmak ve hipotezleri test etmek amacıyla yapılan araştırma türü hangisidir?|A) Keşfedici~B) Nedensel~C) Tanımlayıcı~D) Açımlayıcı~E) Felsefi|B) Nedensel|Olayların 'neden' kaynaklandığını ve sonucunun ne olduğunu ispatlamaya çalışan araştırmalar nedensel araştırmalardır.",
    "u3|Kendisindeki değişimler ile bağımlı değişkeni (Y'yi) etkileyen ve ondaki değişime neden olan değişkene ne ad verilir?|A) Sabit değişken~B) Çıktı değişkeni~C) Bağımlı değişken~D) Bağımsız değişken (X)~E) Kontrol değişkeni|D) Bağımsız değişken (X)|Bağımsız değişken (X) nedeni, bağımlı değişken (Y) ise ondan etkilenen sonucu temsil eder.",
    "u3|Nedensel araştırmalarda X'in Y'ye neden olduğunu söyleyebilmek için aşağıdakilerden hangisi gerekli koşullardan biri DEĞİLDİR?|A) X ve Y'deki değişmeler arasında bir ilgi olmalı.~B) X'teki değişme Y'deki değişmeden zaman içinde daha önce meydana gelmeli.~C) Y'ye etki etmesi olası diğer faktörlerin tümü elimine edilmeli.~D) X'in Y'ye etki ettiğini saptayan ilgili bir teori bulunmalıdır.~E) X ve Y aynı anda, rastgele tesadüflerle ortaya çıkmalıdır.|E) X ve Y aynı anda, rastgele tesadüflerle ortaya çıkmalıdır.|Nedensellik için şans veya tesadüf kabul edilemez ve X (neden), Y'den (sonuçtan) zaman olarak önce gerçekleşmelidir.",
    "u3|Nedensel araştırmalarda, \"Y'ye etki etmesi olası diğer faktörlerin tümü elimine edilmeli\" kuralının amacı nedir?|A) Maliyeti düşürmek.~B) Gözlem sayısını artırmak.~C) Ortaya çıkan sonucun (Y) gerçekten sadece X yüzünden oluştuğundan emin olmak.~D) Anketin süresini kısaltmak.~E) Teoriyi çürütmek.|C) Ortaya çıkan sonucun (Y) gerçekten sadece X yüzünden oluştuğundan emin olmak.|Gerçek nedeni ispatlamak için, sonucu etkileyebilecek diğer tüm bozucu dış etkenler izole edilmeli veya sabit tutulmalıdır.",
    "u3|Nedensel araştırmalarda veri toplamak için en sık kullanılan bilimsel yöntem hangisidir?|A) Odak grup görüşmesi~B) Derinlemesine mülakat~C) Deney~D) İkincil veri taraması~E) Vaka analizi|C) Deney|Neden-sonuç ilişkisini diğer dış faktörleri izole ederek (kontrol altında tutarak) kanıtlamanın en güçlü yolu deneylerdir.",
    "u3|Araştırma tasarımı formüle edilirken aşağıdakilerden hangisi bu aşamanın adımlarından biri değildir?|A) İkincil veri analizi~B) Veri analiz planının geliştirilmesi~C) Örnekleme süreci ve örnek hacminin belirlenmesi~D) Nihai kararın verilip üretimin başlatılması~E) Ölçme ve ölçekleme prosedürlerinin belirlenmesi|D) Nihai kararın verilip üretimin başlatılması|Araştırma tasarımı sadece araştırmanın yönteminin kurgulandığı plandır; üretim kararı gibi yönetsel uygulamalar bu sürecin dışındadır.",
    "u3|Sonuçların kesinliği açısından Keşfedici ve Sonuçlandırıcı araştırmalar arasındaki temel fark nedir?|A) İkisinin de bulguları kesin değildir.~B) İkisinin de bulguları kesindir.~C) Keşfedici araştırmanın bulguları kesin değildir, Sonuçlandırıcı araştırmanın bulguları ise doğrulayıcıdır (kesindir).~D) Keşfedici araştırma kesindir, Sonuçlandırıcı araştırma esnektir.~E) İkisi de sadece varsayımdır.|C) Keşfedici araştırmanın bulguları kesin değildir, Sonuçlandırıcı araştırmanın bulguları ise doğrulayıcıdır (kesindir).|Keşif aşaması sadece yön gösterir, sonuçlandırıcı aşama ise bunu kanıtlar ve karara bağlar.",
    "u3|Araştırma tasarımı belirlenirken izlenecek yollarla ilgili hangisi DOĞRUDUR?|A) Her araştırmaya mutlaka keşfedici araştırma ile başlamak zorunludur.~B) Keşfedici araştırma hiçbir zaman tanımlayıcı araştırmadan önce yapılamaz.~C) Problem hakkında az bilgi sahibi isek keşfedici bir araştırma ile başlamak daha uygundur.~D) Araştırma tasarımı sadece nedensel araştırmaları kapsar.~E) Keşfedici araştırma sadece anketle yapılır.|C) Problem hakkında az bilgi sahibi isek keşfedici bir araştırma ile başlamak daha uygundur.|Konuyu bilmediğimiz durumlarda esnek bir araştırma (keşfedici) ile ön bilgi toplamak en doğru adımdır.",
    "u3|Bir çalışmaya her zaman kesinlikle keşfedici araştırma ile başlanmalıdır diye bir kural var mıdır?|A) Evet, tüm bilimsel süreçler bunu zorunlu kılar.~B) Hayır, böyle bir kaide yoktur; problem zaten netse doğrudan tanımlayıcı veya nedensel araştırmaya geçilebilir.~C) Sadece pazarlama araştırmalarında zorunludur.~D) Sadece tıbbi araştırmalarda zorunludur.~E) Evet, hipotez testleri bunu gerektirir.|B) Hayır, böyle bir kaide yoktur; problem zaten netse doğrudan tanımlayıcı veya nedensel araştırmaya geçilebilir.|Problem ve hipotezler belli ise vakit kaybetmeden doğrudan sonuçlandırıcı tasarımlara geçilir.",
    "u3|Tablo 3.1'e göre \"Sonuçlandırıcı Araştırmalar\"ın çıktıları ne işe yarar?|A) Sadece literatürü kalabalıklaştırır.~B) Karar verme sürecinde bulgular doğrudan girdi olarak kullanılır.~C) Sadece yeni bir keşfedici araştırma başlatır.~D) Geçmişi siler.~E) Yeni teoriler yaratır.|B) Karar verme sürecinde bulgular doğrudan girdi olarak kullanılır.|Sonuçlandırıcı araştırma yöneticinin beklediği kesin bilgiyi verdiği için kararlara doğrudan altlık oluşturur.",
    "u3|Bir yöneticinin, durumun yönlerini değerlendirmesine ve net bir karar almasına yardım eden açıkça tanımlanmış araştırma türü hangisidir?|A) Keşfedici Araştırma~B) Temel Araştırma~C) Felsefi Araştırma~D) Sonuçlandırıcı Araştırma~E) İkincil Veri Araştırması|D) Sonuçlandırıcı Araştırma|Karar alıcılar için somut veriler ve açık bilgi ihtiyaçları Sonuçlandırıcı araştırmalarla (tanımlayıcı/nedensel) sağlanır.",
    "u3|Keşfedici araştırmalar bütçe ve zaman açısından genellikle nasıl tasarlanır?|A) En yüksek maliyet ve uzun zaman alacak şekilde.~B) Sınırsız bütçe ile.~C) Minimum maliyet ve zaman kullanılarak öncül araştırma yapılacak şekilde.~D) Sadece zaman sınırlamasıyla.~E) Maliyet hesaplanmadan.|C) Minimum maliyet ve zaman kullanılarak öncül araştırma yapılacak şekilde.|Henüz yön belli olmadığı için keşif aşamasında büyük bütçeler harcanmaz, hızlı ve ucuz yöntemlerle fikir edinilir.",
    "u3|Araştırma tasarımında, beklenmeyen ve önceden tanımlanmayan anlayışları keşfetmeye karşı duyarlı olmak için özellikle \"esnek\" bırakılan araştırma dönemi hangisidir?|A) Keşfedici araştırma~B) Tanımlayıcı araştırma~C) Nedensel araştırma~D) Sonuçlandırıcı araştırma~E) Kantitatif araştırma|A) Keşfedici araştırma|Konu yeni olduğu için katı kurallar koyulmaz, süreç içinde çıkan yeni fikirlere göre araştırma yön değiştirebilir.",
    "u3|\"Ne sebep oluyor, ne sonucu doğuruyor?\" şeklindeki hipotezlerin test edilmesi amacıyla yapılan araştırma türü hangisidir?|A) Tanımlayıcı~B) Keşfedici~C) Açıklayıcı~D) Nedensel~E) Esnek|D) Nedensel|Adı üzerinde, sebep (neden) ve sonucu birbirine bağlamak ve kanıtlamak nedensel araştırmaların temel görevidir.",
    "u3|Tanımlayıcı araştırmaların amaçları arasında aşağıdakilerden hangisi yer alır?|A) Yeni ve bilinmeyen bir kavramı icat etmek~B) Neden-sonuç ilişkisini ispatlamak~C) Anakütle içinde belli bir davranışı sergileyen grupların yüzdesini tahminlemek~D) Otoritelerin görüşünü almak~E) Laboratuvarda deney yapmak|C) Anakütle içinde belli bir davranışı sergileyen grupların yüzdesini tahminlemek|Bir gruptaki oranları ve özellikleri (Örn: %40'ı X ürününü alıyor) tasvir etmek tanımlayıcı araştırmanın görevidir.",
    "u3|Nedensel araştırmalarda X'in Y'ye etki ettiğini saptayan ilgili bir \"teori\" bulunması zorunluluğu neyi ifade eder?|A) İlişkinin sadece tesadüfi bir istatistik olmamasını, arkasında mantıklı ve bilimsel bir bağ bulunmasını.~B) Her araştırmanın kitap yazmasını.~C) Matematiksel formüllerin yasaklanmasını.~D) Bağımlı değişkenin olmamasını.~E) Araştırmanın sadece üniversitede yapılmasını.|A) İlişkinin sadece tesadüfi bir istatistik olmamasını, arkasında mantıklı ve bilimsel bir bağ bulunmasını.|Örneğin dondurma satışlarıyla güneş gözlüğü satışlarının aynı anda artması bir tesadüftür, aralarında gerçek bir 'nedensel teori' yoktur.",
    "u3|Sık sık biçimsel bir örnekleme planı ile birlikte detaylı bir veri toplama planının hazırlandığı ve veri analizinin kantitatif (nicel) olduğu tasarım grubu hangisidir?|A) Keşfedici~B) Kalitatif~C) Nitel~D) Esnek~E) Sonuçlandırıcı|E) Sonuçlandırıcı|Sonuçlandırıcı araştırmalar (Tanımlayıcı ve Nedensel), sayısal ve biçimsel olarak çok katı planlanmış süreçlerdir.",
    "u3|Keşfedici bir araştırmanın sonucunda (çıktı olarak) genellikle ne elde edilir ve bu bilgi nasıl kullanılır?|A) Nihai karar verilir ve proje kapatılır.~B) Ardından yapılacak olan tanımlayıcı veya nedensel (sonuçlandırıcı) araştırmalara temel ve hipotez oluşturur.~C) Tüm veriler silinir.~D) Sadece gazete haberi yapılır.~E) Sonuçlar kesin olduğu için hemen üretime geçilir.|B) Ardından yapılacak olan tanımlayıcı veya nedensel (sonuçlandırıcı) araştırmalara temel ve hipotez oluşturur.|Keşif süreci asıl büyük araştırmaya (sonuçlandırıcıya) ışık tutmak için yapılır.",
    "u3|Araştırma tasarımı ne zaman kesinlik kazanır ve esnekliğini yitirip katı bir plana dönüşür?|A) Keşfedici araştırmanın en başında~B) İkincil verileri incelerken~C) Sonuçlandırıcı araştırmalara (Tanımlayıcı veya Nedensel) geçildiğinde~D) Uzman mülakatlarında~E) Fikir aşamasında|C) Sonuçlandırıcı araştırmalara (Tanımlayıcı veya Nedensel) geçildiğinde|Artık hipotezler ve anketler sabittir, veri toplanırken plan kafaya göre esnetilemez ve değiştirilemez.",
    "u3|Tablo 3.1'e göre Keşfedici araştırmanın karakteristikleri arasında hangisi bulunur?|A) Veri analizi kantitatiftir.~B) Örneklem büyük ve temsil edicidir.~C) Araştırma süreci yapılandırılmıştır.~D) Gereken bilgi denenmemiş yöntemle tanımlanabilir ve süreç esnektir.~E) Bulgular doğrulayıcıdır.|D) Gereken bilgi denenmemiş yöntemle tanımlanabilir ve süreç esnektir.|Keşfedici araştırmanın doğası gereği kurallara bağlı kalmadan serbestçe hareket etmeyi ve esnekliği gerektirir.",
    "u3|Tanımlayıcı araştırmalar genellikle en az kaç değişken arasındaki etkileşimin tanımlanmasını hedefler?|A) Hiç değişken yoktur.~B) Sadece bir bağımsız değişken.~C) En az iki değişken.~D) Yalnızca bağımlı değişkenler.~E) Sonsuz değişken.|C) En az iki değişken.|Tanımlayıcı araştırmalar genellikle yaş ile gelir gibi en az iki değişken arasındaki durumu ve özellikleri resmetmeyi amaçlar.",
    "u3|Araştırma tasarımının bir araştırma projesinin genel planı olması ne anlama gelir?|A) Sadece bütçeyi göstermesi.~B) Problemi çözmek ve ilgili hipotezleri test etmek için tüm süreçleri detaylandırması ve ihtiyaç duyulan bilgiyi temin etmeyi amaçlaması.~C) Sadece anketörlerin ismini listelemesi.~D) Literatürü kopyalaması.~E) Raporu yazması.|B) Problemi çözmek ve ilgili hipotezleri test etmek için tüm süreçleri detaylandırması ve ihtiyaç duyulan bilgiyi temin etmeyi amaçlaması.|Tasarım, binanın mimari çizimi gibidir; tüm projenin operasyonel olarak nasıl işleyeceğini gösterir.",
    "u3|\"Algılamaları belirlemek\" ve \"İlişkilendirilen değişkenleri belirlemek\" amaçları hangi araştırma türünün kapsamındadır?|A) Keşfedici~B) Nedensel~C) Deneysel~D) Tanımlayıcı~E) Olgubilimsel|D) Tanımlayıcı|Tüketicilerin bir markaya yönelik algılarını saptamak veya kimlerin hangi ürünü tercih ettiğini belirlemek tanımlayıcı araştırmadır.",
    "u3|Aşağıdaki eylemlerden hangisi Keşfedici Araştırmanın amaçlarından biri olan \"Problemi yapılandırmak\" sürecine girer?|A) Seçimleri kimin kazanacağını %0.1 hata payıyla tahmin etmek.~B) Belirsiz olan bir şikayet konusunun aslında 'fiyatlandırma' hatasından kaynaklandığını ön görüşmelerle tespit edip ana sorunu belirginleştirmek.~C) 10 bin kişiye kapalı uçlu anket yapmak.~D) Laboratuvarda bağımsız değişkeni değiştirmek.~E) Regresyon formülü yazmak.|B) Belirsiz olan bir şikayet konusunun aslında 'fiyatlandırma' hatasından kaynaklandığını ön görüşmelerle tespit edip ana sorunu belirginleştirmek.|Ortadaki bulanık durumu netleştirip 'işte asıl problem bu' diyebilmek keşfedici araştırmanın ta kendisidir.",
    "u3|Tanımlayıcı araştırma sonuçları kullanılarak aşağıdakilerden hangisi modellenebilir?|A) Sadece keşfedici süreçler~B) Odak grup mülakatları~C) Değişkenlerin etkisinin tanımlanacağı ve tahmin fonksiyonlarının oluşturulacağı neden sonuç ilişkisi ölçen araştırmalar~D) Felsefi analizler~E) Geçmişin yok sayılması|C) Değişkenlerin etkisinin tanımlanacağı ve tahmin fonksiyonlarının oluşturulacağı neden sonuç ilişkisi ölçen araştırmalar|Tanımlayıcı araştırmanın bulduğu ilişkiler, bir sonraki aşama olan nedensel araştırmalara sağlam bir temel oluşturur.",
"u3|\"Ne yaptığımızı bilseydik, bunun adı araştırma olmazdı, değil mi?\" sözü kime aittir?|A) Isaac Newton~B) Francis Bacon~C) Albert Einstein~D) İbni Haldun~E) Immanuel Kant|C) Albert Einstein|Ünite 3'ün girişinde yer alan bu özlü söz Albert Einstein'a aittir.",
    "u3|Bir araştırmayı yürütmek için oluşturulan, problem çözümünde gerekli bilginin elde edilmesi için gereken süreci ayrıntılandıran genel plana (çatıya) ne ad verilir?|A) Hipotez~B) Araştırma Tasarımı~C) Literatür Taraması~D) Örneklem~E) Veri Analizi|B) Araştırma Tasarımı|Araştırma tasarımı, problemi çözmek ve hipotezleri test etmek için gereken süreçleri detaylandıran genel plandır.",
    "u3|Araştırma tasarımı ile ilgili aşağıdakilerden hangisi yanlıştır?|A) Veri toplama ve analiz aşamalarına yol gösteren plandır.~B) Toplanacak bilginin tipini ve veri kaynaklarını belirler.~C) Araştırmacıya yol gösteren tek bir standart veya ideal tasarım vardır.~D) Doğru ve ekonomik prosedürlerde bilgi toplanmasını sağlar.~E) Bir araştırma projesinin genel planıdır.|C) Araştırmacıya yol gösteren tek bir standart veya ideal tasarım vardır.|Aynı amaçları başaran birçok farklı tasarım olduğundan dolayı, araştırmacıya yol gösteren standart veya ideal 'tek' bir araştırma tasarımı yoktur.",
    "u3|Araştırma tasarımları temel olarak hangi iki ana gruba ayrılır?|A) Nitel ve Nicel~B) Açık ve Kapalı~C) Deney ve Gözlem~D) Keşfedici ve Sonuçlandırıcı~E) Tümevarım ve Tümdengelim|D) Keşfedici ve Sonuçlandırıcı|Araştırma tasarımları en üstte Keşfedici (Exploratory) ve Sonuçlandırıcı (Conclusive) olarak iki ana gruba ayrılır.",
    "u3|Ortalıkta apaçık bulunmayan, henüz ortaya çıkmamış veya gelecekte olabilecek problemleri tanımlamaya yardımcı olan araştırma türü hangisidir?|A) Keşfedici araştırma~B) Tanımlayıcı araştırma~C) Nedensel araştırma~D) Deneysel araştırma~E) Kesin araştırma|A) Keşfedici araştırma|Problemin ne olduğunu dahi tam bilmediğimiz öncül aşamada yapılan araştırmalar keşfedicidir.",
    "u3|Keşfedici araştırmanın özellikleri için aşağıdakilerden hangisi söylenemez?|A) Araştırma süreci esnektir.~B) Kesin ve yapılandırılmış bir plan formatı yoktur.~C) Örneklem genelde küçük ve temsil edici değildir.~D) Temel bilgilerin analizi kalitatif (nitel) olarak gerçekleşir.~E) Değişkenlerin çok iyi tanımlandığı kantitatif (nicel) anket ve deneyler için çok uygundur.|E) Değişkenlerin çok iyi tanımlandığı kantitatif (nicel) anket ve deneyler için çok uygundur.|Keşfedici araştırmada değişkenler henüz net bilinmediği için kesin ve nicel anket/deney sistemleri için uygun DEĞİLDİR.",
    "u3|Keşfedici araştırmalarda genellikle hangi tür veri toplama yöntemleri kullanılır?|A) Sadece laboratuvar deneyleri~B) Büyük çaplı nicel anketler~C) İkincil veri kaynakları, uzman görüşmeleri ve kalitatif (odak grup vb.) yöntemler~D) Sadece istatistiksel matematik modellemeleri~E) Tamsayım yöntemleri|C) İkincil veri kaynakları, uzman görüşmeleri ve kalitatif (odak grup vb.) yöntemler|Konuyu anlamak için uzmanlara danışılır, geçmiş kaynaklar taranır ve esnek odak grup toplantıları yapılır.",
    "u3|Aşağıdakilerden hangisi keşfedici araştırmaların kullanılma amaçlarından biri değildir?|A) Problemi yapılandırmak ve daha kesin tanımlamak~B) Alternatif seçenekleri belirlemek~C) İleriki araştırmalar için hipotezler oluşturmak~D) İki değişken arasındaki neden-sonuç ilişkisini kesin olarak kanıtlamak~E) Problemin çözümü için bakış açısı oluşturmak|D) İki değişken arasındaki neden-sonuç ilişkisini kesin olarak kanıtlamak|Neden-sonuç ilişkisini kanıtlamak Keşfedici araştırmanın değil, Nedensel araştırmanın görevidir.",
    "u3|Belirli araştırma problemlerinin çözümüne yardımcı olan, açıkça tanımlanan amaçları ve bilgi ihtiyaçlarını kapsayan araştırma türü hangisidir?|A) Keşfedici araştırma~B) Sonuçlandırıcı araştırma~C) Felsefi araştırma~D) Teorik araştırma~E) Gözlemsel araştırma|B) Sonuçlandırıcı araştırma|Yöneticiye durumun yönlerini seçmeye ve kesin karar vermeye yardım eden bilgiyi sağlayan araştırma türüdür.",
    "u3|Sonuçlandırıcı araştırmalar kendi içinde hangi iki alt gruba ayrılır?|A) Nicel ve Nitel~B) Temel ve Uygulamalı~C) Keşfedici ve Deneysel~D) Tanımlayıcı ve Nedensel~E) Anket ve Gözlem|D) Tanımlayıcı ve Nedensel|Sonuçlandırıcı araştırmalar durumu tasvir eden (Tanımlayıcı) ve sebep-sonuç ilişkisi kuran (Nedensel) olarak ikiye ayrılır.",
    "u3|Sonuçlandırıcı araştırmaların genel karakteristikleri için hangisi doğrudur?|A) Süreç çok esnektir ve plansızdır.~B) Örneklem küçüktür ve evreni temsil etmez.~C) Veri analizi tamamen kalitatif (nitel) olarak yapılır.~D) Araştırma süreci planlanmış ve yapılandırılmıştır; örneklem büyük ve temsil edicidir.~E) Bulguları kesin değildir, sadece fikir verir.|D) Araştırma süreci planlanmış ve yapılandırılmıştır; örneklem büyük ve temsil edicidir.|Keşfedici araştırmanın aksine sonuçlandırıcı araştırmalarda her şey çok net, planlı ve istatistikseldir.",
    "u3|Pazar potansiyelini belirlemek ya da belirli bir ürünü satın alan tüketicilerin demografik özelliklerini ve tutumlarını saptamak için yapılan sonuçlandırıcı araştırma türü hangisidir?|A) Keşfedici araştırma~B) Nedensel araştırma~C) Tanımlayıcı araştırma~D) Deneysel araştırma~E) Laboratuvar araştırması|C) Tanımlayıcı araştırma|Sadece 'resmi çeken', durumun ne olduğunu veya pazar özelliklerini tanımlayan araştırmalar tanımlayıcıdır.",
    "u3|Tanımlayıcı araştırmaya geçilebilmesi için hangi aşamaların tamamlanmış olması gerekir?|A) Veri analizinin bitmiş olması~B) Değişkenlerin belirlenmesi, problemin tanımlanması ve hipotezlerin oluşturulması~C) Raporun yazılmış olması~D) Deneyin sonuçlanmış olması~E) Nihai kararın alınmış olması|B) Değişkenlerin belirlenmesi, problemin tanımlanması ve hipotezlerin oluşturulması|Tanımlayıcı araştırmalar neyi aradığını bilir, bu nedenle problem ve hipotezler baştan netleşmiş olmalıdır.",
    "u3|Tanımlayıcı araştırmalarda en sık kullanılan veri toplama yöntemleri hangileridir?|A) Sadece uzman mülakatları~B) Deney ve laboratuvar testleri~C) Odak grup ve projeksiyon teknikleri~D) Anket ve gözlem~E) Sadece ikincil veri|D) Anket ve gözlem|Kitleyi tanımlamak için sahadan geniş çaplı veri toplamayı sağlayan anketler ve gözlemler en sık kullanılan yöntemlerdir.",
    "u3|Aşağıdakilerden hangisi tanımlayıcı araştırmaların amaçlarından biri DEĞİLDİR?|A) İlgili grupların özelliklerini tanımlamak~B) Belli bir davranışı sergileyen grupların yüzdesini tahminlemek~C) Sebep olan değişkenler ile sonuçlar arasındaki ilişkiyi ve etkileri bulmak~D) Algılamaları belirlemek~E) İlişkilendirilen değişkenleri belirlemek|C) Sebep olan değişkenler ile sonuçlar arasındaki ilişkiyi ve etkileri bulmak|Sebep-sonuç ilişkisini (etkiyi) bulmak Tanımlayıcı araştırmanın değil, Nedensel araştırmanın amacıdır.",
    "u3|Bağımsız değişken (X) ile bağımlı değişken (Y) arasındaki neden-sonuç ilişkisini ortaya çıkarmak ve hipotezleri test etmek amacıyla yapılan araştırma türü hangisidir?|A) Keşfedici~B) Nedensel~C) Tanımlayıcı~D) Açımlayıcı~E) Felsefi|B) Nedensel|Olayların 'neden' kaynaklandığını ve sonucunun ne olduğunu ispatlamaya çalışan araştırmalar nedensel araştırmalardır.",
    "u3|Kendisindeki değişimler ile bağımlı değişkeni (Y'yi) etkileyen ve ondaki değişime neden olan değişkene ne ad verilir?|A) Sabit değişken~B) Çıktı değişkeni~C) Bağımlı değişken~D) Bağımsız değişken (X)~E) Kontrol değişkeni|D) Bağımsız değişken (X)|Bağımsız değişken (X) nedeni, bağımlı değişken (Y) ise ondan etkilenen sonucu temsil eder.",
    "u3|Nedensel araştırmalarda X'in Y'ye neden olduğunu söyleyebilmek için aşağıdakilerden hangisi gerekli koşullardan biri DEĞİLDİR?|A) X ve Y'deki değişmeler arasında bir ilgi olmalı.~B) X'teki değişme Y'deki değişmeden zaman içinde daha önce meydana gelmeli.~C) Y'ye etki etmesi olası diğer faktörlerin tümü elimine edilmeli.~D) X'in Y'ye etki ettiğini saptayan ilgili bir teori bulunmalıdır.~E) X ve Y aynı anda, rastgele tesadüflerle ortaya çıkmalıdır.|E) X ve Y aynı anda, rastgele tesadüflerle ortaya çıkmalıdır.|Nedensellik için şans veya tesadüf kabul edilemez ve X (neden), Y'den (sonuçtan) zaman olarak önce gerçekleşmelidir.",
    "u3|Nedensel araştırmalarda, \"Y'ye etki etmesi olası diğer faktörlerin tümü elimine edilmeli\" kuralının amacı nedir?|A) Maliyeti düşürmek.~B) Gözlem sayısını artırmak.~C) Ortaya çıkan sonucun (Y) gerçekten sadece X yüzünden oluştuğundan emin olmak.~D) Anketin süresini kısaltmak.~E) Teoriyi çürütmek.|C) Ortaya çıkan sonucun (Y) gerçekten sadece X yüzünden oluştuğundan emin olmak.|Gerçek nedeni ispatlamak için, sonucu etkileyebilecek diğer tüm bozucu dış etkenler izole edilmeli veya sabit tutulmalıdır.",
    "u3|Nedensel araştırmalarda veri toplamak için en sık kullanılan bilimsel yöntem hangisidir?|A) Odak grup görüşmesi~B) Derinlemesine mülakat~C) Deney~D) İkincil veri taraması~E) Vaka analizi|C) Deney|Neden-sonuç ilişkisini diğer dış faktörleri izole ederek (kontrol altında tutarak) kanıtlamanın en güçlü yolu deneylerdir.",
    "u3|Araştırma tasarımı formüle edilirken aşağıdakilerden hangisi bu aşamanın adımlarından biri değildir?|A) İkincil veri analizi~B) Veri analiz planının geliştirilmesi~C) Örnekleme süreci ve örnek hacminin belirlenmesi~D) Nihai kararın verilip üretimin başlatılması~E) Ölçme ve ölçekleme prosedürlerinin belirlenmesi|D) Nihai kararın verilip üretimin başlatılması|Araştırma tasarımı sadece araştırmanın yönteminin kurgulandığı plandır; üretim kararı gibi yönetsel uygulamalar bu sürecin dışındadır.",
    "u3|Sonuçların kesinliği açısından Keşfedici ve Sonuçlandırıcı araştırmalar arasındaki temel fark nedir?|A) İkisinin de bulguları kesin değildir.~B) İkisinin de bulguları kesindir.~C) Keşfedici araştırmanın bulguları kesin değildir, Sonuçlandırıcı araştırmanın bulguları ise doğrulayıcıdır (kesindir).~D) Keşfedici araştırma kesindir, Sonuçlandırıcı araştırma esnektir.~E) İkisi de sadece varsayımdır.|C) Keşfedici araştırmanın bulguları kesin değildir, Sonuçlandırıcı araştırmanın bulguları ise doğrulayıcıdır (kesindir).|Keşif aşaması sadece yön gösterir, sonuçlandırıcı aşama ise bunu kanıtlar ve karara bağlar.",
    "u3|Araştırma tasarımı belirlenirken izlenecek yollarla ilgili hangisi DOĞRUDUR?|A) Her araştırmaya mutlaka keşfedici araştırma ile başlamak zorunludur.~B) Keşfedici araştırma hiçbir zaman tanımlayıcı araştırmadan önce yapılamaz.~C) Problem hakkında az bilgi sahibi isek keşfedici bir araştırma ile başlamak daha uygundur.~D) Araştırma tasarımı sadece nedensel araştırmaları kapsar.~E) Keşfedici araştırma sadece anketle yapılır.|C) Problem hakkında az bilgi sahibi isek keşfedici bir araştırma ile başlamak daha uygundur.|Konuyu bilmediğimiz durumlarda esnek bir araştırma (keşfedici) ile ön bilgi toplamak en doğru adımdır.",
    "u3|Bir çalışmaya her zaman kesinlikle keşfedici araştırma ile başlanmalıdır diye bir kural var mıdır?|A) Evet, tüm bilimsel süreçler bunu zorunlu kılar.~B) Hayır, böyle bir kaide yoktur; problem zaten netse doğrudan tanımlayıcı veya nedensel araştırmaya geçilebilir.~C) Sadece pazarlama araştırmalarında zorunludur.~D) Sadece tıbbi araştırmalarda zorunludur.~E) Evet, hipotez testleri bunu gerektirir.|B) Hayır, böyle bir kaide yoktur; problem zaten netse doğrudan tanımlayıcı veya nedensel araştırmaya geçilebilir.|Problem ve hipotezler belli ise vakit kaybetmeden doğrudan sonuçlandırıcı tasarımlara geçilir.",
    "u3|Tablo 3.1'e göre \"Sonuçlandırıcı Araştırmalar\"ın çıktıları ne işe yarar?|A) Sadece literatürü kalabalıklaştırır.~B) Karar verme sürecinde bulgular doğrudan girdi olarak kullanılır.~C) Sadece yeni bir keşfedici araştırma başlatır.~D) Geçmişi siler.~E) Yeni teoriler yaratır.|B) Karar verme sürecinde bulgular doğrudan girdi olarak kullanılır.|Sonuçlandırıcı araştırma yöneticinin beklediği kesin bilgiyi verdiği için kararlara doğrudan altlık oluşturur.",
    "u3|Bir yöneticinin, durumun yönlerini değerlendirmesine ve net bir karar almasına yardım eden açıkça tanımlanmış araştırma türü hangisidir?|A) Keşfedici Araştırma~B) Temel Araştırma~C) Felsefi Araştırma~D) Sonuçlandırıcı Araştırma~E) İkincil Veri Araştırması|D) Sonuçlandırıcı Araştırma|Karar alıcılar için somut veriler ve açık bilgi ihtiyaçları Sonuçlandırıcı araştırmalarla (tanımlayıcı/nedensel) sağlanır.",
    "u3|Keşfedici araştırmalar bütçe ve zaman açısından genellikle nasıl tasarlanır?|A) En yüksek maliyet ve uzun zaman alacak şekilde.~B) Sınırsız bütçe ile.~C) Minimum maliyet ve zaman kullanılarak öncül araştırma yapılacak şekilde.~D) Sadece zaman sınırlamasıyla.~E) Maliyet hesaplanmadan.|C) Minimum maliyet ve zaman kullanılarak öncül araştırma yapılacak şekilde.|Henüz yön belli olmadığı için keşif aşamasında büyük bütçeler harcanmaz, hızlı ve ucuz yöntemlerle fikir edinilir.",
    "u3|Araştırma tasarımında, beklenmeyen ve önceden tanımlanmayan anlayışları keşfetmeye karşı duyarlı olmak için özellikle \"esnek\" bırakılan araştırma dönemi hangisidir?|A) Keşfedici araştırma~B) Tanımlayıcı araştırma~C) Nedensel araştırma~D) Sonuçlandırıcı araştırma~E) Kantitatif araştırma|A) Keşfedici araştırma|Konu yeni olduğu için katı kurallar koyulmaz, süreç içinde çıkan yeni fikirlere göre araştırma yön değiştirebilir.",
    "u3|\"Ne sebep oluyor, ne sonucu doğuruyor?\" şeklindeki hipotezlerin test edilmesi amacıyla yapılan araştırma türü hangisidir?|A) Tanımlayıcı~B) Keşfedici~C) Açıklayıcı~D) Nedensel~E) Esnek|D) Nedensel|Adı üzerinde, sebep (neden) ve sonucu birbirine bağlamak ve kanıtlamak nedensel araştırmaların temel görevidir.",
    "u3|Tanımlayıcı araştırmaların amaçları arasında aşağıdakilerden hangisi yer alır?|A) Yeni ve bilinmeyen bir kavramı icat etmek~B) Neden-sonuç ilişkisini ispatlamak~C) Anakütle içinde belli bir davranışı sergileyen grupların yüzdesini tahminlemek~D) Otoritelerin görüşünü almak~E) Laboratuvarda deney yapmak|C) Anakütle içinde belli bir davranışı sergileyen grupların yüzdesini tahminlemek|Bir gruptaki oranları ve özellikleri (Örn: %40'ı X ürününü alıyor) tasvir etmek tanımlayıcı araştırmanın görevidir.",
    "u3|Nedensel araştırmalarda X'in Y'ye etki ettiğini saptayan ilgili bir \"teori\" bulunması zorunluluğu neyi ifade eder?|A) İlişkinin sadece tesadüfi bir istatistik olmamasını, arkasında mantıklı ve bilimsel bir bağ bulunmasını.~B) Her araştırmanın kitap yazmasını.~C) Matematiksel formüllerin yasaklanmasını.~D) Bağımlı değişkenin olmamasını.~E) Araştırmanın sadece üniversitede yapılmasını.|A) İlişkinin sadece tesadüfi bir istatistik olmamasını, arkasında mantıklı ve bilimsel bir bağ bulunmasını.|Örneğin dondurma satışlarıyla güneş gözlüğü satışlarının aynı anda artması bir tesadüftür, aralarında gerçek bir 'nedensel teori' yoktur.",
    "u3|Sık sık biçimsel bir örnekleme planı ile birlikte detaylı bir veri toplama planının hazırlandığı ve veri analizinin kantitatif (nicel) olduğu tasarım grubu hangisidir?|A) Keşfedici~B) Kalitatif~C) Nitel~D) Esnek~E) Sonuçlandırıcı|E) Sonuçlandırıcı|Sonuçlandırıcı araştırmalar (Tanımlayıcı ve Nedensel), sayısal ve biçimsel olarak çok katı planlanmış süreçlerdir.",
    "u3|Keşfedici bir araştırmanın sonucunda (çıktı olarak) genellikle ne elde edilir ve bu bilgi nasıl kullanılır?|A) Nihai karar verilir ve proje kapatılır.~B) Ardından yapılacak olan tanımlayıcı veya nedensel (sonuçlandırıcı) araştırmalara temel ve hipotez oluşturur.~C) Tüm veriler silinir.~D) Sadece gazete haberi yapılır.~E) Sonuçlar kesin olduğu için hemen üretime geçilir.|B) Ardından yapılacak olan tanımlayıcı veya nedensel (sonuçlandırıcı) araştırmalara temel ve hipotez oluşturur.|Keşif süreci asıl büyük araştırmaya (sonuçlandırıcıya) ışık tutmak için yapılır.",
    "u3|Araştırma tasarımı ne zaman kesinlik kazanır ve esnekliğini yitirip katı bir plana dönüşür?|A) Keşfedici araştırmanın en başında~B) İkincil verileri incelerken~C) Sonuçlandırıcı araştırmalara (Tanımlayıcı veya Nedensel) geçildiğinde~D) Uzman mülakatlarında~E) Fikir aşamasında|C) Sonuçlandırıcı araştırmalara (Tanımlayıcı veya Nedensel) geçildiğinde|Artık hipotezler ve anketler sabittir, veri toplanırken plan kafaya göre esnetilemez ve değiştirilemez.",
    "u3|Tablo 3.1'e göre Keşfedici araştırmanın karakteristikleri arasında hangisi bulunur?|A) Veri analizi kantitatiftir.~B) Örneklem büyük ve temsil edicidir.~C) Araştırma süreci yapılandırılmıştır.~D) Gereken bilgi denenmemiş yöntemle tanımlanabilir ve süreç esnektir.~E) Bulgular doğrulayıcıdır.|D) Gereken bilgi denenmemiş yöntemle tanımlanabilir ve süreç esnektir.|Keşfedici araştırmanın doğası gereği kurallara bağlı kalmadan serbestçe hareket etmeyi ve esnekliği gerektirir.",
    "u3|Tanımlayıcı araştırmalar genellikle en az kaç değişken arasındaki etkileşimin tanımlanmasını hedefler?|A) Hiç değişken yoktur.~B) Sadece bir bağımsız değişken.~C) En az iki değişken.~D) Yalnızca bağımlı değişkenler.~E) Sonsuz değişken.|C) En az iki değişken.|Tanımlayıcı araştırmalar genellikle yaş ile gelir gibi en az iki değişken arasındaki durumu ve özellikleri resmetmeyi amaçlar.",
    "u3|Araştırma tasarımının bir araştırma projesinin genel planı olması ne anlama gelir?|A) Sadece bütçeyi göstermesi.~B) Problemi çözmek ve ilgili hipotezleri test etmek için tüm süreçleri detaylandırması ve ihtiyaç duyulan bilgiyi temin etmeyi amaçlaması.~C) Sadece anketörlerin ismini listelemesi.~D) Literatürü kopyalaması.~E) Raporu yazması.|B) Problemi çözmek ve ilgili hipotezleri test etmek için tüm süreçleri detaylandırması ve ihtiyaç duyulan bilgiyi temin etmeyi amaçlaması.|Tasarım, binanın mimari çizimi gibidir; tüm projenin operasyonel olarak nasıl işleyeceğini gösterir.",
    "u3|\"Algılamaları belirlemek\" ve \"İlişkilendirilen değişkenleri belirlemek\" amaçları hangi araştırma türünün kapsamındadır?|A) Keşfedici~B) Nedensel~C) Deneysel~D) Tanımlayıcı~E) Olgubilimsel|D) Tanımlayıcı|Tüketicilerin bir markaya yönelik algılarını saptamak veya kimlerin hangi ürünü tercih ettiğini belirlemek tanımlayıcı araştırmadır.",
    "u3|Aşağıdaki eylemlerden hangisi Keşfedici Araştırmanın amaçlarından biri olan \"Problemi yapılandırmak\" sürecine girer?|A) Seçimleri kimin kazanacağını %0.1 hata payıyla tahmin etmek.~B) Belirsiz olan bir şikayet konusunun aslında 'fiyatlandırma' hatasından kaynaklandığını ön görüşmelerle tespit edip ana sorunu belirginleştirmek.~C) 10 bin kişiye kapalı uçlu anket yapmak.~D) Laboratuvarda bağımsız değişkeni değiştirmek.~E) Regresyon formülü yazmak.|B) Belirsiz olan bir şikayet konusunun aslında 'fiyatlandırma' hatasından kaynaklandığını ön görüşmelerle tespit edip ana sorunu belirginleştirmek.|Ortadaki bulanık durumu netleştirip 'işte asıl problem bu' diyebilmek keşfedici araştırmanın ta kendisidir.",
    "u3|Tanımlayıcı araştırma sonuçları kullanılarak aşağıdakilerden hangisi modellenebilir?|A) Sadece keşfedici süreçler~B) Odak grup mülakatları~C) Değişkenlerin etkisinin tanımlanacağı ve tahmin fonksiyonlarının oluşturulacağı neden sonuç ilişkisi ölçen araştırmalar~D) Felsefi analizler~E) Geçmişin yok sayılması|C) Değişkenlerin etkisinin tanımlanacağı ve tahmin fonksiyonlarının oluşturulacağı neden sonuç ilişkisi ölçen araştırmalar|Tanımlayıcı araştırmanın bulduğu ilişkiler, bir sonraki aşama olan nedensel araştırmalara sağlam bir temel oluşturur.",
"u4|Çeşitli kaynaklardan derlenebilen, üzerinde inceleme yapılabilecek her türlü 'bilgi' olarak tanımlanan kavram aşağıdakilerden hangisidir?|A) Veri~B) Literatür~C) Hipotez~D) Model~E) Ölçek|A) Veri|Metinde verinin tanımı; çeşitli kaynaklardan derlenebilen, üzerinde inceleme yapılabilecek her türlü 'bilgi' olarak yapılmıştır.",
    "u4|Bilimsel araştırma sürecinde kullanılan veriler temel olarak hangi iki grupta incelenmektedir?|A) Nitel ve Nicel veriler~B) Açık ve Kapalı veriler~C) Birincil ve İkincil veriler~D) İçsel ve Dışsal veriler~E) Kesikli ve Sürekli veriler|C) Birincil ve İkincil veriler|Araştırma sürecinde kullanılan veriler en temel düzeyde birincil (sahadan toplanan) ve ikincil (hazır olan) veriler olarak ikiye ayrılır.",
    "u4|Araştırmacının amaçları doğrultusunda ilgili anakütle hakkında kişisel olarak (bizzat sahadan) topladığı orijinal verilere ne ad verilir?|A) İkincil veriler~B) Tarihsel veriler~C) Dışsal veriler~D) Birincil veriler~E) Literatür verileri|D) Birincil veriler|Birincil (birinci elden) veriler araştırmacının kendi projesi için orijinal olarak topladığı taze verilerdir.",
    "u4|Aşağıdakilerden hangisi birincil verilerin özelliklerinden (avantajlarından) biridir?|A) Toplama maliyetinin çok düşük olması.~B) Zaman, emek ve masraftan büyük tasarruf sağlaması.~C) Eski ve yanlış olma olasılığının az olması, özel amaca tam cevap vermesi.~D) Önceden başka araştırmacılar tarafından toplanmış olması.~E) Yetenekli uzman araştırmacı bulmanın çok kolay olması.|C) Eski ve yanlış olma olasılığının az olması, özel amaca tam cevap vermesi.|Birincil veriler bizzat araştırmacı tarafından o ana özel toplandığı için günceldir ve amaca tam uyar.",
    "u4|Aşağıdakilerden hangisi birincil veri toplama yöntemlerinden biri olan 'Kalitatif (Nitel)' yöntemler arasında yer almaz?|A) Gözlem~B) Odak Grup~C) Derinlemesine Görüşme~D) Yansıtıcı Teknikler~E) Deney|E) Deney|Deney ve Anket yöntemleri 'Kantitatif (Nicel)' veri toplama yöntemleridir.",
    "u4|Araştırmayı yapan kimseden başka kişi ve kurumlarca, kendi amaçları için daha önce toplanmış olan hazır verilere ne ad verilir?|A) Orijinal veriler~B) Birincil veriler~C) İkincil veriler~D) Ampirik veriler~E) Birinci el kaynaklar|C) İkincil veriler|Başkaları tarafından önceden toplanmış, araştırmacı için hazır durumda olan arşiv bilgilerine ikincil veri denir.",
    "u4|Aşağıdakilerden hangisi ikincil verilerin dezavantajlarından (zayıflıklarından) biridir?|A) Zaman ve emekten tasarruf sağlaması.~B) Toplama maliyetinin yüksek olması.~C) Bilgilerin eski olma ihtimalinin bulunması ve tasnif/ölçü farklılıkları olabilmesi.~D) Toplama sürecinin çok uzun sürmesi.~E) Orijinal amaç için özel olarak toplanması.|C) Bilgilerin eski olma ihtimalinin bulunması ve tasnif/ölçü farklılıkları olabilmesi.|İkincil veri geçmişte başkası tarafından toplandığı için güncelliğini yitirmiş olabilir veya aranan formata tam uymayabilir.",
    "u4|Tablo 4.1'de yer alan Birincil-İkincil Veri Karşılaştırmasına göre, verilerin 'Toplama Amacı' açısından farkı hangisidir?|A) Birincil veri diğer problemler için, ikincil veri üzerinde çalışılan problem için toplanır.~B) Birincil veri üzerinde çalışılan problem için, ikincil veri diğer problemler için toplanmıştır.~C) İkisi de aynı amaç için toplanır.~D) İkincil veri sadece kar amacı gütmeden toplanır.~E) İkisi de sadece devlet tarafından toplanır.|B) Birincil veri üzerinde çalışılan problem için, ikincil veri diğer problemler için toplanmıştır.|Birincil veri masadaki mevcut soruna özeldir, ikincil veri ise zamanında başka bir ihtiyaçtan doğmuştur.",
    "u4|Tablo 4.1'e göre Birincil ve İkincil verilerin 'Toplama Süresi' açısından karşılaştırması nasıldır?|A) Birincil veri kısa, ikincil veri uzundur.~B) İkisi de uzundur.~C) Birincil veri uzun, ikincil veri kısadır.~D) İkisi de anlıktır.~E) Fark yoktur.|C) Birincil veri uzun, ikincil veri kısadır.|Birincil veriyi sahada anket veya deneyle toplamak aylar alabilir; ikincil veriyi arşivden indirmek saniyeler (kısa) sürer.",
    "u4|Araştırma tasarımları ile veri türü ilişkisine göre, 'Nedensel (Neden-Sonuç)' araştırmalarda kullanılması gereken veri türü aşağıdakilerden hangisidir?|A) Sadece ikincil kalitatif veriler~B) Sadece ikincil veriler~C) Sadece birincil kantitatif veriler~D) Sadece uzman görüşmeleri~E) Sadece odak grupları|C) Sadece birincil kantitatif veriler|Nedensel araştırmalar (deneyler), araştırmacının dış değişkenleri kontrol edebileceği orijinal (birincil) ve ölçülebilir (kantitatif) verilere ihtiyaç duyar.",
