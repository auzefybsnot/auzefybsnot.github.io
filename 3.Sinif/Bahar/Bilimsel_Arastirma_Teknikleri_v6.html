    "u9|\"Ne zaman ve nereden alışveriş yaptınız?\" gibi aynı anda iki farklı cevabı ortaya çıkaran sorular anketlerde neden TAVSİYE EDİLMEZ?|A) Çok kısa oldukları için.~B) Deneğin kafasını karıştırıp hangi kısma cevap vereceğini bilememesine (belirsizliğe) yol açtığı için.~C) SPSS'te daha hızlı analiz edildiği için.~D) Doğru yanıt bulmayı kolaylaştırdığı için.~E) Eğlenceli olduğu için.|B) Deneğin kafasını karıştırıp hangi kısma cevap vereceğini bilememesine (belirsizliğe) yol açtığı için.|Bir soruda sadece tek bir şey (Ya ne zaman, ya nereden) sorulmalıdır; çift namlulu sorular ölçüm hatası doğurur.",
    "u9|Soruların uzunluğu ve anlatım biçimiyle ilgili aşağıda verilen kurallardan hangisi DOĞRUDUR?|A) Cümleleri uzun ve süslü tutmak her zaman daha iyidir.~B) Yabancı ve akademik kelimeler kullanmak araştırmayı ciddileştirir.~C) Cümleleri kısa tutmak her zaman için soruların daha rahat anlaşılmasını sağlar.~D) Sorular karmaşık ve çok anlamlı olmalıdır.~E) Deneklere üstten (tepeden) bakan bir dil kullanılmalıdır.|C) Cümleleri kısa tutmak her zaman için soruların daha rahat anlaşılmasını sağlar.|Katılımcıyı yormamak ve net yanıt almak için cümleler kısa, sade ve herkesin anlayacağı bir dilde yazılmalıdır.",
    "u9|Anketlerde duygu yüklü olan ve deneğin soruya tepki vermekten ziyade o kelimeye tepki vermesine neden olan kelimelere (Örn: Fakir, Tembel) ne ad verilir?|A) Önyargılı kelimeler (Yönlendirici sorular)~B) Açık kelimeler~C) Bilimsel terimler~D) Metrik kelimeler~E) Standart terimler|A) Önyargılı kelimeler (Yönlendirici sorular)|Araştırmacı nötr bir dil kullanmalıdır; içinde yargı ve önyargı barındıran kelimeler denekleri savunmaya geçirir veya yönlendirir.",
    "u9|Anketlerde \"-ecek, -acak\" ve \"-ebilir, -abilir\" gibi ekleri barındıran sorular neden potansiyel hata kaynağı olarak görülür ve kaçınılması tavsiye edilir?|A) Saygısızlık ifade ettiği için.~B) Kişileri varsayımlara ve ucu açık tahminde bulunmaya teşvik edip kesin (reel) sonuçlardan uzaklaştırdığı için.~C) Sadece geçmişi ölçtüğü için.~D) İkincil verilerle çakıştığı için.~E) Demografik olduğu için.|B) Kişileri varsayımlara ve ucu açık tahminde bulunmaya teşvik edip kesin (reel) sonuçlardan uzaklaştırdığı için.|Bilimsel araştırma gerçek davranışları ölçmelidir; \"Yarın yağmur yağabilir mi?\" gibi tahmine dayalı sorular hayali veriler üretir.",
    "u9|Ankette yer alan soruların yanıt formatı (biçimi) temel olarak hangi iki türe ayrılır?|A) Doğru ve Yanlış~B) Objektif ve Sübjektif~C) Yapısal Olmayan (Açık Uçlu) ve Yapısal (Kapalı Uçlu)~D) Metrik ve Nonparametrik~E) Pozitif ve Negatif|C) Yapısal Olmayan (Açık Uçlu) ve Yapısal (Kapalı Uçlu)|Deneklerin kendi cümlelerini yazdığı açık uçlu (yapısal olmayan) sorular ile şıkların hazır verildiği kapalı uçlu (yapısal) sorular anketteki ana soru biçimleridir.",
    "u9|Belirli bir yanıt/şık önermeyen ve kişilerin örneğin bir reklam hakkındaki görüşlerini 'kendi sözleri (cümleleri) ile' ifade etmelerine izin veren soru tipi hangisidir?|A) Çoktan seçmeli sorular~B) Kapalı uçlu (Yapısal) sorular~C) Likert tipi sorular~D) Açık uçlu (Yapısal olmayan) sorular~E) Sabit-toplam sorular|D) Açık uçlu (Yapısal olmayan) sorular|Cevaplayıcıyı sınırlandırmayan, serbestçe duygu ve düşüncelerini yazabildiği (nokta nokta bırakılmış) soru türüdür.",
    "u9|Tüm olası cevap seçeneklerinin araştırmacı tarafından önceden belirlenip şıklar halinde (A, B, C, D gibi) sunulduğu soru tipi hangisidir?|A) Yapısal (Kapalı Uçlu) Sorular~B) Yapısal Olmayan Sorular~C) Açık Uçlu Sorular~D) Projektif sorular~E) Serbest sorular|A) Yapısal (Kapalı Uçlu) Sorular|Kullanımı, kodlaması ve tablolaştırılması çok daha kolay olduğu için işletme araştırmalarında en çok (çoktan seçmeli) kapalı uçlu sorular tercih edilir.",
    "u9|Yapısal (Kapalı Uçlu) sorularda \"Cevap Seçeneklerinin İçeriği\" nasıl olmalıdır?|A) Sadece iki şıktan oluşmalıdır.~B) Şıklar birbiriyle içi içe geçmiş olmalıdır.~C) Kapsamlı olmalı ve seçenekler (şıklar) kesinlikle birbiriyle çakışmamalıdır.~D) Seçenekler çok uzun cümlelerden oluşmalıdır.~E) Hiçbiri şıkkı asla konmamalıdır.|C) Kapsamlı olmalı ve seçenekler (şıklar) kesinlikle birbiriyle çakışmamalıdır.|Örneğin bir yaş sorusunda şıklar \"10-20\" ve \"20-30\" olursa, 20 yaşında biri nereyi işaretleyeceğini bilemez. Çakışma (örtüşme) olmamalıdır.",
    "u9|Anketin \"Soru Düzeni (Akışı)\" ile ilgili aşağıda verilen kurallardan hangisi YANLIŞTIR?|A) Sorular mantıklı bir sıra izlemelidir.~B) Önceki sorular güven vermeli ve ilgi uyandırmalıdır.~C) Genelden özele doğru bir sıralama izlenmelidir.~D) Mahcup edici, kişisel ve can sıkıcı (gelir, yaş vb.) sorular anketin en başında (ilk soru olarak) sorulmalıdır.~E) Başka bir konuya geçilmeden önce mevcut konuya ait tüm spesifik sorular bitirilmelidir.|D) Mahcup edici, kişisel ve can sıkıcı (gelir, yaş vb.) sorular anketin en başında (ilk soru olarak) sorulmalıdır.|Buzları kırmak için önce genel ve ilgi çekici sorular sorulur; yaş/maaş gibi kişisel sorular (Ana Veri) anketin en sonuna bırakılır.",
    "u9|Kişisel ve telefon görüşmelerinde tercih edilen, ankete önce \"genel\" sorularla başlayıp adım adım \"daha spesifik/özel\" ve sınırlı sorulara geçilmesini sağlayan düzene (yaklaşıma) ne ad verilir?|A) Açık uçlu yaklaşım~B) Ters yüz edilmiş huni~C) Huni yaklaşımı (düzeni)~D) Karmaşık yaklaşım~E) Spiral düzen|C) Huni yaklaşımı (düzeni)|Huni (genişten dara doğru daralan yapı), konuya yavaşça girip adım adım detaya inmeyi temsil eder.",
    "u9|Bir anketteki \"Soru Yerleşimi (Tasarımı)\" için aşağıdakilerden hangisi İYİ BİR YERLEŞİM kuralı değildir?|A) İyi kalitede (rahat okunan) kâğıt kullanımı~B) Anketin gövdesini (metni) tek bir devasa paragraf halinde yazmak ve hiç boşluk bırakmamak~C) Anketin gövdesini mümkün olduğu kadar kısaltmak~D) Metni bölmek için aralıklar (boşluklar) bırakmak~E) Okumaya yardımcı olmak için farklı (vurgulu) yazı tipleri kullanmak|B) Anketin gövdesini (metni) tek bir devasa paragraf halinde yazmak ve hiç boşluk bırakmamak|Metnin blok halinde, boşluksuz yazılması cevaplayıcıyı sıkar ve okumayı çok zorlaştırır.",
    "u9|Anketin asıl (büyük) kitleye sunulmadan hemen önce, eksikliklerini ve hatalarını (örn: anlaşılmayan kelimeleri) görebilmek amacıyla sınırlı sayıdaki potansiyel cevaplayıcıya uygulanması işlemine ne ad verilir?|A) Nihai raporlama~B) Veri girişi~C) Anket Öntesti (Pilot Test)~D) Tam sayım~E) Geçerlilik analizi|C) Anket Öntesti (Pilot Test)|Öntest (pilot uygulama), soruların düzgün çalışıp çalışmadığını, sürenin yeterliliğini kontrol eden deneme sürümüdür.",
    "u9|Anketin öntesti sürecinde kullanılan \"Bilgi Metodu\" nasıl işler?|A) Deneğin anketi doldururken yüksek sesle düşünmesi istenir.~B) Anket cevaplayıcılara gerçek çalışmadakine benzer şekilde sunulur; anket bittikten sonra soruları anlamada bir problem yaşayıp yaşamadıkları sorulur.~C) Sadece uzmanlar tarafından masa başında okunur.~D) Sadece internetten otomatik test edilir.~E) Deneklerden kendi sorularını yazmaları istenir.|B) Anket cevaplayıcılara gerçek çalışmadakine benzer şekilde sunulur; anket bittikten sonra soruları anlamada bir problem yaşayıp yaşamadıkları sorulur.|Denekler gerçekmiş gibi formu doldurur, ardından (geriye dönük) formda zorlandıkları kısımları araştırmacıya bildirirler.",
    "u9|Anket öntesti yöntemlerinden biri olan \"Protokol Metodu\"nun ayırt edici özelliği nedir?|A) Sadece profesörlerin katılması.~B) Anketin sadece laboratuvarda yapılması.~C) Deneğin anketi doldururken veya görüşme sürerken \"yüksek sesle düşünmesinin\" (anlamlandırma sürecini dışa vurmasının) istenmesi.~D) Sessizce sadece işaretleme yapılması.~E) Cevapların anketör tarafından tahmin edilmesi.|C) Deneğin anketi doldururken veya görüşme sürerken \"yüksek sesle düşünmesinin\" (anlamlandırma sürecini dışa vurmasının) istenmesi.|Kişi içinden geçirdiği \"Acaba burada dün mü yoksa geçen yıl mı kastediliyor?\" şeklindeki tereddütleri sesli söyleyerek anketin zayıf noktasını açık eder.",
    "u9|Anketin öntesti yapılırken denek (örnek) hacmi neye göre belirlenir?|A) Her zaman 10 kişi seçilir.~B) Sadece bütçeye göre belirlenir.~C) Hedef anakütle ne kadar HETEROJEN (çeşitli) ise ve anket ne kadar KARMAŞIK ise, öntest hacmi de o kadar BÜYÜK olmalıdır.~D) Anket karmaşıklaştıkça öntest küçük olmalıdır.~E) Sadece araştırmacının yaşına göre belirlenir.|C) Hedef anakütle ne kadar HETEROJEN (çeşitli) ise ve anket ne kadar KARMAŞIK ise, öntest hacmi de o kadar BÜYÜK olmalıdır.|Eğer evrende çok farklı tiplerde insan varsa, anketin herkes tarafından anlaşıldığından emin olmak için öntest grubu kalabalık ve çeşitli olmalıdır.",
    "u9|Posta ile veya internetten gönderilen anketlerin en başına eklenen, çalışmanın amacını belirten, faydalarını açıklayan ve katılım için onay isteyen kısa yazıya ne ad verilir?|A) Anketin Sonucu~B) Anketin Sunumu / Giriş Mektubu~C) SPSS Verisi~D) Kodlama Kitapçığı~E) Kılavuz|B) Anketin Sunumu / Giriş Mektubu|Katılımcıyı motive eden, kimliğin gizli kalacağını vaat eden ve onu işbirliğine teşvik eden sunum yazısıdır.",
    "u9|Anket formlarında yer alan \"Çoğu ankette cevaplayıcıların tüm soruları cevaplaması gerekmemektedir; bu sorular atlanacaktır\" (Örn: Eğer arabanız yoksa 8. soruya geçiniz) prensibi, soru yerleşimindeki hangi düzene örnektir?|A) Atlanan (Dallanan) bölümler (Yönlendirmeler)~B) Huni yaklaşımı~C) Genelden özele sıralama~D) Ters huni~E) Demografik yerleşim|A) Atlanan (Dallanan) bölümler (Yönlendirmeler)|Cevaplayıcıyı ilgilendirmeyen soruları atlatmak (örn: Erkeklerin hamilelik sorularını atlaması) hem vakit kazandırır hem de yanlış/boş veri girilmesini önler.",
    "u9|Bir anketin uzunluğu ne kadar olmalıdır?|A) En az 10 sayfa olmalıdır.~B) Çok kısa olmalıdır, detaylar atlanmalıdır.~C) Tamamıyla amacın gerektirdiği kadar uzun olmalı, her soru kesinlikle araştırma amaçlarıyla bağlantılı olmalıdır (gereksiz soru olmamalıdır).~D) Sadece evet/hayır soruları içerecek kadar olmalıdır.~E) Denek sıkılana kadar uzatılmalıdır.|C) Tamamıyla amacın gerektirdiği kadar uzun olmalı, her soru kesinlikle araştırma amaçlarıyla bağlantılı olmalıdır (gereksiz soru olmamalıdır).|Makul bir uzunluk kuralı yoktur; ancak veri analizi aşamasında işe yaramayacak/kullanılmayacak tek bir soru bile ankete konmamalıdır.",
    "u9|Anketin öntesti ile ilgili aşağıdakilerden hangisi YANLIŞTIR?|A) Öntest, anket sunulmadan (sahaya inmeden) önce hataların ortaya çıkarılması amacını güder.~B) Öntest araştırmada kullanılacak olanla benzer bir çevrede (ortamda) yürütülmelidir.~C) Öntestteki cevaplayıcılar (pilot grup), hedef anakütlenin temsilcileriyle alakasız, tamamen rastgele kişilerden seçilmelidir.~D) Öntestteki cevaplayıcılar, hedef anakütledekilere benzer özelliklere/davranışlara sahip olmalıdır.~E) Anket ile ilgili soru zorluğu, kelime anlamı, dallanma talimatları gibi her detaya dikkat edilmelidir.|C) Öntestteki cevaplayıcılar (pilot grup), hedef anakütlenin temsilcileriyle alakasız, tamamen rastgele kişilerden seçilmelidir.|Pilot uygulamanın geçerli olması için öntest denekleri, asıl araştırmadaki insan profiline (yaş, eğitim, meslek) BİREBİR benzemelidir.",
    "u9|Aşağıdakilerden hangisi anket yoluyla toplanan verilerde, deneğin 'yanlış cevap' veya 'ölçüm hatası' vermesine yol açan (kaçınılması gereken) bir soru tipidir?|A) Basit ve kısa sorular~B) Deneğin katılıp katılmadığının sorulduğu Negatif Tasarımlı (Kafa karıştırıcı) sorular~C) Şıkları örtüşmeyen sorular~D) Açık uçlu yaş soruları~E) Gözlem içermeyen sorular|B) Deneğin katılıp katılmadığının sorulduğu Negatif Tasarımlı (Kafa karıştırıcı) sorular|\"X ürününü sevmediğinizi düşünmüyor musunuz?\" gibi negatif (çift olumsuz) sorular kişinin algısını karıştırır ve rastgele yanıt vermesine sebep olur.",
    "u9|Ankette yer alan yapısal (kapalı uçlu) sorularda şıkların (cevap seçeneklerinin) \"birbirini tamamen dışlaması ve tüm olasılıkları kapsaması\" için, çok fazla seçeneğin olduğu durumlarda en sona hangi şıkkın eklenmesi yaygındır?|A) Hiçbiri~B) Diğer (Lütfen belirtiniz)~C) Fikrim yok~D) Belki~E) Önemli değil|B) Diğer (Lütfen belirtiniz)|Örneğin favori araba markasını sorarken en popüler 5 tanesi yazılır, geri kalan yüzlerce marka listeyi uzatmasın diye \"Diğer\" başlığı altında toplanır.",
"u10|\"Sürece güvenin, sonuçlar gibi gizli özneyi de ortaya çıkaracaktır.\" sözü kime aittir?|A) Albert Einstein~B) David Harris~C) Brené Brown~D) Terry Pratchett~E) Rensis Likert|B) David Harris|Ünite 10'un girişinde yer alan bu özlü söz David Harris'e aittir.",
    "u10|Gerçek değer ile kaydedilen değer arasındaki fark, bir araştırmanın neyini verir?|A) Sistematik hatasını~B) Örnekleme hatasını~C) Örnekleme dışı hatasını~D) Güvenirliğini~E) Tamsayımını|C) Örnekleme dışı hatasını|Yanıtlayıcı, anketör veya anket formu kaynaklı nedenlerle gerçek (istenilen) değerden sapılmasına örnekleme dışı hata denir.",
    "u10|Doğru Skor Modeli denkleminde (XO = XT + XS + XR), 'XS' neyi ifade eder?|A) Ölçülen Değeri~B) Gerçek Değeri~C) Sistematik Hatayı~D) Tesadüfi (Rastlantısal) Hatayı~E) Standart Sapmayı|C) Sistematik Hatayı|Formülde XO gözlenen skor, XT gerçek skor, XS sistematik hata, XR ise tesadüfi hatayı temsil eder.",
    "u10|Hedef anakütle ile örnekleme çerçevesi arasında ciddi bir örtüşmezlik olduğunda (örneğin milli maç saatinde sokakta anket yapıldığında) ortaya çıkan 'gözlem dışı' hata türüne ne ad verilir?|A) Tepkisiz hata~B) Kayıt hatası~C) Kodlama hatası~D) Kapsam dışı hata~E) Nakil hatası|D) Kapsam dışı hata|Hedef anakütlenin belirli üyelerinin (örn. o saatte evde maç izleyenlerin) örnekte bulunamaması kapsam dışı hatadır.",
    "u10|Özellikle kendi kendine doldurulan posta anketlerinde sıkça gözlemlenen ve bir 'Gözlem Dışı Hata' olan hata türü hangisidir?|A) Kapsam dışı hata~B) Tepkisiz (Cevaplandırma) hatası~C) Kayıt hatası~D) Kodlama hatası~E) Soru hatası|B) Tepkisiz (Cevaplandırma) hatası|Kişinin anketi doldurmaması veya geri göndermemesinden kaynaklanan tepkisizlik/cevaplandırmama hatasıdır.",
    "u10|Aşağıdakilerden hangisi bir 'Gözlem Hatası' türü DEĞİLDİR?|A) Görüşmeci hatası veya soru hatası~B) Kayıt hatası~C) Kodlama hatası~D) Kapsam dışı hata~E) Nakil hatası|D) Kapsam dışı hata|Kapsam dışı hata ve tepkisizlik hataları 'Gözlem Dışı' hatalardır. Diğerleri ise gözlem (veri toplama) aşamasında yapılan hatalardır.",
    "u10|Ölçmelere karışan hatalar türlerine göre kaça ayrılmaktadır?|A) 2 (Geçerli ve Geçersiz)~B) 3 (Sabit, Tesadüfi ve Sistematik)~C) 4 (İçsel, Dışsal, Objektif, Sübjektif)~D) 2 (Doğrusal ve Dairesel)~E) 5 (Açık, Gizli, Yarı-açık, Tam, Kısmi)|B) 3 (Sabit, Tesadüfi ve Sistematik)|Metinde hata türleri Sabit, Sistematik ve Tesadüfi hatalar olarak 3 başlıkta incelenmiştir.",
    "u10|Her ölçme birimi için miktarı değişiklik göstermeyen, her bir ölçümde aynı yönde etki yapan ve miktarı hep aynı oranda olan hatalara ne ad verilir?|A) Sistematik hata~B) Tesadüfi hata~C) Rastlantısal hata~D) Standart hata~E) Sabit hata|E) Sabit hata|Hata miktarının hiçbir ölçümde değişmediği (örn: herkesin 5 puan fazla aldığı) hatalar sabit hatalardır.",
    "u10|Bir terazinin ölçtüğü her nesneyi 10 gram fazla ölçmesi veya öğretmenin her sınav kağıdına 5 puan fazla vermesi hangi hata türüne örnektir?|A) Sistematik hata~B) Sabit hata~C) Tesadüfi hata~D) Tepkisiz hata~E) Kodlama hatası|B) Sabit hata|Her birimde hatanın yönü ve miktarı hep aynı (sabit 10 gr veya 5 puan) olduğu için sabit hatadır.",
    "u10|Sabit hatalar ölçümün 'Güvenirliğini' ve 'Geçerliğini' nasıl etkiler?|A) Güvenirlik değişmez, geçerlik düşer.~B) İkisi de artar.~C) İkisi de düşer.~D) Geçerlik değişmez, güvenirlik düşer.~E) Güvenirlik artar, geçerlik değişmez.|A) Güvenirlik değişmez, geçerlik düşer.|Her ölçümde aynı düzeyde hata yapıldığından tutarlılık (güvenirlik) bozulmaz, ancak amaca hizmet edilmediği için geçerlik (doğruluk) düşer.",
    "u10|Anakütle bireylerinin tamsayımı yapılsa dahi verilerin tanımlanmasında veya toplanmasında ortaya çıkan, geri dönüşü mümkün olmayan ve 'doğruluk' sözcüğüyle ölçülen hata türü hangisidir?|A) Sabit hata~B) Tesadüfi hata~C) Sistematik hata~D) Rastlantısal hata~E) Örnekleme hatası|C) Sistematik hata|Sistematik hata, kurgudaki/tanımlamadaki bir kusurdan kaynaklanır ve doğruluğu (accuracy) doğrudan zedeler.",
    "u10|Ankette doğrudan \"Parfüm kullanınca çekici olduğunuzu düşünüyor musunuz?\" gibi yönlendirici bir soru sormak, hangi hata türüne yol açar?|A) Sabit hata~B) Tesadüfi hata~C) Sistematik hata~D) Kapsam hatası~E) Nakil hatası|C) Sistematik hata|Yanlış/direkt soru tarzı, cevapların genelini belli bir yöne saptıracağı için araştırmada sistematik hataya neden olur.",
    "u10|Büyüklüğü örnek hacmine ve ele alınan anakütledeki değişmelere bağlı olan, 'güvenirlik' sözcüğünün ölçüsü olarak kullanılan hata türü hangisidir?|A) Sabit hata~B) Sistematik hata~C) Doğrusal hata~D) Tesadüfi (Rastlantısal) hata~E) Gözlem dışı hata|D) Tesadüfi (Rastlantısal) hata|Tesadüfi hatanın kaynağı ve yönü belli değildir, güvenirliği (tutarlılığı) bozan temel hata budur.",
    "u10|Uygulanan ankette öğrencinin cinsiyetinin veya sınıfının yanlışlıkla farklı (hatalı) yazılması hangi hata türüne örnek verilebilir?|A) Sistematik hata~B) Sabit hata~C) Kapsam dışı hata~D) Tesadüfi hata~E) Geçerlik hatası|D) Tesadüfi hata|Dikkatsizlik sonucu anlık gerçekleşen, yönü ve miktarı kestirilemeyen hatalar tesadüfi hatalardır.",
    "u10|Aşağıdakilerden hangisi araştırmalarda karşılaşılan hataları önleme yollarından biri DEĞİLDİR?|A) Amaçlar, hipotezler ve ölçekler araştırmanın başında doğru belirlenmelidir.~B) Problemler, değişken ve ölçek türüne uygun yazılmalıdır.~C) Örnekte yer alacak birey sayısı tahmini değil, istatistiksel hesaplama yapılarak bulunmalıdır.~D) Araştırmanın uygulama aşamasında uzmanlardan (istatistikçi vb.) asla yardım alınmamalıdır.~E) Kullanılan istatistik paket programları sadece programı değil, istatistiği de bilenlerce kullanılmalıdır.|D) Araştırmanın uygulama aşamasında uzmanlardan (istatistikçi vb.) asla yardım alınmamalıdır.|Tam tersine, literatürden veya uygulamalı istatistik uzmanından yardım alınması hataları indirgemek için şarttır.",
    "u10|Bir araştırmada elde edilen bilginin sağlamlığı ve ölçeğin standardize olabilmesi HANGİ İKİ temel koşula bağlıdır?|A) Anketör ve Yanıtlayıcı~B) Güvenirlik ve Geçerlik~C) Sabit ve Tesadüfi hata~D) Nitel ve Nicel analiz~E) Tamsayım ve Örneklem|B) Güvenirlik ve Geçerlik|Bilimsel ölçümün temel yapıtaşları aracın güvenilir (tutarlı) ve geçerli (amaca uygun) olmasıdır.",
    "u10|Bir ölçekte, tüm değişkenlerin birbiri ile tutarlılığını ve iç uyumunu ortaya koyan, ölçme aracının hatalardan ne derece arındırılmış olduğunu gösteren kavram nedir?|A) Geçerlik~B) Güvenirlik~C) Temsil edicilik~D) İstatistik~E) Evren|B) Güvenirlik|Güvenirlik (Reliability), aynı şartlarda aynı ölçümün tekrar tekrar aynı sonucu vermesi (tutarlılık) durumudur.",
    "u10|Ölçme aracının konusuna uygunluğu olarak tanımlanan ve 'ölçmek istediğini doğru olarak ölçmesi' anlamına gelen kavram hangisidir?|A) Geçerlik~B) Güvenirlik~C) Nesnellik~D) İstikrarlılık~E) Standart sapma|A) Geçerlik|Bir metre uzunluğu doğru (güvenilir) ölçebilir ama ağırlığı ölçmek için geçerli bir araç değildir; geçerlik amaca uygunluktur.",
    "u10|Ölçek veya testin içindeki maddelerin belli bir kavramsal yapıya sahip olması, yani maddelerin birbirleriyle ilişkili olarak aynı yapıyı ölçmesi, güvenirliğin hangi bileşenidir?|A) İstikrarlılık~B) Temsil edicilik~C) İç tutarlılık~D) Eş değerlilik~E) Nesnellik|C) İç tutarlılık|Soruların kendi aralarında çelişmemesi ve aynı bütünün (kavramın) parçaları olması iç tutarlılıktır.",
    "u10|Aynı anakütleye ait farklı örneklemlerde uygulandığında testin benzer sonuçlar vermesi, güvenirliğin hangi bileşenini ifade eder?|A) İç tutarlılık~B) Temsil edicilik~C) Nesnellik~D) Eş değerlilik~E) İstikrarlılık|B) Temsil edicilik|Testin, farklı alt örneklem gruplarında dahi aynı şekilde çalışarak bütünü temsil edebilme kapasitesidir.",
    "u10|Farklı değerlendiricilerin (gözlemcilerin) aynı kişilerle ilgili olarak benzer puanları vermeleri, güvenirliğin hangi bileşenidir?|A) İstikrarlılık~B) Eş değerlilik~C) Temsil edicilik~D) Nesnellik (Objektiflik)~E) İç tutarlılık|D) Nesnellik (Objektiflik)|Kim değerlendirirse değerlendirsin sonucun değişmemesi nesnellik (objektiflik) bileşenidir.",
    "u10|Güvenirlik katsayısı (Cronbach Alpha vb.) sayısal olarak hangi iki değer arasında değişmektedir?|A) -1 ile +1~B) 1 ile 100~C) -5 ile +5~D) 0 ile 1~E) 0 ile 10|D) 0 ile 1|Güvenirlik katsayısı her zaman 0 (hiç güvenilir değil) ile 1 (tamamen güvenilir) arasında bir değer alır.",
    "u10|Aşağıdakilerden hangisi güvenirliğin hesaplanmasında kullanılan yaygın yöntemlerden biri DEĞİLDİR?|A) Test tekrarı (Test-retest) yöntemi~B) Eşdeğer formlar (Paralel) yöntemi~C) İçsel tutarlılık yöntemi~D) Kapsam geçerliği yöntemi~E) Cronbach Alpha katsayısı|D) Kapsam geçerliği yöntemi|Kapsam geçerliği, adından da anlaşılacağı gibi güvenirliğin değil, geçerliğin bir ölçüm yöntemidir.",
    "u10|Bir ölçme aracının, AYNI denek grubuna aynı koşullarda, belli bir zaman aralığıyla İKİ KEZ uygulanması ve elde edilen ölçümlerin korelasyonuna bakılması yöntemine ne ad verilir?|A) İç tutarlılık yöntemi~B) Eşdeğer formlar yöntemi~C) Test tekrarı (Test-Retest) yöntemi~D) Bölünmüş test çözümlemesi~E) Cronbach Alpha|C) Test tekrarı (Test-Retest) yöntemi|Aynı test, aynı grup, farklı iki zaman. Aradaki zaman farkında ölçümün kararlılığına (istikrarına) bakılır.",
    "u10|Test tekrarı yönteminin uygulanmasındaki EN KRİTİK yön (dikkat edilmesi gereken unsur) aşağıdakilerden hangisidir?|A) Testin uygulanacağı mekanın rengi.~B) İki ölçme arasında bırakılması gereken ZAMAN ARALIĞININ iyi ayarlanması.~C) Testin farklı kişilere yapılması.~D) Testin eşdeğer başka bir forma çevrilmesi.~E) Maliyetinin yüksek olması.|B) İki ölçme arasında bırakılması gereken ZAMAN ARALIĞININ iyi ayarlanması.|Süre çok kısaysa denek soruları hatırlar (yapay yüksek çıkar), süre çok uzunsa ölçülen özellik değişmiş olabilir.",
    "u10|Esas olarak eşdeğer (aynı davranış kalıplarını temsil eden) olan İKİ FARKLI ölçeğin (testin) aynı gruba uygulanması ve sonuçlarının korelasyonuna bakılması yöntemine ne ad verilir?|A) Test tekrarı yöntemi~B) Bölünmüş test çözümlemesi~C) Kuder-Richardson yöntemi~D) Eşdeğer (Paralel) Formlar yöntemi~E) Cronbach Alpha|D) Eşdeğer (Paralel) Formlar yöntemi|Öğrenciye önce A kitapçığının, ardından onun tam bir benzeri (paraleli) olan B kitapçığının verilip tutarlılığının ölçülmesidir.",
    "u10|Test-tekrarı metodu bir zamandan diğerine meydana gelen değişikliklerle (zamanla) ilgilenirken, Paralel (Eşdeğer) form metodu neyle ilgilenir?|A) Tamamen farklı anakütlelerle~B) Tek bir zamandaki değişikliklerle (madde eşdeğerliğiyle)~C) Maliyetlerin düşürülmesiyle~D) Gözlem hatalarıyla~E) Anketör sapmasıyla|B) Tek bir zamandaki değişikliklerle (madde eşdeğerliğiyle)|Paralel formlar, zaman değişiminden ziyade, iki farklı test formunun aynı anda ne kadar tutarlı (eşdeğer) çalıştığına odaklanır.",
    "u10|Güvenirlik katsayısı tespitinde SADECE TEK BİR ÖLÇÜM (bir kez uygulama) gerektiren, her bir sorunun bütün içinde eşit ağırlığa sahip olduğu varsayımına dayanan yöntem grubu hangisidir?|A) Test tekrarı yöntemi~B) Eşdeğer formlar yöntemi~C) İç Tutarlılık yöntemleri~D) Ön test yöntemi~E) Saha deneyi|C) İç Tutarlılık yöntemleri|Anketin sadece bir kez uygulanıp, kendi içindeki soruların birbirleriyle tutarlılığının ölçüldüğü en pratik yöntemdir.",
    "u10|Aşağıdakilerden hangisi İç Tutarlılığı sayısal olarak saptayabilmek için geliştirilmiş üç teknikten biri DEĞİLDİR?|A) Bölünmüş Test Çözümlemesi (Split-half)~B) Kuder-Richardson Formülleri~C) Cronbach Alpha Katsayısı~D) Pearson Çarpım Moment Korelasyonu (Test-tekrarı için)~E) Tüm bu teknikler İç tutarlılık tekniğidir|D) Pearson Çarpım Moment Korelasyonu (Test-tekrarı için)|Pearson korelasyonu test-tekrarı veya eşdeğer formlarda iki farklı uygulamayı kıyaslarken kullanılır. İç tutarlılık teknikleri; Bölünmüş Test, Kuder-Richardson ve Cronbach Alpha'dır.",
    "u10|Bir gruba uygulanan ölçme aracından toplanan verilerin (soruların) İKİ EŞİT PARÇAYA (örn: tekler ve çiftler) bölünüp, bu iki parçanın birbiriyle karşılaştırıldığı en basit güvenirlik belirleme yöntemi hangisidir?|A) Eşdeğer formlar yöntemi~B) Bölünmüş Test Çözümlemesi (Split-half)~C) Kuder-Richardson~D) Cronbach Alpha~E) Test tekrarı|B) Bölünmüş Test Çözümlemesi (Split-half)|Tek bir testin kendi içinde ortadan ikiye bölünüp, iki yarının birbirine uyup uymadığını kontrol eden yöntemdir.",
    "u10|Ölçekte yer alan tüm değişkenlerin (soruların) varyanslarının genel ölçek toplam varyansına oranlanması ile bulunan; SOSYAL BİLİMLERDE en çok kullanılan güvenirlik katsayısı hangisidir?|A) KR-20~B) KR-21~C) Pearson p12~D) Spearman-Brown formülü~E) Cronbach Alpha (α) Katsayısı|E) Cronbach Alpha (α) Katsayısı|Sosyal bilimlerde likert tipi ölçeklerin (iç tutarlılığının) ölçümünde standart ve en yaygın yöntem Cronbach Alpha'dır.",
    "u10|Cronbach Alpha (α) değeri 0.60 ile 0.80 arasında çıkan bir ölçek için hangi yorum yapılır?|A) Ölçek güvenilir değildir.~B) Ölçek düşük güvenirliktedir.~C) Ölçek oldukça güvenilirdir.~D) Ölçek yüksek güvenirliktedir.~E) Ölçek tamamen hatalıdır.|C) Ölçek oldukça güvenilirdir.|Kalaycı'nın ölçeğine göre; <0.40 güvenilir değil, 0.40-0.60 düşük, 0.60-0.80 oldukça güvenilir, 0.80-1.00 yüksek güvenilirliktedir.",
    "u10|Cronbach Alpha değerinin normalde en az %70 (0.70) olması istenir. Ancak 'Keşfedici araştırmalarda' bu sınır en az kaça kadar çekilebilir (kabul edilebilir)?|A) %20~B) %40~C) %60~D) %80~E) %90|C) %60|Keşifsel (yeni) bir araştırma yapılıyorsa %60 (0.60) alfa değeri literatürce geçerli (kabul edilebilir) bir alt sınır sayılır.",
    "u10|İç tutarlılık analizinde, anketteki BİR SORU ÖLÇEKTEN ÇIKARILDIĞINDA Cronbach Alpha (güvenirlik) katsayısı YÜKSELİYORSA, bu durum o soru hakkında neyi gösterir?|A) O sorunun olmazsa olmaz (mükemmel) bir soru olduğunu.~B) O sorunun anketi güçlendirdiğini.~C) O sorunun güvenirliği AZALTAN (bozucu) bir soru olduğunu ve ölçekten çıkarılması gerektiğini.~D) O sorunun kapsam geçerliğini artırdığını.~E) Ölçeğin tamsayıma uygun olduğunu.|C) O sorunun güvenirliği AZALTAN (bozucu) bir soru olduğunu ve ölçekten çıkarılması gerektiğini.|Bir çürük elma sepetteki kaliteyi düşürüyorsa, onu çıkarınca kalite (alpha) artar. Bu tür sorular hatalıdır.",
    "u10|Aşağıdakilerden hangisi bir ölçümün ve elde edilen sonuçların GÜVENİRLİĞİNİ YÜKSELTME yollarından biri DEĞİLDİR?|A) Ölçekte kullanılan soruların/maddelerin sayısını artırmak.~B) Örneklem büyüklüğünü artırmak.~C) Uygulanacak ölçme yönteminin içeriğini katılımcıların bilgi ve algı seviyesine uygun hale getirmek.~D) Soruları açık, net ve anlaşılır yazmak.~E) Anketteki soru sayısını ve örneklemi olabildiğince küçültmek.|E) Anketteki soru sayısını ve örneklemi olabildiğince küçültmek.|Güvenilirliği artırmanın en temel matematiksel yolu soru sayısını (ölçüm noktasını) ve denek sayısını (örneklemi) artırmaktır.",
    "u10|Bir anketteki soruların, sadece ilgili konuyu (örneğin işletme memnuniyetini) ölçmesi ve başka konulara kaymaması, ölçme aracının hangi özelliğe sahip olduğunu gösterir?|A) Tesadüfilik~B) Güvenirlik~C) Geçerlik~D) Bölünmüşlük~E) Sabitlik|C) Geçerlik|Geçerlik, ölçeğin tam olarak \"ölçmesi gereken hedefi\" (konusuna uygunluğunu) vurabilmesidir.",
    "u10|Bir ölçme aracının ölçümlerine hata karışması kaçınılmazdır. Hata miktarı arttıkça ölçme aracının hangi niteliği DOĞRUDAN DÜŞER?|A) Kapsamı~B) Büyüklüğü~C) Hızı~D) Güvenirliği~E) Maliyeti|D) Güvenirliği|Güvenirlik, ölçme aracının hatalardan arınıklık düzeyidir. Hata artarsa tutarlılık (güvenirlik) çöker.",
    "u10|Aşağıdaki güvenirlik belirleme yöntemlerinden hangilerinde İKİ AYRI uygulama yapılması (ölçümün tekrarlanması veya iki ayrı form sunulması) GEREKMEZ?|A) Test tekrarı yöntemi~B) Eşdeğer formlar yöntemi~C) İçsel tutarlılık (Cronbach Alpha vb.) yöntemi~D) Test tekrarı ve Eşdeğer formlar~E) Tüm yöntemler iki uygulama gerektirir|C) İçsel tutarlılık (Cronbach Alpha vb.) yöntemi|İç tutarlılık teknikleri tek bir anketi sadece bir kere uygulayarak (tek oturumda) güvenirliği ölçmeyi sağlar.",
    "u10|Hangi hata türünde 'doğruluk (accuracy)' zedelenirken, hangi hata türünde 'güvenirlik (reliability)' zedelenir?|A) Sabit hata doğruluğu, sistematik hata güvenirliği zedeler.~B) Sistematik hata doğruluğu, tesadüfi hata güvenirliği zedeler.~C) Tesadüfi hata doğruluğu, sabit hata güvenirliği zedeler.~D) Sabit hata güvenirliği, sistematik hata doğruluğu zedeler.~E) Hepsi sadece güvenirliği zedeler.|B) Sistematik hata doğruluğu, tesadüfi hata güvenirliği zedeler.|Metne göre doğruluk sözcüğü sistematik hatanın, güvenirlik sözcüğü ise tesadüfi hatanın ölçüsü olarak kullanılır.",
    "u10|Test tekrarı (Test-retest) yönteminde, iki uygulama arasında geçen ZAMANIN ÇOK KISA TUTULMASI durumunda ne tür bir sonuç ortaya çıkar?|A) Geçerlik sıfıra iner.~B) Katılımcılar soruları tamamen unutur.~C) Yeniden hatırlamayı kolaylaştıracağından, 'yapay (suni)' olarak yükselmiş bir güvenirlik ölçütü çıkar.~D) Ölçülen özellik tamamen değişir ve güvenirlik çok düşük çıkar.~E) Korelasyon negatif çıkar.|C) Yeniden hatırlamayı kolaylaştıracağından, 'yapay (suni)' olarak yükselmiş bir güvenirlik ölçütü çıkar.|Denekler önceki cevaplarını kolayca hatırlayıp aynısını işaretleyeceği için, test mükemmelmiş gibi yapay bir tutarlılık gösterir.",
"u11|\"Elde veri olmadan teori üretmek büyük bir hatadır.\" sözü kime aittir?|A) Albert Einstein~B) Arthur Conan Doyle~C) Brené Brown~D) Terry Pratchett~E) David Harris|B) Arthur Conan Doyle|Ünite 11'in girişinde yer alan bu özlü söz Sherlock Holmes'un yaratıcısı Arthur Conan Doyle'a aittir.",
    "u11|Araştırmacının tarafsızlığının nasıl gerçekleşeceği sorusu, özellikle hangi araştırma türündeki geçerliğin EN BÜYÜK sorunudur?|A) Sadece Deneysel çalışmalardaki~B) Nitel (Kalitatif) çalışmalardaki~C) Tam sayım çalışmalardaki~D) Sadece Nicel (Kantitatif) çalışmalardaki~E) Yalnızca Tarihsel çalışmalardaki|B) Nitel (Kalitatif) çalışmalardaki|Nitel çalışmalarda araştırmacının kendisi bir araç olduğu için (sübjektiflik riski yüksektir), verilerin tarafsızlığını (geçerliği) sağlamak çok zor bir sorundur.",
    "u11|Toplanan verilerin tarafsızlığının ve ölçülen olayın veya değişkenin niteliklerine 'uygunluğunun' ölçüsüne ne ad verilir?|A) Güvenirlik~B) Örneklem~C) Objektiflik~D) Geçerlik~E) Hipotez|D) Geçerlik|Geçerlik, kullanılan ölçme aracının (anketin, terazinin vb.) asıl amacına ne derece hizmet ettiğini (uygunluğunu) gösterir.",
    "u11|Bir testin 'geçerli' olabilmesi için aşağıdakilerden hangisi GEREKLİ koşuldur ancak YETERLİ koşul DEĞİLDİR?|A) Ucuz olması~B) Kısa olması~C) Güvenilir olması~D) Tesadüfi olması~E) Çok şıklı olması|C) Güvenilir olması|Geçerlik için güvenirlik (tutarlılık) şarttır. Ancak her güvenilir (tutarlı) test geçerli (amaca uygun) olmayabilir.",
    "u11|Uygun bir yöntemle ölçme aracının 'güvenirliği (kararlılığı)' saptansa bile, bu durum aşağıdakilerden hangi soruya CEVAP VEREMEZ?|A) \"Araç tutarlı ölçüyor mu?\"~B) \"Maddelerimiz, ölçmek istediğimizi doğru olarak ölçebilir mi? (Amaca uygun mu?)\"~C) \"Test her seferinde aynı sonucu veriyor mu?\"~D) \"Tesadüfi hatalardan arınmış mı?\"~E) \"Korelasyon katsayısı yüksek mi?\"|B) \"Maddelerimiz, ölçmek istediğimizi doğru olarak ölçebilir mi? (Amaca uygun mu?)\"|Güvenirlik sadece tutarlılığı (hedefi hep aynı yerden vurmayı) ölçer; ancak hedef tahtasının doğru olup olmadığını (geçerliği) sorgulamaz.",
    "u11|Ölçme aracında aranan EN ÖNEMLİ özellik aşağıdakilerden hangisidir?|A) Hızı~B) Ucuzluğu~C) Geçerliği~D) Görselliği~E) Sayfa sayısı|C) Geçerliği|Çünkü test sonuçlarının doğru yorumlanıp doğru kararlar verilebilmesi için öncelikle aracın \"doğru şeyi (geçerli olanı)\" ölçüyor olması şarttır.",
    "u11|Bir ölçeğin geçerliği için aşağıdakilerden hangisi SÖYLENEMEZ?|A) Geçerlik bir 'derece' problemidir; yani yüksek, orta veya düşük olabilir.~B) Sadece ölçeğin kendisine değil, kullanış amacına ve uygulandığı gruba da bağlıdır.~C) \"Ölçeğin geçerliği ya vardır ya da yoktur\" şeklinde (siyah-beyaz) düşünülebilir.~D) Doğrudan ölçmelerde geçerlik daha yüksektir.~E) Amaca ne kadar uygunsa geçerlik o kadar yüksek olur.|C) \"Ölçeğin geçerliği ya vardır ya da yoktur\" şeklinde (siyah-beyaz) düşünülebilir.|Geçerlik 'var veya yok' denilecek ikili bir durum değil, amaca hizmet etme 'derecesidir' (Yüksek/Orta/Düşük olarak nitelenir).",
    "u11|Hangi tür ölçmelerde değişkenin yeterince tanımlanamaması nedeniyle geçerlik daha DÜŞÜK olabilmektedir?|A) Doğrudan ölçmelerde~B) Tam sayımlarda~C) Dolaylı ölçmelerde~D) Metrik ölçmelerde~E) Fiziksel ölçmelerde|C) Dolaylı ölçmelerde|Örneğin zekayı doğrudan değil 'soru çözme hızıyla' dolaylı olarak ölçmeye kalktığınızda (araya başka faktörler girdiği için) geçerlik düşebilir.",
    "u11|Aşağıdakilerden hangisi araştırmalarda en yaygın ifade edilen geçerlik türlerinden biri DEĞİLDİR?|A) Görünüş geçerliği~B) Kapsam geçerliği~C) İçsel (Sabit) geçerlik~D) Bir ölçüte dayalı (Kriter) geçerlik~E) Yapı geçerliği|C) İçsel (Sabit) geçerlik|Metinde sayılan temel geçerlik türleri; Görünüş, Kapsam, Kriter ve Yapı geçerliğidir.",
    "u11|Testin ölçmek istediği özellikleri ve davranışları ne derecede kapsadığı ile ilgili olan; ölçekteki her bir maddenin amaca ne derece hizmet ettiğini ifade eden geçerlik türü hangisidir?|A) Yapı geçerliği~B) Görünüş geçerliği~C) Kestirimsel geçerlik~D) Kapsam geçerliği (Content Validity)~E) Uyum geçerliği|D) Kapsam geçerliği (Content Validity)|Eğer matematik sınavı yapıyorsanız, sınavdaki soruların matematiğin tüm 'kapsamını' (geometri, cebir vb.) temsil edip etmediğine bakılır.",
    "u11|Kapsam geçerliğini 'Mantıki' yoldan araştırmak ne anlama gelir?|A) Ölçeği uygulamadan, konunun kavramsal tanımına bakılarak maddelerin konuyu örnekleyip örneklemeyeceğini teorik olarak düşünmektir.~B) Daha önce geliştirilmiş standart bir ölçekle yeni ölçeği aynı anda uygulayıp korelasyon (istatistik) hesaplamaktır.~C) Sadece bilgisayar programı kullanmaktır.~D) Rastgele kura çekmektir.~E) Anketörün yaşına bakmaktır.|A) Ölçeği uygulamadan, konunun kavramsal tanımına bakılarak maddelerin konuyu örnekleyip örneklemeyeceğini teorik olarak düşünmektir.|Matematik, uzmanların bir masaya oturup \"Bu sorular konuyu tam kapsıyor mu?\" diye mantık yürütmesidir.",
    "u11|Kullanılan ölçme aracından elde edilen sonuçların, daha önceden elde edilen başka (kanıtlanmış) ölçümlerle ilişki derecesini (korelasyonunu) inceleyen geçerlik türüne ne ad verilir?|A) Kapsam geçerliği~B) Kriter Geçerliği (Ölçütsel Geçerlik)~C) Yapı geçerliği~D) Görünüş geçerliği~E) Mantıki geçerlik|B) Kriter Geçerliği (Ölçütsel Geçerlik)|Yeni hazırladığınız bir IQ testinin sonuçlarını, dünyaca kabul görmüş (kriter) eski bir IQ testinin sonuçlarıyla kıyaslayıp uyumuna bakmaktır.",
    "u11|İş alımında kullanılan bir 'kişilik testi' sonuçlarının, o kişinin gelecekteki 'işyerindeki performans' sonuçlarıyla yüksek ilişkili çıkması durumunda testin hangi geçerliğe sahip olduğu söylenir?|A) Görünüş geçerliği~B) Yapı geçerliği~C) Uyum geçerliği~D) Kestirimsel Geçerlik (Yordama Geçerliği)~E) Kapsam geçerliği|D) Kestirimsel Geçerlik (Yordama Geçerliği)|Testin, kişinin GELECEKTEKİ performansını veya başarısını (yordama/kestirme) doğru tahmin edebilme gücüdür.",
    "u11|Geliştirilen ölçekten elde edilen puanlarla, belirlenen kriter arasındaki korelasyonun EŞZAMANLI (o anki) olarak değerlendirildiği kriter geçerliği alt türü hangisidir?|A) Uyum Geçerliği (Concurrent Validity)~B) Kestirimsel geçerlik~C) Yapı geçerliği~D) Yordama geçerliği~E) Mantıki geçerlik|A) Uyum Geçerliği (Concurrent Validity)|Örn: Yeni geliştirdiğiniz stres ölçeğiyle, hastanenin kullandığı standart stres ölçeğini \"aynı anda\" hastaya uygulayıp sonuçların uymasına bakmaktır.",
    "u11|Bir teoriye dayalı olarak (özellikle psikoloji alanında) geliştirilmiş bir ölçeğin, o teoride yer alan soyut konseptleri (bilişsel örüntüleri) ne derecede ölçebildiğine ne ad verilir?|A) Kapsam geçerliği~B) Uyum geçerliği~C) Yapı geçerliği (Construct Validity)~D) Görünüş geçerliği~E) Kestirimsel geçerlik|C) Yapı geçerliği (Construct Validity)|Örneğin 'Özgüven' veya 'Zeka' gibi gözle görülmeyen psikolojik bir 'yapıyı (construct)' testin doğru kurup kuramadığının analizidir.",
    "u11|Aşağıdakilerden hangisi \"Yapı Geçerliğini\" değerlendirme yöntemlerinden biri DEĞİLDİR?|A) Alan uzmanları tarafından soruların incelenmesi~B) Sadece anketin kâğıt kalitesine bakılması~C) Aynı yapıyı ölçtüğü bilinen başka bir test ile korelasyon hesaplanması~D) Ölçülecek yapı açısından birbirinden farklı olduğu bilinen iki gruba ölçek uygulanarak sonuçların (anlamlı farkın) karşılaştırılması~E) Testin ölçtüğü yapıları ortaya çıkaran Faktör Analizi yapılması|B) Sadece anketin kâğıt kalitesine bakılması|Kağıt kalitesinin istatistiksel yapı geçerliğiyle (Faktör Analizi vb.) hiçbir ilgisi yoktur.",
    "u11|Bir ölçekte yer alan maddelerdeki ifadelerin her okuyucu ve araştırmacı tarafından aynı şekilde anlaşılması; ölçme aracının neyi ölçtüğünden ziyade \"neyi ölçer GÖRÜNDÜĞÜNÜ\" belirten geçerlik türü hangisidir?|A) Yapı geçerliği~B) Görünüş Geçerliği (Face Validity)~C) Kapsam geçerliği~D) Kriter geçerliği~E) Uyum geçerliği|B) Görünüş Geçerliği (Face Validity)|Testin kapağına veya sorularına ilk bakışta (görünüşte) \"Evet, bu test matematiği ölçüyor gibi duruyor\" denilmesidir.",
    "u11|Bir ölçme işleminde Geçerlik \"_____ ölçülecek?\" sorusunun cevabını ararken, Güvenirlik \"_____ ölçülecek?\" sorusunun cevabını inceler. Boşluklara sırasıyla ne gelmelidir?|A) Nasıl / Nerede~B) Nasıl / Ne~C) Ne / Neden~D) Kim / Ne~E) Ne / Nasıl|E) Ne / Nasıl|Geçerlik hedefin (NE ölçeceğinin) doğru seçilmesidir. Güvenirlik ise hedefin kararlı ve hatasız (NASIL) vurulmasıdır.",
    "u11|Geçerlik ve Güvenirlik ilişkisi hakkında aşağıdakilerden hangisi YANLIŞTIR?|A) Bir ölçmenin geçerli sayılabilmesinin ilk koşulu onun güvenilir olmasıdır.~B) Güvenilir bir ölçek her zaman %100 geçerlidir.~C) Bazen ölçeği güvenilir yapma amacı, onu geçerli kılma amacıyla çatışabilir.~D) Geçerlik aynı şeyi farklı yöntemlerle ölçüp aynı sonucu elde etmeye dayanır.~E) Ölçüm 'geçerli' ise, güvenirlik zaten sağlanmış sayılır.|B) Güvenilir bir ölçek her zaman %100 geçerlidir.|Güvenirlik gerekli koşuldur ama YETERLİ DEĞİLDİR. Bir saat her gün 5 dakika geri kalıyorsa (tutarlıdır/güvenilirdir) ama saati doğru göstermez (geçerli değildir).",
    "u11|Bütün hata türleri (sabit, sistematik, tesadüfi) GEÇERLİĞİ düşürürken, GÜVENİRLİK yalnızca hangi hata türünden etkilenmektedir?|A) Sistematik hatalar~B) Kapsam hataları~C) Sabit hatalar~D) Tesadüfi hatalar~E) Nakil hataları|D) Tesadüfi hatalar|Sabit ve sistematik hatalar düzenli yapıldığı için tutarlılığı (güvenirliği) bozmaz; güvenirlik sadece yönü belli olmayan 'tesadüfi' hatalardan etkilenir.",
    "u11|Araştırmayı geçersiz kılan (içsel geçersizlik kaynakları) dış etkenler kaç başlık altında toplanmıştır?|A) 2 (Deney ve Kontrol)~B) 3 (Nicel, Nitel, Karma)~C) 5 (Geçmiş, Olgunlaşma, Test, Araç, Seçim)~D) 4 (Nominal, Ordinal, Interval, Rasyo)~E) 1 (Sadece Örnekleme)|C) 5 (Geçmiş, Olgunlaşma, Test, Araç, Seçim)|Araştırma sonuçlarını (neden-sonuç ilişkisini) bozabilecek 5 temel içsel geçersizlik kaynağı vardır.",
    "u11|Reklamın satışlar üzerindeki etkisi ölçülürken; 'ekonomik durum, fiyat, dağıtım' gibi reklam Dışındaki TÜM faktörlerin (olayların araştırma süreci dışında cereyan ederek) satışları etkilemesi, hangi tür geçersizlik kaynağıdır?|A) Test etkisi~B) Olgunlaşma etkisi~C) Araç etkisi~D) Geçmişin Etkisi~E) Seçim etkisi|D) Geçmişin Etkisi|Dış dünyada olup biten (geçmiş/tarihsel) olayların, araştırmacının kontrolü dışında deneye müdahale etmesidir.",
    "u11|Araştırmanın yapıldığı zaman süresi uzadıkça, 'araştırmanın veya deneyin İÇİNDE' cereyan eden ve araştırmaya katılan bireylerin bedensel/zihinsel değişimlerinden (örn: yaşlanma, yorulma, acıkma) kaynaklanan geçersizlik türü hangisidir?|A) Seçim etkisi~B) Geçmişin etkisi~C) Olgunlaşma Etkisi~D) Araç etkisi~E) Test etkisi|C) Olgunlaşma Etkisi|Denek 5 saat süren bir testte sıkılır, yorulur veya acıkırsa (olgunlaşırsa) verdiği cevaplar değişir ve geçerlik bozulur.",
    "u11|Araştırmaya katılan bireylerin, tutum/davranışlarının GÖZLENDİĞİNİ veya ölçüldüğünü BİLMELERİ sonucunda koşullanarak (gerçek dışı) davranmaları sonucunda ortaya çıkan geçersizlik kaynağı hangisidir?|A) Test Etkisi~B) Olgunlaşma etkisi~C) Geçmişin etkisi~D) Araç etkisi~E) Çevresel etki|A) Test Etkisi|Birine kamera veya anketör doğrulttuğunuzda doğal davranmayı bırakır, buna \"test edilme\" etkisi denir.",
    "u11|Ön testte (ilk ölçümde) sorulan sorular nedeniyle bireyin konuya 'özel ilgi geliştirmesi' ve daha sonra yapılan ikinci ölçümde bunun sonuçlara (farklılaşma olarak) yansımasına ne ad verilir?|A) Direkt test etkisi~B) İnteraktif Test Etkisi~C) Araç etkisi~D) Olgunlaşma~E) Seçim etkisi|B) İnteraktif Test Etkisi|Örneğin anketör çevre kirliliğini sorar, kişi bu konuyu hiç düşünmemişken anket sayesinde düşünmeye başlar ve ikinci ankette bir \"çevreci\" gibi yanıt verir.",
    "u11|Gözlemleri veya ölçmeleri etkileyen ve araştırma süresince 'ölçme YÖNTEM ve/veya ARAÇLARINDA' (örn: bozulan bir tartı) ortaya çıkan değişikliklerin neden olduğu geçersizlik kaynağı hangisidir?|A) Geçmişin etkisi~B) Test etkisi~C) Olgunlaşma etkisi~D) Seçim etkisi~E) Araç Etkisi|E) Araç Etkisi|Ölçümü yapan anketörün değişmesi veya kalibrasyonu bozulan bir cihazın kullanılması direkt \"aracın\" kendisinden kaynaklanan hatadır.",
    "u11|Araştırma kapsamına alınacak bireylerin tesadüfi DEĞİL, kasten (olağan dışı tepki verenlerden) seçilmesi durumunda manipülasyon sonrası ölçümlerin büyük ölçüde taraflı (sistematik hatalı) çıkmasına neden olan geçersizlik kaynağı hangisidir?|A) Seçim Etkisi~B) Araç etkisi~C) Test etkisi~D) Geçmişin etkisi~E) Olgunlaşma etkisi|A) Seçim Etkisi|Eğer denekleri adil (tesadüfi) atamazsanız, elde ettiğiniz farkın deneyden mi yoksa seçtiğiniz kişilerin baştan 'farklı' olmasından mı kaynaklandığını bilemezsiniz.",
    "u11|Doğru Skor Modeli (XO = XT + XS + XR) formülündeki 'XR' neyi ifade eder?|A) Gerçek değer~B) Sabit hata~C) Gözlenen skor~D) Sistematik hata~E) Tesadüfi (Rastlantısal) Hata|E) Tesadüfi (Rastlantısal) Hata|Formülde XS sistematiği (yönü belli), XR ise tesadüfiliği (random/rastlantısal) hatayı simgeler.",
    "u11|Ölçme sürecindeki Gözlem Hatalarından olan 'Kodlama hatası' ne anlama gelir?|A) Deneğe sorunun yanlış sorulmasıdır.~B) Verinin bilgisayara doğru girilip yanlış kaydedilmesidir.~C) Doğru cevabın anket formunda anketör tarafından yanlış şıkka işaretlenmesidir (Kayıt).~D) Cevabın veri analizi öncesinde yanlış sayısallaştırılması veya hatalı kategorize edilmesidir.~E) Hedef anakütlenin örnekte hiç bulunmamasıdır.|D) Cevabın veri analizi öncesinde yanlış sayısallaştırılması veya hatalı kategorize edilmesidir.|Anketör cevabı doğru almıştır ancak araştırmacı bunu SPSS'e (veya kodlama kâğıdına) geçirirken yanlış numaralandırmıştır (Örn: Erkek yerine 2 yazmak).",
    "u11|Çok iyi sorulmuş bir soruya bireyin; soruların duygusal konular içermesi, suçlama doğurması veya çok ayrıntılı olması gibi 'özel sebeplerden' dolayı yalan/yanlış cevap vermesi HANGİ hata kaynağına girer?|A) Kapsam dışı hata~B) Gözlem Hataları (Cevaplayıcı hatası)~C) Araç hatası~D) Geçmişin etkisi~E) Nakil hatası|B) Gözlem Hataları (Cevaplayıcı hatası)|Soru doğrudur, kodlama doğrudur ama denek çekindiği veya utandığı için bile bile yanlış bilgi (gözlem hatası) verir.",
    "u11|Aşağıdakilerden hangisi bir testin (ölçeğin) güvenirliğini artırmak (hatayı düşürmek) için yapılması gerekenlerden biri DEĞİLDİR?|A) Soruların (maddelerin) sayısını artırmak~B) Örneklem büyüklüğünü artırmak~C) Soruları kapalı ve anlaşılmaz hale getirmek~D) Katılımcı kişilerin bilgi ve algılama seviyesine uygun ölçme yöntemi kullanmak~E) Soruları açık ve anlaşılır yapmak|C) Soruları kapalı ve anlaşılmaz hale getirmek|Anlaşılmaz sorular güvenirliği artırmaz, tam tersine tesadüfi hatalara yol açarak güvenirliği yerle bir eder.",
    "u11|Aynı şeyi FARKLI yöntemlerle ölçme ve AYNI sonucu elde etme amacı, aşağıdaki hangi kavramın temel felsefesidir?|A) Güvenirlik~B) Örnekleme~C) Tesadüfilik~D) Geçerlik~E) Tamsayım|D) Geçerlik|Sıcaklığı hem termometreyle hem de cıvalı ölçekle (farklı yöntemlerle) doğru ölçebiliyorsanız, amacınıza ulaşmışsınız (Geçerlik) demektir.",
    "u11|Aynı şeyi AYNI yöntemlerle tekrar tekrar ölçme ve AYNI sonucu (istikrarı) elde etme amacı, aşağıdaki hangi kavramın temel felsefesidir?|A) Geçerlik~B) Örnekleme~C) Kapsam~D) Güvenirlik~E) Olgunlaşma|D) Güvenirlik|Dün çözdüğün matematik testinden 80, bugün aynı testten yine 80 alıyorsan test 'güvenilir (kararlı)' demektir.",
    "u11|Bir ölçeğin \"görünüş geçerliğinin\" bazı durumlarda GİZLENMESİ neden gerekebilir?|A) Maliyeti düşürmek için.~B) Araştırmacının canı öyle istediği için.~C) Soruların çok açık olması durumunda deneğin savunmaya geçip (veya anketin asıl amacını anlayıp) gerçek dışı/yanıltıcı yanıt vermesini engellemek için.~D) Kâğıttan tasarruf etmek için.~E) SPSS programı hata verdiği için.|C) Soruların çok açık olması durumunda deneğin savunmaya geçip (veya anketin asıl amacını anlayıp) gerçek dışı/yanıltıcı yanıt vermesini engellemek için.|Örn: Psikolojik şiddet eğilimini ölçerken testi kapak yazısında \"Liderlik Testi\" gibi göstermek (görünüşü gizlemek) dürüst yanıt almayı kolaylaştırır.",
    "u11|Yapı geçerliğini belirleme süreci bir ölçüde ne ile aynı (paralel) süreci izler?|A) Sadece bütçe hazırlama süreciyle~B) Reklam kampanyası süreciyle~C) Bilimsel kuram (teori) geliştirme süreciyle~D) Fatura kesme süreciyle~E) Kura çekme süreciyle|C) Bilimsel kuram (teori) geliştirme süreciyle|Yapı (construct) geçerliği, doğrudan soyut bir teori (örn: depresyon kuramı) inşa etmeye benzer adımlar gerektirir.",
"u12|\"Veri olmadan, sadece fikri olan başka bir insansınızdır.\" sözü kime aittir?|A) Albert Einstein~B) W. Edwards Deming~C) Arthur Conan Doyle~D) Terry Pratchett~E) Rensis Likert|B) W. Edwards Deming|Ünite 12'nin girişinde yer alan bu özlü söz ünlü istatistikçi W. Edwards Deming'e aittir.",
    "u12|Toplanan verilerin sınıflanması, kodlanması, çizelge/grafiklerle gösterilmesi ve istatistiksel verilere dayanarak hipotezin sınanması işlemlerinden oluşan sürece ne ad verilir?|A) Literatür Taraması~B) Veri Toplama~C) Verilerin Analizi (Çözümlemesi)~D) Örneklem Seçimi~E) Tamsayım|C) Verilerin Analizi (Çözümlemesi)|Verilerin işlenip istatistiksel testlerle sonuç çıkarılması aşaması veri analizi sürecidir.",
    "u12|Veriler toplandıktan sonra analize hazır hale getirilmesi için sırasıyla hangi GÜÇ işlem (aşama) gerçekleştirilir?|A) Tasarım, Sunum, Raporlama~B) Gözlem, Deney, Anket~C) Düzenleme, Kodlama ve Veri Girişi~D) Hipotez, Varyans, Standart Sapma~E) Nominal, Ordinal, Rasyo|C) Düzenleme, Kodlama ve Veri Girişi|Sahadan gelen anketler önce kontrol edilip düzenlenir, sonra sayılara dönüştürülüp kodlanır ve en son bilgisayara (SPSS vb.) girilir.",
