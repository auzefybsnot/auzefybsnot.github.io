    <style>
        :root { 
            --p: #1a2b4c; --s: #2c3e50; --a: #f39c12; --suc: #27ae60; 
            --bg: #f4f6f8; --c: #ffffff; --t: #2d3436; --b: #dfe6e9; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        
        .sticky-top {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 1000;
            padding-top: 15px;
            padding-bottom: 15px;
        }

        .header { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--a); margin-bottom: 15px; }
        .header h1 { margin: 5px 0; font-size: 1.5em; }
        .header p { margin: 0; font-size: 0.9em; }
        
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: var(--bg); padding: 5px; border-radius: 10px; }
        
        .btn { background: #ecf0f1; color: var(--p); border: 2px solid var(--b); padding: 8px 12px; font-size: 0.95em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; box-sizing: border-box; }
        .btn:hover { background: #bdc3c7; }
        .btn.active { background: var(--a); color: white; border-color: var(--a); }
        .btn-g { background: #d35400; color: white; }
        
        .card { background: var(--c); border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--p); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .tag-u { background: #3498db; } .tag-e { background: var(--p); } .tag-h { background: #e74c3c; }
        .q-text { font-size: 1.1em; font-weight: bold; color: var(--p); margin-bottom: 15px; }
        .opt { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .opt li { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--b); margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .opt li:hover { background: #eafaf1; border-color: var(--suc); }
        .ans-btn { background: var(--s); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .ans-box { display: none; margin-top: 15px; padding: 15px; background: #eafaf1; border-left: 4px solid var(--suc); border-radius: 6px; }
        .ans-true { color: var(--suc); font-weight: bold; margin-bottom: 5px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .sticky-top { position: relative; padding-top: 5px; padding-bottom: 5px; }
            .header { padding: 10px; margin-bottom: 10px; }
            .header h1 { font-size: 1.2em; }
            .header p { font-size: 0.8em; } 
            .controls { gap: 6px; padding: 0; }
            .btn { padding: 10px; font-size: 0.85em; width: 100%; margin: 0; }
            #kategori-secici, #arama { width: 100%; min-width: 100%; }
            .card { padding: 15px; }
            .q-text { font-size: 1em; }
        }
    </style>
<style id="agy-device-styles">
/* ==========================================================================
   AGY UNIVERSAL DEVICE & E-KİTAP MODLARI MOTORU
   ========================================================================== */
:root {
  --agy-font-serif: Georgia, 'Bookerly', 'Charis SIL', serif;
  --agy-font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

/* Navigasyon & Cihaz Barı */
.agy-top-bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px; padding: 10px 16px; margin: 0 0 16px 0;
  background: var(--card, #ffffff);
  border: 1px solid var(--line, #e2e8f0);
  border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  position: sticky; top: 10px; z-index: 9999; backdrop-filter: blur(8px);
}
.agy-bar-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
.agy-bar-right { display: flex; align-items: center; gap: 8px; }

.agy-back-btn {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--agy-font-sans);
  font-size: 13px; font-weight: 800; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--line, #cbd5e1); background: var(--card, #ffffff);
  color: var(--ink, #1e293b); text-decoration: none; transition: .15s ease; white-space: nowrap;
}
.agy-back-btn:hover { background: var(--gutter, #f1f5f9); transform: translateX(-1px); }

.agy-doc-title {
  font-family: var(--agy-font-sans); font-size: 14px; font-weight: 700;
  color: var(--ink, #1e293b); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 480px;
}

.agy-btn {
  font-family: var(--agy-font-sans); font-size: 13px; font-weight: 800;
  cursor: pointer; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--line, #cbd5e1); background: var(--card, #ffffff);
  color: var(--ink, #1e293b); transition: .15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.agy-btn:hover { background: var(--gutter, #f1f5f9); }
.agy-btn:active { transform: scale(0.97); }

.agy-dev-menu-wrap { position: relative; }
.agy-dev-menu {
  position: absolute; right: 0; top: calc(100% + 6px);
  background: var(--card, #ffffff); border: 1px solid var(--line, #cbd5e1);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  padding: 6px; width: 230px; display: none; z-index: 10000;
}
.agy-dev-menu.show { display: block; }
.agy-dev-menu-head {
  font-family: var(--agy-font-sans); font-size: 11px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; padding: 6px 10px 4px;
}
.agy-dev-opt {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 8px 10px; border: none; background: transparent;
  font-family: var(--agy-font-sans); font-size: 13px; font-weight: 700;
  color: var(--ink, #1e293b); border-radius: 6px; cursor: pointer; text-align: left;
}
.agy-dev-opt:hover { background: var(--gutter, #f1f5f9); }
.agy-dev-opt.active { background: #e0f2fe; color: #0284c7; font-weight: 800; }

/* 1. 6" E-OKUYUCU SİYAH-BEYAZ (E-INK MONOCHROME - BOOKERLY) */
[data-device="eink-6-bw"] {
  --bg: #ffffff !important; --paper: #ffffff !important; --card: #ffffff !important;
  --card-bg: #ffffff !important; --raise: #ffffff !important; --gutter: #ffffff !important;
  --c: #ffffff !important; --p: #000000 !important; --s: #000000 !important;
  --text: #000000 !important; --t: #000000 !important; --ink: #000000 !important;

[data-device="eink-6-bw"] body,

  color: #000000 !important; background-color: #ffffff !important;
}
[data-device="eink-6-bw"] .agy-top-bar,
[data-device="eink-6-bw"] .card,
[data-device="eink-6-bw"] .question-card,
[data-device="eink-6-bw"] .cell,
[data-device="eink-6-bw"] .box,
[data-device="eink-6-bw"] .uhead,
[data-device="eink-6-bw"] details.sq,
[data-device="eink-6-bw"] .stat,
[data-device="eink-6-bw"] pre,
[data-device="eink-6-bw"] code {

}
[data-device="eink-6-bw"] .opt,

}
[data-device="eink-6-bw"] .opt.correct,
[data-device="eink-6-bw"] .option.correct,
[data-device="eink-6-bw"] .ok,
[data-device="eink-6-bw"] [class*="correct"],
[data-device="eink-6-bw"] [class*="dogru"] {
  border: 2.5px solid #000000 !important;
  font-weight: 800 !important;
  text-decoration: underline !important;
}

/* 2. 6" RENKLİ E-OKUYUCU */
[data-device="eink-6-color"] body {
  font-family: var(--agy-font-serif) !important; font-size: 16px !important;
}

/* 3. 10.3" TABLET / E-NOTE (BOOKERLY - FERAH OKUMA) */
[data-device="eink-10-bw"] {
  --paper: #ffffff !important; --bg: #ffffff !important;
  --card: #ffffff !important; --card-bg: #ffffff !important;
}
[data-device="eink-10-bw"] .container,
[data-device="eink-10-bw"] .wrap,
[data-device="eink-10-bw"] .shell { max-width: 880px !important; }
[data-device="eink-10-bw"] body {

}

/* 4. AKILLI TELEFON */
[data-device="phone"] .container,
[data-device="phone"] .wrap,

<script>
const rawData = [
`2022 Vize|DartDevTools içerisinde uygulama arayüzüne yerleşen objelerin nasıl konumlandıklarını gördüğümüz arayüzün adı (başlığı) nedir?|A) Welcome Screen~B) Form Viewer~C) Gesture Detector~D) Layout Editor~E) Widget Inspector|E) Widget Inspector|💡 Açıklama: Widget Inspector, arayüz elemanlarının konumunu ve özelliklerini incelemek için kullanılan araçtır.`,
`2022 Vize|Arayüzün yenilenmesi gerekiyorsa hazırlanan arayüz bileşeninin Stateful Widget türünde olması gerekir. Stateful Widget arayüz hiyerarşisinde performans açısından ele alınacak olursa, olması gereken yeri neresidir?|A) Arayüz ağacını oluşturan bileşenlerin en üst seviyesinde kök eleman olarak bulunmalıdır.~B) Arayüzde etkileşim sonucu güncellenmesi gereken tüm bileşenleri saracak en alt seviyede olmalıdır.~C) Scaffold arayüz bileşeninin hemen altında Container bileşenlerininse üstünde yer almalıdır.~D) SetState metodunun içerisinde çağrılacak şekilde yerleştirilmelidir.~E) Arayuzu oluşturan bileşenlerden en alt seviyede yaprak eleman olarak bulunmalıdır.|B) Arayüzde etkileşim sonucu güncellenmesi gereken tüm bileşenleri saracak en alt seviyede olmalıdır.|💡 Açıklama: Stateful Widget, gereksiz yeniden çizmeleri önlemek ve performansı artırmak için sadece güncellenmesi gereken alt bileşenleri sarmalıdır.`,
`2022 Vize|Sabit tanımlama final ve const anahtar kelimeleri ile yapılabilmektedir. Bu hususta aşağıdaki ifadelerin hangisi yanlıştır?|A) Final çalışma zamanı (run time) bir sabit tanımlamak için kullanılır.~B) Final değeri ilk sefer atandıktan sonra kod içerisinde değiştirilemez.~C) Const derleme zamanı (compile time) bir sabit tanımlamak için kullanılır.~D) Const değerinin ilk ataması tanımlandığı satırdan daha sonra yapılabilir.~E) Const bir tanımlamaya başka bir const ifadenin işleme sokulmuş hali atanabilir.|D) Const değerinin ilk ataması tanımlandığı satırdan daha sonra yapılabilir.|💡 Açıklama: Const, derleme zamanında sabittir ve değeri tanımlandığı anda atanmalıdır. Atama daha sonra yapılamaz.`,
`2022 Vize|Aşağıdaki değişken tanımlamalarından hangisi hem int hem de double türü değer saklayabilir?|A) double x;~B) var x=0~C) int x;~D) final double x;~E) num x;|E) num x;|💡 Açıklama: num veri türü, Dart dilinde hem int hem de double türünden sayısal değerleri kapsayan ebeveyn sınıftır.`,
`2022 Vize|Aşağıda belirtilen ifadelerden hangisi mobil platformları için geliştirilen işletim sistemlerinin kendi sundukları API üzerinden yazılım geliştirmeyi ifade eden mobil programlama türüdür?|A) Katmanlı (Layered)~B) Mobil Web (Mobile Web)~C) Çekirdek (Kernel)~D) Doğal (Native)~E) Cross-Platform (Çok Ortam Destekli)|D) Doğal (Native)|💡 Açıklama: İşletim sisteminin kendi sunduğu API'ler ile o platforma özgü yazılım geliştirmeye Native (Doğal) mobil programlama adı verilir.`,
`2022 Vize|Bir Flutter projesinde "lib" klasörü altında bulunan kod dosyasının hangisidir?|A) .yaml~B) .flutter~C) .dart~D) .bin~E)|C) .dart|💡 Açıklama: Flutter projelerinde yazılan uygulama kodları lib klasörü altında .dart uzantılı dosyalar içerisinde bulunur.`,
`2022 Vize|Aşağıdakilerden hangisi Navigator API içerisinde bulunulan sayfadan bir önceki sayfaya dönmeyi sağlayan fonksiyon çağrısıdır?|A) Navigator.move~B) Navigator.back~C) Navigator.return~D) Navigator.pop~E) Navigator.push|D) Navigator.pop|💡 Açıklama: Navigator.pop fonksiyonu, mevcut sayfayı yığından çıkararak bir önceki sayfaya dönmeyi sağlar.`,

`2022 Vize|Flutter'da, "Center" isimli arayüz bileşeninin yapıcı(constructor) fonksiyonunun hangi parametresi Widget? türünde bir değer alır?|A) onTap~B) key~C) boxDecoration~D) child~E) children|D) child|💡 Açıklama: Center bileşeni, içerisine yerleştirilen tek bir alt bileşeni ortalamak için child parametresini kullanır.`,
`2022 Vize|Arayüz bileşeni ağacında hiyerarşik olarak aşağıdakilerin hangisinin altında bir başka arayüz bileşeni görülemez?|A) Row~B) Scaffold~C) Icon~D) Column~E) Container|C) Icon|💡 Açıklama: Icon arayüz bileşeni salt görsel bir öğedir ve kendi içinde başka bir alt bileşen (child) barındıramaz.`,
`2022 Vize|Dart programlama dilinde extends ile miras alma yoluyla türetilen bir sınıfta ebeveyn sınıfın özelliklerine ve metotlarına erişmek için hangi anahtar kelime kullanılır?|A) super~B) elder~C) this~D) parent~E) upper|A) super|💡 Açıklama: Miras alınan ebeveyn (üst) sınıfın özelliklerine ve metotlarına erişmek için super anahtar kelimesi kullanılır.`,
`2022 Vize|Aşağıdakilerden hangisi Flutter projesinin hangi paketleri içerdiği gibi ayarlarının yapıldığı dosyanın adıdır?|A) pubspec.yaml~B) README.md~C) analysis options.yaml~D) main.dart~E) launch.json|A) pubspec.yaml|💡 Açıklama: pubspec.yaml dosyası, Flutter projelerinde kullanılacak bağımlılıkların (paketlerin) ve projenin genel ayarlarının tutulduğu yapılandırma dosyasıdır.`,
`2022 Vize|Point bir sınıf ise sınıf tanımlaması içerisinde Point(this.x, this.y); gibi bir kod parçacığı hangi işlevi yerine getirmektedir?|A) Abstract (soyut) bir metot tanımlaması yapar.~B) Sınıfın üye değişkenlerine ilk değer atayan yapılandırıcı fonksiyon tanımlar.~C) Sınıfın '''(x)=y''' formunda bir fonksiyon gibi kullanılmasını sağlar.~D) Sınıfın x ve y adındaki iki örneğini birleştirerek yeni bir Point sınıfı tanımlar.~E) Sınıfın bir örneğini üretir.|B) Sınıfın üye değişkenlerine ilk değer atayan yapılandırıcı fonksiyon tanımlar.|💡 Açıklama: İlgili yazım, sınıfın örnek (instance) değişkenlerine ilk değer atamasını yapan kısa bir yapıcı (constructor) formudur.`,
`2022 Vize|Dart'ta miras alma yolu ile aktarılan fonksiyonların ezilerek baştan tanımlanması gerekiyorsa kullanılan annotation hangisidir?|A) @supress~B) @deprecated~C) @override~D) @renew~E) @overload|C) @override|💡 Açıklama: Miras alınan bir metodun alt sınıfta yeniden tanımlanması (ezilmesi) durumunda @override annotasyonu kullanılır.`,

    // 1. SORULARI BİRLEŞTİREN FONKSİYON
    function sorulariBirlestir(dataArray) {
        const soruMap = new Map();

        dataArray.forEach(item => {
            if (!item || item.trim() === '') return;
            
            const parts = item.split('|');
            if (parts.length < 4) return; 
            
            let tagsRaw = parts[0];
            const question = parts[1].trim(); 
            const options = parts[2];
            const correctAnswer = parts[3];
            const explanation = parts[4] ? parts[4] : '';

            let tagsList = tagsRaw.split(',').map(t => t.trim());
            let mevcutSayi = 1;

            tagsList = tagsList.filter(t => {
                const match = t.match(/(\d+)\s*Kez Çıktı/i);
                if (match) {
                    mevcutSayi = parseInt(match[1]);
                    return false; 
                }
                return true;
            });

            if (soruMap.has(question)) {
                let kayit = soruMap.get(question);
                kayit.count += mevcutSayi; 
                
                tagsList.forEach(t => {
                    if (!kayit.tags.includes(t)) {
                        kayit.tags.push(t);
                    }
                });
            } else {
                soruMap.set(question, {
                    tags: tagsList,
                    options: options,
                    correctAnswer: correctAnswer,
                    explanation: explanation,
                    count: mevcutSayi
                });
            }
        });

        const birlestirilmisData = [];
        for (let [qText, data] of soruMap.entries()) {
            let finalTags = [...data.tags];
            if (data.count > 1) {
                finalTags.push(`${data.count} Kez Çıktı!`);
            }
            
            const itemString = `${finalTags.join(',')}|${qText}|${data.options}|${data.correctAnswer}|${data.explanation}`;
            birlestirilmisData.push(itemString);
        }

        return birlestirilmisData;
    }

   // 2. EKRANA BASTIRMA FONKSİYONU (Renklendirme Geliştirilmiş Versiyon)
    function renderQuestions(data) {
        const container = document.getElementById('q-container');
        container.innerHTML = '';
        
        if(data.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Kriterlerinize uygun soru bulunamadı.</p>';
            return;
        }

        data.forEach((item, index) => {
            const parts = item.split('|');
            const tagsRaw = parts[0];
            const question = parts[1];
            const options = parts[2].split('~');
            const correctAnswer = parts[3];
            const explanation = parts[4] || '';

            const card = document.createElement('div');
            card.className = 'card';

            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'tags';
            
            tagsRaw.split(',').forEach(tag => {
                tag = tag.trim();
                if(!tag) return;
                const span = document.createElement('span');
                span.className = 'tag';
                
                let lowerTag = tag.toLowerCase();
                if(lowerTag.includes('ünite') || lowerTag.match(/^u\d+/)) {
                    span.classList.add('tag-u');
                } else if(lowerTag.includes('banko') || lowerTag.includes('kez çıktı')) {
                    span.classList.add('tag-h');
                } else {
                    span.classList.add('tag-e');
                }
                
                span.textContent = tag;
                tagsDiv.appendChild(span);
            });

            const qDiv = document.createElement('div');
            qDiv.className = 'q-text';
            qDiv.textContent = (index + 1) + ". " + question;

            const optUl = document.createElement('ul');
            optUl.className = 'opt';
            
            options.forEach(opt => {
                const li = document.createElement('li');
                li.textContent = opt;
                li.onclick = function() {
                    // Önce bu sorudaki tüm şıkları varsayılan (gri) haline getirerek sıfırla
                    Array.from(optUl.children).forEach(child => {
                        child.style.backgroundColor = '#f8f9fa';
                        child.style.borderColor = 'var(--b)';
                        child.style.color = 'var(--t)';
                        child.style.fontWeight = 'normal';
                    });
                    
                    // Cevap kontrolü
                    if(opt.trim() === correctAnswer.trim()) {
                        // DOĞRU ŞIKKA TIKLANDIYSA: Canlı Yeşil Yap
                        this.style.backgroundColor = '#d4edda';
                        this.style.borderColor = '#28a745';
                        this.style.color = '#155724';
                        this.style.fontWeight = 'bold';
                    } else {
                        // YANLIŞ ŞIKKA TIKLANDIYSA: Canlı Kırmızı Yap
                        this.style.backgroundColor = '#f8d7da';
                        this.style.borderColor = '#dc3545';
                        this.style.color = '#721c24';
                        this.style.fontWeight = 'bold';
                        
                        // KULLANICIYA YARDIM: Aynı esnada doğru olan şıkkı da otomatik yeşile boya
                        Array.from(optUl.children).forEach(child => {
                            if(child.textContent.trim() === correctAnswer.trim()) {
                                child.style.backgroundColor = '#d4edda';
                                child.style.borderColor = '#28a745';
                                child.style.color = '#155724';
                                child.style.fontWeight = 'bold';
                            }
                        });
                    }
                };
                optUl.appendChild(li);
            });

            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster';
            
            const ansBox = document.createElement('div');
            ansBox.className = 'ans-box';
            ansBox.style.display = isAllOpen ? 'block' : 'none';
            ansBox.innerHTML = `<div class="ans-true">Cevap: ${correctAnswer}</div>${explanation ? `<div><em>Açıklama:</em> ${explanation}</div>` : ''}`;

            btn.onclick = () => {
                if (ansBox.style.display === 'block') {
                    ansBox.style.display = 'none';
                    btn.textContent = 'Cevabı Göster';
                } else {
                    ansBox.style.display = 'block';
                    btn.textContent = 'Cevabı Gizle';
                }
            };

            card.appendChild(tagsDiv);
            card.appendChild(qDiv);
            card.appendChild(optUl);
            card.appendChild(btn);
            card.appendChild(ansBox);

            container.appendChild(card);
        });
    }

function agySetDevice(dev, save=true) {
  document.documentElement.setAttribute('data-device', dev);

  localStorage.setItem('agy_theme', next);
}

  const wrap = document.querySelector('.agy-dev-menu-wrap');
  if(wrap && !wrap.contains(e.target)) {
    const m = document.getElementById('agyDevMenu');
    if(m) m.classList.remove('show');
  }
});
(function agyInit() {
  const savedDev = localStorage.getItem('agy_device') || 'desktop';
  const savedThm = localStorage.getItem('agy_theme') || 'light';
  agySetDevice(savedDev, false);
  document.documentElement.setAttribute('data-theme', savedThm);
})();
</script>
