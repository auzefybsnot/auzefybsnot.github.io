<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUZEF Yöneylem</title>
    <style>
        :root { 
            --p: #1a2b4c; --s: #2c3e50; --a: #f39c12; --suc: #27ae60; 
            --bg: #f4f6f8; --c: #ffffff; --t: #2d3436; --b: #dfe6e9; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        
        .sticky-top {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 1000;
            padding-top: 15px;
            padding-bottom: 15px;
        }

        .header { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--a); margin-bottom: 15px; }
        .header h1 { margin: 5px 0; font-size: 1.5em; }
        .header p { margin: 0; font-size: 0.9em; }
        
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: var(--bg); padding: 5px; border-radius: 10px; }
        
        .btn { background: #ecf0f1; color: var(--p); border: 2px solid var(--b); padding: 8px 12px; font-size: 0.95em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; box-sizing: border-box; }
        .btn:hover { background: #bdc3c7; }
        .btn.active { background: var(--a); color: white; border-color: var(--a); }
        .btn-g { background: #d35400; color: white; }
        
        .card { background: var(--c); border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--p); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .tag-u { background: #3498db; } .tag-e { background: var(--p); } .tag-h { background: #e74c3c; }
        .q-text { font-size: 1.1em; font-weight: bold; color: var(--p); margin-bottom: 15px; }
        .opt { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .opt li { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--b); margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .opt li:hover { background: #eafaf1; border-color: var(--suc); }
        .ans-btn { background: var(--s); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .ans-box { display: none; margin-top: 15px; padding: 15px; background: #eafaf1; border-left: 4px solid var(--suc); border-radius: 6px; }
        .ans-true { color: var(--suc); font-weight: bold; margin-bottom: 5px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .sticky-top { position: relative; padding-top: 5px; padding-bottom: 5px; }
            .header { padding: 10px; margin-bottom: 10px; }
            .header h1 { font-size: 1.2em; }
            .header p { font-size: 0.8em; } 
            .controls { gap: 6px; padding: 0; }
            .btn { padding: 10px; font-size: 0.85em; width: 100%; margin: 0; }
            #kategori-secici, #arama { width: 100%; min-width: 100%; }
            .card { padding: 15px; }
            .q-text { font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="sticky-top">
        <div class="header">
            <h1>AUZEF Yöneylem</h1>
            <p>YBS OZEL (Tüm Sorular)</p>
        </div>

        <div class="controls">
            <button class="btn btn-g" onclick="toggleAll()">👁️ Tüm Cevapları Aç/Kapat</button>

            <select class="btn" id="kategori-secici" onchange="filter(this.value)" style="background: var(--p); color: white; min-width: 180px; text-align: center; font-weight:bold; padding:8px; border-radius:6px; cursor:pointer;">
                <option value="all">📚 Tüm Havuz (Hepsi)</option>
                <optgroup label="Sınavlar">
                     <option value="vize">📅 Vizeler (Tümü)</option>
                     <option value="final">📅 Finaller (Tümü)</option>
                     <option value="büt">📅 Bütünlemeler</option>
                     
                </optgroup>
            </select>

            <button class="btn" style="background: #e74c3c; color:white;" onclick="document.getElementById('kategori-secici').value='b'; filter('b')">🔥 Banko Sorular</button>

            <input type="text" id="arama" class="btn" placeholder="🔍 Soru veya cevapta kelime ara..." onkeyup="aramaYap()" style="background: white; color: black; cursor: text; text-align: left; min-width: 250px;">
        </div>
    </div>
    
    <div id="q-container"></div>

</div>

<script>
const rawData = [
    `2023-2024 Vize, 2025-2026 Büt|Aşağıdakilerden hangisi belirsizlik halinde karar vermede kullanılan yaklaşımlardan biri değildir?|A) Diğer Seçenek~B) Diğer Seçenek~C) Diğer Seçenek~D) Sezgisel olasılık kriteri~E) Pişmanlık kriteri|D) Sezgisel olasılık kriteri| Belirsizlik hali, sonuçların olasılıklarının bilinmediği durumdur. Bu durumda matematiksel olarak tanımlanmış standart kriterler (Laplace, Wald, Hurwicz, Savage) kullanılır. Literatürde "Sezgisel olasılık kriteri" adında standart bir belirsizlik kriteri bulunmamaktadır.`,
    `2023-2024 Vize, 2022-2023 Büt|Aşağıdakilerden hangisi Yöneylem Araştırması'nın ilk olarak kullanıldığı alandır?|A) Diğer Seçenek~B) Diğer Seçenek~C) Askeri faaliyetler~D) Diğer Seçenek~E) Diğer Seçenek|C) Askeri faaliyetler| Yöneylem Araştırması (YA), II. Dünya Savaşı sırasında İngiliz ve Amerikan ordularının sınırlı kaynakları en etkin şekilde kullanma ihtiyacından doğmuştur.`,
    `2023-2024 Vize, 2025-2026 Büt|Aşağıdaki ifadelerden hangisi Doğrusal Programlama Gevşetmesini (Relaxation) açıklamaktadır?|A) Karar değişkenleri üzerinde tüm tamsayı veya 0-1 kısıtlarının atılarak, elde edilen doğrusal programlama problemidir.~B) Karar değişkenleri üzerinde tüm tamsayı veya 0-1 kısıtlarının~C) Diğer Seçenek~D) Diğer Seçenek~E) Diğer Seçenek|A) Karar değişkenleri üzerinde tüm tamsayı veya 0-1 kısıtlarının atılarak, elde edilen doğrusal programlama problemidir.| "Gevşetme" (Relaxation), zor bir problemin kısıtlarını hafifleterek daha kolay çözülebilir bir hale getirmektir.`,
    `2023-2024 Vize|Aşağıdakilerden hangisi Yöneylem Araştırması'nın kullandığı bilimsel yöntem aşamaları arasında sayılamaz?|A) Diğer Seçenek~B) Diğer Seçenek~C) Diğer Seçenek~D) Diğer Seçenek~E) Modelin tersine incelenmesi|E) Modelin tersine incelenmesi| Yöneylem Araştırması süreci standart bilimsel adımları izler: Problemin tanımlanması, Modelin kurulması, vb. "Modelin tersine incelenmesi" diye bir adım yoktur.`,
    `2023-2024 Vize|Aşağıdaki karar değişkeni birimlerinden hangisi kesinlikle tamsayıdır?|A) Diğer Seçenek~B) Diğer Seçenek~C) Adet~D) Diğer Seçenek~E) Diğer Seçenek|C) Adet| Tamsayılı programlamada değişkenlerin kesirli olamaması gerekir. "Adet" fiziksel doğası gereği bölünemez.`,
    `2023-2024 Vize|(Grafik sorusu: (4,0) ve (0,3) noktalarından geçen doğru ve altı taranmış) Grafikte renklendirilmiş alanı gösteren kısıt hangisidir?|A) Diğer Seçenek~B) Diğer Seçenek~C) Diğer Seçenek~D) Diğer Seçenek~E) 3x_1+ 4x_2 <= 12|E) 3x_1+ 4x_2 <= 12| Paydalar 12'de eşitlenirse 3x1+4x2=12 elde edilir. Taralı alan doğrunun alt tarafı olduğu için eşitsizlik "küçük eşit" (<=) olmalıdır.`,
    `2023-2024 Vize, 2024-2025 Vize, 2025-2026 Vize|Hangi karar probleminde her seçime ilişkin tam bir bilgi var olup ortaya çıkacak olan olayın gerçekleşme olasılığı 1'dir?|A) Sezgisel Karar Verme~B) Çok Kriterli Karar Verme~C) Belirlilik Halinde Karar Verme~D) Belirsizlik Halinde Karar Verme~E) Risk Halinde Karar Verme|C) Belirlilik Halinde Karar Verme| Olasılığın 1 (%100) olması, sonucun kesin olarak bilindiği anlamına gelir. Hiçbir risk veya belirsizlik içermeyen bu duruma "Belirlilik" denir.`,
    `2023-2024 Vize, 2025-2026 Vize|Aşağıdakilerden hangisi karar tipleri ile ilgili olarak kullanılan sınıflandırmalardan biri değildir?|A) Gerçek veya simüle kararlar~B) Alt ve üst kademe kararları~C) Kişi ve grup kararları~D) Stratejik ve operasyonel kararlar~E) Belirlilik ve belirsizlik şartları altında verilen kararlar|A) Gerçek veya simüle kararlar| Literatürde "Gerçek veya simüle" diye temel bir karar sınıflandırması yoktur; simülasyon bir yöntemdir, karar tipi değildir.`,
    `2024-2025 Vize|Aşağıdakilerden hangisi karar tiplerine ilişkin yapılan sınıflamalardan biri değildir?|A) Alt ve üst kademe kararları~B) Stratejik ve operasyonel kararlar~C) Kişi ve grup kararları~D) Limitli ve limitsiz kararlar~E) Programlanabilen ve programlanamayan kararlar|D) Limitli ve limitsiz kararlar| Karar tipleri literatürde stratejik/operasyonel, kişi/grup, programlanabilen/programlanamayan gibi sınıflandırılır.`,
    `2023-2024 Vize, 2022-2023 Final|Aşağıdakilerden hangisi karar değişkenlerinin sıfır ya da pozitif olması gerekliliğini ifade eden Doğrusal Programlama varsayımıdır?|A) Diğer Seçenek~B) Diğer Seçenek~C) Diğer Seçenek~D) Negatif olmama~E) Diğer Seçenek|D) Negatif olmama| Matematiksel modelde X_j >= 0 ifadesi ile gösterilir. Gerçek hayatta negatif değerlerin anlamsız olduğunu ifade eder.`,
    `2022-2023 Büt, 2023-2024 Vize, 2024-2025 Vize, 2025-2026 Vize|y=12+3x Verilen denklem sistemine göre çizilecek doğrunun Y eksenini kestiği nokta aşağıdakilerden hangisidir?|A) 12~B) 0~C) 1~D) 4~E) 3|A) 12| Bir doğrunun Y eksenini kestiği noktayı bulmak için denklemde x yerine 0 yazılır. y = 12 + 3(0) => y = 12.`,
    `2023-2024 Vize|Yöneylem Araştırması incelenen problemi, içinde bulunduğu sistemin bütün unsurlarıyla... incelemeyi esas alır. Hangi özellik açıklanmaktadır?|A) Diğer Seçenek~B) Diğer Seçenek~C) Bütünleşik yaklaşım~D) Diğer Seçenek~E) Diğer Seçenek|C) Bütünleşik yaklaşım| Sistemin alt parçalarını tek tek optimize etmek yerine, parçaların birbirleriyle olan etkileşimini ve sistemin tamamını bir bütün olarak ele alma ilkesine "Bütünleşik Yaklaşım" denir.`,
    `2022-2023 Vize, 2023-2024 Vize, 2024-2025 Büt, 2025-2026 Final|Aşağıdakilerden hangisi Yöneylem Araştırması'nın uygulama alanlarından biri değildir?|A) Bulut teknolojisi~B) Karar destek ve uzman sistemler~C) Yatırım planlama~D) Üretim planlama~E) Benzetim|A) Bulut teknolojisi| Yöneylem Araştırması; üretim, stok, yatırım gibi karar verme problemlerinde kullanılır. "Bulut teknolojisi" bir optimizasyon problemi türü değildir.`,
    `2022-2023 Final, 2023-2024 Vize|Aşağıdakilerden hangisi karar verme süreci aşamalarından biri değildir?|A) Duyarlılık analiz yapılması~B) Diğer Seçenek~C) Diğer Seçenek~D) Diğer Seçenek~E) Diğer Seçenek|A) Duyarlılık analiz yapılması| Duyarlılık analizi, karar yapıldıktan sonra, parametre değişimlerinin etkisini ölçmek için yapılan ilave bir testtir, zorunlu bir adım değildir.`,
    `2023-2024 Vize|(Grafik sorusu: (6,0) ve (0,2) noktaları, üst taraf taranmış) Kısıtları hangisidir?|A) Diğer Seçenek~B) Diğer Seçenek~C) Diğer Seçenek~D) Diğer Seçenek~E) 2x_1+x_2 <= 12 ve 3x_1 + 6x_2 >= 12|E) 2x_1+x_2 <= 12 ve 3x_1 + 6x_2 >= 12| Grafikteki doğrulardan biri (6,0) ve (0,2)'den geçer.`,
    `2023-2024 Vize, 2025-2026 Büt|Aşağıdakilerden hangisi primal bir problemin dualinin alınmasının nedenlerinden biri değildir?|A) Duyarlılık analizinde kullanabilmek~B) Ekonomik açıdan yorumlar yapabilmek~C) Problemi daha basit hale dönüştürüp kolaylıkla çözmek~D) Diğer Seçenek~E) Dejenere modeli çözmek için|E) Dejenere modeli çözmek için| Dejenerasyon, simpleks algoritmasının kendi iç kurallarıyla çözülür, dualite alma sebebi değildir.`,
    `2023-2024 Vize, 2025-2026 Vize|Karar değişkenlerinin tamamının ikili (binary) formda olması koşulunun bulunduğu karar modeline verilen isimdir?|A) Saf Sıfır-Bir Tamsayılı Programlama~B) Karma Tamsayılı Programlama~C) Saf Tamsayılı Programlama~D) Doğrusal Tamsayılı Programlama~E) Karma Sıfır-Bir Tamsayılı Programlama|A) Saf Sıfır-Bir Tamsayılı Programlama| "Saf" kelimesi değişkenlerin tamamını, "Sıfır-Bir" ise değişkenlerin sadece 0 veya 1 değerini (binary) alabileceğini belirtir.`,
    `2023-2024 Vize|(Primal model veriliyor: Min 2x_1+x_2+6x_3...) Hangisi dual modelde yer alan kısıtlardan biri değildir?|A) Diğer Seçenek~B) 2u_1 + u_2 + 6u_3 <= 7~C) Diğer Seçenek~D) Diğer Seçenek~E) Diğer Seçenek|B) 2u_1 + u_2 + 6u_3 <= 7| B şıkkındaki katsayılar (2, 1, 6) Primal Amaç Fonksiyonunun katsayılarıdır; bu değerler Dual modelin kısıtlarının sağ taraf sabitleri olmalıdır.`,
    `2023-2024 Vize|Aşağıdakilerden hangisi bir Doğrusal Programlama Modelinde yer alan karar değişkenlerinin bazılarının tamsayı olması koşulunun bulunduğu karar modelidir?|A) Diğer Seçenek~B) Karma Tamsayılı Programlama~C) Diğer Seçenek~D) Diğer Seçenek~E) Diğer Seçenek|B) Karma Tamsayılı Programlama| Modeldeki değişkenlerin bir kısmı sürekli (virgüllü), bir kısmı tamsayı ise bu modele "Karma" (Mixed) model denir.`,
    `2023-2024 Vize|Aşağıda dualite ile ilgili verilen ifadelerden hangisi yanlıştır?|A) Diğer Seçenek~B) Diğer Seçenek~C) Diğer Seçenek~D) Primal problemde n tane karar değişkeni olduğunda, dual problemde n tane değişken olur.~E) Diğer Seçenek|D) Primal problemde n tane karar değişkeni olduğunda, dual problemde n tane değişken olur.| Primal problemdeki karar değişkeni sayısı (n), dual problemdeki kısıt sayısına eşit olur.`,
    `2022-2023 Final, 2023-2024 Vize, 2025-2026 Vize|Primal: Min x_1+x_2+6x_3, Sağ taraflar: 10, 3, 7. Dual amaç fonksiyonu nedir?|A) maks 10u_1+9u_2+7u_3~B) maks 10u_1+3u_2+7u_3~C) min 10u_1+3u_2+7u_3~D) maks 1u_1+1u_2+6u_3~E) Diğer Seçenek|B) maks 10u_1+3u_2+7u_3| 1. Primal Min olduğu için Dual Maks olur. 2. Primal kısıtların sağ taraf değerleri Dual amaç fonksiyonunun katsayıları olur.`,
    `2022-2023 Final, 2025 Final|Verilen geçiş matrisine göre iki adım sonraki periyotta B seçeneğinden B seçeneğine geçme olasılığı aşağıdakilerden hangisidir?|A) 0,61~B) 0,444~C) 0,556~D) 0,984~E) Diğer Seçenek|A) 0,61| B durumundan başlayıp iki adım sonra tekrar B'de olmak için iki olası yol vardır. Toplam Olasılık: 0,61`,
    `2022-2023 Final|Maks X_1-X_2+3X_3 (Kısıt Sağ Tarafları: 10, 2, 6). Primali verilen modelin dual amaç fonksiyonu aşağıdakilerden hangisidir?|A) Diğer Seçenek~B) min 10u_1+2u_2 + 6u_3~C) Diğer Seçenek~D) Diğer Seçenek~E) Diğer Seçenek|B) min 10u_1+2u_2 + 6u_3| Primal problem "Maksimum" ise Dual problem "Minimum" olur.`,
    `2022-2023 Final, 2025-2026 Büt|Aşağıdakilerden hangisi bireyin başarısının diğer bireylerin seçimlerine dayalı olduğu ve seçimler esnasında bazı stratejik durumların matematiksel olarak davranış biçimlerini yakalamaya çalışan yöneylem araştırması yaklaşımıdır?|A) Benzetim~B) Karar Ağaçları~C) Oyun Teorisi~D) Analitik Hiyerarşi Prosesi~E) Markov Zinciri|C) Oyun Teorisi| Birden fazla karar vericinin (oyuncunun) birbirlerinin sonucunu etkilediği stratejik etkileşim durumlarını matematiksel olarak oyun teorisi inceler.`,
    `2022-2023 Final|"Kullanılacak kriter sayısı... asgari sayıda olması gerektiği gibi azami bir sayıyı da geçmemesi beklenmektedir." ifadesi hangi özelliği tanımlar?|A) Diğer Seçenek~B) Yeterlilik~C) Diğer Seçenek~D) Diğer Seçenek~E) Diğer Seçenek|B) Yeterlilik|`,
    `2022-2023 Final|Aşağıdakilerden hangisi karar vericinin kontrolü altında olmayan faktörlerden olup seçimi etkileyen çevreyi yansıtır?|A) Diğer Seçenek~B) Diğer Seçenek~C) Doğa Durumu~D) Diğer Seçenek~E) Diğer Seçenek|C) Doğa Durumu|`,
    `2022-2023 Final, 2024-2025 Büt|Aşağıdakilerden hangisi tipik bir oyunda bulunması gereken kavramlardan biri değildir?|A) Strateji~B) Hakem~C) Kazanç~D) Denge durumu~E) Oyuncular|B) Hakem| Oyun teorisi modellerinde Oyuncular, Stratejiler, Kazançlar ve Denge durumu temel kavramlardır. "Hakem" matematiksel modelin zorunlu bir parçası değildir.`,
    `2022-2023 Final|Aşağıdaki ifadelerden hangisi Saf Sıfır-Bir Tamsayılı Programlama modelini tanımlamaktadır?|A) Diğer Seçenek~B) Diğer Seçenek~C) Diğer Seçenek~D) Diğer Seçenek~E) Karar probleminde yer alacak karar değişkenlerinin tamamının 0 ya da 1 değerlerinden oluşması gerektiği durumunda kullanılan modeldir.|E) Karar probleminde yer alacak karar değişkenlerinin tamamının 0 ya da 1 değerlerinden oluşması gerektiği durumunda kullanılan modeldir.|`,
    `2022-2023 Final|Aşağıdakilerden hangisi Hedef Programlama türleri arasında sayılamaz?|A) Diğer Seçenek~B) Diğer Seçenek~C) Diğer Seçenek~D) Tartılı hedef programlama~E) Diğer Seçenek|D) Tartılı hedef programlama|`,
    `2022-2023 Final|Analitik Hiyerarşi Prosesi (AHP) ile incelenen bir karar probleminde oluşturulan karar matrisinin köşegen elemanları aşağıdakilerden hangisidir?|A) Diğer Seçenek~B) Diğer Seçenek~C) 1~D) Diğer Seçenek~E) Diğer Seçenek|C) 1|`,
    `2022-2023 Final|Aşağıdakilerden hangisi tamsayılı programlama problemlerinin çözümünde kullanılan yöntemlerdendir?|A) Diğer Seçenek~B) Dal-Sınır yöntemi~C) Diğer Seçenek~D) Diğer Seçenek~E) Diğer Seçenek|B) Dal-Sınır yöntemi|`,
    `2022-2023 Final, 2023-2024 Final|Aşağıdakilerden hangisi Çok Nitelikli Karar Verme (ÇNKV) yöntemlerinden biri değildir?|A) TOPSIS~B) VIKOR~C) Hedef Programlama~D) Analitik Ağ Prosesi~E) Analitik Hiyerarşi Prosesi|C) Hedef Programlama| TOPSIS, VIKOR, AHP çok nitelikli karar verme yöntemleridir. Hedef Programlama ise çok amaçlı (MODM) bir yöntemdir.`,

    `2023-2024 Büt, 2024-2025 Büt|Aşağıdaki ifadelerden hangisi Markov özelliğini tanımlar?|A) Bir durumdan diğer duruma geçişin sistemin daha önceki durumlarına bağlı olması~B) Bir sistemin aynı anda iki durumda olamaması~C) Durumlar arası geçiş için geçiş olasılıklarının bulunmaması~D) Sonraki durumların belirlenebilmesi için halihazırdaki durum haricinde daha önceki durumların bilinmesine gerek olmaması~E) Bir sistemin olası tüm durumlarını içeren durum uzayına sahip olması|D) Sonraki durumların belirlenebilmesi için halihazırdaki durum haricinde daha önceki durumların bilinmesine gerek olmaması| Markov zincirlerinin en temel özelliği "hafızasızlık" (memoryless) özelliğidir. Gelecekteki durum, geçmişe değil sadece şu anki (mevcut) duruma bağlıdır.`,

    `2024-2025 Büt|3x+2y<=12 kısıtı kartezyen düzlemde gösterildiği durumda doğrunun y eksenini kestiği nokta aşağıdakilerden hangisidir?|A) 12~B) 2~C) 4~D) 3~E) 6|E) 6| Bir doğrunun y eksenini kestiği noktayı bulmak için x'e 0 (sıfır) değeri verilir. 3(0) + 2y = 12 denkleminden 2y = 12 ve y = 6 sonucu elde edilir.`,
    `2025 Final, 2024-2025 Büt|Bir hedef programlama modelinde, X hammaddesi kullanımının en fazla 300 birim olarak belirlendiği bir hedefe ilişkin çözüm sonucunda, X hammaddesi kullanımının 320 birim olarak gerçekleşmiş olduğu saptanmıştır. Hedef Programlama modelinin çözümüne göre aşağıdakilerden hangisi kesinlikle doğrudur?|A) Pozitif yönlü sapma 20 birimdir.~B) Negatif yönlü sapma -20 birimdir.~C) Negatif yönlü sapma 20 birimdir.~D) Pozitif yönlü sapma -20 birimdir.~E) Pozitif yönlü sapma değeri O'dır.|A) Pozitif yönlü sapma 20 birimdir.| Hedeflenen 300 birim, gerçekleşen ise 320 birimdir. 320 - 300 = +20 birimlik bir hedef aşımı vardır ve bu durum pozitif sapma (d+) ile ifade edilir.`,
    `2024-2025 Büt, 2025-2026 Büt|I. Bağımsızlık II. Bağımlılık III. Homojenlik Yukarıda verilen kavramlardan hangisi ya da hangileri Analitik Hiyerarşi Prosesinin aksiyomlarındandır?|A) I ve III~B) I, II ve III~C) II~D) I ve II~E) II ve III|A) I ve III| AHP'nin temel aksiyomları arasında Bağımsızlık (kriterlerin ve alternatiflerin yapı içinde bağımsız değerlendirilmesi) ve Homojenlik (karşılaştırılan elemanların büyüklüklerinin aşırı orantısız olmaması) bulunur.`,

  // --- BURADAN İTİBAREN KOPYALAYIN ---
    let isAllOpen = false;
    let temizlenmisData = []; // Birleştirilmiş verileri global tutalım ki arama/filtreleme yapabilelim

    // 1. SORULARI BİRLEŞTİREN FONKSİYON
    function sorulariBirlestir(dataArray) {
        const soruMap = new Map();

        dataArray.forEach(item => {
            if (!item || item.trim() === '') return;
            
            const parts = item.split('|');
            if (parts.length < 4) return; 
            
            let tagsRaw = parts[0];
            const question = parts[1].trim(); 
            const options = parts[2];
            const correctAnswer = parts[3];
            const explanation = parts[4] ? parts[4] : '';

            let tagsList = tagsRaw.split(',').map(t => t.trim());
            let mevcutSayi = 1;

            tagsList = tagsList.filter(t => {
                const match = t.match(/(\d+)\s*Kez Çıktı/i);
                if (match) {
                    mevcutSayi = parseInt(match[1]);
                    return false; 
                }
                return true;
            });

            if (soruMap.has(question)) {
                let kayit = soruMap.get(question);
                kayit.count += mevcutSayi; 
                
                tagsList.forEach(t => {
                    if (!kayit.tags.includes(t)) {
                        kayit.tags.push(t);
                    }
                });
            } else {
                soruMap.set(question, {
                    tags: tagsList,
                    options: options,
                    correctAnswer: correctAnswer,
                    explanation: explanation,
                    count: mevcutSayi
                });
            }
        });

        const birlestirilmisData = [];
        for (let [qText, data] of soruMap.entries()) {
            let finalTags = [...data.tags];
            if (data.count > 1) {
                finalTags.push(`${data.count} Kez Çıktı!`);
            }
            
            const itemString = `${finalTags.join(',')}|${qText}|${data.options}|${data.correctAnswer}|${data.explanation}`;
            birlestirilmisData.push(itemString);
        }

        return birlestirilmisData;
    }

   // 2. EKRANA BASTIRMA FONKSİYONU (Renklendirme Geliştirilmiş Versiyon)
    function renderQuestions(data) {
        const container = document.getElementById('q-container');
        container.innerHTML = '';
        
        if(data.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Kriterlerinize uygun soru bulunamadı.</p>';
            return;
        }

        data.forEach((item, index) => {
            const parts = item.split('|');
            const tagsRaw = parts[0];
            const question = parts[1];
            const options = parts[2].split('~');
            const correctAnswer = parts[3];
            const explanation = parts[4] || '';

            const card = document.createElement('div');
            card.className = 'card';

            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'tags';
            
            tagsRaw.split(',').forEach(tag => {
                tag = tag.trim();
                if(!tag) return;
                const span = document.createElement('span');
                span.className = 'tag';
                
                let lowerTag = tag.toLowerCase();
                if(lowerTag.includes('ünite') || lowerTag.match(/^u\d+/)) {
                    span.classList.add('tag-u');
                } else if(lowerTag.includes('banko') || lowerTag.includes('kez çıktı')) {
                    span.classList.add('tag-h');
                } else {
                    span.classList.add('tag-e');
                }
                
                span.textContent = tag;
                tagsDiv.appendChild(span);
            });

            const qDiv = document.createElement('div');
            qDiv.className = 'q-text';
            qDiv.textContent = (index + 1) + ". " + question;

            const optUl = document.createElement('ul');
            optUl.className = 'opt';
            
            options.forEach(opt => {
                const li = document.createElement('li');
                li.textContent = opt;
                li.onclick = function() {
                    // Önce bu sorudaki tüm şıkları varsayılan (gri) haline getirerek sıfırla
                    Array.from(optUl.children).forEach(child => {
                        child.style.backgroundColor = '#f8f9fa';
                        child.style.borderColor = 'var(--b)';
                        child.style.color = 'var(--t)';
                        child.style.fontWeight = 'normal';
                    });
                    
                    // Cevap kontrolü
                    if(opt.trim() === correctAnswer.trim()) {
                        // DOĞRU ŞIKKA TIKLANDIYSA: Canlı Yeşil Yap
                        this.style.backgroundColor = '#d4edda';
                        this.style.borderColor = '#28a745';
                        this.style.color = '#155724';
                        this.style.fontWeight = 'bold';
                    } else {
                        // YANLIŞ ŞIKKA TIKLANDIYSA: Canlı Kırmızı Yap
                        this.style.backgroundColor = '#f8d7da';
                        this.style.borderColor = '#dc3545';
                        this.style.color = '#721c24';
                        this.style.fontWeight = 'bold';
                        
                        // KULLANICIYA YARDIM: Aynı esnada doğru olan şıkkı da otomatik yeşile boya
                        Array.from(optUl.children).forEach(child => {
                            if(child.textContent.trim() === correctAnswer.trim()) {
                                child.style.backgroundColor = '#d4edda';
                                child.style.borderColor = '#28a745';
                                child.style.color = '#155724';
                                child.style.fontWeight = 'bold';
                            }
                        });
                    }
                };
                optUl.appendChild(li);
            });

            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster';
            
            const ansBox = document.createElement('div');
            ansBox.className = 'ans-box';
            ansBox.style.display = isAllOpen ? 'block' : 'none';
            ansBox.innerHTML = `<div class="ans-true">Cevap: ${correctAnswer}</div>${explanation ? `<div><em>Açıklama:</em> ${explanation}</div>` : ''}`;

            btn.onclick = () => {
                if (ansBox.style.display === 'block') {
                    ansBox.style.display = 'none';
                    btn.textContent = 'Cevabı Göster';
                } else {
                    ansBox.style.display = 'block';
                    btn.textContent = 'Cevabı Gizle';
                }
            };

            card.appendChild(tagsDiv);
            card.appendChild(qDiv);
            card.appendChild(optUl);
            card.appendChild(btn);
            card.appendChild(ansBox);

            container.appendChild(card);
        });
    }
//buraya kadar 
    // 3. BUTON VE ARAMA FONKSİYONLARI
    function toggleAll() {
        isAllOpen = !isAllOpen;
        const boxes = document.querySelectorAll('.ans-box');
        const btns = document.querySelectorAll('.ans-btn');
        boxes.forEach(box => box.style.display = isAllOpen ? 'block' : 'none');
        btns.forEach(btn => btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
    }

    function filter(val) {
        val = val.toLowerCase();
        if (val === 'all') {
            renderQuestions(temizlenmisData);
            return;
        }
        
        let filtered = [];
        if (val === 'b') {
            // Banko ve çok çıkanlar
            filtered = temizlenmisData.filter(item => {
                let lower = item.toLowerCase();
                return lower.includes('banko') || lower.includes('kez çıktı');
            });
        } else {
            // Sınavlar ve üniteler
            filtered = temizlenmisData.filter(item => {
                const tags = item.split('|')[0].toLowerCase();
                return tags.includes(val);
            });
        }
        renderQuestions(filtered);
    }

    function aramaYap() {
        const val = document.getElementById('arama').value.toLowerCase();
        const filtered = temizlenmisData.filter(item => {
            const parts = item.toLowerCase().split('|');
            const q = parts[1] || '';
            const a = parts[3] || '';
            const exp = parts[4] || '';
            return q.includes(val) || a.includes(val) || exp.includes(val);
        });
        renderQuestions(filtered);
    }

    // 4. BAŞLANGIÇ (Her şeyi tetikleyen an)
    window.onload = () => {
