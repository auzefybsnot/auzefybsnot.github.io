    <style>
        :root { 
            --p: #1a2b4c; --s: #2c3e50; --a: #f39c12; --suc: #27ae60; 
            --bg: #f4f6f8; --c: #ffffff; --t: #2d3436; --b: #dfe6e9; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        
        .sticky-top {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 1000;
            padding-top: 15px;
            padding-bottom: 15px;
        }

        .header { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--a); margin-bottom: 15px; }
        .header h1 { margin: 5px 0; font-size: 1.5em; }
        .header p { margin: 0; font-size: 0.9em; }
        
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: var(--bg); padding: 5px; border-radius: 10px; }
        
        .btn { background: #ecf0f1; color: var(--p); border: 2px solid var(--b); padding: 8px 12px; font-size: 0.95em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; box-sizing: border-box; }
        .btn:hover { background: #bdc3c7; }
        .btn.active { background: var(--a); color: white; border-color: var(--a); }
        .btn-g { background: #d35400; color: white; }
        
        .card { background: var(--c); border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--p); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .tag-u { background: #3498db; } .tag-e { background: var(--p); } .tag-h { background: #e74c3c; }
        .q-text { font-size: 1.1em; font-weight: bold; color: var(--p); margin-bottom: 15px; }
        .opt { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .opt li { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--b); margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .opt li:hover { background: #eafaf1; border-color: var(--suc); }
        .ans-btn { background: var(--s); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .ans-box { display: none; margin-top: 15px; padding: 15px; background: #eafaf1; border-left: 4px solid var(--suc); border-radius: 6px; }
        .ans-true { color: var(--suc); font-weight: bold; margin-bottom: 5px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .sticky-top { position: relative; padding-top: 5px; padding-bottom: 5px; }
            .header { padding: 10px; margin-bottom: 10px; }
            .header h1 { font-size: 1.2em; }
            .header p { font-size: 0.8em; } 
            .controls { gap: 6px; padding: 0; }
            .btn { padding: 10px; font-size: 0.85em; width: 100%; margin: 0; }
            #kategori-secici, #arama { width: 100%; min-width: 100%; }
            .card { padding: 15px; }
            .q-text { font-size: 1em; }
        }
    </style>
<style id="agy-device-styles">

/* 2. 6" RENKLİ E-OKUYUCU */

<script>
const rawData = [

`2022 Vize|1. Aşağıdakilerden hangisi disk üzerinde tutulan dosyalara erişmek için kullanılan yöntemlerdendir?|A) İndekslenmiş erişim~B) Rastgele erişim~C) Bağlı erişim~D) Kuyruk erişim~E) Dolaylı erişim|A) İndekslenmiş erişim|💡 Açıklama: İndekslenmiş erişim, dosyalara doğrudan ve hızlı erişim sağlamak için bir indeks tablosu kullanan dosya erişim yöntemlerinden biridir.`,
`2022 Vize|2. Disk planlama parametrelerine ait tanımlamalar yapılmıştır. Hangi seçenekte yapılan tanımlama hatalıdır?|A) Transfer süresi: Verilerin aktarılması için geçen süredir.~B) Disk cevaplama süresi: Giriş-çıkış işlemleri için bekleyen her bir isteğe harcanan sürenin ortalamasıdır.~C) Bant genişliği: Transfer edilen toplam byte'dır.~D) Dönme gecikmesi: İlgili sektörün disk kolu pozisyonundan geçmesi için gereken süredir.~E) Arama zamanı: Disk kolunun istenen sektörü içeren silindire gelmesi için geçen süredir.|C) Bant genişliği: Transfer edilen toplam byte'dır.|💡 Açıklama: Bant genişliği (bandwidth) transfer edilen 'toplam' byte değil, 'birim zamanda' (saniyede) transfer edilen veri miktarıdır.`,
`2022 Vize|3. Aşağıdakilerden hangisi bilgisayar sistemlerinin temel bileşenlerinden biri değildir?|A) Kullanıcı~B) Donanım~C) Ağ~D) SSD~E) Yazılım|D) SSD|💡 Açıklama: Bilgisayar sistemlerinin genel temel bileşenleri Donanım, İşletim Sistemi, Uygulama Programları ve Kullanıcılardır. SSD bir donanım alt birimidir.`,
`2022 Vize|4. Proses senkronizasyonunu sağlamak için aşağıda verilen yöntemlerden hangisi kullanılmaz?|A) İlgili değişken mekanizması~B) Turnaround around yöntemi~C) Ortak değişken kullanımı~D) Global paylaşılan "turn" değişkeni~E) Dekker algoritması|B) Turnaround around yöntemi|💡 Açıklama: Turnaround time, bir prosesin sisteme girişi ile bitişi arasında geçen süredir; senkronizasyon yöntemi değil, işlemci planlama metriğidir.`,
`2022 Vize|5. İşletim sistemleri aşağıdaki temel görevlerden hangisini gerçekleştirmez?|A) Virüs taraması~B) Proses yönetimi~C) Bellek yönetimi~D) Giriş-çıkış birimlerinin yönetimi~E) Disk yönetimi|A) Virüs taraması|💡 Açıklama: Virüs taraması işletim sisteminin çekirdek görevlerinden biri değildir; bu işlem genellikle üçüncü parti güvenlik yazılımlarının görevidir.`,
`2022 Vize|6. • Dosyalar aynı isme sahip olamaz. • Farklı türlerdeki dosyalar aynı dizin içerisinde yer alır. • Farklı kullanıcıların dosyaları aynı dizin altında tutulmaktadır. • Aynı türdeki dosyaları gruplandırmak mümkün değildir. Yukarıda tanımlamaları yapılan dizin saklama (hiyerarşisi) yapısı hangisidir?|A) Döngüsel olmayan graf yapısındaki dizinler~B) Ağaç yapısı şeklinde olan dizinler~C) Tek seviyeli dizinler~D) İki seviyeli dizinler~E) Yığın yapısındaki dizinler|C) Tek seviyeli dizinler|💡 Açıklama: Tüm dosyaların tek bir kök dizin altında toplandığı yapı tek seviyeli dizindir. Gruplama yapılamaz ve aynı isimde iki dosya barındırılamaz.`,
`2022 Vize|7. Hangisi bir işletim sisteminin temel görevlerinden biri değildir?|A) Proses yönetimi~B) Ağ yönetimi~C) Ekran yönetimi~D) Dosya yönetimi~E) Bellek yönetimi|C) Ekran yönetimi|💡 Açıklama: İşletim sisteminin temel yöneticileri Proses, Bellek, Dosya ve I/O yönetimidir. Ekran yönetimi ayrı bir çekirdek temel bileşen olarak sınıflandırılmaz.`,
`2022 Vize|8. Proses küçük bir alan kaplasa dahi tahsis edilen bölümün tamamını elde tutar. Bu durum ....... olarak bilinir. Yukarıda verilen cümle aşağıda verilen terimlerden hangisiyle en uygun şekilde tamamlanır?|A) Dış parçalanma~B) Sıkıştırma~C) Segmente~D) İç parçalanma~E) Bellek bölümü|D) İç parçalanma|💡 Açıklama: Sabit boyutlu bellek bloklarında, prosese tahsis edilen alan prosesin ihtiyacından büyükse, arta kalan kullanılamayan boşluğa iç parçalanma denir.`,
`2022 Vize|9. Aşağıdakilerden hangisi proseslerin dinamik bölümlere yerleştirilmesi için işletim sistemi tarafından kullanılan yöntemlerden biri değildir?|A) Swap in algoritması~B) Next-fit algoritması~C) First-fit algoritması~D) Worst-fit algoritması~E) Best-fit algoritması|A) Swap in algoritması|💡 Açıklama: Swap in, prosesin diskten ana belleğe alınması işlemidir, bellek yerleştirme (boş yer arama) algoritması değildir.`,
`2022 Vize|10. Proses P0(AT:0, BT:2), P1(AT:3, BT:3), P2(AT:5, BT:4) bekleme kuyruğundadır. Kuantum süresi 2'dir. Buna göre Round Robin algoritması kullanılarak hazırlanan aşağıdaki GANTT Çizelgelerinden hangisi doğrudur?|A) P0(0-2), P1(2-3), P2(6-10)~B) P0(0-2), P1(2-5), P2(5-7), P1(7-8), P2(8-10)~C) P0(0-1), P1(1-4), P2(4-9)~D) P0(0-2), P1(2-4), P2(4-6), P1(6-7), P2(7-9)~E) P0(0-2), P1(2-4), P2(4-6), P1(6-8), P2(8-9)|B) P0(0-2), P1(2-5), P2(5-7), P1(7-8), P2(8-10)|💡 Açıklama: Proseslerin varış zamanları ve 2 birimlik kuantum süresi dikkate alındığında işlemciyi sırayla ve parçalı kullanan doğru sıralama B şıkkıdır.`,
`2022 Vize|11. Aşağıdakilerden hangisi birden fazla prosesin ana belleğe yerleştirilmesi için kullanılan teknikler biri değildir?|A) Sabit bölümleme~B) Dinamik bölümleme~C) Sayfalama~D) Sanal bellek~E) Disk bölümleme|E) Disk bölümleme|💡 Açıklama: Disk bölümleme (partitioning) sabit disk üzerindeki veriyi organize etme yöntemidir, bellek (RAM) yönetimi tekniği değildir.`,
`2022 Vize|12. Dinamik bölümlemede tahsis edilen bölümler ve boş alanların kayıtlarının tutulması gerekir. İşletim sistemi bu görevi icra edebilmek için hangi veri yapısını kullanır?|A) Kuyruk veri yapısı~B) Yığın veri yapısı~C) Bağlantılı liste veri yapısı~D) Ağaç veri yapısı~E) Dizi|C) Bağlantılı liste veri yapısı|💡 Açıklama: Bellekteki boş ve dolu blokların başlangıç adresleri ve boyutları işletim sistemi tarafından genellikle bağlantılı liste kullanılarak takip edilir.`,

    let isAllOpen = false;
    let temizlenmisData = []; // Birleştirilmiş verileri global tutalım ki arama/filtreleme yapabilelim

    // 1. SORULARI BİRLEŞTİREN FONKSİYON
    function sorulariBirlestir(dataArray) {
        const soruMap = new Map();

        dataArray.forEach(item => {
            if (!item || item.trim() === '') return;
            
            const parts = item.split('|');
            if (parts.length < 4) return; 
            
            let tagsRaw = parts[0];
            const question = parts[1].trim(); 
            const options = parts[2];
            const correctAnswer = parts[3];
            const explanation = parts[4] ? parts[4] : '';

            let tagsList = tagsRaw.split(',').map(t => t.trim());
            let mevcutSayi = 1;

            tagsList = tagsList.filter(t => {
                const match = t.match(/(\d+)\s*Kez Çıktı/i);
                if (match) {
                    mevcutSayi = parseInt(match[1]);
                    return false; 
                }
                return true;
            });

            if (soruMap.has(question)) {
                let kayit = soruMap.get(question);
                kayit.count += mevcutSayi; 
                
                tagsList.forEach(t => {
                    if (!kayit.tags.includes(t)) {
                        kayit.tags.push(t);
                    }
                });
            } else {
                soruMap.set(question, {
                    tags: tagsList,
                    options: options,
                    correctAnswer: correctAnswer,
                    explanation: explanation,
                    count: mevcutSayi
                });
            }
        });

        const birlestirilmisData = [];
        for (let [qText, data] of soruMap.entries()) {
            let finalTags = [...data.tags];
            if (data.count > 1) {
                finalTags.push(`${data.count} Kez Çıktı!`);
            }
            
            const itemString = `${finalTags.join(',')}|${qText}|${data.options}|${data.correctAnswer}|${data.explanation}`;
            birlestirilmisData.push(itemString);
        }

        return birlestirilmisData;
    }

   // 2. EKRANA BASTIRMA FONKSİYONU (Renklendirme Geliştirilmiş Versiyon)
    function renderQuestions(data) {
        const container = document.getElementById('q-container');
        container.innerHTML = '';
        
        if(data.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Kriterlerinize uygun soru bulunamadı.</p>';
            return;
        }

        data.forEach((item, index) => {
            const parts = item.split('|');
            const tagsRaw = parts[0];
            const question = parts[1];
            const options = parts[2].split('~');
            const correctAnswer = parts[3];
            const explanation = parts[4] || '';

            const card = document.createElement('div');
            card.className = 'card';

            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'tags';
            
            tagsRaw.split(',').forEach(tag => {
                tag = tag.trim();
                if(!tag) return;
                const span = document.createElement('span');
                span.className = 'tag';
                
                let lowerTag = tag.toLowerCase();
                if(lowerTag.includes('ünite') || lowerTag.match(/^u\d+/)) {
                    span.classList.add('tag-u');
                } else if(lowerTag.includes('banko') || lowerTag.includes('kez çıktı')) {
                    span.classList.add('tag-h');
                } else {
                    span.classList.add('tag-e');
                }
                
                span.textContent = tag;
                tagsDiv.appendChild(span);
            });

            const qDiv = document.createElement('div');
            qDiv.className = 'q-text';
            qDiv.textContent = (index + 1) + ". " + question;

            const optUl = document.createElement('ul');
            optUl.className = 'opt';
            
            options.forEach(opt => {
                const li = document.createElement('li');
                li.textContent = opt;
                li.onclick = function() {
                    // Önce bu sorudaki tüm şıkları varsayılan (gri) haline getirerek sıfırla
                    Array.from(optUl.children).forEach(child => {
                        child.style.backgroundColor = '#f8f9fa';
                        child.style.borderColor = 'var(--b)';
                        child.style.color = 'var(--t)';
                        child.style.fontWeight = 'normal';
                    });
                    
                    // Cevap kontrolü
                    if(opt.trim() === correctAnswer.trim()) {
                        // DOĞRU ŞIKKA TIKLANDIYSA: Canlı Yeşil Yap
                        this.style.backgroundColor = '#d4edda';
                        this.style.borderColor = '#28a745';
                        this.style.color = '#155724';
                        this.style.fontWeight = 'bold';
                    } else {
                        // YANLIŞ ŞIKKA TIKLANDIYSA: Canlı Kırmızı Yap
                        this.style.backgroundColor = '#f8d7da';
                        this.style.borderColor = '#dc3545';
                        this.style.color = '#721c24';
                        this.style.fontWeight = 'bold';
                        
                        // KULLANICIYA YARDIM: Aynı esnada doğru olan şıkkı da otomatik yeşile boya
                        Array.from(optUl.children).forEach(child => {
                            if(child.textContent.trim() === correctAnswer.trim()) {
                                child.style.backgroundColor = '#d4edda';
                                child.style.borderColor = '#28a745';
                                child.style.color = '#155724';
                                child.style.fontWeight = 'bold';
                            }
                        });
                    }
                };
                optUl.appendChild(li);
            });

            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster';
            
            const ansBox = document.createElement('div');
            ansBox.className = 'ans-box';
            ansBox.style.display = isAllOpen ? 'block' : 'none';
            ansBox.innerHTML = `<div class="ans-true">Cevap: ${correctAnswer}</div>${explanation ? `<div><em>Açıklama:</em> ${explanation}</div>` : ''}`;

            btn.onclick = () => {
                if (ansBox.style.display === 'block') {
                    ansBox.style.display = 'none';
                    btn.textContent = 'Cevabı Göster';
                } else {
                    ansBox.style.display = 'block';
                    btn.textContent = 'Cevabı Gizle';
                }
            };

            card.appendChild(tagsDiv);
            card.appendChild(qDiv);
            card.appendChild(optUl);
            card.appendChild(btn);
            card.appendChild(ansBox);

            container.appendChild(card);
        });
    }
//buraya kadar 
    // 3. BUTON VE ARAMA FONKSİYONLARI
    function toggleAll() {
        isAllOpen = !isAllOpen;
        const boxes = document.querySelectorAll('.ans-box');
        const btns = document.querySelectorAll('.ans-btn');
        boxes.forEach(box => box.style.display = isAllOpen ? 'block' : 'none');
        btns.forEach(btn => btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
    }

    function filter(val) {
        val = val.toLowerCase();
        if (val === 'all') {
            renderQuestions(temizlenmisData);
            return;
        }
        
        let filtered = [];
        if (val === 'b') {
            // Banko ve çok çıkanlar
            filtered = temizlenmisData.filter(item => {
                let lower = item.toLowerCase();
                return lower.includes('banko') || lower.includes('kez çıktı');
            });
        } else {
            // Sınavlar ve üniteler
            filtered = temizlenmisData.filter(item => {
                const tags = item.split('|')[0].toLowerCase();
                return tags.includes(val);
            });
        }
        renderQuestions(filtered);
    }

    function aramaYap() {
        const val = document.getElementById('arama').value.toLowerCase();
        const filtered = temizlenmisData.filter(item => {
            const parts = item.toLowerCase().split('|');
            const q = parts[1] || '';
            const a = parts[3] || '';
            const exp = parts[4] || '';
            return q.includes(val) || a.includes(val) || exp.includes(val);
        });
        renderQuestions(filtered);
    }

    // 4. BAŞLANGIÇ (Her şeyi tetikleyen an)

</script>

<script id="agy-device-controller">
function agyToggleDevMenu() {
  const m = document.getElementById('agyDevMenu');
  if(m) m.classList.toggle('show');
}
function agySetDevice(dev, save=true) {
  document.documentElement.setAttribute('data-device', dev);
  document.querySelectorAll('.agy-dev-opt').forEach(opt => {
    opt.classList.toggle('active', opt.getAttribute('onclick').includes(dev));
  });
  const m = document.getElementById('agyDevMenu');
  if(m) m.classList.remove('show');
  if(save) localStorage.setItem('agy_device', dev);
}
function agyToggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('agy_theme', next);
}
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.agy-dev-menu-wrap');
  if(wrap && !wrap.contains(e.target)) {
    const m = document.getElementById('agyDevMenu');
    if(m) m.classList.remove('show');
  }
});
(function agyInit() {
  const savedDev = localStorage.getItem('agy_device') || 'desktop';
  const savedThm = localStorage.getItem('agy_theme') || 'light';
  agySetDevice(savedDev, false);
  document.documentElement.setAttribute('data-theme', savedThm);
})();
</script>
