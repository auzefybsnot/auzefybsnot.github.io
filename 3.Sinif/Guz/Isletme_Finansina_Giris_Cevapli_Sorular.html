    "2024 Final|3.000 TL'nin, yıllık %8 faiz oram üzerinden 4'üncü yıl sonunda ulaştığı toplam tutar aşağıdakilerden hangisidir?|A) 4.081 TL~B) 4.258 TL~C) 1.551 TL~D) 6.376 TL~E) 2.975 TL|A) 4.081 TL|💡 Açıklama: Bileşik faiz kullanılarak Gelecekteki Değer (FV) = Anapara * (1 + i)^n formülüyle hesaplanır: 3.000 * (1.08)^4 = 3.000 * 1,36048... = 4.081,46 TL (Yuvarlandığında 4.081 TL).",

    "2024 Final|Bugün alınan X TL tutarındaki, 10 yıl vadeli bir banka kredisi için yıllık %12 faiz uygulanmaktadır. İlk iki yıl ödeme yapılmayacağı varsayımıyla hesaplanan geri ödeme planında kalan 8 yıl boyunca yıl sonlarında ödenecek her bir taksitin tutarı 20.000 TL ise verilen kredi miktarı yaklaşık ne kadar olmalıdır?|A) 79.204 TL~B) 85.250 TL~C) 99.353 TL~D) 55.500 TL~E) 65.280 TL|A) 79.204 TL|💡 Açıklama: Önce 8 yıllık anüitenin 2. yıl sonundaki bugünkü değeri (P8) bulunur: P8 = 20.000 * [1 - (1.12)^-8] / 0.12 = 99.352,5 TL. Daha sonra bu tutar 0. yıla (bugüne) 2 yıllık iskonto edilir: 99.352,5 / (1.12)^2 = 79.203,8 (Yuvarlandığında 79.204 TL).",

    "2021 Final, 2022-2023 Final, 2022-2023 Büt, 2024 Final, 4 Kez Çıktı!|Aşağıdakilerden hangisi paranın zaman değerine etki eden unsurlardan biridir?|A) Finansman gideri~B) Faaliyet riski~C) Finansal kaldıraç~D) Finansal oran~E) Vade|E) Vade|💡 Açıklama: Paranın zaman değerini etkileyen temel unsurlar; Faiz oranı (iskonto oranı), beklenen enflasyon ve vadedir (zaman).",

    "2024 Final|Her bir değerin (Ri) ortalamadan (Rort) olan farklarının kareleri toplamının toplam gözlem sayısına (N) bölünmesi sonucunda ulaşılan değere verilen ad aşağıdakilerden hangisidir?|A) Mod~B) Varyans~C) Geometrik ortalama~D) Medyan~E) Standart sapma|B) Varyans|💡 Açıklama: Varyans, serideki gözlem değerlerinin aritmetik ortalamadan sapmalarının kareleri toplamının gözlem sayısına bölünmesi ile bulunan (getirinin riskini hesaplamada kullanılan) bir istatistiksel ölçüttür.",

    "2022-2023 Final, 2024 Final, 2 Kez Çıktı!|Aşağıdakilerden hangisi hem anaparanın hem de kazanılan faizin yeniden faiz kazanmasını ifade etmektedir?|A) Basit Faiz~B) Anuite~C) Bugünkü Değer~D) Gelecekteki Değer~E) Bileşik Faiz|E) Bileşik Faiz|💡 Açıklama: Bir dönem kazanılan faizin anaparaya eklenerek bir sonraki dönemde elde edilen bu daha büyük toplam tutar üzerinden yeniden faiz hesaplanması yöntemine bileşik faiz denir.",

    "2024 Final|Bir firmanın bileşik (toplam) kaldıraç derecesi 12'dir; ayı firmanın faaliyet kaldıraç derecesi ise 4'tür. Buna göre ilgili firmanın finansal kaldıraç derecesi aşağıdakilerden hangisidir?|A) 2,2~B) 3~C) 4~D) 1,5~E) 6|B) 3|💡 Açıklama: Toplam (Bileşik) Kaldıraç Derecesi = Faaliyet Kaldıraç Derecesi * Finansal Kaldıraç Derecesi formülü ile hesaplanır. 12 = 4 * Finansal Kaldıraç -> Finansal Kaldıraç = 12 / 4 = 3'tür.",

    "2021 Final, 2024 Final, 2 Kez Çıktı!|Aşağıdakilerden hangisi nakit bütçesi için söylenemez?|A) Nakit bütçesine beklenen tahmini nakit giriş ve çıkışları alınır.~B) Nakit bütçesi sadece aylık dönemler için hazırlanır.~C) Nakit bütçesi, işletmenin nakit ihtiyaçlarının zamanında belirlenmesi amacı ile hazırlanır.~D) Nakit bütçesinde minimum kasa düzeyi veri olup nakit çıkışı şeklinde dikkate alınır.~E) Nakit bütçesinde nakit girişlerinden nakit çıkışları düşüldükten sonra dönemsel nakit dengesine ulaşılır.|B) Nakit bütçesi sadece aylık dönemler için hazırlanır.|💡 Açıklama: Nakit bütçesi işletmenin finansal gereksinimlerine ve faaliyet hızına göre aylık olabileceği gibi 3 aylık, haftalık veya günlük gibi daha farklı periyotlar için de hazırlanabilir.",

    "2024 Final, ⚠️ Dikkat!|Aşağıdakilerden hangisi satışlara bağlı olarak değişmeyen bilanço kalemlerinden biri değildir? (Yani değişen kalemdir)|A) Banka kredileri~B) İpotekli borç senetleri~C) Ödenmiş sermaye~D) Maddi duran varlıklar~E) Tahviller|A) Banka kredileri|⚠️ DİKKAT! Bu sorunun kurgusunda bir hata olabilir. Soru 'değişmeyen biri değildir' (yani değişen kalemdir) diye soruyor. Şıklardakilerin tamamı aslında doğrudan satış hacmiyle otomatik (spontane) olarak değişmeyen kalemlerdir. Ancak işletme, artan satışları finanse etmek için ek işletme sermayesine ihtiyaç duyduğunda genellikle ilk olarak kısa vadeli 'Banka Kredilerine' başvurur. Eğer sınavda çıkarsa olası kabul gören en mantıklı cevap (A) olacaktır.",

    "2022-2023 Vize, 2023-2024 Vize, 2024 Final, 3 Kez Çıktı!|ABC işletmesinin toplam sabit maliyetleri 1.200.000 TL, ürün birim satış fiyatı 800 TL ve ürün birim değişken gideri 400 TL ise, ABC işletmesinin üretim başabaş noktası miktarı aşağıdakilerden hangisidir?|A) 1.500~B) 4.500~C) 7.500~D) 3.000~E) 6.000|D) 3.000|💡 Açıklama: Başabaş Noktası = Toplam Sabit Maliyet / (Birim Satış Fiyatı - Birim Değişken Maliyet). Formülde yerine koyduğumuzda: 1.200.000 / (800 - 400) = 1.200.000 / 400 = 3.000 adet elde edilir.",

    "2020 Vize, 2024 Final, 2 Kez Çıktı!|Aşağıdakilerden hangisi gelir tablosu unsurlarından biri değildir?|A) Satılan malın maliyeti~B) Satışlar~C) Bankalar~D) Brüt kâr~E) Faaliyet kârı|C) Bankalar|💡 Açıklama: Bankalar (mevduatlar) hesabı, işletmenin hazır değerlerini gösteren bir Bilanço (Dönen Varlık) hesabıdır, gelir tablosunda yeri yoktur.",

    "2024 Final|Aşağıdakilerden hangisi nakit bütçesi hazırlanma süreci içerisinde değerlendirilmez?|A) Nakit çıkışlarının tahmini~B) Net nakit akışı veya nakit dengesinin bulunması~C) Sistematik ve sistematik olmayan risk unsurlarının tahmini~D) Bütçenin kapsayacağı süre~E) Nakit girişlerinin tahmini|C) Sistematik ve sistematik olmayan risk unsurlarının tahmini|💡 Açıklama: Sistematik ve sistematik olmayan risk tahmini yatırım analizinde ve portföy yönetiminde kullanılan risk analiz yöntemleridir. Kısa vadeli nakit giriş çıkışlarını izleyen nakit bütçesi sürecinde değerlendirilmezler.",

    "2024 Final|Üç iş teklifiyle karşı karşıyasınız: I. Bugün size 20.000 TL nakden ödenecektir; II. Bugünden itibaren tam bir yıl sonra 11.524,06 TL ve iki yıl sonra da bir 11.524,06 TL daha ödenecektir; III. Bugünden itibaren tam bir yıl sonra başlamak üzere yıl sonlarında birbirine eşit tam 12 taksit olarak ödenecektir. Her üç teklif arasında kayıtsız kalabilmeniz için üçüncü iş teklifinin birbirine eşit olan ödemeleri..... olmalıdır.|A) 1.750,00 TL~B) 1.892,45TL~C) 2.946,55 TL~D) 2.935,26 TL~E) 3.226,42 TL|D) 2.935,26 TL|💡 Açıklama: 1. ve 2. seçeneklerin bugünkü değerleri (20.000 TL) eşit olmalıdır ki kayıtsız kalınabilsin. Bu denklemden piyasa faiz oranı (iskonto oranı) %10 (0.10) bulunur. 3. seçenek için (n=12, PV=20.000, r=0.10) anüite formülü (Taksit Tutarı = PV * [i / (1 - (1+i)^-n)]) hesaplandığında: Taksit = 20.000 * [0.10 / (1 - (1.10)^-12)] = 20.000 / 6.81369 = 2.935,26 TL çıkar.",

    "2020 Vize, 2024 Final, 2 Kez Çıktı!|Aşağıdakilerden hangisi karşılaştırmalı tablolar analizi (yatay analiz) tanımını ifade etmektedir?|A) Bir işletmenin mali tablolarda bulunan bir kaleminin toplam veya grup içindeki oransal büyüklüğünün irdelenmesidir.~B) Mali tablolarda yer alan iki kalem arasındaki ilişkinin oranlanarak hesaplanmasıdır.~C) Bir işletmenin iki veya daha fazla dönemlerine ilişkin finansal tablolarının, birbirini izleyen dönemler bakımından karşılaştırmalı olarak düzenlemesi ve bu tablolarda yer alan kalemlerin zaman içinde göstermiş olduğu değişikliklerin incelenerek değerlendirilmesidir.~D) Finansal tablolarda yer alan kalemlerin dönemler arasında göstermiş olduğu artış veya azalışların tespit edilerek bu değişikliklerin esas alınan yıla göre oransal önemlerinin ortaya konulmasıdır.~E) Bir işletmenin sahip olduğu varlıklarla bu varlıkların hangi kaynaklardan sağlandığını göstermesidir.|C) Bir işletmenin iki veya daha fazla dönemlerine ilişkin finansal tablolarının, birbirini izleyen dönemler bakımından karşılaştırmalı olarak düzenlemesi ve bu tablolarda yer alan kalemlerin zaman içinde göstermiş olduğu değişikliklerin incelenerek değerlendirilmesidir.|💡 Açıklama: Yatay analiz; finansal tabloların birden fazla döneme ait verilerinin yan yana getirilerek zaman içindeki mutlak ve oransal değişim (artış/azalış) eğilimlerinin incelenmesidir.",

"2021 Final, 2024 Final, 2023-2024 Büt, 3 Kez Çıktı!|Aşağıdakilerden hangisi nakit bütçesi için söylenemez?|A) Nakit bütçesine beklenen tahmini nakit giriş ve çıkışları alınır.~B) Nakit bütçesi, işletmenin nakit ihtiyaçlarının zamanında belirlenmesi amacı ile hazırlanır.~C) Nakit bütçesinde minimum kasa düzeyi veri olup nakit çıkışı şeklinde dikkate alınır.~D) Nakit bütçesi sadece aylık dönemler için hazırlanır.~E) Nakit bütçesinde nakit girişlerinden nakit çıkışları düşüldükten sonra dönemsel nakit dengesine ulaşılır.|D) Nakit bütçesi sadece aylık dönemler için hazırlanır.|💡 Açıklama: Nakit bütçesi, işletmenin finansal döngüsüne ve ihtiyacına göre aylık olabileceği gibi günlük, haftalık veya üç aylık dönemler için de hazırlanabilir.",

    "2023-2024 Büt|Aşağıdakilerden hangisi nakit bütçesinin bir işletmeye sağladığı bilgilerden biridir?|A) Firmanın tahmini nakit açığı veya fazlası~B) Firmanın üretim karar süreci~C) Firmanın ortak sayısı~D) Firmanın kredibilitesi~E) Firmanın piyasa değeri|A) Firmanın tahmini nakit açığı veya fazlası|💡 Açıklama: Nakit bütçesinin temel amacı işletmenin gelecekteki tahmini nakit giriş ve çıkışlarını karşılaştırarak nakit açığı veya nakit fazlası vereceği dönemleri önceden saptamaktır.",

    "2023-2024 Büt|Aşağıdakilerden hangisi karşılaştırmalı tablolar analizi aşamalarından biridir?|A) Mali tablolarda yer alan tutarların nispi ilişkileri incelenerek işletmenin mali durumu konusunda bilgi edinilmesi~B) Mali tablolarda yer alan iki kalem arasındaki ilişkinin matematiksel ifade edilmesi~C) Mali tablolarda incelenecek dönemlere ait bir yıl esas alınır ve ilgili yıla ait tutarlar 100'e eşit kabul edilerek, diğer dönemlere ait değerler esas alınan yılın aynı değerleri ile karşılaştırılarak yüzde yöntemine göre oranlanması~D) Bir işletmenin mali tablolarda bulunan bir kaleminin toplam veya grup içindeki oransal büyüklüğünün irdelenmesi~E) Faaliyet dönemine ait bilanço ve gelir tablosu bilgilerinin yanyana yazılarak karşılaştırılmaları şeklinde düzenlenmesi|E) Faaliyet dönemine ait bilanço ve gelir tablosu bilgilerinin yanyana yazılarak karşılaştırılmaları şeklinde düzenlenmesi|💡 Açıklama: Karşılaştırmalı tablolar (yatay) analizinin ilk ve en temel aşaması, birden fazla faaliyet dönemine ait finansal tabloların yan yana konularak artış ve azalışların hesaplanabilir hale getirilmesidir.",

    "2024 Final, 2023-2024 Büt, 2 Kez Çıktı!|Her bir değerin (Ri) ortalamadan (Rort) olan farklarının kareleri toplamının toplam gözlem sayısına (N) bölünmesi sonucunda ulaşılan değere verilen ad aşağıdakilerden hangisidir?|A) Geometrik ortalama~B) Medyan~C) Standart sapma~D) Mod~E) Varyans|E) Varyans|💡 Açıklama: İstatistiksel bir risk ölçütü olan varyansın tanımıdır. Serideki her bir değerin aritmetik ortalamadan farkının karelerinin alınıp gözlem sayısına bölünmesiyle bulunur.",

    "2021 Final, 2024 Final, 2023-2024 Büt, 3 Kez Çıktı!|Yılık yüzde 10 faiz oranı üzerinden yatırılan 5.000 TL'nin basit faiz esasına göre üç yıl sonra ulaşacağı değer toplamı aşağıdakilerden hangisidir?|A) 5.750 TL~B) 6.500 TL~C) 5.000 TL~D) 6.655 TL~E) 7.250 TL|B) 6.500 TL|💡 Açıklama: Basit faiz hesabı (I = P * r * t) formülü ile Faiz = 5.000 * 0.10 * 3 = 1.500 TL. Dönem sonu ulaşacağı toplam değer (Anapara + Faiz) = 5.000 + 1.500 = 6.500 TL.",

    "2023-2024 Büt|...... kredi yapısı tercih edilirse yıllık kredi maliyeti en düşük olur. Yukarıdaki cümlede boş bırakılan yere aşağıdakilerden hangisi getirilmelidir?|A) Yıl sonu faiz ödemeli, yıllık yüzde 9 faizli~B) 3 ayda bir faiz ödemeli, yıllık yüzde 8 faizli~C) Ayda bir faiz ödemeli, yıllık yüzde 8 faizli~D) 6 ayda bir faiz ödemeli, yıllık yüzde 8,5 faizli~E) 4 ayda bir faiz ödemeli, yıllık yüzde 9 faizli|B) 3 ayda bir faiz ödemeli, yıllık yüzde 8 faizli|💡 Açıklama: Efektif (gerçek) faiz oranlarını hesapladığımızda, (1+0.08/4)^4 - 1 formülüyle 3 ayda bir %8 faizli kredinin yıllık bileşik maliyeti %8,24 ile seçenekler arasındaki en düşük maliyettir.",

    "2021 Final, 2024-2025 Vize, 2025-2026 Vize, 2023-2024 Büt, 4 Kez Çıktı!|Stokların dönen varlıklara dahil edilmemesi durumunda kısa vadeli borçların ödenebilirliğini gösteren oran aşağıdakilerden hangisidir?|A) Cari oran~B) Asit-test oranı~C) Finansal kaldıraç oranı~D) Faiz karşılama oranı~E) Nakit oran|B) Asit-test oranı|💡 Açıklama: Asit-test (Likit) oranı, stokların hızlı bir şekilde paraya çevrilemeyeceği (likit olmadığı) varsayımıyla dönen varlıklardan stokların düşülmesiyle hesaplanan likidite oranıdır.",

    "2023-2024 Büt|Her ayın sonunda olmak üzere 5 yıl boyunca yıllık %12 faiz oranı üzerinden bankaya yatırılacak olan 1.000 TL'lik miktarların bugünkü değeri yaklaşık olarak aşağıdakilerden hangisidir?|A) 65.250 TL~B) 60.000 TL~C) 44.874 TL~D) 25.250 TL~E) 40.000 TL|C) 44.874 TL|💡 Açıklama: 5 yıl = 60 ay. Aylık faiz oranı = %12 / 12 = %1. Anüite bugünkü değer formülü: PV = PMT * [(1 - (1+i)^-n) / i] -> 1000 * [(1 - (1.01)^-60) / 0.01] = 1000 * 44.955. Soru kitapçığında 44.874 TL verilmiştir ve doğru kabul edilmektedir.",

    "2021 Final, 2022-2023 Final, 2022-2023 Büt, 2024 Final, 2023-2024 Büt, 5 Kez Çıktı!|Aşağıdakilerden hangisi paranın zaman değerine etki eden unsurlardan biridir?|A) Faaliyet riski~B) Finansal oran~C) Finansman gideri~D) Vade~E) Finansal kaldıraç|D) Vade|💡 Açıklama: Paranın zaman değerini etkileyen üç ana unsur vardır: Enflasyon, Faiz oranı (iskonto oranı) ve Vadedir (zaman).",

    "2023-2024 Büt|Bay A 500.000 TL değerinde olan bir evi satın almak için bedelin %40'ını peşin, kalan tutarı da kredi kullanarak karşılayacaktır. 7 yıl vadeli kredinin taksitleri ay sonlarında ödenecek olup kredinin aylık faiz oranı %0,88'dir. Buna göre kredinin aylık eşit taksitleri ne kadar olmalıdır?|A) 4.875,56 TL~B) 5.685,76 TL~C) 5.067,59 TL~D) 3.852,25 TL~E) 4.150,85 TL|C) 5.067,59 TL|💡 Açıklama: Kredi tutarı = 500.000 * %60 = 300.000 TL. Vade (n) = 7 * 12 = 84 ay. Aylık faiz = %0.88 (0.0088). Taksit (PMT) = PV * [i / (1 - (1+i)^-n)] -> 300.000 * [0.0088 / (1 - 1.0088^-84)] = 5.067,59 TL.",

    "2021 Final, 2023-2024 Büt, 2 Kez Çıktı!|Aşağıdakilerden hangisi bir işletmede çalışma sermayesi yetersizliğinin neden olduğu sorunlardan biri değildir?|A) Yetersiz yardımcı madde stoku nedeniyle üretimde kesinti~B) Düşük kapasite kullanım oranı~C) Yetersiz hammadde stoku nedeniyle üretimde kesinti~D) Maddi duran varlık planlamasında aksama~E) Yetersiz nakit nedeniyle üretimde kesinti|D) Maddi duran varlık planlamasında aksama|💡 Açıklama: Çalışma (işletme) sermayesi yetersizliği işletmenin kısa vadeli ve günlük operasyonlarını (hammadde, nakit vb.) etkiler. Maddi duran varlık yatırımları uzun vadeli sermaye bütçelemesi kararlarıdır.",

    "2023-2024 Büt|Aşağıdakilerden hangisi satışlara bağlı olarak değişen bilanço kalemlerinden biri değildir?|A) Ödenmiş sermaye~B) Ödenecek giderler~C) Stoklar~D) Ticari alacak~E) Maddi duran varlıklar|A) Ödenmiş sermaye|💡 Açıklama: İşletmenin günlük satış hacmi arttıkça stoklar, alacaklar ve ticari borçlar otomatik (spontane) olarak artar. Ödenmiş sermaye ise satışlara bağlı olarak kendiliğinden değişmez, genel kurul kararıyla değiştirilebilir.",

    "2021 Final, 2022-2023 Final, 2022-2023 Büt, 2023-2024 Büt, 4 Kez Çıktı!|Aşağıdakilerden hangisi çalışma sermayesinin unsurlarından biridir?|A) Maddi duran varlık~B) Öz sermaye~C) Uzun vadeli borç~D) Maddi olmayan duran varlık~E) Pazarlanabilir menkul kıymet|E) Pazarlanabilir menkul kıymet|💡 Açıklama: Çalışma sermayesi, işletmenin dönen varlıklarını (kasa, banka, stoklar, alacaklar ve pazarlanabilir menkul kıymetler) ifade eder. Diğerleri duran varlıklar veya uzun vadeli kaynaklardır.",

    "2024-2025 Vize, 2025-2026 Vize, 2023-2024 Büt, 3 Kez Çıktı!|ABC Şirketi birim satış fiyatı 90 TL olan ütü makinesi üretmektedir. Firmanın sabit maliyeti 550.000 TL ve birim başı değişken maliyet 10 TL'dir. Şirketin 9.000 adetlik satışı için gerçekleşen faaliyet kaldıraç derecesi aşağıdakilerden hangisidir?|A) 5,38~B) 2,46~C) 4,23~D) 1,85~E) 3,22|C) 4,23|💡 Açıklama: Faaliyet Kaldıraç Derecesi = Toplam Katkı Payı / Faaliyet Kârı (EBIT). Katkı payı = 9.000 * (90 - 10) = 720.000 TL. EBIT = 720.000 - 550.000 = 170.000 TL. 720.000 / 170.000 = 4,235...",

    "2020 Vize, 2023-2024 Büt, 2 Kez Çıktı!|Üretim hacmine bağlı olarak oluşan gider grubuna verilen ad aşağıdakilerden hangisidir?|A) Reskont Faiz Gideri~B) Değişken Maliyet~C) Olağandışı Giderler~D) Sabit Maliyet~E) Karşılık Gideri|B) Değişken Maliyet|💡 Açıklama: Üretim veya faaliyet hacmindeki artışa paralel olarak toplamı artan, üretim sıfır olduğunda sıfır olan maliyetlere değişken maliyet denir.",

    "2023-2024 Büt|Aşağıdakilerin hangisinde faaliyet kârı tanımı verilmektedir?|A) Olağan dışı olay ve gelişmeler nedeniyle ortaya çıkan gelirlerdir.~B) Satışlar ve satılan malların maliyeti (SMM) arasındaki farktır.~C) Brüt kârla işletmenin faaliyetleri için gerekli giderler arasındaki farktır.~D) Esas faaliyet dışında iştiraklerden ve bağlı ortaklıklardan elde edilen gelirlerdir.~E) Faaliyet kârından faaliyet dışı gelir ve giderler, finansman giderleri ve olağandışı gelir ve giderler ile dönemin vergisi düşüldükten sonra kalan kısımdır.|C) Brüt kârla işletmenin faaliyetleri için gerekli giderler arasındaki farktır.|💡 Açıklama: İşletmenin esas faaliyetiyle ilgili olan Brüt Satış Kârından, Faaliyet Giderlerinin (Ar-Ge, Pazarlama, Genel Yönetim Giderleri) düşülmesiyle ulaşılan değere Faaliyet Kârı (EBIT) denir.",

    "2021 Final, 2023-2024 Büt, 2 Kez Çıktı!|Aşağıdakilerden hangisi işletmenin kısa dönemde fon ihtiyacının belirlenmesi ile ilgili teknikleri kapsamaktadır?|A) Finansal planlama~B) Yatay analiz~C) Dikey analiz~D) Sermaye bütçelemesi~E) Finansal analiz|A) Finansal planlama|💡 Açıklama: İşletmenin gelecekte (özellikle kısa ve orta vadede) faaliyetlerini sürdürebilmek için ne kadar fona ihtiyaç duyacağını ve bu fonun nasıl sağlanacağını tahmin etmesi finansal planlamanın temelidir.",

    "2023-2024 Büt|Finansal varlıklara ilişkin olarak bir yatırımdan beklenen getirilerin belirsizlik koşullarındaki dağılımının genişliğini gösteren yöntem aşağıdakilerden hangisidir?|A) Mod~B) Medyan~C) Aritmetik ortalama~D) Geometrik ortalama~E) Varyans|E) Varyans|💡 Açıklama: Varyans (ve dolayısıyla standart sapma), beklenen getirilerin ortalamadan ne kadar uzaklaştığını (dağılımın genişliğini) yani yatırımın içerdiği belirsizlik/risk seviyesini ölçen temel istatistiksel araçtır.",

    "2024-2025 Vize, 2025-2026 Vize, 2023-2024 Büt, 3 Kez Çıktı!|Aşağıdakilerden hangisi finansal tabloların özelliklerinden biri değildir?|A) Bir firmanın mali durumuna etki yapan tüm etmenleri göstermezler.~B) Belli bir döneme ait gelir ve giderlerin karşılaştırılmasına odaklanmıştır.~C) Geçici niteliktedirler.~D) Finansal tablolarda yer alan rakamlar mutlak doğru ve kesindir.~E) Farklı tarihlerde farklı para değerleriyle olan işlemleri yansıtırlar.|D) Finansal tablolarda yer alan rakamlar mutlak doğru ve kesindir.|💡 Açıklama: Finansal tablolarda yer alan amortisman, karşılıklar ve şüpheli alacaklar gibi kalemler işletme yönetiminin politikalarına ve tahminlerine dayandığı için rakamlar her zaman %100 mutlak doğru değildir.",

    "2022-2023 Büt, 2023-2024 Büt, 2 Kez Çıktı!|Aşağıdakilerden hangisi bugünkü bir paranın belirli bir faiz oranı üzerinden belirli bir süre sonra ulaşacağı toplam değeri ifade etmektedir?|A) Gelecekteki değer~B) Bugünkü değer~C) Bileşik kaldıraç~D) Faaliyet riski~E) Anuite|A) Gelecekteki değer|💡 Açıklama: Elimizde bugün bulunan mevcut bir paranın, belli bir faiz veya getiri oranıyla (bileşik faiz ile) belli bir vade sonrasında ulaşacağı değere Gelecekteki Değer (Future Value) denir.",

"2022-2023 Final, 2024-2025 Büt, 2 Kez Çıktı!|Aşağıdakilerden hangisi finansal planlamanın unsurlarından biridir?|A) Likit oran~B) Başabaş noktası~C) Finansal analiz~D) Nakit bütçesi~E) Bileşik kaldıraç|D) Nakit bütçesi|💡 Açıklama: Finansal planlamanın temel unsurları Proforma tablolar (tahmini bilanço/gelir tablosu) ve Nakit Bütçesidir. İşletmenin gelecekteki fon ihtiyaçları bu bütçeyle planlanır.",

    "2021 Final, 2024-2025 Büt, 2 Kez Çıktı!|Aşağıdakilerden hangisi alacak yönetimine ilişkin karar süreçlerinden biri değildir?|A) Kredili satış önerisinin kabul edilmesi~B) Tahsili gecikmiş alacaklara ilişkin politikanın belirlenmesi~C) İşletmenin toplam varlık kärlılığının öz sermaye kärlılığından daha yüksek olması~D) Satış koşullarının saptanması~E) Kredili satış önerisinin geri çevrilmesi|C) İşletmenin toplam varlık kärlılığının öz sermaye kärlılığından daha yüksek olması|💡 Açıklama: Kârlılık oranlarının birbiriyle kıyaslanması, şirketin genel finansal performansı ve kaldıraç etkisiyle ilgilidir, günlük alacak yönetimi kararlarının bir parçası değildir.",

    "2020 Vize, 2022-2023 Final, 2023-2024 Büt, 2024-2025 Vize, 2025-2026 Vize, 2024-2025 Büt, 6 Kez Çıktı!, 🔥 Banko Soru|Aşağıdakilerden hangsi gelir tablosu unsurlarından biridir?|A) Diğer stoklar~B) Satıcılar~C) Satılan malın maliyeti~D) Alıcılar~E) Kasa|C) Satılan malın maliyeti|💡 Açıklama: Kasa, Alıcılar, Satıcılar ve Stoklar bilançoda yer alan hesaplardır. Satılan Malın Maliyeti (SMM) ise işletmenin ana faaliyet maliyetini gösteren bir Gelir Tablosu kalemidir.",

    "2020 Vize, 2021 Final, 2024-2025 Büt, 3 Kez Çıktı!|Bir işletmenin satış gelirlerinin toplam maliyetleri karşıladığı noktadaki üretim miktarına verilen ad aşağıdakilerden hangisidir?|A) Net kår~B) Başabaş noktası~C) Vergi öncesi kâr~D) Faaliyet kârı~E) Brüt kâr|B) Başabaş noktası|💡 Açıklama: Başabaş noktası (sıfır kâr noktası), toplam gelirlerin toplam maliyetlere tam eşit olduğu, yani işletmenin ne kâr ne de zarar ettiği üretim veya satış miktarıdır.",

    "2021 Final, 2022-2023 Final, 2022-2023 Büt, 2024-2025 Büt, 4 Kez Çıktı!|Finansal varlıklara ilişkin olarak her bir birim getiri için katlanılan riski ölçen yöntem aşağıdakilerden hangisidir?|A) Mod~B) Varyans~C) Değişim katsayısı~D) Standart sapma~E) Medyan|C) Değişim katsayısı|💡 Açıklama: Standart sapmanın beklenen getiriye bölünmesiyle bulunan değişim (varyasyon) katsayısı, yatırımdaki birim getiri başına ne kadar risk alındığını gösterir.",

    "2023-2024 Büt, 2024-2025 Büt, 2 Kez Çıktı!|Bay A 500.000 TL değerinde olan bir evi satın almak için bedelin %40'ını peşin, kalan tutarı da kredi kullanarak karşılayacaktır. 7 yıl vadeli kredinin taksitleri ay sonlarında ödenecek olup kredinin aylık faiz oram %0,88'dir. Buna göre kredinin aylık eşit taksitleri ne kadar olmalıdır?|A) 5.067,59 TL~B) 5.685,76 TL~C) 4.875,56 TL~D) 3.852,25 TL~E) 4.150,85 TL|A) 5.067,59 TL|💡 Açıklama: Kullanılacak kredi = 500.000 * %60 = 300.000 TL. Vade (n) = 7 * 12 = 84 ay. Taksit tutarı = 300.000 * [0.0088 / (1 - (1.0088)^-84)] = 5.067,59 TL'dir.",

    "2024-2025 Büt|Nakit bütçesi ile ilgili aşağıdakilerden hangisi yanıştır?|A) Nakit bütçesinde nakit girişlerinden nakit çıkışları düşüldükten sonra dönemsel nakit dengesine ulaşılır.~B) Nakit bütçesine sadece gerçekleşen nakit giriş ve çıkışları alınır.~C) Nakit bütçesi, işletmenin nakit ihtiyaçlarının zamanında belirlenmesi amacı ile hazırlanır.~D) Nakit bütçesinde minimum kasa düzeyi veri olup nakit çıkışı şeklinde dikkate alınır.~E) Nakit bütçesi belirli bir süre için hazırlanabilir.|B) Nakit bütçesine sadece gerçekleşen nakit giriş ve çıkışları alınır.|💡 Açıklama: Bütçeler geleceğe dönük planlama araçlarıdır; bu nedenle nakit bütçesine geçmişte gerçekleşenler değil, gelecekte \"beklenen/tahmini\" nakit giriş ve çıkışları alınır.",

    "2021 Final, 2022-2023 Final, 2022-2023 Büt, 2024-2025 Büt, 4 Kez Çıktı!|Aşağıdakilerden hangisi finansal varlıklara ilişkin risk ölçütlerinden biridir?|A) Aritmetik ortalama~B) Geometrik ortalama~C) Medyan~D) Varyans~E) Mod|D) Varyans|💡 Açıklama: Varyans ve bunun karekökü olan standart sapma, finansal analizde beklenen getiriden sapmayı gösterdiği için en temel risk ölçütü olarak kullanılır.",

    "2024-2025 Büt|Sahip olduğunuz arabayı 7 yıl sonra yeni modeli ile degiştirmeyi planıyorsunuz ve arabanızı yenilerken 2.000 TL ilave bir ödeme yapmanız gerekeceğini tahmin ediyorsunuz. Buna göre arabanızı 7 yıl sonra yenileyebilmek için bankada açacağınız bir hesaba her yıl eşit miktarda para yatıracaksınız. Eğer banka hesabınıza %12 faiz uyguluyor ise gerekli parayı sağlayabilmek için her yıl bankaya yatırmanız gereken miktar aşağıdakilerden hangisidir?|A) 250,75 TL~B) 216,48 TL~C) 285.45 TL~D) 198,23 TL~E) 325,50 TL|D) 198,23 TL|💡 Açıklama: Gelecekteki Değer (Anüite) formülü üzerinden Taksit tutarı bulunur. FV = 2.000 TL. Taksit (PMT) = FV * [i / ((1+i)^n - 1)] = 2.000 * [0.12 / ((1.12)^7 - 1)] = 2000 / 10.089 = 198,23 TL'dir.",

    "2023-2024 Büt, 2024-2025 Büt, 2 Kez Çıktı!, ⚠️ Dikkat!|Aşağıdakilerden hangisi satışlara bağlı olarak değişen bilanço kalemlerinden biri değildir?|A) Stoklar~B) Ödenecek giderler~C) Ödenmiş sermaye~D) Ticari alacak~E) Maddi duran varlıklar|C) Ödenmiş sermaye|⚠️ DİKKAT! Hem \"Ödenmiş Sermaye\" hem de \"Maddi Duran Varlıklar\" satış hacmindeki günlük değişimlerden spontane (otomatik) olarak etkilenmeyen kalemlerdir. Şıklarda teknik olarak iki doğru cevap var ancak AUZEF sisteminde genellikle ilk değişmez kaynak olan \"Ödenmiş Sermaye\" cevabı esas alınır.",

    "2024-2025 Büt|Bir firmanın net satışları 2.000.000 TL'dir. Firmanın stok devir hızı 5, cari oram 3 ve brüt kâr marjı %50'dir. Firmanın stok miktarı aşağıdakilerden hangisidir?|A) 500.000 TL~B) 400.000 TL~C) 100.000 TL~D) 200.000 TL~E) 300.000 TL|D) 200.000 TL|💡 Açıklama: Brüt kâr %50 ise Satışların Maliyeti (SMM) de kalan %50'dir. SMM = 2.000.000 * 0.50 = 1.000.000 TL. Stok Devir Hızı = SMM / Stok -> 5 = 1.000.000 / Stok -> Stok = 200.000 TL'dir.",

    "2024-2025 Büt|Aşağıdakilerden hangisi bilançonun aktif kısmı içinde yer almaz?|A) Ticari Alacak~B) Ticari Borç~C) Maddi Olmayan Duran Varlıklar~D) Stoklar~E) Maddi Duran Varlıklar|B) Ticari Borç|💡 Açıklama: Bilançonun aktif (varlıklar) kısmında dönen ve duran varlıklar yer alır. Ticari Borçlar ise işletmenin yükümlülükleridir ve pasif (kaynaklar) tarafında yer alır.",

    "2024-2025 Büt|Aşağıdakilerden hangisi finansal tabloların analizlerinde kullanılan yöntemlerden biridir?|A) Nakit akım analizi~B) Yüzde yöntemi ile analiz~C) Sermaye bütçelemesi~D) Fon akım analizi~E) Paranın zaman değeri|B) Yüzde yöntemi ile analiz|💡 Açıklama: Finansal tablo analiz teknikleri 4 adettir: Karşılaştırmalı Tablolar (Yatay) Analizi, Yüzde Yöntemi (Dikey) Analiz, Eğilim Yüzdeleri (Trend) Analizi ve Oran (Rasyo) Analizidir.",

    "2024-2025 Büt|Yıllık % 10 faiz oranı üzerinden yatırılan 5.000 TL'nin \"bileşik\" faiz esasına göre üç yıl sonra ulaşacağı değer toplamı aşağıdakilerden hangisidir?|A) 6.655 TL~B) 6.500 TL~C) 7.250 TL~D) 5.750 TL~E) 5.000 TL|A) 6.655 TL|💡 Açıklama: Bileşik faiz hesaplama formülü: Gelecekteki Değer = Anapara * (1 + i)^n = 5.000 * (1.10)^3 = 5.000 * 1,331 = 6.655 TL'dir. (Basit faiz deseydi 6.500 TL olurdu).",

    "2024-2025 Büt|Aşağıdakilerden hangisi çalışma sermayesinin unsurlarından biridir?|A) Öz sermaye~B) Maddi duran varlık~C) Uzun vadeli borç~D) Maddi olmayan duran varlık~E) Stoklar|E) Stoklar|💡 Açıklama: Çalışma (işletme) sermayesi, işletmenin dönen varlıklarını (Kasa, Banka, Alacaklar, Stoklar) ifade eder. Diğer seçenekler duran varlık veya uzun vadeli kaynak grubudur.",

    "2024-2025 Büt|Aşağıdakilerden hangisi faaliyet kaldıracına ilişkin unsurlardan biri değildir?|A) Faaliyet kaldıracı yüksek işletmelerin risk derecesi düşüktür.~B) İşletmede sabit giderlerin nereye kadar kabul edilebileceğini araştırır.~C) Faaliyet kârındaki yüzdesel değişimin satışlardaki yüzdesel değişime olan oranıdır.~D) Sabit giderler ile değişken giderler arasında ilişki kurar.~E) Kısa süreli bir analiz tekniğidir.|A) Faaliyet kaldıracı yüksek işletmelerin risk derecesi düşüktür.|💡 Açıklama: Faaliyet kaldıracı, işletmenin katlandığı sabit maliyetlerin seviyesini gösterir. Sabit maliyetlerin yüksek olması şirketi satış dalgalanmalarına karşı kırılgan hale getirdiği için işletme (faaliyet) riskini yükseltir.",

    "2024-2025 Büt|100.000 TL'nin, yıllık %5 faiz oranı üzerinden 4'üncü yıl sonunda ulaştığı toplam tutar aşağıdakilerden hangisidir?|A) 120.236 TL~B) 118.975 TL~C) 125.376 TL~D) 128.258 TL~E) 121.551 TL|E) 121.551 TL|💡 Açıklama: Gelecekteki Değer (Bileşik faiz) = Anapara * (1 + i)^n formülü ile 100.000 * (1.05)^4 = 100.000 * 1.215506 = 121.550,6 (Yuvarlandığında 121.551 TL) bulunur.",

    "2024-2025 Büt|10.000 TL nakdi bulunan bir yatırımcı söz konusu nakdini aylık mevduatta değerlendirmek istemektedir. Aylık mevduat faizlerinin yüzde 1,5 olduğu düşünüldüğünde yatırıncının 5 ay sonra elde edeceği toplam faiz geliri yaklaşık olarak aşağıdakilerden hangisidir?|A) 773 TL~B) 1.773 TL~C) 2.000 TL~D) 1.000 TL~E) 1.200 TL|A) 773 TL|💡 Açıklama: Bileşik faiz kullanıldığında toplam biriken para = 10.000 * (1.015)^5 = 10.772,84 TL olur. Sadece faiz geliri isteniyor: 10.772,84 - 10.000 = 772,84 TL (Yaklaşık 773 TL).",

    "2024-2025 Büt|Aylık mevduata uygulanan yıllık nominal faiz oranı %12'dir. Söz konusu faizin yıllık bileşik getirisi aşağıdakilerden hangisidir?|A) %9,56~B) %8,43~C) %12,00~D) %7,21~E) %12,68|E) %12,68|💡 Açıklama: Yıllık nominal faiz %12 ise aylık faiz %1 (0.01) olur. Yıllık efektif (bileşik) oran = (1 + aylık faiz)^12 - 1 = (1.01)^12 - 1 = 1.1268 - 1 = %12,68 olur.",

    "2024-2025 Büt, ⚠️ Dikkat!|Aşağıdakilerden hangisi satışlara bağlı olarak değişen bilanço kalemlerinden biridir?|A) İpotekli borç senetleri~B) Tahviller~C) Ödenmiş sermaye~D) Uzun süreli borçlar~E) İştirakler|Yok (Hatalı Soru)|⚠️ DİKKAT! Bu soru bilimsel olarak tamamen hatalıdır. Şıklarda yer alan kalemlerin hepsi uzun vadeli yabancı kaynaklar, özkaynak veya duran varlık niteliğinde olup satış hacmi ile otomatik/spontane DEĞİŞMEYEN kalemlerdir. \"Değişmeyen biridir?\" şeklinde sorulmak istenmiş olması veya cevap anahtarına rastgele bir harf atanmış olması kuvvetle muhtemeldir. Sınavda karşınıza gelirse muhtemelen iptal edilecek türden bir sorudur.",
"2024 Final, 2024-2025 Büt, 2025-2026 Final, 3 Kez Çıktı!|Yıllık % 10 faiz oranı üzerinden yatırılan 5.000 TL'nin \"bileşik\" faiz esasına göre üç yıl sonra ulaşacağı değer toplamı aşağıdakilerden hangisidir?|A) 5.750 TL~B) 6.655 TL~C) 6.500 TL~D) 5.000 TL~E) 7.250 TL|B) 6.655 TL|💡 Açıklama: Bileşik faiz hesaplama formülü: Gelecekteki Değer = Anapara * (1 + i)^n = 5.000 * (1.10)^3 = 5.000 * 1,331 = 6.655 TL'dir. (Basit faiz olsaydı 6.500 TL olurdu).",

    "2024 Final, 2025-2026 Final, 2 Kez Çıktı!|Üç iş teklifiyle karşı karşıyasınız: I. Bugün size 20.000 TL nakden ödenecektir; II. Bugünden itibaren tam bir yıl sonra 11.524,06 TL ve iki yıl sonra da bir 11.524,06 TL daha ödenecektir; III. Bugünden itibaren tam bir yıl sonra başlamak üzere yıl sonlarında birbirine eşit tam 12 taksit olarak ödenecektir. Her üç teklif arasında kayıtsız kalabilmeniz için üçüncü iş teklifinin birbirine eşit olan ödemeleri ..... olmalıdır.|A) 1.892,45TL~B) 2.935,26 TL~C) 2.946,55 TL~D) 1.750,00 TL~E) 3.226,42 TL|B) 2.935,26 TL|💡 Açıklama: Önce 1. ve 2. seçeneği birbirine eşitleyerek piyasa faiz oranını (iskonto oranı) %10 (0.10) olarak buluruz. Ardından 3. seçenek için anüite formülünü (Taksit = PV * [i / (1 - (1+i)^-n)]) kullanırız: 20.000 * [0.10 / (1 - (1.10)^-12)] = 20.000 / 6,81369 = 2.935,26 TL bulunur.",

    "2021 Final, 2023-2024 Büt, 2025-2026 Final, 3 Kez Çıktı!|Aşağıdakilerden hangisi işletmenin kısa dönemde fon ihtiyacının belirlenmesi ile ilgili teknikleri kapsamaktadır?|A) Sermaye bütçelemesi~B) Finansal planlama~C) Dikey analiz~D) Finansal analiz~E) Yatay analiz|B) Finansal planlama|💡 Açıklama: İşletmenin gelecekte (özellikle kısa ve orta vadede) faaliyetlerini sürdürebilmek için ne kadar fona ihtiyaç duyacağını ve bu fonların hangi kaynaklardan sağlanacağını önceden saptaması işlemine finansal planlama denir.",

    "2021 Final, 2024-2025 Büt, 2025-2026 Final, 3 Kez Çıktı!|Aşağıdakilerden hangisi alacak yönetimine ilişkin karar süreçlerinden biri değildir?|A) Satış koşullarının saptanması~B) Tahsili gecikmiş alacaklara ilişkin politikanın belirlenmesi~C) İşletmenin toplam varlık kârlılığının öz sermaye kârlılığından daha yüksek olması~D) Kredili satış önerisinin geri çevrilmesi~E) Kredili satış önerisinin kabul edilmesi|C) İşletmenin toplam varlık kârlılığının öz sermaye kârlılığından daha yüksek olması|💡 Açıklama: Varlık kârlılığının öz sermaye kârlılığından yüksek olup olmaması, işletmenin genel finansal performansı ve kaldıraç etkisi ile ilgilidir, şirketin günlük alacak yönetimi kararlarından bağımsızdır.",

    "2024 Final, 2025-2026 Final, 2 Kez Çıktı!|Aşağıdakilerden hangisi çalışma sermayesinin unsurlarından biri değildir?|A) Stokalar~B) Kasa~C) Ticari alacak~D) Banka hesapları~E) Maddi duran varlık|E) Maddi duran varlık|💡 Açıklama: Çalışma (işletme) sermayesi, bilançoda dönen varlık kalemlerini (Kasa, Banka, Alacaklar, Stoklar vb.) ifade eder. Maddi duran varlıklar ise uzun vadeli yatırımlar olup duran varlıklar grubunda raporlanır.",

    "2024-2025 Büt, 2025-2026 Final, 2 Kez Çıktı!|Nakit bütçesi ile ilgili aşağıdakilerden hangisi yanlıştır?|A) Nakit bütçesine sadece gerçekleşen nakit giriş ve çıkışları alınır.~B) Nakit bütçesinde nakit girişlerinden nakit çıkışları düşüldükten sonra dönemsel nakit dengesine ulaşılır.~C) Nakit bütçesi, işletmenin nakit ihtiyaçlarının zamanında belirlenmesi amacı ile hazırlanır.~D) Nakit bütçesi belirli bir süre için hazırlanabilir.~E) Nakit bütçesinde minimum kasa düzeyi veri olup nakit çıkışı şeklinde dikkate alınır.|A) Nakit bütçesine sadece gerçekleşen nakit giriş ve çıkışları alınır.|💡 Açıklama: Bütçeler geçmişi değil, planlanan geleceği ifade eder; bu nedenle nakit bütçesine geçmişte gerçekleşenler değil, gelecekte olması 'beklenen/tahmin edilen' nakit giriş ve çıkışları alınır.",

    "2022-2023 Vize, 2023-2024 Vize, 2025-2026 Final, 3 Kez Çıktı!|Aşağıdakilerden hangisi finansal analizin doğrudan kullanım amaçlarından biridir?|A) Araştırma geliştirme giderlerinin tespit edilmesi~B) Pazarlama harcamalarının tespit edilmesi~C) Satın alma bütçesinin belirlenmesi~D) İşletmenin kârlılık durumunun yeterli olup olmadığının belirlenmesi~E) Üretim düzeyinin belirlenmesi|D) İşletmenin kârlılık durumunun yeterli olup olmadığının belirlenmesi|💡 Açıklama: Finansal analizin ana amacı, finansal tablolardaki ve rasyolardaki veriler ışığında işletmenin mevcut likidite, kârlılık ve finansal yapı performansını (başarısını) tespit etmektir.",

    "2020 Vize, 2024-2025 Vize, 2025-2026 Vize, 2025-2026 Final, 4 Kez Çıktı!|İşletmenin kaynak yapısını, uzun vadeli borç ödeme gücünü ve finansmanda yabancı kaynaklardan yararlanma derecesini gösteren oran grubu aşağıdakilerden hangisidir?|A) Likidite Oranları~B) Faaliyet Oranları~C) Finansal (Mali) Yapı Oranları~D) Nakit Akım Analizi~E) Karılık Oranları|C) Finansal (Mali) Yapı Oranları|💡 Açıklama: Finansal yapı (kaldıraç) oranları, işletmenin faaliyetlerini finanse ederken ne oranda borç (yabancı kaynak) kullandığını ve dolayısıyla iflas/finansal risk durumunu ölçen temel göstergelerdir.",

    "2020 Vize, 2021 Final, 2024-2025 Vize, 2025-2026 Vize, 2025-2026 Final, 5 Kez Çıktı!, 🔥 Banko Soru|Aşağıdakilerden hangisinde gelir tablosunun tanımı verilmektedir?|A) Belli bir tarihte bir işletmenin sahip olduğu varlıklarla bu varlıkların hangi kaynaklardan sağlandığını gösterir.~B) Belli bir dönemde elde edilen gelirlerle katlanılan giderleri düzenli bir şekilde gösterir.~C) Satışlar ve satılan malların maliyeti arasındaki farktır.~D) İşletmenin belli bir dönemdeki nakit akımlarını nakit kaynak ve kullanım yerlerini gösterir.~E) Bir işletmenin belli bir andaki varlıkları (aktif) toplamı kaynakları (pasif) toplamına eşittir.|B) Belli bir dönemde elde edilen gelirlerle katlanılan giderleri düzenli bir şekilde gösterir.|💡 Açıklama: Gelir tablosu, işletmenin belli bir hesap dönemine (örneğin 1 Ocak - 31 Aralık) ait tüm gelir ve giderlerini (dinamik akışını) özetleyerek o dönemin net kârını veya zararını gösteren tablodur.",

    "2021 Final, 2022-2023 Büt, 2024 Final, 2025-2026 Final, 4 Kez Çıktı!|Aşağıdakilerden hangisi satışlara bağlı olarak değişmeyen bilanço kalemlerinden biri değildir? (Yani değişen kalemdir)|A) Banka kredileri~B) Uzun süreli borçlar~C) İpotekli borç senetleri~D) Stoklar~E) İştirakler|D) Stoklar|💡 Açıklama: Soru 'değişmeyen biri değildir' diyerek satışlara bağlı olarak 'değişen' kalemi sormaktadır. Satış hacmi arttıkça doğal olarak üretim ve stok tutma ihtiyacı da artacağı için stoklar satışlara bağlı olarak doğrudan değişir.",

    "2024-2025 Büt, 2025-2026 Final, 2 Kez Çıktı!|100.000 TL'nin, yıllık %5 faiz oranı üzerinden 4'üncü yıl sonunda ulaştığı toplam tutar aşağıdakilerden hangisidir?|A) 125.376 TL~B) 128.258 TL~C) 121.551 TL~D) 120.236 TL~E) 118.975 TL|C) 121.551 TL|💡 Açıklama: Gelecekteki Değer (Bileşik faiz) = Anapara * (1 + i)^n formülü ile 100.000 * (1.05)^4 = 100.000 * 1.215506 = 121.550,6 TL bulunur (Yuvarlandığında 121.551 TL).",

    "2022-2023 Vize, 2023-2024 Vize, 2025-2026 Final, 3 Kez Çıktı!|ABC işletmesinin toplam sabit maliyetleri 80.000 TL, ürün birim değişken gideri ise 500 TL'dir. ABC işletmesi başabaş noktasına 2.000 adetlik üretim ile ulaşıyorsa işletmenin ürün birim satış fiyatı aşağıdakilerden hangisidir?|A) 155~B) 440~C) 250~D) 220~E) 540|E) 540|💡 Açıklama: Başabaş Noktası = Toplam Sabit Maliyet / (Birim Satış Fiyatı - Birim Değişken Maliyet). Formülde yerine koyarsak: 2.000 = 80.000 / (Fiyat - 500) -> İçler dışlar çarpımıyla (Fiyat - 500) = 40 -> Fiyat = 540 TL elde edilir.",

    "2024-2025 Vize, 2025-2026 Vize, 2023-2024 Büt, 2025-2026 Final, 4 Kez Çıktı!|ABC Şirketi birim satış fiyatı 90 TL olan ütü makinesi üretmektedir. Firmanın sabit maliyeti 550.000 TL ve birim başı değişken maliyet 10 TL'dir. Şirketin 9.000 adetlik satışı için gerçekleşen faaliyet kaldıraç derecesi aşağıdakilerden hangisidir?|A) 3,22~B) 1,85~C) 2,46~D) 5,38~E) 4,23|E) 4,23|💡 Açıklama: Faaliyet Kaldıraç Derecesi = Toplam Katkı Payı / Faaliyet Kârı (EBIT). Toplam Katkı Payı = 9.000 adet * (90 - 10) = 720.000 TL. Faaliyet Kârı = 720.000 - 550.000 = 170.000 TL. Kaldıraç Derecesi = 720.000 / 170.000 = 4,235...",

    "2022-2023 Vize, 2024-2025 Vize, 2025-2026 Vize, 2025-2026 Final, 4 Kez Çıktı!|Aşağıdakilerden hangisi bilançonun kalemlerinden biri değildir?|A) Duran varlıklar~B) Öz sermaye~C) Faaliyet karı~D) Yabancı kaynaklar~E) Dönen varlıklar|C) Faaliyet karı|💡 Açıklama: Faaliyet kârı, işletmenin belli bir dönemdeki performansını ve kârlılığını gösteren Gelir Tablosu'na ait bir kalemdir. Bilanço sadece varlıkları (aktif) ve kaynakları (pasif) gösterir.",

    "2024 Final, 2025-2026 Final, 2 Kez Çıktı!|Aşağıdakilerden hangisi nakit bütçesi hazırlanma süreci içerisinde değerlendirilmez?|A) Nakit çıkışlarının tahmini~B) Bütçenin kapsayacağı süre~C) Net nakit akışı veya nakit dengesinin bulunması~D) Nakit girişlerinin tahmini~E) Sistematik ve sistematik olmayan risk unsurlarının tahmini|E) Sistematik ve sistematik olmayan risk unsurlarının tahmini|💡 Açıklama: Sistematik ve sistematik olmayan risklerin tahmini, yatırım analizinde ve menkul kıymet/portföy yönetiminde kullanılan risk analiz yöntemleridir. Kısa vadeli nakit giriş çıkışlarını izleyen nakit bütçesi sürecinde kullanılmazlar.",

    "2025-2026 Final|Yıllık %20 faiz oranı ile 3 yıl sonra hesapta oluşacak 1.150 TL'nin bugünkü değeri aşağıdakilerden hangisidir?|A) 665 TL~B) 750 TL~C) 832 TL~D) 682 TL~E) 800 TL|A) 665 TL|💡 Açıklama: Bugünkü Değer (PV) = Gelecekteki Değer (FV) / (1 + i)^n formülü ile hesaplanır. PV = 1.150 / (1.20)^3 = 1.150 / 1,728 = 665,50 TL (Yuvarlandığında 665 TL bulunur).",

    "2025-2026 Final|Nominal faiz oranının enflasyon oranından yüksek olması aşağıdakilerden hangisini ortaya çıkartır?|A) Pozitif reel getiri~B) Negatif reel getiri~C) Reel getirinin sıfıra eşit olma durumu~D) Deflasyon~E) Likidite risk primi|A) Pozitif reel getiri|💡 Açıklama: Kazanılan nominal (görünür) faiz, paranın satın alma gücünü eriten enflasyon oranından daha yüksek seviyedeyse, yatırımcı enflasyonun üzerinde gerçek bir kazanç sağlamış olur. Buna pozitif reel getiri denir.",

    "2022-2023 Final, 2022-2023 Büt, 2024-2025 Büt, 2025-2026 Final, 4 Kez Çıktı!|Finansal varlıklara ilişkin olarak her bir birim getiri için katlanılan riski ölçen yöntem aşağıdakilerden hangisidir?|A) Değişim katsayısı~B) Mod~C) Varyans~D) Medyan~E) Standart sapma|A) Değişim katsayısı|💡 Açıklama: Standart sapmanın beklenen getiriye bölünmesiyle bulunan değişim (varyasyon) katsayısı, yatırımdaki her bir birim getiri başına ne kadar risk alındığını gösteren nispi (oransal) bir risk ölçütüdür.",

    "2021 Final, 2025-2026 Final, 2 Kez Çıktı!|Her yılın sonunda olmak üzere 10 yıl boyunca yıllık %10 faiz oranı üzerinden bankaya yatırılacak olan 3.000 TL'lik miktarların süre sonundaki değer toplamı yaklaşık olarak aşağıdakilerden hangisidir?|A) 37.156 TL~B) 23.235 TL~C) 28.258 TL~D) 47.812 TL~E) 30.000 TL|D) 47.812 TL|💡 Açıklama: Sabit ödemeli normal anüitenin gelecekteki değer hesabı: Gelecekteki Değer = Ödeme * [((1+i)^n - 1) / i]. Formül uygulandığında 3000 * [((1+0.10)^10 - 1) / 0.10] = 3000 * 15,9374 = 47.812,27 TL bulunur.",

    "2023-2024 Büt, 2025-2026 Final, 2 Kez Çıktı!|Finansal varhklara ilişkin olarak bir yatırımdan beklenen getirilerin belirsizlik koşullarındaki dağılımının genişliğini gösteren yöntem aşağıdakilerden hangisidir?|A) Mod~B) Geometrik ortalama~C) Medyan~D) Varyans~E) Aritmetik ortalama|D) Varyans|💡 Açıklama: Varyans (ve bunun karekökü olan standart sapma), beklenen getirilerin ortalamadan ne kadar saptığını, yani olası sonuçların dağılım genişliğini (belirsizlik/risk seviyesini) ölçen temel istatistiksel araçtır.",

"2024 Final, 2025-2026 Büt, 2 Kez Çıktı!|Aşağıdakilerden hangisi çalışma sermayesinin özelliklerinden biridir?|A) Faaliyet riskinin ölçütü olması~B) En çok bir yıl içerisinde nakde dönüştürülmeleri~C) Sermaye bütçelemesinin bir unsuru olması~D) Finansal riskin ölçütü olması~E) Bir yıldan daha uzun süre içerisinde nakde dönüştürülmeleri|B) En çok bir yıl içerisinde nakde dönüştürülmeleri|💡 Açıklama: Çalışma sermayesi (dönen varlıklar), normal faaliyet dönemi içinde veya en geç 1 yıl içinde paraya çevrilmesi, tüketilmesi veya satılması beklenen varlıklardır.",

    "2022-2023 Final, 2024 Final, 2025-2026 Büt, 3 Kez Çıktı!|Aşağıdakilerden hangisi hem anaparanın hem de kazanılan faizin yeniden faiz kazanmasını ifade etmektedir?|A) Bileşik Faiz~B) Anuite~C) Bugünkü Değer~D) Basit Faiz~E) Gelecekteki Değer|A) Bileşik Faiz|💡 Açıklama: Kazanılan faizin anaparaya eklenerek bir sonraki dönemde elde edilen bu daha büyük toplam tutar üzerinden yeniden faiz hesaplanması yöntemine bileşik faiz denir.",

    "2024-2025 Vize, 2025-2026 Vize, 2025-2026 Büt, 3 Kez Çıktı!|Üretim hacminden bağımsız olarak oluşan gider grubuna verilen ad aşağıdakilerden hangisidir?|A) Finansman gideri~B) Sabit maliyet~C) Değişken maliyet~D) Komisyon gideri~E) Faaliyet gideri|B) Sabit maliyet|💡 Açıklama: Üretim hacmindeki (miktarındaki) değişimlerden etkilenmeyen, işletme çalışmasa dahi katlanılmak zorunda olunan giderlere (kira, amortisman vb.) sabit maliyet denir.",

    "2022-2023 Vize, 2023-2024 Vize, 2025-2026 Büt, 3 Kez Çıktı!|Aşağıdakilerden hangisi işletmenin nakit kullanımlarından biri değildir?|A) Vergi ve benzeri ödemeler~B) Olağandışı gider ve zararlara ilişkin ödemeler~C) Hisse senedi ihraç primlerinden sağlanan nakit~D) Temettü ödemeleri~E) Maliyetlerden kaynaklanan ödemeler|C) Hisse senedi ihraç primlerinden sağlanan nakit|💡 Açıklama: \"Sağlanan nakit\" tanımı gereği bir nakit girişini (kaynak/tedarik) ifade eder, dolayısıyla nakdin kullanımı (kasadan nakit çıkışı) değildir.",

    "2024 Final, 2025-2026 Büt, 2 Kez Çıktı!|Aşağıdakilerden hangisi işletmenin varlıklarını ne derece etkin ve verimli kullanıldığını ölçen oranlardan değildir?|A) Öz sermaye devir hızı~B) Alacak devir hızı~C) Stok devir hızı~D) Finansal kaldıraç oranı~E) Toplam varlık devir hızı|D) Finansal kaldıraç oranı|💡 Açıklama: Devir hızları (stok, alacak, aktif devir hızı vb.) varlıkların ne kadar verimli kullanıldığını ölçen faaliyet oranlarıdır. Finansal kaldıraç oranı ise şirketin borçluluk/finansal yapı durumunu ölçer.",

    "2024-2025 Büt, 2025-2026 Final, 2025-2026 Büt, 3 Kez Çıktı!|Nakit bütçesi ile ilgili aşağıdakilerden hangisi yanlıştır?|A) Nakit bütçesinde minimum kasa düzeyi veri olup nakit çıkışı şeklinde dikkate alınır.~B) Nakit bütçesi belirli bir süre için hazırlanabilir.~C) Nakit bütçesinde nakit girişlerinden nakit çıkışları düşüldükten sonra dönemsel nakit dengesine ulaşılır.~D) Nakit bütçesi, işletmenin nakit ihtiyaçlarının zamanında belirlenmesi amacı ile hazırlanır.~E) Nakit bütçesine sadece gerçekleşen nakit giriş ve çıkışları alınır.|E) Nakit bütçesine sadece gerçekleşen nakit giriş ve çıkışları alınır.|💡 Açıklama: Bütçeler geçmişi değil, planlanan geleceği ifade eder; bu nedenle nakit bütçesine geçmişte gerçekleşenler değil, gelecekte olması 'beklenen/tahmin edilen' nakit giriş ve çıkışları alınır.",

    "2024-2025 Büt, 2025-2026 Final, 2025-2026 Büt, 3 Kez Çıktı!|100.000 TL'nin, yıllık %5 faiz oranı üzerinden 4'üncü yıl sonunda ulaştığı toplam tutar aşağıdakilerden hangisidir?|A) 128.258 TL~B) 125.376 TL~C) 118.975 TL~D) 120.236 TL~E) 121.551 TL|E) 121.551 TL|💡 Açıklama: Gelecekteki Değer (Bileşik faiz) = Anapara * (1 + i)^n formülü ile 100.000 * (1.05)^4 = 100.000 * 1.215506 = 121.550,6 TL bulunur (Yuvarlandığında 121.551 TL).",

    "2022-2023 Final, 2024-2025 Büt, 2025-2026 Büt, 3 Kez Çıktı!|Aşağıdakilerden hangisi finansal planlamanın unsurlarından biridir?|A) Başabaş noktası~B) Nakit bütçesi~C) Likit oran~D) Bileşik kaldıraç~E) Finansal analiz|B) Nakit bütçesi|💡 Açıklama: Finansal planlamanın temel unsurları Proforma tablolar (tahmini bilanço/gelir tablosu) ve Nakit Bütçesidir. İşletmenin gelecekteki fon ihtiyaçları bu bütçeyle planlanır.",

    "2024-2025 Büt, 2025-2026 Büt, 2 Kez Çıktı!|Aşağıdakilerden hangisi çalışma sermayesinin unsurlarından biridir?|A) Maddi olmayan duran varlık~B) Maddi duran varlık~C) Stoklar~D) Uzun vadeli borç~E) Öz sermaye|C) Stoklar|💡 Açıklama: Çalışma (işletme) sermayesi, işletmenin dönen varlıklarını (Kasa, Banka, Alacaklar, Stoklar) ifade eder. Diğer seçenekler duran varlık veya uzun vadeli kaynak grubudur.",

    "2021 Final, 2022-2023 Final, 2022-2023 Büt, 2024-2025 Büt, 2025-2026 Büt, 5 Kez Çıktı!, 🔥 Banko Soru|Aşağıdakilerden hangisi finansal varlıklara ilişkin risk ölçütlerinden biridir?|A) Mod~B) Varyans~C) Aritmetik ortalama~D) Medyan~E) Geometrik ortalama|B) Varyans|💡 Açıklama: Varyans ve standart sapma, beklenen getiriden sapmayı (dağılımı) gösterdiği için finansta temel risk ölçütü olarak kullanılır.",

    "2024-2025 Vize, 2025-2026 Vize, 2023-2024 Büt, 2025-2026 Final, 2025-2026 Büt, 5 Kez Çıktı!, 🔥 Banko Soru|ABC Şirketi birim satış fiyatı 90 TL olan ütü makinesi üretmektedir. Firmanın sabit maliyeti 550.000 TL ve birim başı değişken maliyet 10 TL'dir. Şirketin 9.000 adetlik satışı için gerçekleşen faaliyet kaldıraç derecesi aşağıdakilerden hangisidir?|A) 3,22~B) 5,38~C) 1,85~D) 4,23~E) 2,46|D) 4,23|💡 Açıklama: Faaliyet Kaldıraç Derecesi = Toplam Katkı Payı / Faaliyet Kârı (EBIT). Toplam Katkı Payı = 9.000 adet * (90 - 10) = 720.000 TL. Faaliyet Kârı = 720.000 - 550.000 = 170.000 TL. Kaldıraç Derecesi = 720.000 / 170.000 = 4,235...",

    "2024-2025 Büt, 2025-2026 Büt, 2 Kez Çıktı!|Kişi sahip olduğu arabayı 7 yıl sonra yeni modeli ile değiştirmeyi planlıyor ve arabayı yenilerken 2.000 TL ilave bir ödeme yapması gerekeceğini tahmin ediyor. Buna göre arabayı 7 yıl sonra yenileyebilmek için bankada açacağı bir hesaba her yıl eşit miktarda para yatıracak. Eğer banka hesaba %12 faiz uyguluyor ise gerekli parayı sağlayabilmek için her yıl bankaya yatırması gereken miktar aşağıdakilerden hangisidir?|A) 325,50 TL~B) 216,48 TL~C) 250,75 TL~D) 198,23 TL~E) 285,45 TL|D) 198,23 TL|💡 Açıklama: Gelecekteki Değer (Anüite) formülü üzerinden Taksit tutarı bulunur. FV = 2.000 TL. Taksit (PMT) = FV * [i / ((1+i)^n - 1)] = 2.000 * [0.12 / ((1.12)^7 - 1)] = 2000 / 10.089 = 198,23 TL'dir.",

    "2025-2026 Büt|Bir bölümü peşin geri kalanı ise 60 ayda eşit taksitlerle geri ödemeli banka kredisi kullanılarak 450.000 TL'ye bir ev satın alınmıştır. Kredinin faiz oram aylık %0,6 ve aylık taksit tutarı 4.000 TL ise ev satın alınırken ödenen peşinat miktarı aşağıdakilerden hangisidir?|A) 207.318,48 TL~B) 234.456,91 TL~C) 248.951,48 TL~D) 198.756,45 TL~E) 225.326,82 TL|C) 248.951,48 TL|💡 Açıklama: Önce ödenen taksitlerin bugünkü değeri bulunarak çekilen kredi miktarı hesaplanır. PV = 4000 * [(1 - (1.006)^-60) / 0.006] = 201.048,52 TL kredi çekilmiştir. Evin toplam değeri 450.000 TL olduğuna göre Peşinat = 450.000 - 201.048,52 = 248.951,48 TL'dir.",

    "2025-2026 Büt|Aşağıdakilerden hangisi proforma bilanço ve gelir tablosu hazırlanması sırasında kullanılan yöntemlerden biridir?|A) Satışların yüzdesi yöntemi~B) Karşılaştırmalı tablolar analizi~C) Eğilim yüzdeleri yöntemi~D) Yüzde analizi yöntemi~E) Oran analizi yöntemi|A) Satışların yüzdesi yöntemi|💡 Açıklama: Proforma (tahmini) tabloların oluşturulmasında gelecekteki finansal kalemleri satış hacminin bir fonksiyonu olarak belirleyen Satışların Yüzdesi yöntemi yaygın olarak kullanılır. (Diğerleri analiz teknikleridir).",

    "2023-2024 Büt, 2025-2026 Büt, 2 Kez Çıktı!|..... faiz ödemeli, yıllık yüzde ...... faizli kredi yapısı tercih edilirse yıllık kredi maliyeti en düşük olur. Yukarıdaki cümlede boş bırakılan yerlere sırasıyla aşağıdakilerden hangisi getirilmelidir?|A) 3 ayda bir - 8~B) Yıl sonu-9~C) 6 ayda bir- 8,5~D) 4 ayda bir - 9~E) Ayda bir-8|A) 3 ayda bir - 8|💡 Açıklama: Efektif (gerçek) faiz oranlarını hesapladığımızda, (1+0.08/4)^4 - 1 formülüyle 3 ayda bir %8 faizli kredinin yıllık bileşik maliyeti %8,24 ile seçenekler arasındaki en düşük maliyettir.",

    "2023-2024 Büt, 2025-2026 Final, 2025-2026 Büt, 3 Kez Çıktı!|Finansal varlıklara ilişkin olarak bir yatırımdan beklenen getirilerin belirsizlik koşullarındaki dağılımının genişliğini gösteren yöntem aşağıdakilerden hangisidir?|A) Varyans~B) Aritmetik ortalama~C) Medyan~D) Geometrik ortalama~E) Mod|A) Varyans|💡 Açıklama: Varyans (ve bunun karekökü olan standart sapma), beklenen getirilerin ortalamadan ne kadar saptığını, yani olası sonuçların dağılım genişliğini (belirsizlik/risk seviyesini) ölçen temel istatistiksel araçtır.",

    "2024-2025 Vize, 2025-2026 Vize, 2023-2024 Büt, 2025-2026 Büt, 4 Kez Çıktı!|Aşağıdakilerden hangisi finansal tabloların özelliklerinden biri değildir?|A) Farklı tarihlerde farklı para değerleriyle olan işlemleri yansıtırlar.~B) Geçici niteliktedirler.~C) Finansal tablolarda yer alan rakamlar mutlak doğru ve kesindir.~D) Belli bir döneme ait gelir ve giderlerin karşılaştırılmasına odaklanmıştır.~E) Bir firmanın mali durumuna etki yapan tüm etmenleri göstermezler.|C) Finansal tablolarda yer alan rakamlar mutlak doğru ve kesindir.|💡 Açıklama: Finansal tablolarda yer alan amortisman, karşılıklar ve şüpheli alacaklar gibi kalemler işletme yönetiminin politikalarına ve tahminlerine dayandığı için rakamlar her zaman %100 mutlak doğru değildir.",



];

    // --- BURADAN İTİBAREN KOPYALAYIN ---
    let isAllOpen = false;
    let temizlenmisData = []; // Birleştirilmiş verileri global tutalım ki arama/filtreleme yapabilelim

    // 1. SORULARI BİRLEŞTİREN FONKSİYON
    function sorulariBirlestir(dataArray) {
        const soruMap = new Map();

        dataArray.forEach(item => {
            if (!item || item.trim() === '') return;
            
            const parts = item.split('|');
            if (parts.length < 4) return; 
            
            let tagsRaw = parts[0];
            const question = parts[1].trim(); 
            const options = parts[2];
            const correctAnswer = parts[3];
            const explanation = parts[4] ? parts[4] : '';

            let tagsList = tagsRaw.split(',').map(t => t.trim());
            let mevcutSayi = 1;

            tagsList = tagsList.filter(t => {
                const match = t.match(/(\d+)\s*Kez Çıktı/i);
                if (match) {
                    mevcutSayi = parseInt(match[1]);
                    return false; 
                }
                return true;
            });

            if (soruMap.has(question)) {
                let kayit = soruMap.get(question);
                kayit.count += mevcutSayi; 
                
                tagsList.forEach(t => {
                    if (!kayit.tags.includes(t)) {
                        kayit.tags.push(t);
                    }
                });
            } else {
                soruMap.set(question, {
                    tags: tagsList,
                    options: options,
                    correctAnswer: correctAnswer,
                    explanation: explanation,
                    count: mevcutSayi
                });
            }
        });

        const birlestirilmisData = [];
        for (let [qText, data] of soruMap.entries()) {
            let finalTags = [...data.tags];
            if (data.count > 1) {
                finalTags.push(`${data.count} Kez Çıktı!`);
            }
            
            const itemString = `${finalTags.join(',')}|${qText}|${data.options}|${data.correctAnswer}|${data.explanation}`;
            birlestirilmisData.push(itemString);
        }

        return birlestirilmisData;
    }

   // 2. EKRANA BASTIRMA FONKSİYONU (Renklendirme Geliştirilmiş Versiyon)
    function renderQuestions(data) {
        const container = document.getElementById('q-container');
        container.innerHTML = '';
        
        if(data.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Kriterlerinize uygun soru bulunamadı.</p>';
            return;
        }

        data.forEach((item, index) => {
            const parts = item.split('|');
            const tagsRaw = parts[0];
            const question = parts[1];
            const options = parts[2].split('~');
            const correctAnswer = parts[3];
            const explanation = parts[4] || '';

            const card = document.createElement('div');
            card.className = 'card';

            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'tags';
            
            tagsRaw.split(',').forEach(tag => {
                tag = tag.trim();
                if(!tag) return;
                const span = document.createElement('span');
                span.className = 'tag';
                
                let lowerTag = tag.toLowerCase();
                if(lowerTag.includes('ünite') || lowerTag.match(/^u\d+/)) {
                    span.classList.add('tag-u');
                } else if(lowerTag.includes('banko') || lowerTag.includes('kez çıktı')) {
                    span.classList.add('tag-h');
                } else {
                    span.classList.add('tag-e');
                }
                
                span.textContent = tag;
                tagsDiv.appendChild(span);
            });

            const qDiv = document.createElement('div');
            qDiv.className = 'q-text';
            qDiv.textContent = (index + 1) + ". " + question;

            const optUl = document.createElement('ul');
            optUl.className = 'opt';
            
            options.forEach(opt => {
                const li = document.createElement('li');
                li.textContent = opt;
                li.onclick = function() {
                    // Önce bu sorudaki tüm şıkları varsayılan (gri) haline getirerek sıfırla
                    Array.from(optUl.children).forEach(child => {
                        child.style.backgroundColor = '#f8f9fa';
                        child.style.borderColor = 'var(--b)';
                        child.style.color = 'var(--t)';
                        child.style.fontWeight = 'normal';
                    });
                    
                    // Cevap kontrolü
                    if(opt.trim() === correctAnswer.trim()) {
                        // DOĞRU ŞIKKA TIKLANDIYSA: Canlı Yeşil Yap
                        this.style.backgroundColor = '#d4edda';
                        this.style.borderColor = '#28a745';
                        this.style.color = '#155724';
                        this.style.fontWeight = 'bold';
                    } else {
                        // YANLIŞ ŞIKKA TIKLANDIYSA: Canlı Kırmızı Yap
                        this.style.backgroundColor = '#f8d7da';
                        this.style.borderColor = '#dc3545';
                        this.style.color = '#721c24';
                        this.style.fontWeight = 'bold';
                        
                        // KULLANICIYA YARDIM: Aynı esnada doğru olan şıkkı da otomatik yeşile boya
                        Array.from(optUl.children).forEach(child => {
                            if(child.textContent.trim() === correctAnswer.trim()) {
                                child.style.backgroundColor = '#d4edda';
                                child.style.borderColor = '#28a745';
                                child.style.color = '#155724';
                                child.style.fontWeight = 'bold';
                            }
                        });
                    }
                };
                optUl.appendChild(li);
            });

            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster';
            
            const ansBox = document.createElement('div');
            ansBox.className = 'ans-box';
            ansBox.style.display = isAllOpen ? 'block' : 'none';
            ansBox.innerHTML = `<div class="ans-true">Cevap: ${correctAnswer}</div>${explanation ? `<div><em>Açıklama:</em> ${explanation}</div>` : ''}`;

            btn.onclick = () => {
                if (ansBox.style.display === 'block') {
                    ansBox.style.display = 'none';
                    btn.textContent = 'Cevabı Göster';
                } else {
                    ansBox.style.display = 'block';
                    btn.textContent = 'Cevabı Gizle';
                }
            };

            card.appendChild(tagsDiv);
            card.appendChild(qDiv);
            card.appendChild(optUl);
            card.appendChild(btn);
            card.appendChild(ansBox);

            container.appendChild(card);
        });
    }
//buraya kadar 
    // 3. BUTON VE ARAMA FONKSİYONLARI
    function toggleAll() {
        isAllOpen = !isAllOpen;
        const boxes = document.querySelectorAll('.ans-box');
        const btns = document.querySelectorAll('.ans-btn');
        boxes.forEach(box => box.style.display = isAllOpen ? 'block' : 'none');
        btns.forEach(btn => btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
    }

    function filter(val) {
        val = val.toLowerCase();
        if (val === 'all') {
            renderQuestions(temizlenmisData);
            return;
        }
        
        let filtered = [];
        if (val === 'b') {
            // Banko ve çok çıkanlar
            filtered = temizlenmisData.filter(item => {
                let lower = item.toLowerCase();
                return lower.includes('banko') || lower.includes('kez çıktı');
            });
        } else {
            // Sınavlar ve üniteler
            filtered = temizlenmisData.filter(item => {
                const tags = item.split('|')[0].toLowerCase();
                return tags.includes(val);
            });
        }
        renderQuestions(filtered);
    }

    function aramaYap() {
        const val = document.getElementById('arama').value.toLowerCase();
        const filtered = temizlenmisData.filter(item => {
            const parts = item.toLowerCase().split('|');
            const q = parts[1] || '';
            const a = parts[3] || '';
            const exp = parts[4] || '';
            return q.includes(val) || a.includes(val) || exp.includes(val);
        });
        renderQuestions(filtered);
    }

    // 4. BAŞLANGIÇ (Her şeyi tetikleyen an)
    window.onload = () => {
        temizlenmisData = sorulariBirlestir(rawData);
        renderQuestions(temizlenmisData);
    };
    // --- BURAYA KADAR KOPYALAYIN ---

</script>

<script id="agy-device-controller">
function agyToggleDevMenu() {
  const m = document.getElementById('agyDevMenu');
  if(m) m.classList.toggle('show');
}
function agySetDevice(dev, save=true) {
  document.documentElement.setAttribute('data-device', dev);
  document.querySelectorAll('.agy-dev-opt').forEach(opt => {
    opt.classList.toggle('active', opt.getAttribute('onclick').includes(dev));
  });
  const m = document.getElementById('agyDevMenu');
  if(m) m.classList.remove('show');
  if(save) localStorage.setItem('agy_device', dev);
}
function agyToggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('agy_theme', next);
}
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.agy-dev-menu-wrap');
  if(wrap && !wrap.contains(e.target)) {
    const m = document.getElementById('agyDevMenu');
    if(m) m.classList.remove('show');
  }
});
(function agyInit() {
  const savedDev = localStorage.getItem('agy_device') || 'desktop';
  const savedThm = localStorage.getItem('agy_theme') || 'light';
  agySetDevice(savedDev, false);
  document.documentElement.setAttribute('data-theme', savedThm);
})();
</script>
