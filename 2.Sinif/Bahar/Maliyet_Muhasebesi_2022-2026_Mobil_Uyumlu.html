<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUZEF Maliyet Muhasebesi </title>
    <style>
        :root { 
            --p: #1a2b4c; --s: #2c3e50; --a: #f39c12; --suc: #27ae60; 
            --bg: #f4f6f8; --c: #ffffff; --t: #2d3436; --b: #dfe6e9; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        
        .sticky-top {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 1000;
            padding-top: 15px;
            padding-bottom: 15px;
        }

        .header { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--a); margin-bottom: 15px; }
        .header h1 { margin: 5px 0; font-size: 1.5em; }
        .header p { margin: 0; font-size: 0.9em; }
        
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: var(--bg); padding: 5px; border-radius: 10px; }
        
        .btn { background: #ecf0f1; color: var(--p); border: 2px solid var(--b); padding: 8px 12px; font-size: 0.95em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; box-sizing: border-box; }
        .btn:hover { background: #bdc3c7; }
        .btn.active { background: var(--a); color: white; border-color: var(--a); }
        .btn-g { background: #d35400; color: white; }
        
        .card { background: var(--c); border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--p); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .tag-u { background: #3498db; } .tag-e { background: var(--p); } .tag-h { background: #e74c3c; }
        .q-text { font-size: 1.1em; font-weight: bold; color: var(--p); margin-bottom: 15px; }
        .opt { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .opt li { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--b); margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .opt li:hover { background: #eafaf1; border-color: var(--suc); }
        .ans-btn { background: var(--s); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .ans-box { display: none; margin-top: 15px; padding: 15px; background: #eafaf1; border-left: 4px solid var(--suc); border-radius: 6px; }
        .ans-true { color: var(--suc); font-weight: bold; margin-bottom: 5px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .sticky-top { position: relative; padding-top: 5px; padding-bottom: 5px; }
            .header { padding: 10px; margin-bottom: 10px; }
            .header h1 { font-size: 1.2em; }
            .header p { font-size: 0.8em; } 
            .controls { gap: 6px; padding: 0; }
            .btn { padding: 10px; font-size: 0.85em; width: 100%; margin: 0; }
            #kategori-secici, #arama { width: 100%; min-width: 100%; }
            .card { padding: 15px; }
            .q-text { font-size: 1em; }
        }
    
/* =========================================================
   CİHAZ UYARLAMA VE E-KİTAP MODU (DEVICE ADAPTIVE & E-INK)
   ========================================================= */
:root {
    --paper-bg: var(--bg, #f4f6f8);
    --card-surface: var(--card-bg, var(--c, #ffffff));
    --main-text: var(--text, var(--t, #2d3436));
    --border-color: var(--border, var(--b, #dfe6e9));
}

[data-theme="dark"] {
    --bg: #151c25 !important;
    --card-bg: #1c2530 !important;
    --c: #1c2530 !important;
    --text: #e2e8f0 !important;
    --t: #e2e8f0 !important;
    --border: #2e3a48 !important;
    --b: #2e3a48 !important;
    --primary: #8fb3e0 !important;
    --p: #8fb3e0 !important;
    --secondary: #232f42 !important;
    --s: #232f42 !important;
}

[data-theme="dark"] body {
    background-color: #151c25 !important;
    color: #e2e8f0 !important;
}

[data-theme="dark"] .container,
[data-theme="dark"] .page-wrap {
    color: #e2e8f0 !important;
}

[data-theme="dark"] .card,
[data-theme="dark"] .question-card,
[data-theme="dark"] .tips-card,
[data-theme="dark"] .view-mode-bar {
    background-color: #1c2530 !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

[data-theme="dark"] .opt li {
    background-color: #222d3a !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

[data-theme="dark"] .answer-area,
[data-theme="dark"] .ans-box {
    background-color: #172b25 !important;
    color: #e2e8f0 !important;
}

[data-theme="dark"] .header {
    background: linear-gradient(135deg, #1e293b, #0f172a) !important;
    border-bottom: 4px solid #f39c12 !important;
}

[data-theme="dark"] .btn,
[data-theme="dark"] .tab-btn {
    background-color: #222d3a !important;
    color: #e2e8f0 !important;
    border-color: #2e3a48 !important;
}

/* E-INK ORTAK: Animasyon, geçiş, gölge ve efektleri kapat */
[data-device^="eink-"] *,
[data-device^="eink-"] *::before,
[data-device^="eink-"] *::after {
    animation: none !important;
    transition: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    text-shadow: none !important;
}

/* 6 inç Siyah-Beyaz E-Okuyucu (Kindle, Kobo vb. E-Kitap Modu) */
[data-device="eink-6-bw"] {
    --bg: #FFFFFF !important;
    --card-bg: #FFFFFF !important;
    --c: #FFFFFF !important;
    --text: #000000 !important;
    --t: #000000 !important;
    --border: #000000 !important;
    --b: #000000 !important;
    --primary: #000000 !important;
    --p: #000000 !important;
    --secondary: #000000 !important;
    --s: #000000 !important;
}
[data-device="eink-6-bw"] body {
    background-color: #FFFFFF !important;
    color: #000000 !important;
    font-family: Georgia, 'Bookerly', 'Charis SIL', serif, system-ui !important;
    font-size: 17px !important;
    line-height: 1.6 !important;
    padding: 6px !important;
}
[data-device="eink-6-bw"] .container,
[data-device="eink-6-bw"] .page-wrap {
    max-width: 100% !important;
    padding: 0 !important;
}
[data-device="eink-6-bw"] .header {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
}
[data-device="eink-6-bw"] .card,
[data-device="eink-6-bw"] .question-card,
[data-device="eink-6-bw"] .view-mode-bar {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
    margin-bottom: 12px !important;
    padding: 12px !important;
}
[data-device="eink-6-bw"] .opt li {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 1px solid #000000 !important;
    font-size: 16px !important;
}
[data-device="eink-6-bw"] .btn,
[data-device="eink-6-bw"] button,
[data-device="eink-6-bw"] select {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 4px !important;
}
[data-device="eink-6-bw"] .answer-area,
[data-device="eink-6-bw"] .ans-box {
    background: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
}

/* 6 inç Renkli E-Okuyucu */
[data-device="eink-6-color"] body {
    font-size: 16.5px !important;
}
[data-device="eink-6-color"] .card,
[data-device="eink-6-color"] .btn,
[data-device="eink-6-color"] .view-mode-bar {
    border: 1.5px solid #2d3436 !important;
}

/* 10.3 inç Siyah-Beyaz Tablet (Boox, Remarkable vb.) */
[data-device="eink-10-bw"] {
    --bg: #FFFFFF !important;
    --card-bg: #FFFFFF !important;
    --text: #000000 !important;
    --border: #000000 !important;
}
[data-device="eink-10-bw"] body {
    background-color: #FFFFFF !important;
    color: #000000 !important;
    font-family: Georgia, 'Bookerly', serif, system-ui !important;
    font-size: 17.5px !important;
    line-height: 1.65 !important;
}
[data-device="eink-10-bw"] .container {
    max-width: 1100px !important;
}
[data-device="eink-10-bw"] .card,
[data-device="eink-10-bw"] .view-mode-bar {
    border: 2px solid #000000 !important;
}

/* Mobil Profil */
[data-device="mobile"] body {
    padding: 10px !important;
    font-size: 15px !important;
}
[data-device="mobile"] .header {
    padding: 15px 10px !important;
}
[data-device="mobile"] .header h1 {
    font-size: 1.4em !important;
}
[data-device="mobile"] .card {
    padding: 14px !important;
}

</style>
</head>
<body>

<div class="container">

    <!-- CİHAZ PROFİLİ VE GÖRÜNÜM MODU BAR -->
    <div class="view-mode-bar" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:10px 14px; background:var(--card-bg, #fff); border:1px solid var(--border, #dfe6e9); border-radius:10px; margin-bottom:16px;">
        <a href="../index.html" style="display:inline-flex; align-items:center; gap:6px; color:inherit; text-decoration:none; font-weight:800; font-size:13.5px;">
            &larr; Sınıf Derslerine Dön
        </a>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <label for="deviceProfileSelect" style="font-size:12px; font-weight:800; text-transform:uppercase; color:inherit;">Görünüm:</label>
            <select id="deviceProfileSelect" onchange="setAuzefDeviceProfile(this.value)" style="padding:6px 10px; font-weight:700; font-size:13px; border-radius:8px; border:1px solid var(--border, #dfe6e9); background:var(--card-bg, #fff); color:inherit; cursor:pointer;">
                <option value="auto">🔄 Otomatik</option>
                <option value="web">💻 Masaüstü Web</option>
                <option value="mobile">📱 Mobil Cihaz</option>
                <option value="eink-6-bw">📖 6" E-Okuyucu (E-Kitap Modu)</option>
                <option value="eink-6-color">🎨 6" E-Okuyucu (Renkli)</option>
                <option value="eink-10-bw">📝 10.3" Tablet (S/B)</option>
                <option value="eink-10-color">🖍️ 10.3" Tablet (Renkli)</option>
            </select>
            <button id="auzefThemeToggleBtn" type="button" onclick="toggleAuzefTheme()" style="padding:6px 12px; font-weight:800; font-size:13px; border-radius:8px; border:1px solid var(--border, #dfe6e9); background:var(--card-bg, #fff); color:inherit; cursor:pointer;" title="Koyu / Açık Tema">
                🌙 Tema
            </button>
        </div>
    </div>


    <div class="sticky-top">
        <div class="header">
            <h1>AUZEF Maliyet Muhasebesi </h1>
            <p>YBS OZEL (Tüm Üniteler ve Çıkmış Sorular)</p>
        </div>

        <div class="controls">
            <button class="btn btn-g" onclick="toggleAll()">👁️ Tüm Cevapları Aç/Kapat</button>

            <select class="btn" id="kategori-secici" onchange="filter(this.value)" style="background: var(--p); color: white; min-width: 180px; text-align: center; font-weight:bold; padding:8px; border-radius:6px; cursor:pointer;">
                <option value="all">📚 Tüm Havuz (Hepsi)</option>
                <optgroup label="Sınavlar">
                     <option value="vize">📅 Vizeler (Tümü)</option>
                     <option value="final">📅 Finaller (Tümü)</option>
                     <option value="büt">📅 Bütünlemeler</option>
                     <option value="Eski Yıllar">📅 Eski Yıllar</option>
                     </optgroup>
            </select>

            <button class="btn" style="background: #e74c3c; color:white;" onclick="document.getElementById('kategori-secici').value='b'; filter('b')">🔥 Banko Sorular</button>

            <input type="text" id="arama" class="btn" placeholder="🔍 Soru veya cevapta kelime ara..." onkeyup="aramaYap()" style="background: white; color: black; cursor: text; text-align: left; min-width: 250px;">
        </div>
    </div>
    
    <div id="q-container"></div>

</div>


  <script>     
const rawData = [
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2023 Final, 2024-2025 Büt, 5 Kez Çıktı!|Sürekli Envanter yöntemi kullanan Almanya İşletmesinin Ocak ayı başında toplam maliyeti 324 TL olan 18 adet ABC hammaddesi bulunmaktaydı. Ocak ayında aşağıdaki alış ve satışlar gerçekleşmiştir. 8 Ocak Alış 42 birim * 20 TL, 14 Ocak Satış 35 birim * 40 TL, 22 Ocak Alış 28 birim * 22,6 TL, 27 Ocak Satış 42 birim * 40 TL. Hareketli ağırlıklı stok değerleme yöntemine göre 14 Ocak tarihinde yapılan satışın maliyeti aşağıdakilerden hangisidir?|A) 679 TL~B) 582 TL~C) 824 TL~D) 1.079 TL~E) 756 TL|A) 679 TL|Dönem Başı: 18 adet, 324 TL. 8 Ocak Alışı: 42 adet * 20 TL = 840 TL. Toplam: 60 adet, 1164 TL. Yeni Birim Maliyet: 1164 / 60 = 19,4 TL. Satış Maliyeti: 35 adet * 19,4 TL = 679 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2025-2026 Vize, 4 Kez Çıktı!|Azur İşletmesi 5.000 m² alana kurulu bir mağazada satış yapmaktadır. Kullanılan alan için ödenen yıllık kira 200.000 TL'dir. Alan (m²): A(100), B(100), C(300), D(500), ABİYE(2.500), SPOR(1.500). Birinci dağıtım sonucunda spor giyim bölümünün payına düşen kira gideri ne kadardır?|A) 90.000 TL~B) 50.000 TL~C) 80.000 TL~D) 70.000 TL~E) 60.000 TL|E) 60.000 TL|Toplam Alan: 5.000 m². Spor Giyim Bölümü Alanı: 1.500 m². Spor Giyim'in Payı (Dağıtım Oranı): 1.500 / 5.000 = 0,30 (%30). Dağıtılacak Tutar: 200.000 TL * 0,30 = 60.000 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 3 Kez Çıktı!|Bir fabrikadaki ustabaşı aylık üretim hacminden bağımsız olarak 8.500 TL ücret almaktadır. Bunun yanında üretilen her bir birim için 3 TL daha ücret almaktadır. Ustabaşının aldığı toplam ücret fabrika açısından ..... maliyettir. Yukarıda boş bırakılan yere aşağıdakilerden hangisi gelmelidir?|A) sıçrayan~B) yarı değişken~C) yapışkan~D) sabit~E) değişken|B) yarı değişken|İçerisinde hem sabit bir baz bedel (8.500 TL) hem de faaliyet hacmine bağlı olarak değişen bir birim bedel (3 TL) barındıran maliyet türlerine Karma Maliyetler veya Yarı Değişken Maliyetler denir.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2025-2026 Vize, 4 Kez Çıktı!|Maraş İşletmesinde kalıp ve montaj olmak üzere iki adet esas üretim bölümü, yemekhane ve tamir bakım olmak üzere iki tane de destek bölümü bulunmaktadır. Yemekhane ile ilgili faaliyet ölçüsü çalışan sayısıdır. Yemekhane Direkt Maliyeti: 360.000 TL. Çalışan sayıları: Tamir-bakım (30), Kalıp (35), Montaj (55). Kademeli dağıtım yöntemi kullanıldığında yemekhane bölümünden montaj bölümüne dağıtılacak maliyet tutarı aşağıdakilerden hangisidir?|A) 220.000 TL~B) 140.000 TL~C) 105.000 TL~D) 165.000 TL~E) 181.000 TL|D) 165.000 TL|Kademeli dağıtımda yemekhane dağıtılırken diğer tüm personeller hesaba katılır. Tamir-bakım (30) + Kalıp (35) + Montaj (55) = 120 kişi. Kişi Başı: 360.000 / 120 = 3.000 TL. Montaj Payı: 55 * 3.000 TL = 165.000 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2025-2026 Vize, 2024-2025 Büt, 5 Kez Çıktı!|Hariboğlu İşletmesi 6.000 m² alana kurulu bir mağazada jelibon şekerler satmaktadır. 150.000 TL tutarındaki aylık yemek maliyeti maliyet merkezlerine kişi sayısı ile orantılı olarak dağıtılmaktadır. Çalışan Sayısı: Temizlik (30), Tamir Bakım (10), Paketli Satış (70), Açık Satış (90). Paketli satış bölümüne dağıtılacak yemek maliyeti aşağıdakilerden hangisidir?|A) 57.500 TL~B) 52.500 TL~C) 50.000 TL~D) 47.500 TL~E) 55.000 TL|B) 52.500 TL|Toplam Çalışan Sayısı: 30 + 10 + 70 + 90 = 200 kişi. Kişi Başına Düşen Yemek Maliyeti: 150.000 TL / 200 kişi = 750 TL / kişi. Paketli Satış Bölümü Payı: 70 * 750 TL = 52.500 TL.",

    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2024-2025 Büt, 4 Kez Çıktı!|Mikro İşletmesi birleşik bir imalat süreci sonunda A ve B olmak üzere iki farklı ürün ortaya çıkarmaktadır. Net Satış Değeri yöntemi kullanıldığında A ürününe düşen birleşik imalat payı aşağıdakilerden hangisidir? Birleşik Maliyet: 329.000 TL. A ürünü ayrım sonrası maliyet: 406.340 TL, Satış (kutu): 13.000, Fiyat: 51 TL. B ürünü ayrım sonrası maliyet: 97.060 TL, Satış (kutu): 5.900, Fiyat: 26 TL.|A) 269.780 TL~B) 59.220 TL~C) 256.660 TL~D) 676.120 TL~E) 156.280 TL|A) 269.780 TL|A'nın Net Satış Değeri (NSD) = (13.000 * 51) - 406.340 = 256.660 TL. B'nin NSD = (5.900 * 26) - 97.060 = 56.340 TL. Toplam NSD = 313.000 TL. A'nın Payı = 329.000 TL * (256.660 / 313.000) = 269.780 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2021 Final, 2024-2025 Büt, 5 Kez Çıktı!, ⚠️ Dikkat!|Trabzon İşletmesi dönem içerisinde 5.000 adet üretmiş ve 4.000 adet satmıştır. Direkt malzeme: 60.000 TL, Direkt işçilik: 30.000 TL, Genel üretim maliyeti: 120.000 TL, Satış giderleri: 50.000 TL, Yönetim giderleri: 40.000 TL. Birim üretim maliyeti aşağıdakilerden hangisidir?|A) 25 TL~B) 42 TL~C) 18 TL~D) 52 TL~E) 60 TL|B) 42 TL|⚠️ DİKKAT! Piyasada dolaşan bazı notlarda cevap 60 TL yazar, bu YANLIŞTIR. Üretim maliyetine sadece fabrikadaki maliyetler girer. Dönem giderleri (Satış/Yönetim) maliyete GİRMEZ. Toplam Üretim Maliyeti: 60.000 + 30.000 + 120.000 = 210.000 TL. Birim Üretim Maliyeti: 210.000 / 5.000 adet = 42 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2024-2025 Büt, 4 Kez Çıktı!|Birleşik üretim maliyetlerini \"net satış değeri yöntemine\" göre dağıtan bir işletmede, belli bir üretim partisinden 10.000 kg. olarak üretilen ABC mamulünün birleşik maliyet dağıtımından aldığı pay 160.000 TL'dir. Eğer ABC mamulü ayrım noktasında satılacak olursa gelecek dönem 60 TL/kg fiyattan satılabilecektir. ABC mamulü ek işleme tabi tutulup, satılırsa fiyatı 80 TL/kg olacaktır. Ek işlemin maliyeti 200.000 TL olacaktır. Buna göre işletmenin ABC mamulünü ek işleme tabi tutması veya tutmaması arasındaki fark kâr-zarar tablosunu nasıl etkiler?|A) Ek işleme tabi tutulursa kâr 10.000 TL artar.~B) Ek işleme tabi tutulursa kâr 20.000 TL azalır.~C) Ek işleme tabi tutulursa kâr 20.000 TL artar.~D) Ek işleme tabi tutulursa kâr değişmez.~E) Ek işleme tabi tutulursa kâr 10.000 TL azalır.|D) Ek İşleme tabi tutulursa kâr değişmez.|İlave Gelir: (80 - 60) * 10.000 = 200.000 TL. Ek İşlemin İlave Maliyeti: 200.000 TL. Karar: İlave gelir ile ilave maliyet eşittir. Kâr değişmez. Batık maliyet (160k) bu kararda dikkate alınmaz.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2023 Final, 2024 Final, 2024-2025 Büt, 6 Kez Çıktı!|Otomobillerde kullanılan camlar otomobil üreticisi tarafından hangi stok kalemi içerisinde sınıflandırılır?|A) Yardımcı Malzeme Stoku~B) Hammadde Stoku~C) Yarı Mamul Stoku~D) Ticari Mal Stoku~E) Mamul Stoku|B) Hammadde Stoku|Otomobil camı, ürünün bünyesine doğrudan giren, temel bir parçası olan ve maliyeti kolayca izlenebilen \"Direkt İlk Madde ve Malzeme\" yani Hammaddedir.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2024-2025 Büt, 4 Kez Çıktı!, ⚠️ Dikkat!|Giresun İşletmesinin ürettiği bir ürüne ilişkin birim direkt malzeme maliyeti 20 TL, birim direkt işçilik maliyeti 10 TL ve birim genel üretim maliyeti 30 TL olarak gerçekleşmiştir. İşletme geçen dönem 2.000 adet üretim yapmış ve ürünlerin tamamını tanesi 80 TL'den satmıştır. Satış ve genel yönetim giderleri toplamı 20.000 TL olarak gerçekleşmiştir. Döneme ilişkin brüt kâr tutarı aşağıdakilerden hangisidir?|A) 10.000 TL~B) 40.000 TL~C) 30.000 TL~D) 20.000 TL~E) 50.000 TL|B) 40.000 TL|Birim Üretim Maliyeti: DİMM(20) + DİG(10) + GÜG(30) = 60 TL. Satılan Mamul Maliyeti: 2.000 adet * 60 TL = 120.000 TL. Satış Hasılatı: 2.000 adet * 80 TL = 160.000 TL. Brüt Kâr: 160.000 - 120.000 = 40.000 TL. ⚠️ DİKKAT! (20.000 TL'lik faaliyet gideri brüt kârdan DÜŞÜLMEZ.)",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2024-2025 Bahar Final, 4 Kez Çıktı!|I. Maliyet türlerinin maliyet yerlerine dağıtılması II. Yardımcı maliyet yerlerinde toplanan maliyetlerin esas maliyet yerlerine dağıtılması III. Esas maliyet yerlerinde toplanan maliyetlerin o bölümlerdeki mamullere dağıtılması. Mercan İşletmesinin maliyet dağıtımında izlemesi gereken adımların doğru sıralaması aşağıdakilerden hangisidir?|A) III, I, II~B) II, III, I~C) II, I, III~D) I, II, III~E) III, II, I|D) I, II, III|Maliyet dağıtımı hiyerarşisi: 1. Dağıtım (Ortak giderlerin yerlere dağıtımı), 2. Dağıtım (Yardımcı yerlerin esas yerlere aktarımı), 3. Dağıtım (Esas yerlerden doğrudan ürünlere yüklenmesi).",
    
    "2022-2023 Vize, 2024 Vize, 2024-2025 Bahar Final, 2024-2025 Büt, 4 Kez Çıktı!|Can İşletmesinin Ocak ayı başında birim maliyeti 5 TL olan 8 adet ABC stoku mevcuttur. 12 Ocak tarihinde birim maliyeti 7 TL olan 10 adet daha ABC stoku alınmıştır. 25 Ocak tarihinde 12 adet ABC stoku tanesi 9 TL'den satılmıştır. İşletme stokları ile ilgili olarak ilk giren ilk çıkar yöntemini uyguluyorsa Ocak ayı için brüt kâr tutarı aşağıdakilerden hangisidir?|A) 28 TL~B) 35 TL~C) 108 TL~D) 40 TL~E) 54 TL|D) 40 TL|Satış Hasılatı: 12 adet * 9 TL = 108 TL. Satılan Malın Maliyeti (FIFO): En eski 8 adet * 5 TL = 40 TL. Kalan 4 adet * 7 TL = 28 TL. Toplam Maliyet: 68 TL. Brüt Kâr: 108 - 68 = 40 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2024-2025 Büt, 4 Kez Çıktı!|Maliyetlerle ilgili aşağıdakilerden hangisi doğrudur?|A) Toplam değişken maliyetler, faaliyet hacmi artarken azalırlar.~B) Toplam sabit maliyetler, faaliyet hacmi artarken azalırlar.~C) Birim değişken maliyetler, faaliyet hacmi artarken azalırlar.~D) Birim değişken maliyetler, faaliyet hacmi artarken artarlar.~E) Birim sabit maliyetler, faaliyet hacmi artarken azalırlar.|E) Birim sabit maliyetler, faaliyet hacmi artarken azalırlar.|Sabit Maliyetler: Toplamda sabittirler. Ancak faaliyet hacmi arttıkça, bu sabit toplam daha çok sayıdaki ürüne paylaştırılacağı için \"ürün başına düşen (birim) sabit maliyet\" azalır.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 3 Kez Çıktı!|Maraş İşletmesi Direkt Dağıtım Yöntemi: Yemekhane Maliyeti: 360.000 TL | Tamir-bakım: 300.000 TL. Kalıp Direkt Maliyeti: 244.000 TL. Çalışan Sayısı: Kalıp(35), Montaj(55). Tamir Saati: Kalıp(16.000), Montaj(4.000). Direkt dağıtım yöntemi kullanıldığında kalıp bölümünde biriken toplam maliyet tutarı ne kadardır?|A) 278.000 TL~B) 424.000 TL~C) 624.000 TL~D) 661.000 TL~E) 461.000 TL|C) 624.000 TL|Yemekhaneden Kalıba: 360.000 * [35 / (35+55)] = 140.000 TL. Tamir-Bakımdan Kalıba: 300.000 * [16.000 / (16.000+4.000)] = 240.000 TL. Toplam: Kendi direkt maliyeti (244.000) + Yemekhane (140.000) + Tamir (240.000) = 624.000 TL.",

"2022-2023 Vize, 2024 Vize, 2025 Vize, 2024 Final, 2024-2025 Bahar Final, 2024-2025 Büt, 6 Kez Çıktı!|Trabzon İşletmesi 5.000 adet üretmiş ve 4.000 adet satmıştır. (Önceki sorulardan birim maliyeti 42 TL bulunmuştu). Birim satış fiyatı 80 TL ise brüt kâr tutarı aşağıdakilerden hangisidir?|A) 102.000 TL~B) 152.000 TL~C) 172.000 TL~D) 62.000 TL~E) 122.000 TL|B) 152.000 TL|Satış Hasılatı: 4.000 adet * 80 TL = 320.000 TL. Satılan Mal Maliyeti: 4.000 adet * 42 TL = 168.000 TL. Brüt Kâr: 320.000 - 168.000 = 152.000 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2021 Final, 2024-2025 Büt, 5 Kez Çıktı!|Amasya İşletmesinde Ocak ayı başında toplam maliyeti 266 TL olan 14 adet ABC hammaddesi bulunmaktaydı. 8 Ocak Alış: 42 birim * 20 TL. 16 Ocak Satış: 35 birim * 40 TL. İlk giren ilk çıkar (FIFO) stok değerleme yöntemine göre 16 Ocak tarihinde satılan malın maliyet tutarı aşağıdakilerden hangisidir?|A) 700 TL~B) 1.106 TL~C) 686 TL~D) 1.200 TL~E) 1.400 TL|C) 686 TL|Satış maliyeti en eski stoktan başlar. 35 adetlik satışın 14 adedi en eski stoktan (266 TL). Kalan 21 adedi 8 Ocak alımlarından (21 * 20 TL = 420 TL). Toplam Satış Maliyeti: 266 + 420 = 686 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2025-2026 Vize, 2024-2025 Büt, 5 Kez Çıktı!|Bal İşletmesi toplam 200.000 TL üretim maliyetine katlanarak 50 adet kaykay üretmiştir. Kaykayların 35 tanesi 5.000 TL'den satılmıştır. İşletmenin döneme ilişkin brüt kârı aşağıdakilerden hangisidir?|A) 40.000 TL~B) 50.000 TL~C) 35.000 TL~D) 45.000 TL~E) 30.000 TL|C) 35.000 TL|Birim Kaykay Maliyeti: 200.000 / 50 = 4.000 TL. Satış Hasılatı: 35 * 5.000 = 175.000 TL. Satılan Mamul Maliyeti: 35 * 4.000 = 140.000 TL. Brüt Kâr: 175.000 - 140.000 = 35.000 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2024-2025 Büt, 4 Kez Çıktı!, ⚠️ Dikkat!|Aşağıdakilerden hangisi endirekt maliyetlere örnek olarak verilemez?|A) Yemek üretiminde kullanılan tuz~B) Fabrikada kullanılan taşıtların amortismanı~C) Ayakkabı üretiminde çalışan ustabaşının maaşı~D) Mobilya üretiminde kullanılan tutkal~E) Mobilya üretiminde kullanılan kereste|E) Mobilya üretiminde kullanılan kereste|⚠️ DİKKAT: Öğrenci notlarında hatalı olarak amortisman der. KANMAYIN! Soru endirekt 'olmayan' yani 'Direkt Maliyeti' sormaktadır. Kereste, mobilyanın doğrudan ana maddesidir ve Direkt İlk Madde Malzemedir.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2025-2026 Vize, 4 Kez Çıktı!|Bir fabrikada 1.280.000 TL aydınlatma maliyeti yüzölçümü ile orantılı olarak dağıtılmaktadır. Yemekhane: 400 m², Tamir-Bakım: 100 m², Kesim: 4.000 m², Montaj: 3.500 m², TOPLAM: 8.000 m². 1. dağıtım sonucunda Yemekhane bölümüne dağıtılacak olan aydınlatma maliyeti aşağıdakilerden hangisidir?|A) 640.000 TL~B) 16.000 TL~C) 128.000 TL~D) 64.000 TL~E) 560.000 TL|D) 64.000 TL|Dağıtım Oranı: Yemekhanenin alanı (400 m²) / Toplam alan (8.000 m²) = 0,05 (%5). Yemekhane Payı: 1.280.000 TL * 0,05 = 64.000 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2025-2026 Vize, 2024 Final, 2024-2025 Büt, 6 Kez Çıktı!|Maraş İşletmesi Kademeli Dağıtım Yöntemi: Tamir-Bakım'ın kendi maliyeti 300.000 TL. Yemekhaneden Tamir-Bakım'a 90.000 TL pay gelmiştir. Tamir-Bakım saatleri: Kalıp(16.000), Montaj(4.000). Toplam 20.000 saat. Kademeli dağıtım yöntemi kullanıldığında tamir bakım bölümünden kalıp bölümüne dağıtılacak mali tutar aşağıdakilerden hangisidir?|A) 390.000 TL~B) 336.000 TL~C) 78.000 TL~D) 312.000 TL~E) 240.000 TL|D) 312.000 TL|Tamir-Bakım'ın Yeni Toplam Maliyeti: 300.000 + 90.000 = 390.000 TL. Kalıp Bölümü Payı: 390.000 TL * (16.000 / 20.000) = 312.000 TL.",
    
    "2022-2023 Vize, 2024 Vize, 2025 Vize, 2025-2026 Vize, 4 Kez Çıktı!|Maraş İşletmesi Direkt Dağıtım Yöntemi: Yemekhane Maliyeti: 360.000 TL. Çalışan Sayısı: Kalıp(35), Montaj(55). Toplam 90. Direkt dağıtım yöntemi kullanıldığında yemekhane bölümünden kalıp bölümüne dağıtılacak maliyet tutarı ne kadardır?|A) 78.000 TL~B) 220.000 TL~C) 105.000 TL~D) 140.000 TL~E) 165.000 TL|D) 140.000 TL|Direkt yöntemde diğer destek bölümü (Tamir-Bakım) yok sayılır. Kalıp Bölümünün Payı: 360.000 TL * (35 / 90) = 140.000 TL.",
    
    "2025 Vize, 2021 Final, 2023 Final, 3 Kez Çıktı!|İstanbul/Samsun İşletmesinin ürettiği bir ürüne ilişkin birim direkt malzeme maliyeti 15 TL, birim direkt işçilik maliyeti 6 TL, ve birim genel üretim maliyeti 19 TL olarak gerçekleşmiştir. İşletme geçtiğimiz dönem tanesi 75 TL'den 2.000 adet üretmiş ve satmıştır. Satış ve genel yönetim giderleri 30.000 TL olarak gerçekleşmiştir. Döneme ilişkin brüt kâr tutarı aşağıdakilerden hangisidir?|A) 80.000 TL~B) 40.000 TL~C) 70.000 TL~D) 100.000 TL~E) 88.000 TL|C) 70.000 TL|Birim Üretim Maliyeti: 15 (DİMM) + 6 (DİG) + 19 (GÜG) = 40 TL. Toplam Satılan Mamul Maliyeti: 2.000 adet * 40 TL = 80.000 TL. Toplam Satış Hasılatı: 2.000 adet * 75 TL = 150.000 TL. Brüt Kâr: 150.000 TL (Hasılat) - 80.000 TL (SMM) = 70.000 TL.",
    
    "2025 Vize, 2024 Final, 2024-2025 Büt, 4 Kez Çıktı!|Susurluk mobilya fabrikasında işçiler haftalık 40 saat çalışmaktadır ve saat başına 16 TL ücret almaktadırlar. Fazla mesai için saat ücretinin 1,5 katı ödenmektedir. İşçiler acil bir siparişin yetiştirilmesi için Nisan ayının ilk haftasında 44 saat çalışmış ise ilgili sipariş için hesaplanan direkt işçilik tutarı aşağıdakilerden hangisidir?|A) 736 TL~B) 640 TL~C) 704 TL~D) 960 TL~E) 1.056 TL|A) 736 TL|Acil ve özel siparişlerde fazla mesai ücretinin tamamı direkt işçiliğe yazılır. Normal Ücret: 40 saat * 16 TL = 640 TL. Fazla Mesai: 4 saat * (16 * 1,5) = 96 TL. Toplam: 640 + 96 = 736 TL.",
    
    "2025 Vize, 2024 Final, 2024-2025 Büt, 4 Kez Çıktı!|Hatay İşletmesinde Bakım ve Personel olmak üzere iki hizmet bölümü bulunmaktadır. Bakım bölümünün maliyetleri bakım saatleri ile, personel bölümünün maliyeleri ise personel sayısı ile orantılı olarak üretim bölümlerine (A ve B) dağıtılmaktadır. Direkt dağıtım yöntemi kullanıldığında Bakım bölümünden B bölümüne dağıtılacak maliyet aşağıdakilerden hangisidir? (Bakım maliyeti: 360.000 TL. Bakım saatleri: A bölümü 1.230, B bölümü 680)|A) 128.168~B) 100.398~C) 110.230~D) 167.330~E) 87.742|A) 128.168|Direkt dağıtımda destek bölümleri birbirini yok sayar. Sadece A ve B arası dağıtılır. Toplam: 1.230 + 680 = 1.910 saat. B Payı: 360.000 * (680 / 1.910) = 128.167,53 (Yuvarlandığında 128.168).",
    
    "2021 Final, 1 Kez Çıktı!|Bergen İşletmesi 6.800 m² alana kurulu bir mağazada satış yapmaktadır. A, B, C, D yardımcı hizmet bölümleri ile bayan giyim ve erkek giyim olmak üzere iki adet esas satış yeri bulunmaktadır. Bu bölümlerin kapsadıkları alanlara ilişkin bilgiler aşağıda sunulmuştur. Kullanılan alan için ödenen yıllık kira 170.000 TL'dir. Alan (m²): A(1000), B(500), C(900), D(800), BAYAN(2500), ERKEK(1100). Birinci dağıtım sonucunda erkek giyim bölümünün payına düşen kira gideri ne kadardır?|A) 12.500 TL~B) 62.500 TL~C) 27.500 TL~D) 25.000 TL~E) 15.000 TL|C) 27.500 TL|Kira gideri toplam alana (m²) bölünerek dağıtılır. Toplam Alan: 6.800 m². Erkek Giyim: 1.100 m². Dağıtım: (1.100 / 6.800) * 170.000 = 27.500 TL.",
    
    "2021 Final, 1 Kez Çıktı!|Su şişeleyen bir fabrikada aşağıdakilerden hangisi sabit maliyettir?|A) Makinelerin amortismanı~B) Su~C) Şişeler~D) Direkt işçilik~E) Makineleri çalıştırmak için kullanılan enerji|A) Makinelerin amortismanı|Sabit maliyetler üretim hacminden etkilenmeyen maliyetlerdir. Makinelerin amortismanı zamana bağlıdır ve üretimden bağımsız sabittir. Su, şişe ve enerji değişkendir.",
    
    "2021 Final, 1 Kez Çıktı!|Bir süpermarkette satılan ürünler aşağıdaki hangi stok kalemi içerisinde sınıflandırılabilir?|A) Yardımcı malzeme stoku~B) Ham madde stoku~C) Yarı mamul stoku~D) İşletme malzemesi stoku~E) Mal stoku|E) Mal stoku (Ticari Mal)|Süpermarketler ticaret işletmesidir. Sadece alıp satmak amacıyla, üzerinde değişiklik yapmadan elde tuttukları stoklara Ticari Mal (Mal Stoku) denir.",
    
    "2021 Final, 1 Kez Çıktı!|Muğla İşletmesinde kesme ve dikme olmak üzere iki adet esas üretim bölümü, yemekhane ve tamir bakım olmak üzere iki tane de destek bölümü bulunmaktadır. Yemekhane Direkt Maliyet: 180.000 TL. Çalışan Sayısı: Kesme (35), Dikme (55). Direkt dağıtım yöntemi kullanıldığında yemekhane bölümünden kesme bölümüne dağıtılacak maliyet tutarı aşağıdakilerden hangisidir?|A) 39.000 TL~B) 52.500 TL~C) 82.500 TL~D) 70.000 TL~E) 110.000 TL|D) 70.000 TL|Direkt dağıtımda destekler birbirini yok sayar. Yemekhane (180.000 TL) Kesme (35) ve Dikme (55) arasında dağıtılır. Toplam: 90 kişi. Kesme Payı = 180.000 * (35 / 90) = 70.000 TL.",
    
    "2021 Final, 1 Kez Çıktı!|Muğla İşletmesinde kesme ve dikme olmak üzere iki adet esas üretim bölümü, yemekhane ve tamir bakım olmak üzere iki tane de destek bölümü bulunmaktadır. Yemekhane Direkt Maliyet: 180.000 TL. Tamir-Bakım Maliyet: 150.000 TL. Çalışan Sayısı: Kesme (35), Dikme (55). Tamir Bakım Saati: Kesme (16.000), Dikme (4.000). Kesme Direkt Maliyet: 122.000 TL. Direkt dağıtım yöntemi kullanıldığında kesme bölümünde biriken toplam maliyet tutarı aşağıdakilerden hangisidir?|A) 330.500 TL~B) 312.000 TL~C) 230.500 TL~D) 212.000 TL~E) 139.000 TL|B) 312.000 TL|Kendi Maliyeti (122.000) + Yemekhane Payı (180.000 * 35/90 = 70.000) + Tamir Payı (150.000 * 16000/20000 = 120.000) = 312.000 TL.",
    
    "2021 Final, 1 Kez Çıktı!|Çınar İşletmesi 10.000 m² alana kurulu bir fabrikada kazak üretmektedir. X, Y, Z yardımcı hizmet yerleri ile A, B ve C olmak üzere üç adet esas üretim yeri bulunmaktadır. Kullanılan alan için ödenen yıllık kira 2.000.000 TL'dir. (A'nın alanı 2.000 m²). Birinci dağıtım sonucunda A bölümünün payına düşen kira ne kadardır?|A) 520.000 TL~B) 250.000 TL~C) 200.000 TL~D) 480.000 TL~E) 400.000 TL|E) 400.000 TL|A'nın oranı: 2.000 / 10.000 = %20. A'nın Kira Payı: 2.000.000 TL * 0,20 = 400.000 TL.",
    
    "2021 Final, Vize, 4 Kez Çıktı!|Sinop İşletmesinin Nisan ayı başında toplam maliyeti 266 TL olan 14 adet X ham maddesi bulunmaktaydı. Nisan ayında aşağıdaki alış ve satışlar gerçekleşmiştir: 8 Nisan Alış: 42 birim * 20 TL | 14 Nisan Satış: 35 birim * 40 TL | 22 Nisan Alış: 28 birim * 22 TL | 27 Nisan Satış: 42 birim * 40 TL. İlk giren ilk çıkar (FIFO) stok değerleme yöntemine göre 14 Nisan tarihinde satılan malın maliyet tutarı aşağıdakilerden hangisidir?|A) 1.200 TL~B) 1.400 TL~C) 700 TL~D) 686 TL~E) 1.106 TL|D) 686 TL|Dönem Başı 14 adet (266 TL). Kalan 21 adet 8 Nisan alımlarından (20 TL) = 420 TL. Toplam: 266 + 420 = 686 TL. (Amasya İşletmesi sorusunun tamamen aynısıdır.)",
    
    "2021 Final, 1 Kez Çıktı!|Bir imalat işletmesinin üç temel stok kalemi aşağıdaki şıklardan hangisinde doğru sayılmıştır?|A) Malzeme stoku, alışlar ve mamul stoku~B) İlk madde ve malzeme (ham madde) stoku, yarı mamul stoku ve mamul stoku~C) Malzeme, işçilik ve genel imalat maliyeti~D) Malzeme stoku, kusurlu mallar stoku, hurda stoku~E) Alımlar, ücretler ve mamul stoku|B) İlk madde ve malzeme (ham madde) stoku, yarı mamul stoku ve mamul stoku|İmalat işletmelerinde stoklar bilançoda işlenme seviyelerine göre 3 ana grupta izlenir: Hammadde (hiç işlenmemiş), Yarı Mamul (kısmen işlenmiş), Mamul (tamamlanmış).",
    
    "2021 Final, 1 Kez Çıktı!|Şişli İşletmesi ABC ve XYZ olmak üzere birbirine benzer iki ürün üretmektedir. Ürünler aynı makinede partiler halinde sıra ile üretilmektedir. 2.400 TL tutarındaki genel üretim maliyetlerinin ürünlerle ilişkilendirilmesinde direkt işçilik saatleri (DİS) dikkate alınmaktadır. ABC: Hammadde+DİG 40 TL/br, DİS/br 2 saat, Parti Büyüklüğü 5 adet. XYZ: Hammadde+DİG 60 TL/br, DİS/br 1 saat, Parti Büyüklüğü 50 adet. Yukarıda verilen tablodaki bilgiler dikkate alındığında bir birim ABC ürününün maliyeti aşağıdakilerden hangisidir?|A) 100 TL/br~B) 80 TL/br~C) 40 TL/br~D) 120 TL/br~E) 60 TL/br|D) 120 TL/br|Toplam DİS: (5 adet * 2) + (50 adet * 1) = 60 saat. Yükleme Haddi = 2400 TL / 60 = 40 TL/saat. ABC GÜM = 2 saat * 40 TL = 80 TL. Toplam Birim Maliyet (ABC) = 40 TL (Hammadde+DİG) + 80 TL (GÜM) = 120 TL.",
    
    "2021 Final, 1 Kez Çıktı!|Şişli İşletmesi ABC ve XYZ olmak üzere birbirine benzer iki ürün üretmektedir. Ürünler aynı makinede partiler halinde sıra ile üretilmektedir. 2.400 TL tutarındaki genel üretim maliyetlerinin ürünlerle ilişkilendirilmesinde direkt işçilik saatleri dikkate alınmaktadır. ABC: DİS/br 2 saat, Parti Büyüklüğü 5 adet. XYZ: DİS/br 1 saat, Parti Büyüklüğü 50 adet. Yukarıda verilen tablodaki bilgiler dikkate alındığında direkt işçilik saati başına genel üretim maliyeti yükleme haddi aşağıdakilerden hangisidir?|A) 50 TL/dis~B) 20 TL/dis~C) 40 TL/dis~D) 10 TL/dis~E) 30 TL/dis|C) 40 TL/dis|Toplam GÜM (2400 TL) / Toplam DİS (60 saat) = 40 TL/dis.",
    
    "2021 Final, 1 Kez Çıktı!|Bir hastanedeki aylık veriler kullanılarak aşağıdaki maliyet formülü hazırlanmıştır: Toplam maliyet = 128.000.000 TL + (12.000 TL * Hasta gün sayısı). Maliyet formülündeki \"Hasta gün sayısı\" aşağıdakilerden hangisini ifade etmektedir?|A) Yarı değişken maliyet~B) Birim sabit maliyet~C) Birim değişken maliyet~D) Maliyeti etkileyen faaliyet hacmi~E) Toplam maliyet|D) Maliyeti etkileyen faaliyet hacmi|Y = a + bX formülündeki X değişkeni, maliyeti etkileyen faaliyet hacmidir (maliyet etkeni). Burada toplam maliyeti artıran temel faktör hasta gün sayısıdır.",
    
    "2021 Final, 1 Kez Çıktı!|Aşağıdakilerden hangisi maliyet muhasebesinin temel amaçlarından biri değildir?|A) Birim maliyetin hesaplanması~B) İşletme kararlarına yardımcı olmak~C) Finansal tabloların anlaşılırlığını artırmak~D) Planlamaya yardımcı olmak~E) Kontrol faaliyetine yardımcı olmak|C) Finansal tabloların anlaşılırlığını artırmak|Finansal tabloların anlaşılırlığını artırmak, dışarıya rapor veren finansal (genel) muhasebenin amacıdır, yönetime rapor veren maliyet muhasebesinin değil.",
    
    "2021 Final, 1 Kez Çıktı!|Mine İşletmesinin mart ayında üretim hattının ikinci safhası olan montaj bölümünde üretime giren miktar 6.000 kg, üretimi tamamlanıp mamul ambarına gönderilen miktar 5.000 kg'dir. Montaj bölümünde gerçekleşen üretim esnasında herhangi bir fire gerçekleşmemektedir. Mine İşletmesinin mart ayı sonunda montaj bölümünde üretimi tamamlanmayıp yarı mamul olarak kalan miktar aşağıdakilerden hangisidir?|A) 11.000 kg~B) 0 kg~C) 6.000 kg~D) 1.000 kg~E) 5.000 kg|D) 1.000 kg|Safha maliyette miktar dengesi kuralı: Girenler = Çıkanlar. Üretime Giren (6.000) = Tamamlanan (5.000) + Kalan (X). Kalan Yarı Mamul (X) = 1.000 kg.",
    
    "2021 Final, 1 Kez Çıktı!|Burgaz İşletmesinin kasım ayında üretim hattının birinci safhası olan Kesme bölümünde dönem başı yarı mamul stok miktarı 6.000 kg, üretime giren miktar 16.000 kg, üretimi tamamlanıp ikinci safha olan montaj bölümüne devredilen miktar 20.000 kg'dir. Kesme bölümünde gerçekleşen üretim esnasında herhangi bir fire gerçekleşmemektedir. Burgaz İşletmesinin kasım ayı sonunda Kesme bölümünde üretimi tamamlanmayıp yarı mamul olarak kalan miktar aşağıdakilerden hangisidir?|A) 22.000 kg~B) 10.000 kg~C) 0 kg~D) 6.000 kg~E) 2.000 kg|E) 2.000 kg|Miktar Dengesi: Dönem Başı (6.000) + Üretime Giren (16.000) = 22.000 kg toplam işlenen. Tamamlanıp devredilen 20.000 kg ise, geriye kalan 2.000 kg'dır.",
    
    "2021 Final, 1 Kez Çıktı!|Mersin İşletmesinin Nisan ayı başında toplam maliyeti 324 TL olan 18 adet Y ham maddesi bulunmaktaydı. Nisan ayında aşağıdaki alış ve satışlar gerçekleşmiştir. 8 Nisan Alış: 42 birim * 20 TL. 14 Nisan Satış: 35 birim * 40 TL. 22 Nisan Alış: 25 birim * 22,6 TL. 27 Nisan Satış: 42 birim * 40 TL. Hareketli ağırlıklı stok değerleme yöntemine göre Nisan ayı sonunda işletmenin elinde kalan mal stoku tutarı aşağıdakilerden hangisidir?|A) 354 TL~B) 168 TL~C) 205 TL~D) 452 TL~E) 489 TL|B) 168 TL|8 Nisan Sonrası: (324 + 840) = 1164 TL. Miktar = 60. Yeni Birim: 19,4 TL. 14 Nisan Satış Sonrası: 60 - 35 = 25 adet kalır. Değeri: 485 TL. 22 Nisan Alış Sonrası: (485 + 565) = 1050 TL. Miktar = 50. Yeni Birim: 21 TL. 27 Nisan Satış Sonrası: 50 - 42 = 8 adet kalır. Kalan Stok Tutarı = 8 adet * 21 TL = 168 TL.",
    
    "2021 Final, 1 Kez Çıktı!|Stil İşletmesinin nisan ayında dokuma safhasına ilişkin maliyet ve üretim bilgileri aşağıda verilmiştir. Malzeme imalata sürecin başında ilave edilmektedir. Tamamlanan birimler: 32.600. Dönem sonu yarı mamul, %60 oranında tamamlanmış: 6.000. Dönüştürme maliyetleri açısından eşdeğer birim sayısı aşağıdakilerden hangisidir?|A) 41.200~B) 43.600~C) 38.700~D) 36.200~E) 38.600|D) 36.200|Tamamlananlar tam kabul edilir (32.600). Yarı mamuller eşdeğerine çevrilir: 6.000 * 0,60 = 3.600 tam birim. Toplam Eşdeğer Birim = 32.600 + 3.600 = 36.200.",
    
    "2021 Final, 1 Kez Çıktı!|Arı İşletmesi toplam 100.000 TL üretim maliyetine katlanarak 50 adet motosiklet üretmiştir. Motosikletlerden 30 tanesi 3.000 TL'den satılmıştır. Dönem sonu bilançoda raporlanacak mal stoku tutarı aşağıdakilerden hangisidir?|A) 20.000 TL~B) 60.000 TL~C) 50.000 TL~D) 40.000 TL~E) 70.000 TL|D) 40.000 TL|Birim Üretim Maliyeti = 100.000 / 50 = 2.000 TL. Elde Kalan Ürün = 50 - 30 = 20 adet. Kalan Stok Değeri = 20 adet * 2.000 TL = 40.000 TL. (Stoklar maliyet bedeliyle değerlenir, satış fiyatıyla değil).",
    
    "2021 Final, 1 Kez Çıktı!|Buldan İşletmesi bilgisayar üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 12.000 makine saati çalışmayı ve 93.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiilî olarak 16.000 makine saati çalışılmıştır. İşletmenin genel üretim maliyeti yükleme haddi aşağıdakilerden hangisidir?|A) 5,19 TL/makine saati~B) 6,85 TL/makine saati~C) 5,81 TL/makine saati~D) 7,75 TL/makine saati~E) 6,92 TL/makine saati|D) 7,75 TL/makine saati|Yükleme haddi fiili değil, BÜTÇELENEN (planlanan) veriler kullanılarak önceden hesaplanır. Yükleme Haddi = Bütçelenen GÜM / Bütçelenen Saat = 93.000 / 12.000 = 7,75 TL/saat.",
"2024 Final, 2024-2025 Büt, 2 Kez Çıktı!|Mayıs ayında torna bölümünde 2.300 birim mamul tamamlanarak bir sonraki safhaya transfer edilmiş, torna bölümünde dönem sonu yarı mamul olarak %40 oranında tamamlanmış 500 birim kalmıştır. Torna bölümünde dönem başı yarı mamul bulunmamakta ise mayıs ayı çıktılarının toplam eşdeğer birim sayısı aşağıdakilerden hangisidir?|A) 2.300~B) 2.400~C) 2.000~D) 2.500~E) 2.800|D) 2.500|Tamamlanan ve devredilenler tam (%100) sayılır: 2.300. Dönem sonu yarı mamuller kendi tamamlanma yüzdeleriyle çarpılır: 500 adet * %40 = 200 tam birime denk. Toplam Eşdeğer Birim Sayısı: 2.300 + 200 = 2.500.",
    
    "2024 Final, 2024-2025 Büt, 2 Kez Çıktı!|Buldan İşletmesi bilgisayar üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 12.000 makine saati çalışmayı ve 93.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 16.000 makine saati çalışılmıştır ve yukarıdaki fiilî maliyetlere katlanılmıştır. (Tablo: Endirekt İşçilik 11.000, Fabrika Amortisman 48.000, Makine Tamiri 11.000, Direkt İşçilik 75.000, Endirekt Malzeme 6.000, Su/elektrik 7.000, Reklam 35.000, Satış komisyonları 27.000) Aşağıdaki ifadelerden hangisi doğrudur?|A) 41.000 TL tutarında eksik yükleme yapılmıştır.~B) 41.000 TL tutarında fazla yükleme yapılmıştır.~C) 14.000 TL tutarında eksik yükleme yapılmıştır.~D) 14.000 TL tutarında fazla yükleme yapılmıştır.~E) 21.000 TL tutarında fazla yükleme yapılmıştır.|B) 41.000 TL tutarında fazla yükleme yapılmıştır.|Yüklenen GÜM: 16.000 (fiili saat) * 7,75 (yükleme haddi) = 124.000 TL. Fiili GÜM: Üretime ait endirektler toplanır -> 11k+48k+11k+6k+7k = 83.000 TL. (Direkt maliyetler ve satış giderleri GÜM'e girmez!). Fark: Yüklenen(124k) - Fiili(83k) = +41.000 TL Fazla Yükleme.",
    
    "2023 Final, 2024-2025 Büt, 3 Kez Çıktı!|Bir işletmenin üç farklı bölgesine ait veriler aşağıda tutulmuştur. Satışlar: Kuzey(2.000.000), Doğu(1.250.000), Batı(1.750.000). Direkt Maliyetler: Kuzey(800.000), Doğu(600.000), Batı(500.000). Yukarıda yer almayan endirekt maliyetler toplamı: Genel(700.000) + Faaliyet(400.000) + Diğer(900.000) = 2.000.000 TL. İşletme endirekt maliyetleri, bölgesinin satışını toplam satışlara oranlayarak dağıtmaktadır. Her bir bölge için kârı sırasıyla (Kuzey, Doğu, Batı) aşağıdakilerden hangisidir?|A) 1.200.000, 650.000, 1.250.000~B) Yukarıda verilen veriler ile hesaplanamaz~C) 560.000, 250.000, 690.000~D) 400.000, 150.000, 550.000~E) 760.000, 375.000, 865.000|D) 400.000, 150.000, 550.000|Toplam Satışlar = 5.000.000 TL. Endirekt Maliyetler = 2.000.000 TL. Kuzey Kâr: 2M - 800k - (2M * 2M/5M) = 400.000 TL. Doğu Kâr: 1.25M - 600k - (2M * 1.25M/5M) = 150.000 TL. Batı Kâr: 1.75M - 500k - (2M * 1.75M/5M) = 550.000 TL.",
    
    "2023 Final, 2024-2025 Büt, 3 Kez Çıktı!|Bu işletmenin toplam maliyetine ilişkin veriler aşağıda sunulmuştur. Makine saati başına değişken maliyeti aşağıdakilerden hangisidir? 8.000 saat -> 10.000 TL, 20.000 saat -> 16.000 TL|A) 0,50 TL~B) 0,80 TL~C) 5,00 TL~D) 2,50 TL~E) 1,25 TL|A) 0,50 TL|En Yüksek - En Düşük Hacim Yöntemi: Maliyet Farkı: 16.000 - 10.000 = 6.000 TL. Saat Farkı: 20.000 - 8.000 = 12.000 saat. Birim Değişken Maliyet = 6.000 / 12.000 = 0,50 TL/saat.",
    
    "2023 Final, 2024-2025 Büt, 3 Kez Çıktı!, ⚠️ Dikkat!|Eylül İşletmesinin haziran ayında Kesim safhasına ilişkin maliyet ve üretim bilgileri aşağıda verilmiştir. Malzeme imalata sürecin başında ilave edilmektedir. İşletme ağırlıklı ortalama yöntemini kullanmaktadır. Tamamlanıp bir sonraki safhaya aktarılan ürünlerin toplam maliyeti aşağıdakilerden hangisidir? Tamamlanan birimler: 32.600 | Dönem sonu yarı mamul (%60 tamamlanmış): 6.000. Dönem Başı: Malzeme(20.000), Dönüştürme(15.000). Dönem İçi: Malzeme(62.500), Dönüştürme(105.000).|A) 165.573 TL~B) 147.352 TL~C) 177.344 TL~D) 158.968 TL~E) 189.325 TL|C) 177.344 TL|⚠️ DİKKAT: İşlem sonucu küsuratlıdır. Soruda 'Virgülden sonra 2 hane alınız' dediği için yuvarlama yapılır. Malzeme Birim Maliyeti: 82.500 / 38.600 = 2,137 TL (2,13 alınır). Dönüştürme Birim Maliyeti: 120.000 / 36.200 = 3,314 TL (3,31 alınır). Toplam Birim Maliyet = 5,44 TL. Tamamlananların Maliyeti: 32.600 tam ürün * 5,44 TL = 177.344 TL.",
    
    "2023 Final, 2 Kez Çıktı!|Stil İşletmesinin nisan ayında dokuma sahasına ilişkin maliyet üretim bilgileri aşağıdaki gibidir. Malzeme imalat sürecin başına ilave edilmektedir. İşletme ağırlıklı ortalama yöntemi kullanmaktadır. Malzeme maliyetleri açısından eşdeğer birim maliyeti aşağıdakilerden hangisidir? (Veriler: Dönem Başı Malzeme 20.000, Dönem İçi Malzeme 62.500. Tamamlanan: 32.600, Yarı Mamul: 6.000)|A) 1,91 TL~B) 1,61 TL~C) 10,41 TL~D) 2,13 TL~E) 2,90 TL|D) 2,13 TL|Toplam Malzeme Maliyeti (82.500 TL) / Toplam Eşdeğer Birim (38.600) = 2,137... TL. Yuvarlandığında 2,13 TL.",
    
    "2023 Final, 2 Kez Çıktı!|Altın İşletmesinin bitirme safhasına ilişkin olarak aşağıdaki veriler sunulmuştur. İşletme ağırlıklı ortalama yöntemi uygulamaktadır. Bir sonraki safhaya aktarılan birimlerin toplam malileri aşağıdakilerden hangisidir? Aktarılan: 60.000 birim. Eşdeğer Birimler -> Önceki Safha: 75.000, Malzeme: 75.000, Dönüştürme: 69.000. Toplam Maliyetler -> Önceki Safha: 32.100, Malzeme: 24.000, Dönüştürme: 48.300|A) 91.300 TL~B) 87.000 TL~C) 89.500 TL~D) 82.900 TL~E) Belirsiz|B) 87.000 TL|Önceki Safha Birimi: 32.100 / 75.000 = 0,428. Malzeme Birimi: 24.000 / 75.000 = 0,32. Dönüştürme Birimi: 48.300 / 69.000 = 0,70. Toplam Birim Maliyet: 1,45 TL. Aktarılan Maliyet: 60.000 birim * 1,45 = 87.000 TL.",
    
    "2023 Final, 2024 Final, 2024-2025 Büt, 3 Kez Çıktı!|Paris işletmesi tablet üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 12.000 makine saati, 24.000 işçilik saati çalışmayı ve 186.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 14.000 makine saati çalıştırmıştır. Üretime yüklenen genel üretim maliyeti tutarı aşağıdakilerden hangisidir?|A) 186.000 TL~B) 217.000 TL~C) 15.500 TL~D) 31.000 TL~E) 108.500 TL|B) 217.000 TL|Yükleme Haddi: Bütçelenen GÜM (186.000) / Bütçelenen Makine Saati (12.000) = 15,50 TL/saat. (İşçilik saati çeldiricidir). Yüklenen GÜM: Fiili Saat (14.000) * Yükleme Haddi (15,50) = 217.000 TL.",
    
    "2024 Final, 2024-2025 Bahar Final, 2024-2025 Büt, 3 Kez Çıktı!, ⚠️ Dikkat!|Aşağıdaki tabloda 101, 102 ve 103 nolu siparişlere ilişkin Ocak ve Şubat aylarında gerçekleşen maliyetler sunulmuştur. 101 nolu sipariş ocak ayı sonunda tamamlanmış, Şubat ayında satılmıştır. 102 nolu sipariş Şubat ayında tamamlanmıştır fakat henüz satılmamıştır. 103 nolu sipariş ise Şubat ayı sonu itibariyle tamamlanmamıştır. (Tablo Dağılım: Sipariş 101 -> Ocak 8k, Şubat 5k | Sipariş 102 -> Ocak 9k, Şubat 4k | Sipariş 103 -> Şubat 7k, Mart 6k) Şubat ayı sonu itibariyle mamuller hesabının bakiyesi aşağıdakilerden hangisidir?|A) 39.000 TL~B) 13.000 TL~C) 33.000 TL~D) 26.000 TL~E) 30.000 TL|D) 26.000 TL|⚠️ DİKKAT: 'Mamuller' hesabı, üretimi tamamlanmış ancak henüz satılmamış ürünleri kapsar. - 101 Nolu Sipariş: Şubat'ta tamamlandı, Mart'ta satıldı. Şubat sonunda Mamuldür (13.000 TL). - 102 Nolu Sipariş: Şubat'ta tamamlandı deniyor. O da Şubat sonunda Mamuldür (13.000 TL). - 103 Nolu Sipariş: Yarı Mamuldür. Toplam Mamul: 13.000 + 13.000 = 26.000 TL.",
    
 "2023-2024 Final Bahar, Kez Çıktı!|Yozgat İşletmesi Vasat ve Kaliteli olmak üzere iki ürün üretmektedir. Üretim Adedi: Kaliteli (15.000). Birim Direkt Malzeme: Kaliteli (125 TL), Birim Direkt İşçilik: Kaliteli (30 TL). Makine Saati: Kaliteli (60.000), Vasat (45.000). Parti Sayısı: Kaliteli (1.000), Vasat (1.000). Makine Maliyeti (Toplam 840.000 TL), Taşıma/Depolama (Toplam 510.000 TL). Faaliyet tabanlı maliyetleme kullanıldığında bir birim Kaliteli ürünün toplam üretim maliyeti aşağıdakilerden hangisidir?|A) 155 TL~B) 224 TL~C) 49 TL~D) 204 TL~E) 174 TL|D) 204 TL|1) Makine Haddi: 840.000 / 105.000 saat = 8 TL/saat. Kaliteli Payı = 60.000 * 8 = 480.000 TL. 2) Taşıma Haddi: 510.000 / 2.000 parti = 255 TL/parti. Kaliteli Payı = 1.000 * 255 = 255.000 TL. 3) Toplam Kaliteli GÜM = 480.000 + 255.000 = 735.000 TL. 4) Birim GÜM = 735.000 / 15.000 adet = 49 TL. 5) Toplam Birim Maliyet = 125 (DM) + 30 (Dİ) + 49 (GÜM) = 204 TL.",
    
    "2024 Final, 2024-2025 Bahar Final, 2 Kez Çıktı!|Aşağıdakilerden hangisi sipariş bazında (parti bazında) bir faaliyet olarak sınıflandırılabilir?|A) Üretimde kullanılacak malzemelerin sipariş edilmesi~B) Teslimat için müşterilerin aranması~C) Ürünlerin tasarlanması~D) Yıllık bütçenin hazırlanması~E) Ürünlere barkod yapıştırılması|A) Üretimde kullanılacak malzemelerin sipariş edilmesi|Malzemelerin sipariş edilmesi veya makine hazırlıkları, bir üretim partisi (siparişi) için topluca yapılan eylemlerdir ve 'Parti (Sipariş) Bazında Faaliyet' olarak nitelendirilir.",
    
    "2024 Final, 2024-2025 Bahar Final, 2024-2025 Büt, 3 Kez Çıktı!|Haziran ayında Kesme bölümünde 4.600 birim mamul tamamlanarak bir sonraki safhaya transfer edilmiştir. Kesme bölümünde dönem sonu yarı mamul olarak %50 oranında tamamlanmış 1.000 birim kalmıştır. Kesme bölümünde dönem başı yarı mamul bulunmamakta ise Haziran ayı çıktılarının toplam eşdeğer birim sayısı aşağıdakilerden hangisidir?|A) 1.000~B) 500~C) 5.600~D) 5.100~E) 4.600|D) 5.100|Eşdeğer Birim = Tamamlananlar + (Dönem Sonu * Yüzde) = 4.600 + (1.000 * 0,50) = 5.100 birim.",
    
    "2024 Final, 2024-2025 Bahar Final, 2 Kez Çıktı!|Mikro İşletmesi birleşik bir imalat süreci sonunda A ve B olmak üzere iki farklı ürün ortaya çıkarmaktadır. Maliyetlerin dağıtılmasında Net Satış Değeri yöntemi kullanıldığında B ürününe ilişkin toplam maliyet aşağıdakilerden hangisidir? (Veriler: Birleşik Maliyet 329.000 TL | A'nın Ayrım Sonrası Maliyeti 406.340 TL, Satış Fiyatı 51 TL, Satış Miktarı 13.000 | B'nin Ayrım Sonrası Maliyeti 97.060 TL, Satış Fiyatı 26 TL, Satış Miktarı 5.900).|A) 156.280 TL~B) 269.780 TL~C) 256.660 TL~D) 59.220 TL~E) 676.120 TL|A) 156.280 TL|A NSD = (13.000 * 51) - 406.340 = 256.660 TL. B NSD = (5.900 * 26) - 97.060 = 56.340 TL. Toplam NSD = 313.000 TL. B'nin Ortak Payı = 329.000 * (56.340 / 313.000) = 59.220 TL. B'nin Toplam Maliyeti = Ortak Pay (59.220) + Kendi Ek Maliyeti (97.060) = 156.280 TL.",
    
    "2024 Final, 2024-2025 Bahar Final, 2024-2025 Büt, 3 Kez Çıktı!|Aşağıdakilerden hangisi birim bazında bir faaliyet ölçüsüdür?|A) Her bir pakete etiketin yapıştırılması~B) Malzemelerin sipariş edilmesi~C) Depo çalışanlarının eğitilmesi~D) Müşterilerle satış görüşmesi yapılması~E) Yıllık bütçenin hazırlanması|A) Her bir pakete etiketin yapıştırılması|Her bir 'adet' ürün için rutin olarak tekrarlanan, ürün sayısı arttıkça doğru orantılı olarak artan faaliyetler birim bazındadır.",
    
    "2024 Final, 2024-2025 Bahar Final, 2024-2025 Büt, 3 Kez Çıktı!|Bir mağazada A ve B olmak üzere iki adet yardımcı maliyet merkezi, C ve D olmak üzere iki adet esas maliyet merkezi bulunmaktadır. Mağazada 2023 yılı Ocak ayında gerçekleşen 640.000 TL tutarındaki elektrik maliyetinin maliyet yerlerine dağıtılması gerekmektedir. Elektrik maliyeti yüzölçümü ile orantılı olarak dağıtılmaktadır. 1. dağıtım sonucunda A bölümüne dağıtılacak olan elektrik maliyeti aşağıdakilerden hangisidir? (Yüzölçümleri: A 400 m², Toplam 8.000 m²).|A) 280.000 TL~B) 64.000 TL~C) 32.000 TL~D) 320.000 TL~E) 8.000 TL|C) 32.000 TL|Birinci dağıtım her zaman ilgili dağıtım anahtarına göre oran kurularak yapılır. Dağıtım Oranı: 400 m² / 8.000 m² = 0,05. A Bölümü Payı: 640.000 TL * 0,05 = 32.000 TL.",
    
    "2024 Final, 2024-2025 Bahar Final, 2024-2025 Büt, 3 Kez Çıktı!|Aşağıdakilerden hangisi üretim hacmi temelli bir maliyet etkenidir?|A) Sipariş hazırlama sayısı~B) Tasarım sayısı~C) Makine saatleri~D) Müşteri ziyareti sayısı~E) Kalıp değiştirme adedi|C) Makine saatleri|Üretim hacmini doğrudan yansıtan (Makine saatleri, Direkt işçilik saatleri vb.) etkenler hacim temelli etkenlerdir. Diğer şıklar faaliyete dayalı maliyetlemenin (parti veya ürün bazlı) etkenleridir.",
    
    "2024 Final, 2024-2025 Bahar Final, 2024-2025 Büt, 3 Kez Çıktı!|Bir işletme, iki farklı ürün üretmektedir: Ürün A ve Ürün B. (Sipariş İşleme Havuzu: 60.000 TL / 120 Sipariş | Makine Ayarı Havuzu: 40.000 TL / 80 Ayar) Ürün A: 30 sipariş, 20 ayar. Ürün B: 90 sipariş, 60 ayar. Buna göre, Ürün A'ya yüklenmesi gereken toplam faaliyet maliyeti kaç TL'dir?|A) 35.000 TL~B) 20.000 TL~C) 25.000 TL~D) 30.000 TL~E) 15.000 TL|C) 25.000 TL|Sipariş Haddi: 60.000 / 120 = 500 TL/sipariş. Ayar Haddi: 40.000 / 80 = 500 TL/ayar. Ürün A Sipariş Yükü: 30 sipariş * 500 TL = 15.000 TL. Ürün A Ayar Yükü: 20 ayar * 500 TL = 10.000 TL. Toplam: 15.000 + 10.000 = 25.000 TL.",
    
    "2024-2025 Bahar Final, ⚠️ Dikkat!|Aşağıdakilerden hangisi değer yaratmayan bir faaliyettir? (Not: Soru kökünde dizgi hatası vardır, aslında 'değer YARATAN' faaliyeti sormaktadır)|A) Tamamlanmış mamüllerin incelenmesi~B) Malzemenin fabrika içerisinde taşınması~C) Satın alınan malzemenin depolanması~D) Hammaddenin mamüle dönüştürülmesi~E) Kusurlu ürünler için yeniden çalışılması|D) Hammaddenin mamüle dönüştürülmesi|⚠️ DİKKAT: Soruda 'değer yaratmayan' yazıyor ancak şıkların 4'ü değer yaratmayan israf faaliyetidir (taşıma, depolama, inceleme, tamir). Tek değer yaratan (faydalı) faaliyet D şıkkıdır. Sınavda bu hatalı soru gelirse D'yi işaretleyin.",
    
    "2024-2025 Büt, ⚠️ Dikkat!|İstanbul Şirketi yarı iletken çip üretmektedir. Direkt malzemeler üretim sürecinin başında eklenirken, dönüştürme maliyetleri eşit eklenmektedir. Başlangıç stoku yoktur. Direkt Malzeme Toplamı: 950.000 TL | Dönüştürme Toplamı: 4.625.000 TL. Başlanan Üretim: 475.000 çip | Tamamlanan: 425.000 çip. Dönem Sonu Yarı Mamul: Kalan çiplerin dönüştürme maliyeti %50. Üretimi tamamlanan çiplerin toplam maliyeti aşağıdakilerden hangisidir?|A) 357.000 TL~B) 3.217.000 TL~C) 4.289.000 TL~D) 3.856.000 TL~E) 5.219.000 TL|E) 5.219.000 TL|⚠️ DİKKAT: Yuvarlama Tuzağı! Malzeme Eşdeğeri: 475.000. Birim Mlyt: 950.000 / 475.000 = 2 TL. Dönüştürme Eşdeğeri: 425.000 + (50.000 * 0,5) = 450.000. Birim Mlyt: 4.625.000 / 450.000 = 10,2777... TL (Soru hazırlayıcısı 10,28 TL olarak yuvarlamış!). Tamamlanan Maliyet: 425.000 * (2 + 10,28) = 5.219.000 TL.",
    
    "2024-2025 Büt|Dönem başı yarı mamüller 2.000 birim, dönem sonu yarı mamüller 1.000 birim ve hesabı yapılacak toplam birim sayısı 5.000 birimdir. Üretimi tamamlanan ve transfer edilen birim sayısı aşağıdakilerden hangisidir?|A) 4.000~B) 7.000~C) 1.000~D) 2.000~E) 6.000|A) 4.000|Miktar Dengesi: Hesabı Yapılacak Toplam Üretim = Tamamlananlar + Dönem Sonu Yarı Mamul. 5.000 = Tamamlananlar + 1.000. Tamamlananlar = 4.000 birim.",
    
    "2024-2025 Büt|Genel üretim maliyetlerini imalata yüklemek için önceden belirlenmiş bir oran kullanan bir şirket, aşağıdaki durumların hangisinde her zaman 'fazla genel üretim maliyeti' yükleyecektir?|A) Üretimin bütçelenen kapasiteden fazla olması~B) Fiili kapasitenin bütçelenen kapasiteden fazla olması~C) Gerçekleşen genel üretim maliyetlerinin stoklara yüklenen genel üretim maliyetlerinden az olması~D) Gerçekleşen genel üretim maliyetinin stoklara yüklenen genel üretim maliyetlerinden fazla olması~E) Kapasitenin fiili üretimden fazla olması|C) Gerçekleşen genel üretim maliyetlerinin stoklara yüklenen genel üretim maliyetlerinden az olması|Eğer üretim partilerine 'Yüklediğiniz' tutar, ay sonunda fiilen 'Gerçekleşen (katlanılan)' tutardan daha büyükse, ürünlere olması gerekenden fazlasını yüklemişsiniz demektir. Bu duruma 'Fazla Yükleme' denir.",
"2024-2025 Büt, ⚠️ Dikkat!|50.000 makine saatinde toplam fabrika genel giderleri 230.000 TL ve 60.000 makine saatinde toplam fabrika genel giderleri 280.000 TL olarak bütçelenmiştir. Bütçelenen sabit maliyetler 60.000 saat için, 50.000 saat için bütçelenen 80.000 TL sabit maliyetten yüzde 25 daha fazladır. Birim çıktı başına bütçelenen değişken maliyet nedir?|A) 1,38 TL~B) 2,30 TL~C) 3,00 TL~D) 3,33 TL~E) 3,83 TL|C) 3,00 TL|⚠️ DİKKAT: Sabit maliyet değiştiği için klasik formül uygulanmaz. 50.000 Saat Durumu: Toplam Maliyet (230.000) = Sabit (80.000) + Toplam Değişken (150.000). Birim Değişken = 150.000 / 50.000 = 3 TL/saat.",
    
    "2024-2025 Büt, ⚠️ Dikkat!|Eylül ayında karıştırma safhasında 46.000 TL tutarında üretim maliyeti gerçekleşmiştir. Dönem içerisinde safha açısından 2.300 birimin üretimi tamamlanmış ve dönem sonu yarı mamul olarak %40 oranında tamamlanmış 500 birim kalmıştır. Karıştırma safhasında Eylül ayı başında yarı mamul bulunmamaktadır. Eşdeğer birim maliyeti aşağıdakilerden hangisidir?|A) 16,43 TL~B) 200,00 TL~C) 18,40 TL~D) 184,00 TL~E) 20,00 TL|C) 18,40 TL|⚠️ DİKKAT: Diğer sınavlarda D. Sonu Kalan Toplam Maliyet sorulurken burada sadece Eşdeğer Birim Maliyeti sorulmuş. Eşdeğer Birim: 2.300 + (500 * %40) = 2.500 birim. Eşdeğer Birim Maliyeti: 46.000 TL / 2.500 = 18,40 TL.",
    
    "2024-2025 Büt, ⚠️ Dikkat!|İstanbul İşletmesinin Haziran ayı başında toplam maliyeti 324 TL olan 18 adet AGI hammaddesi bulunmaktaydı. Hareketli ağırlıklı stok değerleme yöntemine göre Haziran ayı satılan malın maliyeti tutarı aşağıdakilerden hangisidir? (Tablo: 8 Haz Alış: 42 x 20 - 14 Haz Satış: 35 x 40 - 22 Haz Alış: 25 x 22,6 - 27 Haz Satış: 42 x 40)|A) 1.648 TL~B) 1.153 TL~C) 1.079 TL~D) 1.230 TL~E) 1.561 TL|E) 1.561 TL|⚠️ DİKKAT: Vize sınavlarında sadece ilk satışın maliyeti (679 TL) sorulurken, burada tüm ayın maliyeti sorulmuş! İlk Alış Sonrası Ortalama: (324+840)/(18+42) = 19,4 TL. 1. Satış Maliyeti = 35 * 19,4 = 679 TL. Kalan: 25 birim (485 TL). İkinci Alış Sonrası Ortalama: (485+565)/(25+25) = 21 TL. 2. Satış Maliyeti = 42 * 21 = 882 TL. Toplam Haziran Satış Maliyeti = 679 + 882 = 1.561 TL.",
    
    "2024-2025 Büt|Önceki safha maliyetlerinin hesaplanması aşağıdakilerden hangisi ile benzerlik gösterir?|A) Safhanın başında eklenen direkt işçilik maliyetleri~B) Safhanın başında eklenen dönüştürme maliyetleri~C) Safhanın başında eklenen dönem başı stok maliyetleri~D) Safhanın sonunda eklenen genel üretim maliyeti~E) Safhanın başında eklenen ayrı bir direkt malzeme maliyeti|E) Safhanın başında eklenen ayrı bir direkt malzeme maliyeti|Önceki safhadan devralınan maliyetler, ürün yeni safhaya girer girmez o ürünün temeli olduğu için sanki sürecin en başında eklenen yepyeni bir direkt malzeme gibi muamele görür.",
    
    "2024-2025 Büt, ⚠️ Dikkat!|Giresun İşletmesi birleşik bir imalat süreci sonunda mısır şurubu ve mısır nişastası olmak üzere iki farklı ürün ortaya çıkarmaktadır. Maliyetlerin dağıtılmasında Net Satış Değeri yöntemi kullanıldığında mısır şurubu üretimine ilişkin 'toplam maliyet' aşağıdakilerden hangisidir? (Ortak Maliyet 329.000. Mısır Şurubu Satış: 13.000 * 51. Ek İşlem: 406.340 - Nişasta Satış: 5.900 * 26. Ek İşlem: 97.060)|A) 269.780 TL~B) 256.660 TL~C) 676.120 TL~D) 156.280 TL~E) 59.220 TL|C) 676.120 TL|⚠️ DİKKAT: Vize sınavında sadece 'ortak payı' (A Şıkkı) soruluyordu. Burada ise 'toplam maliyet' istenmiş. Ortak Maliyet Payı: 269.780 TL. Kendi Ek Maliyeti: 406.340 TL. Toplam Maliyet: 269.780 + 406.340 = 676.120 TL.",
    
    "2025 Yeni, 1 Kez Çıktı!|Bir gıda işleme tesisinde P, R ve S ürünleri ortak hammaddeden üretilmektedir. Toplam birleşik maliyet 240.000 TL'dir. Ayrıştırma noktasında ürünlerin fiziki miktarları aşağıdaki gibidir: P Ürünü: 6.000 kg, R Ürünü: 4.000 kg, S Ürünü: 2.000 kg. Şirket, birleşik maliyetleri Fiziksel Miktar Yöntemi ile dağıtmaktadır. Ancak S ürününün satış değeri çok düşük olduğu için yönetim, S ürününe toplam maliyetin sadece %10'unun yüklenmesine karar vermiştir. Kalan maliyet P ve R ürünlerine fiziksel miktarları oranında dağıtılacaktır. Buna göre R ürününe yüklenmesi gereken toplam birleşik maliyet payı kaç TL'dir?|A) 108.000~B) 96.000~C) 72.000~D) 86.400~E) 64.800|D) 86.400|S ürününe 240.000 * %10 = 24.000 TL yüklenir. Kalan dağıtılacak maliyet: 240.000 - 24.000 = 216.000 TL. P ve R'nin toplam fiziksel miktarı: 6.000 + 4.000 = 10.000 kg. R'nin payı: 216.000 * (4.000 / 10.000) = 86.400 TL.",
    
    "2025 Yeni, 1 Kez Çıktı!|Bir fabrikada tek bir üretim sürecinden geçen hammaddeden A, B ve C olmak üzere üç farklı ürün elde edilmektedir. Ayrıştırma noktasına kadar oluşan toplam birleşik maliyet 270.000 TL'dir. Üretim ve satış fiyatları: A: 2.000 br (40 TL), B: 3.000 br (30 TL), C: 5.000 br (20 TL). Net Satış Değeri Yöntemi ile C ürününe dağıtılması gereken birleşik maliyet kaç TL'dir?|A) 110.000 TL~B) 100.000 TL~C) 90.000 TL~D) 70.000 TL~E) 80.000 TL|B) 100.000 TL|Toplam Net Satış Değeri (NSD) = (2000*40) + (3000*30) + (5000*20) = 80.000 + 90.000 + 100.000 = 270.000 TL. C'nin NSD oranı = 100.000 / 270.000. C'nin alacağı pay = 270.000 (Toplam Maliyet) * (100.000 / 270.000) = 100.000 TL.",
    
    "2025 Yeni, 2 Kez Çıktı!|Fabrika binasında kullanılan enerji ile ilgili olarak aşağıdaki ifadelerden hangisi doğrudur?|A) Yarı Sabit - Direkt~B) Sabit Endirekt~C) Değişken - Direkt~D) Sabit Direkt~E) Değişken-Endirekt|B) Sabit Endirekt|Fabrika binasında kullanılan enerji (ısıtma, aydınlatma), üretime göre değişmediği için 'Sabit', doğrudan ürüne yüklenemediği için de 'Endirekt'tir.",
    
    "2025 Yeni, 1 Kez Çıktı!|Bir işletmenin stok kartında yer alan veriler şu şekildedir: Dönem Başı Mevcudu: 50 Adet, Birim Maliyeti 20 TL. Dönem İçi Alış: 150 Adet, Birim Maliyeti 24 TL. Dönem sonunda yapılan sayımda depoda 80 adet mal kaldığı tespit edilmiştir. İşletme Ağırlıklı Ortalama Maliyet yöntemini uyguladığına göre, 'Dönem Sonu Stok' değeri kaç TL'dir?|A) 1.920 TL~B) 2.000 TL~C) 2.760 TL~D) 1.600 TL~E) 1.840 TL|E) 1.840 TL|Toplam Maliyet = (50 * 20) + (150 * 24) = 1.000 + 3.600 = 4.600 TL. Toplam Miktar = 50 + 150 = 200 adet. Ortalama Birim Maliyet = 4.600 / 200 = 23 TL. Dönem Sonu Stok Değeri = 80 adet * 23 TL = 1.840 TL.",
    
    "2025 Yeni, 1 Kez Çıktı!|Bir üretim işletmesinin belirli bir döneme ait maliyet verileri aşağıdaki gibidir: DİMM Giderleri: 50.000 TL, DİG: 30.000 TL, GÜG: 20.000 TL. DB Yarı Mamul: 10.000 TL, DS Yarı Mamul: 15.000 TL. DB Mamul: 25.000 TL, DS Mamul: 20.000 TL. Satılan Mamul Maliyeti kaç TL'dir?|A) 95.000 TL~B) 105.000 TL~C) 120.000 TL~D) 100.000 TL~E) 110.000 TL|D) 100.000 TL|1. Üretim Maliyeti = 50.000 + 30.000 + 20.000 = 100.000 TL. 2. Üretilen Mamul Maliyeti = 100.000 + 10.000 (DB Yarı Mamul) - 15.000 (DS Yarı Mamul) = 95.000 TL. 3. Satılan Mamul Maliyeti = 95.000 + 25.000 (DB Mamul) - 20.000 (DS Mamul) = 100.000 TL.",
    
    "2025 Yeni, 1 Kez Çıktı!|ABC Ticaret'in Mart ayı içindeki stok hareketleri tarih sırasına göre şöyledir: 01 Mart: DB 100 Adet (10 TL), 05 Mart: Alış 100 Adet (14 TL), 10 Mart: Satış 150 Adet, 15 Mart: Alış 100 Adet (18 TL). İşletme Hareketli Ortalama Maliyet yöntemini kullanmaktadır. Buna göre, 15 Mart tarihindeki alış işleminden hemen sonra hesaplanacak yeni 'Ortalama Birim Maliyet' kaç TL olur?|A) 18 TL~B) 14 TL~C) 15 TL~D) 16 TL~E) 12 TL|D) 16 TL|05 Mart Alış Sonrası: (100*10 + 100*14) = 2.400 TL. Toplam Miktar = 200. Ortalama = 12 TL. 10 Mart Satış Sonrası Kalan: 200 - 150 = 50 adet. Kalan Maliyet = 50 * 12 = 600 TL. 15 Mart Alış Sonrası: 600 TL + (100 * 18 TL = 1.800 TL) = 2.400 TL. Yeni Miktar = 50 + 100 = 150 adet. Yeni Ortalama = 2.400 / 150 = 16 TL.",
    
    "2025 Yeni, 1 Kez Çıktı!|Dönem içinde 'Üretilen Mamul Maliyetine', 'Dönem Başı Mamul Stoku' eklenip, 'Dönem Sonu Mamul Stoku' çıkarıldığında gelir tablosundaki hangi kaleme ulaşılır?|A) Net Satışlar~B) Satılan Mamul Maliyeti~C) Dönem Net Karı~D) Brüt Satış Karı~E) Faaliyet Karı|B) Satılan Mamul Maliyeti|Satılan Mamulün Maliyeti (SMM) = Dönem Başı Mamul Stoku + Üretilen Mamul Maliyeti - Dönem Sonu Mamul Stoku formülü ile hesaplanır.",
    
    "2025 Yeni, 1 Kez Çıktı!|XYZ İşletmesinin bir ticari malına ait stok hareketleri sırasıyla aşağıdaki gibidir: Dönem Başı Mevcudu: 100 Adet (10 TL), 1. Alış: 200 Adet (12 TL), 2. Alış: 150 Adet (15 TL). İşletme bu dönem içinde toplam 250 adet ürün satmıştır. İşletme stok değerlemesinde FIFO (İlk Giren İlk Çıkar) yöntemini kullanıyorsa, 'Satılan Ticari Mallar Maliyeti' kaç TL'dir?|A) 2.800 TL~B) 3.300 TL~C) 3.500 TL~D) 3.000 TL~E) 3.100 TL|A) 2.800 TL|FIFO'ya göre satışlar en eski stoktan başlar. 250 adet satışın 100 adedi Dönem Başı stoktan (100 * 10 = 1.000 TL), kalan 150 adedi 1. Alıştan (150 * 12 = 1.800 TL) karşılanır. Toplam SMM = 1.000 + 1.800 = 2.800 TL.",
    
    "2025 Yeni, 1 Kez Çıktı!|Üretim işletmelerinde 'Satılan Mamul Maliyeti' hesaplanırken aşağıdaki kalemlerden hangisi dikkate alınmaz?|A) Dönem Başı Yarı Mamul Stoku~B) Direkt İlk Madde ve Malzeme Giderleri~C) Direkt İşçilik Giderleri~D) Genel Üretim Giderleri~E) Genel Yönetim Giderleri|E) Genel Yönetim Giderleri|Genel Yönetim Giderleri bir 'Dönem Gideri'dir ve üretim (mamul) maliyetine dahil edilmez, doğrudan gelir tablosunda faaliyet gideri olarak raporlanır.",
    
    "2025 Yeni, 1 Kez Çıktı!|Yarı mamuller hesabının dönem başı bakiyesi 4.200 TL'dir. Dönem içerisinde 29.000 TL tutarında direkt malzeme, 3.000 TL tutarında direkt işçilik ve 3.600 TL tutarında genel üretim maliyetine katlanılmıştır. Üretimi tamamlanan mamul maliyeti 37.700 TL ise dönem sonu yarı mamuller hesabının bakiyesi aşağıdakilerden hangisidir?|A) 3.400 TL~B) 2.100 TL~C) 9.900 TL~D) 5.700 TL~E) 1.500 TL|B) 2.100 TL|Miktar Dengesi: (DB Yarı Mamul + Dönem İçi Üretim Maliyetleri) - Tamamlananlar = DS Yarı Mamul. (4.200 + 29.000 + 3.000 + 3.600) - DS Yarı Mamul = 37.700 -> 39.800 - 37.700 = 2.100 TL.",
    
    "2025 Yeni, 1 Kez Çıktı!|Yeni kurulan Avcılar İşletmesinde tek bir ürün üretilmektedir. Birim direkt malzeme maliyeti 20 TL, birim direkt işçilik maliyeti 40 TL ve birim genel üretim maliyeti 60 TL olarak gerçekleşmektedir. İşletme dönem içerisinde 1.000 birim üretmiş ve 500 birim satmıştır. Satış fiyatı birim başına 150 TL olduğuna göre dönem brüt kârı aşağıdakilerden hangisidir?|A) 15.000 TL~B) 30.000 TL~C) 45.000 TL~D) 60.000 TL~E) 90.000 TL|A) 15.000 TL|Birim Maliyet: 20 + 40 + 60 = 120 TL. Satılan Malın Maliyeti (SMM): 500 adet * 120 TL = 60.000 TL. Satış Hasılatı: 500 adet * 150 TL = 75.000 TL. Brüt Kâr: 75.000 - 60.000 = 15.000 TL.",
    
    "2025-2026 Final|Maliyetlerin bir safhadan diğer safhaya aktarılmasında hangi kayıt yapılır?|A) Önceki safhaya ilişkin yarı mamuller borçlandırılır, bir sonraki safhaya ilişkin yarı mamuller alacaklandırılır.~B) Bir sonraki safhaya ilişkin yarı mamuller borçlandırılır, hammadde alacaklandırılır.~C) Mamuller hesabı alacaklandırılır, yarı mamuller hesabı borçlandırılır.~D) Bir sonraki safhaya ilişkin yarı mamuller borçlandırılır, önceki safhaya ilişkin yarı mamuller alacaklandırılır.~E) Mamuller borçlandırılır, yarı mamuller alacaklandırılır.|D) Bir sonraki safhaya ilişkin yarı mamuller borçlandırılır, önceki safhaya ilişkin yarı mamuller alacaklandırılır.|Safha maliyetlemede, maliyetler üretim akışına göre devredilir. Devralan (bir sonraki) safhanın yarı mamul hesabı borçlandırılırken, devreden (önceki) safhanın yarı mamul hesabı alacaklandırılarak kapatılır.",
    
    "2025-2026 Final|Bir işletmede iki esas üretim gider yeri (A Üretim, B Üretim) ve iki yardımcı hizmet gider yeri (Bakım, Yemekhane) bulunmaktadır. İşletmede oluşan endirekt giderler ve dağıtım anahtarları aşağıdaki gibidir: Kira: 120.000 TL (Alan m²), Elektrik: 90.000 TL (Makine saati), Personel gideri: 60.000 TL (Çalışan sayısı). Gider Yerlerine Ait Dağıtım Ölçüleri: A Üretim: Alan 400, Makine 3.000, Çalışan 30. B Üretim: Alan 300, Makine 2.000, Çalışan 20. Bakım: Alan 200, Makine 500, Çalışan 5. Yemekhane: Alan 100, Makine 500, Çalışan 5. Yukarıdaki bilgilere göre 1. dağıtım sonucunda A üretim gider yerinde toplanan toplam gider kaç TL olur?|A) 123.000 TL~B) 118.000 TL~C) 114.000 TL~D) 105.000 TL~E) 110.000 TL|A) 123.000 TL|1. Dağıtımda tüm giderler ilgili anahtara göre dağıtılır. Kira: Toplam 1000 m². A'nın payı = (400/1000) * 120.000 = 48.000 TL. Elektrik: Toplam 6000 saat. A'nın payı = (3000/6000) * 90.000 = 45.000 TL. Personel: Toplam 60 kişi. A'nın payı = (30/60) * 60.000 = 30.000 TL. A'nın Toplam Gideri = 48.000 + 45.000 + 30.000 = 123.000 TL.",
    
    "2025-2026 Final|İstanbul İşletmesi bilgisayar üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 12.000 makine saati çalışmayı ve 93.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 16.000 makine saati çalışılmıştır. Dönem içerisinde yüklenen genel üretim maliyeti tutarı aşağıdakilerden hangisidir?|A) 83.000 TL~B) 73.000 TL~C) 220.000 TL~D) 93.000 TL~E) 124.000 TL|E) 124.000 TL|Yükleme Haddi = Bütçelenen GÜM (93.000) / Bütçelenen Saat (12.000) = 7,75 TL/saat. Yüklenen GÜM = Fiili Saat (16.000) * Yükleme Haddi (7,75) = 124.000 TL.",
    
    "2025-2026 Final|Aşağıdakilerden hangisi safha maliyetleme sisteminin uygulanmasının en uygun olduğu üretim tipidir?|A) Sürekli ve homojen üretim yapan işletmeler~B) Hizmet işletmeleri~C) Perakende satış işletmeleri~D) Özel siparişe dayalı üretim~E) Proje bazlı üretim|A) Sürekli ve homojen üretim yapan işletmeler|Safha maliyetleme sistemi, birbirinin aynısı olan (homojen) ürünlerin, kesintisiz ve kitleler halinde (sürekli) üretildiği fabrikalarda (örneğin çimento, un, petrol, şeker) uygulanır.",
    
    "2025-2026 Final|Faaliyet tabanı maliyetleme ile ilgili olarak aşağıda verilen ifadelerden hangisi doğrudur?|A) Genel üretim maliyetlerinin ürünlere dağıtılmasında fabrika düzeyinde tek bir genel üretim maliyeti yükleme haddi kullanır.~B) Genel üretim maliyetlerinin ürünlere dağıtılmasında üretim birimi düzeyindeki faaliyetleri dikkate alır.~C) Genel üretim maliyetlerinin ürünlere dağıtılmasında birden çok faaliyet haddi (anahtarı) kullanır.~D) Genel üretim maliyetlerini çoğunlukla direkt işçilik saatlerini dikkate alarak dağıtır.~E) Uygulanması pahalı değildir.|C) Genel üretim maliyetlerinin ürünlere dağıtılmasında birden çok faaliyet haddi (anahtarı) kullanır.|Geleneksel sistemler tek bir yükleme haddi (ör: sadece direkt işçilik saati) kullanırken; FTM (Faaliyet Tabanlı Maliyetleme) giderleri önce faaliyet havuzlarında toplar ve her faaliyet için ayrı bir dağıtım anahtarı (haddi) kullanarak çok daha doğru bir dağıtım yapar.",
    
    "2025-2026 Final|Safha maliyetleme sisteminde dönem sonunda bir safhadaki toplam maliyet, aşağıdakilerden hangisi esas alınarak birim maliyete dönüştürülür?|A) Eşdeğer birim sayısı~B) Toplam satış geliri~C) Birim başına doğrudan işçilik süresi~D) Satın alınan hammadde miktarı~E) Ürünlerin piyasa fiyatı|A) Eşdeğer birim sayısı|Safha maliyetlemede sürece giren ancak henüz tamamlanmayan yarı mamuller bulunduğu için, safhanın toplam maliyeti fiziksel birim sayısına değil, tamamlanma derecelerine göre hesaplanan 'Eşdeğer Birim Sayısına' bölünerek birim maliyet bulunur.",
    
    "2025-2026 Final|ABC Mobilya işletmesi, müşterisi için özel tasarım bir kütüphane dolabı üretmek üzere \"Sipariş No: M-23\"ü açmıştır. Sipariş ile ilgili dönem içinde gerçekleşen maliyetler aşağıdaki gibidir: • Direkt İlk Madde ve Malzeme: 8.000 TL • Direkt İşçilik: 120 saat (saatlik ücret: 50 TL) • Genel Üretim Maliyetleri (GÜM): Yıllık tahmini GÜM 400.000 TL, tahmini direkt işçilik saati ise 5.000 saattir. (GÜM direkt işçilik saatine göre dağıtılmaktadır). Buna göre, sipariş tamamlandığında \"Sipariş No: M-23\"ün toplam maliyeti kaç TL olarak hesaplanır?|A) 18.200 TL~B) 27.400 TL~C) 15.500 TL~D) 23.600 TL~E) 16.400 TL|D) 23.600 TL|1. DİMM Maliyeti: 8.000 TL. 2. DİG Maliyeti: 120 saat * 50 TL = 6.000 TL. 3. GÜM Yükleme Haddi: 400.000 / 5.000 = 80 TL/saat. 4. Siparişe Yüklenen GÜM: 120 saat * 80 TL = 9.600 TL. Toplam Maliyet: 8.000 + 6.000 + 9.600 = 23.600 TL.",
    
    "2025-2026 Final|Bir işletme A ve B olmak üzere iki ürün üretmektedir. Üretilen birim adedi: A(1.500), B(1.500). Kalıp değiştirme sayısı: A(75), B(25). Yukarıda genel üretim maliyetinin bir parçası olan makine kalıplarının değiştirilmesi maliyetine (120.000 TL) ilişkin veriler sunulmuştur. Faaliyet tabanlı maliyetleme sistemi uygulandığında her bir birime dağıtılacak genel üretim maliyeti (TL) sırasıyla (A ve B) aşağıdakilerden hangisidir?|A) 40, 40~B) 30, 10~C) 60, 20~D) 20, 60~E) 10, 30|C) 60, 20|Toplam Kalıp Değiştirme Sayısı = 75 + 25 = 100. Değiştirme Başına Maliyet = 120.000 / 100 = 1.200 TL. A'nın Toplam Payı = 75 * 1.200 = 90.000 TL -> Birim Payı = 90.000 / 1.500 adet = 60 TL. B'nin Toplam Payı = 25 * 1.200 = 30.000 TL -> Birim Payı = 30.000 / 1.500 adet = 20 TL.",
    
    "2025-2026 Final, ⚠️ Dikkat!|Alanya İşletmesi Ahşap ve Karton olmak üzere iki farklı sepet üretmekte ve satmaktadır. Genel üretim maliyetlerinin bir parçası olan 240.000 TL tutarındaki makine hazırlama maliyetine ilişkin veriler şöyledir: Üretilen birim: Ahşap(1.500), Karton(1.500). Makine hazırlama sayısı: Ahşap(75), Karton(25). Faaliyet tabanlı maliyetleme kullanıldığında bir birim ahşap sepete dağıtılacak makine hazırlama maliyeti aşağıdakilerden hangisidir?|A) 40 TL~B) 100 TL~C) 60 TL~D) 120 TL~E) 80 TL|D) 120 TL|⚠️ DİKKAT: Eski sorularda 'Karton' sepet sorulurken burada 'Ahşap' sepet sorulmuş. Toplam Hazırlama: 75 + 25 = 100. Hazırlama Başına Maliyet: 240.000 / 100 = 2.400 TL. Ahşap Sepetin Toplam Payı: 75 hazırlama * 2.400 = 180.000 TL. Birim Ahşap Maliyeti: 180.000 TL / 1.500 adet = 120 TL.",
    
    "2025-2026 Final|Sipariş maliyetleme sistemi uygulayan bir üretim işletmesinde aşağıdaki maliyetlerden hangisinin sipariş maliyet kartlarında yer alması beklenmez?|A) Üretilen birim miktarı~B) Genel üretim maliyeti~C) Direkt malzeme maliyeti~D) Pazarlama maliyeti~E) Direkt işçilik maliyeti|D) Pazarlama maliyeti|Sipariş maliyet kartı, ürünün 'üretim' maliyetlerini toplamak için kullanılır. Üretim maliyetleri Direkt İlk Madde ve Malzeme, Direkt İşçilik ve Genel Üretim Maliyetleridir. Pazarlama maliyeti bir dönem gideridir ve üretim maliyet kartında yer almaz.",
"2024 Final, 2024-2025 Bahar Final, ⚠️ Dikkat!|Aşağıdaki tabloda 101, 102 ve 103 nolu siparişlere ilişkin Ocak ve Şubat aylarında gerçekleşen maliyetler sunulmuştur. 101 nolu sipariş ocak ayı sonunda tamamlanmış, Şubat ayında satılmıştır. 102 nolu sipariş Şubat ayında tamamlanmıştır fakat henüz satılmamıştır. 103 nolu sipariş ise Şubat ayı sonu itibariyle tamamlanmamıştır. Sipariş 101: Ocak (DM: 100, Dİ: 200, GÜM: 300) | Şubat (-) Sipariş 102: Ocak (DM: 50, Dİ: 100, GÜM: 150) | Şubat (DM: 50, Dİ: 100, GÜM: 300) Sipariş 103: Ocak (DM: 200, Dİ: 400, GÜM: 300) | Şubat (DM: 20, Dİ: 40, GÜM: 80) Şubat ayı sonu itibariyle mamuller hesabının bakiyesi aşağıdakilerden hangisidir?|A) 1.040 TL~B) 590 TL~C) 1.790 TL~D) 1.000 TL~E) 2.390 TL|C) 1.790 TL|⚠️ DİKKAT: Gerçek muhasebe kurallarına göre cevap 750 TL'dir (Sadece biten 102 nolu sipariş). Ancak okulun resmi cevap anahtarı, soruyu hazırlayan hocanın terim hatası yapıp 'Toplam Stok' (Mamul + Yarı Mamul) hesaplaması nedeniyle 1.790 TL'yi doğru kabul etmektedir. (Sipariş 102: 750 TL) + (Sipariş 103: 1.040 TL) = 1.790 TL. Sınavda çıkarsa tereddütsüz C şıkkını işaretleyin!",
    "2024 Final, ⚠️ Dikkat!|Bir üretim işletmesinde direkt malzeme imalata sürecin sonunda ilave edilmektedir. Ağustos ayı 2021 yılına ilişkin veriler aşağıda sunulmuştur. Dönem başı yarı mamuller: 151.400 birim Önceki safhadan alınıp başlanan: 451.200 birim Tamamlanan: 401.000 birim Dönem sonu yarı mamuller: 202.000 birim (Dönüştürme maliyeti %55 tamamlanmış) Önceki safha maliyetine ilişkin eşdeğer birim sayısı toplamı aşağıdakilerden hangisidir?|A) 353.400~B) 603.000~C) 202.000~D) 401.000~E) 653.200|B) 603.000|Önceki safha maliyeti açısından, ürün safhaya girdiği an %100 tamamlanmış kabul edilir. Eşdeğer Birim = Tamamlananlar (401.000) + (Dönem Sonu Yarı Mamul (202.000) * %100) = 401.000 + 202.000 = 603.000 birim.",
    "2024 Final|Ocak ayında karıştırma safhasında 92.000 TL tutarında üretim maliyeti gerçekleşmiştir. Dönem içerisinde safha açısından 2.300 birimin üretimi tamamlanmış ve dönem sonu yarı mamul olarak %40 oranında tamamlanmış 500 birim kalmıştır. Karıştırma safhasında Ocak ayı başında yarı mamul bulunmamaktadır. Dönem sonu yarı mamullerin toplam maliyeti aşağıdakilerden hangisidir?|A) 18.400 TL~B) 20.000 TL~C) 11.740 TL~D) 7.360 TL~E) 6.572 TL|D) 7.360 TL|1) Eşdeğer Birim = Tamamlanan (2.300) + [D.Sonu (500) * %40] = 2.500 birim. 2) Eşdeğer Birim Maliyeti = Toplam Maliyet (92.000) / 2.500 = 36,8 TL/birim. 3) D.Sonu Yarı Mamul Maliyeti = 200 eşdeğer birim * 36,8 TL = 7.360 TL.",
    "2024 Final, Kez Çıktı|Maraş İşletmesinde kalıp ve montaj olmak üzere iki adet esas üretim bölümü, yemekhane ve tamir bakım olmak üzere iki tane de destek bölümü bulunmaktadır. Yemekhane maliyetleri çalışan sayısına, tamir bakım maliyetleri tamir-bakım saatlerine göre dağıtılmaktadır. Direkt Maliyetler: Yemekhane 360.000 TL, Tamir-Bakım 300.000 TL Çalışan Sayısı: Tamir-Bakım 30, Kalıp 35, Montaj 55 Tamir Bakım Saatleri: Kalıp 16.000, Montaj 4.000 Kademeli dağıtım yöntemi kullanıldığında tamir bakım bölümünden kalıp bölümüne dağıtılacak maliyet tutarı aşağıdakilerden hangisidir?|A) 312.000 TL~B) 336.000 TL~C) 240.000 TL~D) 390.000 TL~E) 78.000 TL|A) 312.000 TL|1) Önce Yemekhane Dağıtılır: 360.000 TL / 120 Kişi (30+35+55) = 3.000 TL/Kişi. 2) Yemekhaneden Tamir-Bakıma Gelen: 30 kişi * 3.000 TL = 90.000 TL. 3) Tamir-Bakımın Yeni Toplam Maliyeti: 300.000 + 90.000 = 390.000 TL. 4) Tamir Bakımdan Kalıba: 390.000 TL * (16.000 / 20.000) = 312.000 TL.",
    "2024 Final|Aşağıdakilerden hangisi sipariş bazında bir faaliyet olarak sınıflandırılabilir?|A) Üretimde kullanılacak malzemelerin sipariş edilmesi~B) Teslimat için müşterilerin aranması~C) Ürünlerin tasarlanması~D) Yıllık bütçenin hazırlanması~E) Ürünlere barkod yapıştırılması|A) Üretimde kullanılacak malzemelerin sipariş edilmesi|Malzemelerin sipariş edilmesi veya partiye özel makine ayarlarının yapılması, tek tek ürünler için değil bir parti (sipariş) için yapıldığından parti (sipariş) bazında bir faaliyettir.",
    "2024 Final|Mikro İşletmesi birleşik bir imalat süreci sonunda A ve B olmak üzere iki farklı ürün ortaya çıkarmaktadır. Ayrım noktasına kadar birleşik maliyet 329.000 TL'dir. A: Ayrım sonrası maliyet 406.340 TL | Üretim/Satış: 13.000 kutu | Fiyat: 51 TL B: Ayrım sonrası maliyet 97.060 TL | Üretim/Satış: 5.900 kutu | Fiyat: 26 TL Maliyetlerin dağıtılmasında Net Satış Değeri yöntemi kullanıldığında B ürününe ilişkin toplam maliyet aşağıdakilerden hangisidir?|A) 156.280 TL~B) 269.780 TL~C) 256.660 TL~D) 59.220 TL~E) 676.120 TL|A) 156.280 TL|A'nın NSD: (13.000 * 51) - 406.340 = 256.660 TL. B'nin NSD: (5.900 * 26) - 97.060 = 56.340 TL. (Toplam NSD: 313.000 TL) B'nin Ortak Maliyet Payı: 329.000 * (56.340 / 313.000) = 59.220 TL. B'nin TOPLAM Maliyeti = Ortak Pay (59.220) + Kendi Ayrım Sonrası Maliyeti (97.060) = 156.280 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|Trabzon İşletmesi dönem içerisinde aşağıdaki maliyetlere katlanmıştır. İşletme dönem içerisinde 5.000 adet üretmiş ve 4.000 adet satmıştır. Direkt malzeme: 60.000 TL Direkt işçilik: 30.000 TL Genel üretim maliyeti: 120.000 TL Satış giderleri: 50.000 TL Yönetim giderleri: 40.000 TL Birim üretim maliyeti aşağıdakilerden hangisidir?|A) 42 TL~B) 52 TL~C) 18 TL~D) 60 TL~E) 25 TL|A) 42 TL|Üretim maliyetine sadece fabrikadaki maliyetler (DM + Dİ + GÜM) girer. Dönem giderleri (Satış/Yönetim) hesaba katılmaz. Toplam Üretim Maliyeti: 60.000 + 30.000 + 120.000 = 210.000 TL. Birim Üretim Maliyeti: 210.000 / 5.000 adet = 42 TL.",
