    "2024-2025 Bahar Final, Kez Çıktı!|Altın İşletmesinin bitirme safhasına ilişkin olarak yukarıdaki veriler sunulmuştur. İşletme ağırlıklı ortalama yöntemi kullanmaktadır. Dönüştürme maliyeti için eşdeğer birim maliyeti aşağıdakilerden hangisidir? Eşdeğer Birim (Dönüştürme): 69.000 DB Dönüştürme Maliyeti: 3.000 TL Dönem İçi Dönüştürme: 45.300 TL|A) 0,65 TL~B) 0,64 TL~C) 0,70 TL~D) 0,58 TL~E) 0,48 TL|C) 0,70 TL|Toplam Dönüştürme Maliyeti: 3.000 TL (DB) + 45.300 TL (Dİ) = 48.300 TL. Dönüştürme Eşdeğer Birimi: 69.000. Birim Maliyet: 48.300 / 69.000 = 0,70 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|Paris İşletmesi tablet üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 12.000 makine saati, 24.000 işçilik saati çalışmayı ve 186.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 14.000 makine saati çalışılmıştır. İşletmenin genel üretim maliyeti yükleme haddi aşağıdakilerden hangisidir?|A) 186.000 TL~B) 13,28 TL/makine saati~C) 7,75 TL/makine saati~D) 15,5 TL/makine saati~E) 217.000 TL|D) 15,5 TL/makine saati|Yükleme Haddi = Bütçelenen GÜM / Bütçelenen Dağıtım Anahtarı (Makine Saati). 186.000 TL / 12.000 saat = 15,5 TL/makine saati. İşçilik saati ve fiili saatler burada sadece kafa karıştırmak için verilmiştir.",
    "2024-2025 Bahar Final, Kez Çıktı!|Aşağıdakilerden hangisi üretim hacmi temelli bir maliyet etkenidir?|A) Makine saatleri~B) Müşteri ziyareti sayısı~C) Sipariş hazırlama sayısı~D) Tasarım sayısı~E) Kalıp değiştirme adedi|A) Makine saatleri|Üretim hacmini doğrudan yansıtan (Makine saatleri, Direkt işçilik saatleri vb.) etkenler hacim temelli etkenlerdir. Diğer şıklar faaliyete dayalı maliyetlemenin parti veya ürün bazlı etkenleridir.",
    "2024-2025 Bahar Final, Kez Çıktı!|Maraş İşletmesinde kalıp ve montaj olmak üzere iki adet esas üretim bölümü, yemekhane ve tamir bakım olmak üzere iki tane de destek bölümü bulunmaktadır. Yemekhane ile ilgili faaliyet ölçüsü çalışan sayısı, tamir bakım bölümü ile ilgili faaliyet ölçüsü tamir bakım saatleridir. Direkt Maliyetler: Yemekhane 360.000, Tamir-Bakım 300.000 Çalışan Sayısı: Tamir-Bakım 30, Kalıp 35, Montaj 55 Tamir-Bakım Saatleri: Kalıp 16.000, Montaj 4.000 Kademeli dağıtım yöntemi kullanıldığında tamir bakım bölümünden kalıp bölümüne dağıtılacak maliyet tutarı aşağıdakilerden hangisidir?|A) 78.000 TL~B) 312.000 TL~C) 240.000 TL~D) 390.000 TL~E) 336.000 TL|B) 312.000 TL|1) Önce Yemekhane Dağıtılır: 360.000 TL / 120 Kişi (30+35+55) = 3.000 TL/Kişi. 2) Yemekhaneden Tamir-Bakıma Gelen Pay: 30 kişi * 3.000 TL = 90.000 TL. 3) Tamir-Bakımın Yeni Toplam Maliyeti: 300.000 (Kendi) + 90.000 (Gelen) = 390.000 TL. 4) Tamir Bakımdan Kalıp Bölümüne: 390.000 TL * (16.000 / 20.000) = 312.000 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|Ocak ayında karıştırma safhasında 92.000 TL tutarında üretim maliyeti gerçekleşmiştir. Dönem içerisinde safha açısından 2.300 birimin üretimi tamamlanmış ve dönem sonu yarı mamul olarak %40 oranında tamamlanmış 500 birim kalmıştır. Karıştırma safhasında Ocak ayı başında yarı mamul bulunmamaktadır. Dönem sonu yarı mamullerin toplam maliyeti aşağıdakilerden hangisidir?|A) 6.572 TL~B) 20.000 TL~C) 7.360 TL~D) 11.740 TL~E) 18.400 TL|C) 7.360 TL|Eşdeğer Birim: Tamamlanan (2.300) + [D.Sonu (500) * %40] = 2.500 birim. Eşdeğer Birim Maliyeti: 92.000 TL / 2.500 = 36,8 TL. Dönem Sonu Yarı Mamul Maliyeti: 200 eşdeğer birim * 36,8 TL = 7.360 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|Bir üretim işletmesinde Nisan ayında Torna bölümünde 2.300 birim mamul tamamlanarak bir sonraki safhaya transfer edilmiş, Torna bölümünde dönem sonu yarı mamul olarak %40 oranında tamamlanmış 500 birim kalmıştır. Torna bölümünde dönem başı yarı mamul bulunmamakta ise Nisan ayı çıktılarının toplam eşdeğer birim sayısı aşağıdakilerden hangisidir?|A) 2.400~B) 2.800~C) 2.000~D) 2.500~E) 2.300|D) 2.500|Tamamlananlar tam (%100) sayılır: 2.300. Dönem sonu yarı mamuller yüzdesiyle çarpılır: 500 * %40 = 200 tam birime denk. Toplam Eşdeğer Birim Sayısı: 2.300 + 200 = 2.500.",
    "2024-2025 Bahar Final, Kez Çıktı!|Bir fabrikada çalışan mühendislerin aldıkları ücret ile ilgili olarak aşağıdaki maliyet sınıflandırmalarından hangisi doğrudur?|A) Sabit - Direkt~B) Sabit - Üretim dışı~C) Sabit - Endirekt~D) Değişken - Direkt~E) Değişken - Endirekt|C) Sabit - Endirekt|Fabrikada çalışan mühendis ve ustabaşıların maaşları doğrudan belirli bir ürünün içine izlenemediği için 'Endirekt', maaşla çalıştıkları ve üretim miktarından etkilenmedikleri için 'Sabit'tir.",
    "2024-2025 Bahar Final, Kez Çıktı!|Can İşletmesinin Ocak ayı başında birim maliyeti 5 TL olan 8 adet ABC stoku mevcuttur. 12 Ocak tarihinde birim maliyeti 7 TL olan 10 adet daha ABC stoku alınmıştır. 25 Ocak tarihinde 12 adet ABC stoku tanesi 9 TL den satılmıştır. İşletme stokları ile ilgili olarak ilk giren ilk çıkar (FIFO) yöntemini uyguluyorsa Ocak ayı için brüt kâr tutarı aşağıdakilerden hangisidir?|A) 28 TL~B) 54 TL~C) 40 TL~D) 35 TL~E) 108 TL|C) 40 TL|Satış Hasılatı: 12 adet * 9 TL = 108 TL. Satılan Malın Maliyeti (FIFO): Önce eski stok satılır (8 adet * 5 TL = 40 TL). Kalan 4 adet ise yeni stoktan verilir (4 adet * 7 TL = 28 TL). Toplam SMM = 68 TL. Brüt Kâr: 108 - 68 = 40 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|Bir işletme A ve B olmak üzere iki ürün üretmektedir. Üretilen birim: A (1.500), B (1.500) Kalıp değiştirme sayısı: A (75), B (25) Yukarıda genel üretim maliyetinin bir parçası olan makine kalıplarının değiştirilmesi maliyetine (120.000 TL) ilişkin veriler sunulmuştur. Faaliyet tabanı maliyetleme sistemi uygulandığında her bir birime dağıtılacak genel üretim maliyeti (TL) sırasıyla (A ve B) aşağıdakilerden hangisidir?|A) 60, 20~B) 20, 60~C) 30, 10~D) 10, 30~E) 40, 40|A) 60, 20|Toplam Kalıp Değiştirme Sayısı: 75 + 25 = 100. Değiştirme Başına Maliyet: 120.000 / 100 = 1.200 TL. A Ürünü Toplam Payı: 75 * 1.200 = 90.000 TL. Birim Payı: 90.000 / 1.500 = 60 TL. B Ürünü Toplam Payı: 25 * 1.200 = 30.000 TL. Birim Payı: 30.000 / 1.500 = 20 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|Faaliyet Tabanlı Maliyetleme (FTM) sisteminin geleneksel maliyetleme sistemine göre en önemli avantajı aşağıdakilerden hangisidir?|A) Ürünlerin satış fiyatlarını belirlemede kullanılmaması~B) Sadece üretim sürecine odaklanması~C) Maliyetleri sadece doğrudan işçilik üzerinden dağıtması~D) Dolaylı maliyetleri daha doğru bir şekilde ürünlere dağıtması~E) Üretim hacmine dayalı maliyet dağıtımını teşvik etmesi|D) Dolaylı maliyetleri daha doğru bir şekilde ürünlere dağıtması|FTM, genel üretim (dolaylı) giderlerini tek bir kalemde eritmek yerine faaliyet havuzlarına bölerek ve çoklu dağıtım anahtarları kullanarak ürünlere çok daha isabetli ve doğru bir şekilde yansıtır.",
    "2024-2025 Bahar Final, Kez Çıktı!|Paris İşletmesi bilgisayar üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 12.000 makine saati çalışmayı ve 93.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 16.000 makine saati çalışılmıştır ve fiili maliyetlere katlanılmıştır. (Fiili Tablo: Endirekt İşçilik 11.000, Amortisman 48.000, Makine Tamiri 11.000, Direkt İşçilik 75.000, End. Malzeme 6.000, Su/Elk 7.000, Reklam 35.000, Satış 27.000) Buna göre; Paris İşletmesi ile ilgili aşağıdaki ifadelerden hangisi doğrudur?|A) 41.000 TL tutarında fazla yükleme yapılmıştır.~B) 14.000 TL tutarında eksik yükleme yapılmıştır.~C) 21.000 TL tutarında fazla yükleme yapılmıştır.~D) 14.000 TL tutarında fazla yükleme yapılmıştır.~E) 41.000 TL tutarında eksik yükleme yapılmıştır.|A) 41.000 TL tutarında fazla yükleme yapılmıştır.|Yükleme Haddi: 93.000 / 12.000 = 7,75 TL/saat. Yüklenen GÜM: 16.000 saat * 7,75 = 124.000 TL. Fiili GÜM: (11k + 48k + 11k + 6k + 7k) = 83.000 TL. (Direkt işçilik, Reklam ve Satış hesaba katılmaz!) Fark: Yüklenen(124.000) - Fiili(83.000) = 41.000 TL Fazla yüklenmiştir.",
    "2024 Final, 2024-2025 Bahar Final, ⚠️ Dikkat!|Aşağıdaki tabloda 101, 102 ve 103 nolu siparişlere ilişkin Ocak ve Şubat aylarında gerçekleşen maliyetler sunulmuştur. 101 nolu sipariş Ocak ayı sonunda tamamlanmış, Şubat ayında satılmıştır. 102 nolu sipariş Şubat ayında tamamlanmıştır fakat henüz satılmamıştır. 103 nolu sipariş ise Şubat ayı sonu itibariyle tamamlanmamıştır. Sipariş 101: Ocak (DM: 100, Dİ: 200, GÜM: 300) | Şubat (-) Sipariş 102: Ocak (DM: 50, Dİ: 100, GÜM: 150) | Şubat (DM: 50, Dİ: 100, GÜM: 300) Sipariş 103: Ocak (DM: 200, Dİ: 400, GÜM: 300) | Şubat (DM: 20, Dİ: 40, GÜM: 80) Şubat ayı sonu itibariyle mamuller hesabının bakiyesi aşağıdakilerden hangisidir?|A) 590 TL~B) 2.390 TL~C) 1.000 TL~D) 1.790 TL~E) 1.040 TL|D) 1.790 TL|⚠️ DİKKAT ŞAŞIRTMACA / HATALI SORU! Normal muhasebe kurallarına göre 'Mamuller' hesabında sadece bitmiş ve satılmamış ürünler yer alır (Sipariş 102 = 300+450 = 750 TL). Sipariş 103 ise henüz bitmediği için 'Yarı Mamul'dür (900+140 = 1.040 TL). Ancak soruyu hazırlayan kişi şıklara 750 TL'yi koymamış ve aslında 'Dönem Sonu Toplam Stok' (Mamul + Yarı Mamul) değerini sormak istemiştir. Sınavın kabul ettiği cevap: 750 TL (Mamul) + 1.040 TL (Yarı Mamul) = 1.790 TL'dir.",
    "2024-2025 Bahar Final, Kez Çıktı!|Altın İşletmesinin bitirme safhasına ilişkin olarak yukarıdaki veriler sunulmuştur. Malzeme maliyeti için eşdeğer birim maliyeti aşağıdakilerden hangisidir? Eşdeğer Birim (Malzeme): 75.000 DB Malzeme Maliyeti: 1.500 TL Dönem İçi Malzeme: 22.500 TL|A) 0,41 TL~B) 0,30 TL~C) 0,42 TL~D) 0,37 TL~E) 0,32 TL|E) 0,32 TL|Toplam Malzeme Maliyeti = Dönem Başı (1.500) + Dönem İçi (22.500) = 24.000 TL. Birim Eşdeğer Maliyeti = 24.000 / 75.000 = 0,32 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|Aşağıdakilerden hangisi safha maliyetleme sisteminin uygulanmasının en uygun olduğu üretim tipidir?|A) Perakende satış işletmeleri~B) Sürekli ve homojen üretim yapan işletmeler~C) Özel siparişe dayalı üretim~D) Hizmet işletmeleri~E) Proje bazlı üretim|B) Sürekli ve homojen üretim yapan işletmeler|Safha maliyetleme sistemi, ürünlerin birbirinin aynısı (homojen) olduğu ve kesintisiz (sürekli) kitleler halinde üretildiği fabrikalar (örneğin un, petrol, şeker fabrikaları) için en uygunudur.",
    "2024-2025 Bahar Final, Kez Çıktı!|Paris İşletmesi tablet üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 12.000 makine saati, 24.000 İşçilik saati çalışmayı ve 186.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 14.000 makine saati çalışılmıştır. Üretime yüklenen genel üretim maliyeti tutarı aşağıdakilerden hangisidir?|A) 108.500 TL~B) 217.000 TL~C) 186.000 TL~D) 31.000 TL~E) 15.500 TL|B) 217.000 TL|Yükleme Haddi: Bütçelenen GÜM (186.000) / Bütçelenen Makine Saati (12.000) = 15,50 TL/saat. Yüklenen GÜM: Fiili Saat (14.000) * Yükleme Haddi (15,50) = 217.000 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|İstanbul İşletmesi Ahşap ve Karton olmak üzere iki farklı sepet üretmekte ve satmaktadır. Yukarıdaki veriler genel üretim maliyetlerinin bir parçası olan 240.000 TL tutarındaki makine hazırlama maliyetine ilişkindir. Üretilen Birim: Ahşap (1.500), Karton (1.500) Makine Hazırlama Sayısı: Ahşap (75), Karton (25) Faaliyet tabanlı maliyetleme kullanıldığında bir birim karton sepete dağıtılacak makine hazırlama maliyeti aşağıdakilerden hangisidir?|A) 60 TL~B) 40 TL~C) 20 TL~D) 50 TL~E) 30 TL|B) 40 TL|Toplam Hazırlama: 75 + 25 = 100. Hazırlama Başına Maliyet: 240.000 / 100 = 2.400 TL. Karton Sepetin Toplam Payı: 25 hazırlama * 2.400 = 60.000 TL. Birim Karton Maliyeti: 60.000 TL / 1.500 adet = 40 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|I. Maliyet türlerinin maliyet yerlerine dağıtılması II. Yardımcı maliyet yerlerinde toplanan maliyetlerin esas maliyet yerlerine dağıtılması III. Esas maliyet yerlerinde toplanan maliyetlerin o bölümlerdeki mamullere dağıtılması Mercan İşletmesinin maliyet dağıtımında izlemesi gereken adımların doğru sıralaması aşağıdakilerden hangisidir?|A) III, I, II~B) III, I, II (Hatalı Şık Düzeltmesi)~C) II, I, III~D) III, II, I~E) I, II, III|E) I, II, III|Maliyet Dağıtım Hiyerarşisi: 1. Dağıtım: Ortak giderlerin yerlere dağıtımı (I). 2. Dağıtım: Yardımcı hizmet yerlerinin esas yerlere dağıtımı (II). 3. Dağıtım: Esas yerlerden ürünlere yüklenmesi (III).",
    "2024-2025 Bahar Final, Kez Çıktı!, ⚠️ Dikkat!|Aşağıdaki üç ürüne ilişkin birleşik imalat maliyeti 250.000 TL'dir. Birleşik maliyetlerin dağıtılmasında net piyasa (satış) yöntemi kullanılıyorsa her bir ürüne ilişkin stok değeri sırasıyla (A, B, C) aşağıdakilerden hangisidir? A: Ek işlem sonrası satış (150.000), Ek işleme maliyeti (16.000) B: Ek işlem sonrası satış (160.000), Ek işleme maliyeti (9.000) C: Ek işlem sonrası satış (116.125), Ek işleme maliyeti (10.500)|A) 85.750, 96.650, 67.600~B) 134.000, 151.000, 105.650~C) 75.000, 105.000, 70.000~D) 81.000, 114.000, 80.500~E) 101.760, 105.640, 78.100|E) 101.760, 105.640, 78.100|⚠️ DİKKAT: Okulun orijinal cevap anahtarı, stok değerini sormasına rağmen işlemi sadece birleşik maliyet paylarını dağıtarak bırakmış ve ufak yuvarlama hatalarıyla A şıkkını doğru kabul etmiştir. Ancak akademik ve matematiksel olarak DOĞRU olan E şıkkıdır (Ortak Pay + Ek Maliyet). A'nın Ortak Payı: 85.760 -> Stok Değeri: 85.760 + 16.000 = 101.760 TL. B'nın Ortak Payı: 96.640 -> Stok Değeri: 96.640 + 9.000 = 105.640 TL. C'nin Ortak Payı: 67.600 -> Stok Değeri: 67.600 + 10.500 = 78.100 TL.",
    "2024-2025 Bahar Final, Kez Çıktı!|Aşağıdaki işletmelerden hangisinde safha maliyetleme sisteminin uygulanması beklenir?|A) Gelinlik Atölyesi~B) Finansal Danışmanlık Şirketi~C) Mimarlık Ofisi~D) Düğün Davet Organizasyon Şirketi~E) Cep Telefonu Üreticisi|E) Cep Telefonu Üreticisi|Mimarlık, organizasyon ve gelinlik atölyeleri müşteriye özel tekil ürün veya hizmet tasarladıkları için Sipariş Maliyetleme kullanırlar. Cep telefonu üretimi ise seri ve standart üretim olduğu için Safha Maliyetleme kullanır.",
    "2024-2025 Bütünleme, Kez Çıktı!|İstanbul İşletmesi bilgisayar üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 24.000 makine saati çalışmayı ve 372.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 32.000 makine saati çalışılmıştır ve fiili maliyetlere katlanılmıştır. (Fiili Tablo: Endirekt İşçilik 44.000, Fabrika Amortismanı 192.000, Makine Tamiri 44.000, Direkt İşçilik 300.000, Endirekt Malzeme 24.000, Su/Elektrik 28.000, Reklam 140.000, Satış komisyonları 54.000) Yukarıdaki bilgilere göre; aşağıdaki ifadelerden hangisi doğrudur?|A) 56.000 TL tutarında fazla yükleme yapılmıştır.~B) 164.000 TL tutarında eksik yükleme yapılmıştır.~C) 84.000 TL tutarında fazla yükleme yapılmıştır.~D) 56.000 TL tutarında eksik yükleme yapılmıştır.~E) 164.000 TL tutarında fazla yükleme yapılmıştır.|E) 164.000 TL tutarında fazla yükleme yapılmıştır.|Yükleme Haddi: 372.000 / 24.000 = 15,5 TL/saat. Yüklenen GÜM: 32.000 saat * 15,5 = 496.000 TL. Fiili GÜM: Üretime ait endirektler toplanır (44k+192k+44k+24k+28k = 332.000 TL). Direkt işçilik, reklam ve satış giderleri GÜM'e dahil edilmez. Fark: Yüklenen(496.000) - Fiili(332.000) = 164.000 TL Fazla yüklenmiştir.",
    "2024-2025 Bütünleme, Yeni Soru Tipi|Marmara İşletmesi sandalye üretmektedir ve genel üretim maliyetlerini işçilik saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 20.000 işçilik saati çalışmayı ve 120.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 18.000 işçilik saati çalışılmıştır. Fiili olarak gerçekleşen genel üretim maliyeti 150.000 TL olmuştur. Dönem içerisinde imalata yüklenen genel üretim maliyeti tutarı aşağıdakilerden hangisidir?|A) 108.000~B) 150.000~C) 120.000~D) 135.000~E) 30.000|A) 108.000|Yükleme Haddi = Bütçelenen GÜM / Bütçelenen Dağıtım Anahtarı = 120.000 / 20.000 = 6 TL/saat. Yüklenen GÜM = Fiili Saat * Yükleme Haddi = 18.000 * 6 = 108.000 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!|Altın İşletmesinin bitirme safhasına ilişkin olarak yukarıdaki veriler sunulmuştur. İşletme ağırlıklı ortalama yöntemi uygulamaktadır. Önceki safha maliyeti için eşdeğer birim maliyeti aşağıdakilerden hangisidir? Eşdeğer Birim (Önceki Safha): 75.000 DB Önceki Safha Maliyeti: 2.100 TL Dönem İçi Önceki Safha Maliyeti: 30.900 TL|A) 0,76 TL~B) 1,59 TL~C) 0,41 TL~D) 0,44 TL~E) 0,55 TL|D) 0,44 TL|Toplam Önceki Safha Maliyeti = Dönem Başı (2.100) + Dönem İçi (30.900) = 33.000 TL. Birim Eşdeğer Maliyeti = Toplam Maliyet / Eşdeğer Birim = 33.000 / 75.000 = 0,44 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!|Stil İşletmesinin Nisan ayında Dokuma safhasına ilişkin maliyet ve üretim bilgileri yukarıda verilmiştir. Malzeme imalata sürecin başında ilave edilmektedir. Dönüştürme maliyetleri açısından eşdeğer birim maliyeti aşağıdakilerden hangisidir? (Virgülden sonraki iki haneyi dikkate alınız) Tamamlanan: 32.600 Dönem Sonu Yarı Mamul: 6.000 (%60 oranında tamamlanmış) DB Dönüştürme Maliyeti: 15.000 TL Dönem İçi Dönüştürme: 105.000 TL|A) 2,91 TL~B) 3,31 TL~C) 2,90 TL~D) 3,51 TL~E) 3,10 TL|B) 3,31 TL|1) Eşdeğer Birim (Dönüştürme) = Tamamlanan (32.600) + [Dönem Sonu (6.000) * %60] = 36.200 birim. 2) Toplam Dönüştürme Maliyeti = 15.000 (DB) + 105.000 (Dİ) = 120.000 TL. 3) Birim Maliyet = 120.000 / 36.200 = 3,3149... TL. Yuvarlandığında 3,31 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!|Mikro İşletmesi birleşik bir imalat süreci sonunda A ve B olmak üzere iki farklı ürün ortaya çıkarmaktadır. Maliyetlerin dağıtılmasında Net Satış Değeri yöntemi kullanıldığında B ürününe ilişkin toplam maliyet aşağıdakilerden hangisidir? Birleşik Maliyet: 329.000 TL A: Ek işlem sonrası maliyet 406.340 TL | Satış (kutu) 13.000 | Fiyat 51 TL B: Ek işlem sonrası maliyet 97.060 TL | Satış (kutu) 5.900 | Fiyat 26 TL|A) 676.120 TL~B) 156.280 TL~C) 59.220 TL~D) 256.660 TL~E) 269.780 TL|B) 156.280 TL|A'nın Net Satış Değeri (NSD) = (13.000 * 51) - 406.340 = 256.660 TL. B'nin Net Satış Değeri (NSD) = (5.900 * 26) - 97.060 = 56.340 TL. Toplam NSD = 313.000 TL. B'nin Ortak Payı = 329.000 * (56.340 / 313.000) = 59.220 TL. B'nin Toplam Maliyeti = Ortak Pay (59.220) + Ek İşlem Maliyeti (97.060) = 156.280 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!|Sürekli Envanter yöntemi kullanan Almanya İşletmesinin Ocak ayı başında toplam maliyeti 324 TL olan 18 adet ABC hammaddesi bulunmaktaydı. Ocak ayında yukarıdaki alış ve satışlar gerçekleşmiştir. (8 Ocak Alış: 42 x 20 TL | 14 Ocak Satış: 35 x 40 TL | 22 Ocak Alış: 25 x 22,6 TL | 27 Ocak Satış: 12 x 40 TL) Hareketli ağırlıklı stok değerleme yöntemine göre 14 Ocak tarihinde yapılan satışın maliyeti aşağıdakilerden hangisidir?|A) 679 TL~B) 824 TL~C) 756 TL~D) 582 TL~E) 1.079 TL|A) 679 TL|Dönem Başı: 18 adet, Toplam 324 TL. 8 Ocak Alış: 42 adet * 20 TL = 840 TL. Toplam: 60 adet, 1.164 TL. Yeni Birim Ortalama Maliyet = 1.164 / 60 = 19,4 TL. 14 Ocak Satış Maliyeti = 35 adet * 19,4 TL = 679 TL.",
    "2024-2025 Bütünleme|Aşağıdaki ifadelerden hangisi dönüştürme maliyetlerini en iyi şekilde açıklar?|A) Dönüştürme maliyetleri, tüm üretim ve üretim dışı maliyetlerdir.~B) Dönüştürme maliyetleri, pazarlama maliyetleri de dahil olmak üzere tüm üretim dışı maliyetlerdir.~C) Dönüştürme maliyetleri, direkt malzeme maliyetleri dışındaki tüm üretim maliyetleridir.~D) Dönüştürme maliyetleri, sabit satış ve dağıtım maliyetleri dışındaki tüm üretim dışı maliyetlerdir.~E) Dönüştürme maliyetleri, direkt malzeme maliyetleridir.|C) Dönüştürme maliyetleri, direkt malzeme maliyetleri dışındaki tüm üretim maliyetleridir.|Dönüştürme (şekillendirme) maliyeti, hammaddeyi mamule dönüştürmek için katlanılan maliyetlerdir ve Direkt İşçilik ile Genel Üretim Giderleri'nin toplamından oluşur. Direkt malzeme hariç tüm üretim maliyetlerini kapsar.",
    "2024-2025 Bütünleme|Faaliyet Tabanlı Maliyetleme'nin geleneksel maliyetleme sistemlerinden farkı en çok hangi durumda ortaya çıkar?|A) Finansal raporlama yapan şirketlerde~B) Üretim hattı sabit olan firmalarda~C) Tek ürün üreten işletmelerde~D) Çok sayıda farklı ürün üreten ve karmaşık faaliyetlere sahip işletmelerde~E) Sadece hizmet sektöründe faaliyet gösteren firmalarda|D) Çok sayıda farklı ürün üreten ve karmaşık faaliyetlere sahip işletmelerde|Geleneksel sistemler tek ve basit bir dağıtım anahtarı kullanır. İşletmenin ürün çeşitliliği ve faaliyet karmaşıklığı arttıkça, geleneksel sistemin yarattığı maliyet sapmaları büyür ve Faaliyet Tabanlı Maliyetleme'nin (FTM) hassas hesaplamaları çok daha belirgin/farklı bir tablo ortaya koyar.",
    "2024-2025 Bütünleme, Kez Çıktı!|Alanya İşletmesi Ahşap ve Karton olmak üzere iki farklı sepet üretmekte ve satmaktadır. Yukarıdaki veriler genel üretim maliyetlerinin bir parçası olan 240.000 TL tutarındaki makine hazırlama maliyetine ilişkindir. Üretilen Birim: Ahşap 1.500 | Karton 1.500 Makine Hazırlama Sayısı: Ahşap 75 | Karton 25 Faaliyet tabanlı maliyetleme kullanıldığında bir birim ahşap sepete dağıtılacak makine hazırlama maliyeti aşağıdakilerden hangisidir?|A) 40 TL~B) 120 TL~C) 100 TL~D) 60 TL~E) 80 TL|B) 120 TL|Toplam Hazırlama: 75 + 25 = 100. Hazırlama Başına Maliyet: 240.000 / 100 = 2.400 TL. Ahşap Sepetin Toplam Payı: 75 hazırlama * 2.400 = 180.000 TL. Birim Ahşap Maliyeti: 180.000 TL / 1.500 adet = 120 TL.",
    "2024-2025 Bütünleme|Aşağıdaki tabloda verilen bilgiler doğrultusunda dönem içinde kullanılan direkt malzeme maliyeti aşağıdakilerden hangisidir? Direkt malzeme stoku Dönem Başı: 410 TL, Dönem Sonu: 320 TL Satın alınan direkt malzeme: 6.600 TL|A) 6.600 TL~B) 6.690 TL~C) 6.680 TL~D) 6.510 TL~E) 7.100 TL|B) 6.690 TL|Kullanılan Direkt Malzeme = Dönem Başı Stok + Dönem İçi Alışlar - Dönem Sonu Stok. Kullanılan Malzeme = 410 + 6.600 - 320 = 6.690 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!|Bir üretim işletmesinin siparişlerine ilişkin olarak yukarıdaki bilgiler sunulmuştur. 101 ve 102 nolu siparişin üretimine Ocak ayında başlanmıştır. 103 nolu siparişin üretimine Şubat ayında başlanmıştır. 101 nolu siparişin üretimi Şubat ayında tamamlanmıştır ve Mart ayında satılmıştır. 102 nolu sipariş Şubat ayında tamamlanmış fakat Mart ayı sonu itibariyle müşteriye satılmamıştır. 103 nolu sipariş Mart ayı sonu itibariyle henüz tamamlanmamıştır. Sipariş 101 (Ocak: 8k, Şubat: 5k) Sipariş 102 (Ocak: 9k, Şubat: 4k) Sipariş 103 (Şubat: 7k, Mart: 6k) Şubat ayı sonu itibariyle mamuller hesabının bakiyesi aşağıdakilerden hangisidir?|A) 39.000 TL~B) 13.000 TL~C) 33.000 TL~D) 26.000 TL~E) 30.000 TL|D) 26.000 TL|ŞUBAT ayı sonu için analiz: - 101 Numaralı Sipariş: Şubat'ta tamamlandı, Mart'ta satıldı. Şubat sonunda Mamuldür (8.000 + 5.000 = 13.000 TL). - 102 Numaralı Sipariş: Şubat'ta tamamlandı, henüz satılmadı. O da Şubat sonunda Mamuldür (9.000 + 4.000 = 13.000 TL). - 103 Numaralı Sipariş: Şubat'ta başladı ve bitmedi. Yarı Mamuldür (Mamul hesabına girmez). Toplam Mamul Bakiyesi: 13.000 + 13.000 = 26.000 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!|Maraş İşletmesinde kalıp ve montaj olmak üzere iki adet esas üretim bölümü, yemekhane ve tamir bakım olmak üzere iki tane de destek bölümü bulunmaktadır. Yemekhane ile ilgili faaliyet ölçüsü çalışan sayısıdır. Direkt Maliyetler: Yemekhane 360.000 TL Çalışan Sayısı: Kalıp 35, Montaj 55 (Tamir bakım çalışanları dikkate alınmaz çünkü direkt dağıtım) Direkt dağıtım yöntemi kullanıldığında yemekhane bölümünden kalıp bölümüne dağıtılacak maliyet tutarı aşağıdakilerden hangisidir?|A) 220.000 TL~B) 165.000 TL~C) 105.000 TL~D) 78.000 TL~E) 140.000 TL|E) 140.000 TL|Direkt dağıtım yönteminde destek bölümleri birbirlerine pay vermezler, sadece esas üretim yerlerine dağıtılırlar. Toplam Üretim Çalışanı = 35 (Kalıp) + 55 (Montaj) = 90 kişi. Kalıp Bölümü Payı = 360.000 * (35 / 90) = 140.000 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!|Faaliyet Tabanlı Maliyetleme (FTM) sisteminin temel amacı aşağıdakilerden hangisidir?|A) Geleneksel maliyet hesaplama yöntemlerini ortadan kaldırmak~B) Yalnızca direkt maliyetleri analiz etmek~C) Üretim maliyetlerini azaltmak~D) Ürün maliyetlerini daha doğru bir şekilde hesaplamak~E) Satış fiyatlarını belirlemek|D) Ürün maliyetlerini daha doğru bir şekilde hesaplamak|FTM'nin asıl ortaya çıkış amacı, genel üretim giderlerini çoklu faaliyet havuzları ve anahtarları ile dağıtarak çapraz sübvansiyon hatalarını önlemek ve ürün maliyetlerini gerçeğe en yakın (doğru) şekilde hesaplamaktır.",
    "2024-2025 Bütünleme, Kez Çıktı!|Bir işletme, iki farklı ürün üretmektedir: Ürün A ve Ürün B. İşletmede belirlenen 2 faaliyet merkezi ve ilgili bilgiler yukarıdaki gibidir: Sipariş İşleme: 60.000 TL / 120 sipariş Makine Ayarı: 40.000 TL / 80 ayar Ürün A: 30 sipariş, 20 ayar Ürün B: 90 sipariş, 60 ayar Buna göre, Ürün A'ya yüklenmesi gereken toplam faaliyet maliyeti kaç TL'dir?|A) 35.000 TL~B) 20.000 TL~C) 25.000 TL~D) 30.000 TL~E) 15.000 TL|C) 25.000 TL|Sipariş Yükleme Haddi: 60.000 / 120 = 500 TL/sipariş. Ayar Yükleme Haddi: 40.000 / 80 = 500 TL/ayar. Ürün A'ya yüklenen sipariş maliyeti: 30 * 500 = 15.000 TL. Ürün A'ya yüklenen ayar maliyeti: 20 * 500 = 10.000 TL. Toplam Yüklenen = 15.000 + 10.000 = 25.000 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!|Bir üretim işletmesinde direkt malzeme imalata sürecin sonunda ilave edilmektedir. Ağustos ayı 2021 yılına ilişkin veriler yukarıda sunulmuştur. Önceki safhadan alınıp başlanan: 451.200 birim Tamamlanan: 401.000 birim Dönem sonu yarı mamuller: 202.000 birim Önceki safha maliyetine ilişkin eşdeğer birim sayısı toplamı aşağıdakilerden hangisidir?|A) 603.000~B) 401.000~C) 653.200~D) 353.400~E) 202.000|A) 603.000|Ürünler bu safhaya girdiği anda, bir önceki safhanın işlemlerini %100 tamamlamış olarak gelirler. Önceki Safha Eşdeğer Birimi = Tamamlanan (401.000) + [Dönem Sonu Yarı Mamul (202.000) * %100] = 603.000 birim.",
    "2024-2025 Bütünleme, Kez Çıktı!|Bir mağazada A ve B olmak üzere iki adet yardımcı maliyet merkezi, C ve D olmak üzere iki adet esas maliyet merkezi bulunmaktadır. Mağazada gerçekleşen 640.000 TL tutarındaki elektrik maliyeti maliyet yerlerine yüzölçümü ile orantılı olarak dağıtılmaktadır. (Yüzölçümleri: A 400 m², Toplam 8.000 m²) 1. dağıtım sonucunda A bölümüne dağıtılacak olan elektrik maliyeti aşağıdakilerden hangisidir?|A) 8.000 TL~B) 320.000 TL~C) 280.000 TL~D) 64.000 TL~E) 32.000 TL|E) 32.000 TL|1. Dağıtımda maliyetler toplam anahtara bölünerek ilgili merkeze dağıtılır. Dağıtım Oranı: 400 m² / 8.000 m² = 0,05. A Bölümü Payı: 640.000 TL * 0,05 = 32.000 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!, ⚠️ Dikkat!|İstanbul Şirketi, büyük bir şirket tarafından üretilen kişisel bilgisayarın önemli bir parçasını oluşturan yarı iletken bir çip üretmek üzere yeni kurulmuştur. Direkt malzemeler üretim sürecinin başında eklenirken, dönüştürme maliyetleri üretim süreci boyunca eşit olarak eklenmektedir. Başlangıç stoku yoktur. Direkt malzeme maliyeti 950.000 TL, dönüştürme maliyetleri 4.625.000 TL'dir. Üretime başlanan çip: 475.000. Tamamlanan çip: 425.000. Dönem sonu yarı mamullerin dönüştürme maliyetleri %50 tamamlanmıştır. Üretimi tamamlanan çiplerin toplam maliyeti aşağıdakilerden hangisidir?|A) 357.000 TL~B) 3.217.000 TL~C) 4.289.000 TL~D) 3.856.000 TL~E) 5.219.000 TL|E) 5.219.000 TL|⚠️ DİKKAT: Yuvarlama Tuzağı! 1) Malzeme Eşdeğeri: 475.000 birim. Malzeme Birim Maliyeti = 950.000 / 475.000 = 2 TL. 2) Dönüştürme Eşdeğeri: 425.000 + (50.000 * 0,50) = 450.000 birim. Dönüştürme Birim Maliyeti = 4.625.000 / 450.000 = 10,2777... (Soruda 10,28 alınmıştır). 3) Toplam Birim Maliyet = 2 + 10,28 = 12,28 TL. 4) Tamamlanan Maliyet = 425.000 * 12,28 TL = 5.219.000 TL.",
    "2024-2025 Bütünleme, Kez Çıktı!|Dönem başı yarı mamüller 2.000 birim, dönem sonu yarı mamüller 1.000 birim ve hesabı yapılacak toplam birim sayısı 5.000 birimdir. Üretimi tamamlanan ve transfer edilen birim sayısı aşağıdakilerden hangisidir?|A) 4.000~B) 7.000~C) 1.000~D) 2.000~E) 6.000|A) 4.000|Miktar Dengesi Kuralı: Hesabı Yapılacak Toplam = Tamamlanan + Dönem Sonu Yarı Mamul. 5.000 = Tamamlanan + 1.000 Tamamlanan = 5.000 - 1.000 = 4.000 birim.",
    "2024-2025 Bütünleme, Kez Çıktı!|Genel üretim maliyetlerini imalata yüklemek için önceden belirlenmiş bir oran kullanan bir şirket, aşağıdaki durumların hangisinde her zaman fazla genel üretim maliyeti yükleyecektir?|A) Üretimin bütçelenen kapasiteden fazla olması~B) Fiili kapasitenin bütçelenen kapasiteden fazla olması~C) Gerçekleşen genel üretim maliyetlerinin stoklara yüklenen genel üretim maliyetlerinden az olması~D) Gerçekleşen genel üretim maliyetinin stoklara yüklenen genel üretim maliyetlerinden fazla olması~E) Kapasitenin fiili üreitmden fazla olması|C) Gerçekleşen genel üretim maliyetlerinin stoklara yüklenen genel üretim maliyetlerinden az olması|Ürünlere önceden belirlediğiniz had (oran) ile yüklediğiniz tutar, dönem sonunda muhasebede fiilen 'gerçekleşen' maliyetten daha büyükse (yani gerçekleşen maliyet, yüklenenden az ise), bu duruma 'Fazla Yükleme' denir.",
    "2024-2025 Bütünleme, Kez Çıktı!, ⚠️ Dikkat!|50.000 makine saatinde toplam fabrika genel giderleri 230.000 TL ve 60.000 makine saatinde toplam fabrika genel giderleri 280.000 TL olarak bütçelenmiştir. Bütçelenen sabit maliyetler 60.000 saat için, 50.000 saat için bütçelenen 80.000 TL sabit maliyetten yüzde 25 daha fazladır. Birim çıktı başına bütçelenen değişken maliyet nedir?|A) 1,38 TL~B) 2,30 TL~C) 3,00 TL~D) 3,33 TL~E) 3,83 TL|C) 3,00 TL|⚠️ DİKKAT: Sabit maliyet bir seviyeden sonra sıçrama yaptığı için klasik en yüksek-en düşük formülü doğrudan uygulanamaz. İçinden çekerek hesaplamalıyız. 50.000 saat seviyesinde: Toplam Maliyet (230.000) = Sabit (80.000) + Toplam Değişken (150.000). Birim Değişken Maliyet = Toplam Değişken (150.000) / 50.000 saat = 3 TL/saat.",
    "2023-2024 Bütünleme, Kez Çıktı!|Paris İşletmesi tablet üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 12.000 makine saati, 24.000 işçilik saati çalışmayı ve 186.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 14.000 makine saati çalışılmıştır. Üretime yüklenen genel üretim maliyeti tutarı aşağıdakilerden hangisidir?|A) 108.500 TL~B) 15.500 TL~C) 217.000 TL~D) 186.000 TL~E) 31.000 TL|C) 217.000 TL|Yükleme Haddi = Bütçelenen GÜM (186.000) / Bütçelenen Makine Saati (12.000) = 15,50 TL/saat. Yüklenen GÜM = Fiili Çalışılan Saat (14.000) * Yükleme Haddi (15,50) = 217.000 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|İstanbul İşletmesi Ahşap ve Karton olmak üzere iki farklı sepet üretmekte ve satmaktadır. Aşağıdaki veriler genel üretim maliyetlerinin bir parçası olan 240.000 TL tutarındaki makine hazırlama maliyetine ilişkindir. Üretilen birim: Ahşap 1.500 | Karton 1.500 Makine hazırlama sayısı: Ahşap 75 | Karton 25 Faaliyet tabanlı maliyetleme kullanıldığında bir birim karton sepete dağıtılacak makine hazırlama maliyeti aşağıdakilerden hangisidir?|A) 60 TL~B) 40 TL~C) 50 TL~D) 30 TL~E) 20 TL|B) 40 TL|Toplam Hazırlama: 75 + 25 = 100. Hazırlama Başına Maliyet: 240.000 / 100 = 2.400 TL. Karton Sepetin Toplam Payı: 25 hazırlama * 2.400 = 60.000 TL. Birim Karton Maliyeti: 60.000 TL / 1.500 adet = 40 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|Eylül ayında karıştırma safhasında 46.000 TL tutarında üretim maliyeti gerçekleşmiştir. Dönem içerisinde safha açısından 2.300 birimin üretimi tamamlanmış ve dönem sonu yarı mamul olarak %40 oranında tamamlanmış 500 birim kalmıştır. Karıştırma safhasında Eylül ayı başında yarı mamul bulunmamaktadır. Eşdeğer birim maliyeti aşağıdakilerden hangisidir?|A) 16,43 TL~B) 200,00 TL~C) 18,40 TL~D) 184,00 TL~E) 20,00 TL|C) 18,40 TL|Eşdeğer Birim: Tamamlanan (2.300) + [Dönem Sonu (500) * %40] = 2.500 birim. Eşdeğer Birim Maliyeti: Toplam Maliyet (46.000 TL) / Eşdeğer Birim (2.500) = 18,40 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|İstanbul İşletmesinin Haziran ayı başında toplam maliyeti 324 TL olan 18 adet AGI hammaddesi bulunmaktaydı. Haziran ayında aşağıdaki alış ve satışlar gerçekleşmiştir. 8 Haziran Alış: 42 x 20 TL 14 Haziran Satış: 35 x 40 TL 22 Haziran Alış: 25 x 22,6 TL 27 Haziran Satış: 42 x 40 TL Hareketli ağırlıklı stok değerleme yöntemine göre Haziran ayı satılan malın maliyeti tutarı aşağıdakilerden hangisidir?|A) 1.648 TL~B) 1.153 TL~C) 1.079 TL~D) 1.230 TL~E) 1.561 TL|E) 1.561 TL|Dönem Başı: 18 adet (324 TL). 1. Alış (8 Haz): 42 adet (840 TL). Toplam=60 adet, 1.164 TL -> Ortalama = 19,4 TL/br. 1. Satış (14 Haz): 35 * 19,4 = 679 TL. Kalan: 25 adet (485 TL). 2. Alış (22 Haz): 25 adet (565 TL). Toplam=50 adet, 1.050 TL -> Ortalama = 21 TL/br. 2. Satış (27 Haz): 42 * 21 = 882 TL. Toplam Haziran Ayı Satış Maliyeti = 679 + 882 = 1.561 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|Önceki safha maliyetlerinin hesaplanması aşağıdakilerden hangisi ile benzerlik gösterir?|A) Safhanın başında eklenen direkt işçilik maliyetleri~B) Safhanın başında eklenen dönüştürme maliyetleri~C) Safhanın başında eklenen dönem başı stok maliyetleri~D) Safhanın sonunda eklenen genel üretim maliyeti~E) Safhanın başında eklenen ayrı bir direkt malzeme maliyeti|E) Safhanın başında eklenen ayrı bir direkt malzeme maliyeti|Önceki safhadan devralınan maliyetler, ürün yeni safhaya girer girmez (safhanın en başında) o ürünün bir parçası olduğu için sanki sürece baştan eklenen yepyeni bir direkt malzeme gibi muamele görür.",
    "2023-2024 Bütünleme|Muğla İşletmesi'nde kesme ve dikme olmak üzere iki adet esas üretim bölümü, yemekhane ve tamir bakım olmak üzere iki tane de destek bölümü bulunmaktadır. Yemekhane maliyetleri çalışan sayısına, tamir bakım ise saatlere göre dağıtılmaktadır. Direkt Maliyetler: Yemekhane 180.000 TL | Tamir Bakım 150.000 TL Çalışan Sayısı: Tamir Bakım 30 | Kesme 35 | Dikme 55 Tamir Bakım Saatleri: Kesme 16.000 | Dikme 4.000 Kademeli dağıtım yöntemi kullanıldığında tamir bakım bölümünden kesme bölümüne dağıtılacak maliyet tutarı aşağıdakilerden hangisidir?|A) 120.000 TL~B) 156.000 TL~C) 39.000 TL~D) 195.000 TL~E) 90.500 TL|B) 156.000 TL|1) Önce Yemekhane dağıtılır: 180.000 / 120 Kişi (30+35+55) = 1.500 TL/Kişi. 2) Yemekhaneden Tamir Bakıma Pay: 30 kişi * 1.500 = 45.000 TL. 3) Tamir Bakımın Yeni Toplam Maliyeti: 150.000 + 45.000 = 195.000 TL. 4) Tamir Bakımdan Kesme Bölümüne: 195.000 * (16.000 / 20.000) = 156.000 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|Eylül ayında karıştırma safhasında 46.000 TL tutarında üretim maliyeti gerçekleşmiştir. Dönem içerisinde safha açısından 2.300 birimin üretimi tamamlanmış ve dönem sonu yarı mamul olarak %40 oranında tamamlanmış 500 birim kalmıştır. Karıştırma safhasında Eylül ayı başında yarı mamul bulunmamaktadır. Dönem sonu yarı mamullerin toplam maliyeti aşağıdakilerden hangisidir?|A) 3.680 TL~B) 9.200 TL~C) 5.870 TL~D) 10.500 TL~E) 3.286 TL|A) 3.680 TL|1) Eşdeğer Birim: 2.300 + (500 * %40) = 2.500 birim. 2) Birim Maliyet: 46.000 / 2.500 = 18,40 TL. 3) Dönem Sonu Yarı Mamul Maliyeti: 200 eşdeğer birim * 18,40 TL = 3.680 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|Bir işletmenin üç farklı bölgesine ait veriler aşağıda sunulmuştur. Satışlar: Kuzey (2.000.000), Doğu (1.250.000), Batı (1.750.000) Direkt Maliyetler: Kuzey (800.000), Doğu (600.000), Batı (500.000) Yukarıda yer almayan endirekt maliyetler (Genel şirket 700k, End. faaliyet 400k, Diğer 900k) toplamı 2.000.000 TL'dir. İşletme endirekt maliyetleri bölgenin satışını toplam satışlara oranlayarak dağıtmaktadır. Her bir bölge için faaliyet kârı sırasıyla (Kuzey, Doğu, Batı) aşağıdakilerden hangisidir?|A) 400.000, 150.000, 550.000~B) Yukarıda verilen veriler ile hesaplanamaz~C) 760.000, 375.000, 865.000~D) 560.000, 250.000, 690.000~E) 1.200.000, 650.000, 1.250.000|A) 400.000, 150.000, 550.000|Toplam Satış = 5.000.000 TL. Kuzey Kâr: 2.000.000 - 800.000 (Direkt) - [2.000.000 * (2.000.000/5.000.000)] (Endirekt) = 400.000 TL. Doğu Kâr: 1.250.000 - 600.000 - [2.000.000 * (1.250.000/5.000.000)] = 150.000 TL. Batı Kâr: 1.750.000 - 500.000 - [2.000.000 * (1.750.000/5.000.000)] = 550.000 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|Giresun İşletmesi birleşik bir imalat süreci sonunda mısır şurubu ve mısır nişastası olmak üzere iki farklı ürün ortaya çıkarmaktadır. Ayrım noktasına kadar birleşik maliyet 329.000 TL'dir. Mısır Şurubu: Ayrım sonrası 406.340 TL | Satış: 13.000 kutu (Birim 51 TL) Mısır Nişastası: Ayrım sonrası 97.060 TL | Satış: 5.900 kutu (Birim 26 TL) Maliyetlerin dağıtılmasında Net Satış Değeri yöntemi kullanıldığında mısır şurubu üretimine ilişkin 'toplam maliyet' aşağıdakilerden hangisidir?|A) 269.780 TL~B) 256.660 TL~C) 676.120 TL~D) 156.280 TL~E) 59.220 TL|C) 676.120 TL|Mısır Şurubu NSD = (13.000 * 51) - 406.340 = 256.660 TL. Mısır Nişastası NSD = (5.900 * 26) - 97.060 = 56.340 TL. Toplam NSD = 313.000 TL. Mısır Şurubu Ortak Payı = 329.000 * (256.660 / 313.000) = 269.780 TL. Mısır Şurubu Toplam Maliyeti = 269.780 (Ortak Pay) + 406.340 (Kendi Maliyeti) = 676.120 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|Bir üretim işletmesinin siparişlerine ilişkin olarak aşağıdaki bilgiler sunulmuştur. Sipariş 101: Ocak(8.000 TL), Şubat(5.000 TL) Sipariş 102: Ocak(9.000 TL), Şubat(4.000 TL) Sipariş 103: Şubat(7.000 TL), Mart(6.000 TL) 101 nolu sipariş Şubat ayında tamamlanmış, Mart ayında satılmıştır. 102 nolu sipariş Şubat ayında tamamlanmış fakat henüz satılmamıştır. 103 nolu sipariş Mart sonu itibarıyla henüz tamamlanmamıştır. Şubat ayı sonu itibariyle mamuller hesabının bakiyesi aşağıdakilerden hangisidir?|A) 39.000 TL~B) 30.000 TL~C) 13.000 TL~D) 26.000 TL~E) 33.000 TL|D) 26.000 TL|Şubat sonu durumu: 101 nolu sipariş: Şubat'ta bitti, Mart'ta satıldı. Şubat sonunda Mamuldür (8.000 + 5.000 = 13.000 TL). 102 nolu sipariş: Şubat'ta bitti, satılmadı. Şubat sonunda Mamuldür (9.000 + 4.000 = 13.000 TL). 103 nolu sipariş: Üretimi sürüyor. Yarı Mamuldür (Mamul hesabında yer almaz). Toplam Mamul: 13.000 + 13.000 = 26.000 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|Fabrika binasında kullanılan enerji ile ilgili olarak aşağıdaki ifadelerden hangisi doğrudur?|A) Sabit - Endirekt~B) Değişken - Direkt~C) Yarı Sabit - Direkt~D) Sabit - Direkt~E) Değişken - Endirekt|A) Sabit - Endirekt|Fabrika binasında kullanılan enerji (ısınma vb.) üretime bağlı olarak değil zamana bağlı olarak tahakkuk ediyorsa 'Sabit', doğrudan ürünün bünyesine izlenemediği için de 'Endirekt' olarak sınıflandırılır.",
    "2023-2024 Bütünleme, Kez Çıktı!|Sipariş maliyetleme sistemi uygulayan bir üretim işletmesinde aşağıdaki maliyetlerden hangisinin sipariş maliyet kartlarında yer alması beklenmez?|A) Direkt malzeme maliyeti~B) Genel üretim maliyeti~C) Direkt işçilik maliyeti~D) Pazarlama maliyeti~E) Üretilen birim miktarı|D) Pazarlama maliyeti|Sipariş maliyet kartı sadece üretim maliyetlerini (Direkt Malzeme, Direkt İşçilik, Genel Üretim Giderleri) kapsar. Pazarlama maliyeti bir dönem gideridir ve üretim kartında yer almaz.",
    "2023-2024 Bütünleme, Kez Çıktı!|Maslak İşletmesi RK ve YZ olmak üzere birbirine benzer iki ürün üretmektedir. 1.200 TL tutarındaki genel üretim maliyetlerinin ürünlerle ilişkilendirilmesinde direkt işçilik saatleri dikkate alınmaktadır. RK: Hammadde+DİG 20 TL/br | DİS 2 | Parti büyüklüğü 5 birim YZ: Hammadde+DİG 30 TL/br | DİS 1 | Parti büyüklüğü 50 birim Yukarıda verilen tablodaki bilgiler dikkate alındığında bir birim RK ürününün maliyeti aşağıdakilerden hangisidir?|A) 50 TL/birim~B) 40 TL/birim~C) 20 TL/birim~D) 60 TL/birim~E) 30 TL/birim|D) 60 TL/birim|1) Toplam DİS: (5 adet * 2) + (50 adet * 1) = 60 saat. 2) GÜM Yükleme Haddi = 1.200 TL / 60 = 20 TL/saat. 3) RK Ürünü İçin Birim GÜM = 2 saat * 20 TL = 40 TL. 4) RK Toplam Maliyet = 20 TL (Hammadde+DİG) + 40 TL (GÜM) = 60 TL/birim.",
    "2023-2024 Bütünleme, Kez Çıktı!|Aşağıda verilen bilgiler doğrultusunda dönem içinde kullanılan direkt malzeme maliyeti aşağıdakilerden hangisidir? Direkt Malzeme Stoku: DB 410 TL, DS 320 TL Satın alınan direkt malzeme: 6.600 TL|A) 6.690 TL~B) 7.100 TL~C) 6.510 TL~D) 6.680 TL~E) 6.600 TL|A) 6.690 TL|Kullanılan Malzeme = Dönem Başı Stok + Dönem İçi Alışlar - Dönem Sonu Stok. Kullanılan = 410 + 6.600 - 320 = 6.690 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|Faaliyet tabanlı maliyetleme ile ilgili olarak aşağıda verilen ifadelerden hangisi doğrudur?|A) Genel üretim maliyetlerini çoğunlukla direkt işçilik saatlerini dikkate alarak dağıtır.~B) Genel üretim maliyetlerinin ürünlere dağıtılmasında üretim birimi düzeyindeki faaliyetleri dikkate alır.~C) Genel üretim maliyetlerinin ürünlere dağıtılmasında fabrika düzeyinde tek bir genel üretim maliyeti yükleme haddi kullanır.~D) Uygulanması pahalı değildir.~E) Genel üretim maliyetlerinin ürünlere dağıtılmasında birden çok faaliyet haddi (anahtarı) kullanır.|E) Genel üretim maliyetlerinin ürünlere dağıtılmasında birden çok faaliyet haddi (anahtarı) kullanır.|Faaliyet Tabanlı Maliyetlemenin (FTM) en temel özelliği, geleneksel sistemin aksine genel üretim giderlerini tek bir kalemde değil, her faaliyet havuzu için ayrı bir maliyet etkeni (dağıtım anahtarı) kullanarak dağıtmasıdır.",
    "2023-2024 Bütünleme, Kez Çıktı!|Stil İşletmesinin Nisan ayında dokuma safhasına ilişkin maliyet ve üretim bilgileri aşağıda verilmiştir. Malzeme imalata sürecin başında ilave edilmektedir. İşletme ağırlıklı ortalama yöntemini kullanmaktadır. DB Malzeme 20.000 TL, DB Dönüştürme 15.000 TL Dönem İçi Malzeme 62.500 TL, Dönem İçi Dönüştürme 105.000 TL Tamamlanan: 32.600, Dönem Sonu Yarı Mamul: 6.000 (%60 tamamlanmış) Tamamlanıp bir sonraki safhaya aktarılan ürünlerin toplam maliyeti aşağıdakilerden hangisidir? (Virgülden sonraki iki haneyi dikkate alınız.)|A) 165.873 TL~B) 177.344 TL~C) 189.325 TL~D) 158.968 TL~E) 147.352 TL|B) 177.344 TL|1) Malzeme Eşdeğeri: 32.600 + 6.000 = 38.600. Birim Maliyet: (20.000+62.500)/38.600 = 2,137 (2,13 alınır). 2) Dönüştürme Eşdeğeri: 32.600 + (6.000 * %60) = 36.200. Birim Maliyet: (15.000+105.000)/36.200 = 3,314 (3,31 alınır). 3) Toplam Birim Maliyet = 2,13 + 3,31 = 5,44 TL. 4) Tamamlanan Maliyeti = 32.600 tam ürün * 5,44 = 177.344 TL.",
    "2023-2024 Bütünleme, Yeni Soru Tipi|Zaman İşletmesi tek tip duvar saati üretmektedir. Her bir ürün öncelikle montaj ve arkasından kalite kontrol bölümlerinden geçmektedir. Direkt malzeme üretim sürecinin başında ilave edilmektedir. Dönüştürme maliyetleri zaman açısından eşit olarak gerçekleşmektedir. İşletme ağırlıklı ortalama yöntemini uygulamaktadır. Montaj bölümü: DB Yarı Mamul 370 | Üretimine başlanan 970 | DS Yarı Mamul 250 (DS Yarı Mamuller direkt malzeme açısından %100, dönüştürme açısından %80 tamamlanmıştır) Direkt malzeme ve dönüştürme maliyetleri açısından eşdeğer birim sayıları sırasıyla aşağıdakilerden hangisidir?|A) 1340; 1050~B) 1220; 1120~C) 1220; 1220~D) 1340; 1290~E) 1248; 1120|D) 1340; 1290|1) Miktar Dengesi: Toplam Üretim = 370 + 970 = 1.340 birim. Tamamlanan = 1.340 - 250 = 1.090 birim. 2) Malzeme Eşdeğer Birimi: 1.090 (Tamamlanan) + 250 (%100) = 1.340 birim. 3) Dönüştürme Eşdeğer Birimi: 1.090 (Tamamlanan) + [250 * %80] = 1.290 birim.",
    "2023-2024 Bütünleme, Kez Çıktı!|Altın İşletmesinin bitirme safhasına ilişkin olarak aşağıdaki veriler sunulmuştur. İşletme ağırlıklı ortalama yöntemi uygulamaktadır. Eşdeğer Birim (Önceki Safha): 75.000 DB Önceki Safha Maliyeti: 2.100 TL Dönem İçi Önceki Safha: 30.900 TL Önceki safha maliyeti için eşdeğer birim maliyeti aşağıdakilerden hangisidir?|A) 1,59 TL~B) 0,41 TL~C) 0,44 TL~D) 0,76 TL~E) 0,55 TL|C) 0,44 TL|Toplam Önceki Safha Maliyeti = 2.100 + 30.900 = 33.000 TL. Birim Maliyet = 33.000 / 75.000 eşdeğer birim = 0,44 TL.",
    "2023-2024 Bütünleme, Yeni Soru Tipi|Teksas İşletmesi C ve D olmak üzere iki farklı ürün üretmektedir. Üretim Adedi: D (30.000) Birim Direkt Malzeme: D (80 TL) | Birim Direkt İşçilik: D (10 TL) Gerekli Makine Saati: C (60.000), D (45.000) Parti Sayısı: C (1.000), D (1.000) Genel Üretim Maliyetleri: Makine 840.000 TL, Taşıma/Depolama 510.000 TL Faaliyet tabanlı maliyetleme yöntemine göre D ürününün birim üretim maliyeti aşağıdakilerden hangisidir?|A) 615.000 TL~B) 110.50 TL~C) 125.50 TL~D) 735.000 TL~E) 20.50 TL|B) 110.50 TL|1) Makine Maliyeti Yükleme Haddi: 840.000 / 105.000 saat = 8 TL/saat. D Ürünü Payı: 45.000 saat * 8 = 360.000 TL. 2) Taşıma Maliyeti Yükleme Haddi: 510.000 / 2.000 parti = 255 TL/parti. D Ürünü Payı: 1.000 parti * 255 = 255.000 TL. 3) D'ye Toplam GÜM = 615.000 TL. Birim GÜM = 615.000 / 30.000 adet = 20,5 TL. 4) Toplam Birim Maliyet = 80 (DM) + 10 (Dİ) + 20,5 (GÜM) = 110,50 TL.",
    "2023-2024 Bütünleme, Kez Çıktı!|Paris İşletmesi bilgisayar üretmektedir ve genel üretim maliyetlerini makine saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 12.000 makine saati çalışmayı ve 93.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 16.000 makine saati çalışılmıştır. Fiili Tablo: Endirekt İşçilik 11.000 TL, Fabrika Amortismanı 48.000 TL, Makine Tamiri 11.000 TL, Direkt İşçilik 75.000 TL, Endirekt Malzeme 6.000 TL, Su, elektrik 7.000 TL, Reklam 35.000 TL, Satış komisyonları 27.000 TL. Paris İşletmesi ile ilgili aşağıdaki ifadelerden hangisi doğrudur?|A) 41.000 TL tutarında fazla yükleme yapılmıştır.~B) 41.000 TL tutarında eksik yükleme yapılmıştır.~C) 21.000 TL tutarında fazla yükleme yapılmıştır.~D) 14.000 TL tutarında eksik yükleme yapılmıştır.~E) 14.000 TL tutarında fazla yükleme yapılmıştır.|A) 41.000 TL tutarında fazla yükleme yapılmıştır.|1) Yükleme Haddi: 93.000 / 12.000 = 7,75 TL/saat. 2) Yüklenen GÜM: 16.000 saat * 7,75 = 124.000 TL. 3) Gerçekleşen (Fiili) GÜM: 11k (Eİ) + 48k (Amor) + 11k (Tamir) + 6k (EM) + 7k (Su) = 83.000 TL. (Reklam, Satış ve Direkt İşçilik GÜM'e girmez). 4) Fark = 124.000 - 83.000 = 41.000 TL Fazla yüklenmiştir.",
    "2023-2024 Final Bahar, Kez Çıktı!|Yozgat İşletmesi Vasat ve Kaliteli olmak üzere iki ürün üretmektedir. Üretim Adedi: Kaliteli (15.000) Birim Direkt Malzeme: Kaliteli (125 TL) | Birim Direkt İşçilik: Kaliteli (30 TL) Makine Saati: Kaliteli (60.000) | Vasat (45.000) Parti Sayısı: Kaliteli (1.000) | Vasat (1.000) Makine Maliyeti (Toplam 840.000 TL), Taşıma/Depolama (Toplam 510.000 TL). Faaliyet tabanlı maliyetleme kullanıldığında bir birim Kaliteli ürünün toplam üretim maliyeti aşağıdakilerden hangisidir?|A) 155 TL~B) 224 TL~C) 49 TL~D) 204 TL~E) 174 TL|D) 204 TL|1) Makine Haddi: 840.000 / 105.000 saat = 8 TL/saat. Kaliteli Payı = 60.000 * 8 = 480.000 TL. 2) Taşıma Haddi: 510.000 / 2.000 parti = 255 TL/parti. Kaliteli Payı = 1.000 * 255 = 255.000 TL. 3) Toplam Kaliteli GÜM = 480.000 + 255.000 = 735.000 TL. 4) Birim GÜM = 735.000 / 15.000 adet = 49 TL. 5) Toplam Birim Maliyet = 125 (DM) + 30 (Dİ) + 49 (GÜM) = 204 TL.",

"2022-2023 Vize, 2024 Vize, 2025 Vize, 3 Kez Çıktı!|Maraş İşletmesi Direkt Dağıtım Yöntemi: Yemekhane Maliyeti: 360.000 TL, Tamir-bakım: 300.000 TL. Kalıp Direkt Maliyeti: 244.000 TL. Çalışan Sayısı: Kalıp(35), Montaj(55). Tamir Saati: Kalıp(16.000), Montaj(4.000). Direkt dağıtım yöntemi kullanıldığında kalıp bölümünde biriken toplam maliyet tutarı ne kadardır?|A) 278.000 TL~B) 424.000 TL~C) 624.000 TL~D) 661.000 TL~E) 461.000 TL|C) 624.000 TL|Yemekhaneden Kalıba: 360.000 * [35 / (35+55)] = 140.000 TL. Tamir-Bakımdan Kalıba: 300.000 * [16.000 / (16.000+4.000)] = 240.000 TL. Toplam: Kendi direkt maliyeti (244.000) + Yemekhane (140.000) + Tamir (240.000) = 624.000 TL.",

    "2024 Final, 2024-2025 Bahar Final, ⚠️ Dikkat!|Aşağıdaki tabloda 101, 102 ve 103 nolu siparişlere ilişkin Ocak ve Şubat aylarında gerçekleşen maliyetler sunulmuştur. 101 nolu sipariş Ocak ayı sonunda tamamlanmış, Şubat ayında satılmıştır. 102 nolu sipariş Şubat ayında tamamlanmıştır fakat henüz satılmamıştır. 103 nolu sipariş ise Şubat ayı sonu itibariyle tamamlanmamıştır. Sipariş 101: Ocak (DM: 100, Dİ: 200, GÜM: 300) - Şubat (-). Sipariş 102: Ocak (DM: 50, Dİ: 100, GÜM: 150) - Şubat (DM: 50, Dİ: 100, GÜM: 300). Sipariş 103: Ocak (DM: 200, Dİ: 400, GÜM: 300) - Şubat (DM: 20, Dİ: 40, GÜM: 80). Şubat ayı sonu itibariyle mamuller hesabının bakiyesi aşağıdakilerden hangisidir?|A) 590 TL~B) 2.390 TL~C) 1.000 TL~D) 1.790 TL~E) 1.040 TL|D) 1.790 TL|⚠️ DİKKAT ŞAŞIRTMACA / HATALI SORU! Normal muhasebe kurallarına göre 'Mamuller' hesabında sadece bitmiş ve satılmamış ürünler yer alır (Sipariş 102 = 300+450 = 750 TL). Sipariş 103 ise henüz bitmediği için 'Yarı Mamul'dür (900+140 = 1.040 TL). Ancak soruyu hazırlayan kişi şıklara 750 TL'yi koymamış ve aslında 'Dönem Sonu Toplam Stok' (Mamul + Yarı Mamul) değerini sormak istemiştir. Sınavın kabul ettiği cevap: 750 TL (Mamul) + 1.040 TL (Yarı Mamul) = 1.790 TL'dir.",

    "2024-2025 Büt, ⚠️ Dikkat!|İstanbul İşletmesinin Haziran ayı başında toplam maliyeti 324 TL olan 18 adet AGI hammaddesi bulunmaktaydı. Hareketli ağırlıklı stok değerleme yöntemine göre Haziran ayı satılan malın maliyeti tutarı aşağıdakilerden hangisidir? (Tablo: 8 Haz Alış: 42 x 20, 14 Haz Satış: 35 x 40, 22 Haz Alış: 25 x 22,6, 27 Haz Satış: 42 x 40)|A) 1.648 TL~B) 1.153 TL~C) 1.079 TL~D) 1.230 TL~E) 1.561 TL|E) 1.561 TL|⚠️ DİKKAT: Vize sınavlarında sadece ilk satışın maliyeti (679 TL) sorulurken, burada tüm ayın maliyeti sorulmuş! İlk Alış Sonrası Ortalama: (324+840)/(18+42) = 19,4 TL. 1. Satış Maliyeti = 35 * 19,4 = 679 TL. Kalan: 25 birim (485 TL). İkinci Alış Sonrası Ortalama: (485+565)/(25+25) = 21 TL. 2. Satış Maliyeti = 42 * 21 = 882 TL. Toplam Haziran Satış Maliyeti = 679 + 882 = 1.561 TL.",

    "2024-2025 Büt, ⚠️ Dikkat!|Giresun İşletmesi birleşik bir imalat süreci sonunda mısır şurubu ve mısır nişastası olmak üzere iki farklı ürün ortaya çıkarmaktadır. Maliyetlerin dağıtılmasında Net Satış Değeri yöntemi kullanıldığında mısır şurubu üretimine ilişkin 'toplam maliyet' aşağıdakilerden hangisidir? (Ortak Maliyet 329.000. Mısır Şurubu Satış: 13.000 * 51. Ek İşlem: 406.340. Nişasta Satış: 5.900 * 26. Ek İşlem: 97.060)|A) 269.780 TL~B) 256.660 TL~C) 676.120 TL~D) 156.280 TL~E) 59.220 TL|C) 676.120 TL|⚠️ DİKKAT: Vize sınavında sadece 'ortak payı' (A Şıkkı) soruluyordu. Burada ise 'toplam maliyet' istenmiş. Ortak Maliyet Payı: 269.780 TL. Kendi Ek Maliyeti: 406.340 TL. Toplam Maliyet: 269.780 + 406.340 = 676.120 TL.",

    "2023-2024 Final Bahar, Kez Çıktı!|Yozgat İşletmesi Vasat ve Kaliteli olmak üzere iki ürün üretmektedir. Üretim Adedi: Kaliteli (15.000). Birim Direkt Malzeme: Kaliteli (125 TL), Birim Direkt İşçilik: Kaliteli (30 TL). Makine Saati: Kaliteli (60.000), Vasat (45.000). Parti Sayısı: Kaliteli (1.000), Vasat (1.000). Makine Maliyeti (Toplam 840.000 TL), Taşıma/Depolama (Toplam 510.000 TL). Faaliyet tabanlı maliyetleme kullanıldığında bir birim Kaliteli ürünün toplam üretim maliyeti aşağıdakilerden hangisidir?|A) 155 TL~B) 224 TL~C) 49 TL~D) 204 TL~E) 174 TL|D) 204 TL|1) Makine Haddi: 840.000 / 105.000 saat = 8 TL/saat. Kaliteli Payı = 60.000 * 8 = 480.000 TL. 2) Taşıma Haddi: 510.000 / 2.000 parti = 255 TL/parti. Kaliteli Payı = 1.000 * 255 = 255.000 TL. 3) Toplam Kaliteli GÜM = 480.000 + 255.000 = 735.000 TL. 4) Birim GÜM = 735.000 / 15.000 adet = 49 TL. 5) Toplam Birim Maliyet = 125 (DM) + 30 (Dİ) + 49 (GÜM) = 204 TL.",

    "Eski Yıllar|Fabrikada çalışan ustabaşının maaşı ile ilgili aşağıdaki ifadelerden hangisi doğrudur?|A) Değişken - endirekt maliyet~B) Sabit - endirekt maliyet~C) Yarı değişken - direkt maliyet~D) Değişken - direkt maliyet~E) Sabit - direkt maliyet|B) Sabit - endirekt maliyet|Ustabaşı ve fabrika mühendislerinin maaşları üretilen ürüne doğrudan doğruya (parça başı olarak) yüklenemediği için 'Endirekt', maaşla çalıştıkları ve üretim miktarından bağımsız olduğu için 'Sabit' maliyettir.",
    "Eski Yıllar|Gider hâline dönüşmüş stoklanabilir maliyetin gelir tablosunda görüldüğü kalem aşağıdakilerden hangisidir?|A) Pazarlama gideri~B) Yönetim gideri~C) Satış iade ve indirimleri~D) Satılan mamul maliyeti~E) Satış giderleri|D) Satılan mamul maliyeti|Stoklanabilir (ürün) maliyetleri, ürün satılana kadar bilançoda stoklar hesabında bekler. Ürün satıldığı anda bilançodan çıkarak gelir tablosuna 'Satılan Mamul Maliyeti' (SMM) adıyla gider olarak yansır.",
    "Eski Yıllar|Otomobil farlarında kullanılan ampuller otomotiv üreticisi için hangi stok kalemi içerisinde sınıflandırılır?|A) İşletme malzemesi stoku~B) Ham madde stoku~C) Yardımcı malzeme stoku~D) Yarı mamul stoku~E) Mamul stoku|B) Ham madde stoku|Otomobil farındaki ampul, ürünün temel bir parçası olduğu, bünyesine doğrudan girdiği ve maliyeti kolayca izlenebildiği için 'Direkt İlk Madde ve Malzeme' (Ham Madde) stokudur.",
    "Eski Yıllar|Hizmet sektöründe faaliyet gösteren işletmelerde genellikle aşağıdaki stok kalemlerinden hangisi bulunur?|A) Ticari mal stoku~B) Mamul stoku~C) Yarı mamul stoku~D) Ham madde stoku~E) İşletme malzemesi stoku|E) İşletme malzemesi stoku|Hizmet işletmeleri (örneğin hastaneler, oteller, danışmanlık şirketleri) somut bir fiziksel ürün üretmedikleri için ham madde veya mamul stokları olmaz. Kendi hizmet süreçlerinde kullandıkları kırtasiye, temizlik vb. malzemeleri içeren 'İşletme Malzemesi Stoku' bulundururlar.",
    "Eski Yıllar|Genel İmalat Maliyeti (GİM) yükleme oranı (haddi), bütçelenmiş genel imalat maliyetinin.......................oranıdır. Yukarıdaki boşluğa uygun olan seçenek aşağıdakilerden hangisidir?|A) Fiilî genel imalat maliyetine~B) Fiili üretim miktarına~C) Bütçelenen fiilî kapasiteye~D) Bütçelenmiş faaliyet hacmine (kapasiteye)~E) Fiilî faaliyet hacmine (kapasiteye)|D) Bütçelenmiş faaliyet hacmine (kapasiteye)|Genel üretim gideri (GİM) yükleme haddi, gelecekle ilgili planlama yaparken bütçelenen (tahmini) maliyetin, yine bütçelenen faaliyet hacmine (kapasiteye) bölünmesiyle bulunur. İkisi de 'bütçelenmiş' olmak zorundadır.",
    "Eski Yıllar|Aşağıda bir üretim işletmesine ilişkin maliyet aşamaları verilmiştir. 1. Ham maddenin satın alınması ve ham madde stoku hesabına kaydı 2. Tamamlanan yarı mamullerin mamuller hesabına aktarılması 3. Ham madde üzerinde çalışan işçilerin maliyetinin yarı mamuller hesabına eklenmesi 4. Üretimde kullanılan ham maddenin yarı mamuller hesabına aktarılması 5. Genel üretim maliyetlerinin yarı mamuller hesabına eklenmesi Aşağıdaki seçeneklerden hangisi maliyet akışına ilişkin doğru sıralamayı vermektedir?|A) 1,2,3,4,5~B) 1,5,3,2,4~C) 3,2,5,1,4~D) 1,3,5,2,4~E) 1,4,3,5,2|E) 1,4,3,5,2|Maliyet Akışı: 1) Malzeme alınır. 4) Malzeme üretime (yarı mamule) verilir. 3) İşçi çalışır (işçilik eklenir). 5) Genel üretim giderleri eklenir. 2) Üretimi bitenler mamul ambarına gider.",
    "Eski Yıllar|Bir işletmede dönem sonu yarı mamul stoku ile tamamlanan mamul maliyetinin toplamı aşağıdakilerden hangisine eşittir?|A) Dönem başı yarı mamul stoku ile dönemin imalat maliyetinin toplamına~B) Tamamlanan mamul maliyetine~C) Dönem sonu yarı mamul stokuna~D) Dönem sonu yarı mamul stoku ile satılan mamul maliyetinin toplamına~E) Satılan mamul maliyetine|A) Dönem başı yarı mamul stoku ile dönemin imalat maliyetinin toplamına|Üretim hesabının mantığı şudur: (Dönem Başı Stok + Dönem İçi İmalat Maliyetleri) = (Tamamlanan Mamul Maliyeti + Dönem Sonu Kalan Yarı Mamul). Sol taraf 'girenleri', sağ taraf 'çıkan ve kalanları' temsil eder.",
    "Eski Yıllar|Bir imalat işletmesinin üç temel stok kalemi aşağıdaki şıklardan hangisinde doğru sayılmıştır?|A) Malzeme stoku, kusurlu mallar stoku, hurda stoku~B) Alımlar, ücretler ve mamul stoku~C) Malzeme stoku, alışlar ve mamul stoku~D) Malzeme, işçilik ve genel imalat maliyeti~E) İlk madde ve malzeme (ham madde) stoku, yarı mamul stoku ve mamul stoku|E) İlk madde ve malzeme (ham madde) stoku, yarı mamul stoku ve mamul stoku|Üretim (imalat) işletmelerinde stoklar üretim sürecindeki aşamalarına göre üçe ayrılır: Hiç işlenmemişler (İlk Madde ve Malzeme), süreci devam edenler (Yarı Mamul) ve satılmaya hazır bitmiş ürünler (Mamul).",
    "Eski Yıllar|Aşağıdakilerden hangisi 'maliyet' kavramının tanımıdır?|A) Faydası tükenmiş harcamalardır.~B) Fayda yaratmayan ve şu ana kadar da tüketilmiş varlıklardır.~C) Fayda yaratma potansiyeli olup şu anda bu potansiyeli tükenmiş varlıklardır.~D) Satılan mal ve hizmetin satış gelirleriyle karşılaştırılan üretim değeridir.~E) Mal ve hizmetleri üretmek/edinmek için katlanılan parasal fedakârlıklardır.|E) Mal ve hizmetleri üretmek/edinmek için katlanılan parasal fedakârlıklardır.|Maliyet, işletmenin belirli bir amaca ulaşmak (bir ürün veya hizmeti elde etmek) için katlandığı fedakârlıkların (harcamaların) parasal tutarıdır. Faydası tükenmiş maliyetlere ise 'gider' denir.",
    "Eski Yıllar|İşletmede çalışan üretim mühendisinin maaşı (aylığı) ile ilgili aşağıdaki seçeneklerden hangisi doğrudur?|A) Sabit yönetim gideri~B) Yarı değişken - yönetim~C) Değişken - yönetim gideri~D) Sabit - imalat maliyeti~E) Değişken - imalat maliyeti|D) Sabit - imalat maliyeti|Üretim mühendisi doğrudan fabrikada çalıştığı için maliyeti bir 'İmalat Maliyeti' (Genel Üretim Gideri)'dir. Aylık maaş aldığı ve üretim miktarından etkilenmediği için 'Sabit' maliyettir.",
    "Eski Yıllar|Maliyet yerlerini, maliyetlerin mamullere yüklenme olanağı açısından sınıflandırdığımızda aşağıdakilerden hangisi bir maliyet yeri olamaz?|A) Esas Üretim Maliyet Merkezi~B) Yardımcı Hizmet Maliyet Merkezi~C) Yönetim Yerleri Maliyet Merkezi~D) Üretim Yerleri Yönetimi Maliyet Merkezi~E) Yardımcı Üretim Maliyet Merkezi|C) Yönetim Yerleri Maliyet Merkezi|Maliyet yerleri sadece üretim ve hizmet faaliyetlerinin gerçekleştiği fabrikaya ait alanlardır. 'Yönetim yerleri' (Genel merkez, ofis) birer faaliyet gideri merkezidir, ürünün maliyetine giren bir maliyet yeri değildir.",
    "Eski Yıllar|Aşağıdaki ifadelerden hangisi yanlıştır?|A) Makinelerin temizlenmesi ve yağlanması nedeniyle boş geçen zamanlar endirekt işçilik maliyeti olarak kabul edilir.~B) Bir işletmede fazla mesai yapılması normal hâle gelmişse, ek çalışma farkının genel üretim maliyetlerine katılması ve üretime götürü bir şekilde dağıtılması gerekmektedir.~C) Fazla mesai ücret farkları genellikle direkt işçilik olarak sınıflandırılır.~D) Fazla mesai farkları kural olarak eğer iş özel ve acilse direkt işçilik olarak kabul edilir.~E) Bir imalat işletmesinde harcanan ücretin değerinin belirlenmesinde zaman temelli, akord temelli veya primli ücret sistemleri kullanılabilir.|C) Fazla mesai ücret farkları genellikle direkt işçilik olarak sınıflandırılır.|Yanlış olan budur. Fazla mesai ücret farkları genellikle tek bir ürüne mal edilemediği için 'Genel Üretim Gideri' (Endirekt İşçilik) olarak sınıflandırılır. Sadece özel ve acil bir sipariş için yapıldıysa direkt işçilik olur.",
    "Eski Yıllar|Fiili maliyetler ile ilgili aşağıdaki ifadelerden hangisi doğrudur?|A) Gelecekteki maliyetlerdir.~B) Tahmin edilen maliyetlerdir.~C) Bütçelenen maliyetlerdir.~D) Beklenen maliyetlerdir.~E) Gerçekleşen maliyetlerdir.|E) Gerçekleşen maliyetlerdir.|Muhasebede 'fiili' (actual) terimi, tahmini veya bütçelenmişin aksine eyleme dökülmüş, faturası kesilmiş, kesinleşmiş ve 'gerçekleşmiş' olan anlamına gelir.",
    "Eski Yıllar|Aşağıdakilerden hangisi dönem gideri (faaliyet gideri) değildir?|A) Yönetim danışmanlarına ödenen ücretler~B) Televizyona verilen reklam ücreti~C) Pazarlama bölümünde çalışanların maaşları~D) Pazarlama müdürünün maaşı~E) Fabrika binasının yangın sigortası|E) Fabrika binasının yangın sigortası|Pazarlama, Satış ve Genel Yönetim giderleri birer 'Dönem (Faaliyet) Gideridir' ve gelir tablosunda doğrudan düşülür. Ancak 'Fabrika' kelimesinin geçtiği her türlü gider (sigorta, kira, amortisman) bir üretim maliyetidir (Genel Üretim Maliyeti).",
    "Eski Yıllar|Aşağıdaki ifadelerden hangisi doğrudur?|A) Birim değişken maliyetler, faaliyet hacmi artarken azalırlar.~B) Toplam değişken maliyetler, faaliyet hacmi artarken azalırlar.~C) Birim sabit maliyetler, faaliyet hacmi artarken azalırlar.~D) Birim değişken maliyetler, faaliyet hacmi artarken artarlar.~E) Toplam sabit maliyetler, faaliyet hacmi artarken azalırlar.|C) Birim sabit maliyetler, faaliyet hacmi artarken azalırlar.|Sabit Maliyetler: Toplamda sabittirler. Ancak üretim hacmi arttıkça, bu sabit toplam daha çok sayıdaki ürüne bölüneceği için 'ürün başına düşen (birim) sabit maliyet' azalır.",
    "Eski Yıllar|Aşağıdaki seçeneklerden hangisi 'yarı değişken maliyet'e örnektir?|A) Ustabaşı maaşları~B) Makine ve teçhizata ilişkin amortisman~C) Makinelerin kullandığı enerji~D) Ham madde maliyeti~E) Satış elemanlarına maaşlarının yanı sıra satış primi de ödeniyor olması|E) Satış elemanlarına maaşlarının yanı sıra satış primi de ödeniyor olması|İçinde hem sabit bir tutar (sabit maaş tabanı) hem de hacme bağlı değişken bir tutar (parça veya satış başına prim) barındıran maliyetlere Karma (Yarı Değişken) maliyetler denir.",
    "Eski Yıllar|Aşağıdakilerden hangisi maliyet muhasebesinin temel amaçlarından biri değildir?|A) Birim maliyetin hesaplanması~B) Kontrol faaliyetine yardımcı olmak~C) Planlamaya yardımcı olmak~D) Finansal tabloların anlaşılırlığını artırmak~E) İşletme kararlarına yardımcı olmak|D) Finansal tabloların anlaşılırlığını artırmak|Maliyet muhasebesi yönetime ve şirket içine bilgi sağlar (maliyet kontrolü, planlama, fiyatlama kararları). 'Finansal tabloların anlaşılırlığını artırmak' ve dışarıya rapor sunmak Finansal (Genel) Muhasebenin görevidir.",
    "Eski Yıllar|Her 10.000 birimlik kapasite artışında yeni bir makine alınması zorunlu olduğunda, makine amortismanı kapasite kullanımı (faaliyet hacmi) ile ilişkisi bakımından nasıl bir maliyettir?|A) Sabit maliyet~B) Değişken maliyet~C) Yarı sabit maliyet~D) Yarı değişken maliyet~E) Dönem gideri|C) Yarı sabit maliyet|Belli bir kapasite (hacim) dilimine kadar sabit kalan, ancak o kapasite aşıldığında birdenbire yeni bir sabit tutara sıçrayan ve orada yine o dilim boyunca sabit kalan maliyetlere Yarı Sabit (Sıçrayan/Basamaklı) Maliyet denir.",
    "Eski Yıllar|Maliyetlenecek birime doğrudan doğruya yüklenemeyen maliyetlere ............................. maliyet adı verilir. Yukarıdaki boşluğa uygun olan seçenek aşağıdakilerden hangisidir?|A) Hizmet~B) Gider~C) Endirekt~D) Mamul~E) Direkt|C) Endirekt|Bir ürünün, hizmetin veya departmanın bünyesine doğrudan doğruya, kolayca ve ekonomik olarak izlenemeyen (bölüştürülmesi / dağıtılması gereken) maliyetlere 'Endirekt Maliyet' denir.",
    "Eski Yıllar|Bir işletmede tamamlanan mamul maliyeti nasıl hesaplanır?|A) Dönem başı yarı mamul stoku + Dönem sonu yarı mamul stoku~B) Dönem başı yarı mamul stoku + Dönem sonu yarı mamul stoku - Dönemin imalat maliyeti~C) Dönem başı yarı mamul stoku + Dönemin imalat maliyeti - Dönem sonu yarı mamul stoku~D) Dönem başı yarı mamul stoku + Dönemin imalat maliyeti~E) Dönem sonu yarı mamul stoku + Dönemin imalat maliyeti|C) Dönem başı yarı mamul stoku + Dönemin imalat maliyeti - Dönem sonu yarı mamul stoku|Üretim bandında hesabı yapılacak toplam maliyet: (Dönem Başı Yarı Mamuller) + (Dönem İçi Yeni Üretim Maliyetleri)'dir. Bu toplam maliyetten henüz tamamlanamayanları (Dönem Sonu Yarı Mamulleri) çıkartırsak, elimizde 'Tamamlanan Mamul Maliyeti' kalır.",
    "Eski Yıllar|Fabrikada çalışan işçileri taşıyan minibüsün amortismanı ile ilgili olarak aşağıdaki seçeneklerden hangisi doğrudur?|A) Değişken-imalat maliyeti~B) Değişken-yönetim gideri~C) Sabit-yönetim gideri~D) Sabit-imalat maliyeti~E) Yarı değişken - imalat maliyeti|D) Sabit-imalat maliyeti|Minibüs fabrika personeline hizmet ettiği için maliyeti üretime (imalata) atılır. Amortisman ise zaman bazlı olduğu ve üretim hacminden etkilenmediği için 'Sabit'tir.",
    "Eski Yıllar|Hangisi birleşik sistemde kullanılan yöntem değildir?|A) Fiziki miktarları esas alan yöntem~B) Nihai satış değerlerini esas alan yöntem~C) Ayrım noktasındaki satış değerini esas alan yöntem~D) Sabit brüt kar yöntemi~E) Kar payını esas alan yöntem|E) Kar payını esas alan yöntem|Birleşik maliyet dağıtımında kullanılan temel yöntemler; Fiziksel Miktar, Satış Değeri (ayrım noktasında), Net Satış Değeri ve Sabit Brüt Kâr yöntemleridir. 'Kar payını esas alan' diye literatürde tanımlı bir yöntem yoktur.",
    "Eski Yıllar|Hangisi dönem gideridir?|A) Genel müdür maaşı~B) Endirekt malzeme~C) Direkt işçilik~D) Fabrika sigortası~E) Fabrika bakım - onarım|A) Genel müdür maaşı|Genel müdür, pazarlama veya satış personeli maaşları, fabrika (üretim) süreciyle değil genel şirket yönetimiyle ilgili olduğu için ürün maliyetine girmez, 'Dönem (Faaliyet) Gideri' olarak muhasebeleştirilir. Diğer tüm şıklar ürün maliyetine (fabrika maliyeti) aittir.",
    "Eski Yıllar|Hangisi maliyet bedeli ile değerlemede kullanılan stok değerleme yöntemlerden biri değildir?|A) Safha maliyet yöntemi~B) Standart maliyet yöntemi~C) Gerçek maliyet yöntemi~D) LIFO~E) FIFO|A) Safha maliyet yöntemi|LIFO, FIFO, Standart, Gerçek Parti (Gerçek Maliyet) ve Ortalama Maliyet birer 'stok değerleme' yöntemidir. Safha ve Sipariş Maliyet ise stok değerleme değil, ürünlerin üretim hattındaki ilerleyişini kaydeden birer 'Maliyet Hesaplama (Toplama) Sistemidir'.",
    "Eski Yıllar|Hangisinde stoklanabilir maliyet bulunmaz?|A) Otomobil üreticisi~B) Bilgisayar üreticisi~C) Çanta üreticisi~D) Yat üreticisi~E) Hastane|E) Hastane|Stoklanabilir maliyetler, fiziksel olarak depoya konabilen mallar (mamuller) üretildiğinde söz konusudur. Hastane ise bir üretim işletmesi değil, 'hizmet' işletmesidir. Hizmetler anında tüketilir ve stoklanamaz.",
    "Eski Yıllar|Aylık asgari 1.000 TL ücret garantisi verilmiş bir şirkette parça başına ödenen ücret 20 TL'dir. İmalat işçisi Ahmet Bey'in geçen ayki üretimi 43 birimde kalmış, parça başına 860 TL hak ettiği halde, asgari ücreti garantilediği için kendisine 1.000 TL ödeme yapılmıştır. Hangisi doğrudur?|A) Ödenen 1.000 TL direkt işçilik maliyetidir~B) Ödenen 1.000 TL'nin 860 TL'si direkt, 140 TL'si endirekt işçilik maliyetidir~C) Ödenen 1.000 TL'nin 860 TL'si direkt işçilik, 140 TL zarar olarak kaydedilmelidir~D) Ödenen 1.000 TL'nin tamamı endirekt işçilik maliyetidir~E) Ödenen 1.000 TL'nin tamamı dönem gideridir|B) Ödenen 1.000 TL'nin 860 TL'si direkt, 140 TL'si endirekt işçilik maliyetidir|İşçinin fiilen ürettiği ürünlerin parça başı karşılığı olan 860 TL doğrudan o ürünlere yüklenebildiği için 'Direkt İşçilik'tir. İşletmenin garanti verdiği asgari ücret sebebiyle cebinden fazladan çıkan ve hiçbir ürüne özel olarak yüklenemeyen 140 TL'lik fark ise 'Endirekt İşçilik' (Genel Üretim Gideri) olarak kaydedilir.",
    "Eski Yıllar|Belirli bir dönemde, üretim miktarından bağımsız olarak hep aynı tutarda gerçekleşen maliyetlere '....................' denir.|A) Yarı Değişken~B) Yarı Sabit~C) Değişken~D) Endirekt~E) Sabit maliyet|E) Sabit maliyet|Toplam tutarı üretim hacmindeki değişikliklerden etkilenmeyen, dönemsel ve zamana bağlı (kira, amortisman, vb.) maliyetlere sabit maliyet denir.",
    "Eski Yıllar|Bir işletmenin dönem sonu yarı mamul stoku ile tamamlanan mamul maliyetinin toplamı hangisine eşittir?|A) Dönem başı yarı mamul stoku ile dönemin imalat maliyetinin toplamına~B) Dönem başı mamul stoku ile satılan mamul maliyetine~C) Direkt ilk madde ve malzeme ile genel imalata~D) Net satışlar ile satılan malın maliyetine~E) Hiçbirine|A) Dönem başı yarı mamul stoku ile dönemin imalat maliyetinin toplamına|Üretim hesabında: (Girenler = Çıkanlar ve Kalanlar). Girenler: Dönem başı yarı mamul + Dönem içi maliyetler. Çıkanlar ve Kalanlar: Tamamlanan (çıkan) mamul + Dönem sonu (kalan) yarı mamul.",
    "Eski Yıllar|Bir otomobil fabrikasındaki genel üretim maliyetleri hangisini içerir?|A) Boyama bölümündeki işçilik maliyetleri~B) Makinelerde kullanılan yağlar~C) Satış komisyonları~D) Direksiyon bölümündeki maliyetler~E) Otomobilin gövdesinde kullanılan çelik maliyetleri|B) Makinelerde kullanılan yağlar|Makinelerde kullanılan yağlar üretimin işlemesi için gereklidir ancak doğrudan tek bir otomobile yüklenemez (Endirekt Malzeme). Boyama ve direksiyon bölümü işçilikleri direkt işçiliktir. Çelik direkt malzemedir. Satış komisyonu dönem gideridir.",
    "Eski Yıllar|Bir üretim tesisinde direkt ham madde imalata verildiğinde hesaplardan hangisi çalıştırılır?|A) Mamuller~B) Yarı Mamuller~C) Satılan Mamul Maliyeti~D) Genel Üretim Maliyetleri~E) Kasa|B) Yarı Mamuller|Hammadde depodan (İlk Madde ve Malzemeler hesabı) çıkartılıp üretime gönderildiğinde, üretim bandını temsil eden 'Yarı Mamuller' (710 Direkt İlk Madde ve Malzeme Giderleri vasıtasıyla) hesabına borç kaydedilir.",
    "Eski Yıllar|Bütçelenmiş maliyetler: '....................'|A) Geçmişte gerçekleşmiş maliyetlerdir~B) Sadece faaliyet giderleridir~C) Planlanan veya tahmin edilen maliyetlerdir~D) Finansal tabloda kesinleşen rakamlardır~E) Tamamı sabit maliyetlerdir|C) Planlanan veya tahmin edilen maliyetlerdir|Bütçe kelimesi, muhasebede geleceğe yönelik planları, öngörüleri ve tahminleri ifade eder. Geçmişi gösteren rakamlara ise 'fiili maliyetler' denir.",
    "Eski Yıllar|Direkt işçilik ve genel üretim giderleri toplamına '....................' denir.|A) Dönüştürme maliyeti~B) Esas maliyetler~C) Satılan malın maliyeti~D) Dönem gideri~E) Yarı mamul|A) Dönüştürme maliyeti|Hammaddeyi işleyip şekillendirerek mamul haline 'dönüştürmek' için katlanılan maliyetler (Direkt İşçilik + Genel Üretim Giderleri) dönüştürme maliyetini oluşturur.",
    "Eski Yıllar|Direkt malzeme + Direkt işçilik maliyeti = ?|A) Esas maliyetler~B) Dönüştürme maliyeti~C) Genel üretim giderleri~D) Brüt kar~E) Üretim maliyeti|A) Esas maliyetler|Doğrudan ürünün bünyesine giren, gözle görülen ve ürüne kolayca yüklenebilen temel iki maliyet kalemine (DM + Dİ) 'İlk (Esas) Maliyetler' denir.",
    "Eski Yıllar|İşletmeler tarafından maliyeti hesaplanan herhangi bir şeye '....................' denir.|A) Gider~B) Faaliyet~C) Mamul (Maliyet objesi)~D) Endirekt gider~E) Vergi|C) Mamul (Maliyet objesi)|Maliyeti hesaplanmak istenen, ölçülmeye çalışılan herhangi bir öğeye (bir ürün, bir departman, bir müşteri, bir proje) 'maliyet objesi' (sorudaki şıkkıyla mamul/ürün) denir.",
    "Eski Yıllar|Üretilen mamul ile doğrudan ilgisi olan, ne miktar ne tutarda kullanıldığı, doğru ve ekonomik olarak tespit edilebilen malzeme maliyetine '....................' denir?|A) Direkt malzeme maliyeti~B) Endirekt malzeme~C) Genel üretim maliyeti~D) İşletme malzemesi~E) Dönem gideri|A) Direkt malzeme maliyeti|Tanımı verilen ifade tam olarak 'Direkt İlk Madde ve Malzeme' (Ham Madde) kavramının karşılığıdır. Masanın odu, gömleğin kumaşı direkt malzemedir.",


 "2025-2026 Büt, 1 Kez Çıktı!|Üretim hacmi arttıkça birim başına düşen maliyeti azalan, ancak toplam maliyeti belirli bir kapasiteye kadar aynı kalan maliyet türü aşağıdakilerden hangisidir?|A) Karma (Yarı Değişken) Maliyet~B) Basamaklı Maliyet~C) Sabit Maliyet~D) Batık Maliyet~E) Değişken Maliyet|B) Sabit Maliyet|Sabit maliyetler; üretim miktarı (hacmi) değişse dahi toplam tutarı belirli bir kapasite sınırına kadar değişmeyen, ancak üretilen miktar arttıkça bu miktara bölündüğü için birim başına düşen maliyeti azalan maliyet türleridir.",

    "2025-2026 Büt, 1 Kez Çıktı!|Bir üretim işletmesi safha maliyetleme yöntemini ve 'Ağırlıklı Ortalama' maliyet akış varsayımını kullanmaktadır. Dönem Başı Yarı Mamul: 2.000 birim (Malzeme %100, Şekillendirme %40). Başlanan: 8.000 birim. Tamamlanan: 7.000 birim. Dönem Sonu Yarı Mamul: 3.000 birim (Malzeme %100, Şekillendirme %60). Dönem Başı Maliyetler: Malzeme 10.000 TL, Şekillendirme 4.000 TL. Dönem İçi Eklenen: Malzeme 40.000 TL, Şekillendirme 31.200 TL. Buna göre, dönemi tamamlayıp bir sonraki safhaya devredilen mamullerin toplam maliyeti kaç TL'dir?|A) 49.000 TL~B) 85.200 TL~C) 72.000 TL~D) 54.000 TL~E) 63.000 TL|E) 63.000 TL|Malzeme Eşdeğeri: 7.000 + 3.000 = 10.000 br. Malzeme Birim Maliyeti: (10.000+40.000) / 10.000 = 5 TL. Şekillendirme Eşdeğeri: 7.000 + (3.000 * %60) = 8.800 br. Şekillendirme Birim Maliyeti: (4.000+31.200) / 8.800 = 4 TL. Toplam Birim: 5+4 = 9 TL. Devredilen Maliyet = 7.000 br * 9 TL = 63.000 TL.",

    "2025-2026 Büt, 1 Kez Çıktı!|Bir üretim işletmesinde Yemekhane ve Bakım olmak üzere iki hizmet departmanı; Kesim ve Montaj olmak üzere iki esas üretim departmanı bulunmaktadır. Yemekhane giderleri toplamı 120.000 TL'dir ve personel sayısına göre dağıtılmaktadır. Personel: Bakım (20), Kesim (50), Montaj (30). İşletme 'Direkt Dağıtım Yöntemi'ni kullanmaktadır. Yemekhane departmanından Kesim departmanına dağıtılacak maliyet payı kaç TL'dir?|A) 45.000 TL~B) 75.000 TL~C) 36.000 TL~D) 60.000 TL~E) 50.000 TL|B) 75.000 TL|Direkt dağıtım yönteminde diğer destek departmanı (Bakım) hesaba katılmaz. Sadece esas üretim personeli toplanır: 50 (Kesim) + 30 (Montaj) = 80 kişi. Kesim'in Payı: 120.000 * (50 / 80) = 75.000 TL.",

    "2025-2026 Büt, 1 Kez Çıktı!|Bir işletmede sipariş maliyetleme sistemi uygulanmaktadır. X siparişi için aşağıdaki maliyetlere katlanılmıştır: Direkt malzeme 12.000 TL, Direkt işçilik 8.000 TL. Genel üretim giderleri, direkt işçilik maliyetinin %75'i oranında yüklenmektedir. Buna göre X siparişinin toplam maliyeti aşağıdakilerden hangisidir?|A) 24.000 TL~B) 32.000 TL~C) 26.000 TL~D) 30.000 TL~E) 20.000 TL|C) 26.000 TL|GÜM Yüklemesi: 8.000 TL (DİG) * %75 = 6.000 TL. Toplam Sipariş Maliyeti = 12.000 (DM) + 8.000 (Dİ) + 6.000 (GÜM) = 26.000 TL.",

    "2025-2026 Büt, 1 Kez Çıktı!|Aşağıdaki ifadelerden hangisi dönüştürme maliyetlerinin tanımıdır?|A) Endirekt malzeme ve endirekt işçilik maliyetlerinin toplamıdır~B) Direkt işçilik ve genel üretim maliyetlerinin toplamıdır~C) Direkt malzeme ve direkt işçilik maliyetlerinin toplamıdır~D) Direkt malzeme ve genel üretim maliyetlerinin toplamıdır~E) Endirekt işçilik ve genel üretim maliyetlerinin toplamıdır|B) Direkt işçilik ve genel üretim maliyetlerinin toplamıdır|Dönüştürme (şekillendirme) maliyeti, hammaddenin fiziki yapısını değiştirip mamule dönüştürmek için harcanan Direkt İşçilik ile Genel Üretim Giderleri toplamıdır.",

    "2025-2026 Büt, 1 Kez Çıktı!|Bir kimyasal tesisi X ve Y olmak üzere iki ana ürün ve Z isimli bir yan ürün elde etmektedir. Toplam birleşik üretim maliyeti 155.000 TL'dir. X Ürünü: 10.000 birim. Y Ürünü: 5.000 birim. Z Yan Ürünü: 1.000 birim (Satış Fiyatı 5 TL). Şirket yan ürünün satış hasılatını toplam maliyetten düşmekte ve kalanı ana ürünlere üretim miktarlarına göre dağıtmaktadır. X ana ürününe düşen birleşik maliyet payı kaç TL'dir?|A) 120.000~B) 110.000~C) 100.000~D) 80.000~E) 90.000|C) 100.000|Yan Ürün Hasılatı: 1.000 * 5 = 5.000 TL. Dağıtılacak Net Ortak Maliyet = 155.000 - 5.000 = 150.000 TL. X ve Y'nin Toplam Miktarı = 15.000 birim. X'in Dağıtım Oranı = 10.000 / 15.000. X'in Payı = 150.000 * (10/15) = 100.000 TL.",

    "2025-2026 Büt, 1 Kez Çıktı!|Bir işletmede iki faaliyet havuzu bulunmaktadır: Makine Kurulum Faaliyeti (30.000 TL / 60 kurulum). Kalite Kontrol Faaliyeti (20.000 TL / 100 kontrol). A ürünü için bilgiler: Kurulum sayısı 6, Kalite kontrol sayısı 10. Buna göre A ürününe yüklenecek toplam faaliyet maliyeti aşağıdakilerden hangisidir?|A) 5.000 TL~B) 6.000 TL~C) 7.000 TL~D) 8.000 TL~E) 4.000 TL|A) 5.000 TL|Kurulum Başına Haddi = 30.000 / 60 = 500 TL. Kontrol Başına Haddi = 20.000 / 100 = 200 TL. A Ürünü Kurulum Maliyeti: 6 * 500 = 3.000 TL. A Ürünü Kontrol Maliyeti: 10 * 200 = 2.000 TL. Toplam Yüklenen = 3.000 + 2.000 = 5.000 TL.",
"2023 Final, 2024-2025 Büt, 2025-2026 Büt, 4 Kez Çıktı!|Bir işletmenin üç farklı bölgesine ait veriler aşağıda tutulmuştur. Satışlar: Kuzey(2.000.000), Doğu(1.250.000), Batı(1.750.000). Direkt Maliyetler: Kuzey(800.000), Doğu(600.000), Batı(500.000). Yukarıda yer almayan endirekt maliyetler toplamı: Genel(700.000) + Faaliyet(400.000) + Diğer(900.000) = 2.000.000 TL. İşletme endirekt maliyetleri, bölgesinin satışını toplam satışlara oranlayarak dağıtmaktadır. Her bir bölge için kârı sırasıyla (Kuzey, Doğu, Batı) aşağıdakilerden hangisidir?|A) 1.200.000, 650.000, 1.250.000~B) Yukarıda verilen veriler ile hesaplanamaz~C) 560.000, 250.000, 690.000~D) 400.000, 150.000, 550.000~E) 760.000, 375.000, 865.000|D) 400.000, 150.000, 550.000|Toplam Satışlar = 5.000.000 TL. Endirekt Maliyetler = 2.000.000 TL. Kuzey Kâr: 2M - 800k - (2M * 2M/5M) = 400.000 TL. Doğu Kâr: 1.25M - 600k - (2M * 1.25M/5M) = 150.000 TL. Batı Kâr: 1.75M - 500k - (2M * 1.75M/5M) = 550.000 TL.",
    
    "2025-2026 Final, 2025-2026 Büt, 2 Kez Çıktı!|Maliyetlerin bir safhadan diğer safhaya aktarılmasında hangi kayıt yapılır?|A) Önceki safhaya ilişkin yarı mamuller borçlandırılır, bir sonraki safhaya ilişkin yarı mamuller alacaklandırılır.~B) Bir sonraki safhaya ilişkin yarı mamuller borçlandırılır, hammadde alacaklandırılır.~C) Mamuller hesabı alacaklandırılır, yarı mamuller hesabı borçlandırılır.~D) Bir sonraki safhaya ilişkin yarı mamuller borçlandırılır, önceki safhaya ilişkin yarı mamuller alacaklandırılır.~E) Mamuller borçlandırılır, yarı mamuller alacaklandırılır.|D) Bir sonraki safhaya ilişkin yarı mamuller borçlandırılır, önceki safhaya ilişkin yarı mamuller alacaklandırılır.|Safha maliyetlemede, maliyetler üretim akışına göre devredilir. Devralan (bir sonraki) safhanın yarı mamul hesabı borçlandırılırken, devreden (önceki) safhanın yarı mamul hesabı alacaklandırılarak kapatılır.",
    
    "2024-2025 Büt, 2025-2026 Büt, 3 Kez Çıktı!|Genel üretim maliyetlerini imalata yüklemek için önceden belirlenmiş bir oran kullanan bir şirket, aşağıdaki durumların hangisinde her zaman 'fazla genel üretim maliyeti' yükleyecektir?|A) Üretimin bütçelenen kapasiteden fazla olması~B) Fiili kapasitenin bütçelenen kapasiteden fazla olması~C) Gerçekleşen genel üretim maliyetlerinin stoklara yüklenen genel üretim maliyetlerinden az olması~D) Gerçekleşen genel üretim maliyetinin stoklara yüklenen genel üretim maliyetlerinden fazla olması~E) Kapasitenin fiili üretimden fazla olması|C) Gerçekleşen genel üretim maliyetlerinin stoklara yüklenen genel üretim maliyetlerinden az olması|Eğer üretim partilerine 'Yüklediğiniz' tutar, ay sonunda fiilen 'Gerçekleşen (katlanılan)' tutardan daha büyükse, ürünlere olması gerekenden fazlasını yüklemişsiniz demektir. Bu duruma 'Fazla Yükleme' denir.",

    "2024-2025 Bahar Final, 2025-2026 Final, 2025-2026 Büt, 4 Kez Çıktı!|Aşağıdakilerden hangisi safha maliyetleme sisteminin uygulanmasının en uygun olduğu üretim tipidir?|A) Perakende satış işletmeleri~B) Sürekli ve homojen üretim yapan işletmeler~C) Özel siparişe dayalı üretim~D) Hizmet işletmeleri~E) Proje bazlı üretim|B) Sürekli ve homojen üretim yapan işletmeler|Safha maliyetleme sistemi, ürünlerin birbirinin aynısı (homojen) olduğu ve kesintisiz (sürekli) kitleler halinde üretildiği fabrikalar (örneğin un, petrol, şeker fabrikaları) için en uygunudur.",

    "2024-2025 Büt, 2025-2026 Büt, 3 Kez Çıktı!|Dönem başı yarı mamüller 2.000 birim, dönem sonu yarı mamüller 1.000 birim ve hesabı yapılacak toplam birim sayısı 5.000 birimdir. Üretimi tamamlanan ve transfer edilen birim sayısı aşağıdakilerden hangisidir?|A) 4.000~B) 7.000~C) 1.000~D) 2.000~E) 6.000|A) 4.000|Miktar Dengesi: Hesabı Yapılacak Toplam Üretim = Tamamlananlar + Dönem Sonu Yarı Mamul. 5.000 = Tamamlananlar + 1.000. Tamamlananlar = 4.000 birim.",

    "2025 Yeni, 2025-2026 Büt, 2 Kez Çıktı!|Üretim işletmelerinde 'Satılan Mamul Maliyeti' hesaplanırken aşağıdaki kalemlerden hangisi dikkate alınmaz?|A) Dönem Başı Yarı Mamul Stoku~B) Direkt İlk Madde ve Malzeme Giderleri~C) Direkt İşçilik Giderleri~D) Genel Üretim Giderleri~E) Genel Yönetim Giderleri|E) Genel Yönetim Giderleri|Genel Yönetim Giderleri bir 'Dönem Gideri'dir ve üretim (mamul) maliyetine dahil edilmez, doğrudan gelir tablosunda faaliyet gideri olarak raporlanır.",

    "2025 Yeni, 2025-2026 Büt, 2 Kez Çıktı!|XYZ İşletmesinin bir ticari malına ait stok hareketleri sırasıyla aşağıdaki gibidir: Dönem Başı Mevcudu: 100 Adet (10 TL), 1. Alış: 200 Adet (12 TL), 2. Alış: 150 Adet (15 TL). İşletme bu dönem içinde toplam 250 adet ürün satmıştır. İşletme stok değerlemesinde FIFO (İlk Giren İlk Çıkar) yöntemini kullanıyorsa, 'Satılan Ticari Mallar Maliyeti' kaç TL'dir?|A) 2.800 TL~B) 3.300 TL~C) 3.500 TL~D) 3.000 TL~E) 3.100 TL|A) 2.800 TL|FIFO'ya göre satışlar en eski stoktan başlar. 250 adet satışın 100 adedi Dönem Başı stoktan (100 * 10 = 1.000 TL), kalan 150 adedi 1. Alıştan (150 * 12 = 1.800 TL) karşılanır. Toplam SMM = 1.000 + 1.800 = 2.800 TL.",
