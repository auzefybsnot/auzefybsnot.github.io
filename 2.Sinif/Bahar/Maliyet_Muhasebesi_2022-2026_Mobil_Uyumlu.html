    "2025-2026 Final, 2025-2026 Büt, 2 Kez Çıktı!|ABC Mobilya işletmesi, müşterisi için özel tasarım bir kütüphane dolabı üretmek üzere \"Sipariş No: M-23\"ü açmıştır. Sipariş ile ilgili dönem içinde gerçekleşen maliyetler aşağıdaki gibidir: • Direkt İlk Madde ve Malzeme: 8.000 TL • Direkt İşçilik: 120 saat (saatlik ücret: 50 TL) • Genel Üretim Maliyetleri (GÜM): Yıllık tahmini GÜM 400.000 TL, tahmini direkt işçilik saati ise 5.000 saattir. (GÜM direkt işçilik saatine göre dağıtılmaktadır). Buna göre, sipariş tamamlandığında \"Sipariş No: M-23\"ün toplam maliyeti kaç TL olarak hesaplanır?|A) 18.200 TL~B) 27.400 TL~C) 15.500 TL~D) 23.600 TL~E) 16.400 TL|D) 23.600 TL|1. DİMM Maliyeti: 8.000 TL. 2. DİG Maliyeti: 120 saat * 50 TL = 6.000 TL. 3. GÜM Yükleme Haddi: 400.000 / 5.000 = 80 TL/saat. 4. Siparişe Yüklenen GÜM: 120 saat * 80 TL = 9.600 TL. Toplam Maliyet: 8.000 + 6.000 + 9.600 = 23.600 TL.",

    "2024-2025 Bütünleme, 2025-2026 Büt, 3 Kez Çıktı!|Faaliyet Tabanlı Maliyetleme (FTM) sisteminin temel amacı aşağıdakilerden hangisidir?|A) Geleneksel maliyet hesaplama yöntemlerini ortadan kaldırmak~B) Yalnızca direkt maliyetleri analiz etmek~C) Üretim maliyetlerini azaltmak~D) Ürün maliyetlerini daha doğru bir şekilde hesaplamak~E) Satış fiyatlarını belirlemek|D) Ürün maliyetlerini daha doğru bir şekilde hesaplamak|FTM'nin asıl ortaya çıkış amacı, genel üretim giderlerini çoklu faaliyet havuzları ve anahtarları ile dağıtarak çapraz sübvansiyon hatalarını önlemek ve ürün maliyetlerini gerçeğe en yakın (doğru) şekilde hesaplamaktır.",

    "2024-2025 Bütünleme, 2025-2026 Büt, 2 Kez Çıktı!|Marmara İşletmesi sandalye üretmektedir ve genel üretim maliyetlerini işçilik saatlerini esas alarak ürünlere dağıtmaktadır. İşletme gelecek dönem için 20.000 işçilik saati çalışmayı ve 120.000 TL tutarında genel üretim maliyetine katlanmayı planlamıştır. Dönem içerisinde fiili olarak 18.000 işçilik saati çalışılmıştır. Fiili olarak gerçekleşen genel üretim maliyeti 150.000 TL olmuştur. Dönem içerisinde imalata yüklenen genel üretim maliyeti tutarı aşağıdakilerden hangisidir?|A) 108.000~B) 150.000~C) 120.000~D) 135.000~E) 30.000|A) 108.000|Yükleme Haddi = Bütçelenen GÜM / Bütçelenen Dağıtım Anahtarı = 120.000 / 20.000 = 6 TL/saat. Yüklenen GÜM = Fiili Saat * Yükleme Haddi = 18.000 * 6 = 108.000 TL.",

    "2024 Final, 2024-2025 Bahar Final, 2024-2025 Büt, 2025-2026 Büt, 4 Kez Çıktı!|Haziran ayında Kesme bölümünde 4.600 birim mamul tamamlanarak bir sonraki safhaya transfer edilmiştir. Kesme bölümünde dönem sonu yarı mamul olarak %50 oranında tamamlanmış 1.000 birim kalmıştır. Kesme bölümünde dönem başı yarı mamul bulunmamakta ise Haziran ayı çıktılarının toplam eşdeğer birim sayısı aşağıdakilerden hangisidir?|A) 1.000~B) 500~C) 5.600~D) 5.100~E) 4.600|D) 5.100|Eşdeğer Birim = Tamamlananlar + (Dönem Sonu * Yüzde) = 4.600 + (1.000 * 0,50) = 5.100 birim.",

    "2024-2025 Bahar Final, 2025-2026 Final, 2025-2026 Büt, 4 Kez Çıktı!|Bir işletme A ve B olmak üzere iki ürün üretmektedir. Üretilen birim adedi: A(1.500), B(1.500). Kalıp değiştirme sayısı: A(75), B(25). Yukarıda genel üretim maliyetinin bir parçası olan makine kalıplarının değiştirilmesi maliyetine (120.000 TL) ilişkin veriler sunulmuştur. Faaliyet tabanlı maliyetleme sistemi uygulandığında her bir birime dağıtılacak genel üretim maliyeti (TL) sırasıyla (A ve B) aşağıdakilerden hangisidir?|A) 40, 40~B) 30, 10~C) 60, 20~D) 20, 60~E) 10, 30|C) 60, 20|Toplam Kalıp Değiştirme Sayısı = 75 + 25 = 100. Değiştirme Başına Maliyet = 120.000 / 100 = 1.200 TL. A'nın Toplam Payı = 75 * 1.200 = 90.000 TL -> Birim Payı = 90.000 / 1.500 adet = 60 TL. B'nin Toplam Payı = 25 * 1.200 = 30.000 TL -> Birim Payı = 30.000 / 1.500 adet = 20 TL.",

    "2024 Final, 2024-2025 Bahar Final, 2024-2025 Büt, 2025-2026 Büt, 5 Kez Çıktı!|Bir işletme, iki farklı ürün üretmektedir: Ürün A ve Ürün B. (Sipariş İşleme Havuzu: 60.000 TL / 120 Sipariş | Makine Ayarı Havuzu: 40.000 TL / 80 Ayar) Ürün A: 30 sipariş, 20 ayar. Ürün B: 90 sipariş, 60 ayar. Buna göre, Ürün A'ya yüklenmesi gereken toplam faaliyet maliyeti kaç TL'dir?|A) 35.000 TL~B) 20.000 TL~C) 25.000 TL~D) 30.000 TL~E) 15.000 TL|C) 25.000 TL|Sipariş Haddi: 60.000 / 120 = 500 TL/sipariş. Ayar Haddi: 40.000 / 80 = 500 TL/ayar. Ürün A Sipariş Yükü: 30 sipariş * 500 TL = 15.000 TL. Ürün A Ayar Yükü: 20 ayar * 500 TL = 10.000 TL. Toplam: 15.000 + 10.000 = 25.000 TL.",

];
// Tüm soruları rawData içinden alıp ekrana basan ana fonksiyon
    const container = document.getElementById('q-container');
    let allAnswersVisible = false;

    function renderQuestions(dataArray) {
        container.innerHTML = ''; // Önce ekranı temizle
        dataArray.forEach((item, index) => {
            if (!item || item.trim() === '') return;
            // Yeni ve Kurşun Geçirmez Ayrıştırıcı
    const parts = item.split('|');
    
    // Şıkların olduğu kısmı bul (içinde ~ işareti olan yegane kısım şıklardır)
    let optionsIndex = parts.findIndex(p => p.includes('~'));
    if(optionsIndex === -1) return; // Şık yoksa (veya format hatalıysa) atla
    
    const tagsRaw = parts[0];
    
    // Soru metninin içinde fazladan | varsa onları parçalanmadan tek metin olarak birleştir
    const question = parts.slice(1, optionsIndex).join(', ');
    
    const options = parts[optionsIndex].split('~'); // Şıkları böl
    const correctAnswer = parts[optionsIndex + 1];
    
    // Açıklamanın içinde de | varsa onları da birleştir
    const explanation = parts.slice(optionsIndex + 2).join(', ');

            // Etiketleri (Tag) renklendir
            const tagsList = tagsRaw.split(',').map(t => t.trim());
            let tagsHTML = '';
            tagsList.forEach(t => {
                let tagClass = 'tag-u'; // Mavi (Standart)
                if(t.toLowerCase().includes('banko')) tagClass = 'tag-h'; // Kırmızı (Banko)
                else if(t.toLowerCase().includes('vize') || t.toLowerCase().includes('final') || t.toLowerCase().includes('büt') || t.toLowerCase().includes('td')) tagClass = 'tag-e'; // Lacivert (Sınav)
                tagsHTML += `<span class="tag ${tagClass}">${t}</span>`;
            });

            // Şıkları HTML'e çevir
            let optionsHTML = '';
            options.forEach(opt => {
                optionsHTML += `<li onclick="this.style.borderColor='var(--suc)'; this.style.backgroundColor='#eafaf1'; this.style.fontWeight='bold';">${opt}</li>`;
            });

            // Soru kartını oluştur
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-tags', tagsRaw.toLowerCase());
            card.setAttribute('data-text', item.toLowerCase()); // Arama motoru için gizli metin
            
            card.innerHTML = `
                <div class="tags">${tagsHTML}</div>
                <div class="q-text">${index + 1}. ${question}</div>
                <ul class="opt">${optionsHTML}</ul>
                <button class="ans-btn" onclick="toggleAnswer(this)">Cevabı Göster</button>
                <div class="ans-box">
                    <div class="ans-true">✅ ${correctAnswer}</div>
                    ${explanation ? `<div style="margin-top:8px; font-size:0.9em; color:#555;">💡 <b>Açıklama:</b> ${explanation}</div>` : ''}
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Tekil Cevap Aç/Kapat Butonu
    function toggleAnswer(btn) {
        const box = btn.nextElementSibling;
        if (box.style.display === 'block') {
            box.style.display = 'none';
            btn.innerText = 'Cevabı Göster';
            btn.style.background = 'var(--s)';
        } else {
            box.style.display = 'block';
            btn.innerText = 'Cevabı Gizle';
            btn.style.background = '#7f8c8d';
        }
    }

  function toggleAll() {
    const boxes = document.querySelectorAll('.ans-box');
    boxes.forEach(box => {
        box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    });
}

    // Üst Menü - Kategori Seçici Filtresi
    function filter(val) {
        const aramaKutusu = document.getElementById('arama').value.toLowerCase();
        filtreleVeAra(val.toLowerCase(), aramaKutusu);
    }

    // Üst Menü - Metin Arama Motoru
    function aramaYap() {
        const kategori = document.getElementById('kategori-secici').value.toLowerCase();
        const metin = document.getElementById('arama').value.toLowerCase();
        filtreleVeAra(kategori, metin);
    }

    // Arama ve Filtrelemenin Ortak Çalıştığı Yer
    function filtreleVeAra(kategori, metin) {
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            const tags = card.getAttribute('data-tags');
            const text = card.getAttribute('data-text');
            
            // Kategori kontrolü
            let kategoriUygun = false;
            if (kategori === 'all') {
                kategoriUygun = true;
            } else if (kategori === 'b') { // Banko butonu için özel durum
                kategoriUygun = tags.includes('banko');
            } else {
                kategoriUygun = tags.includes(kategori);
            }
            
            // Metin arama kontrolü
            let metinUygun = text.includes(metin);
            
            // İkisi de uyuyorsa göster, uymuyorsa gizle
            if (kategoriUygun && metinUygun) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    // Sayfa açılır açılmaz soruları yükle
    window.onload = () => {
        renderQuestions(rawData);
    };
</script>

<script>
// AUZEF GÖRÜNÜM & CİHAZ PROFİLİ YÖNETİCİSİ
function setAuzefDeviceProfile(dev) {
    if (dev === 'auto') {
        const w = window.innerWidth;
        dev = (w <= 640) ? 'mobile' : 'web';
    }
    document.documentElement.setAttribute('data-device', dev);
    try { localStorage.setItem('auzef_device_profile', dev); } catch(e){}
    const sel = document.getElementById('deviceProfileSelect');
    if (sel && sel.value !== dev && sel.value !== 'auto') sel.value = dev;
}

function toggleAuzefTheme() {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('auzef_theme', cur); } catch(e){}
    const btn = document.getElementById('auzefThemeToggleBtn');
    if (btn) btn.textContent = cur === 'dark' ? '☀️ Açık' : '🌙 Koyu';
}

(function initAuzefViewMode() {
    try {
        const savedDev = localStorage.getItem('auzef_device_profile') || 'auto';
        setAuzefDeviceProfile(savedDev);
        const sel = document.getElementById('deviceProfileSelect');
        if (sel) sel.value = savedDev;

        const savedTheme = localStorage.getItem('auzef_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        const btn = document.getElementById('auzefThemeToggleBtn');
        if (btn) btn.textContent = savedTheme === 'dark' ? '☀️ Açık' : '🌙 Koyu';
    } catch(e){}
})();
</script>
