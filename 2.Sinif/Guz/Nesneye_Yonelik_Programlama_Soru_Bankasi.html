<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUZEF Nesneye Yönelik Programlama </title>
    <style>
        :root { 
            --p: #1a2b4c; --s: #2c3e50; --a: #f39c12; --suc: #27ae60; 
            --bg: #f4f6f8; --c: #ffffff; --t: #2d3436; --b: #dfe6e9; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 1050px; margin: 0 auto; }
        
        .sticky-top {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 1000;
            padding-top: 15px;
            padding-bottom: 15px;
        }

        .header { background: linear-gradient(135deg, var(--p), var(--s)); color: white; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--a); margin-bottom: 15px; }
        .header h1 { margin: 5px 0; font-size: 1.5em; }
        .header p { margin: 0; font-size: 0.9em; }
        
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: var(--bg); padding: 5px; border-radius: 10px; }
        
        .btn { background: #ecf0f1; color: var(--p); border: 2px solid var(--b); padding: 8px 12px; font-size: 0.95em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; box-sizing: border-box; }
        .btn:hover { background: #bdc3c7; }
        .btn.active { background: var(--a); color: white; border-color: var(--a); }
        .btn-g { background: #d35400; color: white; }
        
        .card { background: var(--c); border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--p); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .tag-u { background: #3498db; } .tag-e { background: var(--p); } .tag-h { background: #e74c3c; }
        .q-text { font-size: 1.1em; font-weight: bold; color: var(--p); margin-bottom: 15px; }
        .opt { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .opt li { background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid var(--b); margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .opt li:hover { background: #eafaf1; border-color: var(--suc); }
        .ans-btn { background: var(--s); color: white; border: none; padding: 8px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .ans-box { display: none; margin-top: 15px; padding: 15px; background: #eafaf1; border-left: 4px solid var(--suc); border-radius: 6px; }
        .ans-true { color: var(--suc); font-weight: bold; margin-bottom: 5px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .sticky-top { position: relative; padding-top: 5px; padding-bottom: 5px; }
            .header { padding: 10px; margin-bottom: 10px; }
            .header h1 { font-size: 1.2em; }
            .header p { font-size: 0.8em; } 
            .controls { gap: 6px; padding: 0; }
            .btn { padding: 10px; font-size: 0.85em; width: 100%; margin: 0; }
            #kategori-secici, #arama { width: 100%; min-width: 100%; }
            .card { padding: 15px; }
            .q-text { font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="sticky-top">
        <div class="header">
            <h1>AUZEF Nesneye Yönelik Programlama</h1>
            <p>YBS OZEL (Tüm Sorular )</p>
        </div>

        <div class="controls">
            <button class="btn btn-g" onclick="toggleAll()">👁️ Tüm Cevapları Aç/Kapat</button>

            <select class="btn" id="kategori-secici" onchange="filter(this.value)" style="background: var(--p); color: white; min-width: 180px; text-align: center; font-weight:bold; padding:8px; border-radius:6px; cursor:pointer;">
                <option value="all">📚 Tüm Havuz (Hepsi)</option>
                <optgroup label="Sınavlar">
                     <option value="vize">📅 Vizeler (Tümü)</option>
                     <option value="final">📅 Finaller (Tümü)</option>
                     <option value="büt">📅 Bütünlemeler</option>
                     
                </optgroup>
            </select>

            <button class="btn" style="background: #e74c3c; color:white;" onclick="document.getElementById('kategori-secici').value='b'; filter('b')">🔥 Banko Sorular</button>

            <input type="text" id="arama" class="btn" placeholder="🔍 Soru veya cevapta kelime ara..." onkeyup="aramaYap()" style="background: white; color: black; cursor: text; text-align: left; min-width: 250px;">
        </div>
    </div>
    
    <div id="q-container"></div>

</div>

<script>
const rawData = [
    `2022 Vize|Aşağıdakilerden hangisi nesneye yönelik bir programlama dili değildir?|A) Objective-C~B) C++~C) C#~D) C~E) Java|D) C|C dili nesneye yönelik değil, prosedürel bir dildir.`,

    `2022 Vize|C# programlama dili için türetilen bir sınıfın temel sınıfına erişirken hangi anahtar kelimeyi kullanır?|A) super~B) base~C) self~D) new~E) this|B) base|Cevap anahtarı B şıkkıdır. Metindeki okuma hatası "case" düzeltilerek "base" yapılmıştır.`,
    
    `2022 Vize|int[,] degisken = new int[3, 2]; Yukarıda verilen değişken için aşağıdaki ifadelerden hangisi doğrudur?|A) Çift boyutlu bir dizidir.~B) Boyutu dinamik olarak değişebilir.~C) Koleksiyon türünde bir değişkendir.~D) Tek boyutlu bir dizidir.~E) Ondalıklı değerler tutmaktadır.|A) Çift boyutlu bir dizidir.|Kullanılan virgül (,) operatörü matris tipi çift boyutlu bir diziyi temsil eder.`,
    
    `2022 Vize|C# programlama dilinde aşağıda verilen ifadelerden hangisi döngü işlemi gerçekleştirmek için kullanılmaz?|A) foreach~B) while~C) do while~D) for~E) switch|E) switch|Switch bir döngü değil, kontrol/karar yapısıdır.`,
    
    `2022 Vize|C# programlama dilinde yer alan "Yapı (Struct) Kavramı" için aşağıda verilen ifadelerden hangisi yanlıştır?|A) Yapıcı (constructor) tanımlanabilir.~B) Metot tanımlanabilir.~C) Nesne türetilebilir.~D) Değer türündedirler.~E) Yıkıcı (destructor) tanımlanabilir.|E) Yıkıcı (destructor) tanımlanabilir.|Struct (Yapı) veri tiplerinde yıkıcı (destructor) tanımlanamaz, bu sınıflara (class) özgü bir özelliktir.`,
    
    `2022 Vize|.Net Core platformu için kullanılan çapraz platform (cross platform) ifadesi hangi anlama gelmektedir?|A) Birden fazla platformu destekler.~B) Linux işletim sistemini desteklemez.~C) Sadece macOS işletim sisteminde çalışır.~D) Kodlar kendi içinde çaprazlanır.~E) Sadece Windows işletim sisteminde çalışır.|A) Birden fazla platformu destekler.|Çapraz platform, Windows, Linux ve macOS gibi birden fazla platformda çalışabilme özelliğidir.`,
    
    `2022 Vize|Aşağıdaki verilenlerden hangisi nesneye yönelik programlamanın sağladığı faydalardan biri değildir?|A) Modülerlik~B) Tekrar kullanılabilirlik~C) Kendini tekrar etme~D) Bilgi saklama~E) Kolaylık|C) Kendini tekrar etme|Nesneye yönelik programlama kendini tekrar etmeyi (WET) önlemeyi amaçlar (DRY prensibi).`,
    
    `2022 Vize|C# programlama dilinde aşağıdaki verilen veri türlerinden hangisi referans türündedir?|A) int~B) float~C) string~D) short~E) double|C) string|String (metin) bir referans türüdür. (Metindeki eksik şıklar tamamlanmıştır)`,
    
    `2022 Vize|C# programlama dilinde verilen bir dizi hazır kütüphane kullanarak dizinin sırası tersine çevirmek istenirse Array sınıfı içerisindeki hangi metot kullanılır?|A) Reverse~B) Sort~C) Find~D) IndexOf~E) FindAll|A) Reverse|Reverse metodu diziyi tersine çevirir.`,

    `2022 Vize|I - Microsoft tarafından geliştirilmektedir. II - Nesneye yöneliktir. III - İlk versiyonu 2002 yılında yayınlanmıştır. Yukarıda özellikleri verilen programlama dili hangisidir?|A) Java~B) C~C) C#~D) Fortran~E) Python|C) C#|Sayılan özellikler C# diline aittir.`,

   // --- BURADAN İTİBAREN KOPYALAYIN ---
    let isAllOpen = false;
    let temizlenmisData = []; // Birleştirilmiş verileri global tutalım ki arama/filtreleme yapabilelim

    // 1. SORULARI BİRLEŞTİREN FONKSİYON
    function sorulariBirlestir(dataArray) {
        const soruMap = new Map();

        dataArray.forEach(item => {
            if (!item || item.trim() === '') return;
            
            const parts = item.split('|');
            if (parts.length < 4) return; 
            
            let tagsRaw = parts[0];
            const question = parts[1].trim(); 
            const options = parts[2];
            const correctAnswer = parts[3];
            const explanation = parts[4] ? parts[4] : '';

            let tagsList = tagsRaw.split(',').map(t => t.trim());
            let mevcutSayi = 1;

            tagsList = tagsList.filter(t => {
                const match = t.match(/(\d+)\s*Kez Çıktı/i);
                if (match) {
                    mevcutSayi = parseInt(match[1]);
                    return false; 
                }
                return true;
            });

            if (soruMap.has(question)) {
                let kayit = soruMap.get(question);
                kayit.count += mevcutSayi; 
                
                tagsList.forEach(t => {
                    if (!kayit.tags.includes(t)) {
                        kayit.tags.push(t);
                    }
                });
            } else {
                soruMap.set(question, {
                    tags: tagsList,
                    options: options,
                    correctAnswer: correctAnswer,
                    explanation: explanation,
                    count: mevcutSayi
                });
            }
        });

        const birlestirilmisData = [];
        for (let [qText, data] of soruMap.entries()) {
            let finalTags = [...data.tags];
            if (data.count > 1) {
                finalTags.push(`${data.count} Kez Çıktı!`);
            }
            
            const itemString = `${finalTags.join(',')}|${qText}|${data.options}|${data.correctAnswer}|${data.explanation}`;
            birlestirilmisData.push(itemString);
        }

        return birlestirilmisData;
    }

   // 2. EKRANA BASTIRMA FONKSİYONU (Renklendirme Geliştirilmiş Versiyon)
    function renderQuestions(data) {
        const container = document.getElementById('q-container');
        container.innerHTML = '';
        
        if(data.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Kriterlerinize uygun soru bulunamadı.</p>';
            return;
        }

        data.forEach((item, index) => {
            const parts = item.split('|');
            const tagsRaw = parts[0];
            const question = parts[1];
            const options = parts[2].split('~');
            const correctAnswer = parts[3];
            const explanation = parts[4] || '';

            const card = document.createElement('div');
            card.className = 'card';

            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'tags';
            
            tagsRaw.split(',').forEach(tag => {
                tag = tag.trim();
                if(!tag) return;
                const span = document.createElement('span');
                span.className = 'tag';
                
                let lowerTag = tag.toLowerCase();
                if(lowerTag.includes('ünite') || lowerTag.match(/^u\d+/)) {
                    span.classList.add('tag-u');
                } else if(lowerTag.includes('banko') || lowerTag.includes('kez çıktı')) {
                    span.classList.add('tag-h');
                } else {
                    span.classList.add('tag-e');
                }
                
                span.textContent = tag;
                tagsDiv.appendChild(span);
            });

            const qDiv = document.createElement('div');
            qDiv.className = 'q-text';
            qDiv.textContent = (index + 1) + ". " + question;

            const optUl = document.createElement('ul');
            optUl.className = 'opt';
            
            options.forEach(opt => {
                const li = document.createElement('li');
                li.textContent = opt;
                li.onclick = function() {
                    // Önce bu sorudaki tüm şıkları varsayılan (gri) haline getirerek sıfırla
                    Array.from(optUl.children).forEach(child => {
                        child.style.backgroundColor = '#f8f9fa';
                        child.style.borderColor = 'var(--b)';
                        child.style.color = 'var(--t)';
                        child.style.fontWeight = 'normal';
                    });
                    
                    // Cevap kontrolü
                    if(opt.trim() === correctAnswer.trim()) {
                        // DOĞRU ŞIKKA TIKLANDIYSA: Canlı Yeşil Yap
                        this.style.backgroundColor = '#d4edda';
                        this.style.borderColor = '#28a745';
                        this.style.color = '#155724';
                        this.style.fontWeight = 'bold';
                    } else {
                        // YANLIŞ ŞIKKA TIKLANDIYSA: Canlı Kırmızı Yap
                        this.style.backgroundColor = '#f8d7da';
                        this.style.borderColor = '#dc3545';
                        this.style.color = '#721c24';
                        this.style.fontWeight = 'bold';
                        
                        // KULLANICIYA YARDIM: Aynı esnada doğru olan şıkkı da otomatik yeşile boya
                        Array.from(optUl.children).forEach(child => {
                            if(child.textContent.trim() === correctAnswer.trim()) {
                                child.style.backgroundColor = '#d4edda';
                                child.style.borderColor = '#28a745';
                                child.style.color = '#155724';
                                child.style.fontWeight = 'bold';
                            }
                        });
                    }
                };
                optUl.appendChild(li);
            });

            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster';
            
            const ansBox = document.createElement('div');
            ansBox.className = 'ans-box';
            ansBox.style.display = isAllOpen ? 'block' : 'none';
            ansBox.innerHTML = `<div class="ans-true">Cevap: ${correctAnswer}</div>${explanation ? `<div><em>Açıklama:</em> ${explanation}</div>` : ''}`;

            btn.onclick = () => {
                if (ansBox.style.display === 'block') {
                    ansBox.style.display = 'none';
                    btn.textContent = 'Cevabı Göster';
                } else {
                    ansBox.style.display = 'block';
                    btn.textContent = 'Cevabı Gizle';
                }
            };

            card.appendChild(tagsDiv);
            card.appendChild(qDiv);
            card.appendChild(optUl);
            card.appendChild(btn);
            card.appendChild(ansBox);

            container.appendChild(card);
        });
    }

    // 3. BUTON VE ARAMA FONKSİYONLARI
    function toggleAll() {
        isAllOpen = !isAllOpen;
        const boxes = document.querySelectorAll('.ans-box');
        const btns = document.querySelectorAll('.ans-btn');
        boxes.forEach(box => box.style.display = isAllOpen ? 'block' : 'none');
        btns.forEach(btn => btn.textContent = isAllOpen ? 'Cevabı Gizle' : 'Cevabı Göster');
    }

    function filter(val) {
        val = val.toLowerCase();
        if (val === 'all') {
            renderQuestions(temizlenmisData);
            return;
        }
        
        let filtered = [];
        if (val === 'b') {
            // Banko ve çok çıkanlar
            filtered = temizlenmisData.filter(item => {
                let lower = item.toLowerCase();
                return lower.includes('banko') || lower.includes('kez çıktı');
            });
        } else {
            // Sınavlar ve üniteler
            filtered = temizlenmisData.filter(item => {
                const tags = item.split('|')[0].toLowerCase();
                return tags.includes(val);
            });
        }
        renderQuestions(filtered);
    }

    function aramaYap() {
        const val = document.getElementById('arama').value.toLowerCase();
        const filtered = temizlenmisData.filter(item => {
            const parts = item.toLowerCase().split('|');
            const q = parts[1] || '';
            const a = parts[3] || '';
            const exp = parts[4] || '';
            return q.includes(val) || a.includes(val) || exp.includes(val);
        });
        renderQuestions(filtered);
    }
